    content_sha256: 453957016f0e715c475f75d79bba6d817cbf9535d49a89c2df9351e12cd67220
    original_created_at: null
    original_updated_at: null
  - position: 12
    source_id: null
    text: |-
      @Onigiri Past tense refers to a specific occasion (of a future visite in this example).

      来る際に → when coming (general situation / timing)
      来た際に → when you come / when you happen to come (a specific occasion)
