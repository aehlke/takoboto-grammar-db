    text: "Hey Dr Dave バラ　is the word for rose。　the kanji after it is the kanji for いろ or color. the kanji that duplicates the first sound as in \n”いろいろ”　is 々. 　色々 or 時々　or 様々.\nbut バラバラ is a 擬音　or sound effect thats used to represent a word an action etc...\n\nother good examples are.\nどきどき　＝　緊張する\nむしむし　＝　hot and humid\nチンする　＝　Eating a microwave dinner\nワワする　＝　込んでいる　or 煩いところ\nさらさら　＝　rustling; murmuring; fluently\nパンパン　＝　腫れている､Swollen\nふわふわ　＝　I am not sure exactly what this means, but 変態な意味かも so be careful using it\nフーア　＝　急にとか､驚いたとか\n\nI know there are more, but thats all I can think of now. \n\nIf you want to sound natural when speaking japanese. By all means learn the 擬音"
    html: |-
      Hey Dr Dave バラ　is the word for rose。　the kanji after it is the kanji for いろ or color. the kanji that duplicates the first sound as in <br/>”いろいろ”　is 々. 　色々 or 時々　or 様々.<br/>but バラバラ is a 擬音　or sound effect thats used to represent a word an action etc...<br/><br/>other good examples are.<br/>どきどき　＝　緊張する<br/>むしむし　＝　hot and humid<br/>チンする　＝　Eating a microwave dinner<br/>ワワする　＝　込んでいる　or 煩いところ<br/>さらさら　＝　rustling; murmuring; fluently<br/>パンパン　＝　腫れている､Swollen<br/>ふわふわ　＝　I am not sure exactly what this means, but 変態な意味かも so be careful using it<br/>フーア　＝　急にとか､驚いたとか<br/><br/>I know there are more, but thats all I can think of now. <br/><br/>If you want to sound natural when speaking japanese. By all means learn the 擬音
    credits_raw: tigert
    content_sha256: 7554018dd5f1afc4484a66776ef40e74247ad4afecdaafa31785d88fa8e90ca9
