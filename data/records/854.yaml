  - position: 2
    source_id: null
    text: "-らしい and -ようだ have different meanings. \n\nYou use -らしい as a similie when something is like something else, but is expected to be like that; for example：\n\n'that man doesn't act like a woman'　\nその男女らしくしていない\n\n-ようだ is used to make a similie with a condition we don't expect the thing to be like. For example \n'That human being acts like a cat'\nあの人間は猫のようにしている\n\nIf you mean to describe how something seems to be, they differ again, as -らしい is used to make an assumption based on what you've heard (usually from other people) and -ようだ is is used to make assumptions based on what you observe or from what you gather from first hand information.\n\nhope that helps clear things up a little :)"
    html: |-
      -らしい and -ようだ have different meanings. <br/><br/>You use -らしい as a similie when something is like something else, but is expected to be like that; for example：<br/><br/>'that man doesn't act like a woman'　<br/>その男女らしくしていない<br/><br/>-ようだ is used to make a similie with a condition we don't expect the thing to be like. For example <br/>'That human being acts like a cat'<br/>あの人間は猫のようにしている<br/><br/>If you mean to describe how something seems to be, they differ again, as -らしい is used to make an assumption based on what you've heard (usually from other people) and -ようだ is is used to make assumptions based on what you observe or from what you gather from first hand information.<br/><br/>hope that helps clear things up a little :)
    credits_raw: nathy1985
