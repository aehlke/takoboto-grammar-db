comments:
  - position: 0
    source_id: null
    text: |-
      到底(toutei) itself means "possibly", but grammatically it is usually used with a negative:
      　到底そうとは思えない。
      　I really doubt it.

      this is a little similar to [shika]'s way of use
       英語しか話せない
    html: |-
      到底(toutei) itself means "possibly", but grammatically it is usually used with a negative:<br/>　到底そうとは思えない。<br/>　I really doubt it.<br/><br/>this is a little similar to [shika]'s way of use<br/> 英語しか話せない
    credits_raw: dc
