    text: |-
      I agree with srobertson on his explanation on 〜ばこそ which having the preceding condition the 'only' reason for a certain action or attitude which usually the action taken is quite overwhelming.
      〜からこそ　has a more different usage where the reason is very unexpectedly opposing to the action taken. Here is the explanation from the book:
      単純な理由ではないぶんで、よく使われる。「〜からこそ」は、次のような単純な理由を表す文に使うと不自然です。
      E.g. : A : なぜ遅刻したんですか。
      　　Ｘ B : 電車が遅れたからこそ遅刻したんです。
      Instead,
      E.g. : 愛しているからこそ別れる、ということもあ　
      　　　　る。
      　　　There is such a thing that 'It is because of love that is why both separate from each other' Sorry, can't translate better.
      E.g. : あの先生は、学生に大人気です。優しいからじゃなくて、厳しいからこそ、好かれろのだ。
    html: |-
      I agree with srobertson on his explanation on 〜ばこそ which having the preceding condition the 'only' reason for a certain action or attitude which usually the action taken is quite overwhelming.<br/>〜からこそ　has a more different usage where the reason is very unexpectedly opposing to the action taken. Here is the explanation from the book:<br/>単純な理由ではないぶんで、よく使われる。「〜からこそ」は、次のような単純な理由を表す文に使うと不自然です。<br/>E.g. : A : なぜ遅刻したんですか。<br/>　　Ｘ B : 電車が遅れたからこそ遅刻したんです。<br/>Instead,<br/>E.g. : 愛しているからこそ別れる、ということもあ　<br/>　　　　る。<br/>　　　There is such a thing that 'It is because of love that is why both separate from each other' Sorry, can't translate better.<br/>E.g. : あの先生は、学生に大人気です。優しいからじゃなくて、厳しいからこそ、好かれろのだ。
