    japanese: エア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練あればこそでした。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e3%82%a8%e3%82%a2"><span>エア</span></a><a href="https://takoboto.jp/?q=%e5%88%87%e3%82%8c%e3%81%a7"><span>切れで</span></a><a href="https://takoboto.jp/?q=%ef%bc%92%ef%bc%90%e3%83%a1%e3%83%bc%e3%83%88%e3%83%ab%e3%81%ae"><span>２０メートルの</span></a><a href="https://takoboto.jp/?q=%e6%b7%b1%e5%ba%a6%e3%81%8b%e3%82%89%e3%82%a8%e3%82%a2%e3%82%a8%e3%83%b3%e3%83%9c%e3%81%ab%e3%82%82%e3%81%8b%e3%81%8b%e3%82%89%e3%81%9a"><span>深度からエアエンボにもかからず</span></a><a href="https://takoboto.jp/?q=%e6%b5%ae%e4%b8%8a%e3%81%a7%e3%81%8d%e3%81%9f%e3%81%ae%e3%82%82%e3%80%81"><span>浮上できたのも、</span></a><a href="https://takoboto.jp/?q=%e6%97%a5%e9%a0%83%e3%81%ae"><span>日頃の</span></a><a href="https://takoboto.jp/?q=%e8%a8%93%e7%b7%b4"><span>訓練</span></a><a href="https://takoboto.jp/?q=%e3%81%82%e3%82%8c%e3%81%b0%e3%81%93%e3%81%9d"><strong>あればこそ</strong></a><a href="https://takoboto.jp/?q=%e3%81%a7%e3%81%97%e3%81%9f%e3%80%82"><span>でした。</span></a>
    segments:
      - text: エア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練
        grammar_highlight: false
      - text: あればこそ
        grammar_highlight: true
      - text: でした。
        grammar_highlight: false
    reading: エアぎれで２０メートルのしんどからにもかからずふじょうできたのも、ひごろのくんれんあればこそでした。
    credits_raw: bamboo4
    translations:
      - language: en
        text: |-
          The fact that I could surface from the depth of 20 meters after running out of air without suffering air embolism could only be attributed to the constant training I went through.
        html: |-
          <span>The fact that I could surface from the depth of 20 meters after running out of air without suffering air embolism </span><strong>could only be attributed to </strong><span>the constant training I went through. </span>
        segments:
          - text: 'The fact that I could surface from the depth of 20 meters after running out of air without suffering air embolism '
            grammar_highlight: false
          - text: 'could only be attributed to '
            grammar_highlight: true
          - text: 'the constant training I went through. '
            grammar_highlight: false
    original_created_at: null
    original_updated_at: null
  - source_id: 4755
    position: 2
    japanese: 私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことがあればこそだ。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e7%a7%81%e3%81%ab%e3%81%af%e3%81%9d%e3%81%ae"><span>私にはその</span></a><a href="https://takoboto.jp/?q=%e4%bb%95%e4%ba%8b%e3%81%8c%e3%82%84%e3%81%95%e3%81%97%e3%81%84%e3%81%a8%e3%82%8f%e3%81%8b%e3%81%a3%e3%81%9f%e3%80%82"><span>仕事がやさしいとわかった。</span></a><a href="https://takoboto.jp/?q=%e5%89%8d%e3%81%ab%e3%82%82%e3%81%9d%e3%82%93%e3%81%aa"><span>前にもそんな</span></a><a href="https://takoboto.jp/?q=%e4%bb%95%e4%ba%8b%e3%82%92"><span>仕事を</span></a><a href="https://takoboto.jp/?q=%e3%81%97%e3%81%9f%e3%81%93%e3%81%a8%e3%81%8c"><span>したことが</span></a><a href="https://takoboto.jp/?q=%e3%81%82%e3%82%8c%e3%81%b0%e3%81%93%e3%81%9d"><strong>あればこそ</strong></a><a href="https://takoboto.jp/?q=%e3%81%a0%e3%80%82"><span>だ。</span></a>
    segments:
      - text: 私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことが
        grammar_highlight: false
      - text: あればこそ
        grammar_highlight: true
      - text: だ。
        grammar_highlight: false
    reading: わたしにはそのしごとがやさしいとわかった。まえにもそんなしごとをしたことがあればこそだ。
    credits_raw: Miki
    translations:
      - language: en
        text: I found the work easy, especially since I had done that kind of work before.
        html: |-
          <span>I found the work easy, </span><strong>especially since </strong><span>I had done that kind of work before. </span>
        segments:
