    segments:
      - text: 皆様の協力が
        grammar_highlight: false
      - text: あればこそ
        grammar_highlight: true
      - text: 無事故で完工できたことを感謝しております。
        grammar_highlight: false
    reading: みなさまのきょうりょくがあればこそむじこでかんこうできたことをかんしゃしております。
    credits_raw: Amatuka
