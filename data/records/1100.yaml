comments:
  - position: 0
    source_id: null
    text: |-
      The [-tari] form is used when a sequence of verbs occur in a row. The last one cannot be a tari, it needs to conclude the sentence.

      normal:
      　食べたり、飲んだり、のんびりしました。
      　Eating and drinking, I relaxed.

      neg:
      　読まなかったり、行きたくなかったり、何もしなかったり、悪い人でした。
      　not reading, not going, not doing anything, he was a bad guy.

      with adjectives:
      　サービスは良かったり、値段安かったり、、いいんじゃない？
      　good service, low prices... alright eh?

      neg with adjectives:
      　サービスが悪かったり、値段が高くなかったり、、、
       the service is not bad, the prices aren't high...
    html: |-
      The [-tari] form is used when a sequence of verbs occur in a row. The last one cannot be a tari, it needs to conclude the sentence.<br/><br/>normal:<br/>　食べたり、飲んだり、のんびりしました。<br/>　Eating and drinking, I relaxed.<br/><br/>neg:<br/>　読まなかったり、行きたくなかったり、何もしなかったり、悪い人でした。<br/>　not reading, not going, not doing anything, he was a bad guy.<br/><br/>with adjectives:<br/>　サービスは良かったり、値段安かったり、、いいんじゃない？<br/>　good service, low prices... alright eh?<br/><br/>neg with adjectives:<br/>　サービスが悪かったり、値段が高くなかったり、、、<br/> the service is not bad, the prices aren't high...
    credits_raw: dc
    content_sha256: 29dc9e5d40e5a405c29c3002c823a10eccf0c3e54850e29ba21c0f9e6052225c
    original_created_at: null
