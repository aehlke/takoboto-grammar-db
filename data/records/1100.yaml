    text: |-
      I changed this grammar note a little. [tari suru]
      form means "doing things like". the Verb takes the plain past tense form IE 食べる become 食べた and then you add the り
      買う will become 買った　then you add the り,etc...

      きのう、私は テレビを見たり、ゲームをしたり しました。
    html: |-
      I changed this grammar note a little. [tari suru]<br/>form means "doing things like". the Verb takes the plain past tense form IE 食べる become 食べた and then you add the り<br/>買う will become 買った　then you add the り,etc...<br/><br/>きのう、私は テレビを見たり、ゲームをしたり しました。
    credits_raw: tigert
