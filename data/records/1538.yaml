comments:
  - position: 0
    source_id: null
    text: |-
      It is considered impolite to ask someone else if the "want" to do something. Instead, use the negative form of the verb in a question.
    html: |-
      It is considered impolite to ask someone else if the "want" to do something. Instead, use the negative form of the verb in a question.
    credits_raw: eriustobin
    content_sha256: 265d5279d8f4e79f67d5e3ae4d0aa28928307ab03ce4ea4c4254a82c754b2066
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      Very important: "tai" can only be used for the I person, like "i want". 
      If you want to say that someone else wants, you use "tagaru". 
      Ex:かれは牛乳を飲みたがっています。
      This is because Japanese never imply they know what someone else wishes, and "garu" means: "i think that", "i heard that", etc.
    html: |-
      Very important: "tai" can only be used for the I person, like "i want". <br/>If you want to say that someone else wants, you use "tagaru". <br/>Ex:かれは牛乳を飲みたがっています。<br/>This is because Japanese never imply they know what someone else wishes, and "garu" means: "i think that", "i heard that", etc.
    credits_raw: kuro_hannah
