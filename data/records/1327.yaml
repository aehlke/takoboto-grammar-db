  - source_id: 5146
    position: 3
    japanese: かれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者にして初めてできることであろう。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e3%81%8b%e3%82%8c%e3%81%af%e3%83%8e%e3%83%bc%e3%83%99%e3%83%ab"><span>かれはノーベル</span></a><a href="https://takoboto.jp/?q=%e8%b3%9e%e3%81%ab"><span>賞に</span></a><a href="https://takoboto.jp/?q=%e5%80%a4%e3%81%99%e3%82%8b"><span>値する</span></a><a href="https://takoboto.jp/?q=%e7%a0%94%e7%a9%b6%e3%82%92"><span>研究を</span></a><a href="https://takoboto.jp/?q=%e6%88%90%e3%81%97"><span>成し</span></a><a href="https://takoboto.jp/?q=%e9%81%82%e3%81%92%e3%81%9f%e3%80%82%e3%81%93%e3%82%8c%e3%81%af%e3%80%81"><span>遂げた。これは、</span></a><a href="https://takoboto.jp/?q=%e5%81%89%e5%a4%a7%e3%81%aa"><span>偉大な</span></a><a href="https://takoboto.jp/?q=%e7%a7%91%e5%ad%a6%e8%80%85"><span>科学者</span></a><a href="https://takoboto.jp/?q=%e3%81%ab%e3%81%97%e3%81%a6"><strong>にして</strong></a><a href="https://takoboto.jp/?q=%e5%88%9d%e3%82%81%e3%81%a6%e3%81%a7%e3%81%8d%e3%82%8b%e3%81%93%e3%81%a8%e3%81%a7%e3%81%82%e3%82%8d%e3%81%86%e3%80%82"><span>初めてできることであろう。</span></a>
    segments:
      - text: かれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者
        grammar_highlight: false
      - text: にして
        grammar_highlight: true
      - text: 初めてできることであろう。
        grammar_highlight: false
    reading: かれはノーベルしょうにあたいするけんきゅうをなしとげた。これは、いだいなかがくしゃにしてはじめてできることであろう。
    credits_raw: dc
    translations:
      - language: en
        text: He worked hard to execute Nobel Prize level research. This was the something only a great scholar could achieve.
        html: |-
          <span>He worked hard to execute Nobel Prize level research. This was the something only a great scholar could achieve. </span>
        segments:
          - text: 'He worked hard to execute Nobel Prize level research. This was the something only a great scholar could achieve. '
            grammar_highlight: false
