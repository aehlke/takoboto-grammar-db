    text: |-
      科学者にして出来事

      other similar meanings:

      [dake] だけ only：
      　科学者＿だけ＿出来事
      　a thing only a scholar could do

      [dakara] だから so
      　科学者＿だから＿出来た
      　he is a scholar so he could do it

      [dakarakoso] だからこそ due to/because of
      　科学者だからこそできた
       because he is a great scholar he could do it
