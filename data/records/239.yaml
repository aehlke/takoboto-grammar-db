    japanese: 文章を書くということは、何かを表現することであり、自分は何を表現したいのか、それをはっきりさせないことには、何も書けない。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e6%96%87%e7%ab%a0%e3%82%92"><span>文章を</span></a><a href="https://takoboto.jp/?q=%e6%9b%b8%e3%81%8f%e3%81%a8%e3%81%84%e3%81%86%e3%81%93%e3%81%a8%e3%81%af%e3%80%81"><span>書くということは、</span></a><a href="https://takoboto.jp/?q=%e4%bd%95%e3%81%8b%e3%82%92"><span>何かを</span></a><a href="https://takoboto.jp/?q=%e8%a1%a8%e7%8f%be%e3%81%99%e3%82%8b%e3%81%93%e3%81%a8%e3%81%a7%e3%81%82%e3%82%8a%e3%80%81"><span>表現することであり、</span></a><a href="https://takoboto.jp/?q=%e8%87%aa%e5%88%86%e3%81%af"><span>自分は</span></a><a href="https://takoboto.jp/?q=%e4%bd%95%e3%82%92"><span>何を</span></a><a href="https://takoboto.jp/?q=%e8%a1%a8%e7%8f%be%e3%81%97%e3%81%9f%e3%81%84%e3%81%ae%e3%81%8b%e3%80%81%e3%81%9d%e3%82%8c%e3%82%92"><span>表現したいのか、それを</span></a><a href="https://takoboto.jp/?q=%e3%81%af%e3%81%a3%e3%81%8d%e3%82%8a%e3%81%95%e3%81%9b"><span>はっきりさせ</span></a><a href="https://takoboto.jp/?q=%e3%81%aa%e3%81%84%e3%81%93%e3%81%a8%e3%81%ab%e3%81%af"><strong>ないことには</strong></a><a href="https://takoboto.jp/?q=%e3%80%81"><span>、</span></a><a href="https://takoboto.jp/?q=%e4%bd%95%e3%82%82"><span>何も</span></a><a href="https://takoboto.jp/?q=%e6%9b%b8%e3%81%91%e3%81%aa%e3%81%84%e3%80%82"><span>書けない。</span></a>
    segments:
      - text: 文章を書くということは、何かを表現することであり、自分は何を表現したいのか、それをはっきりさせ
        grammar_highlight: false
      - text: ないことには
        grammar_highlight: true
      - text: 、何も書けない。
        grammar_highlight: false
    reading: ぶんしょうをかくということは、なにかをひょうげんすることであり、じぶんはなにをひょうげんしたいのか、それをはっきりさせないことには、なにもかけない。
    credits_raw: 赤毛
    translations:
      - language: en
        text: |-
          Concerning composition writing, when you mean to express something, in the case it is something personal that you want to express, unless you make it very clear, you can't write anything.
        html: |-
          <span>Concerning composition writing, when you mean to express something, in the case it is something personal that you want to express, </span><strong>unless </strong><span>you make it very clear, </span><span>you can't write anything. </span>
        segments:
          - text: "Concerning composition writing, when you mean to express something, in the case it is something personal that you want to express, "
            grammar_highlight: false
          - text: 'unless '
            grammar_highlight: true
          - text: 'you make it very clear, you can''t write anything. '
            grammar_highlight: false
