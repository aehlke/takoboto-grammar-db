      Perhaps I don't understand. This is what I think from these two phrases:

      どうやら、私はバスの中で財布を盗まれたようだ。
      It looks like I had my wallet stolen on the bus somehow. (The person has noticed their wallet is missing all on their own.)

      どうやら、私はバスの中で財布を盗まれたらしい
      I heard/It seems that I had my wallet stolen on the bus somehow. 
      (They don't remember what happened on the bus, but someone has told them later they saw the wallet being stolen. Or maybe someone has told them their wallet was stolen before they noticed it themselves. However, I don't think I would have the nerve to tell someone I saw their wallet being stolen yet didn't say it at the time it was happening...)

      Please correct me if I'm wrong.
    html: |-
      Perhaps I don't understand. This is what I think from these two phrases:<br/><br/>どうやら、私はバスの中で財布を盗まれたようだ。<br/>It looks like I had my wallet stolen on the bus somehow. (The person has noticed their wallet is missing all on their own.)<br/><br/>どうやら、私はバスの中で財布を盗まれたらしい<br/>I heard/It seems that I had my wallet stolen on the bus somehow. <br/>(They don't remember what happened on the bus, but someone has told them later they saw the wallet being stolen. Or maybe someone has told them their wallet was stolen before they noticed it themselves. However, I don't think I would have the nerve to tell someone I saw their wallet being stolen yet didn't say it at the time it was happening...)<br/><br/>Please correct me if I'm wrong.
