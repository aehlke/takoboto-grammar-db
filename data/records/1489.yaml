    text: |-
      My grammar book, 500 Essential Japanese Expressions: A Guide to Correct Usage of Key Sentence Patterns, has [のことだから], [ことだから], and [ことだ] meaning the same thing: [なのだから].
    html: |-
      My grammar book, 500 Essential Japanese Expressions: A Guide to Correct Usage of Key Sentence Patterns, has [のことだから], [ことだから], and [ことだ] meaning the same thing: [なのだから].
    credits_raw: Paul
    content_sha256: 332a9df0f159953c190ea90312c9890dc25687e1f35c4a7e5ab318bc26eff833
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: When I took JLPT 2級 they tested the difference between [ことから] and [ことだから]. It is quite easy to mix them up.
    html: When I took JLPT 2級 they tested the difference between [ことから] and [ことだから]. It is quite easy to mix them up.
    credits_raw: blabby
    content_sha256: 0903c07d7fffa633ade7a80a034b0f2ce9480bba43dc03045460d8d36c146170
    original_created_at: null
    original_updated_at: null
  - position: 4
    source_id: null
    text: |-
      This came up several times in something I was translating. I translated "a-san no kotodesukara..." as "It's a-san so...". It seems more natural than saying "A-san as usual...". For example in the example sentence above saying "It's Hiroko so she'll be late" or "Since it's Hiroko she'll be late" might be more natural.
    html: |-
      This came up several times in something I was translating. I translated "a-san no kotodesukara..." as "It's a-san so...". It seems more natural than saying "A-san as usual...". For example in the example sentence above saying "It's Hiroko so she'll be late" or "Since it's Hiroko she'll be late" might be more natural.
    credits_raw: kryptolus
