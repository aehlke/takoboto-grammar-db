    text: |-
      I'm still not sure when it's appropriate to use this form in the past tense ていた. For example, if I wanted to say "Yesterday we talked/ate a lot, didn't we?" would it be:

      昨日よく話してたなぁ 昨日よく食べてたなぁ
      or: 昨日よく話したなぁ 昨日よく食べたなぁ

      I used to use the second (non ていた) form exclusively as is the general useage pattern in English, despite the fact in the present tense you'd generally say 話している as talking is a continuous action, but recently I've noticed that the ていた form is used quite a lot too. Anyone have any idea what the exact difference between these two forms is?

      Other examples might include:

      昨日よく寝てた -> seems to be more commonly used
      and: 昨日よく寝た

      Also, to bshock above - surely "I've written a book" is also better translated in this past tense version of ている:

      本を書いてた (i.e. I wrote a book, and I'm still in that state)
    html: |-
      I'm still not sure when it's appropriate to use this form in the past tense ていた. For example, if I wanted to say "Yesterday we talked/ate a lot, didn't we?" would it be:<br/><br/>昨日よく話してたなぁ 昨日よく食べてたなぁ<br/>or: 昨日よく話したなぁ 昨日よく食べたなぁ<br/><br/>I used to use the second (non ていた) form exclusively as is the general useage pattern in English, despite the fact in the present tense you'd generally say 話している as talking is a continuous action, but recently I've noticed that the ていた form is used quite a lot too. Anyone have any idea what the exact difference between these two forms is?<br/><br/>Other examples might include:<br/><br/>昨日よく寝てた -&gt; seems to be more commonly used<br/>and: 昨日よく寝た<br/><br/>Also, to bshock above - surely "I've written a book" is also better translated in this past tense version of ている:<br/><br/>本を書いてた (i.e. I wrote a book, and I'm still in that state)
