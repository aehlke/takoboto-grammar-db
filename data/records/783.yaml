    text: "One of the things of this grammar point that normally confuses me is the usage of \n待って　and 待ってて. \n\nI am guessing that 待って implies \"Wait a moment\" and that 待ってて implies something like \"Wait(and continue waiting for a while)\"\nCan anyone clarify?"
    html: |-
      One of the things of this grammar point that normally confuses me is the usage of <br/>待って　and 待ってて. <br/><br/>I am guessing that 待って implies "Wait a moment" and that 待ってて implies something like "Wait(and continue waiting for a while)"<br/>Can anyone clarify?
    credits_raw: ミサ坊
    content_sha256: 9f04ff5d2d0edf74f110f9f1ec178820032d07d182852aa29dc4136f6b3008f7
    original_created_at: null
    original_updated_at: null
  - position: 7
    source_id: null
    text: If 本を書いてる。= "I've written a book," and you wished to say "I'm writing a book," how would this form change?
    html: If 本を書いてる。= "I've written a book," and you wished to say "I'm writing a book," how would this form change?
    credits_raw: bshock
    content_sha256: 541c0fa7913a460029ff1831ac50caac8db9b45ec3cb2bdf6bfb9720cb020e78
    original_created_at: null
    original_updated_at: null
  - position: 8
    source_id: null
    text: To bshock, I probably translate "I'm writing a book" as "本を書いている。”？
    html: To bshock, I probably translate "I'm writing a book" as "本を書いている。”？
    credits_raw: koueihou
    content_sha256: 25a0cad2e9f5e82d9ba93a671d1c8e5108d83de83a7c16cc109ca9524312e717
    original_created_at: null
    original_updated_at: null
  - position: 9
    source_id: null
    text: "Hey ミサ, I asked my coworker what the diffrence is and he confirmed your guess. \n\n待って　is something that is currently being done and 待ってて is something that will be started after the completion of something else. \n\nIE if your teacher askes for your homework and you have to dig in your backpack to get it, 待ってください\n\nif you are in the middle of completing your homework. 待っててください。\n\nI give you 10 points for posting this question. I have always used both interchangable (not a problem if you do) but its always good to learn a little more about the smaller meanings within the words."
    html: |-
      Hey ミサ, I asked my coworker what the diffrence is and he confirmed your guess. <br/><br/>待って　is something that is currently being done and 待ってて is something that will be started after the completion of something else. <br/><br/>IE if your teacher askes for your homework and you have to dig in your backpack to get it, 待ってください<br/><br/>if you are in the middle of completing your homework. 待っててください。<br/><br/>I give you 10 points for posting this question. I have always used both interchangable (not a problem if you do) but its always good to learn a little more about the smaller meanings within the words.
    credits_raw: tigert
