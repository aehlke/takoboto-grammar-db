    text: |-
      This grammar can use past and non・past verbs in front of it. The translation is therefore slightly different: "Whenever I go" versus "Whenever I went."

      V(plain form) + たび・たびに
      N + の + たび・たびに
    html: |-
      This grammar can use past and non・past verbs in front of it. The translation is therefore slightly different: "Whenever I go" versus "Whenever I went."<br/><br/>V(plain form) + たび・たびに<br/>N + の + たび・たびに
    credits_raw: rubyhatchet
