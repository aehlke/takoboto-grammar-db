comments:
  - position: 0
    source_id: null
    text: |-
      The equivalent of a question mark. Used mostly in informal male speech. Ungrammatical for questions that can be answered "yes/no" (see also "kai"). Unsuitable for asking a superior a question.

      There is a second "dai" at the end of sentences. It is equivalent to a weak exclamation point and is heard in the speech of little boys. "Sore boku no dai." That's mine!
    html: |-
      The equivalent of a question mark. Used mostly in informal male speech. Ungrammatical for questions that can be answered "yes/no" (see also "kai"). Unsuitable for asking a superior a question.<br/><br/>There is a second "dai" at the end of sentences. It is equivalent to a weak exclamation point and is heard in the speech of little boys. "Sore boku no dai." That's mine!
    credits_raw: american57
    content_sha256: e8ad581618153674100009a41314ea97aafbe08462146b591f93e4dc704ff04e
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      Typical 'standard politeness' question ends in 
      ですか or Vmますか。(e.g. いますか。Are (you) in?)
      Casual questions can omit the ? particle and use 
      tone. (e.g. 誰だ？ Who is it?)
      Alternatively だい and かい can be used.
      The plain form with か is quite abrupt and rough.
    html: |-
      Typical 'standard politeness' question ends in <br/>ですか or Vmますか。(e.g. いますか。Are (you) in?)<br/>Casual questions can omit the ? particle and use <br/>tone. (e.g. 誰だ？ Who is it?)<br/>Alternatively だい and かい can be used.<br/>The plain form with か is quite abrupt and rough.
