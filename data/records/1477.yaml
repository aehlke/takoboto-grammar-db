    text: |-
      Bamboo4, please excuse my ignorance - I'm a brit and I only found out the meaning of "druthers" in the The American Heritage Dictionary as a slang term for "would rather" from the 1800s.

      Can anyone suggest a less esoteric translation for どちらかと言えば - "If it's all the same" or "above all else" ????
    html: |-
      Bamboo4, please excuse my ignorance - I'm a brit and I only found out the meaning of "druthers" in the The American Heritage Dictionary as a slang term for "would rather" from the 1800s.<br/><br/>Can anyone suggest a less esoteric translation for どちらかと言えば - "If it's all the same" or "above all else" ????
