  - position: 2
    source_id: null
    text: |-
      I suppose you could say, "If I had to say (one way or the other)" or "If I were to say..."

      As in, one way or the other.

      どちらかと言えば、彼女が作ったケーキはちょっと・・・
      If I say which way is, she-made cake is a little...

      "If I had to say one way or the other, the cake she made is a little..."

      I think we use this sort of construction in English, too. We say, "If I had to say..." and then state an opinion or observation.

      In the case of stating one's desire (If I had my druthers, I'd like to go to the beach) maybe we would say "If I may say..." or something of this nature.

      Just my two cents.
    html: |-
      I suppose you could say, "If I had to say (one way or the other)" or "If I were to say..."<br/><br/>As in, one way or the other.<br/><br/>どちらかと言えば、彼女が作ったケーキはちょっと・・・<br/>If I say which way is, she-made cake is a little...<br/><br/>"If I had to say one way or the other, the cake she made is a little..."<br/><br/>I think we use this sort of construction in English, too. We say, "If I had to say..." and then state an opinion or observation.<br/><br/>In the case of stating one's desire (If I had my druthers, I'd like to go to the beach) maybe we would say "If I may say..." or something of this nature.<br/><br/>Just my two cents.
    credits_raw: ドニー
