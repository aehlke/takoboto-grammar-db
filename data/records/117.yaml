    text: |-
      linnenpotter

      I believe from the explanation rubyhatchetさん has above, には, similar to にとって, does pertain to the subject of the sentence; however, には, at least from what I've seen, seems to single out and place emphasis on the preceding noun to the point that it is referring to what the doer can accomplish with their own abilities. Hence it's why この仕事は私にはできない is correct. には specifically refers to myself and what I'm describing what is capable by my own abilities and power.

      にとって、on the other hand has neither the specificity nor the singling out of the preceding noun. Compare the following:

      外人にとって、納豆は食べにくい
      For foreigners (from their standpoint), nattou is difficult to eat.

      外人には、納豆は食べにくい
      For foreigners (specifically for them), nattou is difficult to eat.

      この仕事は私にとって出来ない isn't grammatically correct since in this case we're referring to a problem specifically for us that is unable to be accomplished. We need the specificity of には to throw across this notion. 

      #213, #6819, and #7036 are all correct usage since they're all describing situations from their own position and standpoint.
    html: |-
      linnenpotter<br/><br/>I believe from the explanation rubyhatchetさん has above, には, similar to にとって, does pertain to the subject of the sentence; however, には, at least from what I've seen, seems to single out and place emphasis on the preceding noun to the point that it is referring to what the doer can accomplish with their own abilities. Hence it's why この仕事は私にはできない is correct. には specifically refers to myself and what I'm describing what is capable by my own abilities and power.<br/><br/>にとって、on the other hand has neither the specificity nor the singling out of the preceding noun. Compare the following:<br/><br/>外人にとって、納豆は食べにくい<br/>For foreigners (from their standpoint), nattou is difficult to eat.<br/><br/>外人には、納豆は食べにくい<br/>For foreigners (specifically for them), nattou is difficult to eat.<br/><br/>この仕事は私にとって出来ない isn't grammatically correct since in this case we're referring to a problem specifically for us that is unable to be accomplished. We need the specificity of には to throw across this notion. <br/><br/>#213, #6819, and #7036 are all correct usage since they're all describing situations from their own position and standpoint.
