    text: |-
      ＊This grammar is used to express a certain time or circumstances, NOT a place.

      ＊All three versions of ところ are interchangeable grammatically, though nuance can differ.

      FORMATION:
      Ｖ(dict. form / たform / ているform) + ところ
      いＡ + ところ
      Ｎ + のところ
