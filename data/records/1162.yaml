    text: |-
      Generally speaking, the final particle in this grammar is interchangable with others, giving different nuance.
      [ところへ] emphasizes the process of getting to the given situation described by ところ such as XXXのところへ行った、
      [ところに] emphasizes the fact that you were at that given situation such as XXXのところに出くわした.
      [ところを] takes the situation described by ところ and provide the bridge to whatever was done to that siatuation, such as XXXのところを見られた
    html: |-
      Generally speaking, the final particle in this grammar is interchangable with others, giving different nuance.<br/>[ところへ] emphasizes the process of getting to the given situation described by ところ such as XXXのところへ行った、<br/>[ところに] emphasizes the fact that you were at that given situation such as XXXのところに出くわした.<br/>[ところを] takes the situation described by ところ and provide the bridge to whatever was done to that siatuation, such as XXXのところを見られた
    credits_raw: claytonian
