    text: |-
      I think the JLPT 2 version of this has been confused with the lower forms. JLPT 2 form means "too much, in an unusual or unexpected way"

      ex. 驚き　の　あまり、声も　出なかった。
      His surprise was so great, he couldn't even shout out.
    html: |-
      I think the JLPT 2 version of this has been confused with the lower forms. JLPT 2 form means "too much, in an unusual or unexpected way"<br/><br/>ex. 驚き　の　あまり、声も　出なかった。<br/>His surprise was so great, he couldn't even shout out.
