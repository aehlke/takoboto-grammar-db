    text: "とても..から　(x)　\nとても...ので (x)\n...しすぎるので (x)\nExpresses that a lot of or too much of (something) was the reason for (x)\n\n(Dictionary form) verb + あまり\nNoun　＋の＋あまり \nEG.痛さのあまり、涙が出てきた。\nその会社では働きすぎたあまり、病気で倒れる社員が増えている。"
    html: |-
      とても..から　(x)　<br/>とても...ので (x)<br/>...しすぎるので (x)<br/>Expresses that a lot of or too much of (something) was the reason for (x)<br/><br/>(Dictionary form) verb + あまり<br/>Noun　＋の＋あまり <br/>EG.痛さのあまり、涙が出てきた。<br/>その会社では働きすぎたあまり、病気で倒れる社員が増えている。
