    text: |-
      Just like how in English, we say, "me too!" Japanese uses the particle も

      It rained today too.
      今日も雨が降っていました。
    html: |-
      Just like how in English, we say, "me too!" Japanese uses the particle も<br/><br/>It rained today too.<br/>今日も雨が降っていました。
    credits_raw: Sakuratree
