  - position: 1
    source_id: null
    text: |-
      も replaces は in the first example sentence.
      A previous [something] being mine is implied.
      (e.g. 'あれは私のです。ええと、これも私のです。'
      That (over there) is mine. Erm, and this is also mine. )
    html: |-
      も replaces は in the first example sentence.<br/>A previous [something] being mine is implied.<br/>(e.g. 'あれは私のです。ええと、これも私のです。'<br/>That (over there) is mine. Erm, and this is also mine. )
    credits_raw: Amatuka
