title: ようにも〜ない
romanized_label: younimonai
alternate_forms: []
jlpt_level: 1
credits_raw: LR
meaning: |-
  even though ~ try / want to ~; although ~ be thinking of doing; A conjunctive phrase that indicates concession: "even though s.o. tries to do s.t., he/she cannot do it for some reason"
meaning_example: I have a terrible headache, and I cannot get up even though I want to
meaning_notes:
  - language: ja
    text: しようとしてもできない; したいのにできない
    html: しようとしてもできない; したいのにできない
