    text: |-
      はしを渡るべからずというのは昔のことわざで日本人の人なら誰でも知ってるはずです。覚えといていただいたらうれしい：）このことわざについてもっと詳しく知りたければ調べてみてください。

      By the way この上に書いてある誠さんのノートに間違ってることに気づきました。名詞の前につくというのじゃなくて、動詞の前につく形のほうが正しいとおもいます。
