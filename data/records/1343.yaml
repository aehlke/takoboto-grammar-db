    text: |-
      "〜べからざる"
      This must be worth remembering, but few Japanese use it in everyday speech.
      I think that most Japanese usually say:
      #5013
      成人指定映画は青少年にとって見てはいけないものだ。

      #5014
      許されない行為

      #5015
      これはまさに無視してはいけない犯罪ではないでしょうか。

      #5318
      今日の社会では、パソコンは欠かせないものとなっている。

      #5854
      この荷物には「危険！触るな！」と書いてある。
    html: |-
      "〜べからざる"<br/>This must be worth remembering, but few Japanese use it in everyday speech.<br/>I think that most Japanese usually say:<br/>#5013<br/>成人指定映画は青少年にとって見てはいけないものだ。<br/><br/>#5014<br/>許されない行為<br/><br/>#5015<br/>これはまさに無視してはいけない犯罪ではないでしょうか。<br/><br/>#5318<br/>今日の社会では、パソコンは欠かせないものとなっている。<br/><br/>#5854<br/>この荷物には「危険！触るな！」と書いてある。
    credits_raw: Nick
