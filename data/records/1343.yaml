    text: |-
      Actually, the 終止形 form is べし, and it conjugates like an adjective, meaning the 未然形 is べから.

      As blabby hinted, use べからざる before nouns, and べからず at the end of sentences.
    html: |-
      Actually, the 終止形 form is べし, and it conjugates like an adjective, meaning the 未然形 is べから.<br/><br/>As blabby hinted, use べからざる before nouns, and べからず at the end of sentences.
