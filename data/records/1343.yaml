    text: |-
      〜べからず／〜べからざる　：　〜してはいけない・禁止

      １．「〜べからず」は立て看板などの注意書きに使われます。
      ２．「〜べからざる」（名詞の前に付く形）は「許すべからざる、欠くべからざる」のほかはあまり使われません。
    html: |-
      〜べからず／〜べからざる　：　〜してはいけない・禁止<br/><br/>１．「〜べからず」は立て看板などの注意書きに使われます。<br/>２．「〜べからざる」（名詞の前に付く形）は「許すべからざる、欠くべからざる」のほかはあまり使われません。
    credits_raw: 誠
