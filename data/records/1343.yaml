    text: |-
      Etymologically, this is adjective 可(べ)し in 連用形 beku, to which 在(あ)り is appended, forming bekuari > bekari. Then, to its 未然形 bekara, the classical verb of negation ず is added, forming bekarazu. Further, 在り can be added again, resulting in bekarazari, whose 連体形 is bekarazaru. Also recall that 連体形 is used for verbs before nouns (attributive usage) and 終止形 for ending sentences.
    html: |-
      Etymologically, this is adjective 可(べ)し in 連用形 beku, to which 在(あ)り is appended, forming bekuari &gt; bekari. Then, to its 未然形 bekara, the classical verb of negation ず is added, forming bekarazu. Further, 在り can be added again, resulting in bekarazari, whose 連体形 is bekarazaru. Also recall that 連体形 is used for verbs before nouns (attributive usage) and 終止形 for ending sentences.
    credits_raw: blutorange
