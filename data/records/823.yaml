    text: |-
      This is an auxiliiary indicating that there is no other choice but to do something. Possible translations include: cannot help 〜ing; cannot help but; have no choice but to have to.

      Ｖneg + ざるを得ない
      Examples: 食べざるを得ない // 行かざるを得ない
      Exception: する -> せざるを得ない
    html: |-
      This is an auxiliiary indicating that there is no other choice but to do something. Possible translations include: cannot help 〜ing; cannot help but; have no choice but to have to.<br/><br/>Ｖneg + ざるを得ない<br/>Examples: 食べざるを得ない // 行かざるを得ない<br/>Exception: する -&gt; せざるを得ない
    credits_raw: rubyhatchet
