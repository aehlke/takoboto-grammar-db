    text: |-
      ざる is an archaic particle indicating negation. It's root form is ず and it inflects as ず/ざら、ず/ざり、ざる/ぬ、ざれ/ね but its imperative form is ざれ. In tbis manner, it has very unique inflections.
      行かざる means not going, which is denied by えない so that it becomes "not going is not capable," the double negative thus resulting in "I must go."
    html: |-
      ざる is an archaic particle indicating negation. It's root form is ず and it inflects as ず/ざら、ず/ざり、ざる/ぬ、ざれ/ね but its imperative form is ざれ. In tbis manner, it has very unique inflections.<br/>行かざる means not going, which is denied by えない so that it becomes "not going is not capable," the double negative thus resulting in "I must go."
    credits_raw: bamboo4
