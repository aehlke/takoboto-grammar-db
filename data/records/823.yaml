  - position: 2
    source_id: null
    text: |-
      ＊Be very careful as to when you replace one of these phrases with another.

      Ｖneg + ざるを得ない : used in a situation where one has no choice but to do something.

      Ｖ + しかない : used in a situation where one has no choice but to do something.

      Ｖneg + なければならない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something.

      Ｖneg + わけに(は)いかない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something. It also expresses the unwillingness of the speaker to do Ｖ.
    html: |-
      ＊Be very careful as to when you replace one of these phrases with another.<br/><br/>Ｖneg + ざるを得ない : used in a situation where one has no choice but to do something.<br/><br/>Ｖ + しかない : used in a situation where one has no choice but to do something.<br/><br/>Ｖneg + なければならない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something.<br/><br/>Ｖneg + わけに(は)いかない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something. It also expresses the unwillingness of the speaker to do Ｖ.
    credits_raw: rubyhatchet
