  - position: 6
    source_id: null
    text: |-
      Can somebody confirm if 〜の至り is used only for emotions.

      贅沢(ぜいたく)の至り and 低俗の至り are wrong because they are not emotions. Right?

      They should be 贅沢の極み and 低俗の極み right??

      Is ther an easier way to tell the difference between 〜の極みand 〜の至り?
    html: |-
      Can somebody confirm if 〜の至り is used only for emotions.<br/><br/>贅沢(ぜいたく)の至り and 低俗の至り are wrong because they are not emotions. Right?<br/><br/>They should be 贅沢の極み and 低俗の極み right??<br/><br/>Is ther an easier way to tell the difference between 〜の極みand 〜の至り?
    credits_raw: blabby
    content_sha256: 34334511063d4d185965881112bde6c6a49a582f140ab506e0085cb69da5882d
    original_created_at: null
    original_updated_at: null
  - position: 7
    source_id: null
    text: |-
      I am not sure if you can categorize 至り as relating to emotions and 極み as not. 光栄の至り、汗顔の至り and 慶賀の至り, etc., may not just relate to emotions. It is hard to set up any rule to differentiate.
    html: |-
      I am not sure if you can categorize 至り as relating to emotions and 極み as not. 光栄の至り、汗顔の至り and 慶賀の至り, etc., may not just relate to emotions. It is hard to set up any rule to differentiate.
    credits_raw: bamboo4
