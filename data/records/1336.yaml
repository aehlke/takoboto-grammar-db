    text: |-
      I read that this is mainly used with experssions of emotion. 光栄, 感激, 若気,感心, etc are commonly used. It is ofen inerchangable with 〜の極み but 〜の極み is also used for words of non-emotion such as 疲労の極み.
    html: |-
      I read that this is mainly used with experssions of emotion. 光栄, 感激, 若気,感心, etc are commonly used. It is ofen inerchangable with 〜の極み but 〜の極み is also used for words of non-emotion such as 疲労の極み.
