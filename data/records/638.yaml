comments:
  - position: 0
    source_id: null
    text: |-
      な is used by na-adjectives to modify the word that follows them. 
      This is exactly the same way の is used with nouns to modify the word that follows them.
      な derived from なる - and なる can still be used in some circumstances in the same way.
    html: |-
      な is used by na-adjectives to modify the word that follows them. <br/>This is exactly the same way の is used with nouns to modify the word that follows them.<br/>な derived from なる - and なる can still be used in some circumstances in the same way.
    credits_raw: Amatuka
    content_sha256: d77ff7232fbcf2f9e262b7f9b690b2a772cef8d0bfd8bb821d72f7ec13bd893d
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      E.g. 車 - (a) Car.
      Modify with な-adjective,
      大きな車 - (a) Large car.
      Modify with noun
      フレッドの車 - Fred's car.
    html: |-
      E.g. 車 - (a) Car.<br/>Modify with な-adjective,<br/>大きな車 - (a) Large car.<br/>Modify with noun<br/>フレッドの車 - Fred's car.
    credits_raw: Amatuka
    content_sha256: b263c9103bf67ab3f5596e3bb6d80d6f292a0a54ea8e6e0c9c7ed3906d2d5280
    original_created_at: null
    original_updated_at: null
  - position: 2
    source_id: null
    text: |-
      Note that the same word can often be used both as a na-adjective and as a noun.
      Also quite a lot of i-adjectives can (with the i removed) be used as na-adjectives.
      e.g. 大きい車 vs. 大きな車
    html: |-
      Note that the same word can often be used both as a na-adjective and as a noun.<br/>Also quite a lot of i-adjectives can (with the i removed) be used as na-adjectives.<br/>e.g. 大きい車 vs. 大きな車
    credits_raw: Amatuka
    content_sha256: b68af84a67f64a8eb0944726c9ad7346a418469908b53bb05108ef2110627934
