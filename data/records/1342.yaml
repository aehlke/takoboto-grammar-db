    text: |-
      >> quendidil
      The dictionary form (終止形) would be べし, but in MJ, べし has been replaced by べきだ. 
      So if we're talking about MJ, べからず is the negative of べきだ, but in CJ, it would be べし.
    html: |-
      &gt;&gt; quendidil<br/>The dictionary form (終止形) would be べし, but in MJ, べし has been replaced by べきだ. <br/>So if we're talking about MJ, べからず is the negative of べきだ, but in CJ, it would be べし.
    credits_raw: jimmyseal
