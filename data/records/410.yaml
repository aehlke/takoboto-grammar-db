    text: |-
      This entry is confused.
      CrayonShin's Toshite is entirely different for our purposes here and should be separated from this grammar point。
      人間として - as a human
      人間としても - even as a human
      these are different than
      人間だとしても - even if I were human

      Also, Verbs need TA form, unlike　としたら。

      消えたとしても誰も気づかない気がする -　I feel like even If I were to disappear nobody would notice.

      る　＋　としても has a completely different meaning than たとしても and is used very very rarely.

      here is an example

      地球温暖化が行われてるとしても気分がかなりいいです。Despite global warming, i feel ok.

      one is EVEN IF IT WERE, one is EVEN IF IT IS OR MAY BE.
    html: |-
      This entry is confused.<br/>CrayonShin's Toshite is entirely different for our purposes here and should be separated from this grammar point。<br/>人間として - as a human<br/>人間としても - even as a human<br/>these are different than<br/>人間だとしても - even if I were human<br/><br/>Also, Verbs need TA form, unlike　としたら。<br/><br/>消えたとしても誰も気づかない気がする -　I feel like even If I were to disappear nobody would notice.<br/><br/>る　＋　としても has a completely different meaning than たとしても and is used very very rarely.<br/><br/>here is an example<br/><br/>地球温暖化が行われてるとしても気分がかなりいいです。Despite global warming, i feel ok.<br/><br/>one is EVEN IF IT WERE, one is EVEN IF IT IS OR MAY BE.
    credits_raw: Wes
