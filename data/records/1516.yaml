  - position: 2
    source_id: null
    text: |-
      One of my Japanese mentors says that ってば actually sounds sort of feminine, I forget why exactly, though. Adding よ to the end of ってば, as in what Naruto says, is probably just a way to make ってば sound more masculine.
    html: |-
