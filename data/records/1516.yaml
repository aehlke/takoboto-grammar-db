comments:
  - position: 0
    source_id: null
    text: |-
      It is used to emphasize speakers emotion/desire/will, and is not used in formal speeches but in casual conversations. Something like よ(yo) but far stronger.

      It follows the +tte (って）short cut for と言う
    html: |-
      It is used to emphasize speakers emotion/desire/will, and is not used in formal speeches but in casual conversations. Something like よ(yo) but far stronger.<br/><br/>It follows the +tte (って）short cut for と言う
    credits_raw: cup
    content_sha256: 4dc3b64389a1bdb92d41505563dfda38b3ca64f968fb03abc76352cea60028ef
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (#6485), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.

      I also have to call #5470 and #5471 into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me.
    html: |-
      Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (#6485), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.<br/><br/>I also have to call #5470 and #5471 into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me.
    credits_raw: KWhazit
    content_sha256: 479c982fa101015d00c1ceaca28928f9bb5c77eff685e842b8b3ae8a44645476
    original_created_at: null
