    text: |-
      I agree with godfrey, the meaning 'no need to do sth' is not always correct, yet you can always interpret the sentence correctly with ataru having the meaning of 'hitting the target'. Then example #4045 could be interpreted as 'Having sympathy doesn't hit the target > isn't right' or something like that.

      I don't think example #3680 stands alone, the construction is just used in a more literal way than in the other examples.
    html: |-
