  - position: 2
    source_id: null
    text: |-
      注意
      While the verb 耐える as a piece of vocabulary means being able to withstand / endure, the grammar phrase にたえる means to deserve, be worthy of, to have value in... にたえる is completely different from 耐える!
    html: |-
      <b>注意</b><br/>While the verb 耐える as a piece of vocabulary means being able to withstand / endure, the grammar phrase にたえる means to deserve, be worthy of, to have value in... <b><strong>にたえる is completely different from 耐える</strong></b>!
    credits_raw: LR
    content_sha256: f1a011675e244b0a91e01338510dabd791e5f6a7c6da233f053fc03cec69db0c
