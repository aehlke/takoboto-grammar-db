  - position: 0
    source_id: null
    text: |-
      ＊なんて and なんか are both used in conversational Japanese. Also, なんか can be seen as derogatory in some contexts. EDIT: Since this seems to be misleading, なんか can put a bit more emphasis on the derogatory tone of a negative sentence than など, but it is not rude Japanese. As the commenter said, なんて is more colloquial in that sense.

      FORMATION:
      Ｖ(plain form) + など・なんか
      Ｎ + だ + など・なんて・なんか
    html: |-
      ＊なんて and なんか are both used in conversational Japanese. Also, なんか can be seen as derogatory in some contexts. EDIT: Since this seems to be misleading, なんか can put a bit more emphasis on the derogatory tone of a negative sentence than など, but it is not rude Japanese. As the commenter said, なんて is more colloquial in that sense.<br/><br/>FORMATION:<br/>Ｖ(plain form) + など・なんか<br/>Ｎ + だ + など・なんて・なんか
