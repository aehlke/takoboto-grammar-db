  - position: 1
    source_id: null
    text: |-
      this looks to me like 2 different usages- って as a contraction of と or という, and って as a contraction of でも, both of which are more informal then their counterparts.
    html: |-
      this looks to me like 2 different usages- って as a contraction of と or という, and って as a contraction of でも, both of which are more informal then their counterparts.
    credits_raw: darg
    content_sha256: ecaa42dc9dab691c6c54874acca28b69b9474326e0951c1e7614e8b862cc8c35
    original_created_at: null
    original_updated_at: null
  - position: 2
    source_id: null
    text: I never heard of って as a contraction of でも.
    html: I never heard of って as a contraction of でも.
    credits_raw: bamboo4
    content_sha256: 71b427402475549823b17c752ee3acec68b3af610f026d9745a200e228b8d2a3
