  - position: 9
    source_id: null
    text: |-
      @nnskage 
      yes friend there is a rule for the usage of って and て .
      てis used when the following verb is used with ん sound.
      For ex-あれはなんてよむんですか.
      And, って is used when the following verb does not consist of the ん sound.
      For ex-あそこ で みどりぐちって かいて あります ね.
    html: |-
      @nnskage <br/>yes friend there is a rule for the usage of って and て .<br/>てis used when the following verb is used with ん sound.<br/>For ex-あれはなんてよむんですか.<br/>And, って is used when the following verb does not consist of the ん sound.<br/>For ex-あそこ で みどりぐちって かいて あります ね.
    credits_raw: Ashish Joshi
