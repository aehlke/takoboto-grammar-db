  - position: 6
    source_id: null
    text: |-
      @ami I'll have to use Romaji because my computer won't switch to Japanese for some reason right now.
      ~ tte no wa
      is functionally equivalent to
      ~ to iu no wa
      in that it means "~ is defined as", basically. For example:
      "Taberu" tte no wa tabemono wo kuti ni ireru koto de aru.
      "Eating" means "putting food into your mouth."
      I personally find it more pleasing to say "~tte wa" without the "no", or just "~tte".
    html: |-
      @ami I'll have to use Romaji because my computer won't switch to Japanese for some reason right now.<br/>~ tte no wa<br/>is functionally equivalent to<br/>~ to iu no wa<br/>in that it means "~ is defined as", basically. For example:<br/>"Taberu" tte no wa tabemono wo kuti ni ireru koto de aru.<br/>"Eating" means "putting food into your mouth."<br/>I personally find it more pleasing to say "~tte wa" without the "no", or just "~tte".
    credits_raw: KyleGoetz
