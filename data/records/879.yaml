    text: I understood this one, but what does it mean when someone says "。。ってのは(rest of the sentence)"？
    html: I understood this one, but what does it mean when someone says "。。ってのは(rest of the sentence)"？
    credits_raw: ami
    content_sha256: 40d6c289b317b161227f1438275e551101e145bcb98d5e2c8d1f7804715491a6
    original_created_at: null
