meaning: Once [things have] reached the point at which...; (Only) now that it has come to this...
meaning_example: Expresses that it is already late in the game. // in an extreme instance //at this moment [point] (in time)
meaning_notes:
  - language: ja
    text: 程度が普通の状態をこえているさま。大変。非常に。
    html: 程度が普通の状態をこえているさま。大変。非常に。
sections:
  - kind: meaning
    source_dom_id: editable_Meaning_1288
    body_text: |-
      Once [things have] reached the point at which...; (Only) now that it has come to this... 
       Expresses that it is already late in the game. // in an extreme instance //at this moment [point] (in time) 
       程度が普通の状態をこえているさま。大変。非常に。
    body_html: |-
      <span>Once [things have] reached the point at which...; (Only) now that it has come to this...</span> <br/> <span>Expresses that it is already late in the game. // in an extreme instance //at this moment [point] (in time)</span> <br/> <span>程度が普通の状態をこえているさま。大変。非常に。</span>
    credits_raw: dc
