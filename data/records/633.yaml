  - position: 2
    source_id: null
    text: |-
      Don't confuse みたい (seeming) with みたい (wanting to see). The latter is the たい (tai) desirative form of みる (I'm not sure how 'seeming' みたい was derived)
    html: |-
      Don't confuse みたい (seeming) with みたい (wanting to see). The latter is the たい (tai) desirative form of みる (I'm not sure how 'seeming' みたい was derived)
    credits_raw: Amatuka
    content_sha256: 1e20b9a0f4ffed42c8ad50d74e42f06317faed40ad5790dcc4c8e8059e3366e3
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: |-
      The first time I came across みたい in that form (the example) I processed it from the literal meaning
       "I want to see that he has a cold" -> 
       "I want to say he has a cold" ->
       (oh!) "Seems like he has a cold" . . .
      Ok, it's a stretch but well these are the things you do when you have no one to ask.
    html: |-
      The first time I came across みたい in that form (the example) I processed it from the literal meaning<br/> "I want to see that he has a cold" -&gt; <br/> "I want to say he has a cold" -&gt;<br/> (oh!) "Seems like he has a cold" . . .<br/>Ok, it's a stretch but well these are the things you do when you have no one to ask.
    credits_raw: nadine
    content_sha256: d3e4f7024759dfdebfe44efd59eafd3ad914829f62e17d98b0e01314b299b58d
