  - position: 1
    source_id: null
    text: Need to check up on the difference between みたい and よう usage.
    html: Need to check up on the difference between みたい and よう usage.
    credits_raw: Amatuka
    content_sha256: 9c6f20bb26c3c0534b074bc36ee93121eb1a74d610a86ef24103bf3f73be02c8
    original_created_at: null
