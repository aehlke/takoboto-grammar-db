    text: |-
      According to notes I have from a class I took, if a question word (e.g., nani,itsu) is present you use only か, otherwise use かどうか.

      Also, a plain form precedes か and if it is a noun or A2 adjective だ is omitted.
    html: |-
      According to notes I have from a class I took, if a question word (e.g., nani,itsu) is present you use only か, otherwise use かどうか.<br/><br/>Also, a plain form precedes か and if it is a noun or A2 adjective だ is omitted.
    credits_raw: yookoso
