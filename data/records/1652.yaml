    text: "I`m not sure if this should be entered as grammar or as vocabulary, but it is a very important saying. Japan has a lot of set phrases and in order to sound natural its best to memorize as many as you can. \n\nあっという間　lit. translates to \n\"In the middle of saying あぁ”\n\nbefore you could finish your sentence time had run out"
    html: |-
      I`m not sure if this should be entered as grammar or as vocabulary, but it is a very important saying. Japan has a lot of set phrases and in order to sound natural its best to memorize as many as you can. <br/><br/>あっという間　lit. translates to <br/>"In the middle of saying あぁ”<br/><br/>before you could finish your sentence time had run out
