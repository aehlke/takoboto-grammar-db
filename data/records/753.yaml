comments:
  - position: 0
    source_id: null
    text: |-
      Introducing は "wa" and です。"desu."
      the particle は marks the topic.
      (Remember particles attach to the word which they follow, and that when は is a particle it is pronounced wa.)
      です。functions like "is" or "topic is."
    html: |-
      Introducing は "wa" and です。"desu."<br/>the particle は marks the topic.<br/>(Remember particles attach to the word which they follow, and that when は is a particle it is pronounced wa.)<br/>です。functions like "is" or "topic is."
    credits_raw: Denzil
    content_sha256: 926fa76304873889bfca478f658abaad4aab0face46f281bac31f1733e70e06a
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: "は\n\nIs pronounced as \"wah\".\nは a subject or topic marker.\nは can appear as ha, or wa in romaji depending on the system used.\n\nThe kana used for は is usually pronounced as \"hah\", but pronounced as \"wah\" when used as a particle.\nThe same phenomenon happens in the word \"dewa/deha\" では in the negative conjugation of the verb [desu]. \n\nOther notes:\nIn yakuza speech,\nは、becomes や　(yah).\nTypically, the y sound is softened such that it sounds like \"ah\"\nExample:\nOre ha --turns to-> Ore ya --but sounds like-> Ore a"
    html: |-
      <b>は</b><br/><br/>Is pronounced as "wah".<br/>は a subject or topic marker.<br/>は can appear as ha, or wa in romaji depending on the system used.<br/><br/>The kana used for は is usually pronounced as "hah", but pronounced as "wah" when used as a particle.<br/>The same phenomenon happens in the word "dewa/deha" では in the negative conjugation of the verb [desu]. <br/><br/><b>Other notes:</b><br/>In yakuza speech,<br/>は、becomes や　(yah).<br/>Typically, the y sound is softened such that it sounds like "ah"<br/>Example:<br/>Ore ha --turns to-&gt; Ore ya --but sounds like-&gt; Ore a
    credits_raw: Rinji_HalfElf
    content_sha256: fbd228a27fa2915eb401af322c609dd8c9e0329dfaadfcbd3b4775e07f711a21
    original_created_at: null
    original_updated_at: null
