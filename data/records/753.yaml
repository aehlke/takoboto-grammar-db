  - position: 3
    source_id: null
    text: |-
      When to use は vs が?
      Both sentences like 雨は降っている。[ame ha 
      futteiru] and 雨が降っている。[ame ga futteiru] are 
      valid, so working out when to use which form is a 
      tricky point.

      First: In answering a question such as 
      Q. 机の上に何がありますか。[tsukue no ue ni nani ga arimasu ka]
      A. 鉛筆があります。[enpitsu ga arimasu].
      Here が is used.
    html: |-
      When to use は vs が?<br/>Both sentences like 雨は降っている。[ame ha <br/>futteiru] and 雨が降っている。[ame ga futteiru] are <br/>valid, so working out when to use which form is a <br/>tricky point.<br/><br/>First: In answering a question such as <br/>Q. 机の上に何がありますか。[tsukue no ue ni nani ga arimasu ka]<br/>A. 鉛筆があります。[enpitsu ga arimasu].<br/>Here が is used.
    credits_raw: Amatuka
    content_sha256: 9b1232d9421a267041fef89bf28ff91fc9783a7cfd1f2ab68d6e5002564b1d53
    original_created_at: null
    original_updated_at: null
  - position: 4
    source_id: null
    text: |-
      On the other hand if attention has been placed on something in advance and the question is asked with that object as the topic...
      Q. 本はどこにありますか。[hon ha doko ni arimasu ka.]
      A. 本はイスの下にあります。[hon ha isu no shita ni arimasu]
      then は is used.
    html: |-
      On the other hand if attention has been placed on something in advance and the question is asked with that object as the topic...<br/>Q. 本はどこにありますか。[hon ha doko ni arimasu ka.]<br/>A. 本はイスの下にあります。[hon ha isu no shita ni arimasu]<br/>then は is used.
    credits_raw: Amatuka
    content_sha256: 868aa86a394f81c11a179f68ebd049013ed275ef414a045d65172bd85c913891
    original_created_at: null
    original_updated_at: null
  - position: 5
    source_id: null
    text: |-
      が is also used to indicate a specific choice.
      私が行きます。[watashi ga ikimasu]
      _I'll_ go. (not any of the other possibilities).
    html: |-
      が is also used to indicate a specific choice.<br/>私が行きます。[watashi ga ikimasu]<br/>_I'll_ go. (not any of the other possibilities).
    credits_raw: Amatuka
    content_sha256: 01a277f7d36f36f52b02cd0b5d819e77d42d2855ab04f1d4b99a0a0819ca9870
    original_created_at: null
    original_updated_at: null
  - position: 6
    source_id: null
    text: |-
      は is used for contrastative sentences (see ha-2).
      For example normally you'd say 
      犬が好きです。[inu ga suki desu] I like dogs.
      However if you want to contrast how you feel about dogs with how you feel about other animals then
      犬は好きだが、猫はどうも・・・[inu ha suki da ga, neko ha doumo ...]
      I like _dogs_ but I really don't (get on with) cats.
    html: |-
      は is used for contrastative sentences (see ha-2).<br/>For example normally you'd say <br/>犬が好きです。[inu ga suki desu] I like dogs.<br/>However if you want to contrast how you feel about dogs with how you feel about other animals then<br/>犬は好きだが、猫はどうも・・・[inu ha suki da ga, neko ha doumo ...]<br/>I like _dogs_ but I really don't (get on with) cats.
    credits_raw: Amatuka
    content_sha256: 99f94c069471b0b2d0a2fd5b22873c28eeb145ce7c29271d24be0a2996e4ba49
    original_created_at: null
    original_updated_at: null
  - position: 7
    source_id: null
    text: |-
      は [ha / wa] follows a noun or a noun phrase.
      (e.g. 犬は [inu ha] 'as for dogs'
      知るのは [shiru no ha] 'as for what (I) know'
      The latter case の nominalizes (turns into a noun) 知る)

      N = noun
    html: |-
      は [ha / wa] follows a noun or a noun phrase.<br/>(e.g. 犬は [inu ha] 'as for dogs'<br/>知るのは [shiru no ha] 'as for what (I) know'<br/>The latter case の nominalizes (turns into a noun) 知る)<br/><br/>N = noun
    credits_raw: Amatuka
    content_sha256: 52460aaaf7276aa72f8507f6cb11affccfe164d404d00d287731f9bd635fb52b
    original_created_at: null
