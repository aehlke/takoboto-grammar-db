  - position: 0
    source_id: null
    text: |-
      This phrase needs a cause and effect. 
      "cause [dakeatte] effect"
      "He studied hard [dakeatte] passed the test"

      You cannot use just the result
      NG: "he [dakeatte] passed the test"

      Very similiar to [sasuga] but that word can be used on its own a little more casually, as in
      "sasuga Rob-san" = isn't Rob great, after all.

      Works also for negative nuance, as in the "and got fat" example below.
    html: |-
      This phrase needs a cause and effect. <br/>"cause [dakeatte] effect"<br/>"He studied hard [dakeatte] passed the test"<br/><br/>You cannot use just the result<br/>NG: "he [dakeatte] passed the test"<br/><br/>Very similiar to [sasuga] but that word can be used on its own a little more casually, as in<br/>"sasuga Rob-san" = isn't Rob great, after all.<br/><br/>Works also for negative nuance, as in the "and got fat" example below.
    credits_raw: dc
    content_sha256: 19d467e07b18808119e27ce23ec58cfac966b36751eadd64c61be08da7aa0089
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      だけあって is used for good merits. It should not be used for negative nuances. However, だけに can be used for both good and bad merits.

      Often, さすが(に) is used in conjunction with だけあって as emphasis.
    html: |-
      だけあって is used for good merits. It should not be used for negative nuances. However, だけに can be used for both good and bad merits.<br/><br/>Often, さすが(に) is used in conjunction with だけあって as emphasis.
    credits_raw: rubyhatchet
