comments:
  - position: 0
    source_id: null
    text: |-
      までに is giving a time limit which must be kept. Finishing the required action before is also fine.

      In opposition まで denotes an action etc. which continues until the given time and does not finish before.
    html: |-
      までに is giving a time limit which must be kept. Finishing the required action before is also fine.<br/><br/>In opposition まで denotes an action etc. which continues until the given time and does not finish before.
