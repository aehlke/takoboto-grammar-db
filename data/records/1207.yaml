    text: |-
      いただきます・いただく
      It is a polite receiving verb. Normally Japanese people would say "Itadakimasu" before a meal. Translated, it could be something along the lines of "Thank you for the meal". 

      However, as a verb itself, it can be attached to the 'te-form' of another verb to indicate appreciation. (Check out notes for giving and receiving verbs.)
    html: |-
      いただきます・いただく<br/>It is a polite receiving verb. Normally Japanese people would say "Itadakimasu" before a meal. Translated, it could be something along the lines of "Thank you for the meal". <br/><br/>However, as a verb itself, it can be attached to the 'te-form' of another verb to indicate appreciation. (Check out notes for giving and receiving verbs.)
