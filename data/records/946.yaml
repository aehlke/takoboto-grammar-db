  - position: 6
    source_id: null
    text: "偶然 「ぐうぜん」 I think means more what a coincidence. As in \"what a surprise to see you here!\"\n\n突然　「とつぜん」is more similar, like \"out of the blue\".\n\nいきなり is another similar word. \nいきなり結婚した - got married all of a sudden"
    html: |-
      偶然 「ぐうぜん」 I think means more what a coincidence. As in "what a surprise to see you here!"<br/><br/>突然　「とつぜん」is more similar, like "out of the blue".<br/><br/>いきなり is another similar word. <br/>いきなり結婚した - got married all of a sudden
