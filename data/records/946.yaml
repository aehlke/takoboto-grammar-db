  - position: 4
    source_id: null
    text: |-
      ふと would be used in the sense of "incidentally" or "by some unexpected turn of event." It is more or less an unexpected thing that catch you more or less passively.

      いきなり and 突然 has the connotation of "out of blue" or "abruptly" so that there is a big element of surprise.
    html: |-
      ふと would be used in the sense of "incidentally" or "by some unexpected turn of event." It is more or less an unexpected thing that catch you more or less passively.<br/><br/>いきなり and 突然 has the connotation of "out of blue" or "abruptly" so that there is a big element of surprise.
