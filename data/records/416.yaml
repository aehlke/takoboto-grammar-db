comments:
  - position: 0
    source_id: null
    text: |-
      This is often used when saying excuses. Shortened to もん in spoken Japanese. I really hate hearing people say this to me.
    html: |-
      This is often used when saying excuses. Shortened to もん in spoken Japanese. I really hate hearing people say this to me.
