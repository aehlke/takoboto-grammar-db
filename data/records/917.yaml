    text: |-
      The connection to "two birds with one stone" seems a bit on the weak side to me, but not entirely absent. I think the two birds saying has more to do with deliberately combining two tasks, while ついでに makes the second one more of an afterthought.

      I'd explain AついでにB as, A is the main thing I'm doing, and B wasn't necessarily even in my plans, but doing A makes it convenient to do B, so I might as well do B too.
    html: |-
      The connection to "two birds with one stone" seems a bit on the weak side to me, but not entirely absent. I think the two birds saying has more to do with deliberately combining two tasks, while ついでに makes the second one more of an afterthought.<br/><br/>I'd explain AついでにB as, A is the main thing I'm doing, and B wasn't necessarily even in my plans, but doing A makes it convenient to do B, so I might as well do B too.
