  - position: 5
    source_id: null
    text: |-
      How can I know how must I read the kanji, if in on yomi or kunyomi.
      For example: in nﾂｰ 5446 is:
      koko ni "TE" ki ppanachi
      or
      koko ni "OKU" ki ppanachi?
      It is very difficult for people who donﾂｴt know japanese very well.
    html: |-
      How can I know how must I read the kanji, if in on yomi or kunyomi.<br/>For example: in nﾂｰ 5446 is:<br/>koko ni "TE" ki ppanachi<br/>or<br/>koko ni "OKU" ki ppanachi?<br/>It is very difficult for people who donﾂｴt know japanese very well.
    credits_raw: Futaro
    content_sha256: bb1341da6dcce40915ba6f3cef0dd1b54c8418dbc791f0bdb8d4bfc662a9c664
    original_created_at: null
    original_updated_at: null
  - position: 6
    source_id: null
    text: |-
      It's not that difficult.
      The fact that there's a hiragana 'ki' after it tells you that it should be 'oki'. This has nothing to do with this grammar though...
    html: |-
      It's not that difficult.<br/>The fact that there's a hiragana 'ki' after it tells you that it should be 'oki'. This has nothing to do with this grammar though...
