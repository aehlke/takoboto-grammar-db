    original_updated_at: null
  - position: 4
    source_id: null
    text: It is a colloqual form of 放し, meaning doing something and leave it at that.It has a lot more emphasis than ...たままにする.
    html: It is a colloqual form of 放し, meaning doing something and leave it at that.It has a lot more emphasis than ...たままにする.
