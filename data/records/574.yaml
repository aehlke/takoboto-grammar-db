comments:
  - position: 0
    source_id: null
    text: |-
      no (の) can be used in Japanese in so many ways that it's amazing.

      One way is to show ownership:

      This is my room.
      これは私の部屋です。

      Since in Japanese, no plurals exist this particle can act like an 's 

      So:

      Kelly's car is very old.
      ケリーの車はとても古いです。
    html: |-
      no (の) can be used in Japanese in so many ways that it's amazing.<br/><br/>One way is to show ownership:<br/><br/>This is my room.<br/>これは私の部屋です。<br/><br/>Since in Japanese, no plurals exist this particle can act like an 's <br/><br/>So:<br/><br/>Kelly's car is very old.<br/>ケリーの車はとても古いです。
    credits_raw: Sakuratree
