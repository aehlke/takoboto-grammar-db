comments:
  - position: 0
    source_id: null
    text: |-
      Do not confuse なる with 成る (to become). naru here is the 連体形 form of the classical copula なり. It means the same as だ・である・です・…. By using the mizenkei, it can be attributed to nouns. On a side note, a shortening of nari > na is the origin of the well-known な in na-adjectives.
    html: |-
      Do not confuse なる with 成る (to become). naru here is the 連体形 form of the classical copula なり. It means the same as だ・である・です・…. By using the mizenkei, it can be attributed to nouns. On a side note, a shortening of nari &gt; na is the origin of the well-known な in na-adjectives.
    credits_raw: blutorange
