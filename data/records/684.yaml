    text: |-
      I added a See Also to よう...

      Unless I am mistaken if you want to use a noun, you use N + のよう (e.g. 先生のよう). 
      But, for a negative you use N + ではなさそう (e.g. 先生ではなさそう) 

      Also, somewhere I read that the negative for a verb is V (ます form) + そうもありません NOT the そう followed by ではありません mentioned in the first comment. Is this true? 

      As for V-tai form I think たい acts like A1 adjective. 

      いい uses よい instead (e.g. よさそう / よくなさそう) 

      Finally, note that そう acts as な-adj (you can probably guess this from the examples but I thought I would state it explicitly).

      Any corrections very welcome...
    html: |-
      I added a See Also to よう...<br/><br/>Unless I am mistaken if you want to use a noun, you use N + のよう (e.g. 先生のよう). <br/>But, for a negative you use N + ではなさそう (e.g. 先生ではなさそう) <br/><br/>Also, somewhere I read that the negative for a verb is V (ます form) + そうもありません NOT the そう followed by ではありません mentioned in the first comment. Is this true? <br/><br/>As for V-tai form I think たい acts like A1 adjective. <br/><br/>いい uses よい instead (e.g. よさそう / よくなさそう) <br/><br/>Finally, note that そう acts as な-adj (you can probably guess this from the examples but I thought I would state it explicitly).<br/><br/>Any corrections very welcome...
    credits_raw: yookoso
