    text: "= look; look like; appear; seem; feel like\n-auxiliary adjective which indicates that what is expressed by the preceding sentence is THE SPEAKER'S CONJECTURE concerning an event in the future/ present state of someone/ sth (never a past state/event), BASED ON WHAT THE SPEAKER SEES OR FEELS.\n-used only when the speaker directly observes sth\n-cannot be used to express the speaker's conjecture concerning a past event/ state\n-Noun/ Noun+ copula cannot precede sou da (in this case we use rashii), but N+copula neg/nonpast can: \nex: a)* 加藤さんは学生そうだ。\n　　b)*　加藤さんは学生だそうだ。=Mr　Katou looks like a student.　\n　　c)加藤さんは学生じゃなさそうだ。=Mr　Katou　doesn't look like a student。\n- in this construction, the negative form of verbs usually don't precede sou da. Instead, Vmasu sou ni/ mo nai is used:\n a) 彼は車を売りそうに・もない。＝ He doesn't seem to sell his car.\n　　b) この問題は学生は出来そうに・もない。= It doesn't seem that the students can solve this problem.\n-also used to express the speaker's conjecture concerning his own non-volitional future actions based on what he feels:\n a)僕はこのケーキを残しそうだ。＝I'm affraid I can't eat all this cake.\n　b)私はとても疲れていてたおれそうだ。=I'm so tired that I feel weak (lit:like I'm falling down)\n- sou da is a NA Adjective; the prenominal form is SOU NA:\n a) 高そうな車＝a car which looks expensive/ an expensive-looking car\n b)雨が降りそうな空＝(lit:) the sky which looks like it will bring rain"
    html: |-
      = look; look like; appear; seem; feel like<br/>-auxiliary adjective which indicates that what is expressed by the preceding sentence is THE SPEAKER'S CONJECTURE concerning an event in the future/ present state of someone/ sth (never a past state/event), BASED ON WHAT THE SPEAKER SEES OR FEELS.<br/>-used only when the speaker directly observes sth<br/>-cannot be used to express the speaker's conjecture concerning a past event/ state<br/>-Noun/ Noun+ copula cannot precede sou da (in this case we use rashii), but N+copula neg/nonpast can: <br/>ex: a)* 加藤さんは学生そうだ。<br/>　　b)*　加藤さんは学生だそうだ。=Mr　Katou looks like a student.　<br/>　　c)加藤さんは学生じゃなさそうだ。=Mr　Katou　doesn't look like a student。<br/>- in this construction, the negative form of verbs usually don't precede sou da. Instead, Vmasu sou ni/ mo nai is used:<br/> a) 彼は車を売りそうに・もない。＝ He doesn't seem to sell his car.<br/>　　b) この問題は学生は出来そうに・もない。= It doesn't seem that the students can solve this problem.<br/>-also used to express the speaker's conjecture concerning his own non-volitional future actions based on what he feels:<br/> a)僕はこのケーキを残しそうだ。＝I'm affraid I can't eat all this cake.<br/>　b)私はとても疲れていてたおれそうだ。=I'm so tired that I feel weak (lit:like I'm falling down)<br/>- sou da is a NA Adjective; the prenominal form is SOU NA:<br/> a) 高そうな車＝a car which looks expensive/ an expensive-looking car<br/> b)雨が降りそうな空＝(lit:) the sky which looks like it will bring rain
