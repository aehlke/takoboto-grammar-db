comments:
  - position: 0
    source_id: null
    text: |-
      This form is 

      (Verb masu stem) + sou 
      降りそう
      furisou
      = seems it will rain

      (i-Adj base) + sou 
      美味しそう
      oishisou
      = seems delicious

      (na-Adj base) + sou
      暇そう
      himasou
      = seems to have time

      With negatives the -nai becomes -nasa：
      降らなさそう
      furanasasou
      = seems like it won't rain
    html: |-
      This form is <br/><br/>(Verb masu stem) + sou <br/>降りそう<br/>furisou<br/>= seems it will rain<br/><br/>(i-Adj base) + sou <br/>美味しそう<br/>oishisou<br/>= seems delicious<br/><br/>(na-Adj base) + sou<br/>暇そう<br/>himasou<br/>= seems to have time<br/><br/>With negatives the -nai becomes -nasa：<br/>降らなさそう<br/>furanasasou<br/>= seems like it won't rain
