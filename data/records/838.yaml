    text: |-
      １．〜限り／〜ない限り　：〜という状態が続く中では

      ２．〜限りでは：〜範囲では

      ３．〜限りだ：最高に〜だ；（感情を表す形容詞につく）e.g.: 嬉しい限りだ、羨ましい限りだ．．．
      　　「〜限りだ」は一級の文法です。

      ４．〜とは限らない：　絶対〜とは言えない
       Meaning: "It doen't absolutely means that ......" Quite similar to 〜というものではない
