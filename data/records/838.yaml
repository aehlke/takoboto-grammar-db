    text: |-
      There are many other forms using 限る as root besides the ４ in the added notes above:

      １．〜に限ったことではない：　〜だけではない
      e.g. :「いじめは子供の世界に限ったことではない。大人の世界にもある。」

      ２．〜ないとも限らない：　〜可能性がある、「１００％〜ない」とは言えない
      e.g.: 「電車が遅れないとも限らないから、早く家を出ましょう。」

      ３．〜限りで：　〜を最後にして "Until/By this〜" or "By 〜 as the last of..."
      e.g.: 「無料サ―ビスは、今週限りで終わらせて頂きます。」

      ４．〜限りに（一級文法）：　〜を最後にして　"Until/By this〜" or "To the extent of 〜"
      e.g.: 「本日を限りに退職することにしました。」

      ５．〜に限って：〜に合わせるように．．．（不都合な事が起きる） "....(happen) just exactly at the wrong time while 〜"
      e.g.: 「留守の時に限って、荷物が届きます。」」

      ６．〜に限り：　〜だけ
      e.g.: 「成績優秀者に限り学費が免除されます。」

      ７．〜に限らず：　〜だけでなく
      e.g.:　「都合がよければ、授業中に限らず、いつでも
      質問に来てください。」

      ８．〜に限って．．．ない　：〜について（私の考えを）述べるなら、．．．（のような悪いこと）はない
      e.g.: 「あの人に限って、殺人などするはずはない。」
