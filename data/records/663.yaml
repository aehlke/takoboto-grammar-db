    text: |-
      There are two connotations to sou
      note the difference in verb ending

      [sou] they say/i heard
      雨が降るそうです
      fur<b>u</b>-sou
      iku-sou
      omoshiroi-sou
      genki-da sou

      [sou-2] looks like/seems
      雨が降りそうです
      fur<b>i</b>-sou
      omoshiro-sou
      genki-sou
    html: |-
