  - source_id: 6143
    position: 1
    japanese: このような（子供の）態度は、自分たちがある程度独立していることを示そうとしての結果なのである。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e3%81%93%e3%81%ae%e3%82%88%e3%81%86%e3%81%aa"><span>このような</span></a><a href="https://takoboto.jp/?q=%ef%bc%88%e5%ad%90%e4%be%9b%e3%81%ae"><span>（子供の</span></a><a href="https://takoboto.jp/?q=%ef%bc%89%e6%85%8b%e5%ba%a6%e3%81%af%e3%80%81"><span>）態度は、</span></a><a href="https://takoboto.jp/?q=%e8%87%aa%e5%88%86%e3%81%9f%e3%81%a1%e3%81%8c%e3%81%82%e3%82%8b"><span>自分たちがある</span></a><a href="https://takoboto.jp/?q=%e7%a8%8b%e5%ba%a6%e7%8b%ac%e7%ab%8b%e3%81%97%e3%81%a6%e3%81%84%e3%82%8b%e3%81%93%e3%81%a8%e3%82%92"><span>程度独立していることを</span></a><a href="https://takoboto.jp/?q=%e7%a4%ba%e3%81%9d%e3%81%86"><span>示そう</span></a><a href="https://takoboto.jp/?q=%e3%81%a8%e3%81%97%e3%81%a6"><strong>として</strong></a><a href="https://takoboto.jp/?q=%e3%81%ae"><span>の</span></a><a href="https://takoboto.jp/?q=%e7%b5%90%e6%9e%9c%e3%81%aa%e3%81%ae%e3%81%a7%e3%81%82%e3%82%8b%e3%80%82"><span>結果なのである。</span></a>
    segments:
      - text: このような（子供の）態度は、自分たちがある程度独立していることを示そう
        grammar_highlight: false
      - text: として
        grammar_highlight: true
      - text: の結果なのである。
        grammar_highlight: false
    reading: このような（こどもの）たいどは、じぶんたちがあるていどどくりつしていることをしめそうとしてのけっかなのである。
    credits_raw: ziaz
    translations:
      - language: en
        text: This is because they are trying to prove they are somewhat independent.
        html: |-
          <span>This is because they are trying to prove they are somewhat independent. </span>
        segments:
          - text: 'This is because they are trying to prove they are somewhat independent. '
            grammar_highlight: false
