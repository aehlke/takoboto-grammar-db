  - source_id: 6144
    position: 2
    japanese: アイスクリームを食べようとして、スプーンがないことに気が付いた。これでは食べようがない。どうしよう。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e3%82%a2%e3%82%a4%e3%82%b9%e3%82%af%e3%83%aa%e3%83%bc%e3%83%a0%e3%82%92"><span>アイスクリームを</span></a><a href="https://takoboto.jp/?q=%e9%a3%9f%e3%81%b9%e3%82%88%e3%81%86"><span>食べよう</span></a><a href="https://takoboto.jp/?q=%e3%81%a8%e3%81%97%e3%81%a6"><strong>として</strong></a><a href="https://takoboto.jp/?q=%e3%80%81%e3%82%b9%e3%83%97%e3%83%bc%e3%83%b3%e3%81%8c%e3%81%aa%e3%81%84%e3%81%93%e3%81%a8%e3%81%ab"><span>、スプーンがないことに</span></a><a href="https://takoboto.jp/?q=%e6%b0%97%e3%81%8c"><span>気が</span></a><a href="https://takoboto.jp/?q=%e4%bb%98%e3%81%84%e3%81%9f%e3%80%82%e3%81%93%e3%82%8c%e3%81%a7%e3%81%af"><span>付いた。これでは</span></a><a href="https://takoboto.jp/?q=%e9%a3%9f%e3%81%b9%e3%82%88%e3%81%86%e3%81%8c%e3%81%aa%e3%81%84%e3%80%82%e3%81%a9%e3%81%86%e3%81%97%e3%82%88%e3%81%86%e3%80%82"><span>食べようがない。どうしよう。</span></a>
    segments:
      - text: アイスクリームを食べよう
        grammar_highlight: false
      - text: として
        grammar_highlight: true
      - text: 、スプーンがないことに気が付いた。これでは食べようがない。どうしよう。
        grammar_highlight: false
    reading: アイスクリームをたべようとして、スプーンがないことにきがついた。これではたべようがない。どうしよう。
    credits_raw: ziaz
    translations:
      - language: en
        text: |-
          When they were trying to eat ice cream, they noticed they didn't have a spoon. There's no way to eat. What should we do?
        html: |-
          <span>When they were trying to eat ice cream, they noticed they didn't have a spoon. There's no way to eat. What should we do? </span>
        segments:
          - text: "When they were trying to eat ice cream, they noticed they didn't have a spoon. There's no way to eat. What should we do? "
            grammar_highlight: false
