meaning: Probable negative plain verbform. As in, "he probably did not go." Same meaning as -nandarou 〜なんだろう.
meaning_example: 私　は　今　程　に　立派　では　なかったろう、と　思い　ます。(I don't think it could have been nearly as impressive as it is now.)
