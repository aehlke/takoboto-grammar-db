  - position: 10
    source_id: null
    text: |-
      がてら has two meanings. 
      1.verb + がてら + A
       In this case, がてら is used to show another action(A) taken place in the middle of one main action. This can be replaced with ついでに, but not with 兼ねて.

      2. noun(A) + がてら + B
       In this case, it can be replaced with ついでに or 兼ねて. But be carefull, there's a subtle difference between the two. 
      ついでに = doing B while doing A
      兼ねて = doing B with the intention of doing A
    html: |-
      がてら has two meanings. <br/>1.verb + がてら + A<br/> In this case, がてら is used to show another action(A) taken place in the middle of one main action. This can be replaced with ついでに, but not with 兼ねて.<br/><br/>2. noun(A) + がてら + B<br/> In this case, it can be replaced with ついでに or 兼ねて. But be carefull, there's a subtle difference between the two. <br/>ついでに = doing B while doing A<br/>兼ねて = doing B with the intention of doing A
    credits_raw: Iso
