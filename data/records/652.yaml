  - position: 1
    source_id: null
    text: |-
      〜なぁ　Emphasizes the speakers personal feelings as supposed to 〜ね which seeks confirmation from the listener.

      明日は晴といいなぁ　
      it would be nice if it was sunny tomorrow.
      明日は晴といいですね
      wouldn`t it be nice if it was sunny tomorrow.
    html: |-
      〜なぁ　Emphasizes the speakers personal feelings as supposed to 〜ね which seeks confirmation from the listener.<br/><br/>明日は晴といいなぁ　<br/>it would be nice if it was sunny tomorrow.<br/>明日は晴といいですね<br/>wouldn`t it be nice if it was sunny tomorrow.
    credits_raw: tigert
    content_sha256: a111a4744f92ebf9778f7d248522e63d096130de1d661a4641b27b4d9763f20b
