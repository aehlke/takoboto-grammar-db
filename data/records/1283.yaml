  - position: 4
    source_id: null
    text: |-
      DC's explanation is a little misleading
      The three main formations are:
      Noun1 + ならではの Noun2
      (この店ならではのサービス service you can only expect at this shop)

      Nounならではだ
      (学生ならではだ Impossible unless s.o. is a student) 

      Noun ならでは Verb-potential-negative
      (彼ならではできない s.t. cannot be done by anyone else but him)
    html: |-
      DC's explanation is a little misleading<br/>The three main formations are:<br/><strong>Noun1 + ならではの Noun2</strong><br/>(この店ならではのサービス service you can only expect at this shop)<br/><br/><strong>Nounならではだ</strong><br/>(学生ならではだ Impossible unless s.o. is a student) <br/><br/><strong>Noun ならでは Verb-potential-negative</strong><br/>(彼ならではできない s.t. cannot be done by anyone else but him)
    credits_raw: LR
    content_sha256: 80698e2fd93c7271765a202db69b5b7153b0fa463d41ec662a1a5a2b6aa20263
    original_created_at: null
