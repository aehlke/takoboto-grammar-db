  - position: 2
    source_id: null
    text: |-
      My book says that this is for a strange or unexpected event.

      X スイッチを入れるなり電気がついた。
      O スイッチを入れると電気がついた。
      O スイッチを入れるなり爆発が起きた。

      However, my book says it is only used for Verb(辞書形)+なり, but I have sometimes seen cases of Verb(た形)+なり from other sources. Does anyone know which is correct?
    html: |-
      My book says that this is for a strange or unexpected event.<br/><br/>X スイッチを入れるなり電気がついた。<br/>O スイッチを入れると電気がついた。<br/>O スイッチを入れるなり爆発が起きた。<br/><br/>However, my book says it is only used for Verb(辞書形)+なり, but I have sometimes seen cases of Verb(た形)+なり from other sources. Does anyone know which is correct?
    credits_raw: blabby
    content_sha256: 4596c6640eda0c4c84a938376663ac1212cde642e6921c3dfa8d47203ddb5381
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: |-
      Verb(た形)+なり is used in a different way. It implies one movement is continuing. 〜したまま。
      会社を出たなり、いつまでも帰らない。He left the office and hasn't come back.
      彼女を見つめたなり、しばらくの間微動だにしなかった。He stared at her and didn't move an inch for a while.
      You can find better translations.
    html: |-
      Verb(た形)+なり is used in a different way. It implies one movement is continuing. 〜したまま。<br/>会社を出たなり、いつまでも帰らない。He left the office and hasn't come back.<br/>彼女を見つめたなり、しばらくの間微動だにしなかった。He stared at her and didn't move an inch for a while.<br/>You can find better translations.
    credits_raw: Miki
    content_sha256: 0467068a79247cb8da06fd175d3d4eaef97a1ba2ace8d732777abecc0c9a6254
    original_created_at: null
    original_updated_at: null
