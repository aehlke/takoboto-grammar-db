  - position: 0
    source_id: null
    text: |-
      Verb(辞書形) + なり

      [AなりB] - B is often an unexpected or unusual thing.
    html: |-
      Verb(辞書形) + なり<br/><br/>[AなりB] - B is often an unexpected or unusual thing.
    credits_raw: blabby
