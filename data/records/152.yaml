    japanese: 低賃金、劣悪な労働条件、一方的な首切りなどの経済・労働問題はもとより、各種の人道的問題までも引き起こしている。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e4%bd%8e%e8%b3%83%e9%87%91%e3%80%81"><span>低賃金、</span></a><a href="https://takoboto.jp/?q=%e5%8a%a3%e6%82%aa%e3%81%aa"><span>劣悪な</span></a><a href="https://takoboto.jp/?q=%e5%8a%b4%e5%83%8d%e6%9d%a1%e4%bb%b6%e3%80%81"><span>労働条件、</span></a><a href="https://takoboto.jp/?q=%e4%b8%80%e6%96%b9%e7%9a%84%e3%81%aa"><span>一方的な</span></a><a href="https://takoboto.jp/?q=%e9%a6%96%e5%88%87%e3%82%8a%e3%81%aa%e3%81%a9%e3%81%ae"><span>首切りなどの</span></a><a href="https://takoboto.jp/?q=%e7%b5%8c%e6%b8%88%e3%83%bb"><span>経済・</span></a><a href="https://takoboto.jp/?q=%e5%8a%b4%e5%83%8d%e5%95%8f%e9%a1%8c%e3%81%af"><span>労働問題は</span></a><a href="https://takoboto.jp/?q=%e3%82%82%e3%81%a8%e3%82%88%e3%82%8a"><strong>もとより</strong></a><a href="https://takoboto.jp/?q=%e3%80%81"><span>、</span></a><a href="https://takoboto.jp/?q=%e5%90%84%e7%a8%ae%e3%81%ae"><span>各種の</span></a><a href="https://takoboto.jp/?q=%e4%ba%ba%e9%81%93%e7%9a%84%e5%95%8f%e9%a1%8c%e3%81%be%e3%81%a7%e3%82%82"><span>人道的問題までも</span></a><a href="https://takoboto.jp/?q=%e5%bc%95%e3%81%8d"><span>引き</span></a><a href="https://takoboto.jp/?q=%e8%b5%b7%e3%81%93%e3%81%97%e3%81%a6%e3%81%84%e3%82%8b%e3%80%82"><span>起こしている。</span></a>
    segments:
      - text: 低賃金、劣悪な労働条件、一方的な首切りなどの経済・労働問題は
        grammar_highlight: false
      - text: もとより
        grammar_highlight: true
      - text: 、各種の人道的問題までも引き起こしている。
        grammar_highlight: false
    reading: ていちんぎん、れつあくなろうどうじょうけん、いっぽうてきなくびきりなどのけいざい・ろうどうもんだいはもとより、かくしゅのじんどうてきもんだいまでもひきおこしている。
    credits_raw: Amatuka
