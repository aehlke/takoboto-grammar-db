  - position: 0
    source_id: null
    text: |-
      Although this structure is still used in Modern Japanese, it is derived from the Classical Language of long past. まい is a negator, as can be seen in phrases such as 「行くか行くまいか」 ("will or won't go"), which is equivalent to the more modern 「行くかどうか」. Another similar phrase is 「行くか否か」.

       Within the structure V-るまいか, the meaning is "will probably not V", as in
      食べるまいか. It is important to note that this phrase does not change in meaning when the final か is dropped. Observe:
      今学期、私の息子はいい成績を得るまい（か）。
      My son will probably not receive good grades this semester.
    html: |-
      Although this structure is still used in Modern Japanese, it is derived from the Classical Language of long past. まい is a negator, as can be seen in phrases such as 「行くか行くまいか」 ("will or won't go"), which is equivalent to the more modern 「行くかどうか」. Another similar phrase is 「行くか否か」.<br/><br/> Within the structure V-るまいか, the meaning is "will probably not V", as in<br/>食べるまいか. It is important to note that this phrase does not change in meaning when the final か is dropped. Observe:<br/>今学期、私の息子はいい成績を得るまい（か）。<br/>My son will probably not receive good grades this semester.
    credits_raw: KyleGoetz
