    japanese: 以前は経験を元にして設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e4%bb%a5%e5%89%8d%e3%81%af"><span>以前は</span></a><a href="https://takoboto.jp/?q=%e7%b5%8c%e9%a8%93"><span>経験</span></a><a href="https://takoboto.jp/?q=%e3%82%92%e5%85%83%e3%81%ab%e3%81%97%e3%81%a6"><strong>を元にして</strong></a><a href="https://takoboto.jp/?q=%e8%a8%ad%e8%a8%88%e3%81%97%e3%81%a6%e3%81%84%e3%81%be%e3%81%97%e3%81%9f%e3%81%8c%e3%80%81+"><span>設計していましたが、 </span></a><a href="https://takoboto.jp/?q=%e4%bb%8a%e3%82%84"><span>今や</span></a><a href="https://takoboto.jp/?q=%e7%b5%8c%e9%a8%93%e3%81%a8"><span>経験と</span></a><a href="https://takoboto.jp/?q=%e5%8b%98%e3%81%a0%e3%81%91%e3%81%a7%e3%81%af%e3%83%ac%e3%83%bc%e3%82%b9%e3%81%ab"><span>勘だけではレースに</span></a><a href="https://takoboto.jp/?q=%e5%8b%9d%e3%81%a6%e3%82%8b%e3%82%88%e3%81%86%e3%81%aa+%e3%83%9e%e3%82%b7%e3%83%b3%e3%82%92"><span>勝てるような マシンを</span></a><a href="https://takoboto.jp/?q=%e4%bd%9c%e3%82%8b%e3%81%93%e3%81%a8%e3%81%af%e3%81%a7%e3%81%8d%e3%81%be%e3%81%9b%e3%82%93%e3%80%82"><span>作ることはできません。</span></a>
    segments:
      - text: 以前は経験
        grammar_highlight: false
      - text: を元にして
        grammar_highlight: true
      - text: 設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。
        grammar_highlight: false
    reading: いぜんはけいけんをもとにしてせっけいしていましたが、いまやけいけんとかんだけではレースにかてるようなマシンをつくることはできません。
    credits_raw: Amatuka
    translations:
