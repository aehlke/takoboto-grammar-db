    japanese: 自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e8%87%aa%e5%88%86%e3%81%8c"><span>自分が</span></a><a href="https://takoboto.jp/?q=%e9%9b%86%e3%82%81%e3%81%9f"><span>集めた</span></a><a href="https://takoboto.jp/?q=%e4%ba%8b%e5%ae%9f"><span>事実</span></a><a href="https://takoboto.jp/?q=%e3%82%92%e3%82%82%e3%81%a8%e3%81%ab%e3%81%97%e3%81%a6"><strong>をもとにして</strong></a><a href="https://takoboto.jp/?q=%e3%80%81"><span>、</span></a><a href="https://takoboto.jp/?q=%e7%a7%91%e5%ad%a6%e8%80%85%e3%81%af%e3%80%81%e3%81%9d%e3%81%ae"><span>科学者は、その</span></a><a href="https://takoboto.jp/?q=%e4%ba%8b%e5%ae%9f%e3%81%ab"><span>事実に</span></a><a href="https://takoboto.jp/?q=%e6%84%8f%e5%91%b3%e3%81%a8"><span>意味と</span></a><a href="https://takoboto.jp/?q=%e7%a7%a9%e5%ba%8f%e3%81%a8"><span>秩序と</span></a><a href="https://takoboto.jp/?q=%e5%8b%9d%e3%81%a1%e3%82%92"><span>勝ちを</span></a><a href="https://takoboto.jp/?q=%e4%b8%8e%e3%81%88%e3%82%8b"><span>与える</span></a><a href="https://takoboto.jp/?q=%e8%ab%96%e7%90%86%e3%81%ae"><span>論理の</span></a><a href="https://takoboto.jp/?q=%e6%a8%a1%e6%a7%98%e3%81%99%e3%81%aa%e3%82%8f%e3%81%a1"><span>模様すなわち</span></a><a href="https://takoboto.jp/?q=%e7%90%86%e8%ab%96%e3%82%92"><span>理論を</span></a><a href="https://takoboto.jp/?q=%e7%b9%94%e3%82%8a%e3%81%82%e3%81%92%e3%82%8b%e3%81%ae%e3%81%a7%e3%81%82%e3%82%8b%e3%80%82"><span>織りあげるのである。</span></a>
    segments:
      - text: 自分が集めた事実
        grammar_highlight: false
      - text: をもとにして
        grammar_highlight: true
      - text: 、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。
        grammar_highlight: false
    reading: じぶんがあつめたじじつをもとにして、かがくしゃは、そのじじつにいみとちつじょとかちをあたえるろんりのもようすなわちりろんをおりあげるのである。
    credits_raw: dc
    translations:
      - language: en
        text: |-
          Around his facts the scientist weaves a logical pattern or theory which gives the facts meaning, order, and significance.
