    segments:
      - text: お金のために、愛してもいない男との生活を
        grammar_highlight: false
      - text: つづける
        grammar_highlight: true
      - text: ならば、すっかり失望して、進退きわまる時が将来やってくることだろう。
        grammar_highlight: false
    reading: おかねのために、あいしてもいないおとことのせいかつをつづけるならば、すっかりしつぼうして、しんたいきわまるときがしょうらいやってくることだろう。
    credits_raw: Miki
    translations:
      - language: en
        text: |-
          If she continues to live with a man she doesn't love for his money, the day will come when she will be utterly frustrated and between the devil and the deep blue sea.
