meaning: While 〜 To take advantage of a moment of time to do something　(there is an element of cunning in its meaning)
meaning_example: |-
  (1)kare ga ｙudan shiteiru suki ni kishuu shite hoshin da zo. The best thing to do is to attack him when his guard is down.
meaning_notes:
  - language: ja
    text: 時間に少し開いている隙間を最高の機会とし、そのチャンスを逃さないうちにずるかしこい行為をする。
    html: 時間に少し開いている隙間を最高の機会とし、そのチャンスを逃さないうちにずるかしこい行為をする。
