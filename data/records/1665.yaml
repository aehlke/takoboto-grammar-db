    text: |-
      VBryk (masu)+ kakaru
      - a directed movement works on something/ someone

      ex: 道を歩いていたら,男が僕に殴りかかってきた。When I was walking along the street, a man came to hit me.
       
      ex: 花子は太郎の肩にもたれかかった。
      Hanako leaned on Taro's shoulder

