  - position: 6
    source_id: null
    text: |-
      もがな dates bqck to the Heian era, and it means that what precedes もがな would be the desire of the speaker. It is an archaic Japanese which only finds its use in some set expressions, such as 言わずもがな,which literally would mean "I desire that I do not say that" that would include the case of my regret for having said what I said.
      My 広辞苑 shows the following:
      あらずもがな、言わずもがな、無くもがな、やらずもがな and 由もがな.
      While 買わずもがな is grammatically correct, I am not sure if it is actually used.
      In any event, except perhaps 言わずもがな, all other instances of the use of もがな are pretty archaic.
    html: |-
      もがな dates bqck to the Heian era, and it means that what precedes もがな would be the desire of the speaker. It is an archaic Japanese which only finds its use in some set expressions, such as 言わずもがな,which literally would mean "I desire that I do not say that" that would include the case of my regret for having said what I said.<br/>My 広辞苑 shows the following:<br/>あらずもがな、言わずもがな、無くもがな、やらずもがな and 由もがな.<br/>While 買わずもがな is grammatically correct, I am not sure if it is actually used.<br/>In any event, except perhaps 言わずもがな, all other instances of the use of もがな are pretty archaic.
    credits_raw: bamboo4
    content_sha256: ed5f36c85a18a8d983b905b241b5a62082f7c89264a7425ef852db03b7588fd0
    original_created_at: null
