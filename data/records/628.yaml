    source_id: null
    text: |-
      Contrary to what big fat header in notes says, there does exist a usage of ね not at the end of sentence. This is similar to English meaningless "like", as in:

      それで、彼はね、全部納豆がきらいんだよったね。
      So, he was all like, "I hate nattou", right.

      Here the first ね serves only the purpose of engaging the listener more, and just like in English, it can be overused easily.
    html: |-
      Contrary to what big fat header in notes says, there does exist a usage of ね not at the end of sentence. This is similar to English meaningless "like", as in:<br/><br/>それで、彼はね、全部納豆がきらいんだよったね。<br/>So, he was all like, "I hate nattou", right.<br/><br/>Here the first ね serves only the purpose of engaging the listener more, and just like in English, it can be overused easily.
