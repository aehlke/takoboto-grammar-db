comments:
  - position: 0
    source_id: null
    text: "VBryk（ます）\n→　an event is about to take place\n→　the VB is usually intransitive and has to be a Non-volitional, punctual VB\n→　can be replaced by KAKERU without a substantial change of meaning\n　　　　死にかかった＝faced death\n　　　　死に掛けた＝was half dead\n\n(Punctual VBs: \n：a Punctual VB with the auxiliary VB いる expresses a repeated action or a state after an action was taken or something took place:\n 知る（=>知っている）(get to know after studying)\n　死ぬ（=>死んでいる）(die after living)\n　忘れる（=>忘れている）(as a result of the passage of time)\n 飛ぶ、乗る、起きる、結婚する、困る,... ）\n(Non-volitional VBs:\n：a Non-volitional VB usually does not take the voltional form, the imperative form and the potential form.\n-Non-volitional VBs are classified into emotive VBs and non-emotive VBs\na) emotive VBs: 喜ぶ、悲しむ、好む、怒る、嫌う、苦しむ、…\nb).non-emotive VBｓ： 出来る、要る、知る、見える、聞こえる、似合う、違う、疲れる、分かる）"
    html: |-
      VBryk（ます）<br/>→　an event is about to take place<br/>→　the VB is usually intransitive and has to be a Non-volitional, punctual VB<br/>→　can be replaced by KAKERU without a substantial change of meaning<br/>　　　　死にかかった＝faced death<br/>　　　　死に掛けた＝was half dead<br/><br/>(Punctual VBs: <br/>：a Punctual VB with the auxiliary VB いる expresses a repeated action or a state after an action was taken or something took place:<br/> 知る（=&gt;知っている）(get to know after studying)<br/>　死ぬ（=&gt;死んでいる）(die after living)<br/>　忘れる（=&gt;忘れている）(as a result of the passage of time)<br/> 飛ぶ、乗る、起きる、結婚する、困る,... ）<br/>(Non-volitional VBs:<br/>：a Non-volitional VB usually does not take the voltional form, the imperative form and the potential form.<br/>-Non-volitional VBs are classified into emotive VBs and non-emotive VBs<br/>a) emotive VBs: 喜ぶ、悲しむ、好む、怒る、嫌う、苦しむ、…<br/>b).non-emotive VBｓ： 出来る、要る、知る、見える、聞こえる、似合う、違う、疲れる、分かる）
    credits_raw: deeana
