comments:
  - position: 0
    source_id: null
    text: |-
      ＊Ｖ(nonpast dict. form) + に従って/に従い is used to express that something beyond human control takes place simultaneously with something else that goes on. The verbs in both main and subordinate clauses do not express a momentary action, but a continuous process. See example #6351.
      ＊In the case of Ｎ + に従って/に従い, the previous note is not applicable. When used after a noun, this construction expresses that what occurs is momentary or non-spontaneous. See example #6350.
      ＊This grammar CANNOT be preceeded by an adjective or the copula verb (だ/です). Preceeding verbs must be nonpast.
      ＊従い is used in written Japanese whereas 従って is used in both written and spoken Japanese.

      FORMATION:
      Ｖ(dict. form) + に従って/に従い
      Ｎ + に従って/に従い
