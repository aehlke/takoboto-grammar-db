  - position: 1
    source_id: null
    text: |-
      Not used for "feeling" something, where you should use [tenaranai]

      -- doing
      I can't help shopping
      買い物せずにはいられない
      買い物しないではいられない

      -- feeling
      I can't help feeling anxious
      NG: 私は不安しないではいられない
      OK: 私は不安でならない
    html: |-
      Not used for "feeling" something, where you should use [tenaranai]<br/><br/>-- doing<br/>I can't help shopping<br/>買い物せずにはいられない<br/>買い物しないではいられない<br/><br/>-- feeling<br/>I can't help feeling anxious<br/>NG: 私は不安しないではいられない<br/>OK: 私は不安でならない
    credits_raw: dc
