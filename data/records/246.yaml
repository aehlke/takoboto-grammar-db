comments:
  - position: 0
    source_id: null
    text: |-
      (名詞)＋〜のことだから:〜という特徴のある．．．だから．．．（〜と予想される）

      Therefore, it has the meaning of :

      "It is therefore typical of he/she to ....,being (serious, ect) all this while"

      "Being a (characteristics,e.g. serious) person, it is typical of he/she to..."

      "As it is known for his/her 〜, he/she will therefore .... "

      "Known for his/her 〜, he/ she will therefore .... "
    html: |-
      (名詞)＋〜のことだから:〜という特徴のある．．．だから．．．（〜と予想される）<br/><br/>Therefore, it has the meaning of :<br/><br/>"It is therefore typical of he/she to ....,being (serious, ect) all this while"<br/><br/>"Being a (characteristics,e.g. serious) person, it is typical of he/she to..."<br/><br/>"As it is known for his/her 〜, he/she will therefore .... "<br/><br/>"Known for his/her 〜, he/ she will therefore .... "
