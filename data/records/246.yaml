  - position: 3
    source_id: null
    text: In modern day Japanese, you can say ことだから without using 事.
    html: In modern day Japanese, you can say ことだから without using 事.
    credits_raw: bamboo4
    content_sha256: 6aef9732de52fa111face2282f71165cce335b287aa4036dea50285214d41510
