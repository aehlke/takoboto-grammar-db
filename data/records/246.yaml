  - position: 1
    source_id: null
    text: |-
      This is the only acceptable use of this grammar:
      Ｎ + の + ことだから

      「Ａ(の)ことだから、Ｂ」
      The case where Ａ is a person occurs often. Ｂ predicts or anticipates the nature or usual circumstances of Ａ.
    html: |-
      This is the only acceptable use of this grammar:<br/>Ｎ + の + ことだから<br/><br/>「Ａ(の)ことだから、Ｂ」<br/>The case where Ａ is a person occurs often. Ｂ predicts or anticipates the nature or usual circumstances of Ａ.
    credits_raw: rubyhatchet
