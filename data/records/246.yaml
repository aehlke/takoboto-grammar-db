  - position: 2
    source_id: null
    text: |-
      Only ex#251 fits into this category of grammar, ex #3788, ex #3790 , ex #3792 all not examples of this grammar pattern, they are こと(事） ＋ だから。Therefore is :

      ex#3788 : そういうこと　＋　だから
      ex#3790 : 大事なこと　＋　だから
      ex#3792 : やったこと　＋　だから
      The above 3 examples, こと can be replaced by 事
    html: |-
      Only ex#251 fits into this category of grammar, ex #3788, ex #3790 , ex #3792 all not examples of this grammar pattern, they are こと(事） ＋ だから。Therefore is :<br/><br/>ex#3788 : そういうこと　＋　だから<br/>ex#3790 : 大事なこと　＋　だから<br/>ex#3792 : やったこと　＋　だから<br/>The above 3 examples, こと can be replaced by 事
    credits_raw: 誠
