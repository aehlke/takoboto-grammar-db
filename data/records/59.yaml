    japanese: 冬の真っ最中の登山は十分な冬山の経験がなかったらやめるべきです。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e5%86%ac%e3%81%ae"><span>冬の</span></a><a href="https://takoboto.jp/?q=%e7%9c%9f%e3%81%a3%e6%9c%80%e4%b8%ad%e3%81%ae"><strong>真っ最中の</strong></a><a href="https://takoboto.jp/?q=%e7%99%bb%e5%b1%b1%e3%81%af"><span>登山は</span></a><a href="https://takoboto.jp/?q=%e5%8d%81%e5%88%86%e3%81%aa"><span>十分な</span></a><a href="https://takoboto.jp/?q=%e5%86%ac%e5%b1%b1%e3%81%ae"><span>冬山の</span></a><a href="https://takoboto.jp/?q=%e7%b5%8c%e9%a8%93%e3%81%8c%e3%81%aa%e3%81%8b%e3%81%a3%e3%81%9f%e3%82%89%e3%82%84%e3%82%81%e3%82%8b%e3%81%b9%e3%81%8d%e3%81%a7%e3%81%99%e3%80%82"><span>経験がなかったらやめるべきです。</span></a>
    segments:
      - text: 冬の
        grammar_highlight: false
      - text: 真っ最中の
        grammar_highlight: true
      - text: 登山は十分な冬山の経験がなかったらやめるべきです。
        grammar_highlight: false
    reading: ふゆのまっさいちゅうのとざんはじゅうぶんなふゆやまのけいけんがなかったらやめるべきです。
    credits_raw: bamboo4
    translations:
      - language: en
        text: |-
          You should stay away from mountain climbing in the midst of winter unless you have ample experience in mountais in the winter .
        html: |-
          <span>You should stay away from mountain climbing </span><strong>in the midst of </strong><span>winter unless you have ample experience in mountais in the winter . </span>
        segments:
          - text: 'You should stay away from mountain climbing '
            grammar_highlight: false
          - text: 'in the midst of '
            grammar_highlight: true
          - text: 'winter unless you have ample experience in mountais in the winter . '
