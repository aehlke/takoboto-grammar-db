      Good point Saralynne, 

      Its important to remember that although some grammar constructions can only be used in combination with a noun, In Japanese turning a verb into a noun is rather simple. こと、の、or just slap a noun right after the dict-form of a verb and you can use it with any construction you want. 

      Hey prachi, 
       Hoshi isn`t always used with nouns its also used with verbs to express that you want others do do something for you. して欲しい
    html: |-
      Good point Saralynne, <br/><br/>Its important to remember that although some grammar constructions can only be used in combination with a noun, In Japanese turning a verb into a noun is rather simple. こと、の、or just slap a noun right after the dict-form of a verb and you can use it with any construction you want. <br/><br/>Hey prachi, <br/> Hoshi isn`t always used with nouns its also used with verbs to express that you want others do do something for you. して欲しい
