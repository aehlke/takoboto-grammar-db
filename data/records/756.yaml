      You can also use hoshi to express your desire for someone else to do something.

      私はキムさんがケーキを食べてほしいですが
      I want kim to eat cake, but ....

      for the most part you can exclude 私は because its implied by the grammar. the person you want to complete the action takes the が　particle and the verb takes the てform followed by the 欲しい statement 欲しいです

      the final が at the end of the sentence means "but" and is used to soften the tone of the request.
    html: |-
      You can also use hoshi to express your desire for someone else to do something.<br/><br/>私はキムさんがケーキを食べてほしいですが<br/>I want kim to eat cake, but ....<br/><br/>for the most part you can exclude 私は because its implied by the grammar. the person you want to complete the action takes the が　particle and the verb takes the てform followed by the 欲しい statement 欲しいです<br/><br/>the final が at the end of the sentence means "but" and is used to soften the tone of the request.
