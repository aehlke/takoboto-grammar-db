    text: |-
      Hey groove in your second example. I don`t think you need the する.

      思い出す is a verb already. other than that I like your explaination very clear I added a vocabulary note for yasui
    html: |-
      Hey groove in your second example. I don`t think you need the する.<br/><br/>思い出す is a verb already. other than that I like your explaination very clear I added a vocabulary note for yasui
    credits_raw: tigert
    content_sha256: b86421261815c1ac81977c4dc53e2de8a67d4f896fbde01a40d2b8b9eeeedca9
    original_created_at: null
    original_updated_at: null
  - position: 5
    source_id: null
    text: |-
      The different is that 難い is added to a verb stem to change it to an adjective, whereas 難しい is an existing adjective meaning 'difficult', and thus can't be conjugated to a verb stem.

      For example:

      That word is difficult to remember (lit. That word's remembering is difficult.)
      その言葉が思い出し難いな。

      as compared to:

      Remembering that word is difficult (lit. That word's remembering is difficult).
      その言葉は思い出すことが難しいだ。

      EDIT 10/15/07: You're right; thanks tiger!
    html: |-
      The different is that 難い is added to a verb stem to change it to an adjective, whereas 難しい is an existing adjective meaning 'difficult', and thus can't be conjugated to a verb stem.<br/><br/>For example:<br/><br/>That word is difficult to remember (lit. That word's remembering is difficult.)<br/>その言葉が思い出し難いな。<br/><br/>as compared to:<br/><br/>Remembering that word is difficult (lit. That word's remembering is difficult).<br/>その言葉は思い出すことが難しいだ。<br/><br/>EDIT 10/15/07: You're right; thanks tiger!
    credits_raw: Groove
