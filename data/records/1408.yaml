    text: What's the difference between むずかしい and にくい?
    html: What's the difference between むずかしい and にくい?
    credits_raw: crbennett
    content_sha256: 64cfced55036b6cc8b4d0a4d4c2aff8118efabab38207f88d7bc2de4d3ad1323
