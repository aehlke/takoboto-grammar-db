    text: |-
      Yahoo辞書に下記の解説を書いてあります：
      動詞の連用形に付いて、自分の思いのままにする意を浮ｷ。うまく…する。完全に…する。「使い―・す」「乗り―・す」「読み―・す」

      だから、[使いこなす]とは、deal with expertly, skilled.
      だが、「こなす」は単独に使う時、complete；finishの意味をあります。
      その仕事をこなす。
    html: |-
      Yahoo辞書に下記の解説を書いてあります：<br/>動詞の連用形に付いて、自分の思いのままにする意を浮ｷ。うまく…する。完全に…する。「使い―・す」「乗り―・す」「読み―・す」<br/><br/>だから、[使いこなす]とは、deal with expertly, skilled.<br/>だが、「こなす」は単独に使う時、complete；finishの意味をあります。<br/>その仕事をこなす。
    credits_raw: williamking
