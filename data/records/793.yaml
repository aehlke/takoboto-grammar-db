    text: "Ex 6117 seems like it should be ことになる　instead of ことになっている. \nI think it would be more natural to say, It has been decided that my daughter will study abroad next year. IE.\n\n娘は来年､留学することになりました．\n\nIf you use になっている here it expresses more of a continued state, or a rule/custom."
    html: |-
      Ex 6117 seems like it should be ことになる　instead of ことになっている. <br/>I think it would be more natural to say, It has been decided that my daughter will study abroad next year. IE.<br/><br/>娘は来年､留学することになりました．<br/><br/>If you use になっている here it expresses more of a continued state, or a rule/custom.
