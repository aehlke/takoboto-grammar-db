    text: "note that the word 用 (you) on its own means \"something to do\". As in \n　ようがある\n　i have to do some errands\n\nso that leads to this confusion:\n\n行く用がない = I have no *reason* to go there\n(Lit: I have nothing to do when i get there)\n\n行きようがない = I have no *way* to get there\n\n1) 連絡するようがない\n　　no business to contact them for\n2) 連絡しようがない\n no way to contact"
    html: |-
      note that the word 用 (you) on its own means "something to do". As in <br/>　ようがある<br/>　i have to do some errands<br/><br/>so that leads to this confusion:<br/><br/>行く用がない = I have no *reason* to go there<br/>(Lit: I have nothing to do when i get there)<br/><br/>行きようがない = I have no *way* to get there<br/><br/>1) 連絡するようがない<br/>　　no business to contact them for<br/>2) 連絡しようがない<br/> no way to contact
    credits_raw: dc
