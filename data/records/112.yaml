    text: |-
      Whereas [noni / のに] is neutral in use, kuseni / くせに is used when expressing annoyance, criticism, or anger. Also, [ni mo kakawarazu / にもかかわらず] expresses a similar idea, but it is a highly formal and bookish expression with no emotion. It cannot be used in highly emotive situations.
    html: |-
      Whereas [noni / のに] is neutral in use, kuseni / くせに is used when expressing annoyance, criticism, or anger. Also, [ni mo kakawarazu / にもかかわらず] expresses a similar idea, but it is a highly formal and bookish expression with no emotion. It cannot be used in highly emotive situations.
    credits_raw: rubyhatchet
    content_sha256: 5bd11e25ed2c180b27d5b08eeea7943935af5cc782ae19535b4263b8e25273ea
    original_created_at: null
    original_updated_at: null
  - position: 2
    source_id: null
    text: |-
      [kuseni / くせに] cannot be used in the first person. Also, the main clause and the subordinate clause must share the same subject. The following two sentences are INGRAMMATICAL:
      1. 良子はまだ学生のくせに両親は彼女に高いマンションを買ってやった。(Although Yoshiko is still a student, her parents have bought her an expensive condominium.)
      CHANGE TO -->良子はまだ学生[なのに / にもかかわらず]両親は彼女に高いマンションを買ってやった。

      2. 私は日本人のくせに日本の国家が歌えない。(Though I am Japanese, I cannot sing the Japanese national anthem.)
      CHANGE TO --> 私は日本人[なのに / にもかかわらず]日本の国家が歌えない。
    html: |-
      [kuseni / くせに] cannot be used in the first person. Also, the main clause and the subordinate clause must share the same subject. The following two sentences are INGRAMMATICAL:<br/>1. 良子はまだ学生のくせに両親は彼女に高いマンションを買ってやった。(Although Yoshiko is still a student, her parents have bought her an expensive condominium.)<br/>CHANGE TO --&gt;良子はまだ学生[なのに / にもかかわらず]両親は彼女に高いマンションを買ってやった。<br/><br/>2. 私は日本人のくせに日本の国家が歌えない。(Though I am Japanese, I cannot sing the Japanese national anthem.)<br/>CHANGE TO --&gt; 私は日本人[なのに / にもかかわらず]日本の国家が歌えない。
    credits_raw: rubyhatchet
    content_sha256: 02e434b68f0afe6cb2c2c4122e1506d3890d26778468f0a9e3af1751c8c6d4b3
    original_created_at: null
