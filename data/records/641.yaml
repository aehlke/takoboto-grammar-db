    text: This use of の looks similar to use of "koto" (事) after verbs, doesn't it? Like in "話す事 が 出来る" = "I can speak".
    html: This use of の looks similar to use of "koto" (事) after verbs, doesn't it? Like in "話す事 が 出来る" = "I can speak".
    credits_raw: '9000'
    content_sha256: 8cacd64ae37cd8afbb4ae49852ca3f967acea7744b8de057e337bc87bd1f13d4
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: Yes, but their uses have different rules. Koto is used for more abstract things than no.
    html: Yes, but their uses have different rules. Koto is used for more abstract things than no.
    credits_raw: DarrkAngel
    content_sha256: 2006340bdce15a91612a0e6b45b0ea87bfffa17ab43d7eb1d89e49d6e5bc735a
