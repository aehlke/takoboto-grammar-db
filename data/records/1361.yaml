    japanese: どんな人であろうと、この映画は楽しめます。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e3%81%a9%e3%82%93%e3%81%aa"><span>どんな</span></a><a href="https://takoboto.jp/?q=%e4%ba%ba"><span>人</span></a><a href="https://takoboto.jp/?q=%e3%81%a7%e3%81%82%e3%82%8d%e3%81%86"><strong>であろう</strong></a><a href="https://takoboto.jp/?q=%e3%81%a8%e3%80%81%e3%81%93%e3%81%ae"><span>と、この</span></a><a href="https://takoboto.jp/?q=%e6%98%a0%e7%94%bb%e3%81%af"><span>映画は</span></a><a href="https://takoboto.jp/?q=%e6%a5%bd%e3%81%97%e3%82%81%e3%81%be%e3%81%99%e3%80%82"><span>楽しめます。</span></a>
