    source_id: null
    text: |-
      dekirudake + adverb means "as much as (adverb)".
      its used as an almost set phrase with 'hayaku':early/fast.
      dekirudake hayaku: as quickly/soon/early as possible.
    html: |-
      dekirudake + adverb means "as much as (adverb)".<br/>its used as an almost set phrase with 'hayaku':early/fast.<br/>dekirudake hayaku: as quickly/soon/early as possible.
    credits_raw: dc
    content_sha256: 96a81d8016c72c9342f2852aecc483326431039c577bfde28ed46edecffd756d
    original_created_at: null
    original_updated_at: null
