    text: |-
      >誠
      Thanks for your great contributions to this site!
      Yes you are correct that わけがない and ことができない are good translations for "by no means"/"impossible". 

      However, this example uses "読める" which is like saying "できるものではない" rather than just "ものではない". Therefore I stand by my translation.
    html: |-
      &gt;誠<br/>Thanks for your great contributions to this site!<br/>Yes you are correct that わけがない and ことができない are good translations for "by no means"/"impossible". <br/><br/>However, this example uses "読める" which is like saying "できるものではない" rather than just "ものではない". Therefore I stand by my translation.
    credits_raw: blabby
