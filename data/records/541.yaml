    japanese: 私たちは みな、 人生に おいて 成功を 収めようとするが、成功するのは、きわめて 数少ない人たちである。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e7%a7%81%e3%81%9f%e3%81%a1%e3%81%af+%e3%81%bf%e3%81%aa%e3%80%81+"><span>私たちは みな、 </span></a><a href="https://takoboto.jp/?q=%e4%ba%ba%e7%94%9f%e3%81%ab+%e3%81%8a%e3%81%84%e3%81%a6+"><span>人生に おいて </span></a><a href="https://takoboto.jp/?q=%e6%88%90%e5%8a%9f%e3%82%92+"><span>成功を </span></a><a href="https://takoboto.jp/?q=%e5%8f%8e%e3%82%81%e3%82%88%e3%81%86"><span>収めよう</span></a><a href="https://takoboto.jp/?q=%e3%81%a8%e3%81%99%e3%82%8b"><strong>とする</strong></a><a href="https://takoboto.jp/?q=%e3%81%8c%e3%80%81"><span>が、</span></a><a href="https://takoboto.jp/?q=%e6%88%90%e5%8a%9f%e3%81%99%e3%82%8b%e3%81%ae%e3%81%af%e3%80%81%e3%81%8d%e3%82%8f%e3%82%81%e3%81%a6+"><span>成功するのは、きわめて </span></a><a href="https://takoboto.jp/?q=%e6%95%b0%e5%b0%91%e3%81%aa%e3%81%84"><span>数少ない</span></a><a href="https://takoboto.jp/?q=%e4%ba%ba%e3%81%9f%e3%81%a1%e3%81%a7%e3%81%82%e3%82%8b%e3%80%82"><span>人たちである。</span></a>
    segments:
      - text: 私たちは みな、 人生に おいて 成功を 収めよう
        grammar_highlight: false
      - text: とする
        grammar_highlight: true
      - text: が、成功するのは、きわめて 数少ない人たちである。
        grammar_highlight: false
    reading: わたしたちはみな、じんせいにおいてせいこうをおさめようとするが、せいこうするのは、きわめてかずすくないひとたちである。
    credits_raw: rolando
    translations:
      - language: en
        text: We all try hard to make the grade in life, but only a few succeed.
        html: |-
          <span>We all try hard to make the grade in life, but only a few succeed. </span>
        segments:
          - text: 'We all try hard to make the grade in life, but only a few succeed. '
            grammar_highlight: false
