comments:
  - position: 0
    source_id: null
    text: |-
      か has many uses but it can be used as a question mark, just like what we have in English:

      Did he eat dinner?
      彼は夕方ご飯を食べましたか。

      Did he go to Japan last year?
      来年彼は日本に行きましたか。
    html: |-
      か has many uses but it can be used as a question mark, just like what we have in English:<br/><br/>Did he eat dinner?<br/>彼は夕方ご飯を食べましたか。<br/><br/>Did he go to Japan last year?<br/>来年彼は日本に行きましたか。
    credits_raw: Sakuratree
