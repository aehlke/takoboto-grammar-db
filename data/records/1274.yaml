  - position: 6
    source_id: null
    text: "平日に仕事をするかたわら、休みの日にはボランティアをしている。\nBesides working during the week, (he/she/they)do/does volunteer work on (his/her/their) days off.\n\nYou could also replace \"besides\" with \"while\". かたわら is used figuratively and not. \nWhen used after a verb it usually means 〜しながら、同時に\nWhen used after a noun it usually means \"to be physicaly beside\".\nかたわらに置いています　\"placed beside\"\n〜のかたわらに \"beside 〜\" \nThere should most definatley be another meaning and example added to the entry."
    html: |-
      平日に仕事をするかたわら、休みの日にはボランティアをしている。<br/>Besides working during the week, (he/she/they)do/does volunteer work on (his/her/their) days off.<br/><br/>You could also replace "besides" with "while". かたわら is used figuratively and not. <br/>When used after a verb it usually means 〜しながら、同時に<br/>When used after a noun it usually means "to be physicaly beside".<br/>かたわらに置いています　"placed beside"<br/>〜のかたわらに "beside 〜" <br/>There should most definatley be another meaning and example added to the entry.
    credits_raw: crlane
