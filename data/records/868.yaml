    text: "〜たform of verb + ところで\nand just ところで、ちがうのものです。\nIf it is just ところで,which being used at the beginning of a separate sentence, it means 'By the way'.\nIf it is a verb in 〜たform + ところで　、then it is \n「〜ても．．．」という意味です。（希望どおりにはならないだろう）"
    html: |-
      〜たform of verb + ところで<br/>and just ところで、ちがうのものです。<br/>If it is just ところで,which being used at the beginning of a separate sentence, it means 'By the way'.<br/>If it is a verb in 〜たform + ところで　、then it is <br/>「〜ても．．．」という意味です。（希望どおりにはならないだろう）
