  - position: 1
    source_id: null
    text: |-
      different ways of saying "by the way"

      chinami ni > related to that...
      tokorode > by the way (unrelated)
      soieba > speaking of that

      from here

      「ところで」は、今まで話していた事とまったく違う話題に変えるとき使います。「ちなみに」は、今まで話していたことと関連して他の例などを挙げるときや、ある話題に対して相手の感想などを聞くときにも使います。だから「ところで」と「ちなみに」はまったく違う意味を持っています。
    html: |-
      different ways of saying "by the way"<br/><br/>chinami ni &gt; related to that...<br/>tokorode &gt; by the way (unrelated)<br/>soieba &gt; speaking of that<br/><br/>from here<br/><br/>「ところで」は、今まで話していた事とまったく違う話題に変えるとき使います。「ちなみに」は、今まで話していたことと関連して他の例などを挙げるときや、ある話題に対して相手の感想などを聞くときにも使います。だから「ところで」と「ちなみに」はまったく違う意味を持っています。
    credits_raw: dc
