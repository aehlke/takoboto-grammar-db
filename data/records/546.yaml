    text: |-
      You can concede a point in a debate, it doesn't imply total defeat. You can concede territory in a board game without losing the game.

      Just because part of the meaning of "concede" is "to give something up" doesn't mean one can't clarify specifically *what* is being given up.

      If we say "To quit now only means that we have conceded." the statement becomes totally superfluous. It means "Quiting means we quit." Well, duh. Without the word "defeat" there is no comparison of A to B. Defeat is a broader concept than "conceding".
    html: |-
      You can concede a point in a debate, it doesn't imply total defeat. You can concede territory in a board game without losing the game.<br/><br/>Just because part of the meaning of "concede" is "to give something up" doesn't mean one can't clarify specifically *what* is being given up.<br/><br/>If we say "To quit now only means that we have conceded." the statement becomes totally superfluous. It means "Quiting means we quit." Well, duh. Without the word "defeat" there is no comparison of A to B. Defeat is a broader concept than "conceding".
    credits_raw: Radish
