    text: |-
      Conjugation:

      (plain form) + はず

      イー形容詞：　高いはず　　→　高かったはずです。
      なー形容詞：　静かなはず　→　静かだったはずです。
      　　　名詞：　学生の　　　→　学生だったはずです
       動詞： 話す → 話したはずです
    html: |-
      Conjugation:<br/><br/>(plain form) + はず<br/><br/>イー形容詞：　高いはず　　→　高かったはずです。<br/>なー形容詞：　静かなはず　→　静かだったはずです。<br/>　　　名詞：　学生の　　　→　学生だったはずです<br/> 動詞： 話す → 話したはずです
