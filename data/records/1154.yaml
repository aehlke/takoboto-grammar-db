    text: |-
      This is copied from http://www.guidetojapanese.org/should.html of Tae Kim.
      Using はず to describe an expectation
      はず is used to express something that was or is supposed to be. You can treat はず just like a regular noun as it is usually attached to the adjective or verb that is supposed to be or supposed to happen.

      The only thing to be careful about here is expressing an expectation of something not happening. To do this, you must use the negative existence verb ない to say that such an expectation does not exist. This might be in the form of 〜はずがない or 〜はずはない depending on which particle you want to use. The negative conjugation はずじゃない is really only used when you want to confirm in a positive sense such as 〜はずじゃないか？.
    html: |-
      This is copied from http://www.guidetojapanese.org/should.html of Tae Kim.<br/><b>Using はず to describe an expectation</b><br/>はず is used to express something that was or is supposed to be. You can treat はず just like a regular noun as it is usually attached to the adjective or verb that is supposed to be or supposed to happen.<br/><br/>The only thing to be careful about here is expressing an expectation of something not happening. To do this, you must use the negative existence verb ない to say that such an expectation does not exist. This might be in the form of 〜はずがない or 〜はずはない depending on which particle you want to use. The negative conjugation はずじゃない is really only used when you want to confirm in a positive sense such as 〜はずじゃないか？.
    credits_raw: 赤毛
