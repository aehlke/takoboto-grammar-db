  - position: 2
    source_id: null
    text: |-
      ついに is different from つい.
      ついに can be replaced with やっと at last
      ついに買っちゃった！
      Finally, I got it!
    html: |-
      ついに is different from つい.<br/>ついに can be replaced with やっと at last<br/>ついに買っちゃった！<br/>Finally, I got it!
    credits_raw: Miki
    content_sha256: 3990fc58b89399e8183fe708bd37df7e46bc44f041e697712b1d99888aaa1210
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: |-
      「つい」and「ついに」is different. 

      「つい」means... "regretfully"
      for example, you go shopping, you find a new PC. you already have a PC, but you buy the spanky new one anyway. then, you say
      「つい、買った。」
      in fact, you don't need that PC. 

      「ついに」means..."at last"
      you wanted a PC for a long time, and eventually you get one. then, you say,
      「ついに買った。」
      you really need that PC.

      :( tsui = ukkari
      :) tsuini = yatto
    html: |-
      「つい」and「ついに」is different. <br/><br/>「つい」means... "regretfully"<br/>for example, you go shopping, you find a new PC. you already have a PC, but you buy the spanky new one anyway. then, you say<br/>「つい、買った。」<br/>in fact, you don't need that PC. <br/><br/>「ついに」means..."at last"<br/>you wanted a PC for a long time, and eventually you get one. then, you say,<br/>「ついに買った。」<br/>you really need that PC.<br/><br/>:( tsui = ukkari<br/>:) tsuini = yatto
    credits_raw: hiro
    content_sha256: 42e62c3e459a4722278ec75912a7a6ee02a9efdd300ef8b82a335f3dbea2c32b
