    text: A good translation of AあってのB might be "B exists because of A" or more naturally, "B wouldn't be anything without A"?
    html: A good translation of AあってのB might be "B exists because of A" or more naturally, "B wouldn't be anything without A"?
    credits_raw: blabby
    content_sha256: 5c072e7f8030be6d79cae64312bdd36ed8b24f202491b8df3edb32a533852013
    original_created_at: null
    original_updated_at: null
  - position: 6
    source_id: null
    text: |-
      AあってのB means "there ain't no B except for A."

      平和があっての経済の発展 would therefore mean "There would be no economic prosperity without peace."
    html: |-
      AあってのB means "there ain't no B except for A."<br/><br/>平和があっての経済の発展 would therefore mean "There would be no economic prosperity without peace."
