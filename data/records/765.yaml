comments:
  - position: 0
    source_id: null
    text: |-
      を follows a noun or place. It indicates that that noun is the direct object of the verb, that the place is the place of departure, or that the place was passed through.

      を is romanized as "wo" or "o".

      Amatuka said this below.
    html: |-
      を follows a noun or place. It indicates that that noun is the direct object of the verb, that the place is the place of departure, or that the place was passed through.<br/><br/>を is romanized as "wo" or "o".<br/><br/>Amatuka said this below.
    credits_raw: sarruby
    content_sha256: 119121911b2f7f1a38a58d3298cd7d403aca49b77cf0b84aadbb84801f56e559
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      The three uses of を [wo] are 
      1. objective / target (目的) 
      2. area passed through (通過点) 
      3. departure point (出発点)
    html: |-
      The three uses of を [wo] are <br/>1. objective / target (目的) <br/>2. area passed through (通過点) <br/>3. departure point (出発点)
    credits_raw: Amatuka
    content_sha256: fcc54cfb6a703fe9342f3abbff2cb59abadfb6c81745fec60a08ab7a2b28d3ef
    original_created_at: null
    original_updated_at: null
  - position: 2
    source_id: null
    text: 'Note : The object marker を is said ''o'' but may be written as either ''wo'' or ''o'' depending on romaji system used.'
    html: 'Note : The object marker を is said ''o'' but may be written as either ''wo'' or ''o'' depending on romaji system used.'
