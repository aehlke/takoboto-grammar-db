    text: |-
      dc is correct.

      ということだ(1): "It seems that〜" (something heard or read).
      FORMATION:
      Ｖ(plain form) + ということだ
      いＡ + ということだ
      なＡ・Ｎ + (だ) + ということだ

      ということだ(2): "The fact that 〜 means 〜" (in other words; that is to say; in short)
      FORMATION (same as above):
      Ｖ(plain form) + ということだ
      いＡ + ということだ
      なＡ・Ｎ + (だ) + ということだ
