    text: |-
      nuki 抜き→抜く here mean to omit or remove somthing. It would't be always unexpectedly happen. When you order わさび抜きのすし sushi without wasabi、you know it.
      nashi 無し→無い means something is not there.
      They are sometimes used in a similar way like
      寝坊したから、朝ごはんなしだった。／ 朝ごはん抜きだった。
      As I slept over, I had no breakfast. / I skipped breakfast.
    html: |-
      nuki 抜き→抜く here mean to omit or remove somthing. It would't be always unexpectedly happen. When you order わさび抜きのすし sushi without wasabi、you know it.<br/>nashi 無し→無い means something is not there.<br/>They are sometimes used in a similar way like<br/>寝坊したから、朝ごはんなしだった。／ 朝ごはん抜きだった。<br/>As I slept over, I had no breakfast. / I skipped breakfast.
