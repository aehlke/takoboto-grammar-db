        segments:
          - text: 'In recent times, cross-cultural exchange has been becoming more and more popular. Knowledge about foreign cultures is '
            grammar_highlight: false
          - text: 'continuing '
            grammar_highlight: true
          - text: 'to increase, but this also provides a chance to reflect on one''s own country. '
            grammar_highlight: false
