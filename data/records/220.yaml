  - source_id: 4583
    position: 1
    japanese: 本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる一方です。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e6%9c%ac%e5%b1%8b%e3%81%a7"><span>本屋で</span></a><a href="https://takoboto.jp/?q=%e8%8b%b1%e8%aa%9e%e9%96%a2%e4%bf%82%e3%81%ae"><span>英語関係の</span></a><a href="https://takoboto.jp/?q=%e6%9c%ac%e3%82%92"><span>本を</span></a><a href="https://takoboto.jp/?q=%e8%a6%8b%e3%81%a4%e3%81%91%e3%82%8b%e3%81%a8%e3%80%81"><span>見つけると、</span></a><a href="https://takoboto.jp/?q=%e6%ac%a1%e3%80%85%e3%81%ab"><span>次々に</span></a><a href="https://takoboto.jp/?q=%e8%b2%b7%e3%81%a3%e3%81%a6%e3%81%84%e3%81%be%e3%81%99%e3%81%8c%e3%80%81"><span>買っていますが、</span></a><a href="https://takoboto.jp/?q=%e8%aa%ad%e3%81%be%e3%81%9a%e3%81%ab%e3%81%84%e3%82%8b%e3%81%ae%e3%81%a7%e3%80%81"><span>読まずにいるので、</span></a><a href="https://takoboto.jp/?q=%e6%ba%9c%e3%81%be%e3%82%8b"><span>溜まる</span></a><a href="https://takoboto.jp/?q=%e4%b8%80%e6%96%b9%e3%81%a7%e3%81%99%e3%80%82"><strong>一方です。</strong></a>
    segments:
      - text: 本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる
        grammar_highlight: false
      - text: 一方です。
        grammar_highlight: true
    reading: ほんやでえいごかんけいのほんをみつけると、つぎつぎにかっていますが、よまずにいるので、たまるいっぽうです。
