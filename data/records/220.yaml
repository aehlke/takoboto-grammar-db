    japanese: 近ごろ国際交流がますますさかんになっている。外国文化の情報が増える一方だが、それは自分の国のことについて考えるきっかけにもなったいる.
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e8%bf%91%e3%81%94%e3%82%8d"><span>近ごろ</span></a><a href="https://takoboto.jp/?q=%e5%9b%bd%e9%9a%9b%e4%ba%a4%e6%b5%81%e3%81%8c%e3%81%be%e3%81%99%e3%81%be%e3%81%99%e3%81%95%e3%81%8b%e3%82%93%e3%81%ab%e3%81%aa%e3%81%a3%e3%81%a6%e3%81%84%e3%82%8b%e3%80%82"><span>国際交流がますますさかんになっている。</span></a><a href="https://takoboto.jp/?q=%e5%a4%96%e5%9b%bd%e6%96%87%e5%8c%96%e3%81%ae"><span>外国文化の</span></a><a href="https://takoboto.jp/?q=%e6%83%85%e5%a0%b1%e3%81%8c"><span>情報が</span></a><a href="https://takoboto.jp/?q=%e5%a2%97%e3%81%88%e3%82%8b"><span>増える</span></a><a href="https://takoboto.jp/?q=%e4%b8%80%e6%96%b9%e3%81%a0"><strong>一方だ</strong></a><a href="https://takoboto.jp/?q=%e3%81%8c%e3%80%81%e3%81%9d%e3%82%8c%e3%81%af"><span>が、それは</span></a><a href="https://takoboto.jp/?q=%e8%87%aa%e5%88%86%e3%81%ae"><span>自分の</span></a><a href="https://takoboto.jp/?q=%e5%9b%bd%e3%81%ae%e3%81%93%e3%81%a8%e3%81%ab%e3%81%a4%e3%81%84%e3%81%a6"><span>国のことについて</span></a><a href="https://takoboto.jp/?q=%e8%80%83%e3%81%88%e3%82%8b%e3%81%8d%e3%81%a3%e3%81%8b%e3%81%91%e3%81%ab%e3%82%82%e3%81%aa%e3%81%a3%e3%81%9f%e3%81%84%e3%82%8b."><span>考えるきっかけにもなったいる.</span></a>
    segments:
      - text: 近ごろ国際交流がますますさかんになっている。外国文化の情報が増える
        grammar_highlight: false
      - text: 一方だ
        grammar_highlight: true
      - text: が、それは自分の国のことについて考えるきっかけにもなったいる.
        grammar_highlight: false
    reading: ちかごろこくさいこうりゅうがますますさかんになっている。がいこくぶんかのじょうほうがふえるいっぽうだが、それはじぶんのくにのことについてかんがえるきっかけにもなったいる
    credits_raw: sureshnihon
    translations:
      - language: en
        text: |-
          In recent times, cross-cultural exchange has been becoming more and more popular. Knowledge about foreign cultures is continuing to increase, but this also provides a chance to reflect on one's own country.
