comments:
  - position: 0
    source_id: null
    text: Do you have to add "de" at the end?
    html: Do you have to add "de" at the end?
    credits_raw: Ayumi
    content_sha256: fc040857a60a243d125da02bb86617c9a0d8aa66d9eb1b2338b2793fc810506a
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      で indicates a way something is done. Thus コート無しで means literally "in a coatless fashion". But you don't have to always use で, for example, 名前無し means nameless or anonymous. Also, it's an noun-like suffix, and you use it with の in adjectival context、 like in 名無しの人。

      For fun factor, it seems that -無し was the negative suffix in classical Japanese, equivalent of modern-day -ない. So although it's an equivalent of a suffix inflected like i-adjectives (形容詞), it behaves like a noun today.
    html: |-
      で indicates a way something is done. Thus コート無しで means literally "in a coatless fashion". But you don't have to always use で, for example, 名前無し means nameless or anonymous. Also, it's an noun-like suffix, and you use it with の in adjectival context、 like in 名無しの人。<br/><br/>For fun factor, it seems that -無し was the negative suffix in classical Japanese, equivalent of modern-day -ない. So although it's an equivalent of a suffix inflected like i-adjectives (形容詞), it behaves like a noun today.
    credits_raw: mathrick
