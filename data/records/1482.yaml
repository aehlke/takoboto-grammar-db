    text: |-
      i guess you're right, although つもり often comes up as a grammar item. the usage is different too.

      行くつもりがあります
      行く予定です。

      合ってる？
    html: |-
      i guess you're right, although つもり often comes up as a grammar item. the usage is different too.<br/><br/>行くつもりがあります<br/>行く予定です。<br/><br/>合ってる？
    credits_raw: dc
    content_sha256: 941e0f7c083d2060677f491e8472d6fb31d2304262fd6f5163051ada3efbfae5
    original_created_at: null
    original_updated_at: null
  - position: 3
    source_id: null
    text: |-
      I also have come across つもり and 予定 during class studies. If I recall correctly, つもり can only be used to discuss yourself whereas 予定 can be used to discuss yourself or others.
    html: |-
      I also have come across つもり and 予定 during class studies. If I recall correctly, つもり can only be used to discuss yourself whereas 予定 can be used to discuss yourself or others.
    credits_raw: yookoso
    content_sha256: 4a596692b65d729298cd056680c755d350b79184d367d52da35d69812e5e97fc
    original_created_at: null
    original_updated_at: null
  - position: 4
    source_id: null
    text: |-
      Yes, dc, you are correct. yookoo is also correct in that つもり is essentuially used to express one's intentions, but you have to say that is not necessarily absolute. When you ask a question like あなたは行くつもりですか？ "tumori" in that context is not your own but somebody else's so that it is esentially equivalent to あなたは行く予定ですか？.

      The example I gave for 予定,however, cannot be replaced by つもり.
    html: |-
      Yes, dc, you are correct. yookoo is also correct in that つもり is essentuially used to express one's intentions, but you have to say that is not necessarily absolute. When you ask a question like あなたは行くつもりですか？ "tumori" in that context is not your own but somebody else's so that it is esentially equivalent to あなたは行く予定ですか？.<br/><br/>The example I gave for 予定,however, cannot be replaced by つもり.
    credits_raw: bamboo4
    content_sha256: b2ab050197578760b93ab112a4a05f84883509256028b4bfd1fbbdcfc1e17191
