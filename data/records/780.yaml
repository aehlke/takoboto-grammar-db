    text: |-
      「なら」と「たら」の違い
      例：「山田さんが来たら、私は帰ります。」の場合には、
      山田さんが来てから私が帰るという意味であるが、「山田さんが来るなら、私は帰ります。」の場合には、山田さんが来る前に私が帰るという意味になる。
      うふふふ、朝飯前わね＾＾
    html: |-
      「なら」と「たら」の違い<br/>例：「山田さんが来たら、私は帰ります。」の場合には、<br/>山田さんが来てから私が帰るという意味であるが、「山田さんが来るなら、私は帰ります。」の場合には、山田さんが来る前に私が帰るという意味になる。<br/>うふふふ、朝飯前わね＾＾
    credits_raw: フリザ
