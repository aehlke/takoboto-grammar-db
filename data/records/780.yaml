comments:
  - position: 0
    source_id: null
    text: "there are a few if/when constructs:\n\n[nara] is similar to -[eba]\nformed with verb-plain form + nara\n　行くなら分かる = if/when you go you will understand\n\n[to] is used when the action is expected to happen, rather than use the english 'if' use 'when...' \nformed with verb-plain form + to\n　行かないとまずい = it will be bad if you dont go\n\n[eba] is used when PEOPLE do the actions or suggesting an action. masu-stem + ba\n　行けばいいよ　= its ok to go\n\n[tara] is used in the other cases\n 寒かったら行かない = if its cold i won't go"
    html: |-
      there are a few if/when constructs:<br/><br/>[nara] is similar to -[eba]<br/>formed with verb-plain form + nara<br/>　行くなら分かる = if/when you go you will understand<br/><br/>[to] is used when the action is expected to happen, rather than use the english 'if' use 'when...' <br/>formed with verb-plain form + to<br/>　行かないとまずい = it will be bad if you dont go<br/><br/>[eba] is used when PEOPLE do the actions or suggesting an action. masu-stem + ba<br/>　行けばいいよ　= its ok to go<br/><br/>[tara] is used in the other cases<br/> 寒かったら行かない = if its cold i won't go
    credits_raw: dc
