    text: |-
      I added an example from page 75 of the Shin Kanzen Master N2 Grammar book, and after checking with a native speaker who also speaks good English, the combination of "no amari no henka ni" causes it to mean that the brother had changed a lot, which is why the speaker couldn't find the words. 

      This is the first example I've added, so I don't know how to make the correct parts turn red to emphasize it. [EDIT] I figured it out :)
