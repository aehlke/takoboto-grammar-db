    text: what are the rules for it being juu rather than chuu?
    html: what are the rules for it being juu rather than chuu?
    credits_raw: hana
    content_sha256: 3e7d06a71f70be2c3354eb4f2a822276cb7a10e5fbae2cc1c35e105ba6b160d6
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: "I thought the rule was as follows:\n\nChuu = indicates the continuation of an activity or a time period\njuu = indicates a space/time period without a break\n\nSo 営業中 (chuu)　indicates the activity of sales continuing. 春休み中 (chuu) indicates the period of time \"Spring holiday\"\n\n夏休み中　(juu) indicates the entire summer holidays. 　\n\n世界中　(juu) indicates the entire world\n\nso to distinguish between the summer and spring examples above:\n\n春休み中（ちゅう）は旅行に行くつもりです。\n夏休み中（じゅう）テレビゲームばかりしていた。\n\nThe spring example defines a period of time and allows us to mention activities that will occur in that time etc.\n\nThe summer example indicates that for the entire period of the summer holidays a single event occured. \n\nWhat's confusing me is that I thought Miki's summer holidays example should be (juu), because of the zutto. perhaps if the emphasis was more on the fact that the entire holiday had been taken up by camping, we could have used juu?"
    html: |-
      I thought the rule was as follows:<br/><br/>Chuu = indicates the continuation of an activity or a time period<br/>juu = indicates a space/time period without a break<br/><br/>So 営業中 (chuu)　indicates the activity of sales continuing. 春休み中 (chuu) indicates the period of time "Spring holiday"<br/><br/>夏休み中　(juu) indicates the entire summer holidays. 　<br/><br/>世界中　(juu) indicates the entire world<br/><br/>so to distinguish between the summer and spring examples above:<br/><br/>春休み中（ちゅう）は旅行に行くつもりです。<br/>夏休み中（じゅう）テレビゲームばかりしていた。<br/><br/>The spring example defines a period of time and allows us to mention activities that will occur in that time etc.<br/><br/>The summer example indicates that for the entire period of the summer holidays a single event occured. <br/><br/>What's confusing me is that I thought Miki's summer holidays example should be (juu), because of the zutto. perhaps if the emphasis was more on the fact that the entire holiday had been taken up by camping, we could have used juu?
    credits_raw: sekaiget_dominic
    content_sha256: 7a1b283dae7ae54a1c89988e40b1ddae3781b63e69e80cb8c1bdff14f609c540
