    text: |-
      I believe that example one is incorrect. I believe it should be:
      私は、日本に行った時に(は)、日本語を勉強した。
      You can add or leave out the は depending on how you wish to say it.
    html: |-
      I believe that example one is incorrect. I believe it should be:<br/>私は、日本に行った時に(は)、日本語を勉強した。<br/>You can add or leave out the は depending on how you wish to say it.
    credits_raw: your name
