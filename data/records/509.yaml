  - position: 9
    source_id: null
    text: |-
      it helps me to think of に as crosshairs. It zeros in on a specific time. "At" covers this function nicely in English. It's not correct to use it if there is no specific time. 一時に "at 1 o'clock" and 明日 "tommorow" as we don't say "at tommorow". This metaphor can be used for indirect object に as well.
    html: |-
      it helps me to think of に as crosshairs. It zeros in on a specific time. "At" covers this function nicely in English. It's not correct to use it if there is no specific time. 一時に "at 1 o'clock" and 明日 "tommorow" as we don't say "at tommorow". This metaphor can be used for indirect object に as well.
    credits_raw: sw
    content_sha256: 9df30298c5f016f24467ceca3574b6e34b495bf55aa018152799466003e78e1e
    original_created_at: null
    original_updated_at: null
  - position: 10
    source_id: null
    text: But we say 明日(あした）には, meaning by tommorow."
    html: But we say 明日(あした）には, meaning by tommorow."
    credits_raw: bamboo4
    content_sha256: 3cd39b0b1c3956be4a8ea8f2224dcbdbc64a93fed91d4ab998d37cbd610d4161
