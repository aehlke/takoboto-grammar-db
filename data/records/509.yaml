  - position: 11
    source_id: null
    text: |-
      To me it sounds like without に, the sentence might be more like "When in Japan, I studied Japanese." and adding に would be somewhat like "When I was in Japan, I studied Japanese." The first one would put more emphasis on studying Japanese (but happen to state where) and the second would be saying what one did in Japan (which was studying).

      I think I pretty much just reworded what everyone else was saying, in a way, right?
    html: |-
      To me it sounds like without に, the sentence might be more like "When in Japan, I studied Japanese." and adding に would be somewhat like "When I was in Japan, I studied Japanese." The first one would put more emphasis on studying Japanese (but happen to state where) and the second would be saying what one did in Japan (which was studying).<br/><br/>I think I pretty much just reworded what everyone else was saying, in a way, right?
    credits_raw: Saralynne
    content_sha256: 734a514d1e86e39ca536ca41186fe9f0cc899ed391399267b7b9b2e82029e195
