    japanese: 彼女は優しいですが、知らずに人を傷付けることを言うきらいがある。
    japanese_html: |-
      <a href="https://takoboto.jp/?q=%e5%bd%bc%e5%a5%b3%e3%81%af"><span>彼女は</span></a><a href="https://takoboto.jp/?q=%e5%84%aa%e3%81%97%e3%81%84%e3%81%a7%e3%81%99%e3%81%8c%e3%80%81"><span>優しいですが、</span></a><a href="https://takoboto.jp/?q=%e7%9f%a5%e3%82%89%e3%81%9a%e3%81%ab"><span>知らずに</span></a><a href="https://takoboto.jp/?q=%e4%ba%ba%e3%82%92"><span>人を</span></a><a href="https://takoboto.jp/?q=%e5%82%b7%e4%bb%98%e3%81%91%e3%82%8b%e3%81%93%e3%81%a8%e3%82%92"><span>傷付けることを</span></a><a href="https://takoboto.jp/?q=%e8%a8%80%e3%81%86"><span>言う</span></a><a href="https://takoboto.jp/?q=%e3%81%8d%e3%82%89%e3%81%84%e3%81%8c%e3%81%82%e3%82%8b"><strong>きらいがある</strong></a><a href="https://takoboto.jp/?q=%e3%80%82"><span>。</span></a>
    segments:
      - text: 彼女は優しいですが、知らずに人を傷付けることを言う
        grammar_highlight: false
