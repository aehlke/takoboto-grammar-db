comments:
  - position: 0
    source_id: null
    text: "I`m not really sure if the translation for this is best represented above, but I know it is used in sentances that have \"all you can\" in them.\nits constructed by taking the ます　stem of the verb and adding 放題 and then it is treated as a noun. \n\nI have only heard it used with verbs and I have been corrected the few times I tried to use it with する　verbs.\n\nif your using a する verb, do not remove the する\nIE　勉強する\n\nWRONG >>>　勉強放題　\nRIGHT >>> 勉強し放題\n\nalso I think this is a good place to mention that Japanese don`t really use this construction, except with a few select words. Although 勉強し放題 is grammaticly correct. Its 変な日本語/Strange Japanese."
    html: |-
      I`m not really sure if the translation for this is best represented above, but I know it is used in sentances that have "all you can" in them.<br/>its constructed by taking the ます　stem of the verb and adding 放題 and then it is treated as a noun. <br/><br/>I have only heard it used with verbs and I have been corrected the few times I tried to use it with する　verbs.<br/><br/>if your using a する verb, do not remove the する<br/>IE　勉強する<br/><br/>WRONG &gt;&gt;&gt;　勉強放題　<br/>RIGHT &gt;&gt;&gt; 勉強し放題<br/><br/>also I think this is a good place to mention that Japanese don`t really use this construction, except with a few select words. Although 勉強し放題 is grammaticly correct. Its 変な日本語/Strange Japanese.
    credits_raw: tigert
