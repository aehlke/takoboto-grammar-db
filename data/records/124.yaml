    text: |-
      「Vta＋上で」have the meaning of upon/after. 

      Ex: #43
      よく考えた上でご返事いたします。 
      I will reply upon careful consideration. 

      But, 「Vru＋上で」have the meaning of when

      Ex: #392 

      メールを使ううえで注意すべきマナーって？ 

      [What is the] Etiquette to pay attention when using email?
