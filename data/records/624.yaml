comments:
  - position: 0
    source_id: null
    text: |-
      で has many uses. It can be used for sentences like:

      I went to the park by bus.
      バスで公園に行きました。

      Or 'with' when talking about objects such as:

      パソコンで日本語とイタリア語を勉強しています。- With my PC, I'm studying Japanese and Italian.

      It can be used with 'jibun' (myself) and hitori (alone)

      一人でこのケーキを作りました。-I made this cake alone.

      自分で料理しました。- I cooked by myself.

      It can be used as a price for something:

      曙ﾜドルでゲームを買いました。- I bought this game at the price for 15 dollars.

      A location where something took place:

      喫茶店でドーナツを食べました。- I ate a doughnut at the cafe.

      It can mean 'within'...

      一日で本を読みました。- I read it within a day.
    html: |-
      で has many uses. It can be used for sentences like:<br/><br/>I went to the park by bus.<br/>バスで公園に行きました。<br/><br/>Or 'with' when talking about objects such as:<br/><br/>パソコンで日本語とイタリア語を勉強しています。- With my PC, I'm studying Japanese and Italian.<br/><br/>It can be used with 'jibun' (myself) and hitori (alone)<br/><br/>一人でこのケーキを作りました。-I made this cake alone.<br/><br/>自分で料理しました。- I cooked by myself.<br/><br/>It can be used as a price for something:<br/><br/>曙ﾜドルでゲームを買いました。- I bought this game at the price for 15 dollars.<br/><br/>A location where something took place:<br/><br/>喫茶店でドーナツを食べました。- I ate a doughnut at the cafe.<br/><br/>It can mean 'within'...<br/><br/>一日で本を読みました。- I read it within a day.
    credits_raw: Sakuratree
