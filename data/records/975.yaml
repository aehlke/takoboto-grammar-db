    text: |-
      When using に応じた it modifies the following noun. E.g. The literal translation of the second example would be...
      "Don't over exert yourself, do the exercise that is commensurate to your physical strength."
      (e.g. 'exercise' (noun) is modified by (commensurate to your physical strength)).
      This would probably be clearer with a different example.
    html: |-
