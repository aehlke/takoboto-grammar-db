      Well, I'm sure the second time you saw it, after having looked it up, you understood. Better to raise the bar for yourself than lower it for those who can't understand "archaic" English. ;)

      1. having the same measure; of equal extent or duration. 
      2. corresponding in amount, magnitude, or degree: Your paycheck should be commensurate with the amount of time worked. 
      3. proportionate; adequate. 
      4. having a common measure; commensurable. 

      It's not just the meaning of the word, but also its usage. Just as you might not find commensurate in English vernacular, you won't find に応じて flying out of the mouth of a high school kid in Japan.
