comments:
  - position: 0
    source_id: null
    text: |-
      に応じて]has these meanings,
      [depending on], [in accordance with], [in answer to].

      体力に応じて（depending on）
      （ex）あなたの体力に応じて走るスピードを変えましょう。
       Depending on your physical fitness,change your running speed.


      命令に応じて（in accordance with）
      （ex）上司の命令に応じてその計画を変更した。
       We changed the plan in accordance with boss's instructions.

      質問に応じて(in answer to)
      （ex）彼の質問に応じて、彼女はこう言った。
       She said that in answer to his question.
       「応」＝「答」
    html: |-
      に応じて]has these meanings,<br/>[depending on], [in accordance with], [in answer to].<br/><br/>体力に応じて（depending on）<br/>（ex）あなたの体力に応じて走るスピードを変えましょう。<br/> Depending on your physical fitness,change your running speed.<br/><br/><br/>命令に応じて（in accordance with）<br/>（ex）上司の命令に応じてその計画を変更した。<br/> We changed the plan in accordance with boss's instructions.<br/><br/>質問に応じて(in answer to)<br/>（ex）彼の質問に応じて、彼女はこう言った。<br/> She said that in answer to his question.<br/> 「応」＝「答」
    credits_raw: dc
    content_sha256: 79900229218fc4127203233054255218280e575ffb9fb85a8f77cdcd97c7a768
    original_created_at: null
    original_updated_at: null
  - position: 1
    source_id: null
    text: |-
      usage

      noun + nioujite 
      体力に応じて
      命令に応じて

      when with adjectives, you add -sa after the adjective to turn it into a type of noun.
      eg 
       高い high
      →高さ high-ness/height

      高<b>さ</b>に応じて depending on your height
      速<b>さ</b>に応じて depending on your speed

      This is for true adjectives, which are mostly "na" adjectives. for "-i" adjectives, you often can't use -sa as they dont turn into nouns.

      See <a href=http://www.timwerx.net/language/jpadj/lesson1.htm>this page</a> for an explanation on true/quasi na/i adjectives.
    html: |-
      usage<br/><br/>noun + nioujite <br/>体力に応じて<br/>命令に応じて<br/><br/>when with adjectives, you add -sa after the adjective to turn it into a type of noun.<br/>eg <br/> 高い high<br/>→高さ high-ness/height<br/><br/>高&lt;b&gt;さ&lt;/b&gt;に応じて depending on your height<br/>速&lt;b&gt;さ&lt;/b&gt;に応じて depending on your speed<br/><br/>This is for true adjectives, which are mostly "na" adjectives. for "-i" adjectives, you often can't use -sa as they dont turn into nouns.<br/><br/>See &lt;a href=http://www.timwerx.net/language/jpadj/lesson1.htm&gt;this page&lt;/a&gt; for an explanation on true/quasi na/i adjectives.
    credits_raw: dc
    content_sha256: d3a9c7cd721b1729195b66915a32baae804fb9d15ab3f3a36f48ba1114794de0
