  - position: 2
    source_id: null
    text: |-
      ようだ is a very literal "like" something:
      > This meat tastes like chicken.

      かのうよう is usually more metaphorical
      > she is like a princess

      please also see [marude] which is often used in the same sentence.

      can a japanese native speaker please confirm this?
    html: |-
      ようだ is a very literal "like" something:<br/>&gt; This meat tastes like chicken.<br/><br/>かのうよう is usually more metaphorical<br/>&gt; she is like a princess<br/><br/>please also see [marude] which is often used in the same sentence.<br/><br/>can a japanese native speaker please confirm this?
