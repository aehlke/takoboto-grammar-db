  - position: 1
    source_id: null
    text: |-
      [kurai / くらい] with a negative predicate indicates a superlative. (Mr. Yamada is the most forgetful.)

      It also expresses the idea of "at least." ?くらい in this use implies that the degree of a state is such that one cannot expect much more than X from that state.

      Ｓのは?くらいのものだ expresses the idea that the speaker cannot think of anyone or anything else but ? that meets the description in Ｓ. In other words, ? meets the description in Ｓ to the highest degree among those the speaker can think of.

      Ｖ1くらいならＶ2ほうがましだ expresses the idea the one would rather Ｖ2 than Ｖ1.
    html: |-
