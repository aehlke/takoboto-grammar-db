    text: "I think this grammar point is a little misleading, くらい､ぐらい　means approximately, about, almost. it is used to state unspacific amounts of what comes before it. it does not carry a meaning of minimal amount, rather than, so〜that,the least or the only. \n\nI think that you need to look at other sections of each of the examples to understand their true meaning. \n\n#6085 does not translate to he is the only one. if you wanted to say he is the only or no one else could do the job, you would say. \n今彼しかこの仕事ができません。or\n今この仕事ができるのは　彼だけです。　\n\nbecause you use ぐらい　your saying that if it wasn`t someone that has about as much (unidentified ablility) as he does they couldn`t do the job. \n\nThe next example #6086\n\nthe real operator in the sentence is the last part. ”ほうがました” and くらい is not nessasary to hold the meaning I would rather die than do such a thing. そんなことするなら already has the meaning."
    html: |-
      I think this grammar point is a little misleading, くらい､ぐらい　means approximately, about, almost. it is used to state unspacific amounts of what comes before it. it does not carry a meaning of minimal amount, rather than, so〜that,the least or the only. <br/><br/>I think that you need to look at other sections of each of the examples to understand their true meaning. <br/><br/>#6085 does not translate to he is the only one. if you wanted to say he is the only or no one else could do the job, you would say. <br/>今彼しかこの仕事ができません。or<br/>今この仕事ができるのは　彼だけです。　<br/><br/>because you use ぐらい　your saying that if it wasn`t someone that has about as much (unidentified ablility) as he does they couldn`t do the job. <br/><br/>The next example #6086<br/><br/>the real operator in the sentence is the last part. ”ほうがました” and くらい is not nessasary to hold the meaning I would rather die than do such a thing. そんなことするなら already has the meaning.
    credits_raw: tigert
