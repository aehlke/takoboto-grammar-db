    text: "Formed from Verb -masu base + kaneru\n\r\nNote that kaneru conjugates as a normal verb (e.g. かねた、かねます etc are possible)\n\r\nVm = Verb -masu base"
    html: "Formed from Verb -masu base + kaneru<br/>\r\nNote that kaneru conjugates as a normal verb (e.g. かねた、かねます etc are possible)<br/>\r\nVm = Verb -masu base"
    source_id: null
