notes:
  - position: 0
    text: "言いかねる\n\r\nii-kaneru \n\r\n= i hestitate/don't want to say...\n\r\neg \"I hesitate to say this, but please don't come to the party\"\n\n\n\r\n言い難い （　いいがたい ）\n\r\nii-gatai \n\r\n= this is hard to say\n\r\neg \"It's hard to say what he was thinking...\""
    html: "言いかねる<br/>\r\nii-kaneru <br/>\r\n= i hestitate/don't want to say...<br/>\r\neg \"I hesitate to say this, but please don't come to the party\"<br/>\n<br/>\r\n言い難い （　いいがたい ）<br/>\r\nii-gatai <br/>\r\n= this is hard to say<br/>\r\neg \"It's hard to say what he was thinking...\""
    credits_raw: dc
