  - position: 2
    credits_raw: dc
    text: "ii-kaneru seems to have a particularly japanese feeling, something like \"well, i don't really want to say that, but... (its true)\".\n\n\n\r\nLike, I hesitate to say this, but I must.\n\n\n\r\nBut hopefully a japanese native can clear up the difference some more."
    html: "ii-kaneru seems to have a particularly japanese feeling, something like \"well, i don't really want to say that, but... (its true)\".<br/>\n<br/>\r\nLike, I hesitate to say this, but I must.<br/>\n<br/>\r\nBut hopefully a japanese native can clear up the difference some more.<br/>\n<br/>"
    source_id: null
