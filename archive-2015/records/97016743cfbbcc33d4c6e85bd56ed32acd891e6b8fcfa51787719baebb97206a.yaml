examples:
  - source_id: 1023
    position: 0
    japanese: 私の古い車にひきかえかれのはとても早いです。
    body_text: "私の古い車にひきかえかれのはとても早いです。 \n\nIn contrast to \n\t\tmy old car, his is really fast."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私の古い車にひきかえかれのはとても早いです。\">\n\t\t\t\t私の古い車<strong>にひきかえ</strong>かれのはとても早いです。<strong></strong></a> <br/>\n<strong>In contrast to </strong>\n\t\tmy old car, his is really fast."
    credits_raw: d4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5166
    position: 1
    japanese: 去年はトマト50個収穫できたのよ。それにひきかえ今年は30個だけ。多分気候のせいね…
    body_text: "去年はトマト50個収穫できたのよ。それにひきかえ今年は30個だけ。多分気候のせいね… \n\n\t\tWe harvested 50 tomatoes last year. \n\t\tIn contrast, \n\t\tthis year we harvested only 30. This may be due to the weather..."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ去年はトマト50個収穫できたのよ。それにひきかえ今年は30個だけ。多分気候のせいね…\">\n\t\t\t\t去年はトマト50個収穫できたのよ。それ<strong>にひきかえ</strong>今年は30個だけ。多分気候のせいね…<strong></strong></a> <br/>\n\t\tWe harvested 50 tomatoes last year. \n\t\t<strong>In contrast, </strong>\n\t\tthis year we harvested only 30. This may be due to the weather..."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6975
    position: 2
    japanese: "同じ年の人\r\nにひきかえ彼はとても頭がいいです。"
    body_text: "同じ年の人\r\nにひきかえ彼はとても頭がいいです。 \n\n\t\tHe is very intelligent \n\t\tin stark contrast to \n\t\tpeople of the same age"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ同じ年の人にひきかえ彼はとても頭がいいです。\">\n\t\t\t\t同じ年の人\r\n<strong>にひきかえ</strong>彼はとても頭がいいです。<strong></strong></a> <br/>\n\t\tHe is very intelligent \n\t\t<strong>in stark contrast to </strong>\n\t\tpeople of the same age"
    credits_raw: amenya
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7761
    position: 3
    japanese: 几帳面な父にひきかえ息子はどらしなかった。
    body_text: "几帳面な父にひきかえ息子はどらしなかった。 \n\n\t\tThe son, \n\t\tin contrast to \n\t\this meticulous father, was slovenly."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ几帳面な父にひきかえ息子はどらしなかった。\">\n\t\t\t\t几帳面な父<strong>にひきかえ</strong>息子はどらしなかった。<strong></strong></a> <br/>\n\t\tThe son, \n\t\t<strong>in contrast to </strong>\n\t\this meticulous father, was slovenly."
    credits_raw: Boomeranger
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7932
    position: 4
    japanese: この大学は教育の質がとてもいいのにひきかえ、学内の設備が劣る（おとる）
    body_text: "この大学は教育の質がとてもいいのにひきかえ、学内の設備が劣る（おとる）\r \n\n\t\tWhile the quality of the education at this college is excellent, the quality of the campus facilities is inferior"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの大学は教育の質がとてもいいのにひきかえ、学内の設備が劣る（おとる）\">\n\t\t\t\tこの大学は教育の質がとてもいいの<strong>にひきかえ</strong>、学内の設備が劣る（おとる）\r<strong></strong></a> <br/>\n\t\tWhile the quality of the education at this college is excellent, the quality of the campus facilities is inferior \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7933
    position: 5
    japanese: 先月の食料品の売り上げが著しく伸びたのにひきかえ、衣料品の売り上げが落ち込んだ
    body_text: "先月の食料品の売り上げが著しく伸びたのにひきかえ、衣料品の売り上げが落ち込んだ\r \n\n\t\tLast month sales of foodstuffs expanded considerably, but in contrast, clothing sales dropped off"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ先月の食料品の売り上げが著しく伸びたのにひきかえ、衣料品の売り上げが落ち込んだ\">\n\t\t\t\t先月の食料品の売り上げが著しく伸びたの<strong>にひきかえ</strong>、衣料品の売り上げが落ち込んだ\r<strong></strong></a> <br/>\n\t\tLast month sales of foodstuffs expanded considerably, but in contrast, clothing sales dropped off \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7934
    position: 6
    japanese: 16世紀のフランスでは、貴族の食事は贅沢だったのにひきかえ、市民の食事はとても貧しいものだった。
    body_text: "16世紀のフランスでは、貴族の食事は贅沢だったのにひきかえ、市民の食事はとても貧しいものだった。\r \n\n\t\tIn France in the 16th century, the nobility ate extravagently while the common people ate very poorly."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ16世紀のフランスでは、貴族の食事は贅沢だったのにひきかえ、市民の食事はとても貧しいものだった。\">\n\t\t\t\t16世紀のフランスでは、貴族の食事は贅沢だったの<strong>にひきかえ</strong>、市民の食事はとても貧しいものだった。\r<strong></strong></a> <br/>\n\t\tIn France in the 16th century, the nobility ate extravagently while the common people ate very poorly. \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7935
    position: 7
    japanese: 前回の作品にひきかえ、今回のはすばらしいできだ。
    body_text: "前回の作品にひきかえ、今回のはすばらしいできだ。\r \n\n\t\tIn sharp contrast to his last work, this latest piece is a superb accomplishment"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ前回の作品にひきかえ、今回のはすばらしいできだ。\">\n\t\t\t\t前回の作品<strong>にひきかえ</strong>、今回のはすばらしいできだ。\r<strong></strong></a> <br/>\n\t\tIn sharp contrast to his last work, this latest piece is a superb accomplishment \n\t\t<strong> </strong>"
    credits_raw: LR
