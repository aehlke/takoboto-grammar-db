comments:
  - position: 0
    credits_raw: bamboo4
    text: |-
      まるで plus negative would have the meaning of "entirely" or "totally," but if you use まるで in its original sense, it means "as if" or "just like" or "as it were." これはまるで戦争だ.
    html: |-
      まるで plus negative would have the meaning of "entirely" or "totally," but if you use まるで in its original sense, it means "as if" or "just like" or "as it were." これはまるで戦争だ.
    source_id: null
