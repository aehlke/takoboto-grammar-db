    body_text: "フレデイはこの一ヶ月というものずっと夜勤だったため、正常な時間に働いている友人達に会う機会がまるでなかった。 \n\n\t\tFreddy's been working the graveyard shift the past month, so he hasn't been able \n\t\t[at all] \n\t\tto see any of his friends who work normal hours."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJフレデイはこの一ヶ月というものずっと夜勤だったため、正常な時間に働いている友人達に会う機会がまるでなかった。\">\n\t\t\t\tフレデイはこの一ヶ月というものずっと夜勤だったため、正常な時間に働いている友人達に会う機会が<strong>まるで</strong>なかった。<strong></strong></a> <br/>\n\t\tFreddy's been working the graveyard shift the past month, so he hasn't been able \n\t\t<strong>[at all] </strong>\n\t\tto see any of his friends who work normal hours."
