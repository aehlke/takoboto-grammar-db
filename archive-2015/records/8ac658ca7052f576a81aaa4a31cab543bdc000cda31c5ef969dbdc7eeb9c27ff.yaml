notes:
  - position: 0
    text: 「〜と(も)なく／〜と(も)なしに」は疑問詞（疑問詞＋助詞）につくときは、「＜いつ・どこで・誰が・何を＞かよくわからないが、〜」という不確かさを表します。また、感覚・知覚・思惟などを表す動詞を反復し、「見るともなく見る／聞くともなく聞く」のように「〜しようというつもりはなく、ただ、なんとなく〜する」という無意識で行われた動作を表します。日本語の不作為・無意識の行為を表す代表がこの「〜ともなく／〜ともなしに」だと言えるでしょう。
    html: 「〜と(も)なく／〜と(も)なしに」は疑問詞（疑問詞＋助詞）につくときは、「＜いつ・どこで・誰が・何を＞かよくわからないが、〜」という不確かさを表します。また、感覚・知覚・思惟などを表す動詞を反復し、「見るともなく見る／聞くともなく聞く」のように「〜しようというつもりはなく、ただ、なんとなく〜する」という無意識で行われた動作を表します。日本語の不作為・無意識の行為を表す代表がこの「〜ともなく／〜ともなしに」だと言えるでしょう。
    credits_raw: khongbietboi
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: |-
      When 「〜と(も)なく／〜と(も)なしに」is attached to a question word (or question word and particle), it expresses uncertainty (about when, where, who, what). Alternatively, when used on either end of verbs expressing sensation, perception or speculation, as in「見るともなく見る／聞くともなく聞く」, it indicates that the action happens unintentionally or without conscious effort. This model can be said to be representative of Japanese phrases expressing involuntary/unconscious actions.
    html: |-
      When 「〜と(も)なく／〜と(も)なしに」is attached to a question word (or question word and particle), it expresses uncertainty (about when, where, who, what). Alternatively, when used on either end of verbs expressing sensation, perception or speculation, as in「見るともなく見る／聞くともなく聞く」, it indicates that the action happens unintentionally or without conscious effort. This model can be said to be representative of Japanese phrases expressing involuntary/unconscious actions.
