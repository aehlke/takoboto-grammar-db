label: tomonaku;tomonashini
title_raw: 〜ともなく,〜ともななしに ([〜ともなく,〜ともななしに] )(tomonaku;tomonashini)
title: 〜ともなく,〜ともななしに
reading: 〜ともなく,〜ともななしに
romanized_label: tomonaku;tomonashini
category: grammar
jlpt_level_original: '1'
meaning: |-
  Without really planning to, ~ A phrase indicating that the subject does s.t. without paying much attention or that when, where, to whom, etc. s.t. took place is unclear. 特に〜しようと思うのではなく
meaning_example: Without really planning to, I spent all day playing computer games.
