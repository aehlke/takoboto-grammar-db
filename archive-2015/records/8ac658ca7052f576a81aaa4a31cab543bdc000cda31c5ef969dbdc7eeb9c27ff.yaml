  - position: 8
    text: "Related toとなくbut  となく is for only limited words such as  どことなく、何となく、誰かれとなく、それとなく\n\r\nこの文章はどことなく変だ。\n\r\nThis passage is strange somewhere (but I cannot tell where)\n\r\n哲也のことが何となくきになる\n\r\nI'm concerned about Tetsuya somehow\n\r\n由里はだれかれとなくよく人の面倒をみる。\n\r\nYuri gives a lot of help to anyone (without discriminating)\n\nそれとなく飯田に聞いてみたらどう。\n\r\nWhy don't you ask Iida about it indirectly (lit. without making the intention obvious)"
    html: "Related toとなくbut  となく is for only limited words such as  どことなく、何となく、誰かれとなく、それとなく<br/>\r\nこの文章は<strong>どことなく</strong>変だ。<br/>\r\nThis passage is strange somewhere (but I cannot tell where)<br/>\r\n哲也のことが<strong>何となく</strong>きになる<br/>\r\nI'm concerned about Tetsuya somehow<br/>\r\n由里は<strong>だれかれとなく</strong>よく人の面倒をみる。<br/>\r\nYuri gives a lot of help to anyone (without discriminating)<br/>\n<strong>それとなく</strong>飯田に聞いてみたらどう。<br/>\r\nWhy don't you ask Iida about it indirectly (lit. without making the intention obvious)"
    credits_raw: LR
    source_id: null
