  - position: 5
    credits_raw: bamboo4
    text: |-
      It is not like 弘子のことだから, which means "as it is usual for Hiroko." Accordingly, you would not say 弘子のことだから、遅れました, but you would say  弘子のことだから、遅れるでしょう. In other words, we use that expression for prediction rather than description of what actually took place. If you want to say "HIroko was late, as usual," you would say 例によって(いつもの通り）、弘子は遅れてきた.
    html: |-
      It is not like 弘子のことだから, which means "as it is usual for Hiroko." Accordingly, you would not say 弘子のことだから、遅れました, but you would say  弘子のことだから、遅れるでしょう. In other words, we use that expression for prediction rather than description of what actually took place. If you want to say "HIroko was late, as usual," you would say 例によって(いつもの通り）、弘子は遅れてきた.<br/>
