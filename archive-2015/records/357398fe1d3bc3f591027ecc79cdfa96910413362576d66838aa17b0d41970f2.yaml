  - position: 1
    text: "Almost always seems to be used like\n\n\n\r\nnoun +ならでは + の + noun\n\n\n\r\n○　あの人ならではの能力\n\r\n×　あの人ならではできる"
    html: "Almost always seems to be used like<br/>\n<br/>\r\nnoun +ならでは + の + noun<br/>\n<br/>\r\n○　あの人<strong>ならでは</strong><b>の</b>能力<br/>\r\n×　あの人<strong>ならでは</strong>できる"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "Ref #\x01 Kanzen Master Level 1 - p20 - no.18"
    html: "<b>Ref <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=naradeha#\x01\">#\x01</a></b></b> Kanzen Master Level 1 - p20 - no.18"
    credits_raw: LR
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    text: "Ref #\x01 A Dictionary of Advanced Japanese Grammar p350"
    html: "<b>Ref <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=naradeha#\x01\">#\x01</a></b></b> A Dictionary of Advanced Japanese Grammar p350"
    credits_raw: LR
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    text: "DC's explanation is a little misleading\n\r\nThe three main formations are:\n\nNoun1 + ならではの Noun2\n\r\n(この店ならではのサービス service you can only expect at this shop)\n\n\n\nNounならではだ\n\r\n(学生ならではだ Impossible unless s.o. is a student) \n\n\n\nNoun ならでは Verb-potential-negative\n\r\n(彼ならではできない s.t. cannot be done by anyone else but him)"
    html: "DC's explanation is a little misleading<br/>\r\nThe three main formations are:<br/>\n<strong>Noun1 + ならではの Noun2</strong><br/>\r\n(この店ならではのサービス service you can only expect at this shop)<br/>\n<br/>\n<strong>Nounならではだ</strong><br/>\r\n(学生ならではだ Impossible unless s.o. is a student) <br/>\n<br/>\n<strong>Noun ならでは Verb-potential-negative</strong><br/>\r\n(彼ならではできない s.t. cannot be done by anyone else but him)"
    credits_raw: LR
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    text: "naradeha is mainly used for positive statements about s.t. / s.o but conceivably could be used for negative / sarcastic statements:\n\r\nそういうくだらない考えはジョージならでは思いつかないことだ。\n\r\n(Only George could come up with such a stupid idea)"
    html: "naradeha is mainly used for positive statements about s.t. / s.o but conceivably could be used for negative / sarcastic statements:<br/>\r\nそういうくだらない考えはジョージ<strong>ならでは</strong>思いつかないことだ。<br/>\r\n(Only George could come up with such a stupid idea)"
    credits_raw: LR
    source_id: null
    original_created_at: null
    original_updated_at: null
