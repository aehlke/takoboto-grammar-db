examples:
  - source_id: 517
    position: 0
    japanese: 皆様の協力があればこそ無事故で完工できたことを感謝しております。
    body_text: "皆様の協力があればこそ無事故で完工できたことを感謝しております。 \n\n\t\tI'm thankful to you all, it's \n\t\tparticularly because of \n\t\tall of your support that we were able to complete construction without incident."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ皆様の協力があればこそ無事故で完工できたことを感謝しております。\">\n\t\t\t\t皆様の協力が<strong>あればこそ</strong>無事故で完工できたことを感謝しております。<strong></strong></a> <br/>\n\t\tI'm thankful to you all, it's \n\t\t<strong>particularly because of </strong>\n\t\tall of your support that we were able to complete construction without incident."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3195
    position: 1
    japanese: "きものを着ると言う行為は、洋服以上に全身の筋肉を事細かに使うことにも驚かされます。何事もほんとうに健康で\r\nあればこそですね。"
    body_text: "きものを着ると言う行為は、洋服以上に全身の筋肉を事細かに使うことにも驚かされます。何事もほんとうに健康で\r\nあればこそですね。 \n\n\t\tWearing a kimono , rather than wearing Western clothes even if you don't use it much, can be something very stressing on your muscles.\r\nBut i guess it's all possible \n\t\tparticularly thanks to \n\t\thaving good health right?"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJきものを着ると言う行為は、洋服以上に全身の筋肉を事細かに使うことにも驚かされます。何事もほんとうに健康であればこそですね。\">\n\t\t\t\tきものを着ると言う行為は、洋服以上に全身の筋肉を事細かに使うことにも驚かされます。何事もほんとうに健康で\r\n<strong>あればこそ</strong>ですね。<strong></strong></a> <br/>\n\t\tWearing a kimono , rather than wearing Western clothes even if you don't use it much, can be something very stressing on your muscles.\r\nBut i guess it's all possible \n\t\t<strong>particularly thanks to </strong>\n\t\thaving good health right?"
    credits_raw: Exrulez
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3212
    position: 2
    japanese: エア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練あればこそでした。
    body_text: "エア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練あればこそでした。 \n\n\t\tThe fact that I could surface from the depth of 20 meters after running out of air without suffering air embolism \n\t\tcould only be attributed to \n\t\tthe constant training I went through."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJエア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練あればこそでした。\">\nエア切れで２０メートルの深度からエアエンボにもかからず浮上できたのも、日頃の訓練<strong>あればこそ</strong>でした。<strong></strong></a> <br/>\n\t\tThe fact that I could surface from the depth of 20 meters after running out of air without suffering air embolism \n\t\t<strong>could only be attributed to </strong>\n\t\tthe constant training I went through."
    credits_raw: bamboo4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4755
    position: 3
    japanese: 私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことがあればこそだ。
    body_text: "私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことがあればこそだ。 \n\n\t\tI found the work easy, \n\t\tespecially since \n\t\tI had done that kind of work before."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことがあればこそだ。\">\n\t\t\t\t私にはその仕事がやさしいとわかった。前にもそんな仕事をしたことが<strong>あればこそ</strong>だ。<strong></strong></a> <br/>\n\t\tI found the work easy, \n\t\t<strong>especially since </strong>\n\t\tI had done that kind of work before."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5312
    position: 4
    japanese: あなたのためを思えばこそ、厳しくしているのだ。
    body_text: "あなたのためを思えばこそ、厳しくしているのだ。 \n\n\t\tBecause I am \n\t\tespecially \n\t\tthinking about your wellbeing, I am strict."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたのためを思えばこそ、厳しくしているのだ。\">\n\t\t\t\tあなたのためを思え<strong>ばこそ、</strong>厳しくしているのだ。<strong></strong></a> <br/>\n\t\tBecause I am \n\t\t<strong>especially </strong>\n\t\tthinking about your wellbeing, I am strict."
    credits_raw: blabby
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5313
    position: 5
    japanese: 頭がよければこその悩みですね。
    body_text: "頭がよければこその悩みですね。 \n\nEspecially becuase \n\t\tshe is smart, she worries about such things."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ頭がよければこその悩みですね。\">\n\t\t\t\t頭がよ<strong>ければこそ</strong>の悩みですね。<strong></strong></a> <br/>\n<strong>Especially becuase </strong>\n\t\tshe is smart, she worries about such things."
    credits_raw: blabby
    verification_class:
