  - position: 14
    credits_raw: blabby
    text: "Thanks bamboo4 for checking.\n\r\nI looked at #\x01 and I think a more natural way of saying it would be \n\r\nＸ　あなたが来いと言えばこそ私は来たんです。\n\r\n○　あなたが来いと言ったからこそ私は来たんです。\n\r\n    I came especially becuase you said to.\n\n\n\r\nSo I moved it to \x01. Is this correct? \n\r\nAlso, does anyone know the difference between 〜ばこそ and からこそ? I read that 〜ばこそ is used after hypothetical form (仮定形) and the sentence must end in だ/です?? I don't get it."
    html: "Thanks bamboo4 for checking.<br/>\r\nI looked at <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=arebakoso#\x01\">#\x01</a></b> and I think a more natural way of saying it would be <br/>\r\nＸ　あなたが来いと言えばこそ私は来たんです。<br/>\r\n○　あなたが来いと言ったからこそ私は来たんです。<br/>\r\n    I came especially becuase you said to.<br/>\n<br/>\r\nSo I moved it to <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>. Is this correct? <br/>\r\nAlso, does anyone know the difference between 〜ばこそ and からこそ? I read that 〜ばこそ is used after hypothetical form (仮定形) and the sentence must end in だ/です?? I don't get it."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 15
    credits_raw: srobertson
    text: "I agree that this entry should change to \"bakoso\". My understanding of the difference from \x01 is that 〜ばこそ stresses that the preceding condition was the *only* reason for a certain action or attitude (which is usually proactive or positive in nature).\n\n\n\r\n〜だからこそ, on the other hand, is used when you just want to emphasize a reason."
    html: "I agree that this entry should change to \"bakoso\". My understanding of the difference from <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is that 〜ばこそ stresses that the preceding condition was the *only* reason for a certain action or attitude (which is usually proactive or positive in nature).<br/>\n<br/>\r\n〜だからこそ, on the other hand, is used when you just want to emphasize a reason."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 16
    credits_raw: rogen
    text: "ジェイグラムを見ればこそこの文法を覚えれた。\n\n\n\r\n（合ってる？）Or does it have to be\n\n\n\r\nこの文法を覚えれたのは、ジェイグラムを見ればこそだ"
    html: "ジェイグラムを見ればこそこの文法を覚えれた。<br/>\n<br/>\r\n（合ってる？）Or does it have to be<br/>\n<br/>\r\nこの文法を覚えれたのは、ジェイグラムを見ればこそだ"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 17
    credits_raw: 誠
    text: "I agree with srobertson on his explanation on 〜ばこそ which having the preceding condition the 'only' reason for a certain action or attitude which usually the action taken  is quite overwhelming.\n\r\n〜からこそ　has a more different usage where the reason is very unexpectedly opposing to the action taken. Here is the explanation from the book:\n\r\n単純な理由ではないぶんで、よく使われる。「〜からこそ」は、次のような単純な理由を表す文に使うと不自然です。\n\r\nE.g. : A : なぜ遅刻したんですか。\n\r\n　　Ｘ B : 電車が遅れたからこそ遅刻したんです。\n\r\nInstead,\n\r\nE.g. : 愛しているからこそ別れる、ということもあ　\n\r\n　　　　る。\n\r\n　　　There is such a thing that 'It is because of love that is why both separate from each other' Sorry, can't translate better.\n\r\nE.g. : あの先生は、学生に大人気です。優しいからじゃなくて、厳しいからこそ、好かれろのだ。"
    html: "I agree with srobertson on his explanation on 〜ばこそ which having the preceding condition the 'only' reason for a certain action or attitude which usually the action taken  is quite overwhelming.<br/>\r\n〜からこそ　has a more different usage where the reason is very unexpectedly opposing to the action taken. Here is the explanation from the book:<br/>\r\n単純な理由ではないぶんで、よく使われる。「〜からこそ」は、次のような単純な理由を表す文に使うと不自然です。<br/>\r\nE.g. : A : なぜ遅刻したんですか。<br/>\r\n　　Ｘ B : 電車が遅れたからこそ遅刻したんです。<br/>\r\nInstead,<br/>\r\nE.g. : 愛しているからこそ別れる、ということもあ　<br/>\r\n　　　　る。<br/>\r\n　　　There is such a thing that 'It is because of love that is why both separate from each other' Sorry, can't translate better.<br/>\r\nE.g. : あの先生は、学生に大人気です。優しいからじゃなくて、厳しいからこそ、好かれろのだ。<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
