    original_created_at: null
    original_updated_at: null
  - source_id: 6268
    position: 6
    japanese: 優勝できたのは、チーム全員の協力あればこそだ。
    body_text: "優勝できたのは、チーム全員の協力あればこそだ。 \n\n\t\tThe victory was \n\t\tespecially due to \n\t\tthe team members' cooperation."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ優勝できたのは、チーム全員の協力あればこそだ。\">\n\t\t\t\t優勝できたのは、チーム全員の協力<strong>あればこそ</strong>だ。<strong></strong></a> <br/>\n\t\tThe victory was \n\t\t<strong>especially due to </strong>\n\t\tthe team members' cooperation."
