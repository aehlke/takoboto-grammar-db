    body_text: "一生懸命働いただけに、彼に促成をしました\r \n\n\t\tAs expected he performed well and got the promotion"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ一生懸命働いただけに、彼に促成をしました\">\n\t\t\t\t一生懸命働いた<strong>だけに</strong>、彼に促成をしました\r<strong></strong></a> <br/>\n\t\tAs expected he performed well and got the promotion \n\t\t<strong> </strong>"
