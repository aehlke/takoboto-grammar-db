  - source_id: 6175
    position: 3
    japanese: フランスで勉強しただけに、彼女のフランス語は発音がきれいだ。
    body_text: "フランスで勉強しただけに、彼女のフランス語は発音がきれいだ。 \n\nAs expected \n\t\tof someone who studied in France, her pronunciation of French is lovely."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJフランスで勉強しただけに、彼女のフランス語は発音がきれいだ。\">\n\t\t\t\tフランスで勉強した<strong>だけに</strong>、彼女のフランス語は発音がきれいだ。<strong></strong></a> <br/>\n<strong>As expected </strong>\n\t\tof someone who studied in France, her pronunciation of French is lovely."
    credits_raw: rubyhatchet
