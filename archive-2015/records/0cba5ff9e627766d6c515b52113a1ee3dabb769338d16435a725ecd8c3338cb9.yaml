    japanese: やっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。
    body_text: "やっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。 \n\nAs might be expected \n\t\tof a city like Tokyo, world-wide cuisine is available there."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJやっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。\">\nやっぱり東京<strong>だけに（だけあって）</strong>世界各地の食べ物が揃っている。<strong></strong></a> <br/>\n<strong>As might be expected </strong>\n\t\tof a city like Tokyo, world-wide cuisine is available there."
