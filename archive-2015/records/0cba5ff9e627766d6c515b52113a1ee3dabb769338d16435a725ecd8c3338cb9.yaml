    japanese: 火星は地球とよく似ているだけにひとしお興味をひく。
    body_text: "火星は地球とよく似ているだけにひとしお興味をひく。 \n\n\t\tMars is all the more interesting \n\t\tfor \n\t\tits close resemblance to our earth."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ火星は地球とよく似ているだけにひとしお興味をひく。\">\n\t\t\t\t火星は地球とよく似ている<strong>だけに</strong>ひとしお興味をひく。<strong></strong></a> <br/>\n\t\tMars is all the more interesting \n\t\t<strong>for </strong>\n\t\tits close resemblance to our earth."
