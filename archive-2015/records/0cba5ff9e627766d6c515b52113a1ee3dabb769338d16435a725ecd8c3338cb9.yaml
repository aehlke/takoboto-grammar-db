    japanese: 苦難の途を歩んできただけにできたひとだ。
    body_text: "苦難の途を歩んできただけにできたひとだ。 \n\nAs might be expected \n\t\tof those who trod the path of hardships, he is a man of character."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ苦難の途を歩んできただけにできたひとだ。\">\n苦難の途を歩んできた<strong>だけに</strong>できたひとだ。<strong></strong></a> <br/>\n<strong>As might be expected </strong>\n\t\tof those who trod the path of hardships, he is a man of character."
