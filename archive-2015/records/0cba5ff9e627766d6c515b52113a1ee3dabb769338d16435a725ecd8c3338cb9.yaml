  - source_id: 6176
    position: 4
    japanese: 両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。
    body_text: "両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。 \n\n\t\t(Her) parents are living together in the countryside. \n\t\tSince \n\t\tthey are getting older, she is worrying about them."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。\">\n\t\t\t\t両親は、田舎で二人だけで暮らしている。年をとっている<strong>だけに</strong>、娘としては心配だ。<strong></strong></a> <br/>\n\t\t(Her) parents are living together in the countryside. \n\t\t<strong>Since </strong>\n\t\tthey are getting older, she is worrying about them."
    credits_raw: rubyhatchet
