  - source_id: 7972
    position: 2
    japanese: 勉強ばかりしていいないで、たまには外に遊びに行くなりスポーツをするなりして、気分転換をしたらどうですか。
    body_text: "勉強ばかりしていいないで、たまには外に遊びに行くなりスポーツをするなりして、気分転換をしたらどうですか。\r \n\n\t\tInstead of studying all the time, once in a while why don't you go outside and play or play sports and do something for a change of pace sometimes?"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ勉強ばかりしていいないで、たまには外に遊びに行くなりスポーツをするなりして、気分転換をしたらどうですか。\">\n\t\t\t\t勉強ばかりしていいないで、たまには外に遊びに行く<strong>なり</strong>スポーツをするなりして、気分転換をしたらどうですか。\r<strong></strong></a> <br/>\n\t\tInstead of studying all the time, once in a while why don't you go outside and play or play sports and do something for a change of pace sometimes? \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7973
    position: 3
    japanese: 風邪を引いたのなら、薬を飲むなり何なりすればよかったのに
    body_text: "風邪を引いたのなら、薬を飲むなり何なりすればよかったのに\r \n\n\t\tIf you caught a cold, it would have been better if you'd taken some medicine or done something (instead of doing nothing)"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ風邪を引いたのなら、薬を飲むなり何なりすればよかったのに\">\n\t\t\t\t風邪を引いたのなら、薬を飲む<strong>なり</strong>何なりすればよかったのに\r<strong></strong></a> <br/>\n\t\tIf you caught a cold, it would have been better if you'd taken some medicine or done something (instead of doing nothing) \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7974
    position: 4
    japanese: うろうろ探しまわらないで、交番で聞くなりすれば良かったのに
    body_text: "うろうろ探しまわらないで、交番で聞くなりすれば良かったのに\r \n\n\t\tIt would have been better if you'd gone and asked the police or something instead of lingering around searching for it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJうろうろ探しまわらないで、交番で聞くなりすれば良かったのに\">\n\t\t\t\tうろうろ探しまわらないで、交番で聞く<strong>なり</strong>すれば良かったのに\r<strong></strong></a> <br/>\n\t\tIt would have been better if you'd gone and asked the police or something instead of lingering around searching for it. \n\t\t<strong> </strong>"
    credits_raw: LR
