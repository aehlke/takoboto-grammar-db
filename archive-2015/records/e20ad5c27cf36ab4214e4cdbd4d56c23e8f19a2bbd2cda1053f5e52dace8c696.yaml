    body_text: "君が来るなり，僕が行くなりしなくてはならない\r \n\n\t\tEither you must come here or I must go there."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ君が来るなり，僕が行くなりしなくてはならない\">\n\t\t\t\t君が来る<strong>なり</strong>，僕が行くなりしなくてはならない\r<strong></strong></a> <br/>\n\t\tEither you must come here or I must go there. \n\t\t<strong> </strong>"
    credits_raw: LR
