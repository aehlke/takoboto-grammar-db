    japanese: 英語なりスペイン語なり、なんか外国語を身につけたい。
    body_text: "英語なりスペイン語なり、なんか外国語を身につけたい。\r \n\n\t\tEither English or Spanish, I kind want to master a foreign language."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ英語なりスペイン語なり、なんか外国語を身につけたい。\">\n\t\t\t\t英語<strong>なり</strong>スペイン語なり、なんか外国語を身につけたい。\r<strong></strong></a> <br/>\n\t\tEither English or Spanish, I kind want to master a foreign language. \n\t\t<strong> </strong>"
