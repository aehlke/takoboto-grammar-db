    credits_raw: drgon76
    text: Is there a difference between -となる and -になる??
    html: Is there a difference between -となる and -になる??
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: your name
    text: "in the example above the と is a half of こと 「事 」\n\r\nI think it is almost always になる \n\r\nに as in \"to\" (a place). maybe sometimes its omitted.\n\r\n　大変となります...\n\r\nsomeone native will have to answer..."
    html: "in the example above the と is a half of こと 「事 」<br/>\r\nI think it is almost always になる <br/>\r\nに as in \"to\" (a place). maybe sometimes its omitted.<br/>\r\n　大変となります...<br/>\r\nsomeone native will have to answer...<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "I don't think there is a difference between them when noun + -となる or -になる.\n\r\neg. ok 雨になる。雨となる。社長になる。社長となる。\n\r\nBut I agree -になる is used mostly."
    html: "I don't think there is a difference between them when noun + -となる or -になる.<br/>\r\neg. ok 雨になる。雨となる。社長になる。社長となる。<br/>\r\nBut I agree -になる is used mostly."
    source_id: null
    original_created_at: null
