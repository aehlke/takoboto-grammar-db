notes:
  - position: 0
    text: |-
      になる(くなる）USAGE



       い形容詞 （−い＋く）＋なる

        Example  たかい >>>たかくなる



       な形容詞 （−な＋に）＋なる

        Example  きれいな >>>きれいになる



       名詞 （＋に）＋なる

        Example  かくし>>かくしになる
    html: |-
      <b> になる(くなる）USAGE<br/>
      <br/>
       い形容詞 </b>（−い＋く）＋なる<br/>
      <strong>  Example  たか<strong>い &gt;&gt;&gt;たか<strong>くなる<br/>
      <br/>
      <b> な形容詞 </b>（−な＋に）＋なる<br/>
      <strong>  Example  きれい<strong>な &gt;&gt;&gt;きれい<strong>になる<br/>
      <br/>
      <b> 名詞 </b>（＋に）＋なる<br/>
      <strong>  Example  かくし<strong>&gt;&gt;かくし<strong>になる</strong></strong></strong></strong></strong></strong></strong></strong></strong>
