    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJきらめく太陽に青い海、考えだけでも胸がとき\">\n\t\t\t\tきら<strong>めく</strong>太陽に青い海、考えだけでも胸がとき<strong>めく</strong>わ。</a> <br/>\n\t\tThe glisten \n\t\t<strong>ing </strong>\n\t\tsun on the blue sea...Ahhh, just thinking about it makes my heart beat fast."
