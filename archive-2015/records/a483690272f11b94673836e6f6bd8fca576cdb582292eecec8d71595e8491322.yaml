  - position: 4
    credits_raw: Miki
    text: 名詞や副詞、形容詞や形容動詞の語幹base＋めく means like something or being in a condtion of something.
    html: 名詞や副詞、形容詞や形容動詞の語幹base＋めく means like something or being in a condtion of something.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: blabby
    text: "I thought that きらめく/ときめく was different to 皮肉めく/他人めく too.  But in my old grammar dictionary and here:\n\nhttp://ws.31rsm.ne.jp/~toolware/dictionary/412.html\n\r\nthey are treated as the same grammar point.  Can anyone clarify this?"
    html: "I thought that きらめく/ときめく was different to 皮肉めく/他人めく too.  But in my old grammar dictionary and here:<br/>\n<a href=\"http://ws.31rsm.ne.jp/~toolware/dictionary/412.html\">http://ws.31rsm.ne.jp/~toolware/dictionary/412.html</a><br/>\r\nthey are treated as the same grammar point.  Can anyone clarify this?<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: Suitto
    text: "Natsumeku/Natsumeita/Natsumeite\n\r\nI think they all mean \"summer-like\"."
    html: "Natsumeku/Natsumeita/Natsumeite<br/>\r\nI think they all mean \"summer-like\"."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: Miki
    text: |-
      That's just the transformation of natsumeku 夏めく. Yes, all means "summer-like" すっかり夏めいてまいりました。皆様いかがお過ごしでしょうか。 Natsumeku here is used as compliments of the season for June in a letter.
