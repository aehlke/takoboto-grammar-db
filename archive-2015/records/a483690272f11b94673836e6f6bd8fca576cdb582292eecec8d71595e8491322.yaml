    japanese: 俺たちは十年来の友人じゃないか、そんな他人めいた言い方をするなよ。
    body_text: "俺たちは十年来の友人じゃないか、そんな他人めいた言い方をするなよ。 \n\n\t\tHey, we've been friends for many years right? Don't use such a strangerish/stranger- \n\t\tlike \n\t\t  style of speaking with me!"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ俺たちは十年来の友人じゃないか、そんな他人めいた\">\n\t\t\t\t俺たちは十年来の友人じゃないか、そんな他人<strong>めいた</strong><strong></strong>言い方をするなよ。</a> <br/>\n\t\tHey, we've been friends for many years right? Don't use such a strangerish/stranger- \n\t\t<strong>like </strong>\n\t\t  style of speaking with me!"
