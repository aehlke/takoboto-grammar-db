comments:
  - position: 0
    credits_raw: dc
    text: "what does this mean? example:　\n\r\n山は春めく"
    html: "what does this mean? example:　<br/>\r\n山は春めく<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: blabby
    text: "This grammar is quite difficult because it is hard to translate into English.  The best translation I can come up with is\n\n\n\r\n* to become ~like  (山は春めく - \"The mountain became spring-like\")\n\r\n* to show signs of (show signs of spring)\n\r\n* ~ish (他人めく - \"strangerish\")？\n\r\n* ~ly (冗談めく - Jokingly/皮肉めく - sarcastically)\n\r\n* ~ing (謎めく - Puzzling)"
    html: "This grammar is quite difficult because it is hard to translate into English.  The best translation I can come up with is<br/>\n<br/>\r\n* to become ~like  (山は春めく - \"The mountain became spring-like\")<br/>\r\n* to show signs of (show signs of spring)<br/>\r\n* ~ish (他人めく - \"strangerish\")？<br/>\r\n* ~ly (冗談めく - Jokingly/皮肉めく - sarcastically)<br/>\r\n* ~ing (謎めく - Puzzling)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: blabby
    text: "Another interesting thing about this grammar is its use with 擬音語/擬態語\n\n\n\r\nきらきらする  = きらめく To glitter\n\r\nひらひらする  = ひらめく To flash/flutter\n\r\nどきどきする? = ときめく To pulpitate\n\n\n\r\nIf anyone can correct this or has more information, I would love to hear it."
    html: "Another interesting thing about this grammar is its use with 擬音語/擬態語<br/>\n<br/>\r\nきらきらする  = きらめく To glitter<br/>\r\nひらひらする  = ひらめく To flash/flutter<br/>\r\nどきどきする? = ときめく To pulpitate<br/>\n<br/>\r\nIf anyone can correct this or has more information, I would love to hear it."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: dc
    text: きらめく、ときめく　are totally different animals from 皮肉めいた、他人めいた。
    html: きらめく、ときめく　are totally different animals from 皮肉めいた、他人めいた。
