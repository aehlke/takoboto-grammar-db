    japanese: ご予約に際し、クレジットカードの番号および有効期限などの情報が必要です。
    body_text: "ご予約に際し、クレジットカードの番号および有効期限などの情報が必要です。 \n\nWhen \n\t\tmaking your reservation you need to have your credit card number, as well as the expiration date and similar information."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJご予約に際し、クレジットカードの番号および有効期限などの情報が必要です。\">\nご予約<strong>に際し</strong>、クレジットカードの番号および有効期限などの情報が必要です。<strong></strong></a> <br/>\n<strong>When </strong>\n\t\tmaking your reservation you need to have your credit card number, as well as the expiration date and similar information."
