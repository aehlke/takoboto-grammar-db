    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ卒業に際して、私たちは感謝の印として彼に置き時計を贈りました。\">\n卒業<strong>に際して</strong>、私たちは感謝の印として彼に置き時計を贈りました。<strong></strong></a> <br/>\n<strong>Upon </strong>\n\t\tleaving school, we presented him with a table clock as a token of our thanks."
