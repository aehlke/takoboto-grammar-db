    body_text: "工場見学に際して、係の人から様々な注意をうけた。 \n\n\t\tOn the occasion of the factory tour, the person in charge laid out various precautions."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ工場見学に際して、係の人から様々な注意をうけた。\">\n\t\t\t\t工場見学<strong>に際して</strong>、係の人から様々な注意をうけた。<strong></strong></a> <br/>\n\t\tOn the occasion of the factory tour, the person in charge laid out various precautions. \n\t\t<strong> </strong>"
