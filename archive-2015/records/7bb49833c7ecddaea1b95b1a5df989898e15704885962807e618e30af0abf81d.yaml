notes:
  - position: 0
    text: "＊The crucial difference between に当たって/に当たり and に歳して is that the former indicates an occasion with a formal sentence, but the latter indicates a special occasion.\n\r\n＊Therefore, do NOT use に際して when speaking of trivial, everyday occurences.\n\n\n\r\nFORMATION:\n\r\nＮ + に際して"
    html: "＊The crucial difference between に当たって/に当たり and に歳して is that the former indicates an occasion with a formal sentence, but the latter indicates a special occasion.<br/>\r\n＊Therefore, do NOT use に際して when speaking of trivial, everyday occurences.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + に際して"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
