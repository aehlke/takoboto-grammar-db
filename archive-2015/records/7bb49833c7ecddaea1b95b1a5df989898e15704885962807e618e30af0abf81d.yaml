    body_text: "読書に際しては、過去の偉大な作家に最も多くの注意が払われなければならない。  \n\nWhen \n\t\treading, the great writers of the past  must be given the most attention."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ読書に際しては、過去の偉大な作家に最も多くの\">\n読書<strong>に際して</strong>は、過去の偉大な作家に最も多くの<strong></strong>注意が払われなければならない。 </a> <br/>\n<strong>When </strong>\n\t\treading, the great writers of the past  must be given the most attention."
