  - position: 2
    text: "The use of wa after nakushite indicates that the sentence is a conditional sentence. This means that when a sentence has a conditional meaning, wa is mandatory as shown in  山川教授...\n\r\n= perhaps nakushite is \"without\"\n\r\n= perhaps nakushitewa is \"if it weren't for\" - slightly stronger"
