comments:
  - position: 0
    credits_raw: blabby
    text: I think a good translation for this is "If it wasn't for_,".
    html: I think a good translation for this is "If it wasn't for_,".
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: 誠
    text: "I agree that it should be translated as \" If it wasn't for...\". \n\r\nBy the way, in ex #\x01 the usage of なくして seems strange. Because it sounds strange when translated,\n\r\n[ If it wasn't my permission, you should not have done such a thing].\n\r\n〜なくして（は）．．．ない where the usage usually comes with\n\r\n \"If it wasn't ..., then..(followed usually by sentence stating : can't / doesn't have the potential or possibility to do or have something)\"\n\n\n\r\nIt should have been :\n\r\n「私の許可がなかったら、君はそんなことをすべきではなかったのだが．．．」\n\r\nIf there wasn't any of my permission, you shouldn't have done such a thing... \n\n\n\n\n\r\nOr 「私の許可ではなかったら、君はそんなことをすべきではなかったのだが．．．」\n\r\nIf it wasn't of my permission, you shouldn't have done such a thing.\n\n\n\r\nOr another example for なくして,\n\r\n皆さんの協力なくして、そんなに辛い事を解決できないのだ。"
    html: "I agree that it should be translated as \" If it wasn't for...\". <br/>\r\nBy the way, in ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nakushite#\x01\">#\x01</a></b> the usage of なくして seems strange. Because it sounds strange when translated,<br/>\r\n[ If it wasn't my permission, you should not have done such a thing].<br/>\r\n〜なくして（は）．．．ない where the usage usually comes with<br/>\r\n \"If it wasn't ..., then..(followed usually by sentence stating : can't / doesn't have the potential or possibility to do or have something)\"<br/>\n<br/>\r\nIt should have been :<br/>\r\n「私の許可がなかったら、君はそんなことをすべきではなかったのだが．．．」<br/>\r\nIf there wasn't any of my permission, you shouldn't have done such a thing... <br/>\n<br/>\n<br/>\r\nOr 「私の許可ではなかったら、君はそんなことをすべきではなかったのだが．．．」<br/>\r\nIf it wasn't of my permission, you shouldn't have done such a thing.<br/>\n<br/>\r\nOr another example for なくして,<br/>\r\n皆さんの協力なくして、そんなに辛い事を解決できないのだ。<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "As for #\x01, I don't think the Japanese is wrong even if it sounds strange when translated. Please advise a proper translation for it."
    html: "As for <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nakushite#\x01\">#\x01</a></b>, I don't think the Japanese is wrong even if it sounds strange when translated. Please advise a proper translation for it."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: 誠
    text: "ex #\x01 would mean that \n\r\nif it wasn't of my permission, you shouldn't have done such a thing.\n\n\n\r\nI am actually doubting the usage of なくして in that example,\n\r\nnot the Japanese.\n\r\nInstead I suggest:\n\r\n私の許可なくして、君はそんなことを達成するのが無理だ。\n\r\nIf it wasn't of my permission, it is impossible you could achieve such a thing.\n\n\n\r\nAfter なくして、 it is natural to be followed by something that one can't achieve or something that is impossible to happen without it.\n\n\n\r\nIn #\x01, it is 'shouldn't' instead of 'can't/impossible'\n\n\n\r\nHere are some examples from a book:\n\r\n1.彼は、人工呼吸器の助けなくしては一日も生きられない体だ。\n\n\n\r\n2.日々の努力なくして、成功はあり得ない。\n\n\n\r\n3.それは、涙なくしては見られない感動的な映画だった。\n\n\n\r\n４．皆さんの応援なくして、優勝はなっかったと確信致します。\n\n\n\r\n５．苦しい練習なくして、試合に勝つ事はできあないのだ。\n\n\n\r\n６．悲しみなくして、人生の喜ぶを知ることはできない。\n\n\n\r\n７．如何にお金があろうと、育てる者の愛情なくして、子供は幸せになることができない。\n\n\n\r\nThere is a difference between 'If it wasn't for...' with 'without'."
    html: "ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nakushite#\x01\">#\x01</a></b> would mean that <br/>\r\nif it wasn't of my permission, you shouldn't have done such a thing.<br/>\n<br/>\r\nI am actually doubting the usage of なくして in that example,<br/>\r\nnot the Japanese.<br/>\r\nInstead I suggest:<br/>\r\n私の許可なくして、君はそんなことを達成するのが無理だ。<br/>\r\nIf it wasn't of my permission, it is impossible you could achieve such a thing.<br/>\n<br/>\r\nAfter なくして、 it is natural to be followed by something that one can't achieve or something that is impossible to happen without it.<br/>\n<br/>\r\nIn <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nakushite#\x01\">#\x01</a></b>, it is 'shouldn't' instead of 'can't/impossible'<br/>\n<br/>\r\nHere are some examples from a book:<br/>\r\n1.彼は、人工呼吸器の助けなくしては一日も生きられない体だ。<br/>\n<br/>\r\n2.日々の努力なくして、成功はあり得ない。<br/>\n<br/>\r\n3.それは、涙なくしては見られない感動的な映画だった。<br/>\n<br/>\r\n４．皆さんの応援なくして、優勝はなっかったと確信致します。<br/>\n<br/>\r\n５．苦しい練習なくして、試合に勝つ事はできあないのだ。<br/>\n<br/>\r\n６．悲しみなくして、人生の喜ぶを知ることはできない。<br/>\n<br/>\r\n７．如何にお金があろうと、育てる者の愛情なくして、子供は幸せになることができない。<br/>\n<br/>\r\nThere is a difference between 'If it wasn't for...' with 'without'.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: "みきさん、\n\r\nBelow is some explanation from my 先生：\n\r\n「私の許可なくして＿＿＿」の文は日本語ではあまり使いませんから、\n\r\n正しい文は「私の許可なしで＿＿＿」でしょう。\n\r\nor\n\r\n「私の許可なしに、______」"
    html: "みきさん、<br/>\r\nBelow is some explanation from my 先生：<br/>\r\n「私の許可なくして＿＿＿」の文は日本語ではあまり使いませんから、<br/>\r\n正しい文は「私の許可なしで＿＿＿」でしょう。<br/>\r\nor<br/>\r\n「私の許可なしに、______」"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: bamboo
    text: |-
      私の許可なくして is perfectly valid in terms of written Japanese. In terms of spoken Japanese, perhaps 私の許可を受けないで would be normal, even though 私の許可なしに would also be acceptable.
    html: |-
      私の許可なくして is perfectly valid in terms of written Japanese. In terms of spoken Japanese, perhaps 私の許可を受けないで would be normal, even though 私の許可なしに would also be acceptable.<br/>
