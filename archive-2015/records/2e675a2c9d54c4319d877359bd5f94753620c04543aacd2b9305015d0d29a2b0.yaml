    credits_raw: bamboo4
    text: "ふと would be used in  the sense of \"incidentally\" or \"by some unexpected turn of event.\" It is more or less an unexpected thing that catch you more or less passively.\n\n\n\r\nいきなり and 突然 has the connotation of \"out of blue\" or \"abruptly\" so that there is a big element of surprise."
