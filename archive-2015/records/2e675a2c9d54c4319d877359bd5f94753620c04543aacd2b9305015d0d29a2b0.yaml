  - position: 4
    credits_raw: dc
    text: "偶然 「ぐうぜん」 I think means more what a coincidence. As in \"what a surprise to see you here!\"\n\n\n\r\n突然　「とつぜん」is more similar, like \"out of the blue\".\n\n\n\r\nいきなり is another similar word. \n\r\nいきなり結婚した - got married all of a sudden"
