  - position: 2
    text: "＊This expression is meant to describe insurmountable psychological or physiological feelings.\n\r\n・If the preceding adjective does not describe psychological or physiological feelings, ならない cannot be used. Also, there are a couple of adjectives describing psychological or physiological feelings that cannot be used; they are merely exceptions. For example: 痛い、嫌い、好き.\n\r\n・When a verb is connected with ならない, it is usually an idiomatic phrase of psychological feelings, and NOT of physiological feeling. The following sentence would be UNGRAMMATICAL unless ならない is replaced with たまらない:\n\r\n朝飯を食べて来なかったので、腹が減ってならない。\n\r\n(I came here without eating my breakfast, so I am awfully hungry.)\n\r\nThis is the correct sentence:\n\r\n朝飯を食べて来なかったので、腹が減ってたまらない。\n\n\n\r\nFORMATION:\n\r\nＶ・いＡ(て forms) + ならない\n\r\nなＡ + で + ならない"
    html: "＊This expression is meant to describe insurmountable psychological or physiological feelings.<br/>\r\n・If the preceding adjective does not describe psychological or physiological feelings, ならない cannot be used. Also, there are a couple of adjectives describing psychological or physiological feelings that cannot be used; they are merely exceptions. For example: 痛い、嫌い、好き.<br/>\r\n・When a verb is connected with ならない, it is usually an idiomatic phrase of psychological feelings, and NOT of physiological feeling. The following sentence would be UNGRAMMATICAL unless ならない is replaced with たまらない:<br/>\r\n朝飯を食べて来なかったので、腹が減ってならない。<br/>\r\n(I came here without eating my breakfast, so I am awfully hungry.)<br/>\r\nThis is the correct sentence:<br/>\r\n朝飯を食べて来なかったので、腹が減ってたまらない。<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ・いＡ(て forms) + ならない<br/>\r\nなＡ + で + ならない"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
