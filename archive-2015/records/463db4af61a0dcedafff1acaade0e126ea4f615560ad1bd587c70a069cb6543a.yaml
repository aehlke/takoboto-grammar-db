notes:
  - position: 0
    text: "① Unclearly seen/Obscurely\n\n\n\r\n遠くに富士山がぼんやり見える。\n\r\nMt. Fuji can been seen dimly in the distance.\n\n\n\r\nこの漢字をぼんやりとしたが覚えていない。\n\r\nI have but a faint recollection of this kanji.\n\n\n\r\n朝ご飯食べなかったので、頭がぼんやりしているよ。\n\r\nI can't think clearly because I didnt eat breakfast\n\n\n\r\n② Carelessness\n\n\n\r\nぼんやりと海を眺めていた。\n\r\nHe was gazing vacently at the ocean.\n\n\n\r\nぼんやりするな！\n\r\nBe careful! (Don't space out!)\n\n\n\r\n③　Doing nothing at all\n\r\nぼんやりと暮らす\n\r\nidle one's time away\n\n\n\r\n④ Insenstive remarks\n\n\n\r\nぼんやりした人\n\r\ndimwit, blockhead, slow, thickheaded"
    html: "① Unclearly seen/Obscurely<br/>\n<br/>\r\n遠くに富士山がぼんやり見える。<br/>\r\nMt. Fuji can been seen dimly in the distance.<br/>\n<br/>\r\nこの漢字をぼんやりとしたが覚えていない。<br/>\r\nI have but a faint recollection of this kanji.<br/>\n<br/>\r\n朝ご飯食べなかったので、頭がぼんやりしているよ。<br/>\r\nI can't think clearly because I didnt eat breakfast<br/>\n<br/>\r\n② Carelessness<br/>\n<br/>\r\nぼんやりと海を眺めていた。<br/>\r\nHe was gazing vacently at the ocean.<br/>\n<br/>\r\nぼんやりするな！<br/>\r\nBe careful! (Don't space out!)<br/>\n<br/>\r\n③　Doing nothing at all<br/>\r\nぼんやりと暮らす<br/>\r\nidle one's time away<br/>\n<br/>\r\n④ Insenstive remarks<br/>\n<br/>\r\nぼんやりした人<br/>\r\ndimwit, blockhead, slow, thickheaded"
