    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJデズニーランドは子供に限らず大人にも人気がある。\">\n\t\t\t\tデズニーランドは子供<strong>に限らず</strong>大人にも人気がある。<strong></strong></a> <br/>\n\t\tDisneyland is popular \n\t\t<strong>not only </strong>\n\t\twith children but also with adults."
