    text: "＊に限り means 'limited to' (examples #\x01 and #\x01) whereas に限らず means 'not limited to; but also' (example #\x01).\n\n\n\r\nFORMATION:\n\r\nＮ + に限り・に限らず"
    html: "＊に限り means 'limited to' (examples <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nikagirazu#\x01\">#\x01</a></b> and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nikagirazu#\x01\">#\x01</a></b>) whereas に限らず means 'not limited to; but also' (example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=nikagirazu#\x01\">#\x01</a></b>).<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + に限り・に限らず"
