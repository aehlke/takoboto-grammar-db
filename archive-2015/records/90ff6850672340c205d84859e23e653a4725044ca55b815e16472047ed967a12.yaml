  - position: 12
    credits_raw: bamboo4
    text: |-
      Very interesting! I have to concede that "already" is informally used to show irritation for not doing something. So "get up already!" and other uses of "already" can be treated as something in the nature of dialectic idiom. Having said that, I prefer the current rendition for さっさと起きな.
    html: |-
      Very interesting! I have to concede that "already" is informally used to show irritation for not doing something. So "get up already!" and other uses of "already" can be treated as something in the nature of dialectic idiom. Having said that, I prefer the current rendition for さっさと起きな.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 13
    credits_raw: elentarisedai
    text: |-
      Well, although "get up already!" is rough and colloquial, it's still grammatically correct. "Already" is an adverb modifying the action of getting up. It's not to be compared with "think different," which uses an adjective to modify the verb "think." (I hate when people do that =p) I would consider it a good translation that retains the tone of the command in Japanese. Another natural-sounding translation might be "Get up this instant!" How's that one?
    html: |-
      Well, although "get up already!" is rough and colloquial, it's still grammatically correct. "Already" is an adverb modifying the action of getting up. It's not to be compared with "think different," which uses an adjective to modify the verb "think." (I hate when people do that =p) I would consider it a good translation that retains the tone of the command in Japanese. Another natural-sounding translation might be "Get up this instant!" How's that one?
    source_id: null
