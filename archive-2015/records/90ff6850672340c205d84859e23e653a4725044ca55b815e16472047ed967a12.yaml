  - position: 9
    credits_raw: ZACK
    text: "I have to disagree.\n\n\n\r\n\"Get up already!\" is perfectly good English to me.  Means exactly the same thing as \"You get up just this minute!,\" but is more natural.\n\n\n\r\n\"Hey, get up like right now !!!\" sounds like a non-Native Speaker doing translation."
    html: "I have to disagree.<br/>\n<br/>\r\n\"Get up already!\" is perfectly good English to me.  Means exactly the same thing as \"You get up just this minute!,\" but is more natural.<br/>\n<br/>\r\n\"Hey, get up like right now !!!\" sounds like a non-Native Speaker doing translation."
