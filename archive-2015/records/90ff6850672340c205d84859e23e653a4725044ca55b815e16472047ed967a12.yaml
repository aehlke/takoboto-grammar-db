  - position: 10
    credits_raw: shoujo_aya
    text: "'Get up already!' is most definitely American English. It doesn't sound grammatically correct to most British people. 'Get up right now!'  might sound more natural. \n\n\n\r\nPeople in the UK don't always use correct grammar but they don't tend to use American English either..."
    html: "'Get up already!' is most definitely American English. It doesn't sound grammatically correct to most British people. 'Get up right now!'  might sound more natural. <br/>\n<br/>\r\nPeople in the UK don't always use correct grammar but they don't tend to use American English either..."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: xtian21c
    text: "I would suggest \"get up already!\" is originally from American Jewish (Yiddish-German)-New York origin, akin to many phrases such as \"I see it already!\", \"I heard you already!\", \"Enough already!\", \"Relax, already!\", \"Shut up, already!\", etc. (cf. grammatical use of German word \"schon\".)\n\r\nOf course, people in the UK tend not to use American English routinely; they use their own. However, 'Amatuka' has a point, many UKians, Australians and others sometimes use American (cliche´) expressions for effect in their speech. (That's the power of Hollywood!) So, everyone understands \"get up already!\"\n\r\nHowever, I tend to agree with 'shoujo_aya', a more universal (and so arguably more preferable) translation would be \"Get up right now!\"."
    html: "I would suggest \"get up already!\" is originally from American Jewish (Yiddish-German)-New York origin, akin to many phrases such as \"I see it already!\", \"I heard you already!\", \"Enough already!\", \"Relax, already!\", \"Shut up, already!\", etc. (cf. grammatical use of German word \"schon\".)<br/>\r\nOf course, people in the UK tend not to use American English routinely; they use their own. However, 'Amatuka' has a point, many UKians, Australians and others sometimes use American (cliche´) expressions for effect in their speech. (That's the power of Hollywood!) So, everyone understands \"get up already!\"<br/>\r\nHowever, I tend to agree with 'shoujo_aya', a more universal (and so arguably more preferable) translation would be \"Get up right now!\"."
    source_id: null
