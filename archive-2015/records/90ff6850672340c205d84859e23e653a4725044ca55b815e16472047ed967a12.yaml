  - position: 14
    credits_raw: jasyn78
    text: |-
      i have to disagree with Zack.  I'm a native speaker, and in California, where the word "like" is constantly used where it traditionally shouldn't be, i have said many times, "dude, get up like right now".  although i admit it is slang and associated primarily with the southern California surfer guy or valley girl way of speaking.  but, just as a note, it is said by native speakers, even though its so regional that people from other parts of the country and world might think it is strange.  maybe it was a fellow Californian translating? Anyways, i gotta study like right now!
