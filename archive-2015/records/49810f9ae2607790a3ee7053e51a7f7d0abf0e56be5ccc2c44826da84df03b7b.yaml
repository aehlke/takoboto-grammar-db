notes:
  - position: 0
    text: "kurai \n\n\n\r\nliterally means how long or much, but often used in conversation for adding an \"about\" feeling to soften a phrase.\n\n\n\r\nsometimes pronounced gurai depending on the phrase before; for example if the sentence before ends with a vowel.\n\n\n\r\n3万ドルぐらい = about 30,000 dollars"
    html: "kurai <br/>\n<br/>\r\nliterally means how long or much, but often used in conversation for adding an \"about\" feeling to soften a phrase.<br/>\n<br/>\r\nsometimes pronounced gurai depending on the phrase before; for example if the sentence before ends with a vowel.<br/>\n<br/>\r\n3万ドルぐらい = about 30,000 dollars"
