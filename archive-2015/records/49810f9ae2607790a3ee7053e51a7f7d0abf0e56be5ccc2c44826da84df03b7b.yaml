  - position: 10
    credits_raw: mel
    text: "I have been taught to use it this way:\n\r\n\"ｘはｙくらいです\", meaning \"Y is about the only X\". This can only be used when Y is about the only case where X holds true. X and Y are both either nouns or noun phrases.\n\r\nE.g. 東京が静かになるのは，お盆のころくらいです。"
    html: "I have been taught to use it this way:<br/>\r\n\"ｘはｙくらいです\", meaning \"Y is about the only X\". This can only be used when Y is about the only case where X holds true. X and Y are both either nouns or noun phrases.<br/>\r\nE.g. 東京が静かになるのは，お盆のころくらいです。"
