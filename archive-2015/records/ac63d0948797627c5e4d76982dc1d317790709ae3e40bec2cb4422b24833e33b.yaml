notes:
  - position: 0
    text: "I`m not really sure if the translation for this is best represented above, but I know it is used in sentances that have \"all you can\" in them.\n\r\nits constructed by taking the ます　stem of the verb and adding 放題 and then it is treated as a noun. \n\n\n\r\nI have only heard it used with verbs and I have been corrected the few times I tried to use it with する　verbs.\n\n\n\r\nif your using a する verb, do not remove the する\n\r\nIE　勉強する\n\n\n\r\nWRONG >>>　勉強放題　\n\r\nRIGHT >>>  勉強し放題\n\n\n\r\nalso I think this is a good place to mention that Japanese don`t really use this construction, except with a few select words. Although 勉強し放題 is grammaticly correct. Its 変な日本語/Strange Japanese."
    html: "I`m not really sure if the translation for this is best represented above, but I know it is used in sentances that have \"all you can\" in them.<br/>\r\nits constructed by taking the ます　stem of the verb and adding 放題 and then it is treated as a noun. <br/>\n<br/>\r\nI have only heard it used with verbs and I have been corrected the few times I tried to use it with する　verbs.<br/>\n<br/>\r\nif your using a する verb, do not remove the する<br/>\r\nIE　勉強する<br/>\n<br/>\r\nWRONG &gt;&gt;&gt;　勉強放題　<br/>\r\nRIGHT &gt;&gt;&gt;  勉強し放題<br/>\n<br/>\r\nalso I think this is a good place to mention that Japanese don`t really use this construction, except with a few select words. Although 勉強し放題 is grammaticly correct. Its 変な日本語/Strange Japanese."
