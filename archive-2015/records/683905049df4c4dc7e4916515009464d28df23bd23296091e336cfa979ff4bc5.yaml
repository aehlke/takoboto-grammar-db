    text: "VBryk (masu)+ kakaru\n\r\n- a directed movement works on something/ someone\n\n\n\r\nex: 道を歩いていたら,男が僕に殴りかかってきた。When I was walking along the street, a man came to hit me.\n\n\n\r\nex: 花子は太郎の肩にもたれかかった。\n\r\nHanako leaned on Taro's shoulder\n\n\n\r\nex：壁により掛かるな。 Don't lean against the wall."
    html: "VBryk (masu)+ kakaru<br/>\r\n- a directed movement works on something/ someone<br/>\n<br/>\r\nex: 道を歩いていたら,男が僕に殴りかかってきた。When I was walking along the street, a man came to hit me.<br/>\n<br/>\r\nex: 花子は太郎の肩にもたれかかった。<br/>\r\nHanako leaned on Taro's shoulder<br/>\n<br/>\r\nex：壁により掛かるな。 Don't lean against the wall. <br/>"
