    body_text: "知識を通じてのみ、われわれは、一つの民族として、われわれの社会を脅かす危険に対処することができるからである。\r \n\n\t\tIt is only through knowledge that we, as a nation, can cope with the dangers that threaten our society."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ知識を通じてのみ、われわれは、一つの民族として、われわれの社会を脅かす危険に対処することができるからである。\">\n\t\t\t\t知識を<strong>通じて</strong>のみ、われわれは、一つの民族として、われわれの社会を脅かす危険に対処することができるからである。\r<strong></strong></a> <br/>\n\t\tIt is only through knowledge that we, as a nation, can cope with the dangers that threaten our society. \n\t\t<strong> </strong>"
