    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ教育は若い時代に限られてはならず、われわれの全生涯を通じて継続して行われるものでなければならない。\">\n\t\t\t\t教育は若い時代に限られてはならず、われわれの全生涯を<strong>通じて</strong>継続して行われるものでなければならない。\r<strong></strong></a> <br/>\n\t\tEducation must not be limited to our youth but must be a continuing process through our entire lives. \n\t\t<strong> </strong>"
