comments:
  - position: 0
    credits_raw: dc
    text: "どうか is derived from どう, meaning that an action or event is yet determined. E.g., 君はどうする = What are you going to do? どうしようもない = There is nothing one can do. \x01"
    html: "どうか is derived from どう, meaning that an action or event is yet determined. E.g., 君はどうする = What are you going to do? どうしようもない = There is nothing one can do. <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: yookoso
    text: "According to notes I have from a class I took, if a question word (e.g., nani,itsu) is present you use only か, otherwise use かどうか.\n\n\n\r\nAlso, a plain form precedes か and if it is a noun or A2 adjective だ is omitted."
    html: "According to notes I have from a class I took, if a question word (e.g., nani,itsu) is present you use only か, otherwise use かどうか.<br/>\n<br/>\r\nAlso, a plain form precedes か and if it is a noun or A2 adjective だ is omitted."
    source_id: null
    original_created_at: null
