  - position: 3
    credits_raw: atsui_nemurenai
    text: "The difference between shimau and kiru is not a matter of informal and formal, I don't use the words in that way as a native.Their nuance are different and they are used in a different way. \n\r\nKiru would be one intend to finish doing something \"to the end.\" \n\r\nShiamu would be one finish something,  \"sometimes\" with the nuance it was against one's will.\n\r\nハリーはなんとかその川を泳ぎきった。 ex4654\n\r\nHarry managed to swim across the river( with his intension.)\n\r\nハリーはなんとかその川を泳いで渡ってしまった。 \n\r\nHarry somehow managed to swim across the river.\n\n\n\r\nダイエット中のくせに彼女はケーキを食べきりました。 ex #\x01 \n\r\nEven though (despite the fact) she was on a diet, she ate all of the cake. (ate it to the end) . (She ate all knowing what she was doing.)\n\r\nダイエット中のくせに彼女はケーキを食べてしまった。\n\r\n(I don't know she ate cake all or not, anyway) although she is on diet, she ate a cake (as she could not stop herself.)\n\n\n\r\n夏休みが前に、宿題をやりきろう。\n\r\nLet's finish all the homework before summer vacation starts.\n\r\n夏休みが前に、宿題をできるだけやってしまおう。\n\r\nLet's finish homework as much as we can before summer vacation."
    html: "The difference between shimau and kiru is not a matter of informal and formal, I don't use the words in that way as a native.Their nuance are different and they are used in a different way. <br/>\r\nKiru would be one intend to finish doing something \"to the end.\" <br/>\r\nShiamu would be one finish something,  \"sometimes\" with the nuance it was against one's will.<br/>\r\nハリーはなんとかその川を泳ぎきった。 ex4654<br/>\r\nHarry managed to swim across the river( with his intension.)<br/>\r\nハリーはなんとかその川を泳いで渡ってしまった。 <br/>\r\nHarry somehow managed to swim across the river.<br/>\n<br/>\r\nダイエット中のくせに彼女はケーキを食べきりました。 ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=kiru#\x01\">#\x01</a></b> <br/>\r\nEven though (despite the fact) she was on a diet, she ate all of the cake. (ate it to the end) . (She ate all knowing what she was doing.)<br/>\r\nダイエット中のくせに彼女はケーキを食べてしまった。<br/>\r\n(I don't know she ate cake all or not, anyway) although she is on diet, she ate a cake (as she could not stop herself.)<br/>\n<br/>\r\n夏休みが前に、宿題をやりきろう。<br/>\r\nLet's finish all the homework before summer vacation starts.<br/>\r\n夏休みが前に、宿題をできるだけやってしまおう。<br/>\r\nLet's finish homework as much as we can before summer vacation."
