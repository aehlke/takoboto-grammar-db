    body_text: "パーティー会場に入るなり、サムは食べ物めがけて突進した。 \n\nAs soon as \n\t\the got to the party, Sam made a bee line for the food."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJパーティー会場に入るなり、サムは食べ物めがけて突進した。\">\n\t\t\t\tパーティー会場に入る<strong>なり</strong>、サムは食べ物めがけて突進した。<strong></strong></a> <br/>\n<strong>As soon as </strong>\n\t\the got to the party, Sam made a bee line for the food."
