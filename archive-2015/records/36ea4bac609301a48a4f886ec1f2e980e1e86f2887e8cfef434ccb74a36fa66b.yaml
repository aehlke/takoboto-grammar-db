comments:
  - position: 0
    credits_raw: blabby
    text: "My book says that this is for a strange or unexpected event.\n\n\n\r\nX スイッチを入れるなり電気がついた。\n\r\nO スイッチを入れると電気がついた。\n\r\nO スイッチを入れるなり爆発が起きた。\n\n\n\r\nHowever, my book says it is only used for Verb(辞書形)+なり, but I have sometimes seen cases of Verb(た形)+なり from other sources. Does anyone know which is correct?"
    html: "My book says that this is for a strange or unexpected event.<br/>\n<br/>\r\nX スイッチを入れるなり電気がついた。<br/>\r\nO スイッチを入れると電気がついた。<br/>\r\nO スイッチを入れるなり爆発が起きた。<br/>\n<br/>\r\nHowever, my book says it is only used for Verb(辞書形)+なり, but I have sometimes seen cases of Verb(た形)+なり from other sources. Does anyone know which is correct?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "Verb(た形)+なり  is used in a different way. It implies one movement is continuing. 〜したまま。\n\r\n会社を出たなり、いつまでも帰らない。He left the office and hasn't come back.\n\r\n彼女を見つめたなり、しばらくの間微動だにしなかった。He stared at her and didn't move an inch for a while.\n\r\nYou can find better translations."
    html: "Verb(た形)+なり  is used in a different way. It implies one movement is continuing. 〜したまま。<br/>\r\n会社を出たなり、いつまでも帰らない。He left the office and hasn't come back.<br/>\r\n彼女を見つめたなり、しばらくの間微動だにしなかった。He stared at her and didn't move an inch for a while.<br/>\r\nYou can find better translations."
    source_id: null
    original_created_at: null
    original_updated_at: null
