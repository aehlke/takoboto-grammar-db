    body_text: "教室に入るなり、先生は突然怒ったような口調で話しはじめた。 \n\nOn entering \n\t\tthe classroom, our teacher burst into angry speech."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ教室に入るなり、先生は突然怒ったような口調で話しはじめた。\">\n\t\t\t\t教室に入る<strong>なり</strong>、先生は突然怒ったような口調で話しはじめた。<strong></strong></a> <br/>\n<strong>On entering </strong>\n\t\tthe classroom, our teacher burst into angry speech."
