  - position: 3
    credits_raw: b4mb4mb4m
    text: "What about a (noun)+なり？\n\n\n\r\nExample: きりとて、二つが相容れることもまた不可能なり。\n\n\n\r\nThe nari is after　不可能 which is a noun or na-adj. \n\n\n\r\nAny idea what nari means here?"
    html: "What about a (noun)+なり？<br/>\n<br/>\r\nExample: きりとて、二つが相容れることもまた不可能なり。<br/>\n<br/>\r\nThe nari is after　不可能 which is a noun or na-adj. <br/>\n<br/>\r\nAny idea what nari means here?"
    source_id: null
