    japanese: それを自分に対して、ましてや他人に対して認めるのは、とても難しいことだ。
    body_text: "それを自分に対して、ましてや他人に対して認めるのは、とても難しいことだ。 \r \n\n\t\tIt's very hard to admit that to yourself let alone to other people."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそれを自分に対して、ましてや他人に対して認めるのは、とても難しいことだ。 \">\n\t\t\t\tそれを自分に対して、<strong>ましてや</strong>他人に対して認めるのは、とても難しいことだ。 \r<strong></strong></a> <br/>\n\t\tIt's very hard to admit that to yourself let alone to other people. \n\t\t<strong> </strong>"
    credits_raw: Rukawa
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5483
    position: 1
    japanese: 私はギターを弾くことはできない。ましてやバイオリンは弾けない。
    body_text: "私はギターを弾くことはできない。ましてやバイオリンは弾けない。 \r \n\n\t\tI can't play the guitar, much less the violin."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私はギターを弾くことはできない。ましてやバイオリンは弾けない。 \">\n\t\t\t\t私はギターを弾くことはできない。<strong>ましてや</strong>バイオリンは弾けない。 \r<strong></strong></a> <br/>\n\t\tI can't play the guitar, much less the violin. \n\t\t<strong> </strong>"
    credits_raw: Rukawa
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5484
    position: 2
    japanese: 私は誰にもこの時計を貸すつもりはありません。ましてや手放すつもりなど毛頭ありません。
    body_text: "私は誰にもこの時計を貸すつもりはありません。ましてや手放すつもりなど毛頭ありません。 \r \n\n\t\tI have no intention of lending this watch to anyone, much less parting with it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私は誰にもこの時計を貸すつもりはありません。ましてや手放すつもりなど毛頭ありません。 \">\n\t\t\t\t私は誰にもこの時計を貸すつもりはありません。<strong>ましてや</strong>手放すつもりなど毛頭ありません。 \r<strong></strong></a> <br/>\n\t\tI have no intention of lending this watch to anyone, much less parting with it. \n\t\t<strong> </strong>"
    credits_raw: Rukawa
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5485
    position: 3
    japanese: 私は中古車を買う余裕などなく、ましてや新車などはもってのほかだ。
    body_text: "私は中古車を買う余裕などなく、ましてや新車などはもってのほかだ。 \r \n\n\t\tI can't afford to buy a used car, much less a new car."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私は中古車を買う余裕などなく、ましてや新車などはもってのほかだ。 \">\n\t\t\t\t私は中古車を買う余裕などなく、<strong>ましてや</strong>新車などはもってのほかだ。 \r<strong></strong></a> <br/>\n\t\tI can't afford to buy a used car, much less a new car. \n\t\t<strong> </strong>"
    credits_raw: Rukawa
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5486
    position: 4
    japanese: 彼は、フランス語を話せる、ましてや英語も話せる。
    body_text: "彼は、フランス語を話せる、ましてや英語も話せる。\r \n\n\t\tHe can speak French, still more English."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は、フランス語を話せる、ましてや英語も話せる。\">\n\t\t\t\t彼は、フランス語を話せる、<strong>ましてや</strong>英語も話せる。\r<strong></strong></a> <br/>\n\t\tHe can speak French, still more English. \n\t\t<strong> </strong>"
