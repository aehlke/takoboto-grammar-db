    text: "それは何と言うかどうかわかりませんけど、ちょっと英訳してみようと思ったんですので　がんばってる！！！！！\n\n\n\r\n自分さえ良ければ　＝　If it is ok with One`s self\n\r\n他はどうなってもいい　＝　a good way to be come something else\n\n\n\r\nIt doesn`t make much sense as it is, but if you change it a little.\n\n\n\r\n自分さえ良くなければ　他はどうになってもいい？\n\n\n\r\nand you get. \n\r\nIf your not okay with who you are, how can you become something else. \n\n\n\r\ninteresting \n\r\n僕のアドバイスは　もし自分があまり好きじゃなかったら、どうなようなことが好きだと考えて、そなのことになってみた方がいいだと思います."
