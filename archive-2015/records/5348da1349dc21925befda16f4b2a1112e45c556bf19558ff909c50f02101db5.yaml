  - position: 1
    credits_raw: Amatuka
    text: "Formed from -te form verb + iru (e.g. 行く → 行っている)\n\n\n\r\nVte = -te form verb."
    html: "Formed from -te form verb + iru (e.g. 行く → 行っている)<br/>\n<br/>\r\nVte = -te form verb."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "Dropping the い \x01 is a common abbreviation.\n\r\n(e.g.  行っている ->  行ってる [itteiru → itteru])"
    html: "Dropping the い <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is a common abbreviation.<br/>\r\n(e.g.  行っている -&gt;  行ってる [itteiru → itteru])"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Amatuka
    text: "There are quite a few differrent usages of this form,\n\r\n1. Ongoing action\n\r\n公園で子どもが遊んでいる。 [kouen de kodomo ga asondeiru.]\n\r\n(The) children are playing at the park.\n\r\n2. Ongoing state (result of an action)\n\r\nエアコンがついている。[eakon ga tsuiteiru.]\n\r\nThe airconditioner is on.\n\r\n3. (as negative) Action not yet taken.\n\r\nまだ昼ご飯を食べていない。[mada hirugohan wo tabeteinai.]\n\r\nI haven't had lunch yet.\n\r\n(Note this is different from 昼ご飯を食べない。[hirugohan wo tabenai.] I'm not going to eat lunch.\n\r\n4. Experience\n\r\n本を書いてる。[hon wo kaiteru.] I've written a book.\n\r\n5. Repetative actions.\n\r\n僕はよく映画館に行っている。[boku ha yoku eigakan ni itteiru.]\n\r\nI often go to the cinema.\n\r\n6. Condition\n\r\n彼は太っている。[kare ha futotteiru.]\n\r\nHe's fat."
    html: "There are quite a few differrent usages of this form,<br/>\r\n1. Ongoing action<br/>\r\n公園で子どもが遊んでいる。 [kouen de kodomo ga asondeiru.]<br/>\r\n(The) children are playing at the park.<br/>\r\n2. Ongoing state (result of an action)<br/>\r\nエアコンがついている。[eakon ga tsuiteiru.]<br/>\r\nThe airconditioner is on.<br/>\r\n3. (as negative) Action not <b>yet</b> taken.<br/>\r\nまだ昼ご飯を食べていない。[mada hirugohan wo tabeteinai.]<br/>\r\nI haven't had lunch yet.<br/>\r\n(Note this is different from 昼ご飯を食べない。[hirugohan wo tabenai.] I'm not going to eat lunch.<br/>\r\n4. Experience<br/>\r\n本を書いてる。[hon wo kaiteru.] I've written a book.<br/>\r\n5. Repetative actions.<br/>\r\n僕はよく映画館に行っている。[boku ha yoku eigakan ni itteiru.]<br/>\r\nI often go to the cinema.<br/>\r\n6. Condition<br/>\r\n彼は太っている。[kare ha futotteiru.]<br/>\r\nHe's fat.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Amatuka
    text: "ている \x01 can't be used with the verbs of existance (e.g. ある \x01 and いる \x01)"
    html: "ている <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> can't be used with the verbs of existance (e.g. ある <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> and いる <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: tataku
    text: "2. Ongoing state (result of an action)\n\r\n  エアコンがついている。[eakon ga tsuiteiru.]\n\r\n  The airconditioner is on.\n\r\nNote that this use is only with intransitive verbs. If it were the transitive form of this verb (tsukeru, rather than tsuku), it would be -tearu (eakon ga tsuketearu)."
    html: "2. Ongoing state (result of an action)<br/>\r\n  エアコンがついている。[eakon ga tsuiteiru.]<br/>\r\n  The airconditioner is on.<br/>\r\nNote that this use is only with intransitive verbs. If it were the transitive form of this verb (tsukeru, rather than tsuku), it would be -tearu (eakon ga tsuketearu)."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: ミサ坊
    text: "One of the things of this grammar point that normally confuses me is the usage of \n\r\n待って　and 待ってて. \n\n\n\r\nI am guessing that 待って implies \"Wait a moment\" and that 待ってて implies something like \"Wait(and continue waiting for a while)\"\n\r\nCan anyone clarify?"
    html: "One of the things of this grammar point that normally confuses me is the usage of <br/>\r\n待って　and 待ってて. <br/>\n<br/>\r\nI am guessing that 待って implies \"Wait a moment\" and that 待ってて implies something like \"Wait(and continue waiting for a while)\"<br/>\r\nCan anyone clarify?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: bshock
    text: If 本を書いてる。= "I've written a book," and you wished to say "I'm writing a book," how would this form change?
    html: |-
      If 本を書いてる。= "I've written a book," and you wished to say "I'm writing a book," how would this form change?<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: koueihou
    text: To bshock, I probably translate "I'm writing a book" as "本を書いている。”？
    html: To bshock, I probably translate "I'm writing a book" as "本を書いている。”？
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: tigert
    text: "Hey ミサ, I asked my coworker what the diffrence is and he confirmed your guess. \n\n\n\r\n待って　is something that is currently being done and 待ってて is something that will be started after the completion of something else. \n\n\n\r\nIE if your teacher askes for your homework and you have to dig in your backpack to get it, 待ってください\n\n\n\r\nif you are in the middle of completing your homework. 待っててください。\n\n\n\r\nI give you 10 points for posting this question. I have always used both interchangable (not a problem if you do) but its always good to learn a little more about the smaller meanings within the words."
    html: "Hey ミサ, I asked my coworker what the diffrence is and he confirmed your guess. <br/>\n<br/>\r\n待って　is something that is currently being done and 待ってて is something that will be started after the completion of something else. <br/>\n<br/>\r\nIE if your teacher askes for your homework and you have to dig in your backpack to get it, 待ってください<br/>\n<br/>\r\nif you are in the middle of completing your homework. 待っててください。<br/>\n<br/>\r\nI give you 10 points for posting this question. I have always used both interchangable (not a problem if you do) but its always good to learn a little more about the smaller meanings within the words."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: ken274
    text: "I'm still not sure when it's appropriate to use this form in the past tense ていた. For example, if I wanted to say \"Yesterday we talked/ate a lot, didn't we?\" would it be:\n\n\n\r\n昨日よく話してたなぁ\t\t\t昨日よく食べてたなぁ\n\r\nor: 昨日よく話したなぁ\t\t昨日よく食べたなぁ\n\n\n\r\nI used to use the second (non ていた) form exclusively as is the general useage pattern in English, despite the fact in the present tense you'd generally say 話している as talking is a continuous action, but recently I've noticed that the ていた form is used quite a lot too. Anyone have any idea what the exact difference between these two forms is?\n\n\n\r\nOther examples might include:\n\n\n\r\n昨日よく寝てた      -> seems to be more commonly used\n\r\nand: 昨日よく寝た\n\n\n\r\nAlso, to bshock above - surely \"I've written a book\" is also better translated in this past tense version of ている:\n\n\n\r\n本を書いてた (i.e. I wrote a book, and I'm still in that state)"
    html: "I'm still not sure when it's appropriate to use this form in the past tense ていた. For example, if I wanted to say \"Yesterday we talked/ate a lot, didn't we?\" would it be:<br/>\n<br/>\r\n昨日よく話してたなぁ\t\t\t昨日よく食べてたなぁ<br/>\r\nor: 昨日よく話したなぁ\t\t昨日よく食べたなぁ<br/>\n<br/>\r\nI used to use the second (non ていた) form exclusively as is the general useage pattern in English, despite the fact in the present tense you'd generally say 話している as talking is a continuous action, but recently I've noticed that the ていた form is used quite a lot too. Anyone have any idea what the exact difference between these two forms is?<br/>\n<br/>\r\nOther examples might include:<br/>\n<br/>\r\n昨日よく寝てた      -&gt; seems to be more commonly used<br/>\r\nand: 昨日よく寝た<br/>\n<br/>\r\nAlso, to bshock above - surely \"I've written a book\" is also better translated in this past tense version of ている:<br/>\n<br/>\r\n本を書いてた (i.e. I wrote a book, and I'm still in that state)"
    source_id: null
    original_created_at: null
    original_updated_at: null
