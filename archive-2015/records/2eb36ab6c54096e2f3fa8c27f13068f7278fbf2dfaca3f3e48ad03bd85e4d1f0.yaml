notes:
  - position: 0
    text: "The kanji are just given for reference. Kana spelling is normal today. \n\r\nThese words are part of what is called kosoado. The ko, so and a indicate the relation to the speaker, the re turns them into the pronouns for a certain object.\n\r\nThe most important thing to remember is that you cannot these words to say, for example, \"I want this apple\" = \"kore ringo ga hoshii.\" That is wrong. You can only use them for \"I want this.\"\n\r\n(\"this apple\" would be \"kono ringo\")"
    html: "The kanji are just given for reference. Kana spelling is normal today. <br/>\r\nThese words are part of what is called kosoado. The ko, so and a indicate the relation to the speaker, the re turns them into the pronouns for a certain object.<br/>\r\nThe most important thing to remember is that you cannot these words to say, for example, \"I want this apple\" = \"kore ringo ga hoshii.\" That is wrong. You can only use them for \"I want this.\"<br/>\r\n(\"this apple\" would be \"kono ringo\")"
