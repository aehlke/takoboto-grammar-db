  - position: 16
    credits_raw: seanohagan
    text: "[#\x01]: \"still\" should be changed to \"only\". \"Still\" implies that it has been 4 o'clock for a long time. But of course, it is only ever 4 o'clock for an instant."
    html: "[<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=no-3#\x01\">#\x01</a></b>]: \"still\" should be changed to \"only\". \"Still\" implies that it has been 4 o'clock for a long time. But of course, it is only ever 4 o'clock for an instant."
