  - position: 15
    credits_raw: sato
    text: "In an interrogative sentence, の by males is common, but perfectly not in an affirmative.\n\n#\x01 ですの is old-fashioned. We prefer to 何で?(if he/she is familiar) or 何がですか?(if not)"
    html: "In an interrogative sentence, の by males is common, but perfectly not in an affirmative.<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=no-3#\x01\">#\x01</a></b> ですの is old-fashioned. We prefer to 何で?(if he/she is familiar) or 何がですか?(if not)"
    source_id: null
