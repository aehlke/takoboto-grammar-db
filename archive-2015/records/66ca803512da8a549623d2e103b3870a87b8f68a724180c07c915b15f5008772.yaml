  - position: 3
    text: "Most -eru verbs are Ichidan (-ru) verbs. The are basically 3 exceptions to this which are regularly used, so if you remember them you'll be fine.\n\r\n喋る ー＞喋ります \n\r\n帰る ー＞帰ります \n\r\n返る ー＞返ります \n\r\nThere are probably more exceptions to this, but as I said, these here are what you hear every day."
    html: "Most -eru verbs are Ichidan (-ru) verbs. The are basically 3 exceptions to this which are regularly used, so if you remember them you'll be fine.<br/>\r\n喋<b>る </b>ー＞喋<b>ります </b><br/>\r\n帰<b>る </b>ー＞帰<b>ります </b><br/>\r\n返<b>る </b>ー＞返<b>ります </b><br/>\r\nThere are probably more exceptions to this, but as I said, these here are what you hear every day."
