    text: "I forgot to mention the irregular verbs:\n\n\n\r\nV-masu:\n\r\nSuru = shimasu\n\r\nKuru = kimasu\n\n\n\r\nV-'te:\n\r\nSuru = shite\n\r\nKuru = kite\n\r\nIku = itte NOT iite\n\n\n\r\nV-nai:\n\r\nSuru = shinai\n\r\nKuru = konai\n\r\nAru = nai NOT aranai"
