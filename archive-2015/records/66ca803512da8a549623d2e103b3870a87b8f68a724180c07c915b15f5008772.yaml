  - position: 1
    text: "Not ALL -/i/ru and -/e/ru verbs are known as /ru/ verbs. (these are verbs that drop the ru at the end)\n\r\nBasically, all -ru verbs end with -/i/ru and -/e/ru, but not all -/i/ru and -/e/ru verbs are -ru verbs. An example will clear it up.\n\n\n\r\nSample -ru verbs:\n\r\ntaberu;　食べる\n\r\nhajimeru; 始める\n\r\nhairu; 入る\n\r\nderu; 出る\n\r\nokiru; 起きる\n\n\n\r\nSample -/u/ verbs that end in -/i/ru or -/e/ru:\n\r\niru; 要る\n\r\nkiru; 切る\n\r\nshaberu; しゃべる\n\r\nshiru; 知る\n\n\n\r\nThese are only examples. 95% of all -/i/ru and -/e/ru verbs are -ru verbs. Take note of the exceptions and you will be fine."
    html: "Not ALL -/i/ru and -/e/ru verbs are known as /ru/ verbs. (these are verbs that drop the ru at the end)<br/>\r\nBasically, all -ru verbs end with -/i/ru and -/e/ru, but not all -/i/ru and -/e/ru verbs are -ru verbs. An example will clear it up.<br/>\n<br/>\r\nSample -ru verbs:<br/>\r\ntabe<b>ru</b>;　食べ<b>る</b><br/>\r\nhajime<b>ru</b>; 始め<b>る</b><br/>\r\nhai<b>ru</b>; 入<b>る</b><br/>\r\nde<b>ru</b>; 出<b>る</b><br/>\r\noki<b>ru</b>; 起き<b>る</b><br/>\n<br/>\r\nSample -/u/ verbs that end in -/i/ru or -/e/ru:<br/>\r\nir<b>u</b>; 要<b>る</b><br/>\r\nkir<b>u</b>; 切<b>る</b><br/>\r\nshaber<b>u</b>; しゃべ<b>る</b><br/>\r\nshir<b>u</b>; 知<b>る</b><br/>\n<br/>\r\nThese are only examples. 95% of all -/i/ru and -/e/ru verbs are -ru verbs. Take note of the exceptions and you will be fine."
    credits_raw: flamewizzy21
