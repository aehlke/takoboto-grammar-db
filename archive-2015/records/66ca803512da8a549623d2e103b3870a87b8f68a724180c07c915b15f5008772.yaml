    text: "Basics\n\r\n---\n\r\nV-masu:\n\r\n-iru/-eru: remove 'ru' and add -masu \n\r\nex: (taberu = tabe-masu; miru = mimasu0\n\r\nEverything else: change last syllable to 'i' row\n\r\nex: (yomu = yomimasu; tobu = tobimasu)\n\n\n\r\nV-'te\n\r\n-iru/-eru: change 'ru' to 'te'\n\r\nex: shinjiru = shinjite; ikiru = ikite\n\r\n-ku: change 'ku' to 'i' and add 'te'\n\r\nex: naku = naite; saku = saite\n\r\n-gu: change 'gu' to 'i' and add 'de'\n\r\nex: nugu = nuide; sawagu = sawaide\n\r\n-tsu/-ru/-u: change 'tsu'/'ru'/'u' to 't' and add 'te'\n\r\nex: tatsu = tatte; tooru = tootte\n\r\n-nu/-mu/-bu: change 'nu'/'mu'/'bu' to 'n' and add 'de'\n\r\n-su: change 'su' to 'shi' and add 'te'\n\r\nex: utsusu = utsushite; shimesu = shimeshite\n\r\n*There are exeption -iru/-eru that follow the -ru rule:\n\r\nex: hashiru = hashitte; kaeru = kaette\n\n\n\r\nV-nai\n\r\n-iru/-eru: remove 'ru' and add 'nai'\n\r\nex: kanjiru = kanjinai; ateru = atenai\n\r\nEverything else: change last syllable to 'a' row\n\r\nex: watasu = watasanai, chikayoru = chikayoranai"
    html: "Basics<br/>\r\n---<br/>\r\nV-masu:<br/>\r\n-iru/-eru: remove 'ru' and add -masu <br/>\r\nex: (taberu = tabe-masu; miru = mimasu0<br/>\r\nEverything else: change last syllable to 'i' row<br/>\r\nex: (yomu = yomimasu; tobu = tobimasu)<br/>\n<br/>\r\nV-'te<br/>\r\n-iru/-eru: change 'ru' to 'te'<br/>\r\nex: shinjiru = shinjite; ikiru = ikite<br/>\r\n-ku: change 'ku' to 'i' and add 'te'<br/>\r\nex: naku = naite; saku = saite<br/>\r\n-gu: change 'gu' to 'i' and add 'de'<br/>\r\nex: nugu = nuide; sawagu = sawaide<br/>\r\n-tsu/-ru/-u: change 'tsu'/'ru'/'u' to 't' and add 'te'<br/>\r\nex: tatsu = tatte; tooru = tootte<br/>\r\n-nu/-mu/-bu: change 'nu'/'mu'/'bu' to 'n' and add 'de'<br/>\r\n-su: change 'su' to 'shi' and add 'te'<br/>\r\nex: utsusu = utsushite; shimesu = shimeshite<br/>\r\n*There are exeption -iru/-eru that follow the -ru rule:<br/>\r\nex: hashiru = hashitte; kaeru = kaette<br/>\n<br/>\r\nV-nai<br/>\r\n-iru/-eru: remove 'ru' and add 'nai'<br/>\r\nex: kanjiru = kanjinai; ateru = atenai<br/>\r\nEverything else: change last syllable to 'a' row<br/>\r\nex: watasu = watasanai, chikayoru = chikayoranai"
