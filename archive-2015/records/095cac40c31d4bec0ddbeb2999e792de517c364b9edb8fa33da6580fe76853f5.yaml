notes:
  - position: 0
    text: "\x01\n\n\n\r\nLike \x01 iru is also an stative (non-action) verb. Iru, unlike aru is used to express \"is\" or \"exists\" for living things, people, or beings, with plants being excluded.\n\r\nLike \x01, iru uses \x01/に to indicate the location when specified.\n\n\n\n\x01 also is used as an auxillary verb to form progressive tenses. Similar in function to English's verb \"to be\" in the following: He is going, I was going, We are going, etc.\n\n\n\n\x01 does not require the use of \x01/が.\n\n\n\r\nWhen \x01 is used in an auxillary form, it can be used with non-living things just like \x01.\n\n\n\r\nFor an auxillary form, \x01 is usually preceeded by the -te form of the other verb. Then iru is conjugated accordingly.\n\n\n\n\n\r\nAruite imasu. --> (He/she,you/it/etc.) is walking.\n\r\nAruite imashita. (He/she,you/it/etc.) was walking.\n\n\n\r\nNote that iru cannot be used for the future tense, as there isn't a real future tense in Japan. Therefore, sentences like \"He will be going.\" will not exist.\n\n\n\nOther notes\n\n\x01 is commonly written with kana alone, instead of kanji. Kanji can be used in written Japanese to indicate subtle nuances in meaning."
    html: "<b><b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b></b><br/>\n<br/>\r\nLike <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> iru is also an stative (non-action) verb. Iru, unlike aru is used to express \"is\" or \"exists\" for living things, people, or beings, with plants being excluded.<br/>\r\nLike <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>, iru uses <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/に to indicate the location when specified.<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> also is used as an auxillary verb to form progressive tenses. Similar in function to English's verb \"to be\" in the following: He <b>is</b> going, I <b>was</b> going, We <b>are</b> going, etc.<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> does not require the use of <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/が.<br/>\n<br/>\r\nWhen <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is used in an auxillary form, it can be used with non-living things just like <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>.<br/>\n<br/>\r\nFor an auxillary form, <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is usually preceeded by the -te form of the other verb. Then iru is conjugated accordingly.<br/>\n<br/>\n<br/>\r\nAruite imasu. --&gt; (He/she,you/it/etc.) is walking.<br/>\r\nAruite imashita. (He/she,you/it/etc.) was walking.<br/>\n<br/>\r\nNote that iru cannot be used for the future tense, as there isn't a real future tense in Japan. Therefore, sentences like \"He will be going.\" will not exist.<br/>\n<br/>\n<b>Other notes</b><br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is commonly written with kana alone, instead of kanji. Kanji can be used in written Japanese to indicate subtle nuances in meaning."
