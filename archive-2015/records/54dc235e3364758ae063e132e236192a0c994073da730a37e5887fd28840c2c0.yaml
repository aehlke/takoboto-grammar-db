  - position: 4
    credits_raw: Miki
    text: "#\x01 Japanese is weird. I would say どんな卵料理が作れますか。\n\r\nFor exmaple 「何風のお好み焼きが作れますか。」「広島風です。」\n\r\nor どんな風に卵を料理しますか。How do you cook an egg?"
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=fuu#\x01\">#\x01</a></b> Japanese is weird. I would say どんな卵料理が作れますか。<br/>\r\nFor exmaple 「何風のお好み焼きが作れますか。」「広島風です。」<br/>\r\nor どんな風に卵を料理しますか。How do you cook an egg?"
