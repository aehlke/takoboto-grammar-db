    text: "I think \"to almost start\"  and  \"to start (but not finish)\"  are just dependent on whether the verb describes a durative action or instantaneous one.\n\n\n\r\nEg.\n\n\n\r\nInstantaneous = hajimakakeru \"just about to start\" ('started to [but not finished] start' is  clumsy)"
