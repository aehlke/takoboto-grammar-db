notes:
  - position: 0
    text: "<b>~kakeru</b> is for verbs:\n\r\n言いかけ　（いいかけ）\n\r\nIn the middle of saying something\n\n\n\r\n本を読みかけて、寝てしまいました\n\r\nI fell asleep with the book half read.\n\n\n\r\n<b>~kakeno</b> is a modifier for nouns (eg. tabekake no ringo)\n\r\n食べかけのりんご\n\r\nA half-eaten apple\n\n\n\r\n<b>~kake da</b> comes at the end of a sentence\n\r\nwhere だ is derived from です\n\r\n書きかけだ\n\r\nit is in the middle of being written"
    html: "&lt;b&gt;~kakeru&lt;/b&gt; is for verbs:<br/>\r\n言いかけ　（いいかけ）<br/>\r\nIn the middle of saying something<br/>\n<br/>\r\n本を読みかけて、寝てしまいました<br/>\r\nI fell asleep with the book half read.<br/>\n<br/>\r\n&lt;b&gt;~kakeno&lt;/b&gt; is a modifier for nouns (eg. tabekake no ringo)<br/>\r\n食べかけのりんご<br/>\r\nA half-eaten apple<br/>\n<br/>\r\n&lt;b&gt;~kake da&lt;/b&gt; comes at the end of a sentence<br/>\r\nwhere だ is derived from です<br/>\r\n書きかけだ<br/>\r\nit is in the middle of being written<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
