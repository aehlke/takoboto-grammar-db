    text: "~のような (〜の様な), usually written in kana, means \"like, similar to\"; compare to ~ようだ \x01 meaning \"seeming to be, appearing to be\" and usually written at sentence-end, and 〜ように \x01* meaning \"in order to (e.g. meet goal), so that\".\n\r\n*〜ように \x01 at the end of a sentence indicates hope, wish, request or mild command."
