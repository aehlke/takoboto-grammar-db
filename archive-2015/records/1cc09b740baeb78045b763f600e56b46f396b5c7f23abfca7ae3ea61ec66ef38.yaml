  - position: 6
    credits_raw: kuma
    text: "This grammar is indeed for 1kyuu and does not always belog to the written language. If you hold a speech the form \"-teyamimasen\" 「てやみません」\n\n\n\r\nIt comes from the word「やむ」that means stop. For example you can say 「雨いつごろやむかな」, which corresponds to when you in English want to say \"When will it stop raining, I wonder\".\n\n\n\r\nOr this \n\r\nA>「あれ、ピアノの音がやんだ。レッスン終わったんだ」Eh? The sound of the piano stopped. The lesson is over.\n\n\n\r\nB>　「そうね」Yes, indeed."
    html: "This grammar is indeed for 1kyuu and does not always belog to the written language. If you hold a speech the form \"-teyamimasen\" 「てやみません」<br/>\n<br/>\r\nIt comes from the word「やむ」that means stop. For example you can say 「雨いつごろやむかな」, which corresponds to when you in English want to say \"When will it stop raining, I wonder\".<br/>\n<br/>\r\nOr this <br/>\r\nA&gt;「あれ、ピアノの音がやんだ。レッスン終わったんだ」Eh? The sound of the piano stopped. The lesson is over.<br/>\n<br/>\r\nB&gt;　「そうね」Yes, indeed.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: 誠
    text: "I think ex #\x01 doesn't really belongs to this category, rather it belongs to the verb 「やむ」、although this grammar comes from the word 「やむ」。"
