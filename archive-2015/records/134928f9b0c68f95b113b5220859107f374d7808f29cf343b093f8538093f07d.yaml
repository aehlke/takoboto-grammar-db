    text: "This is usually followed by a negative.\n\n\n\r\n　imasara (verb-ta) tokorode, (verb2-nai)\n\r\n　imasara setsumei shita tokorode, yurusanai.\n\n\n\r\n= its too late to explain - you won't be forgiven"
    html: "This is usually followed by a negative.<br/>\n<br/>\r\n　imasara (verb-ta) tokorode, (verb2-nai)<br/>\r\n　imasara setsumei shita tokorode, yurusanai.<br/>\n<br/>\r\n= its too late to explain - you won't be forgiven"
