  - position: 3
    text: "Kanzen Master has this listed under ~たところで, which apparently on it's own can also express that the first part of the sentence would be a wasted effort, e.g.\n\r\n約束の時間にこんなに遅れては、行ってみたところで、だれもいないだろう\n\r\n(what with it being so late after the agreed time, even if I went now, surely there'd be no one there.)\n\n\n\nさらに really emphasizes how late in the day such an ineffective action would be. Nevertheless, keep in the back of your mind that たところで can exist on it's own with a similar meaning.\n\r\nOn past test papers I've had questions that lead with さらに and the correct answer they wanted for the blank that came after was たところで so maybe it's worth learning these as a pair, this will also help you distinguish it from [toshitatokorode toshitatte nishitatokorode] etc. which has a slightly different nuance meaning even though the first part of the sentence is NOT a wasted effort, the final result doesn't satisfy."
    html: "Kanzen Master has this listed under <strong>~たところで</strong>, which apparently on it's own can also express that the first part of the sentence would be a wasted effort, e.g.<br/>\r\n約束の時間にこんなに遅れては、行ってみ<strong>たところで</strong>、だれもいないだろう<br/>\r\n(what with it being so late after the agreed time, even if I went now, surely there'd be no one there.)<br/>\n<br/>\n<strong>さらに</strong> really emphasizes how late in the day such an ineffective action would be. Nevertheless, keep in the back of your mind that <strong>たところで</strong> can exist on it's own with a similar meaning.<br/>\r\nOn past test papers I've had questions that lead with <strong>さらに</strong> and the correct answer they wanted for the blank that came after was <strong>たところで</strong> so maybe it's worth learning these as a pair, this will also help you distinguish it from [toshitatokorode toshitatte nishitatokorode] etc. which has a slightly different nuance meaning even though the first part of the sentence is NOT a wasted effort, the final result doesn't satisfy."
    credits_raw: LR
    source_id: null
    original_created_at: null
    original_updated_at: null
