    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: "ex#\x01 遅くなったすみません should be separated in writing. 遅くなった。すみません。But 遅くなったin this sentence sounds rude and childish. If you are making an excuse, you should say 事故で電車が遅れたものですから、遅くなりました。or 遅くなってしまいました。すみません。"
    html: "ex<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=monodesukara#\x01\">#\x01</a></b> 遅くなったすみません should be separated in writing. 遅くなった。すみません。But 遅くなったin this sentence sounds rude and childish. If you are making an excuse, you should say 事故で電車が遅れたものですから、遅くなりました。or 遅くなってしまいました。すみません。<br/>"
