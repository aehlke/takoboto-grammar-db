    credits_raw: Ludi
    text: "Shouldn't it be:\n\r\nex #\x01 遅くなってすみません。\n\r\n?\n\r\nMonodakara is used when you want to justify yourself about something"
    html: "Shouldn't it be:<br/>\r\nex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=monodesukara#\x01\">#\x01</a></b> 遅くなってすみません。<br/>\r\n?<br/>\r\nMonodakara is used when you want to justify yourself about something"
    source_id: null
