comments:
  - position: 0
    credits_raw: dc
    text: を契機に is very formal. also see ついでに - much more common in real speech
    html: を契機に is very formal. also see ついでに - much more common in real speech
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: |-
      You are entirely correct. BTW, 中国に 行ったの を景気に should be corrected to read: 中国に 行ったの を契機に. Japanese is cursed with too many homonyms and heavily reliant on kanji, as you know. However, Japanese also benefits from it. What other language would have such simple and effective device to identify intercalary months as 西向く武士（にしむくさむらい）?
    html: |-
      You are entirely correct. BTW, 中国に 行ったの を景気に should be corrected to read: 中国に 行ったの を契機に. Japanese is cursed with too many homonyms and heavily reliant on kanji, as you know. However, Japanese also benefits from it. What other language would have such simple and effective device to identify intercalary months as 西向く武士（にしむくさむらい）?<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
