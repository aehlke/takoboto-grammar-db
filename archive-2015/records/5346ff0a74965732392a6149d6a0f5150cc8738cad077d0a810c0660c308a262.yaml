    japanese: オンデマンドを契機にダンボールから印刷までサービス.
    body_text: "オンデマンドを契機にダンボールから印刷までサービス. \n\nTaking advantage of \n\t\ton demand [production techniques, we do] a service for everything from cardboard boxes to printing."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJオンデマンドを契機にダンボールから印刷までサービス.\">\nオンデマンド<strong>を契機に</strong>ダンボールから印刷までサービス.<strong></strong></a> <br/>\n<strong>Taking advantage of </strong>\n\t\ton demand [production techniques, we do] a service for everything from cardboard boxes to printing."
