    body_text: "それを契機に彼女は新しい商売を始めた。\r \n\n\t\tTaking the opportunity, she started her new business."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそれを契機に彼女は新しい商売を始めた。\">\n\t\t\t\tそれ<strong>を契機に</strong>彼女は新しい商売を始めた。\r<strong></strong></a> <br/>\n\t\tTaking the opportunity, she started her new business. \n\t\t<strong> </strong>"
