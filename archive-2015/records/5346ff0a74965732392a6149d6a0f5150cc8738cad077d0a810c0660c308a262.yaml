    japanese: 大統領が中国に行ったのを契機に万里の長城を訪問しておりました。
    body_text: "大統領が中国に行ったのを契機に万里の長城を訪問しておりました。 \n\n\t\tWhen the president visited China, \n\t\the took the chance \n\t\tto visit the Great Wall."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ大統領が中国に行ったのを契機に万里の長城を訪問しておりました。\">\n\t\t\t\t大統領が中国に行ったの<strong>を契機に</strong>万里の長城を訪問しておりました。<strong></strong></a> <br/>\n\t\tWhen the president visited China, \n\t\t<strong>he took the chance </strong>\n\t\tto visit the Great Wall."
    credits_raw: Amatuka
