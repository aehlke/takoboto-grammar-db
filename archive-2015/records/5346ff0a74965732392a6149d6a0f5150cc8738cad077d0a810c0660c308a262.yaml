    japanese: 新しいＣＤを契機に、彼は人気者になりました。
    body_text: "新しいＣＤを契機に、彼は人気者になりました。 \n\n\t\tHe became popular \n\t\tas a result of \n\t\this new  CD."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ新しいＣＤを契機に\">\n\t\t\t\t新しいＣＤ<strong>を契機に</strong><strong></strong>、彼は人気者になりました。</a> <br/>\n\t\tHe became popular \n\t\t<strong>as a result of </strong>\n\t\this new  CD."
