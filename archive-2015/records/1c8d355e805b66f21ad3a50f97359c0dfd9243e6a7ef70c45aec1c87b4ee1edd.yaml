    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJその事件をきっかけとして、第二次世界大戦がはじまったといわれる。\">\n\t\t\t\tその事件<strong>をきっかけとして</strong>、第二次世界大戦がはじまったといわれる。<strong></strong></a> <br/>\n\t\tIt's said that World War II began \n\t\t<strong>in the wake of </strong>\n\t\tthat incident."
