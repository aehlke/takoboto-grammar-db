  - source_id: 3510
    position: 4
    japanese: 昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。
    body_text: "昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。\r \n\n\t\tThe history of all hitherto existing society is the history of class struggles."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。\">\n\t\t\t\t昔から今<strong>に至る</strong>まで存在する、あらゆる社会の歴史は階級闘争の歴史である。\r<strong></strong></a> <br/>\n\t\tThe history of all hitherto existing society is the history of class struggles. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3511
    position: 5
    japanese: 宣戦布告に至るまでの時期はこのような状況であったと言える。
    body_text: "宣戦布告に至るまでの時期はこのような状況であったと言える。\r \n\n\t\tThus were affairs circumstanced in the period leading up to the declaration of war."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ宣戦布告に至るまでの時期はこのような状況であったと言える。\">\n\t\t\t\t宣戦布告<strong>に至る</strong>までの時期はこのような状況であったと言える。\r<strong></strong></a> <br/>\n\t\tThus were affairs circumstanced in the period leading up to the declaration of war. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3512
    position: 6
    japanese: 大事に至る前に火事は消し止められた。
    body_text: "大事に至る前に火事は消し止められた。\r \n\n\t\tThe fire was put out before it got serious."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ大事に至る前に火事は消し止められた。\">\n\t\t\t\t大事<strong>に至る</strong>前に火事は消し止められた。\r<strong></strong></a> <br/>\n\t\tThe fire was put out before it got serious. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3513
    position: 7
    japanese: 彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。
    body_text: "彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。\r \n\n\t\tThey have branches all over the world, from Calcutta to New York City."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。\">\n\t\t\t\t彼らは、カルカッタからニュウーヨーク市<strong>に至る</strong>まで、世界中に支部を持っている。\r<strong></strong></a> <br/>\n\t\tThey have branches all over the world, from Calcutta to New York City. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3514
    position: 8
    japanese: 滅びに至る門は大きく、その道は広い。
    body_text: "滅びに至る門は大きく、その道は広い。\r \n\n\t\tFor the gate is wide and the way is easy, that leads to destruction."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ滅びに至る門は大きく、その道は広い。\">\n\t\t\t\t滅び<strong>に至る</strong>門は大きく、その道は広い。\r<strong></strong></a> <br/>\n\t\tFor the gate is wide and the way is easy, that leads to destruction. \n\t\t<strong> </strong>"
    credits_raw: dbx
