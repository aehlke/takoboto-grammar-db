  - source_id: 7794
    position: 10
    japanese: 中国から地中海に至るシルクロードには、さまざまな文化交流の跡が見られる。
    body_text: "中国から地中海に至るシルクロードには、さまざまな文化交流の跡が見られる。 \n\n\t\tA variety of traces of cultural exchange can be seen along the ancient route of the Silk Road, all the way from the Mediterranean to China."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ中国から地中海に至るシルクロードには、さまざまな文化交流の跡が見られる。\">\n\t\t\t\t中国から地中海<strong>に至る</strong>シルクロードには、さまざまな文化交流の跡が見られる。<strong></strong></a> <br/>\n\t\tA variety of traces of cultural exchange can be seen along the ancient route of the Silk Road, all the way from the Mediterranean to China. \n\t\t<strong> </strong>"
