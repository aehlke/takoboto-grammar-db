    japanese: こんなことになろうとは、正に「お釈迦様でも気がつくめい」だね。
    body_text: "こんなことになろうとは、正に「お釈迦様でも気がつくめい」だね。 \n\n\t\tIt's precisely \"Even the Buddha could not have guessed it\"in the sense that things turned out \n\t\tthis way."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこんなことになろうとは、\">\n<strong>こんな</strong>ことになろうとは、<strong></strong>正に「お釈迦様でも気がつくめい」だね。</a> <br/>\n\t\tIt's precisely \"Even the Buddha could not have guessed it\"in the sense that things turned out \n\t\t<strong>this way. </strong>"
