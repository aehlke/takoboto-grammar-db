    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこんないい天気の日に、あなたは家の中に居なければならないなんてかわいそうだ。\">\n<strong>こんな</strong>いい天気の日に、あなたは家の中に居なければならないなんてかわいそうだ。<strong></strong></a> <br/>\n\t\tIt's a pity for you to have to stay indoors in \n\t\t<strong>this </strong>\n\t\tweather."
