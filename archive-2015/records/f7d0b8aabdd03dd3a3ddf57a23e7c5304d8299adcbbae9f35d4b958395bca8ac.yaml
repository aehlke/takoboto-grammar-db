    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたがこんなに早くまた起きて動き回れるようになって本当に良かった。\">\nあなたが<strong>こんな</strong>に早くまた起きて動き回れるようになって本当に良かった。<strong></strong></a> <br/>\n\t\tHow nice to see you up and about again \n\t\t<strong>so soon! </strong>"
