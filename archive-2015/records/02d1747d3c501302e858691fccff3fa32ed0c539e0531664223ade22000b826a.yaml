notes:
  - position: 0
    text: "Aはともかく、( Bは良い）\n\r\n　　= leaving aside A (B is good)\n\r\n　　= A is another thing but B is great.\n\n\n\r\nusually it is used for two contrasting things. \n\r\n　　A hatomokaku B ha ii\n\r\n　　= A is bad but B is good.\n\n\n\r\n　　味はともかく、値段が安い\n\r\n　　The taste is another thing, but the price is good\n\n\n\r\nBut this can also be used just for asides\n\r\n　　費用の問題はともかく\n\r\n　　setting aside the question of expense"
    html: "Aはともかく、( Bは良い）<br/>\r\n　　= leaving aside A (B is good)<br/>\r\n　　= A is another thing but B is great.<br/>\n<br/>\r\nusually it is used for two contrasting things. <br/>\r\n　　A hatomokaku B ha ii<br/>\r\n　　= A is bad but B is good.<br/>\n<br/>\r\n　　味はともかく、値段が安い<br/>\r\n　　The taste is another thing, but the price is good<br/>\n<br/>\r\nBut this can also be used just for asides<br/>\r\n　　費用の問題はともかく<br/>\r\n　　setting aside the question of expense"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
