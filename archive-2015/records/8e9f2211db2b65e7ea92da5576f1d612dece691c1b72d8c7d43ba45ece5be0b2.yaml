comments:
  - position: 0
    credits_raw: dc
    text: "so nowadays this whole grammar would usually be \n\r\n\"しようか？”　like \n\r\n　　行きましょうか？ (conv)\n\r\n　　行こうではないか？ (formal)"
    html: "so nowadays this whole grammar would usually be <br/>\r\n\"しようか？”　like <br/>\r\n　　行きましょうか？ (conv)<br/>\r\n　　行こうではないか？ (formal)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "行きましょうか is used as conv and is not formal, just polite.\n\r\n行く is not a good ex becuase the formal form is 参りましょうか(謙譲語_けんじょうご）."
    html: "行きましょうか is used as conv and is not formal, just polite.<br/>\r\n行く is not a good ex becuase the formal form is 参りましょうか(謙譲語_けんじょうご）."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "Basically 'violitional form verb + dehanaika'.\n\r\nVしようではないか。\n\r\nMuch the same meaning as 'violitional form verb' + 'ka'\n\r\nVしようか。\n\r\nPresumably the former is a little less 'pushy'?"
    html: "Basically 'violitional form verb + dehanaika'.<br/>\r\nVしようではないか。<br/>\r\nMuch the same meaning as 'violitional form verb' + 'ka'<br/>\r\nVしようか。<br/>\r\nPresumably the former is a little less 'pushy'?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: quobobo
    text: |-
      My Japanese teacher (native Japanese) told me that this wasn't used much in conversation, but frequently in things like politician's speeches (hence the "peaceful society" example I suppose). Not 100% sure on this, can anyone else back this up?
    html: |-
      My Japanese teacher (native Japanese) told me that this wasn't used much in conversation, but frequently in things like politician's speeches (hence the "peaceful society" example I suppose). Not 100% sure on this, can anyone else back this up?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Miki
    text: |-
      quobobo, you are right. We don't often use 〜ようではないか in conversation nowadays. Instead, as dc mentioned above, しようか、しましょう　are used. Even a politician say 「平和で住みやすい社会を 作りましょう！」on street.　作ろう じゃありませんか is also used in speech.
    html: |-
      quobobo, you are right. We don't often use 〜ようではないか in conversation nowadays. Instead, as dc mentioned above, しようか、しましょう　are used. Even a politician say 「平和で住みやすい社会を 作りましょう！」on street.　作ろう じゃありませんか is also used in speech.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: bluntcrayon
    text: |-
      quobobo - you are right about it not being used much in normal conversation. I also want to add that this is used to suggest or call for something that is relatively important (e.g world peace) and not trivial / everyday matters such as what food to eat etc.
    html: |-
      quobobo - you are right about it not being used much in normal conversation. I also want to add that this is used to suggest or call for something that is relatively important (e.g world peace) and not trivial / everyday matters such as what food to eat etc.
