    japanese: 意志の弱い人は批判の的になる。だから友達でさえも、その欠点を直せるものならとおもってかれをいじめようとするだろう。
    body_text: "意志の弱い人は批判の的になる。だから友達でさえも、その欠点を直せるものならとおもってかれをいじめようとするだろう。\r \n\n\t\tA man of weak will is the target of criticism; even his friends would badger him into correcting his defects."
