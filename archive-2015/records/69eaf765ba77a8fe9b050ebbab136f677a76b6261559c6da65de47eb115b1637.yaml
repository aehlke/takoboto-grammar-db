notes:
  - position: 0
    text: "動詞可能形　＋　〜ものなら：　〜ことが可能なら　（実現が難しいことについて言うことが多い）\n\r\n \"If only I could/may...,\"  \n\n\n\r\n〜う／ようものなら：　もし〜ようなことをしたら．．．（大変なことになる） Once if (one) happen to ... , then (bad consequence).\""
    html: "動詞可能形　＋　〜ものなら：　〜ことが可能なら　（実現が難しいことについて言うことが多い）<br/>\r\n \"If only I could/may...,\"  <br/>\n<br/>\r\n〜う／ようものなら：　もし〜ようなことをしたら．．．（大変なことになる） Once if (one) happen to ... , then (bad consequence).\""
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
