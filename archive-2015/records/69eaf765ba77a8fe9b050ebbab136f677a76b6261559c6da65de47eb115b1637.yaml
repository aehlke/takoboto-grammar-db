  - position: 6
    credits_raw: 誠
    text: "ex #\x01 is 〜もの(thing)　＋　ならば, and therefore does not belong to the usage of 〜ものなら .\n\r\nFrom ex#\x01 to ex#\x01, it doesn't give the meaning or correct usage of 〜ものなら, therefore treat it as 〜もの　＋　なら。 \n\r\n〜ものなら　always follow the 可能形 potential form. and used to indicate something difficult to realize, or some ideal thinking of the writer,e.g. : \"If only i was still a child, ....\""
    html: "ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=mononara#\x01\">#\x01</a></b> is 〜もの(thing)　＋　ならば, and therefore does not belong to the usage of 〜ものなら .<br/>\r\nFrom ex<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=mononara#\x01\">#\x01</a></b> to ex<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=mononara#\x01\">#\x01</a></b>, it doesn't give the meaning or correct usage of 〜ものなら, therefore treat it as 〜もの　＋　なら。 <br/>\r\n〜ものなら　always follow the 可能形 potential form. and used to indicate something difficult to realize, or some ideal thinking of the writer,e.g. : \"If only i was still a child, ....\"      <br/>"
    source_id: null
    original_created_at: null
