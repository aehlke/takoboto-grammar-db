    credits_raw: '9000'
    text: This use of の looks similar to use of "koto" (事) after verbs, doesn't it? Like in "話す事 が 出来る" = "I can speak".
    html: This use of の looks similar to use of "koto" (事) after verbs, doesn't it? Like in "話す事 が 出来る" = "I can speak".
    source_id: null
