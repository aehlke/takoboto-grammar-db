  - position: 5
    credits_raw: kryoung
    text: "Hello, I have a suggestion:\n\r\n- For 知る, if it is an object/place/thing that you know of, you reply with 存じております。If it is a person you know of (say a professor, doctor, etc) you reply with 存じてあげています／おります。\n\r\n- ごめんなさい in honorifics turns into 申し訳ありません。\n\r\n- A useful keigo grammar note is causative verb+morau/itadaku, which literally means \"(the listener) to allow me to do/perform some action\".  For example if a person is about to start a meeting, he/she would say　ただいま会議を始めさせていただきます.  It's just a very polite way to say \"I will start the meeting now\". But the literal translation would be \"Now, allow me to perform the action of starting the meeting\".  Isn't that way more polite than just saying you will start the meeting? =)   \n\n\n\r\nAnyway, that's my two cents on honorifics."
    html: "Hello, I have a suggestion:<br/>\r\n- For 知る, if it is an object/place/thing that you know of, you reply with 存じております。If it is a person you know of (say a professor, doctor, etc) you reply with 存じてあげています／おります。<br/>\r\n- ごめんなさい in honorifics turns into 申し訳ありません。<br/>\r\n- A useful keigo grammar note is causative verb+morau/itadaku, which literally means \"(the listener) to allow me to do/perform some action\".  For example if a person is about to start a meeting, he/she would say　ただいま会議を始めさせていただきます.  It's just a very polite way to say \"I will start the meeting now\". But the literal translation would be \"Now, allow me to perform the action of starting the meeting\".  Isn't that way more polite than just saying you will start the meeting? =)   <br/>\n<br/>\r\nAnyway, that's my two cents on honorifics.  <br/>\n<br/>\n<br/>"
