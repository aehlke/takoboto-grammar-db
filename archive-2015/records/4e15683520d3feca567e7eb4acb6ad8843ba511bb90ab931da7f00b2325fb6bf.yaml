notes:
  - position: 0
    text: "Honorific and Humble Forms\n\r\nJapanese can be roughly separated into three levels of politeness: casual, polite, and honorific/humble.  So far, we have already gone over the polite forms using \"desu\" and \"masu\".  We will now cover the next level of politeness using honorific and humble forms.  You will often hear this type of language in any customer/consumer type situations such as fast food cashiers, etc.. For now, the first thing to remember is that the speaker always considers himself/herself to be at the lowest level.  So any actions performed by oneself are in humble form while actions performed by anyone else seen from the view of the speaker uses the honorific form.  For the simple example of first and second person, the first person is always humble while the second person is always honorific.\n\n\n\nSet Expressions\n\r\nThe difficult part of learning honorific and humble language is that there are a number of words that have separate verbs for honorific and humble forms.  Anything that does not have it's own special expression fall under the rules of humble and honorific conjugations that we will cover next.\n\n\n\n\n\n\n\nPlainHonorificHumbleするなさる致す行くいらっしゃる参る来るいらっしゃる参るあるござる−いるいらっしゃるおる見るご覧になる拝見する聞く伺う (to ask)−言うおっしゃる申す／申し上げるあげる差し上げる−くれる下さる−もらう−いただく食べる召し上がる−知っているご存知（です）存じる"
    html: "Honorific and Humble Forms<br/>\r\nJapanese can be roughly separated into three levels of politeness: casual, polite, and honorific/humble.  So far, we have already gone over the polite forms using \"desu\" and \"masu\".  We will now cover the next level of politeness using honorific and humble forms.  You will often hear this type of language in any customer/consumer type situations such as fast food cashiers, etc.. For now, the first thing to remember is that the speaker always considers himself/herself to be at the lowest level.  So any actions performed by oneself are in humble form while actions performed by anyone else seen from the view of the speaker uses the honorific form.  For the simple example of first and second person, the first person is always humble while the second person is always honorific.<br/>\n<br/>\nSet Expressions<br/>\r\nThe difficult part of learning honorific and humble language is that there are a number of words that have separate verbs for honorific and humble forms.  Anything that does not have it's own special expression fall under the rules of humble and honorific conjugations that we will cover next.<br/>\n<br/>\n<br/>\n<table><br/>\n<tr><td><b>Plain</b></td><td><b>Honorific</b></td><td><b>Humble</b></td></tr><tr><td>する</td><td>なさる</td><td>致す</td></tr><tr><td>行く</td><td>いらっしゃる</td><td>参る</td></tr><tr><td>来る</td><td>いらっしゃる</td><td>参る</td></tr><tr><td>ある</td><td>ござる</td><td>−</td></tr><tr><td>いる</td><td>いらっしゃる</td><td>おる</td></tr><tr><td>見る</td><td>ご覧になる</td><td>拝見する</td></tr><tr><td>聞く</td><td>伺う (to ask)</td><td>−</td></tr><tr><td>言う</td><td>おっしゃる</td><td>申す／申し上げる</td></tr><tr><td>あげる</td><td>差し上げる</td><td>−</td></tr><tr><td>くれる</td><td>下さる</td><td>−</td></tr><tr><td>もらう</td><td>−</td><td>いただく</td></tr><tr><td>食べる</td><td>召し上がる</td><td>−</td></tr><tr><td>知っている</td><td>ご存知（です）</td><td>存じる</td></tr></table> <br/>"
    credits_raw: kimchi314
