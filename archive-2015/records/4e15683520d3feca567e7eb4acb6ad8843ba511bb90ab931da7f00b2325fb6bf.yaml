  - position: 3
    text: "Regular Keigo Verb Forms\n\n\n\r\n丁寧 Teinei＊譲語 Kenjougo＊尊敬語 Sonkeigo\n\r\n------------------------------------------\n\r\nVstem+ます　＊　お+Vstem +します　＊　お+Vstem+になります\n\n\n\r\nIrregular Keigo Verb Forms\n\n\n\r\n丁寧 Teinei＊譲語 Kenjougo＊尊敬語 Sonkeigo\n\r\n------------------------------------------\n\r\nいいます　＊　もうします　＊ おっしゃいます\n\n\n\r\n食べます・　＊　いただきます　＊　めしあがります\n\r\n飲みます \n\n\n\r\n行きます・　＊　まいります　＊　いらっしゃいます\n\r\n来ます\n\n\n\r\nいます　＊　おります　＊　いらっしゃいます\n\n\n\r\nします　＊　いたします　＊　なさいます\n\n\n\r\nしっています　＊　ぞんじています　＊　ごぞんじです\n\n\n\r\n聞きます　＊　うかがいます　＊　---none---\n\n\n\r\n見ます　＊　はいけんします　＊　ごらんになります\n\n\n\r\n会います　＊　おめにかかります　＊　---none---"
    html: "Regular Keigo Verb Forms<br/>\n<br/>\r\n丁寧 Teinei＊譲語 Kenjougo＊尊敬語 Sonkeigo<br/>\r\n------------------------------------------<br/>\r\nVstem+ます　＊　お+Vstem +します　＊　お+Vstem+になります<br/>\n<br/>\r\nIrregular Keigo Verb Forms<br/>\n<br/>\r\n丁寧 Teinei＊譲語 Kenjougo＊尊敬語 Sonkeigo<br/>\r\n------------------------------------------<br/>\r\nいいます　＊　もうします　＊ おっしゃいます<br/>\n<br/>\r\n食べます・　＊　いただきます　＊　めしあがります<br/>\r\n飲みます <br/>\n<br/>\r\n行きます・　＊　まいります　＊　いらっしゃいます<br/>\r\n来ます<br/>\n<br/>\r\nいます　＊　おります　＊　いらっしゃいます<br/>\n<br/>\r\nします　＊　いたします　＊　なさいます<br/>\n<br/>\r\nしっています　＊　ぞんじています　＊　ごぞんじです<br/>\n<br/>\r\n聞きます　＊　うかがいます　＊　---none---<br/>\n<br/>\r\n見ます　＊　はいけんします　＊　ごらんになります<br/>\n<br/>\r\n会います　＊　おめにかかります　＊　---none---<br/>\n<br/>"
