  - position: 5
    credits_raw: KWhazit
    text: "There's a discussion of the difference between verb+出す (dasu) and verb+始める (hajimeru) over in the comments on \x01. The consensus is that verb+出す is more of a sudden or explosive starting (like busrting into tears), while verb+始める is just simply starting.\n\n\n\r\nNote also that this use of 出す is NOT the same as the standalone verb 出す, which means to take something from a more enclosed/private place or situation and put it in a more open/public one. 出す only means \"start to do\" when it's tacked onto another verb stem... and even then it may still have the above meaning:\n\r\n取り出す - take (an object) out (of a container)\n\r\n追い出す - chase (someone) out"
    html: "There's a discussion of the difference between verb+出す (dasu) and verb+始める (hajimeru) over in the comments on <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>. The consensus is that verb+出す is more of a sudden or explosive starting (like busrting into tears), while verb+始める is just simply starting.<br/>\n<br/>\r\nNote also that this use of 出す is NOT the same as the standalone verb 出す, which means to take something from a more enclosed/private place or situation and put it in a more open/public one. 出す only means \"start to do\" when it's tacked onto another verb stem... and even then it may still have the above meaning:<br/>\r\n取り出す - take (an object) out (of a container)<br/>\r\n追い出す - chase (someone) out"
    source_id: null
    original_created_at: null
