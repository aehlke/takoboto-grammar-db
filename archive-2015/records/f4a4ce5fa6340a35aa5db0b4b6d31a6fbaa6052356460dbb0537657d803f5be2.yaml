comments:
  - position: 0
    credits_raw: Amatuka
    text: "も replaces は in the first example sentence.\n\r\nA previous \x01 being mine is implied.\n\r\n(e.g. 'あれは私のです。ええと、これも私のです。'\n\r\nThat (over there) is mine.  Erm, and this is also mine. )"
    html: "も replaces は in the first example sentence.<br/>\r\nA previous <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> being mine is implied.<br/>\r\n(e.g. 'あれは私のです。ええと、これも私のです。'<br/>\r\nThat (over there) is mine.  Erm, and this is also mine. )"
    source_id: null
    original_created_at: null
