    text: "Just like how in English, we say, \"me too!\" Japanese uses the particle も\n\n\n\r\nIt rained today too.\n\r\n今日も雨が降っていました。"
    html: "Just like how in English, we say, \"me too!\" Japanese uses the particle も<br/>\n<br/>\r\nIt rained today too.<br/>\r\n今日も雨が降っていました。"
