  - position: 5
    credits_raw: blabby
    text: A good translation of AあってのB might be "B exists because of A" or more naturally, "B wouldn't be anything without A"?
    html: A good translation of AあってのB might be "B exists because of A" or more naturally, "B wouldn't be anything without A"?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: bamboo4
    text: "AあってのB means \"there ain't no B except for A.\"\n\n\n\r\n平和があっての経済の発展 would therefore mean \"There would be no economic prosperity without peace.\""
    html: "AあってのB means \"there ain't no B except for A.\"<br/>\n<br/>\r\n平和があっての経済の発展 would therefore mean \"There would be no economic prosperity without peace.\""
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: rogen
    text: "What if you said,\n\r\n平和あっての経済の発展\n\n\n\r\nDoes that still make sense?"
    html: "What if you said,<br/>\r\n平和あっての経済の発展<br/>\n<br/>\r\nDoes that still make sense?"
    source_id: null
