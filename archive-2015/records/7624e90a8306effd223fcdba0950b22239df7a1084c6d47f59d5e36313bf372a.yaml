    japanese: 今日の私があるのも、２０数年前に私を産んでくれた両親あっての事です。
    body_text: "今日の私があるのも、２０数年前に私を産んでくれた両親あっての事です。 \n\n\t\tWhat I am today is thanks to my parents who gave me a life twenty some years ago."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今日の私があるのも、２０数年前に私を産んでくれた両親あっての事です。\">\n\t\t\t\t今日の私があるのも、２０数年前に私を産んでくれた両親<strong>あっての</strong>事です。<strong></strong></a> <br/>\n\t\tWhat I am today is thanks to my parents who gave me a life twenty some years ago. \n\t\t<strong> </strong>"
