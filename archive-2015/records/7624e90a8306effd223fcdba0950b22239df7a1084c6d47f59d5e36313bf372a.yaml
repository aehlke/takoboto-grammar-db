    japanese: 日々の練習あっての勝利だ。
    body_text: "日々の練習あっての勝利だ。 \n\n\t\tVictory is not possible without everyday practice. \n\t\t."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ日々の練習あっての勝利だ。\">\n\t\t\t\t日々の練習<strong>あっての</strong>勝利だ。<strong></strong></a> <br/>\n\t\tVictory is not possible without everyday practice. \n\t\t<strong>. </strong>"
