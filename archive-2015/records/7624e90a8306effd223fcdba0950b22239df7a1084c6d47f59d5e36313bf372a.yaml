  - source_id: 3646
    position: 3
    japanese: 事故で車は全損って嘆いているけどさ、怪我がなくてなにより、命あっての物種だよ。
    body_text: "事故で車は全損って嘆いているけどさ、怪我がなくてなにより、命あっての物種だよ。\r \n\n\t\tI know you're complaining about your car being totaled but it's just a good thing you weren't injured. You should be thankful to be alive."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ事故で車は全損って嘆いているけどさ、怪我がなくてなにより、命あっての物種だよ。\">\n\t\t\t\t事故で車は全損って嘆いているけどさ、怪我がなくてなにより、命<strong>あっての</strong>物種だよ。\r<strong></strong></a> <br/>\n\t\tI know you're complaining about your car being totaled but it's just a good thing you weren't injured. You should be thankful to be alive. \n\t\t<strong> </strong>"
