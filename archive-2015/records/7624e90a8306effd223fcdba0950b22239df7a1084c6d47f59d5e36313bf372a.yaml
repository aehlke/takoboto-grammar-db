    japanese: なんの気なしに言っただけで、別に悪気があってのことではありません。
    body_text: "なんの気なしに言っただけで、別に悪気があってのことではありません。\r \n\n\t\tI just said so without thinking much about it. I didn't mean anything serious."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJなんの気なしに言っただけで、別に悪気があってのことではありません。\">\n\t\t\t\tなんの気なしに言っただけで、別に悪気が<strong>あっての</strong>ことではありません。\r<strong></strong></a> <br/>\n\t\tI just said so without thinking much about it. I didn't mean anything serious. \n\t\t<strong> </strong>"
