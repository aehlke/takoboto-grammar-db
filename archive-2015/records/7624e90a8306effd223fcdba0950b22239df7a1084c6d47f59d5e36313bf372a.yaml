  - position: 10
    credits_raw: chohongsieudieu
    text: "I read from \"Japanese Grammar level 1\" Japanese book and it wrote:\"Because of existence of A so the existence of B is necessary, certainly. If A does not exist, B becomes unnecessary, too\". \n\r\nExample:\"学生あっての教師だ\""
