  - position: 4
    credits_raw: Exrulez
    text: "Hi! New Here ^O^, i just noticed that がり seems to be used Adjective+がり and がち as in Verb-masu base+がち？　Or are there other examples were a verb +がり is used in a correct way?\n\r\n暑がり\n\r\n起こりがち？\n\r\nThanks!"
    html: "Hi! New Here ^O^, i just noticed that がり seems to be used Adjective+がり and がち as in Verb-masu base+がち？　Or are there other examples were a verb +がり is used in a correct way?<br/>\r\n暑がり<br/>\r\n起こりがち？<br/>\r\nThanks!"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: bamboo4
    text: |-
      You don't say 怒りがち or 怒りがり. They don't exist in the Japanese vocabruary. It has to be 怒りっぽい. You can say 曇りがち、遠慮がち etc. It is used to mean "there is the tendecy to" or "it is frequent that...."
    html: |-
      You don't say 怒りがち or 怒りがり. They don't exist in the Japanese vocabruary. It has to be 怒りっぽい. You can say 曇りがち、遠慮がち etc. It is used to mean "there is the tendecy to" or "it is frequent that...."
    source_id: null
