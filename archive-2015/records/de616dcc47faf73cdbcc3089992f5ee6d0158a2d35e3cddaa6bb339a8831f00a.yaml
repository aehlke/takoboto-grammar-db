  - position: 4
    credits_raw: quendidil
    text: I think a lot of the conjugated verbs in CJ survived in modern Japanese as common idioms or grammatical expressions
    html: I think a lot of the conjugated verbs in CJ survived in modern Japanese as common idioms or grammatical expressions
    source_id: null
