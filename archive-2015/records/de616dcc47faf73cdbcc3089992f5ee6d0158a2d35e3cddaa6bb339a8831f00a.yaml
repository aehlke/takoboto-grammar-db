    text: |-
      The only time I have seen this grammar is on signs. My teacher says it is an old fashioned way of saying 〜してはいけない.  Obviously it is the negative form of 〜べき.
    html: |-
      The only time I have seen this grammar is on signs. My teacher says it is an old fashioned way of saying 〜してはいけない.  Obviously it is the negative form of 〜べき.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "This is the negative form of べし　;) (べから・べく（べかり）・べし・べき（べかる）・べけれ・○)\n\r\nべきではない would be used in speaking."
    html: "This is the negative form of べし　;) (べから・べく（べかり）・べし・べき（べかる）・べけれ・○)<br/>\r\nべきではない would be used in speaking."
    source_id: null
