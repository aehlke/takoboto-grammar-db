  - position: 5
    credits_raw: jimmyseal
    text: ">> quendidil\n\r\nThe dictionary form (終止形) would be べし, but in MJ, べし has been replaced by べきだ.  \n\r\nSo if we're talking about MJ, べからず is the negative of べきだ, but in CJ, it would be べし."
    html: "&gt;&gt; quendidil<br/>\r\nThe dictionary form (終止形) would be べし, but in MJ, べし has been replaced by べきだ.  <br/>\r\nSo if we're talking about MJ, べからず is the negative of べきだ, but in CJ, it would be べし."
    source_id: null
    original_created_at: null
    original_updated_at: null
