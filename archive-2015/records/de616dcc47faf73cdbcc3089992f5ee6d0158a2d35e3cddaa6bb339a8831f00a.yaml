    japanese: 好機逸すべからず。この機に一気に仕事を仕上げてしまおう。
    body_text: "好機逸すべからず。この機に一気に仕事を仕上げてしまおう。\r \n\n\t\tThis is a golden opportunity we'd be stupid to pass up. Let's get to work and finish it all in one fell swoop."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ好機逸すべからず。この機に一気に仕事を仕上げてしまおう。\">\n\t\t\t\t好機逸す<strong>べからず</strong>。この機に一気に仕事を仕上げてしまおう。\r<strong></strong></a> <br/>\n\t\tThis is a golden opportunity we'd be stupid to pass up. Let's get to work and finish it all in one fell swoop. \n\t\t<strong> </strong>"
