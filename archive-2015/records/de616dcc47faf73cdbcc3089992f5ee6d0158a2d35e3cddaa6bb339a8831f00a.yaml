    body_text: "書籍が学問に従うべく、学問が書籍に従うべからず。\r \n\n\t\tBooks must follow sciences, and not sciences books."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ書籍が学問に従うべく、学問が書籍に従うべからず。\">\n\t\t\t\t書籍が学問に従うべく、学問が書籍に従う<strong>べからず</strong>。\r<strong></strong></a> <br/>\n\t\tBooks must follow sciences, and not sciences books. \n\t\t<strong> </strong>"
