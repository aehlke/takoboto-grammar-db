    text: "In ex #\x01, wouldn't \"動かざる者\" mean \"the person who isn't moving\" rather than \"the person who isn't working?\"  I only ask because it's easy to mistake the Kanji for \"to move\" (動) with the Kanji for \"to work\" (働).  I apologize if this phrase is an idiomatic usage of which I am not aware."
