notes:
  - position: 0
    text: "The speaker's conclusion obtained through deductive, logical judgement or calculation on the basis of what he has heard or read.\n\n\n\r\nFormation\n\n\n\r\n(i) {V / Adj} (i) inf わけ　だ\n\r\n　　｛話す・話した｝わけ　だ　(I take it that s.o. talks / talked)\n\r\n　　｛食べる・食べた｝　わけ　だ (I take it that s.o. eats / ate)\n\r\n　　｛高い・高かった｝わけ　だ (I take it that s.o. is expensive / was expensive)\n\n\n\r\n(ii) Adj (na) stem ｛な・だった｝わけ　だ\n\r\n　　｛静かな・静かだった｝わけ　だ　(I take it that s.o. is / was quiet)\n\n\n\r\n(iii) N　｛という・だった｝わけ　だ\n\r\n　　｛先生という・先生だった｝わけ　だ (I take it that s.o. is / was a teacher)"
    html: "The speaker's conclusion obtained through deductive, logical judgement or calculation on the basis of what he has heard or read.<br/>\n<br/>\r\nFormation<br/>\n<br/>\r\n(i) {V / Adj} (i) inf わけ　だ<br/>\r\n　　｛話す・話した｝わけ　だ　(I take it that s.o. talks / talked)<br/>\r\n　　｛食べる・食べた｝　わけ　だ (I take it that s.o. eats / ate)<br/>\r\n　　｛高い・高かった｝わけ　だ (I take it that s.o. is expensive / was expensive)<br/>\n<br/>\r\n(ii) Adj (na) stem ｛な・だった｝わけ　だ<br/>\r\n　　｛静かな・静かだった｝わけ　だ　(I take it that s.o. is / was quiet)<br/>\n<br/>\r\n(iii) N　｛という・だった｝わけ　だ<br/>\r\n　　｛先生という・先生だった｝わけ　だ (I take it that s.o. is / was a teacher)"
