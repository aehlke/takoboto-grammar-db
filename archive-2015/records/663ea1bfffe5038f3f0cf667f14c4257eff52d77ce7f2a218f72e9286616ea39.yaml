notes:
  - position: 0
    text: "S1と　S2　is a causative sentence connective that implies that because of S1 naturally S2 was the result and has an unintentional or undesired nuance to it\n\n\n\r\nFor example：\n\r\nこの間、友達と一緒にキムチの食べほうだいをしたと　おなかが　痛くなりました.\n\n\n\r\nThe other day, my friend(s) and I had an \"all you can eat\" kimchi party and as a natural result (of eating some much kimchi) my stomach started to hurt."
    html: "S1と　S2　is a causative sentence connective that implies that because of S1 naturally S2 was the result and has an unintentional or undesired nuance to it<br/>\n<br/>\r\nFor example：<br/>\r\nこの間、友達と一緒にキムチの食べほうだいをしたと　おなかが　痛くなりました.<br/>\n<br/>\r\nThe other day, my friend(s) and I had an \"all you can eat\" kimchi party and as a natural result (of eating some much kimchi) my stomach started to hurt.<br/>"
    credits_raw: tigert
