    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼の月給は、私の半年分の給料に相当します。\">\n\t\t\t\t彼の月給は、私の半年分の給料<strong>に相当します</strong>。<strong></strong></a> <br/>\n\t\tHis monthly salary \n\t\t<strong>is equivalent to </strong>\n\t\tmy salary of a half year."
