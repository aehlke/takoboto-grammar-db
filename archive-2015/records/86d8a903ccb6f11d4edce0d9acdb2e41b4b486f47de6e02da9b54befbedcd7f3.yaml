    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJテッド叔父さんはパンダを見せるために、私たちを動物園へ連れて行った。\">\n\t\t\t\tテッド叔父さんはパンダを<strong>見せる</strong>ために、私たちを動物園へ連れて行った。<strong></strong></a> <br/>\n\t\tUncle Ted took us to the zoo in order to show us the pandas. \n\t\t<strong> </strong>"
