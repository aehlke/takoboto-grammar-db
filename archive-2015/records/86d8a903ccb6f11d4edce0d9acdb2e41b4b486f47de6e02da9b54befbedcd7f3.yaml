    japanese: 今の学生に暇な時間がもっとあれば、政治にもっと関心を見せるかもしれない。
    body_text: "今の学生に暇な時間がもっとあれば、政治にもっと関心を見せるかもしれない。 \n\n\t\tIf students today had more free time, they might show more interest in politics."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今の学生に暇な時間がもっとあれば、政治にもっと関心を見せるかもしれない。\">\n\t\t\t\t今の学生に暇な時間がもっとあれば、政治にもっと関心を<strong>見せる</strong>かもしれない。<strong></strong></a> <br/>\n\t\tIf students today had more free time, they might show more interest in politics. \n\t\t<strong> </strong>"
