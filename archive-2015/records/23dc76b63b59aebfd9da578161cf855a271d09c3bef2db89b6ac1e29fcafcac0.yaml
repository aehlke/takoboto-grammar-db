  - position: 7
    credits_raw: godfrey
    text: "I disagree with bamboo4 and　誠.  I think that the given definition itself is too restrictive and wrong.  The literal meaning of #\x01 could be more accurately described as \"sympathy (for that person) DOES NOT MATCH the reality (of what that person has done) = sympathy is not warranted in this case.\"  I think that #\x01 should stay, because it shows the diversity and the true basic spirit of this expression.  That is, all examples here have the meaning of something \"not matching,\"  \"being off the mark\" or \"not appropriate.\"  I think we should change the definition since it is misleading."
    html: "I disagree with bamboo4 and　誠.  I think that the given definition itself is too restrictive and wrong.  The literal meaning of <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> could be more accurately described as \"sympathy (for that person) DOES NOT MATCH the reality (of what that person has done) = sympathy is not warranted in this case.\"  I think that <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> should stay, because it shows the diversity and the true basic spirit of this expression.  That is, all examples here have the meaning of something \"not matching,\"  \"being off the mark\" or \"not appropriate.\"  I think we should change the definition since it is misleading."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: bamboo4
    text: "当たる in #\x01 does not mean \"match\" but it really means phyisical striking like an arrow hitting the target. The other examples of あたる does not have that physical meaning. While I agree that the definition is not appropriate, I still think #\x01 stands alone here."
    html: "当たる in <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> does not mean \"match\" but it really means phyisical striking like an arrow hitting the target. The other examples of あたる does not have that physical meaning. While I agree that the definition is not appropriate, I still think <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> stands alone here.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: 熊君
    text: "Isn't the construction of #\x01 and #\x01 this:\n\r\n「動詞」にあたらない\n\r\nbut #\x01 actually:\n\r\n｢副詞」あたらない  （副詞＝めったに）"
    html: "Isn't the construction of <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> this:<br/>\r\n「動詞」にあたらない<br/>\r\nbut <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> actually:<br/>\r\n｢副詞」あたらない  （副詞＝めったに）"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: Hanne
    text: "I agree with godfrey, the meaning 'no need to do sth' is not always correct, yet you can always interpret the sentence correctly with ataru having the meaning of 'hitting the target'. Then example #\x01 could be interpreted as 'Having sympathy doesn't hit the target > isn't right' or something like that.\n\n\n\r\nI don't think example #\x01 stands alone, the construction is just used in a more literal way than in the other examples."
    html: "I agree with godfrey, the meaning 'no need to do sth' is not always correct, yet you can always interpret the sentence correctly with ataru having the meaning of 'hitting the target'. Then example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> could be interpreted as 'Having sympathy doesn't hit the target &gt; isn't right' or something like that.<br/>\n<br/>\r\nI don't think example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ni%20ataranai#\x01\">#\x01</a></b> stands alone, the construction is just used in a more literal way than in the other examples.<br/>\n<br/>"
    source_id: null
