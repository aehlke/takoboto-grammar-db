    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は上海で住んでいたので、戦争は彼とは全く関係のないところで行われていた．\">\n\t\t\t\t彼は上海で住んでいたので、戦争は彼と<strong>は</strong>全く関係のないところで行われていた．<strong></strong></a> <br/>\n\t\tBecause he was living in Shang-hai, the war was being fought (lit. performed) in places that did not have a connection \n\t\t<strong>with him </strong>\n\t\tat all."
