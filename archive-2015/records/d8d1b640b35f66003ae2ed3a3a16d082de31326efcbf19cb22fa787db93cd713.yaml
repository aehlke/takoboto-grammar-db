comments:
  - position: 0
    credits_raw: Amatuka
    text: "The 'normal' negative sentence would be 私は肉を食べない。'I don't eat fish'.\n\r\nWith the object marker を overridden by は this implies that not eating meat is in contrast to eating something else (for example fish).\n\nNote: When Japanese refer to meat (肉) they generally would not understand that as including fish (魚)."
    html: "The 'normal' negative sentence would be 私は肉を食べない。'I don't eat fish'.<br/>\r\nWith the object marker を overridden by は this implies that not eating meat is in contrast to eating something else (for example fish).<br/>\n<b>Note:</b> When Japanese refer to meat (肉) they generally would not understand that as including fish (魚)."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: |-
      This contrastative は can fit in places that you might not expect.  Take 生きている '(she's) alive.' vs. 生きてはいる '(she's) alive (but not well).'.
    html: |-
      This contrastative は can fit in places that you might not expect.  Take <b>生きている '(she's) alive.'</b> vs. <b>生きてはいる '(she's) alive (but not well).'</b>.
    source_id: null
    original_created_at: null
