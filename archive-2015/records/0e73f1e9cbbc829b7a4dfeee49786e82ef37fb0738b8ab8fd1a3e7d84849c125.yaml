  - position: 2
    credits_raw: jmadsen
    text: "Question: My grammar book says に かわり instead of かわりに for all its examples and explanations. ex. 首相　に　かわり、　外相　が　アメリカ　を　訪問　した。\n\r\nCan anyone clarify?"
    html: "Question: My grammar book says に かわり instead of かわりに for all its examples and explanations. ex. 首相　に　かわり、　外相　が　アメリカ　を　訪問　した。<br/>\r\nCan anyone clarify?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: jmadsen
    text: "Just got my question answered :-)\n\r\nni kawari is more \"polite\" or \"official\", and also shows a more passive sense of the \"ni\" particle. kawari + ni is more typical in spoken language. So, these two sentences are the same in meaning:\n\r\n相　に　かわり、　外相　が　アメリカ　を　訪問　した。\n\r\n相　の　かわり　に、　外相　が　アメリカ　を　訪問　した。\n\r\nBut the first is more likely to occur in a news report."
    html: "Just got my question answered :-)<br/>\r\nni kawari is more \"polite\" or \"official\", and also shows a more passive sense of the \"ni\" particle. kawari + ni is more typical in spoken language. So, these two sentences are the same in meaning:<br/>\r\n相　に　かわり、　外相　が　アメリカ　を　訪問　した。<br/>\r\n相　の　かわり　に、　外相　が　アメリカ　を　訪問　した。<br/>\r\nBut the first is more likely to occur in a news report."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bluntcrayon
    text: "can you even use い adjectives with this form of かわりに?\n\r\nI know it can be used for the other form , i.e some form of compensation or balance　(E.g.　高い代わりに便利だった）, but all the books i have read including the dictionary of int grammar, state it cant be used in a way such as 高い代わりに  （instead of being expensive)"
    html: "can you even use い adjectives with this form of かわりに?<br/>\r\nI know it can be used for the other form , i.e some form of compensation or balance　(E.g.　高い代わりに便利だった）, but all the books i have read including the dictionary of int grammar, state it cant be used in a way such as 高い代わりに  （instead of being expensive)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: kaz
    text: "彼は早くかわりに、遅かった\n\r\nInstead of being early, he was late.\n\n\n\r\n→This is wrong. There is no \"(~ku)kawarini\" usage. \n\r\ni-adj＋かわりに\n\r\ne.g.彼は 行動が はやいかわりに ミスが多い。"
    html: "彼は早くかわりに、遅かった<br/>\r\nInstead of being early, he was late.<br/>\n<br/>\r\n→This is wrong. There is no \"(~ku)kawarini\" usage. <br/>\r\ni-adj＋かわりに<br/>\r\ne.g.彼は 行動が はやいかわりに ミスが多い。"
    source_id: null
