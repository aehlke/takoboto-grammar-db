    japanese: 本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる一方です。
    body_text: "本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる一方です。 \n\n\t\tI always buy the English-language books I come across at bookstores. But since I never read them, all they do is pile up."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる一方です。\">\n\t\t\t\t本屋で英語関係の本を見つけると、次々に買っていますが、読まずにいるので、溜まる<strong>一方です。</strong><strong></strong></a> <br/>\n\t\tI always buy the English-language books I come across at bookstores. But since I never read them, all they do is pile up. \n\t\t<strong> </strong>"
    credits_raw: Miki
