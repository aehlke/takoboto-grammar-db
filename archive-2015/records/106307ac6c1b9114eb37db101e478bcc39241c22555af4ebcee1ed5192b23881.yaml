  - source_id: 7172
    position: 3
    japanese: 近ごろ国際交流がますますさかんになっている。外国文化の情報が増える一方だが、それは自分の国のことについて考えるきっかけにもなったいる.
    body_text: "近ごろ国際交流がますますさかんになっている。外国文化の情報が増える一方だが、それは自分の国のことについて考えるきっかけにもなったいる. \n\n\t\tRecently, international exchange become increasing more and more. \n\t\ton the other hand, \n\t\tinformation on a foreign culture also exchanging as well.But it is also the opportunity to think about our own country."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ近ごろ国際交流がますますさかんになっている。外国文化の情報が増える一方だが、それは自分の国のことについて考えるきっかけにもなったいる.\">\n\t\t\t\t近ごろ国際交流がますますさかんになっている。外国文化の情報が増える<strong>一方だ</strong>が、それは自分の国のことについて考えるきっかけにもなったいる.<strong></strong></a> <br/>\n\t\tRecently, international exchange become increasing more and more. \n\t\t<strong>on the other hand, </strong>\n\t\tinformation on a foreign culture also exchanging as well.But it is also the opportunity to think about our own country."
    credits_raw: sureshnihon
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7272
    position: 4
    japanese: "アメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。\r\nアメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。"
    body_text: "アメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。\r\nアメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。 \n\n\t\tSince returning to America I have been unable to use Japanese so I am \n\t\tgradually \n\t\t  forgetting it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJアメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。アメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。\">\n\t\t\t\tアメリカに帰って以来、日本語が使えないので、忘れる一方で困っている。\r\nアメリカに帰って以来、日本語が使えないので、忘れる<strong>一方で</strong>困っている。<strong></strong></a> <br/>\n\t\tSince returning to America I have been unable to use Japanese so I am \n\t\t<strong>gradually </strong>\n\t\t  forgetting it."
