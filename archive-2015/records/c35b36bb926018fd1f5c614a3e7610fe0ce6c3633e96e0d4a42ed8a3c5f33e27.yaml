    body_text: "話し合いの糧にするために、ミーティングに先立ち、皆様からいただいた提案をとりまとめてみました。  \n\n\t\tI have tried to compile the ideas that you proposed prior to the meeting, so that we can use them as the base for the discussion."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ話し合いの糧にするために、ミーティングに先立ち、皆様からいただいた提案をとりまとめてみました。 \">\n\t\t\t\t話し合いの糧にするために、ミーティング<strong>に先立</strong>ち、皆様からいただいた提案をとりまとめてみました。 <strong></strong></a> <br/>\n\t\tI have tried to compile the ideas that you proposed prior to the meeting, so that we can use them as the base for the discussion. \n\t\t<strong> </strong>"
