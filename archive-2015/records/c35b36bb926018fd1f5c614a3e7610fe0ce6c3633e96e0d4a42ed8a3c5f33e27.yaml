    body_text: "このミーティングの目的は、１月の商品企画会議に先立ち、新製品のプランを考えることです。\r \n\n\t\tThe purpose of the meeting is to make a plan for a new product prior to the Product Development Meeting in January."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこのミーティングの目的は、１月の商品企画会議に先立ち、新製品のプランを考えることです。\">\n\t\t\t\tこのミーティングの目的は、１月の商品企画会議に<strong>先立</strong>ち、新製品のプランを考えることです。\r<strong></strong></a> <br/>\n\t\tThe purpose of the meeting is to make a plan for a new product prior to the Product Development Meeting in January. \n\t\t<strong> </strong>"
