    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ海戦に先立って出港した後に、乗組員が船に慣れる時間がないことが、しばしばあるものだ。 \">\n\t\t\t\t海戦<strong>に先立って</strong>出港した後に、乗組員が船に慣れる時間がないことが、しばしばあるものだ。 <strong></strong></a> <br/>\n\t\tA sailor frequently has no time to get his sea legs after leaving port before a sea battle starts. \n\t\t<strong> </strong>"
