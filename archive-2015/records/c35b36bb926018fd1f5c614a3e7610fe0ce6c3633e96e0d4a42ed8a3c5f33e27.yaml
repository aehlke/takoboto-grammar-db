    original_updated_at: null
  - position: 1
    text: 先立つ（さきだつ）is the dictionary form, as in one of the examples below.
    html: 先立つ（さきだつ）is the dictionary form, as in one of the examples below.
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "＊This grammar can be used as a sort of conjunction (に先立って; に先立ち), or in front of another noun (に先立つ).\n\n\n\r\nFORMATION:\n\r\nＮ + に先立って\n\r\nＮ1 + に先立つ + Ｎ2"
    html: "＊This grammar can be used as a sort of conjunction (に先立って; に先立ち), or in front of another noun (に先立つ).<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + に先立って<br/>\r\nＮ1 + に先立つ + Ｎ2"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
