    japanese: フィルタリング導入に先立って、親子の信頼関係を損ねないために考慮すべきこと。
    body_text: "フィルタリング導入に先立って、親子の信頼関係を損ねないために考慮すべきこと。 \n\n\t\tThings that should be considered \n\t\tbefore \n\t\tsetting up [Internet] filtering in order not to damage the relationship of trust between parent and child."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJフィルタリング導入に先立って、親子の信頼関係を損ねないために考慮すべきこと。\">\nフィルタリング導入<strong>に先立って</strong>、親子の信頼関係を損ねないために考慮すべきこと。<strong></strong></a> <br/>\n\t\tThings that should be considered \n\t\t<strong>before </strong>\n\t\tsetting up [Internet] filtering in order not to damage the relationship of trust between parent and child."
    credits_raw: Amatuka
