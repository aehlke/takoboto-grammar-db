    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ映画の一般公開に先立って主演女優のサイン会が開かれた。\">\n\t\t\t\t映画の一般公開<strong>に先立って</strong>主演女優のサイン会が開かれた。<strong></strong></a> <br/>\n<strong>Preceeding </strong>\n\t\tthe general opening of the film, the leading actress's signing session was opened."
