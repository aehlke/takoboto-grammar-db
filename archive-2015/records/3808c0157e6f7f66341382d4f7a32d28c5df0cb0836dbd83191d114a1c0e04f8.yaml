notes:
  - position: 0
    text: "〜べからず／〜べからざる　：　〜してはいけない・禁止\n\n\n\r\n１．「〜べからず」は立て看板などの注意書きに使われます。\n\r\n２．「〜べからざる」（名詞の前に付く形）は「許すべからざる、欠くべからざる」のほかはあまり使われません。"
    html: "〜べからず／〜べからざる　：　〜してはいけない・禁止<br/>\n<br/>\r\n１．「〜べからず」は立て看板などの注意書きに使われます。<br/>\r\n２．「〜べからざる」（名詞の前に付く形）は「許すべからざる、欠くべからざる」のほかはあまり使われません。"
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "はしを渡るべからずというのは昔のことわざで日本人の人なら誰でも知ってるはずです。覚えといていただいたらうれしい：）このことわざについてもっと詳しく知りたければ調べてみてください。\n\n\n\r\nBy the way この上に書いてある誠さんのノートに間違ってることに気づきました。名詞の前につくというのじゃなくて、動詞の前につく形のほうが正しいとおもいます。"
    html: "はしを渡るべからずというのは昔のことわざで日本人の人なら誰でも知ってるはずです。覚えといていただいたらうれしい：）このことわざについてもっと詳しく知りたければ調べてみてください。<br/>\n<br/>\r\nBy the way この上に書いてある誠さんのノートに間違ってることに気づきました。名詞の前につくというのじゃなくて、動詞の前につく形のほうが正しいとおもいます。"
    credits_raw: iamharenchi
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: |-
      Etymologically, this is adjective 可(べ)し in 連用形 beku, to which 在(あ)り is appended, forming bekuari > bekari. Then, to its 未然形 bekara, the classical verb of negation ず is added, forming bekarazu. Further, 在り can be added again, resulting in bekarazari, whose 連体形 is bekarazaru. Also recall that 連体形 is used for verbs before nouns (attributive usage) and 終止形 for ending sentences.
    html: |-
      Etymologically, this is adjective 可(べ)し in 連用形 beku, to which 在(あ)り is appended, forming bekuari &gt; bekari. Then, to its 未然形 bekara, the classical verb of negation ず is added, forming bekarazu. Further, 在り can be added again, resulting in bekarazari, whose 連体形 is bekarazaru. Also recall that 連体形 is used for verbs before nouns (attributive usage) and 終止形 for ending sentences.
    credits_raw: blutorange
