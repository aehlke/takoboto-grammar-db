  - position: 6
    credits_raw: jimmyseal
    text: "Actually, the 終止形 form is べし, and it conjugates like an adjective, meaning the 未然形 is べから.\n\n\n\r\nAs blabby hinted, use べからざる before nouns, and べからず at the end of sentences."
