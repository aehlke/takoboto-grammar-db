  - position: 5
    credits_raw: Nick
    text: "\"〜べからざる\"\n\r\nThis must be worth remembering, but few Japanese use it in everyday speech.\n\r\nI think that most Japanese usually say:\n\n#\x01\n\r\n成人指定映画は青少年にとって見てはいけないものだ。\n\n\n\n#\x01\n\r\n許されない行為\n\n\n\n#\x01\n\r\nこれはまさに無視してはいけない犯罪ではないでしょうか。\n\n\n\n#\x01\n\r\n今日の社会では、パソコンは欠かせないものとなっている。\n\n\n\n#\x01\n\r\nこの荷物には「危険！触るな！」と書いてある。"
    html: "\"〜べからざる\"<br/>\r\nThis must be worth remembering, but few Japanese use it in everyday speech.<br/>\r\nI think that most Japanese usually say:<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=bekarazaru#\x01\">#\x01</a></b><br/>\r\n成人指定映画は青少年にとって見てはいけないものだ。<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=bekarazaru#\x01\">#\x01</a></b><br/>\r\n許されない行為<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=bekarazaru#\x01\">#\x01</a></b><br/>\r\nこれはまさに無視してはいけない犯罪ではないでしょうか。<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=bekarazaru#\x01\">#\x01</a></b><br/>\r\n今日の社会では、パソコンは欠かせないものとなっている。<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=bekarazaru#\x01\">#\x01</a></b><br/>\r\nこの荷物には「危険！触るな！」と書いてある。"
    source_id: null
