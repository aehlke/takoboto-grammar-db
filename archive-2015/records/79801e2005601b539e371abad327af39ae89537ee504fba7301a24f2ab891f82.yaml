notes:
  - position: 0
    text: "「Ａことから、Ｂ」 Ａは、Ｂで言うことの理由・原因・根拠\n\r\n「Ａことから、Ｂ」 A is the reason, cause/origin, or basis for B.\n\n\n\r\nＶ(plain form) + ことから\n\r\nいＡ(reg. form) + ことから\n\r\nなＡ + な + ことから // なＡ + だった + ことから\n\r\nＮ + だった + ことから"
    html: "「Ａことから、Ｂ」 Ａは、Ｂで言うことの理由・原因・根拠<br/>\r\n「Ａことから、Ｂ」 A is the reason, cause/origin, or basis for B.<br/>\n<br/>\r\nＶ(plain form) + ことから<br/>\r\nいＡ(reg. form) + ことから<br/>\r\nなＡ + な + ことから // なＡ + だった + ことから<br/>\r\nＮ + だった + ことから"
    credits_raw: rubyhatchet
