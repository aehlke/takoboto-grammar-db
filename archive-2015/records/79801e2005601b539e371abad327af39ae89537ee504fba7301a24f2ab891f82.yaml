    japanese: クモの巣を作るには、このきぬの枠を作り、それを木や垣根のような固い物体に固定させることから始める。
    body_text: "クモの巣を作るには、このきぬの枠を作り、それを木や垣根のような固い物体に固定させることから始める。\r \n\n\t\tTo make a web, it starts by making a frame of this silk and fastening it to hard objects, such as trees or fences."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJクモの巣を作るには、このきぬの枠を作り、それを木や垣根のような固い物体に固定させることから始める。\">\n\t\t\t\tクモの巣を作るには、このきぬの枠を作り、それを木や垣根のような固い物体に固定させる<strong>ことから</strong>始める。\r<strong></strong></a> <br/>\n\t\tTo make a web, it starts by making a frame of this silk and fastening it to hard objects, such as trees or fences. \n\t\t<strong> </strong>"
