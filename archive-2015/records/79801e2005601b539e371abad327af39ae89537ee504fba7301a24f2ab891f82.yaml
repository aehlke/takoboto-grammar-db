    body_text: "町並みが昔のままに保存され、古い寺も多いことから、その町は「小京都」と呼ばれている。 \n\nSince \n\t\tthe streets are maintained to look how they did long ago, and since there are lots of old temples, that town is called \"Little Kyoto.\""
