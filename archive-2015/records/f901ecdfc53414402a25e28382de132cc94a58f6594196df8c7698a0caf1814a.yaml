  - position: 3
    credits_raw: Miki
    text: |-
      When we say 受験の真っ最中 it means being in the exam season. ex 受験の真っ最中ですが、気分転換にディズニー・シーに遊びに行きました。in the midst of taking a test would be just '受験中に' or '試験中に'.　受験 might be special.
    html: |-
      When we say 受験の真っ最中 it means being in the exam season. ex 受験の真っ最中ですが、気分転換にディズニー・シーに遊びに行きました。in the midst of taking a test would be just '受験中に' or '試験中に'.　受験 might be special.
