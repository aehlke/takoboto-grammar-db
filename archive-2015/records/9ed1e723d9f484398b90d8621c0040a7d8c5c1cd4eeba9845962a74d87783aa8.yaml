    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJラッシュの電車はとても込んでいますよ。ドアが閉まらないほどです。\">\n\t\t\t\tラッシュの電車はとても込んでいますよ。ドアが閉まらない<strong>ほどです</strong>。<strong></strong></a> <br/>\n\t\tRush-hour trains are really crowded. The doors \n\t\t<strong>almost </strong>\n\t\tdon't shut."
