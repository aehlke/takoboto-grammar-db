    credits_raw: Kori
    text: "This Kansai page seems to be mixed with the まい page. All of the in-page examples are messed up. For example:\n\n\n\r\nUsing Negative Verbs in 関西弁\n\n\n\r\n    * For non-past, replace 「ない」 with 「へん」\n\r\n      例）　見る → 見るまい\n\r\n      例）　行く → 行くまい\n\r\n    * For past tense, replace 「なかった」 with 「へんかった」\n\r\n      例）　する → しまい\n\r\n      例）　認める → 認めまい\n\r\n    * This conjugation must always come last. For masu-form, attach 「まい」 to the masu-form verb.\n\r\n      例）　なる → なり → なります → なりますまい"
