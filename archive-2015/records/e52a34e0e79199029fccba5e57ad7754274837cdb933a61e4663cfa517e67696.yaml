    text: "#\x01 is copied exactly as I found it. I'm not quite sure about it because it is not at the end of the sentence as all the other examples are. 結末 and probably even 結果 sound like they would be good in context."
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=shimatsuda#\x01\">#\x01</a></b> is copied exactly as I found it. I'm not quite sure about it because it is not at the end of the sentence as all the other examples are. 結末 and probably even 結果 sound like they would be good in context."
