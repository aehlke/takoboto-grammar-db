  - position: 3
    credits_raw: bamboo4
    text: "In #\x01,始末 means \"from the beginning to the end\" whereas in all other examples, 始末 is used to mean \"situation\" or \"circumstances.\""
    html: "In <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=shimatsuda#\x01\">#\x01</a></b>,始末 means \"from the beginning to the end\" whereas in all other examples, 始末 is used to mean \"situation\" or \"circumstances.\"<br/>"
