    japanese: それはナンセンスだ。誰もそれを信じないであろう。
    body_text: "それはナンセンスだ。誰もそれを信じないであろう。 \n\n\t\tThat's nonsense. Nobody \n\t\twould \n\t\tbelieve it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそれはナンセンスだ。誰もそれを信じないであろう。\">\n\t\t\t\tそれはナンセンスだ。誰もそれを信じない<strong>であろう。</strong><strong></strong></a> <br/>\n\t\tThat's nonsense. Nobody \n\t\t<strong>would </strong>\n\t\tbelieve it."
