    body_text: "きっと彼女の病気はすぐによくなるであろう。 \n\n\t\tThat she \n\t\twill \n\t\tget over her illness soon is certain."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJきっと彼女の病気はすぐによくなるであろう。\">\n\t\t\t\tきっと彼女の病気はすぐによくなる<strong>であろう。</strong><strong></strong></a> <br/>\n\t\tThat she \n\t\t<strong>will </strong>\n\t\tget over her illness soon is certain."
