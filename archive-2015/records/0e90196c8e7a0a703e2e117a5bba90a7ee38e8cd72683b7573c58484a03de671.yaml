    body_text: "あなたの助けがなかったら、我々は仕事を間に合わせられなかったであろう。 \n\n\t\tBut for your help, we \n\t\tshould not have \n\t\tfinished in time."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたの助けがなかったら、我々は仕事を間に合わせられなかったであろう。\">\n\t\t\t\tあなたの助けがなかったら、我々は仕事を間に合わせられなかった<strong>であろう。</strong><strong></strong></a> <br/>\n\t\tBut for your help, we \n\t\t<strong>should not have </strong>\n\t\tfinished in time."
