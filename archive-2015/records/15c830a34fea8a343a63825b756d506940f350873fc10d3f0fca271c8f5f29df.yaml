notes:
  - position: 0
    text: "This grammar is used only in conversation. It is used when asking a question in order to confirm/affirm something.\n\n\n\r\n＊Because it an expression for confirmation, it is alright to use past tense when referring to something in the present or future.\n\r\nEX: 来月の三日は月曜日でしたっけ。(＝月曜日だったっけ)\n\r\n\"The 3rd of next month was Monday, right?\"\n\n\n\r\nFORMATION:\n\r\nV(plain past form) + っけ\n\r\nV(dict. form) + んだっけ・んだったっけ\n\r\nいA(minus い) + かったっけ\n\r\nなA + だ・だった + っけ\n\r\nN + だ・だった + っけ\n\n\n\r\n＊If you wish to use more formal Japanese, you can use 「ましたっけ」 or 「でしたっけ」, but you CANNOT use 「ますっけ」 or 「ですっけ」."
    html: "This grammar is used only in conversation. It is used when asking a question in order to confirm/affirm something.<br/>\n<br/>\r\n＊Because it an expression for confirmation, it is alright to use past tense when referring to something in the present or future.<br/>\r\nEX: 来月の三日は月曜日でしたっけ。(＝月曜日だったっけ)<br/>\r\n\"The 3rd of next month was Monday, right?\"<br/>\n<br/>\r\nFORMATION:<br/>\r\nV(plain past form) + っけ<br/>\r\nV(dict. form) + んだっけ・んだったっけ<br/>\r\nいA(minus い) + かったっけ<br/>\r\nなA + だ・だった + っけ<br/>\r\nN + だ・だった + っけ<br/>\n<br/>\r\n＊If you wish to use more formal Japanese, you can use 「ましたっけ」 or 「でしたっけ」, but you CANNOT use 「ますっけ」 or 「ですっけ」."
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "っけ is used as a question marker in informal Speech (and even then is often just shortened to け。)\n\n\n\r\nっけ itself is generally used when asking about something you should really already know but have forgotten, or when you are affirming something that you're maybe 50% sure about."
    html: "っけ is used as a question marker in informal Speech (and even then is often just shortened to け。)<br/>\n<br/>\r\nっけ itself is generally used when asking about something you should really already know but have forgotten, or when you are affirming something that you're maybe 50% sure about."
    credits_raw: 反戦
