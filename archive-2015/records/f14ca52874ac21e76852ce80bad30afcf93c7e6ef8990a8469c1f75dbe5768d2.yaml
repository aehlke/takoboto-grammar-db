    text: "@nikonniko Same meaning, different usage - as with a LOT of grammar. 名詞＋を問わず is a straight forward easy to use phrase, appropriate for most language situations.  \n\r\n名詞＋の＋いかんを問わずis more formal, appropriate for written language, archaic?"
