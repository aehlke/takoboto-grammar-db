examples:
  - source_id: 5472
    position: 0
    japanese: 理由のいかんによらず、殺人は許されないことだ。
    body_text: "理由のいかんによらず、殺人は許されないことだ。 \n\nRegardless of \n\t\tthe reason, murder is unforgiveable"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ理由のいかんによらず、殺人は許されないことだ。\">\n\t\t\t\t理由の<strong>いかんによらず</strong>、殺人は許されないことだ。<strong></strong></a> <br/>\n<strong>Regardless of </strong>\n\t\tthe reason, murder is unforgiveable"
    credits_raw: ogtob
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5473
    position: 1
    japanese: 国籍のいかんを問わず、採用試験を受けることのできる自治体が増えている。
    body_text: "国籍のいかんを問わず、採用試験を受けることのできる自治体が増えている。 \n\n\t\tThe number of municipalities where one can take the employment test \n\t\tregardless of \n\t\tnationalty is increasing."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ国籍のいかんを問わず、採用試験を受けることのできる自治体が増えている。\">\n\t\t\t\t国籍の<strong>いかんを問わず</strong>、採用試験を受けることのできる自治体が増えている。<strong></strong></a> <br/>\n\t\tThe number of municipalities where one can take the employment test \n\t\t<strong>regardless of </strong>\n\t\tnationalty is increasing."
    credits_raw: ogtob
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7917
    position: 2
    japanese: 納入した学費は理由のいかんに関わらず返却しません。
    body_text: "納入した学費は理由のいかんに関わらず返却しません。 \n\n\t\tThe tuition and fees you have paid will not be returned, \n\t\tno matter what \n\t\tthe reason."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ納入した学費は理由のいかんに関わらず返却しません。\">\n\t\t\t\t納入した学費は理由の<strong>いかんに関わらず</strong>返却しません。<strong></strong></a> <br/>\n\t\tThe tuition and fees you have paid will not be returned, \n\t\t<strong>no matter what </strong>\n\t\tthe reason."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7918
    position: 3
    japanese: このコンテンツの複製は方法、媒体のいかんを問わず禁止されている。
    body_text: "このコンテンツの複製は方法、媒体のいかんを問わず禁止されている。 \n\n\t\tCopying the content is prohibited, \n\t\tregardless \n\t\tof the method or the medium."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこのコンテンツの複製は方法、媒体のいかんを問わず禁止されている。\">\n\t\t\t\tこのコンテンツの複製は方法、媒体の<strong>いかんを問わず</strong>禁止されている。<strong></strong></a> <br/>\n\t\tCopying the content is prohibited, \n\t\t<strong>regardless </strong>\n\t\tof the method or the medium."
    credits_raw: LR
