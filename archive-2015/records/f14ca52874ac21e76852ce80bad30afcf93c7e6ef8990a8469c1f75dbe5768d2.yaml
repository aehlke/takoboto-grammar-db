    credits_raw: Nick
    text: "理由（りゆう）の如何（いかん）によらず\n\r\nThis means \"no matter what reason there is.\"\n\r\nUsually, Japanese people say \"理由が何であろうとも\" instead."
    html: "理由（りゆう）の如何（いかん）によらず<br/>\r\nThis means \"no matter what reason there is.\"<br/>\r\nUsually, Japanese people say \"理由が何であろうとも\" instead."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: '"理由が何であろうとも" would be used especially in speaking. In written form, "いかんにもよらず" is often seen.'
    html: '"理由が何であろうとも" would be used especially in speaking. In written form, "いかんにもよらず" is often seen.'
