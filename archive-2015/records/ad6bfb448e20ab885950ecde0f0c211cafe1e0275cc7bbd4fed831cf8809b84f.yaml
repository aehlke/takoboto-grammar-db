  - position: 5
    credits_raw: bamboo4
    text: "You have it wrong. とにかく急ごう means \"leaving all that aside, let's hurry.\" Thus, とにかく does not have a meaning of \"quickly\" or \"naturally.\"\n\n\n\r\nRe Miki-san's comment, 角行 is pronounced かくこう."
    html: "You have it wrong. とにかく急ごう means \"leaving all that aside, let's hurry.\" Thus, とにかく does not have a meaning of \"quickly\" or \"naturally.\"<br/>\n<br/>\r\nRe Miki-san's comment, 角行 is pronounced かくこう.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
