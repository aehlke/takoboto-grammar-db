    japanese: バッハの作品は他のバロック音楽とは比べものにならない。
    body_text: "バッハの作品は他のバロック音楽とは比べものにならない。\r \n\n\t\tThere is no comparison between Bach's compositions and other baroque music."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJバッハの作品は他のバロック音楽とは比べものにならない。\">\n\t\t\t\tバッハの作品は他のバロック音楽とは<strong>比べものにならない</strong>。\r<strong></strong></a> <br/>\n\t\tThere is no comparison between Bach's compositions and other baroque music. \n\t\t<strong> </strong>"
