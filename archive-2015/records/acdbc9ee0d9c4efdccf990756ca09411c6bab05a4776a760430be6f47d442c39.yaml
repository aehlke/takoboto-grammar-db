    japanese: 私の業績はあなたの業績とは比べものにならない。
    body_text: "私の業績はあなたの業績とは比べものにならない。\r \n\n\t\tYour achievements cannot be compared with mine."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私の業績はあなたの業績とは比べものにならない。\">\n\t\t\t\t私の業績はあなたの業績とは<strong>比べものにならない</strong>。\r<strong></strong></a> <br/>\n\t\tYour achievements cannot be compared with mine. \n\t\t<strong> </strong>"
