    credits_raw: Nabeshin
    text: I'm confused.  What is the difference between using 「やら、やら」　and 「や、　など」?
    html: I'm confused.  What is the difference between using 「やら、やら」　and 「や、　など」?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Aes
    text: I think it expresses feeling and a bit of a sense of that's bad/unfortunate?
    html: I think it expresses feeling and a bit of a sense of that's bad/unfortunate?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: lou1sb
    text: "I disagree, やら　やら　seems to translate into English as 'Things like...' or 'Do things like...' while や、や、など translates more accurately as 'and, and, etc.'\n\n\n\r\nなど　states explicitely that there are further things in the category, やら　やら　only implies it."
    html: "I disagree, やら　やら　seems to translate into English as 'Things like...' or 'Do things like...' while や、や、など translates more accurately as 'and, and, etc.'<br/>\n<br/>\r\nなど　states explicitely that there are further things in the category, やら　やら　only implies it."
    source_id: null
