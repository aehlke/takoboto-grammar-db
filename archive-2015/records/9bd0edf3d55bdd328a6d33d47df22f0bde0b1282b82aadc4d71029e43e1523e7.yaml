  - position: 4
    credits_raw: Socky
    text: "Apparently, 'やら' is similar to using 'や' or 'とか' but indicates less certainty, and also has other uses as well. For example:\n\r\n\"彼のクローゼットには、帽子やスカーフはありました。\"\n\r\n\"In his closet, there were things like caps and scarves.\"\n\r\nas opposed to:\n\r\n\"彼のクローゼットには、帽子やらスカーフはありました。\"\n\r\n\"In his closet, (I'm fairly certain... I think) there were things like caps and scarves (or something like that).\"\n\n\n\r\nAlthough it apparently (according to The Handbook of Japanese Grammar by Harold G. Henderson) has other usages, in this case this is how it would be used. I heard it used in the sentence:\n\r\n「試してみるのか？お前が言う光とやらの力を？」\n\r\nI take this to mean:\n\r\n\"Are you trying this? The power of this(uncertain of meaning)light you speak of?\"\n\r\nApparently とやら is the same as やら. I'm not really sure, there doesn't seem to be much info on this anywhere.\n\r\n***EDIT: とやら actually means \"and the like\" and works similarly to \"nado\" but once again, with less certainty and more of that \"something-like-that\" nuance. So the previous sentence actually should translate to:\n\r\n\"The power of this 'light' (and such/and the like/ and stuff like that) that you speak of.\"\n\n\n\r\nTo be honest, it sounds like \"and stuff like that\" would be the closest definition. The words you are listing are said with partial certainty, and like the previous commenter said, や  and とか can often be translated to \"and.\""
    html: "Apparently, 'やら' is similar to using 'や' or 'とか' but indicates less certainty, and also has other uses as well. For example:<br/>\r\n\"彼のクローゼットには、帽子やスカーフはありました。\"<br/>\r\n\"In his closet, there were things like caps and scarves.\"<br/>\r\nas opposed to:<br/>\r\n\"彼のクローゼットには、帽子やらスカーフはありました。\"<br/>\r\n\"In his closet, (I'm fairly certain... I think) there were things like caps and scarves (or something like that).\"<br/>\n<br/>\r\nAlthough it apparently (according to The Handbook of Japanese Grammar by Harold G. Henderson) has other usages, in this case this is how it would be used. I heard it used in the sentence:<br/>\r\n「試してみるのか？お前が言う光とやらの力を？」<br/>\r\nI take this to mean:<br/>\r\n\"Are you trying this? The power of this(uncertain of meaning)light you speak of?\"<br/>\r\nApparently とやら is the same as やら. I'm not really sure, there doesn't seem to be much info on this anywhere.<br/>\r\n***EDIT: とやら actually means \"and the like\" and works similarly to \"nado\" but once again, with less certainty and more of that \"something-like-that\" nuance. So the previous sentence actually should translate to:<br/>\r\n\"The power of this 'light' (and such/and the like/ and stuff like that) that you speak of.\"<br/>\n<br/>\r\nTo be honest, it sounds like \"and stuff like that\" would be the closest definition. The words you are listing are said with partial certainty, and like the previous commenter said, や  and とか can often be translated to \"and.\""
    source_id: null
    original_created_at: null
    original_updated_at: null
