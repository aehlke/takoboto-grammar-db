notes:
  - position: 0
    text: "there are a few ways to express the intention to do something, which seem very similar at first. but:\n\n\n\r\n-youni is used with the potential or negative form of a verb.\n\n\n\r\n　yoku kikoeru youni .. = to be able to hear better\n\r\n　wasurenai you ni = in order not to forget\n\r\n　dekiru yooni = so that I will be able to do\n\n\n\n\n\r\n-\x01 is usually just the plain form\n\r\n　kau tameni = in order to buy\n\r\n　kiku tameni = in order to hear"
    html: "there are a few ways to express the intention to do something, which seem very similar at first. but:<br/>\n<br/>\r\n-youni is used with the potential or negative form of a verb.<br/>\n<br/>\r\n　yoku kikoeru youni .. = to be able to hear better<br/>\r\n　wasurenai you ni = in order not to forget<br/>\r\n　dekiru yooni = so that I will be able to do<br/>\n<br/>\n<br/>\r\n-<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is usually just the plain form<br/>\r\n　kau tameni = in order to buy<br/>\r\n　kiku tameni = in order to hear<br/>"
    credits_raw: anon
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "see \x01 for similar items and comparisons."
    html: "see <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> for similar items and comparisons."
    credits_raw: dc
    source_id: null
