    original_updated_at: null
  - position: 2
    text: "Also means \"like\" or \"as\"\n\n\n\r\nWatashi you ni hashiru. (Run like me, to run like me)"
    html: "Also means \"like\" or \"as\"<br/>\n<br/>\r\nWatashi you ni hashiru. (Run like me, to run like me)"
    credits_raw: Ayumi
    source_id: null
    original_created_at: null
    original_updated_at: null
