  - position: 3
    credits_raw: dc
    text: "I was told that  verbs are not as comfortable in this construct, but not sure why. eg\n\r\n計算するように、市場データを調べておきました\n\r\nIn order to do a calculation, I researched market data"
    html: "I was told that  verbs are not as comfortable in this construct, but not sure why. eg<br/>\r\n計算するように、市場データを調べておきました<br/>\r\nIn order to do a calculation, I researched market data<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: dc
    text: "計算するように\n\r\nis a different expression. It sounds like \n\r\n計算するかのように \n\r\n= like a calculation, metaphorically speaking\n\n\n\r\nso you should use \n\r\n計算するために \n\r\nin this case. It is different from 間に合うように\n\n\n\r\n← can someone clarify this explanation?"
    html: "計算するように<br/>\r\nis a different expression. It sounds like <br/>\r\n計算するかのように <br/>\r\n= like a calculation, metaphorically speaking<br/>\n<br/>\r\nso you should use <br/>\r\n計算するために <br/>\r\nin this case. It is different from 間に合うように<br/>\n<br/>\r\n← can someone clarify this explanation?"
    source_id: null
