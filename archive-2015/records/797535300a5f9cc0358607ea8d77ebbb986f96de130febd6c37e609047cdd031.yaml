examples:
  - source_id: 7960
    position: 0
    japanese: 男性であれ、女性であれ、人間としての権利は同じはずだ。
    body_text: "男性であれ、女性であれ、人間としての権利は同じはずだ。 \n\nWhether \n\t\tone is a man or a woman, one's rights as a human being should be the same."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ男性であれ、女性\">\n\t\t\t\t男性<strong>であれ</strong>、女性<strong>であれ</strong>、人間としての権利は同じはずだ。</a> <br/>\n<strong>Whether </strong>\n\t\tone is a man or a woman, one's rights as a human being should be the same."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7961
    position: 1
    japanese: 有名であれ、無名であれ、人生は短い。
    body_text: "有名であれ、無名であれ、人生は短い。  \n\nNo matter \n\t\tif one is famous or nameless, life is short."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ有名であれ、無名\">\n\t\t\t\t有名<strong>であれ</strong>、無名<strong>であれ、人生は短い。 </strong></a> <br/>\n<strong>No matter </strong>\n\t\tif one is famous or nameless, life is short."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7962
    position: 2
    japanese: 注射であれ飲み薬であれ、良く効く薬はかえって副作用が心配だ
    body_text: "注射であれ飲み薬であれ、良く効く薬はかえって副作用が心配だ \n\nWhether \n\t\tit's an injection or oral medecine, I worry that drugs that work well will have adverse side-effects."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ注射であれ飲み薬\">\n\t\t\t\t注射<strong>であれ</strong>飲み薬<strong>であれ</strong>、良く効く薬はかえって副作用が心配だ</a> <br/>\n<strong>Whether </strong>\n\t\tit's an injection or oral medecine, I worry that drugs that work well will have adverse side-effects."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7963
    position: 3
    japanese: 父は菓子であれ、果物であれ、甘い者は一切口にしない。
    body_text: "父は菓子であれ、果物であれ、甘い者は一切口にしない。 \n\n\t\tMy father won't eat any anything sweet, \n\t\twhether \n\t\tit be sweets or fruit."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ父は菓子であれ、果物\">\n\t\t\t\t父は菓子<strong>であれ</strong>、果物<strong>であれ</strong>、甘い者は一切口にしない。</a> <br/>\n\t\tMy father won't eat any anything sweet, \n\t\t<strong>whether </strong>\n\t\tit be sweets or fruit."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7964
    position: 4
    japanese: 正社員であれ、パートであれ、仕事に対する責任は変わりません。
    body_text: "正社員であれ、パートであれ、仕事に対する責任は変わりません。 \n\nWhether \n\t\ta full time employee or a part-timer, your duty to your job is the same."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ正社員であれ、パート\">\n\t\t\t\t正社員<strong>であれ</strong>、パート<strong>であれ</strong>、仕事に対する責任は変わりません。</a> <br/>\n<strong>Whether </strong>\n\t\ta full time employee or a part-timer, your duty to your job is the same."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7965
    position: 5
    japanese: あの学者は哲学であれ、言語学であれ、人類学であれ、同じように精通している。
    body_text: "あの学者は哲学であれ、言語学であれ、人類学であれ、同じように精通している。 \n\n\t\tThat scholar is well-versed in a number os subjects, \n\t\twhether it be \n\t\tphilosophy, linguistics or anthropology"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあの学者は哲学であれ、言語学\">\n\t\t\t\tあの学者は哲学<strong>であれ</strong>、言語学<strong>であれ</strong>、人類学であれ、同じように精通している。</a> <br/>\n\t\tThat scholar is well-versed in a number os subjects, \n\t\t<strong>whether it be </strong>\n\t\tphilosophy, linguistics or anthropology"
