notes:
  - position: 0
    text: "次第: as soon as; if 〜, then immediately 〜.\n\r\nThis grammar implies a planned sequence of actions. It does NOT imply a surprising result. As a result, this grammar cannot be used with the past tense.\n\n\n\r\nＶ(ます form MINUS ます) + 次第\n\n\n\r\n次第で(は) or 次第だ: depends on; is decided by; changes depending on.\n\n\n\r\nＮ + 次第だ・次第で(は)"
    html: "次第: as soon as; if 〜, then immediately 〜.<br/>\r\nThis grammar implies a planned sequence of actions. It does NOT imply a surprising result. As a result, this grammar cannot be used with the past tense.<br/>\n<br/>\r\nＶ(ます form MINUS ます) + 次第<br/>\n<br/>\r\n次第で(は) or 次第だ: depends on; is decided by; changes depending on.<br/>\n<br/>\r\nＮ + 次第だ・次第で(は)"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "This is a conjuction/noun which is used to express that an action indicated by a preceding verb or an action implemented by a preceding noun is a prerequisite for another action.\n\n\n\r\nインドに着き次第を電話差し上げます。\n\r\nAs soon as I get to india, I will call you."
    html: "This is a conjuction/noun which is used to express that an action indicated by a preceding verb or an action implemented by a preceding noun is a prerequisite for another action.<br/>\n<br/>\r\nインドに着き次第を電話差し上げます。<br/>\r\nAs soon as I get to india, I will call you."
    credits_raw: brij_shukla2000
    source_id: null
    original_created_at: null
    original_updated_at: null
