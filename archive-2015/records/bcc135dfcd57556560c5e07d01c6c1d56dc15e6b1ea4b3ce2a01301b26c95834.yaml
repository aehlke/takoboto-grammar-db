    text: "悪い　and 危ない are both adjectives, but when the adjetive is used to qulaify a noun, the noun takes + 　のような気\n\n\n\r\n危ない　気がする\n\r\n　悪い　気がする\n\n\n\r\nbut\n\r\n　悪い男のよう　な　気がする\n\n\n\r\nI find this easiest to remember as \n\r\n-like feeling\n\r\n-no\x01na 気がする"
