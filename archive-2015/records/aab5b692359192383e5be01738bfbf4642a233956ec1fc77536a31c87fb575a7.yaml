comments:
  - position: 0
    credits_raw: Amatuka
    text: "Formed from Vte + shimau.\n\n\n\r\nNote that shimau conjugates as a normal godan verb.\n\n\n\r\nVte = -te form verb (死ぬ -> 死んで)"
    html: "Formed from Vte + shimau.<br/>\n<br/>\r\nNote that shimau conjugates as a normal godan verb.<br/>\n<br/>\r\nVte = -te form verb (死ぬ -&gt; 死んで)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Note that the Vte+shimau can be shortened in one of two ways depending on the kana used for the 'te' form verb.\n\n\n\r\ne.g. 死んでしまう → 死んじゃう\n\r\n凍えてしまう → 凍えちゃう"
    html: "Note that the Vte+shimau can be shortened in one of two ways depending on the kana used for the 'te' form verb.<br/>\n<br/>\r\ne.g. 死んでしまう → 死んじゃう<br/>\r\n凍えてしまう → 凍えちゃう"
    source_id: null
