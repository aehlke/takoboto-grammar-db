    text: "しょうがない on its own is a sort of idiom meaning \"Can't be helped,\" but because this is a grammar entry, it should be emphasized that しょうがない is correctly used in a sentence when it follows て or で. So, てしょうがない is a proper grammar entry title. In that case, example #\x01 is simply a conversational use of the idiom and doesn't belong in this entry."
