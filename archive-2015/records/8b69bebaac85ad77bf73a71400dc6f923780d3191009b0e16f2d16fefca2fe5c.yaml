notes:
  - position: 0
    text: "＊しようがない is also acceptable sometimes, but this grammar is much more widely written as しょうがない.\n\n\n\r\n＊てたまらない is stronger than てしょうがない, but the two are otherwise interchangeable.\n\n\n\r\n＊てしょうがない should express feelings, sentiments, mentality, or desire. For example:\n\r\n1. 疲れる -> 疲れてしょうがない\n\r\n2. 痛い -> 痛くてしようがない・痛くてたまらない\n\r\n3. 残念 -> 残念でしようがない・残念でたまらない\n\n\n\r\nFORMATION:\n\r\nＶ・いＡ（て forms) + しょうがない・たまらない\n\r\nなＡ + で + しょうがない・たまらない"
    html: "＊しようがない is also acceptable sometimes, but this grammar is much more widely written as しょうがない.<br/>\n<br/>\r\n＊てたまらない is stronger than てしょうがない, but the two are otherwise interchangeable.<br/>\n<br/>\r\n＊てしょうがない should express feelings, sentiments, mentality, or desire. For example:<br/>\r\n1. 疲れる -&gt; 疲れてしょうがない<br/>\r\n2. 痛い -&gt; 痛くてしようがない・痛くてたまらない<br/>\r\n3. 残念 -&gt; 残念でしようがない・残念でたまらない<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ・いＡ（て forms) + しょうがない・たまらない<br/>\r\nなＡ + で + しょうがない・たまらない"
