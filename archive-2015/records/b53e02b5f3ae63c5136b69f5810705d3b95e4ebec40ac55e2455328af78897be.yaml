    japanese: 学生達も受験を目前にするに至って、やっとやる気になった。
    body_text: "学生達も受験を目前にするに至って、やっとやる気になった。\r \n\n\t\tWhen the university students reached the stage of their exams, they finally got motivation."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ学生達も受験を目前にするに至って、やっとやる気になった。\">\n\t\t\t\t学生達も受験を目前にする<strong>に至って</strong>、やっとやる気になった。\r<strong></strong></a> <br/>\n\t\tWhen the university students reached the stage of their exams, they finally got motivation. \n\t\t<strong> </strong>"
