    japanese: いじめによる自殺が社会問題化するに至って、やっと文部省は重い腰を上げた。
    body_text: "いじめによる自殺が社会問題化するに至って、やっと文部省は重い腰を上げた。\r \n\n\t\tSuicide due to bullying has reached the level of being one of society’s problems.  Therefore, finally the ministry of education has decided to act."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJいじめによる自殺が社会問題化するに至って、やっと文部省は重い腰を上げた。\">\n\t\t\t\tいじめによる自殺が社会問題化する<strong>に至って</strong>、やっと文部省は重い腰を上げた。\r<strong></strong></a> <br/>\n\t\tSuicide due to bullying has reached the level of being one of society’s problems.  Therefore, finally the ministry of education has decided to act. \n\t\t<strong> </strong>"
