    japanese: 大地震で何千人もの死傷者を出すに至って、やっと危機管理の重要性が叫ばれるようになった。
    body_text: "大地震で何千人もの死傷者を出すに至って、やっと危機管理の重要性が叫ばれるようになった。 \n\n\t\tIt took thousands of earthquake casualties before the importance of crisis management could finally be called for."
