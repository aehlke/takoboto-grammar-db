    japanese: 僕は彼女と結婚するつもりだった。
    body_text: "僕は彼女と結婚するつもりだった。 \n\nI had the intention to \nmarry  her (but I didn't)."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ僕は彼女と結婚するつもりだった\">\n\t\t\t\t僕は彼女と結婚する<strong>つもりだった</strong><strong></strong>。</a> <br/>\n<strong>I had the intention to </strong>\nmarry  her (but I didn't)."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6847
    position: 1
    japanese: 今日は誰も来ないし、私も出かけないつもりだった。
    body_text: "今日は誰も来ないし、私も出かけないつもりだった。 \n\n\t\tToday, nobody should have come, and I \n\t\thadn't intention to \nleave  too."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今日は誰も来ないし、私も出かけないつもりだった\">\n\t\t\t\t今日は誰も来ないし、私も出かけない<strong>つもりだった</strong><strong></strong>。</a> <br/>\n\t\tToday, nobody should have come, and I \n\t\t<strong>hadn't intention to </strong>\nleave  too."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6848
    position: 2
    japanese: 正しく見直したつもりだったが、間違ってしまった。
    body_text: "正しく見直したつもりだったが、間違ってしまった。 \n\nI intended to \nreview it  properly, but unfortunately I made mistakes."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ正しく見直したつもりだった\">\n\t\t\t\t正しく見直した<strong>つもりだった</strong><strong></strong>が、間違ってしまった。</a> <br/>\n<strong>I intended to </strong>\nreview it  properly, but unfortunately I made mistakes."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6849
    position: 3
    japanese: 自分では大人になったつもりだったが、子どもっぽい行動してしまった。
    body_text: "自分では大人になったつもりだったが、子どもっぽい行動してしまった。 \n\nI intended to \nbecome  an adult by myself, but finally I acted the childish way."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ自分では大人になったつもりだった\">\n\t\t\t\t自分では大人になった<strong>つもりだった</strong><strong></strong>が、子どもっぽい行動してしまった。</a> <br/>\n<strong>I intended to </strong>\nbecome  an adult by myself, but finally I acted the childish way."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6850
    position: 4
    japanese: 優しく言ったつもりだったが、「それをしなさい！」と聞こえてしまった。
    body_text: "優しく言ったつもりだったが、「それをしなさい！」と聞こえてしまった。 \n\nI intended to \ntell it  gently, but finally I have been heard \"Do it!\" (in an imperative way)."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ優しく言ったつもりだった\">\n\t\t\t\t優しく言った<strong>つもりだった</strong><strong></strong>が、「それをしなさい！」と聞こえてしまった。</a> <br/>\n<strong>I intended to </strong>\ntell it  gently, but finally I have been heard \"Do it!\" (in an imperative way)."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6851
    position: 5
    japanese: 自分では元気になったつもりだったが、またどこか痛くなってしまった。
    body_text: "自分では元気になったつもりだったが、またどこか痛くなってしまった。 \n\nI intended to \nrecover my strength  by myself, but finally I felt painful somewhere again."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ自分では元気になったつもりだった\">\n\t\t\t\t自分では元気になった<strong>つもりだった</strong><strong></strong>が、またどこか痛くなってしまった。</a> <br/>\n<strong>I intended to </strong>\nrecover my strength  by myself, but finally I felt painful somewhere again."
