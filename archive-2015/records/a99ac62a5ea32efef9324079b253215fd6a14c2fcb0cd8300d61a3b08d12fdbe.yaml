    credits_raw: Kanemiya
    text: "ex #\x01 \"He gave me what little money he had on him.\" \n\n\n\r\nex #\x01 \"Even though he didn't have much he gave me all that he had\" or\"Even though he didn't have much  he gave it all to me\" \n\n\n\r\nex #\x01 \"Even though a woman she fought bravely\" or \"Even though she was only a woman she fought bravely\"\n\n\n\r\nex #\x01 \"Even though he was only a child he was brave\" or \"He was brave even though only a child.\"\n\n\n\r\nThese sound more natural to me."
