    japanese: 彼女は少ないながらも持っていた全ての硬貨をそのものもらいに与えました。
    body_text: "彼女は少ないながらも持っていた全ての硬貨をそのものもらいに与えました。\r \n\n\t\tShe gave what few coins she has to the beggar."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼女は少ないながらも持っていた全ての硬貨をそのものもらいに与えました。\">\n\t\t\t\t彼女は少ない<strong>ながらも</strong>持っていた全ての硬貨をそのものもらいに与えました。\r<strong></strong></a> <br/>\n\t\tShe gave what few coins she has to the beggar. \n\t\t<strong> </strong>"
    credits_raw: dbx
