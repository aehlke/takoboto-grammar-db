    japanese: 幼いながらも、その子供は勇敢だった。
    body_text: "幼いながらも、その子供は勇敢だった。 \n\n\t\tChild \n\t\tas he was \n\t\t, he was brave."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ幼いながらも、その子供は勇敢だった。\">\n\t\t\t\t幼い<strong>ながらも</strong>、その子供は勇敢だった。<strong></strong></a> <br/>\n\t\tChild \n\t\t<strong>as he was </strong>\n\t\t, he was brave."
