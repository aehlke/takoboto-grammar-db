      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3786
    position: 7
    japanese: 彼女は不本意ながらもそうした。
    body_text: "彼女は不本意ながらもそうした。 \n\n\t\tShe did it \n\t\tagainst \n\t\ther will."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼女は不本意ながらもそうした。\">\n\t\t\t\t彼女は不本意<strong>ながらも</strong>そうした。<strong></strong></a> <br/>\n\t\tShe did it \n\t\t<strong>against </strong>\n\t\ther will."
    credits_raw: dbx
