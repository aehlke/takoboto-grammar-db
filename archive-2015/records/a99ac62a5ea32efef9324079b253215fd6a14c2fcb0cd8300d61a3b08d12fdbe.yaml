    japanese: その職人は古い伝説を守りながらも、新しい工夫を重ねている
    body_text: "その職人は古い伝説を守りながらも、新しい工夫を重ねている \n\nAlthough \n\t\tthat craftsman preserves the old traditions, he is also building up new methods."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJその職人は古い伝説を守りながらも、新しい工夫を重ねている\">\n\t\t\t\tその職人は古い伝説を守り<strong>ながらも</strong>、新しい工夫を重ねている<strong></strong></a> <br/>\n<strong>Although </strong>\n\t\tthat craftsman preserves the old traditions, he is also building up new methods."
