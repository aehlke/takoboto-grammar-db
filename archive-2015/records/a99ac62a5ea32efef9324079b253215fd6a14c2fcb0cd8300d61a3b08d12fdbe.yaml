    japanese: 少し悪いと思いながらも、彼は笑うのを抑えることはできなかった。
    body_text: "少し悪いと思いながらも、彼は笑うのを抑えることはできなかった。\r \n\n\t\tHe could not refrain from smiling, though with a slight sense of guilt."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ少し悪いと思いながらも、彼は笑うのを抑えることはできなかった。\">\n\t\t\t\t少し悪いと思い<strong>ながらも</strong>、彼は笑うのを抑えることはできなかった。\r<strong></strong></a> <br/>\n\t\tHe could not refrain from smiling, though with a slight sense of guilt. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3776
    position: 1
    japanese: 彼は、結婚するためにイランに帰るかもしれないと言いながらも、日本から帰った後の彼の計画は依然としてめどが立っていない。
    body_text: "彼は、結婚するためにイランに帰るかもしれないと言いながらも、日本から帰った後の彼の計画は依然としてめどが立っていない。\r \n\n\t\tAlthough he says he might return to Iran to marry, his plans after Japan are up in the air."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は、結婚するためにイランに帰るかもしれないと言いながらも、日本から帰った後の彼の計画は依然としてめどが立っていない。\">\n\t\t\t\t彼は、結婚するためにイランに帰るかもしれないと言い<strong>ながらも</strong>、日本から帰った後の彼の計画は依然としてめどが立っていない。\r<strong></strong></a> <br/>\n\t\tAlthough he says he might return to Iran to marry, his plans after Japan are up in the air. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3777
    position: 2
    japanese: 彼は少ないながらも持ち合わせていた金を全部私にくれた。
    body_text: "彼は少ないながらも持ち合わせていた金を全部私にくれた。 \n\n\t\tHe gave me what little money he had about him."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は少ないながらも持ち合わせていた金を全部私にくれた。\">\n\t\t\t\t彼は少ない<strong>ながらも</strong>持ち合わせていた金を全部私にくれた。<strong></strong></a> <br/>\n\t\tHe gave me what little money he had about him. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3779
    position: 3
    japanese: トムは元気を取り戻した。そして、やっぱり、大晦日にはびっこを引きながらもパーティーに参加できた。
    body_text: "トムは元気を取り戻した。そして、やっぱり、大晦日にはびっこを引きながらもパーティーに参加できた。\r \n\n\t\tTom took heart and, sure enough, on New Year's Eve he was able to hobble along to a party."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJトムは元気を取り戻した。そして、やっぱり、大晦日にはびっこを引きながらもパーティーに参加できた。\">\n\t\t\t\tトムは元気を取り戻した。そして、やっぱり、大晦日にはびっこを引き<strong>ながらも</strong>パーティーに参加できた。\r<strong></strong></a> <br/>\n\t\tTom took heart and, sure enough, on New Year's Eve he was able to hobble along to a party. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3783
    position: 4
    japanese: 彼は少ないながらも彼の持ち物すべてを私にくれた。
    body_text: "彼は少ないながらも彼の持ち物すべてを私にくれた。 \n\nNotwithstanding \n\t\tthe small amount he did have, he gave me all that he had"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は少ないながらも彼の持ち物すべてを私にくれた。\">\n\t\t\t\t彼は少ない<strong>ながらも</strong>彼の持ち物すべてを私にくれた。<strong></strong></a> <br/>\n<strong>Notwithstanding </strong>\n\t\tthe small amount he did have, he gave me all that he had"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3784
    position: 5
    japanese: 彼女は女ながらも勇敢に戦った。
    body_text: "彼女は女ながらも勇敢に戦った。\r \n\n\t\tWoman as she was, she fought bravely."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼女は女ながらも勇敢に戦った。\">\n\t\t\t\t彼女は女<strong>ながらも</strong>勇敢に戦った。\r<strong></strong></a> <br/>\n\t\tWoman as she was, she fought bravely. \n\t\t<strong> </strong>"
    credits_raw: dbx
