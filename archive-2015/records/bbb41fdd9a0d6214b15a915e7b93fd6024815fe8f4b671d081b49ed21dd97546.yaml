    text: "I think there is a contradiction in the sentence 'あいつが来ないのは何か後ろめたいことがあるということだ'\n\n\n\r\nFor 'to iu no ha....to iu koto da' the explanation goes as follows: is meant to give a defintion, explanation, or interpretion of a word, phrase, or sentence\n\n\n\r\nThe above sentence is unrelated to any definition or interpretation of words or sentences, but rather an interpretation of a fact or action. So according to the explanation in point (2)　being: to provide an interpretation of a fact (or something nearly factual), the correct phrase would be あいつが来ないことは何か後ろめたいことがあるということだ'\n\n\n\r\nBecause we're not interpreting words, but something factual.\n\r\nどう思いますか？"
    html: "I think there is a contradiction in the sentence 'あいつが来ないのは何か後ろめたいことがあるということだ'<br/>\n<br/>\r\nFor 'to iu no ha....to iu koto da' the explanation goes as follows: is meant to give a defintion, explanation, or interpretion of a word, phrase, or sentence<br/>\n<br/>\r\nThe above sentence is unrelated to any definition or interpretation of words or sentences, but rather an interpretation of a fact or action. So according to the explanation in point (2)　being: to provide an interpretation of a fact (or something nearly factual), the correct phrase would be あいつが来ないことは何か後ろめたいことがあるということだ'<br/>\n<br/>\r\nBecause we're not interpreting words, but something factual.<br/>\r\nどう思いますか？"
    source_id: null
