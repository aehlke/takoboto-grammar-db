notes:
  - position: 0
    text: "This has two meanings\n\r\n1. something I heard:\n\r\n新聞によると、また地下鉄の運賃が値上げされるとういうことだ。\n\r\nI heard (read!) from the newspaper that subway fares will increase again.\n\n\n\r\n2. it means that, as mentioned here \n\n\n\r\n(thanks Brett)"
    html: "This has two meanings<br/>\r\n1. something I heard:<br/>\r\n新聞によると、また地下鉄の運賃が値上げされるとういうことだ。<br/>\r\nI heard (read!) from the newspaper that subway fares will increase again.<br/>\n<br/>\r\n2. it means that, as mentioned here <br/>\n<br/>\r\n(thanks Brett)"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "dc is correct.\n\n\n\r\nということだ(1): \"It seems that〜\" (something heard or read).\n\r\nFORMATION:\n\r\nＶ(plain form) + ということだ\n\r\nいＡ + ということだ\n\r\nなＡ・Ｎ + (だ) + ということだ\n\n\n\r\nということだ(2): \"The fact that 〜 means 〜\" (in other words; that is to say; in short)\n\r\nFORMATION (same as above):\n\r\nＶ(plain form) + ということだ\n\r\nいＡ + ということだ\n\r\nなＡ・Ｎ + (だ) + ということだ"
    html: "dc is correct.<br/>\n<br/>\r\nということだ(1): \"It seems that〜\" (something heard or read).<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + ということだ<br/>\r\nいＡ + ということだ<br/>\r\nなＡ・Ｎ + (だ) + ということだ<br/>\n<br/>\r\nということだ(2): \"The fact that 〜 means 〜\" (in other words; that is to say; in short)<br/>\r\nFORMATION (same as above):<br/>\r\nＶ(plain form) + ということだ<br/>\r\nいＡ + ということだ<br/>\r\nなＡ・Ｎ + (だ) + ということだ"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "＊Be careful!\n\r\nThere is a difference between (1) 〜というのは、〜ということだ　and (2) 〜ということは、〜ということだ.\n\n\n\r\n(1) is meant to give a defintion, explanation, or interpretion of a word, phrase, or sentence.\n\r\n(2) is meant to provide an interpretation of a fact (or something nearly factual)."
    html: "＊Be careful!<br/>\r\nThere is a difference between (1) 〜というのは、〜ということだ　and (2) 〜ということは、〜ということだ.<br/>\n<br/>\r\n(1) is meant to give a defintion, explanation, or interpretion of a word, phrase, or sentence.<br/>\r\n(2) is meant to provide an interpretation of a fact (or something nearly factual)."
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
