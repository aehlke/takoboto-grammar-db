  - position: 1
    text: |-
      Whereas [noni / のに] is neutral in use, kuseni / くせに is used when expressing annoyance, criticism, or anger. Also, [ni mo kakawarazu / にもかかわらず] expresses a similar idea, but it is a highly formal and bookish expression with no emotion. It cannot be used in highly emotive situations.
    html: |-
      Whereas [noni / のに] is neutral in use, kuseni / くせに is used when expressing annoyance, criticism, or anger. Also, [ni mo kakawarazu / にもかかわらず] expresses a similar idea, but it is a highly formal and bookish expression with no emotion. It cannot be used in highly emotive situations.
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "[kuseni / くせに] cannot be used in the first person. Also, the main clause and the subordinate clause must share the same subject. The following two sentences are INGRAMMATICAL:\n\r\n1. 良子はまだ学生のくせに両親は彼女に高いマンションを買ってやった。(Although Yoshiko is still a student, her parents have bought her an expensive condominium.)\n\r\nCHANGE TO -->良子はまだ学生[なのに / にもかかわらず]両親は彼女に高いマンションを買ってやった。\n\n\n\r\n2. 私は日本人のくせに日本の国家が歌えない。(Though I am Japanese, I cannot sing the Japanese national anthem.)\n\r\nCHANGE TO --> 私は日本人[なのに / にもかかわらず]日本の国家が歌えない。"
    html: "[kuseni / くせに] cannot be used in the first person. Also, the main clause and the subordinate clause must share the same subject. The following two sentences are INGRAMMATICAL:<br/>\r\n1. 良子はまだ学生のくせに両親は彼女に高いマンションを買ってやった。(Although Yoshiko is still a student, her parents have bought her an expensive condominium.)<br/>\r\nCHANGE TO --&gt;良子はまだ学生[なのに / にもかかわらず]両親は彼女に高いマンションを買ってやった。<br/>\n<br/>\r\n2. 私は日本人のくせに日本の国家が歌えない。(Though I am Japanese, I cannot sing the Japanese national anthem.)<br/>\r\nCHANGE TO --&gt; 私は日本人[なのに / にもかかわらず]日本の国家が歌えない。"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    text: くせに, unlike the more neutral のに,　expresses the speaker's feeling of displeasure, disgust or contempt.
    html: くせに, unlike the more neutral のに,　expresses the speaker's feeling of displeasure, disgust or contempt.
