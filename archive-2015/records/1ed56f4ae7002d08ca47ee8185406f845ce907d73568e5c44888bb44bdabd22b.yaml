    html: "adj + kuseni<br/>\r\n高いくせに            <br/>\n<br/>\r\nV-plain kuseni<br/>\r\n知っているくせに      <br/>\n<br/>\r\nnoun + &lt;b&gt;no&lt;/b&gt; kuseni<br/>\r\n日本人のくせに"
