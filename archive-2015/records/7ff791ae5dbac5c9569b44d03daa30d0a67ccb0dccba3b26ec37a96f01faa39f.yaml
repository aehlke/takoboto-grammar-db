    japanese: 試合の結果はともかく,最後までみんなよくがんばった。
    body_text: "試合の結果はともかく,最後までみんなよくがんばった。 \n\nNo matter what \n\t\tthe result was, every one has done their best."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ試合の結果はともかく,最後までみんなよくがんばった。\">\n\t\t\t\t試合の結果は<strong>ともかく,</strong>最後までみんなよくがんばった。<strong></strong></a> <br/>\n<strong>No matter what </strong>\n\t\tthe result was, every one has done their best."
    credits_raw: sureshnihon
