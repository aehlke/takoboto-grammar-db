    japanese: "彼女の作ったケーキは、\r\nともかく見た目は味は大変いい。"
    body_text: "彼女の作ったケーキは、\r\nともかく見た目は味は大変いい。 \n\n\t\tThe cake she made is delicious, \n\t\tregardless \n\t\tof what it may look like."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼女の作ったケーキは、ともかく見た目は味は大変いい。\">\n\t\t\t\t彼女の作ったケーキは、\r\n<strong>ともかく</strong>見た目は味は大変いい。<strong></strong></a> <br/>\n\t\tThe cake she made is delicious, \n\t\t<strong>regardless </strong>\n\t\tof what it may look like."
