    japanese: 彼が犯人だと断定できないまでも、いろいろと怪しいところがある
    body_text: "彼が犯人だと断定できないまでも、いろいろと怪しいところがある\r \n\n\t\tEven though we can't conclude he's the culprit, he has many suspicious points"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼が犯人だと断定できないまでも、いろいろと怪しいところがある\">\n\t\t\t\t彼が犯人だと断定でき<strong>ないまでも</strong>、いろいろと怪しいところがある\r<strong></strong></a> <br/>\n\t\tEven though we can't conclude he's the culprit, he has many suspicious points \n\t\t<strong> </strong>"
