    body_text: "この公演は大成功とは言えないまでも、それなりの成果をもたらした。 \n\nAlthough you may not be able to \n\t\tcall this public performance a great success, it produced results of a sort."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの公演は大成功とは言えないまでも、それなりの成果をもたらした。\">\n\t\t\t\tこの公演は大成功とは言え<strong>ないまでも</strong>、それなりの成果をもたらした。<strong></strong></a> <br/>\n<strong>Although you may not be able to </strong>\n\t\tcall this public performance a great success, it produced results of a sort."
