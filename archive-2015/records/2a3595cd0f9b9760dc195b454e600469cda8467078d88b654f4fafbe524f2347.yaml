  - source_id: 7931
    position: 3
    japanese: この彫刻は完璧とは言えないまでも、非常に可柏ｫを感じさせる作品だった。
    body_text: "この彫刻は完璧とは言えないまでも、非常に可柏ｫを感じさせる作品だった。\r \n\n\t\tThe sculpture may not be called a perfect work, but it is a work that makes you feel there is much potential."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの彫刻は完璧とは言えないまでも、非常に可柏ｫを感じさせる作品だった。\">\n\t\t\t\tこの彫刻は完璧とは言え<strong>ないまでも</strong>、非常に可柏ｫを感じさせる作品だった。\r<strong></strong></a> <br/>\n\t\tThe sculpture may not be called a perfect work, but it is a work that makes you feel there is much potential. \n\t\t<strong> </strong>"
