    credits_raw: leslie
    text: 「であろうと」は書き方ので、「だろうと」を話せるんですか？それとも他の阜ｻを使う？
    html: |-
      「であろうと」は書き方ので、「だろうと」を話せるんですか？それとも他の阜ｻを使う？<br/>
      <br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: |-
      「であろうと」and 「だろうと」are both ok in writing and speaking. 書く時も話す時にも、両方使えます。だろうと is usually used in speaking and であろうと sounds with a self-important air, I feel. 重々しい響きがある。
    html: |-
      「であろうと」and 「だろうと」are both ok in writing and speaking. 書く時も話す時にも、両方使えます。だろうと is usually used in speaking and であろうと sounds with a self-important air, I feel. 重々しい響きがある。
