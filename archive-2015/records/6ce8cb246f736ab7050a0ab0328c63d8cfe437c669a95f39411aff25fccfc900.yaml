notes:
  - position: 0
    text: "For most verbs that end in iru/eru (except for a few verbs I mean), remove the <b>ru</b> and add dearou. \n\r\nFor other verbs that end in, ru (exceptional verbs are in this group), tsu, u ku, gu, mu, and bu, change the last syllable to the <b>i</b> section of it (as in ru = ri, tsu = chi, u = i, etc.). For example...\n\r\ntaberu = tabedearou\n\r\nmiru = midearou\n\r\nkaeru* = kaeridearou (one of the exceptional verbs)\n\r\nnugu = nugidearou"
    html: "For most verbs that end in iru/eru (except for a few verbs I mean), remove the &lt;b&gt;ru&lt;/b&gt; and add dearou. <br/>\r\nFor other verbs that end in, ru (exceptional verbs are in this group), tsu, u ku, gu, mu, and bu, change the last syllable to the &lt;b&gt;i&lt;/b&gt; section of it (as in ru = ri, tsu = chi, u = i, etc.). For example...<br/>\r\ntaberu = tabedearou<br/>\r\nmiru = midearou<br/>\r\nkaeru* = kaeridearou (one of the exceptional verbs)<br/>\r\nnugu = nugidearou"
