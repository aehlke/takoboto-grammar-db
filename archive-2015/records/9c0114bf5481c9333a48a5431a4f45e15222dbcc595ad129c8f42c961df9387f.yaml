  - position: 5
    credits_raw: Miki
    text: "#\x01#\x01 Japanese is not natural. \n\r\nこの質問に答えるとしたら、  　何をもらうのですか？\n\r\nこの質問に答えたら、　　　　　何が貰えますか？"
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=toshitara,%20tosureba,%20tosuruto#\x01\">#\x01</a></b><b><a href=\"http://jgram.org/pages/viewOne.php?tagE=toshitara,%20tosureba,%20tosuruto#\x01\">#\x01</a></b> Japanese is not natural. <br/>\r\nこの質問に答えるとしたら、  　何をもらうのですか？<br/>\r\nこの質問に答えたら、　　　　　何が貰えますか？"
    source_id: null
