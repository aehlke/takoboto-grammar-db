    original_updated_at: null
  - position: 6
    credits_raw: adamstudio
    text: |-
      Is this actually how to use a subjunctive mood in Japanese? I wasn't sure if such thing existed. For example, "If I had been born rich, my life would be better." or "If I were President, I would feed the hungry." -- Both meaning "X is not true, but if it were, then I think Y would happen." The emphasis is on the requirement that "X is not true." Does this nuance come through in the Japanese?
    html: |-
      Is this actually how to use a subjunctive mood in Japanese? I wasn't sure if such thing existed. For example, "If I had been born rich, my life would be better." or "If I were President, I would feed the hungry." -- Both meaning "X is not true, but if it were, then I think Y would happen." The emphasis is on the requirement that "X is not true." Does this nuance come through in the Japanese?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: bamboo4
    text: |-
      金持ちに生まれていたら生活がもっと豊かだったろうに or 大統領であるとしたら、飢えた人々を救済したであろうに - both of these examples satisfy the supposition " that X is not true" but if it were, then Y would have happened.
    html: |-
      金持ちに生まれていたら生活がもっと豊かだったろうに or 大統領であるとしたら、飢えた人々を救済したであろうに - both of these examples satisfy the supposition " that X is not true" but if it were, then Y would have happened.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: KWhazit
    text: "I think of this as more of an \"assuming that...\" or \"if we assume...\" construct. It's basically saying, this might not be correct (or might not happen), but what if it is (or does)? \n\n\n\r\nFor example:\n\r\n 本当だとしたら、どうするの？\n\r\n Assuming it's true, what do we do then?"
    html: "I think of this as more of an \"assuming that...\" or \"if we assume...\" construct. It's basically saying, this might not be correct (or might not happen), but what if it is (or does)? <br/>\n<br/>\r\nFor example:<br/>\r\n 本当だとしたら、どうするの？<br/>\r\n Assuming it's true, what do we do then?"
