    credits_raw: Snake
    text: ’温泉に行った’らはどうですかな?
    html: |-
      ’温泉に行った’らはどうですかな?<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "温泉に行ったらどこがいいでしょうね。hmm not natural.\n\r\n温泉に行くならば can be replaced.\n\r\n温泉と言ったら、どこがいいでしょうかね。means quite similar.\n\r\nWhen it comes to Onsen, where would be good. かな？？"
    html: "温泉に行ったらどこがいいでしょうね。hmm not natural.<br/>\r\n温泉に行くならば can be replaced.<br/>\r\n温泉と言ったら、どこがいいでしょうかね。means quite similar.<br/>\r\nWhen it comes to Onsen, where would be good. かな？？"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: |-
      The example of zero is most natural. Otehr suggestions are not as good.温泉に行ったらどこがいいでしょうね is simply unacceptable."When it comes to Onsen, where would you suggest?" would sound natural in English.
    html: |-
      The example of zero is most natural. Otehr suggestions are not as good.温泉に行ったらどこがいいでしょうね is simply unacceptable."When it comes to Onsen, where would you suggest?" would sound natural in English.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: |-
      Not as good? You shouldn't say so as we use them except 温泉に行ったら even if you use only what you call the most natural one. 心外なご意見です。（・＿・）
