    annotation_text: "tari suru form    (-し is usually used for phrases that describes your subject. for example you can say that you like a certain singer because he has a good voice, nice attitude and he is handsome. you end the sentence with a conclusion that you like the singer, and enumerate the reasons by using し.\n\r\n〜たり is used for a sequence of verbs: eating, drinking and fooling around.) [dc]"
