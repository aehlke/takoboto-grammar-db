    text: "Is there a rule or principle about when to use だ　in a し、、し、、construction? It seems to overlap with な adjectives. For example:\n\n\n\r\nこのカメラは軽いし、使い方も簡単だし、それに安いです。\n\n\n\r\n... but also with temporal nouns as in:\n\n\n\r\nすずき先生は、はじめだし、熱心な先生です。\n\n\n\r\nThoughts about a principle?"
