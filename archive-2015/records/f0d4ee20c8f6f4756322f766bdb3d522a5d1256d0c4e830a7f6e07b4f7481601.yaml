    japanese: お返事をお待ちしております。またお返事をいただくことにより、私どもはより効率よく会議の準備をすることができます。
    body_text: "お返事をお待ちしております。またお返事をいただくことにより、私どもはより効率よく会議の準備をすることができます。 \n\n\t\tYour response is greatly appreciated and will enable us to prepare more efficiently."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJお返事をお待ちしております。またお返事をいただくことにより、私どもはより効率よく会議の準備をすることができます。\">\n\t\t\t\tお返事をお待ちしております。またお返事を<strong>いただく</strong>ことにより、私どもはより効率よく会議の準備をすることができます。<strong></strong></a> <br/>\n\t\tYour response is greatly appreciated and will enable us to prepare more efficiently. \n\t\t<strong> </strong>"
