    japanese: あなたの許可を頂くべきだったでしょうか。
    body_text: "あなたの許可を頂くべきだったでしょうか。 \n\n\t\tShould I have asked your permission?"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたの許可を頂くべきだったでしょうか。\">\n\t\t\t\tあなたの許可を<strong>頂く</strong>べきだったでしょうか。<strong></strong></a> <br/>\n\t\tShould I have asked your permission? \n\t\t<strong> </strong>"
