    japanese: 研究社員になる希望に反して大学を止めらなければなりませんでした。
    body_text: "研究社員になる希望に反して大学を止めらなければなりませんでした。  \n\n\t\tI had to drop out of university \n\t\tagainst \n\t\tmy aspirations of becoming a scientist."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ研究社員になる希望に反して大学を止めらなければなりませんでした。 \">\n\t\t\t\t研究社員になる希望<strong>に反して</strong>大学を止めらなければなりませんでした。 <strong></strong></a> <br/>\n\t\tI had to drop out of university \n\t\t<strong>against </strong>\n\t\tmy aspirations of becoming a scientist."
