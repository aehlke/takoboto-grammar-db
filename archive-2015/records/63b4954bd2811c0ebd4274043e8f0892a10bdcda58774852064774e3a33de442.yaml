    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJその結果は私の期待に反していた。\">\n\t\t\t\tその結果は私の期待<strong>に反して</strong>いた。\r<strong></strong></a> <br/>\n\t\tThe result was contrary to my expectation. \n\t\t<strong> </strong>"
