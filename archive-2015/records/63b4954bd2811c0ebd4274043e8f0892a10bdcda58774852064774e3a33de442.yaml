    original_updated_at: null
  - source_id: 5825
    position: 5
    japanese: この結果は、当初の期待に反して、変数の数が処理速度に影響を与えないということを意味しているのである。
    body_text: "この結果は、当初の期待に反して、変数の数が処理速度に影響を与えないということを意味しているのである。  \n\n\t\tThis result means, \n\t\tcontrary to \n\t\tprior expectations, that the number of variants does not affect the processing speed."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの結果は、当初の期待に反して、変数の数が処理速度に影響を与えないということを意味しているのである。 \">\n\t\t\t\tこの結果は、当初の期待<strong>に反して</strong>、変数の数が処理速度に影響を与えないということを意味しているのである。 <strong></strong></a> <br/>\n\t\tThis result means, \n\t\t<strong>contrary to </strong>\n\t\tprior expectations, that the number of variants does not affect the processing speed."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
