    japanese: （僕の期待に反して）実のところ物価は毎週上昇している。
    body_text: "（僕の期待に反して）実のところ物価は毎週上昇している。  \n\n\t\t( \n\t\tAgainst \n\t\tmy expectations) prices are going up every week.（M)"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ（僕の期待に反して）実のところ物価は毎週上昇している。 \">\n\t\t\t\t（僕の期待<strong>に反して</strong>）実のところ物価は毎週上昇している。 <strong></strong></a> <br/>\n\t\t( \n\t\t<strong>Against </strong>\n\t\tmy expectations) prices are going up every week.（M)"
