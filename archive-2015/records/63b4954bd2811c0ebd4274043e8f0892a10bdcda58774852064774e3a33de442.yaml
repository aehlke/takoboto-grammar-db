    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ神の意向に反して人間は自然を破壊している。\">\n\t\t\t\t神の意向<strong>に反して</strong>人間は自然を破壊している。<strong></strong></a> <br/>\n<strong>Contrary to </strong>\n\t\tGod's will, humans are destroying nature."
