  - source_id: 2943
    position: 1
    japanese: 国民の期待に反して政府は年金制度改正法案の強行採決に踏み切った。
    body_text: "国民の期待に反して政府は年金制度改正法案の強行採決に踏み切った。 \n\nContrary to \n\t\tthe peoples expectations, the government bulldozed the pension system revision bill through the Diet."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ国民の期待に反して政府は年金制度改正法案の強行採決に踏み切った。\">\n国民の期待に<strong>反して</strong>政府は年金制度改正法案の強行採決に踏み切った。<strong></strong></a> <br/>\n<strong>Contrary to </strong>\n\t\tthe peoples expectations, the government bulldozed the pension system revision bill through the Diet."
