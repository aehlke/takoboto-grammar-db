    body_text: "誕生と死との間を享楽する以外には、この両者に対して回復の手の施しようがない。\r \n\n\t\tThere is no cure for birth and death save to enjoy the interval."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ誕生と死との間を享楽する以外には、この両者に対して回復の手の施しようがない。\">\n\t\t\t\t誕生と死との間を享楽する以外には、この両者に対して回復の手の施し<strong>ようがない</strong>。\r<strong></strong></a> <br/>\n\t\tThere is no cure for birth and death save to enjoy the interval. \n\t\t<strong> </strong>"
