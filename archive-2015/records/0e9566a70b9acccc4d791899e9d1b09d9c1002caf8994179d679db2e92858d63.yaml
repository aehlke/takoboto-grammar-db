notes:
  - position: 0
    text: |-
      used with the masu-stem + ようがない



      食べます →　食べようがない

      します　⇒　しようがない
    html: |-
      used with the masu-stem + ようがない<br/>
      <br/>
      <b>食べ</b>ます →　食べようがない<br/>
      <b>し</b>ます　⇒　しようがない
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "note that the word 用 (you) on its own means \"something to do\". As in \n\r\n　ようがある\n\r\n　i have to do some errands\n\n\n\r\nso that leads to this confusion:\n\n\n\r\n行く用がない = I have no *reason* to go there\n\r\n(Lit: I have nothing to do when i get there)\n\n\n\r\n行きようがない = I have no *way* to get there\n\n\n\r\n1) 連絡するようがない\n\r\n　　no business to contact them for\n\r\n2) 連絡しようがない\n\r\n　　no way to contact"
    html: "note that the word 用 (you) on its own means \"something to do\". As in <br/>\r\n　ようがある<br/>\r\n　i have to do some errands<br/>\n<br/>\r\nso that leads to this confusion:<br/>\n<br/>\r\n行く用がない = I have no *reason* to go there<br/>\r\n(Lit: I have nothing to do when i get there)<br/>\n<br/>\r\n行きようがない = I have no *way* to get there<br/>\n<br/>\r\n1) 連絡するようがない<br/>\r\n　　no business to contact them for<br/>\r\n2) 連絡しようがない<br/>\r\n　　no way to contact"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
