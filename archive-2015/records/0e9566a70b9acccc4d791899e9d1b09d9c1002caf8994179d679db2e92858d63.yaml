    body_text: "彼の発言は他に解釈のしようがない。  \n\n\t\tHis remarks allow of no other interpretation."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼の発言は他に解釈のしようがない。 \">\n\t\t\t\t彼の発言は他に解釈のし<strong>ようがない</strong>。 <strong></strong></a> <br/>\n\t\tHis remarks allow of no other interpretation. \n\t\t<strong> </strong>"
