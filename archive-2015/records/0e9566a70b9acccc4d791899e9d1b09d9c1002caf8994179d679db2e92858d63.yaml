    body_text: "質問の意味はわからなくて、答えようがなかった。 \n\n\t\tIf the meaning of the question is not understood, it can't be answered."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ質問の意味はわからなくて、答えようがなかった。\">\n\t\t\t\t質問の意味はわからなくて、答えようがなかった。<strong></strong><strong></strong></a> <br/>\n\t\tIf the meaning of the question is not understood, it can't be answered. \n\t\t<strong> </strong>"
