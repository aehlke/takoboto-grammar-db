    body_text: "このカメラ、ちょっと直しようがないですね。 \n\nThere is no way \nof fixing  this camera."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこのカメラ、ちょっと直しようがない\">\n\t\t\t\tこのカメラ、ちょっと直し<strong>ようがない</strong><strong></strong>ですね。</a> <br/>\n<strong>There is no way </strong>\nof fixing  this camera."
