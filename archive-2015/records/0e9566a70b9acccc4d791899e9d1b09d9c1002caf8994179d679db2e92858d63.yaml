    japanese: スプーンがないことに気がついた。これでは食べようがない。
    body_text: "スプーンがないことに気がついた。これでは食べようがない。 \n\n\t\tI realized I didnt have a spoon. So there was \n\t\tno way to \n\t\teat it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJスプーンがないことに気がついた。これでは食べようがない。\">\n\t\t\t\tスプーンがないことに気がついた。これでは食べ<strong>ようがない</strong>。<strong></strong></a> <br/>\n\t\tI realized I didnt have a spoon. So there was \n\t\t<strong>no way to </strong>\n\t\teat it."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3034
    position: 1
    japanese: 道は通行止めだし。これではそこへ行きようがない。
    body_text: "道は通行止めだし。これではそこへ行きようがない。 \n\n\t\tThe road is blocked. Such being the case, there is \n\t\tno way \n\t\twe can get there."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ道は通行止めだし。これではそこへ行きようがない。\">\n\t\t\t\t道は通行止めだし。これではそこへ行き<strong>ようがない</strong>。<strong></strong></a> <br/>\n\t\tThe road is blocked. Such being the case, there is \n\t\t<strong>no way </strong>\n\t\twe can get there."
