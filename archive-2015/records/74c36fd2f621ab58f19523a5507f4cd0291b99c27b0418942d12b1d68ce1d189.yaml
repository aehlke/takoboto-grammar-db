    text: |-
      に違いない ([にちがいない] )(nichigainai)
          Meaning: no mistake...definitely 確かに　と　おもう
          Example: I've not got my keys, I definitely (lit. make no mistake) I dropped them somewhere
          JLPT Level: 2
          Category: grammar
          Author: alexeiS
