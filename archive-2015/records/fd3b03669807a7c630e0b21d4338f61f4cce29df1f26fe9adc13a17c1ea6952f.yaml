    text: "The example for this grammar is strange Japanese.\n\n\n\r\n日本に行きました - I went to Japan\n\r\n三人の友達 - Three friends\n\n\n\r\nなぜなら is used to explain the reason why a certain action was talken. It is often used in speeches and lectures and almost always paired with 〜からだ。"
