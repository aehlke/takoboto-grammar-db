    body_text: "チェンさんは日本語が苦手だ。テストではいつも半分も出来ない。だからといって、頭が悪いわけではない。\r \n\n\t\tMr. Cheng is not good at Japanese. On a test he cannot even finish half of it. But it doesn't follow from this that he is not smart."
