  - position: 7
    credits_raw: tigert
    text: "nefertitiさん　Your right about the meaning of 2I made sure to do\" or \"I will make sure to do\"\n\n\n\r\nI use it a lot when I want to say, \"You can  count on it\" or \" You can bet I`ll get it done\"\n\n\n\r\nBamboo4さん, I`m not sure why you think the use of \"in advanced\" meaning is very limited, I hear it used all the time. 買っておく、調べておく､聞いておく、etc... from my experiance, it seems to be a case of whether the context is past or future. \n\n\n\r\ninfinite_trialさん 何?　ままに?　そのままの　ままにですか?　I think that to use ままに one needs to have a discription before it. \n\n\n\r\nI.E. そのままに\n\r\n     You are pointing to something or talking about something that both listener and speaker are familiar with.\n\r\n     若まま\n\r\n　　　\"so young\" or \"foolish\"\n\r\nI have also heard it used to mean selfish, but I`m not sure if its the same 漢字\n\r\n　　　壊したままに\n\r\n　　　　\"broken\"\n\n\n\r\nIts possible to use this with full sentences, adjectives, etc.. I`m not 100% on the conj rules, but it seems to be used mostly with the past tense."
    html: "nefertitiさん　Your right about the meaning of 2I made sure to do\" or \"I will make sure to do\"<br/>\n<br/>\r\nI use it a lot when I want to say, \"You can  count on it\" or \" You can bet I`ll get it done\"<br/>\n<br/>\r\nBamboo4さん, I`m not sure why you think the use of \"in advanced\" meaning is very limited, I hear it used all the time. 買っておく、調べておく､聞いておく、etc... from my experiance, it seems to be a case of whether the context is past or future. <br/>\n<br/>\r\ninfinite_trialさん 何?　ままに?　そのままの　ままにですか?　I think that to use ままに one needs to have a discription before it. <br/>\n<br/>\r\nI.E. そのままに<br/>\r\n     You are pointing to something or talking about something that both listener and speaker are familiar with.<br/>\r\n     若まま<br/>\r\n　　　\"so young\" or \"foolish\"<br/>\r\nI have also heard it used to mean selfish, but I`m not sure if its the same 漢字<br/>\r\n　　　壊したままに<br/>\r\n　　　　\"broken\"<br/>\n<br/>\r\nIts possible to use this with full sentences, adjectives, etc.. I`m not 100% on the conj rules, but it seems to be used mostly with the past tense. <br/>\n<br/>\n<br/>\n<br/>"
    source_id: null
