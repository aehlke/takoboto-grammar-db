  - position: 2
    credits_raw: nefertiti
    text: "It seems like 'in advance' is just relative to the time you are speaking to someone. (Before I spoke to you I did X). In that case how is it different from just using \"mae ni\" or \"sakihodo\"? For example\n\r\n前に会議の準備をしました ?\n\n\n\r\nOn the other hand, it seems like it can also mean \"made sure to do\" especially when reading example 4322 - 4325? Any help understanding this better would be appreciated."
    html: "It seems like 'in advance' is just relative to the time you are speaking to someone. (Before I spoke to you I did X). In that case how is it different from just using \"mae ni\" or \"sakihodo\"? For example<br/>\r\n前に会議の準備をしました ?<br/>\n<br/>\r\nOn the other hand, it seems like it can also mean \"made sure to do\" especially when reading example 4322 - 4325? Any help understanding this better would be appreciated.<br/>\n<br/>"
    source_id: null
