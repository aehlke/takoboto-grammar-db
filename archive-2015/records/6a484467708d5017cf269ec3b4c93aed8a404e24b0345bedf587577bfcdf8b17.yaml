  - position: 3
    credits_raw: bamboo4
    text: |-
      おく has the primary meaning of "leave it where it is at" or "leave it at its present status." The use of おく as indicating "in advance" is very limited such as 耳に入れておく. Most of the examples shown here are "leave it where it is at" type, and only 3303, 4327 and 4328 would qualify as statements in "in advance" category.For other examples, it is incorrect to label them as in "to do something in advance" category.
    html: |-
      おく has the primary meaning of "leave it where it is at" or "leave it at its present status." The use of おく as indicating "in advance" is very limited such as 耳に入れておく. Most of the examples shown here are "leave it where it is at" type, and only 3303, 4327 and 4328 would qualify as statements in "in advance" category.For other examples, it is incorrect to label them as in "to do something in advance" category.<br/>
      <br/>
