notes:
  - position: 0
    text: "\"oku\" and \"-te oku\" always has something expected in the future.\n\n\n\r\nThis is a AuxVerb and is used in by the patterm てーStem + おく\n\r\n1) To keep the action’s result.\n\r\n2) To continue the action.\n\r\n3) Admitting the situation is/will be a certain way and leaving it the way it is.\n\r\n4) To do something in advance, and expecting a certain result or happening.\n\r\n5) To doing something temporally to get by for the moment."
    html: "\"oku\" and \"-te oku\" always has something expected in the future.<br/>\n<br/>\r\nThis is a AuxVerb and is used in by the patterm てーStem + おく<br/>\r\n1) To keep the action’s result.<br/>\r\n2) To continue the action.<br/>\r\n3) Admitting the situation is/will be a certain way and leaving it the way it is.<br/>\r\n4) To do something in advance, and expecting a certain result or happening.<br/>\r\n5) To doing something temporally to get by for the moment."
    credits_raw: cup
