comments:
  - position: 0
    credits_raw: american57
    text: "I have my doubts about example 7888 because it is past tense and the proving has finished. So, I think \"yue ni\" cannot be used here.  However, if the predicate were \"yuuzai hanketsu ni natta\" or \"yuuzai de aru\" (\"is a guilty verdict\" or \"is guilty\"), it may be grammatical.\n\n\n\r\nThe second clause cannot be a completed action, per Dictionary of Advanced Japanese Grammar p.747. Examples 7889 and 7890 are copied from that book verbatim and should be credited to it."
    html: "I have my doubts about example 7888 because it is past tense and the proving has finished. So, I think \"yue ni\" cannot be used here.  However, if the predicate were \"yuuzai hanketsu ni natta\" or \"yuuzai de aru\" (\"is a guilty verdict\" or \"is guilty\"), it may be grammatical.<br/>\n<br/>\r\nThe second clause cannot be a completed action, per Dictionary of Advanced Japanese Grammar p.747. Examples 7889 and 7890 are copied from that book verbatim and should be credited to it."
