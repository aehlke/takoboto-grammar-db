    japanese: 結果にこだわりすぎるがゆえに、小さなことに心を奪われることになる。
    body_text: "結果にこだわりすぎるがゆえに、小さなことに心を奪われることになる。 \n\nBecause \n\t\tyou want the end result to be perfect, you end up being distracted by the little things,"
