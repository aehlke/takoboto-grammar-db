    text: "is that 上 a \x01 or \x01 ? I guess from the example it is uede, which i thought was more \"upon\" than \"based on\" - ie implying a careful thought and conclusion. whereas \"based on\" is more like a conclusion is obvious, based on the information...  is there that same difference in japanese or are they the same?"
    html: "is that 上 a <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> or <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> ? I guess from the example it is uede, which i thought was more \"upon\" than \"based on\" - ie implying a careful thought and conclusion. whereas \"based on\" is more like a conclusion is obvious, based on the information...  is there that same difference in japanese or are they the same?"
    source_id: null
