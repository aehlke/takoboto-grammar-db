  - position: 1
    text: "Nan and Nani\n\n\n\r\nGenerally nan, or nani is used for which ever flows better.\n\r\nHowever, Nani is used when wanting to be more polite and formal.\n\r\nOther situations may require getting a feel for using nan versus nani, or memorization.\n\n\n\r\nIn general, if the following word begins with a syllable from the t, n, and d groups. Nan is used.\n\n\n\r\nCommon usages:\n\r\nNan is used before particles \x01/の, \x01/で and verb da/desu.\n\n\n\r\nNani is used Before \x01/か and \x01/に,\n\n\n\r\nIf nan was used before ka/か, it would sound like the word nanka, which means \"things like\" or \"something like that\" which is also considered rude.\n\r\nNanika is instead used. Both nanka and nanika mean \"something\", but nanika is polite.\n\n\n\r\nIf nan was used in the case of ni/に, it would produce nanni なんに. This　sounds similar to nannimo なんにも, which means \"nothing at all\". \n\r\nGenerally mo/も、to indicate nothing, or absence. This could confuse a listener, waiting for a \x01 to be uttered."
    html: "<b>Nan and Nani</b><br/>\n<br/>\r\nGenerally nan, or nani is used for which ever flows better.<br/>\r\nHowever, Nani is used when wanting to be more polite and formal.<br/>\r\nOther situations may require getting a feel for using nan versus nani, or memorization.<br/>\n<br/>\r\nIn general, if the following word begins with a syllable from the t, n, and d groups. Nan is used.<br/>\n<br/>\r\nCommon usages:<br/>\r\nNan is used before particles <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/の, <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/で and verb da/desu.<br/>\n<br/>\r\nNani is used Before <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/か and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>/に,<br/>\n<br/>\r\nIf nan was used before ka/か, it would sound like the word nanka, which means \"things like\" or \"something like that\" which is also considered rude.<br/>\r\nNanika is instead used. Both nanka and nanika mean \"something\", but nanika is polite.<br/>\n<br/>\r\nIf nan was used in the case of ni/に, it would produce nanni なんに. This　sounds similar to nannimo なんにも, which means \"nothing at all\". <br/>\r\nGenerally mo/も、to indicate nothing, or absence. This could confuse a listener, waiting for a <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> to be uttered.<br/>\n<br/>"
    credits_raw: Rinji_HalfElf
