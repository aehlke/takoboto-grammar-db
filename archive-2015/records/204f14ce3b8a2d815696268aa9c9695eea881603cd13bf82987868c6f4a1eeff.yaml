comments:
  - position: 0
    credits_raw: Amatuka
    text: Need to check up on the difference between みたい and よう usage.
    html: Need to check up on the difference between みたい and よう usage.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: |-
      Don't confuse みたい (seeming) with みたい (wanting to see).  The latter is the たい (tai) desirative form of みる (I'm not sure how 'seeming' みたい was derived)
    html: |-
      Don't confuse <b>みたい (seeming)</b> with <b>みたい (wanting to see)</b>.  The latter is the たい (<a href="http://jgram.org/pages/viewOne.php?tagE=tai">tai</a>) desirative form of みる (I'm not sure how 'seeming' みたい was derived)
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: '''seeming''みたい is a part of みたいだ, which is derived from 見たようだ according to 大辞林(daijirin).'
    html: '''seeming''みたい is a part of みたいだ, which is derived from 見たようだ according to 大辞林(daijirin).'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: nadine
    text: "The first time I came across みたい in that form (the example) I processed it from the literal meaning\n\r\n  \"I want to see that he has a cold\"　-> \n\r\n            \"I want to say he has a cold\"  ->\n\r\n                    (oh!) \"Seems like he has a cold\" . . .\n\r\nOk, it's a stretch but well these are the things you do when you have no one to ask."
    html: "The first time I came across みたい in that form (the example) I processed it from the literal meaning<br/>\r\n  \"I want to see that he has a cold\"　-&gt; <br/>\r\n            \"I want to say he has a cold\"  -&gt;<br/>\r\n                    (oh!) \"Seems like he has a cold\" . . .<br/>\r\nOk, it's a stretch but well these are the things you do when you have no one to ask.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: There are certain nuance changes in みたい as my added examples show.
    html: |-
      There are certain nuance changes in みたい as my added examples show.<br/>
