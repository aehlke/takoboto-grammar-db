  - position: 7
    credits_raw: Miki
    text: "yookoso, you are right. I didn't mind if this is grammar or not.\n\r\nAnyway, let's finish. English is correct. With RISK, how about this? 生物兵器テロについて、感染症の高い危険性がある。"
    html: "yookoso, you are right. I didn't mind if this is grammar or not.<br/>\r\nAnyway, let's finish. English is correct. With RISK, how about this? 生物兵器テロについて、感染症の高い危険性がある。"
    source_id: null
