    credits_raw: Miki
    text: "You can just say 可能性がある。Don't need to say how mcuh possibility there is.\n\r\n可能性が高い／低い。\n\r\n全く／ほとんど 可能性がない。可能性がなきにしもあらず。\n\r\nAnybody pls translate them."
    html: "You can just say 可能性がある。Don't need to say how mcuh possibility there is.<br/>\r\n可能性が高い／低い。<br/>\r\n全く／ほとんど 可能性がない。可能性がなきにしもあらず。<br/>\r\nAnybody pls translate them."
