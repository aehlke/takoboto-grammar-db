  - position: 8
    credits_raw: dc
    text: "i guess this isn't real grammar, but i find it a very often used _construct_, so put it in. I use it a lot (working in the realm of the near-possible)\n\r\nalso \n\r\n可能性がある (there is a possibilty that...)\n\r\nand\n\r\n可能です (is possible...)\n\r\nare two separate ways of using the phrase that took a while to get used to."
    html: "i guess this isn't real grammar, but i find it a very often used _construct_, so put it in. I use it a lot (working in the realm of the near-possible)<br/>\r\nalso <br/>\r\n可能性がある (there is a possibilty that...)<br/>\r\nand<br/>\r\n可能です (is possible...)<br/>\r\nare two separate ways of using the phrase that took a while to get used to."
    source_id: null
    original_created_at: null
    original_updated_at: null
