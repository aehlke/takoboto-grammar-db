  - position: 3
    credits_raw: Miki
    text: "As for the seconde example, if English is correct, Japanese word order is wrong.\n\r\n生物兵器テロの 可能性 が高い感染症について →\n\r\n高い感染症の可能性のある　生物兵器テロについて"
    html: "As for the seconde example, if English is correct, Japanese word order is wrong.<br/>\r\n生物兵器テロの 可能性 が高い感染症について →<br/>\r\n高い感染症の可能性のある　生物兵器テロについて"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Miki
    text: "If the Japanese correct, English would be...\n\r\nConcerning infection could be used by terrorist biological weapons. \n\r\nNot sure. Please correct the English."
    html: "If the Japanese correct, English would be...<br/>\r\nConcerning infection could be used by terrorist biological weapons. <br/>\r\nNot sure. Please correct the English."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: dadako
    text: "because the key word here is RISK, you'll still have to keep that in the sentance Miki:\n\r\n\"Concerning terrorist biological weapons, there's a high risk of infection.\" sounds very natural in English."
    html: "because the key word here is RISK, you'll still have to keep that in the sentance Miki:<br/>\r\n\"Concerning terrorist biological weapons, there's a high risk of infection.\" sounds very natural in English."
