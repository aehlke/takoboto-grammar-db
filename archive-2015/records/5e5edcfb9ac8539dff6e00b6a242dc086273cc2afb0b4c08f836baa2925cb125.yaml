  - position: 2
    credits_raw: bamboo4
    text: "ex #\x01   かれはかれのかみをブロンド染まった is weird. 彼は髪をブロンドに染めた is acceptable. 染まる is intransitive verb. 彼の髪はブロンドに染まった would be okay.\n\r\nかれはかれの is simply redundant for Japanese."
