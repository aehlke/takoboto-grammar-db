    position: 0
    japanese: "社長\r\nであれ規則はまもらないといけない。"
    body_text: "社長\r\nであれ規則はまもらないといけない。 \n\nEven \n\t\tthe company president has to obey the rules."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ社長であれ規則はまもらないといけない。\">\n\t\t\t\t社長\r\n<strong>であれ</strong>規則はまもらないといけない。<strong></strong></a> <br/>\n<strong>Even </strong>\n\t\tthe company president has to obey the rules."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3314
    position: 1
    japanese: "投票は海外に住んでいる人\r\nであれするべきだ。"
    body_text: "投票は海外に住んでいる人\r\nであれするべきだ。 \n\n\t\tVoting is something that you have to do, \n\t\teven if \n\t\tyou live abroad."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ投票は海外に住んでいる人であれするべきだ。\">\n\t\t\t\t投票は海外に住んでいる人\r\n<strong>であれ</strong>するべきだ。<strong></strong></a> <br/>\n\t\tVoting is something that you have to do, \n\t\t<strong>even if </strong>\n\t\tyou live abroad."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3919
    position: 2
    japanese: あなたの職業がなんであれ、また、その職業にどんなに満足していても、何かほかの仕事を選べばよかったと思うときがあるものだ。
    body_text: "あなたの職業がなんであれ、また、その職業にどんなに満足していても、何かほかの仕事を選べばよかったと思うときがあるものだ。  \n\nNo matter what \n\t\tyour profession,  or how happy you may be in it, there are moments when you wish you had chosen some other career."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたの職業がなんであれ、また、その職業にどんなに満足していても、何かほかの仕事を選べばよかったと思うときがあるものだ。 \">\n\t\t\t\tあなたの職業がなん<strong>であれ</strong>、また、その職業にどんなに満足していても、何かほかの仕事を選べばよかったと思うときがあるものだ。 <strong></strong></a> <br/>\n<strong>No matter what </strong>\n\t\tyour profession,  or how happy you may be in it, there are moments when you wish you had chosen some other career."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3920
    position: 3
    japanese: たとえ天候がどうであれ、私は行きます。
    body_text: "たとえ天候がどうであれ、私は行きます。 \n\n\t\tI will go, be the weather \n\t\twhat it may."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJたとえ天候がどうであれ、私は行きます。\">\n\t\t\t\tたとえ天候がどう<strong>であれ</strong>、私は行きます。<strong></strong></a> <br/>\n\t\tI will go, be the weather \n\t\t<strong>what it may. </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3921
    position: 4
    japanese: ドアの所にいる人が誰であれ、待つように言ってください。
    body_text: "ドアの所にいる人が誰であれ、待つように言ってください。 \n\nWhoever is \n\t\tat the door, please ask him to wait."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJドアの所にいる人が誰であれ、待つように言ってください。\">\n\t\t\t\tドアの所にいる人が誰<strong>であれ</strong>、待つように言ってください。<strong></strong></a> <br/>\n<strong>Whoever is </strong>\n\t\tat the door, please ask him to wait."
    credits_raw: Miki
    verification_class:
