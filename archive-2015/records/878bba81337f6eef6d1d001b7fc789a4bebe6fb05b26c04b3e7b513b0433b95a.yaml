    text: ＊〜であれ〜であれ（二語の組み合わせ）も同じ意味である。例えば：糖尿病（ダイアベティス）があって、菓子であれ果物であれ、甘いものは一切口にしない。
    html: ＊〜であれ〜であれ（二語の組み合わせ）も同じ意味である。例えば：糖尿病（ダイアベティス）があって、菓子であれ果物であれ、甘いものは一切口にしない。
