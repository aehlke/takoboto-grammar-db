    original_updated_at: null
  - source_id: 7886
    position: 6
    japanese: たとえ国王であれ、国民すべてを従わせることができるわけではない。
    body_text: "たとえ国王であれ、国民すべてを従わせることができるわけではない。 \n\nEven if \n\t\tyou were the king, it doesn't follow that all your subjects will obey."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJたとえ国王であれ、国民すべてを従わせることができるわけではない。\">\nたとえ国王<strong>であれ</strong>、国民すべてを従わせることができるわけではない。<strong></strong></a> <br/>\n<strong>Even if </strong>\n\t\tyou were the king, it doesn't follow that all your subjects will obey."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7887
    position: 7
    japanese: 当時の軍隊では上官の命令がいかに理不尽であれ、下級兵はそれに従うしかなかった。
    body_text: "当時の軍隊では上官の命令がいかに理不尽であれ、下級兵はそれに従うしかなかった。 \n\n\t\tIn the army in those days, \n\t\tno matter how \n\t\tunreasonable the senior officers' commands, the soliders under them had no choice but to obey them."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ当時の軍隊では上官の命令がいかに理不尽であれ、下級兵はそれに従うしかなかった。\">\n\t\t\t\t当時の軍隊では上官の命令がいかに理不尽<strong>であれ</strong>、下級兵はそれに従うしかなかった。<strong></strong></a> <br/>\n\t\tIn the army in those days, \n\t\t<strong>no matter how </strong>\n\t\tunreasonable the senior officers' commands, the soliders under them had no choice but to obey them."
    credits_raw: LR
