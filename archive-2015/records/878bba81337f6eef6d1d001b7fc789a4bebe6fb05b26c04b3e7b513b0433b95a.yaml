    original_updated_at: null
  - source_id: 7885
    position: 5
    japanese: 通勤がいかに不便であれ、今の家を変わるつもりはない。
    body_text: "通勤がいかに不便であれ、今の家を変わるつもりはない。 \n\nNo matter how \n\t\tinconvenient my commute is, I do not intend to move house"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ通勤がいかに不便であれ、今の家を変わるつもりはない。\">\n\t\t\t\t通勤がいかに不便<strong>であれ</strong>、今の家を変わるつもりはない。<strong></strong></a> <br/>\n<strong>No matter how </strong>\n\t\tinconvenient my commute is, I do not intend to move house"
    credits_raw: LR
    verification_class:
