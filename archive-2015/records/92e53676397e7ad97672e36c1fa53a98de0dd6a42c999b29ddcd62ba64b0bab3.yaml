comments:
  - position: 0
    credits_raw: Amatuka
    text: "Formed from dictionary form verb + na\n\n\n\r\nVru = 'Dictionary' form verb (e.g. 歩く、する、いる)"
    html: "Formed from dictionary form verb + na<br/>\n<br/>\r\nVru = 'Dictionary' form verb (e.g. 歩く、する、いる)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: hassan
    text: "ふざけるな！　(they often say it in anime etc. means\n\r\nsomething like... how to say it... 'stop that!',\n\r\n'don't make me a fool')"
    html: "ふざけるな！　(they often say it in anime etc. means<br/>\r\nsomething like... how to say it... 'stop that!',<br/>\r\n'don't make me a fool')"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: anon
    text: ふせげるな？
    html: ふせげるな？
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: "We don't say ふせげるな! but we say ふせぐな！ 防ぐ+な\n\r\nふざける is 'Dictionary' form verb and not potential form. ふざけるな can be also said as ふざけるんじゃない"
    html: "We don't say ふせげるな! but we say ふせぐな！ 防ぐ+な<br/>\r\nふざける is 'Dictionary' form verb and not potential form. ふざけるな can be also said as ふざけるんじゃない"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: "ふざけるな　or ふざけないで meaning : \" don't/ stop messing around and behave yourself\"\n\r\nふざける = basic meaning is \" to play around\", \"to mess about\" but can also mean \" to talk nonsense\"."
    html: "ふざけるな　or ふざけないで meaning : \" don't/ stop messing around and behave yourself\"<br/>\r\nふざける = basic meaning is \" to play around\", \"to mess about\" but can also mean \" to talk nonsense\"."
    source_id: null
