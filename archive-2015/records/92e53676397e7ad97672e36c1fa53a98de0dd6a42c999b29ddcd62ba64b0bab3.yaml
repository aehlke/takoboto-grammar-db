notes:
  - position: 0
    text: "Group 1: Change the last sound of the ます-form into the え sound. E.g. やすみ「ます」->　やすめ\n\r\nGroup 2: Append ろ to the ます-form. E.g. ねろ / 寝ろ\n\r\nGroup 3: します->しろ   きます->こい\n\n\n\r\nQuite 'rough' speech, normally only used by men or those in senior positions."
    html: "Group 1: Change the last sound of the ます-form into the え sound. E.g. やすみ「ます」-&gt;　やすめ<br/>\r\nGroup 2: Append ろ to the ます-form. E.g. ねろ / 寝ろ<br/>\r\nGroup 3: します-&gt;しろ   きます-&gt;こい<br/>\n<br/>\r\nQuite 'rough' speech, normally only used by men or those in senior positions."
    credits_raw: yutenji
