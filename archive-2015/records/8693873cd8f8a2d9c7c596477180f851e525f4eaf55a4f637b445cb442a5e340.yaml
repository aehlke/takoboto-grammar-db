    credits_raw: Amatuka
    text: See here and here for two very interesting Japanese pages on using ha vs. ga
    html: |-
      See <a href="http://homepage3.nifty.com/i-yasu/Lesson5.htm">here</a> and <a href="http://homepage3.nifty.com/i-yasu/lesson6.htm">here</a> for two very interesting Japanese pages on using ha vs. ga
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "When to use は vs が?\n\r\nBoth sentences like 雨は降っている。[ame ha \n\r\nfutteiru] and 雨が降っている。[ame ga futteiru] are \n\r\nvalid, so working out when to use which form is a \n\r\ntricky point.\n\n\n\r\nFirst: In answering a question such as \n\r\nQ. 机の上に何がありますか。[tsukue no ue ni nani ga arimasu ka]\n\r\nA. 鉛筆があります。[enpitsu ga arimasu].\n\r\nHere が is used."
    html: "When to use は vs が?<br/>\r\nBoth sentences like 雨は降っている。[ame ha <br/>\r\nfutteiru] and 雨が降っている。[ame ga futteiru] are <br/>\r\nvalid, so working out when to use which form is a <br/>\r\ntricky point.<br/>\n<br/>\r\nFirst: In answering a question such as <br/>\r\nQ. 机の上に何がありますか。[tsukue no ue ni nani ga arimasu ka]<br/>\r\nA. 鉛筆があります。[enpitsu ga arimasu].<br/>\r\nHere が is used."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "On the other hand if attention has been placed on something in advance and the question is asked with that object as the topic...\n\r\nQ. 本はどこにありますか。[hon ha doko ni arimasu ka.]\n\r\nA. 本はイスの下にあります。[hon ha isu no shita ni arimasu]\n\r\nthen は is used."
    html: "On the other hand if attention has been placed on something in advance and the question is asked with that object as the topic...<br/>\r\nQ. 本はどこにありますか。[hon ha doko ni arimasu ka.]<br/>\r\nA. 本はイスの下にあります。[hon ha isu no shita ni arimasu]<br/>\r\nthen は is used."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Amatuka
    text: "が is also used to indicate a specific choice.\n\r\n私が行きます。[watashi ga ikimasu]\n\r\n_I'll_ go. (not any of the other possibilities)."
    html: "が is also used to indicate a specific choice.<br/>\r\n私が行きます。[watashi ga ikimasu]<br/>\r\n_I'll_ go. (not any of the other possibilities)."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Amatuka
    text: "は is used for contrastative sentences (see ha-2).\n\r\nFor example normally you'd say \n\r\n犬が好きです。[inu ga suki desu] I like dogs.\n\r\nHowever if you want to contrast how you feel about dogs with how you feel about other animals then\n\r\n犬は好きだが、猫はどうも・・・[inu ha suki da ga, neko ha doumo ...]\n\r\nI like _dogs_ but I really don't (get on with) cats."
    html: "は is used for contrastative sentences (see <a href=\"http://jgram.org/pages/viewOne.php?tagE=ha-2\">ha-2</a>).<br/>\r\nFor example normally you'd say <br/>\r\n犬が好きです。[inu ga suki desu] I like dogs.<br/>\r\nHowever if you want to contrast how you feel about dogs with how you feel about other animals then<br/>\r\n犬は好きだが、猫はどうも・・・[inu ha suki da ga, neko ha doumo ...]<br/>\r\nI like _dogs_ but I really don't (get on with) cats."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Amatuka
    text: "は [ha / wa] follows a noun or a noun phrase.\n\r\n(e.g. 犬は [inu ha] 'as for dogs'\n\r\n知るのは [shiru no ha] 'as for what (I) know'\n\r\nThe latter case の nominalizes (turns into a noun) 知る)\n\n\n\r\nN = noun"
    html: "は [ha / wa] follows a noun or a noun phrase.<br/>\r\n(e.g. 犬は [inu ha] 'as for dogs'<br/>\r\n知るのは [shiru no ha] 'as for what (I) know'<br/>\r\nThe latter case の nominalizes (turns into a noun) 知る)<br/>\n<br/>\r\nN = noun"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: deedrio
    text: "In [ex #\x01], shouldnt it be: 皆さんはからどこですか?\n\r\nOr から皆さんはどこですか？　Wouldnt ex #\x01 just mean \"Where is everyone\"? Im no Japanese grammar expert but doesnt から mean from? And shouldnt から be used in ex #\x01?"
    html: "In [ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ha#\x01\">#\x01</a></b>], shouldnt it be: 皆さんはからどこですか?<br/>\r\nOr から皆さんはどこですか？　Wouldnt ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ha#\x01\">#\x01</a></b> just mean \"Where is everyone\"? Im no Japanese grammar expert but doesnt から mean from? And shouldnt から be used in ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=ha#\x01\">#\x01</a></b>?<br/>"
