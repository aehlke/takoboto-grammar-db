notes:
  - position: 0
    text: "Introducing は \"wa\" and です。\"desu.\"\n\r\nthe particle は marks the topic.\n\r\n(Remember particles attach to the word which they follow, and that when は is a particle it is pronounced wa.)\n\r\nです。functions like \"is\" or \"topic is.\""
    html: "Introducing は \"wa\" and です。\"desu.\"<br/>\r\nthe particle は marks the topic.<br/>\r\n(Remember particles attach to the word which they follow, and that when は is a particle it is pronounced wa.)<br/>\r\nです。functions like \"is\" or \"topic is.\"<br/>"
    credits_raw: Denzil
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "は\n\n\n\r\nIs pronounced as \"wah\".\n\r\nは a subject or topic marker.\n\r\nは can appear as ha, or wa in romaji depending on the system used.\n\n\n\r\nThe kana used for は is usually pronounced as \"hah\", but pronounced as \"wah\" when used as a particle.\n\r\nThe same phenomenon happens in the word \"dewa/deha\" では in the negative conjugation of the verb \x01. \n\n\n\nOther notes:\n\r\nIn yakuza speech,\n\r\nは、becomes や　(yah).\n\r\nTypically, the y sound is softened such that it sounds like \"ah\"\n\r\nExample:\n\r\nOre ha --turns to-> Ore ya --but sounds like-> Ore a"
    html: "<b>は</b><br/>\n<br/>\r\nIs pronounced as \"wah\".<br/>\r\nは a subject or topic marker.<br/>\r\nは can appear as ha, or wa in romaji depending on the system used.<br/>\n<br/>\r\nThe kana used for は is usually pronounced as \"hah\", but pronounced as \"wah\" when used as a particle.<br/>\r\nThe same phenomenon happens in the word \"dewa/deha\" では in the negative conjugation of the verb <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>. <br/>\n<br/>\n<b>Other notes:</b><br/>\r\nIn yakuza speech,<br/>\r\nは、becomes や　(yah).<br/>\r\nTypically, the y sound is softened such that it sounds like \"ah\"<br/>\r\nExample:<br/>\r\nOre ha --turns to-&gt; Ore ya --but sounds like-&gt; Ore a<br/>\n<br/>\n<br/>\n<br/>\n<br/>\n<br/>\n<br/>"
    credits_raw: Rinji_HalfElf
    source_id: null
