    credits_raw: Futaro
    text: "I saw ex 3250 and looking the little window I read: \"mado ga aketearu\n\r\nand ex. 3251: mado ga shimete aru.\n\r\nThen, I saw Amatukaﾂｴs comments and I constat that I was wrong. How can I know which of the reading of the kanji in the little window is correct.\n\r\nThank you for your help."
    html: "I saw ex 3250 and looking the little window I read: \"mado ga aketearu<br/>\r\nand ex. 3251: mado ga shimete aru.<br/>\r\nThen, I saw Amatukaﾂｴs comments and I constat that I was wrong. How can I know which of the reading of the kanji in the little window is correct.<br/>\r\nThank you for your help."
    source_id: null
