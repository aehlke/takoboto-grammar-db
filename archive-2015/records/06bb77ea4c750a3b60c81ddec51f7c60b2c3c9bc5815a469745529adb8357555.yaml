    credits_raw: Amatuka
    text: "Compare \n\r\n窓が開いている。[mado ga hiraiteiru] \n\r\nThe window is open.\n\r\n窓が開けてある。[mado ga aketearu]\n\r\nThe window has been opened."
    html: "Compare <br/>\r\n窓が開いている。[mado ga hiraiteiru] <br/>\r\nThe window is open.<br/>\r\n窓が開けてある。[mado ga aketearu]<br/>\r\nThe window has been opened."
