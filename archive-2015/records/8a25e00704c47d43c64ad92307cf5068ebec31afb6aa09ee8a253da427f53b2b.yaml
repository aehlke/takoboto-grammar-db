    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ人は休んでも、工場の機械は365日休むことなく働いている。\">\n\t\t\t\t人は休んでも、工場の機械は365日休む<strong>ことなく</strong>働いている。<strong></strong></a> <br/>\n\t\tEven when people rest, factory machines work 365 days a year \n\t\t<strong>without </strong>\n\t\tresting."
