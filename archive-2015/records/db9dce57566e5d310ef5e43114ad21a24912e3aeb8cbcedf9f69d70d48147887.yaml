notes:
  - position: 0
    text: "There are a number of ways of relating second hand info. Generally in increasing order of certainty:\n\n\n\n\x01  - perhaps (just a guess)\n\r\n明日雨が降るだろう\n\r\n= it will probably rain tomorrow\n\n\n\n\x01 - i heard\n\r\n明日雨が降るらしい\n\r\n= (from what i heard) it will rain tomorrow\n\n\n\n\x01  - seems\n\r\n雨が降りそうだ\n\r\n= (it looks like) its going to rain\n\n\n\n\x01 - i heard\n\r\n雨が降るそうだ\n\r\n= I heard it will rain\n\n\n\n\x01  - it seems\n\r\n空を見ると雨が降るようだ。\n\r\n= (From the look of the sky and based on my judgement) it seems like it will rain\n\n\n\n\x01 - looks like\n\r\n彼はやりたいみたいですね\n\r\n= Looks like he wants to do it\n\r\nthis seems much more casual, younger"
    html: "There are a number of ways of relating second hand info. Generally in increasing order of certainty:<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>  - perhaps (just a guess)<br/>\r\n明日雨が降るだろう<br/>\r\n= it will probably rain tomorrow<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> - i heard<br/>\r\n明日雨が降るらしい<br/>\r\n= (from what i heard) it will rain tomorrow<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>  - seems<br/>\r\n雨が降りそうだ<br/>\r\n= (it looks like) its going to rain<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> - i heard<br/>\r\n雨が降るそうだ<br/>\r\n= I heard it will rain<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>  - it seems<br/>\r\n空を見ると雨が降るようだ。<br/>\r\n= (From the look of the sky and based on my judgement) it seems like it will rain<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> - looks like<br/>\r\n彼はやりたいみたいですね<br/>\r\n= Looks like he wants to do it<br/>\r\nthis seems much more casual, younger"
