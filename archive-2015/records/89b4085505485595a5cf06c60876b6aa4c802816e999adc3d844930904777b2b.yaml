    body_text: "コーチの指導力と選手のやる気が相まって、優勝できた。 \n\n\t\tThe coach's leadership abilities \n\t\tcoupled with \n\t\tthe player's motivation lead to the victory"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJコーチの指導力と選手のやる気が相まって、優勝できた。\">\n\t\t\t\tコーチの指導力と選手のやる気<strong>が相まって</strong>、優勝できた。<strong></strong></a> <br/>\n\t\tThe coach's leadership abilities \n\t\t<strong>coupled with </strong>\n\t\tthe player's motivation lead to the victory"
