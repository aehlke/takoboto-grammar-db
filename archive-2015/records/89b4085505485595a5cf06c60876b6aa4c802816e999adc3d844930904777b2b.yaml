    body_text: "そのゲームはかわいいキャラクターと魅力的なストーリーがあいまって、多くのユーザーに支持されたヒット作品となった。 \n\n\t\tThat game featured cute characters \n\t\tcoupled with \n\t\ta charming story, so it became a big hit supported by many users."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそのゲームはかわいいキャラクターと魅力的なストーリーがあいまって、多くのユーザーに支持されたヒット作品となった。\">\n\t\t\t\tそのゲームはかわいいキャラクターと魅力的なストーリー<strong>があいまって</strong>、多くのユーザーに支持されたヒット作品となった。<strong></strong></a> <br/>\n\t\tThat game featured cute characters \n\t\t<strong>coupled with </strong>\n\t\ta charming story, so it became a big hit supported by many users."
