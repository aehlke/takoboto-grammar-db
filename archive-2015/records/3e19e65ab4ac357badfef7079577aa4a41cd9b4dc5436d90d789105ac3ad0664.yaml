notes:
  - position: 0
    text: "morau is a fairly informal/plain/gruff way of asking someone to do something for you.\n\n\n\r\n書いてもらうか？ = can you write it for me?\n\r\n- something a boss might say to a junior\n\n\n\r\n書いてくれる？\n\r\n- more common, not overly polite, OK to use between friends\n\n\n\r\n書いて頂けますか？\n\r\n- slightly keigo, something you might say to your boss"
    html: "morau is a fairly informal/plain/gruff way of asking someone to do something for you.<br/>\n<br/>\r\n書いてもらうか？ = can you write it for me?<br/>\r\n- something a boss might say to a junior<br/>\n<br/>\r\n書いてくれる？<br/>\r\n- more common, not overly polite, OK to use between friends<br/>\n<br/>\r\n書いて頂けますか？<br/>\r\n- slightly keigo, something you might say to your boss"
