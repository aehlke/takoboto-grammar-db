  - position: 7
    credits_raw: nhk9
    text: "Hi, I think that \"morau\" is actually not a Level 1 JLPT expression.  This is perhaps more like Level 3 expression, since this is normally not considered an advanced expression.\n\n\n\r\nI also think that in practice, Shite Sashiageru is not really used often.  Rather, they would use \"shitai to omoimasu\" as a replacement.  I think the only situations in which you would use Shite Sashiageru is to someone who's of higher social ranking than you, and also very close to you.  (Perhaps your close grandmother, or someone like that)"
    html: "Hi, I think that \"morau\" is actually not a Level 1 JLPT expression.  This is perhaps more like Level 3 expression, since this is normally not considered an advanced expression.<br/>\n<br/>\r\nI also think that in practice, Shite Sashiageru is not really used often.  Rather, they would use \"shitai to omoimasu\" as a replacement.  I think the only situations in which you would use Shite Sashiageru is to someone who's of higher social ranking than you, and also very close to you.  (Perhaps your close grandmother, or someone like that)"
    source_id: null
