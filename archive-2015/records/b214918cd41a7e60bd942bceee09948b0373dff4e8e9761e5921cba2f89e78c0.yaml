  - source_id: 4025
    position: 8
    japanese: 彼の案は私の見方からすると、とてもいいようにみえる。
    body_text: "彼の案は私の見方からすると、とてもいいようにみえる。 \n\n\t\tHis plan seems very good \n\t\tfrom my point of view."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼の案は私の見方からすると、とてもいいようにみえる。\">\n\t\t\t\t彼の案は私の見方<strong>からすると</strong>、とてもいいようにみえる。<strong></strong></a> <br/>\n\t\tHis plan seems very good \n\t\t<strong>from my point of view. </strong>"
