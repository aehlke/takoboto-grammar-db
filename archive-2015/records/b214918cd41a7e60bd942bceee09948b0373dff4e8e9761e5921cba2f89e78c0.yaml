    japanese: この見地からすると、君の言うことは正しい。
    body_text: "この見地からすると、君の言うことは正しい。 \n\nFrom this point of view, \n\t\tyou are right."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの見地からすると、君の言うことは正しい。\">\nこの見地<strong>からすると</strong>、君の言うことは正しい。<strong></strong></a> <br/>\n<strong>From this point of view, </strong>\n\t\tyou are right."
