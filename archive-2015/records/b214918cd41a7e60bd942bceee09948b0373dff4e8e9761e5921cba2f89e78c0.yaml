    japanese: メールを受け取った方からすると、何のわるぎもなくついうっかり転送してしまったということでも、発信者からすると自分が丹精こめて書いたものを、無断で第三者に転送されてしまったということにもなりかねません。
    body_text: "メールを受け取った方からすると、何のわるぎもなくついうっかり転送してしまったということでも、発信者からすると自分が丹精こめて書いたものを、無断で第三者に転送されてしまったということにもなりかねません。 \n\nAs the \n\t\tperson receiving the email he might casually forward the message with no ill intent but for the person who sent the email, put together with hard effort, to be sent on to a third party without notice could be unforgivable."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJメールを受け取った方からすると、何のわるぎもなくついうっかり転送してしまったということでも、発信者\">\n\t\t\t\tメールを受け取った方<strong>からすると</strong>、何のわるぎもなくついうっかり転送してしまったということでも、発信者<strong>からすると</strong>自分が丹精こめて書いたものを、無断で第三者に転送されてしまったということにもなりかねません。</a> <br/>\n<strong>As the </strong>\n\t\tperson receiving the email he might casually forward the message with no ill intent but for the person who sent the email, put together with hard effort, to be sent on to a third party without notice could be unforgivable."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
