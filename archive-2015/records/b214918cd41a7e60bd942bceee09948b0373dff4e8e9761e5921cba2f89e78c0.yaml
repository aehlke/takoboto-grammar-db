    japanese: 空模様からすると、今夜あたり雪になるかもしれない。
    body_text: "空模様からすると、今夜あたり雪になるかもしれない。 \n\nFrom the look of the sky, \n\t\tit may begin to snow tonight."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ空模様からすると、今夜あたり雪になるかもしれない。\">\n空模様<strong>からすると</strong>、今夜あたり雪になるかもしれない。<strong></strong></a> <br/>\n<strong>From the look of the sky, </strong>\n\t\tit may begin to snow tonight."
