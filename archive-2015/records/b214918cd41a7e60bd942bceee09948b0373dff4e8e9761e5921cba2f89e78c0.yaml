    japanese: 空模様では、からすると、雨はしばらくは止まないだろう。
    body_text: "空模様では、からすると、雨はしばらくは止まないだろう。 \n\nFrom the look of the sky, \n\t\tI'm afraid the rain won't let up for a while."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ空模様では、からすると、雨はしばらくは止まないだろう。\">\n空模様では、<strong>からすると</strong>、雨はしばらくは止まないだろう。<strong></strong></a> <br/>\n<strong>From the look of the sky, </strong>\n\t\tI'm afraid the rain won't let up for a while."
