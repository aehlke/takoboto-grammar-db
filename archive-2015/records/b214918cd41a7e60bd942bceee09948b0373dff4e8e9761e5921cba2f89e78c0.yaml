    japanese: 買い手の立場からするとこれらのCDプレーヤーの値段は、高すぎる。
    body_text: "買い手の立場からするとこれらのCDプレーヤーの値段は、高すぎる。 \n\nFrom the buyer's point of view, \n\t\tthe prices of these CD players are too high."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ買い手の立場からするとこれらのCDプレーヤーの値段は、高すぎる。\">\n\t\t\t\t買い手の立場<strong>からすると</strong>これらのCDプレーヤーの値段は、高すぎる。<strong></strong></a> <br/>\n<strong>From the buyer's point of view, </strong>\n\t\tthe prices of these CD players are too high."
