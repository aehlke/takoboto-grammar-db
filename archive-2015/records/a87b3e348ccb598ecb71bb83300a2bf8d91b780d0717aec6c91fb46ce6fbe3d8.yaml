    text: |-
      I think mankind is right. It doesnt make sense to dedicate an entry for a specific I-adj. If someone thinks that akarui is a good example for i-adj they should add examples that are based on akarui in the section about i-adj. if we keep adding a specific entry for each non-specialized word we will end up with an unsearchable polluted database. the point of this website is to highlight grammatical rules by listing an entry for each rule. this way the users of this website can directly look-up grammar points instead of wasting hteir time sifting through entries the content of which can be deduced in a single mental step once one knows the underlying rule. I dont think that akarui has such a status as to be listed in a separate entry.
