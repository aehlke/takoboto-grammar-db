  - position: 8
    credits_raw: bamboo4
    text: |-
      I would vote for: "Earthquakes are often accompanied by outbreaks of fire." に伴ってdoes not have the meaning of "as a result of" or "as the consequence of" even though it is broad enough to encompass such situation in volving causality. It can be an accidental, as opposed to causal, happenstance.
    html: |-
      I would vote for: "Earthquakes are often accompanied by outbreaks of fire." に伴ってdoes not have the meaning of "as a result of" or "as the consequence of" even though it is broad enough to encompass such situation in volving causality. It can be an accidental, as opposed to causal, happenstance.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: Amatuka
    text: "Hmm, however it does have an strong 'direction' and at least a hint of an /implication/ of causality.\n\r\nTake the statement \"Psychosis is often associated with canabis use.\" vs. \"Canabis use is often associated with psychosis.\"\n\r\nI think there's a fairly clear difference in implied meaning between the two."
    html: "Hmm, however it does have an strong 'direction' and at least a hint of an /implication/ of causality.<br/>\r\nTake the statement \"Psychosis is often associated with canabis use.\" vs. \"Canabis use is often associated with psychosis.\"<br/>\r\nI think there's a fairly clear difference in implied meaning between the two."
    source_id: null
