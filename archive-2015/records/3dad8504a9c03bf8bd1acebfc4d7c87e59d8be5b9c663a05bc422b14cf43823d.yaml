notes:
  - position: 0
    text: "＊When と共に(とともに) means 'as,' it can be rephrased as につれて, に伴って(にともなって), or に従って(にしたがって).\n\r\nEXAMPLE: 景気の回復[と共に/につれて/に伴って/に従って]失業率が下がってきた。(As business recovers, the unemployment rate is coming down.)\n\n\n\r\nFORMATION:\n\r\nＶ(dict. form) + に伴って・に伴い\n\r\nＶ(dict. form) + に伴う + Ｎ\n\r\nＮ + に伴って・に伴い\n\r\nＮ1 + に伴う + Ｎ2 (\"accompany\" is often a plausible translation)"
    html: "＊When と共に(とともに) means 'as,' it can be rephrased as につれて, に伴って(にともなって), or に従って(にしたがって).<br/>\r\nEXAMPLE: 景気の回復[と共に/につれて/に伴って/に従って]失業率が下がってきた。(As business recovers, the unemployment rate is coming down.)<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(dict. form) + に伴って・に伴い<br/>\r\nＶ(dict. form) + に伴う + Ｎ<br/>\r\nＮ + に伴って・に伴い<br/>\r\nＮ1 + に伴う + Ｎ2 (\"accompany\" is often a plausible translation)"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
