    credits_raw: Tetsuzan
    text: "Usage of に伴って does have a cause-effect relationship meaning, however this isn't necessarily true.  If A is the cause and B is the resulting effect, B can also come about as an indirect effect that A causes.  \n\n\n\r\nSo to bamboo4 and swさん、you're both correct."
