  - position: 4
    credits_raw: nay
    text: "No, I agree. \"to ittara\" is used in a \"to ieba\" sense in all the other examples. I know that's common for \"ttara\" (which is a contraction of \"to ittara\"), but I'm not sure myself how to distinguish these obviously two meanings properly.\n\r\nMaybe a native speaker can help us out."
    html: "No, I agree. \"to ittara\" is used in a \"to ieba\" sense in all the other examples. I know that's common for \"ttara\" (which is a contraction of \"to ittara\"), but I'm not sure myself how to distinguish these obviously two meanings properly.<br/>\r\nMaybe a native speaker can help us out.<br/>"
