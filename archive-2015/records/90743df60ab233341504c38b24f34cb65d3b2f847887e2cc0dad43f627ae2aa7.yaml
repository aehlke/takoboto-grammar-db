    text: "[#\x01]　is the strangest japanese I have every seen. これを見たときの私の驚きといったら???　say what? \n\n\n\r\n私はそれを見た時、驚きといったら十分じゃないよ\n\r\nWhen I saw that, to say I was suprised is insufficent."
