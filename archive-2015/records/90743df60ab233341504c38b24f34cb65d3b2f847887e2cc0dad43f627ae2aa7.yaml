  - position: 1
    credits_raw: kadoka66
    text: "Hmm to make one of the usages of this grammar item a little more understandable there is a Japanese drinking game which I often play with friends.\n\n\n\r\nIt goes like this:\n\n\n\r\nなにものといったら、なにもの\n\r\nWhat would you think of if I said ??\n\n\n\r\n例：人A：バナナと言ったら、黄色い。\n\r\n人B:黄色いと言ったら、色。\n\r\n人C:色と言ったら、虹\n\n\n\r\nEtc etc\n\n\n\r\nIt's a bit like Mallets Mallet for those of you who are familiar with the British 80's Morning show."
    html: "Hmm to make one of the usages of this grammar item a little more understandable there is a Japanese drinking game which I often play with friends.<br/>\n<br/>\r\nIt goes like this:<br/>\n<br/>\r\nなにものといったら、なにもの<br/>\r\nWhat would you think of if I said ??<br/>\n<br/>\r\n例：人A：バナナと言ったら、黄色い。<br/>\r\n人B:黄色いと言ったら、色。<br/>\r\n人C:色と言ったら、虹<br/>\n<br/>\r\nEtc etc<br/>\n<br/>\r\nIt's a bit like Mallets Mallet for those of you who are familiar with the British 80's Morning show.<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
