notes:
  - position: 0
    text: "「Aたところ、Bた」: B is the subsequent result or acquired knowledge, et cetera, after doing A. This is a one-time-only action & result.\n\n\n\r\nVた + ところ\n\r\n* the most common use is 〜てみたところ"
    html: "「Aたところ、Bた」: B is the subsequent result or acquired knowledge, et cetera, after doing A. This is a one-time-only action &amp; result.<br/>\n<br/>\r\nVた + ところ<br/>\r\n* the most common use is 〜てみたところ"
