notes:
  - position: 0
    text: "Verb ryk (VB masu) kakeru\n\r\n- used with Transitive/Intransitive verbs\n\r\n- an action/ a state is about to take place- you start doing something but you don't finish that action, so it remains half done\n\r\n= BEGIN TO~; BE ABOUT TO~; ALMOST (DO)~\n\n\n\r\na). ご飯を食べかけた時に、地震が起きた。\n\r\n　　When I was about to eat[/just started to eat] my meal, the earthquake occured. (so I didn't finish the action)\n\n\n\r\nb).父は若い時に、海でおぼれかけたそうだ。\n\r\nI was told that my father almost drowned in the sea when he was young.\n\n\n\r\nc).雨が降りかけたが、また天気になった。\n\r\nIt started to rain, but it became fine again.\n\n\n\r\nd).オアは開きかけたが、また閉まってしまった。\n\r\nThe door begun to open, but it closed again"
    html: "Verb ryk (VB masu) kakeru<br/>\r\n- used with Transitive/Intransitive verbs<br/>\r\n- an action/ a state is about to take place- you start doing something but you don't finish that action, so it remains half done<br/>\r\n= BEGIN TO~; BE ABOUT TO~; ALMOST (DO)~<br/>\n<br/>\r\na). ご飯を食べかけた時に、地震が起きた。<br/>\r\n　　When I was about to eat[/just started to eat] my meal, the earthquake occured. (so I didn't finish the action)<br/>\n<br/>\r\nb).父は若い時に、海でおぼれかけたそうだ。<br/>\r\nI was told that my father almost drowned in the sea when he was young.<br/>\n<br/>\r\nc).雨が降りかけたが、また天気になった。<br/>\r\nIt started to rain, but it became fine again.<br/>\n<br/>\r\nd).オアは開きかけたが、また閉まってしまった。<br/>\r\nThe door begun to open, but it closed again<br/>"
    credits_raw: deeana
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "ます形　＋　かける\n\n\n\r\n1. 〜かけている/〜かける：実際に起こる直前\n\r\nThis form takes the meaning of \"just as\", \"just before\", or \"on the verge of\" \"about to.\" It uses verbs that finish or change in an instant (一瞬で終わる/変わること), i.e. 消える、死ぬ、切れる etc.\n\n\n\r\nEx:\n\r\n携帯電話のバッテリーが切れかけている。\n\r\n私は子供の頃病気で死にかけたことがあるらしい。\n\r\n死にかけていた猫を拾ってきた。\n\n\n\r\n2. 〜かける/〜かけて: 直前\n\r\nThis form implies the idea that the action had barely begun and then stopped.\n\n\n\r\nEx.\n\r\n今日こそ彼に一言いってやろうと思ったが、言いかけてやめた。In other words, \"he\" never got the complaint. The speaker probably stopped at, \"umm... nevermind.\"\n\n\n\r\n宿題の文作を書きかけたが、なかなか先にすすまないので結局途中でやめてしまった。This person probably got as far as writing their name before quitting.\n\n\n\r\n3. 〜かけの/〜かけだ: 途中\n\r\nThis form means in the middle of an incomplete action. It takes verbs that take time/occur over time (動作が続く動詞), i.e. 食べる、飲む、etc.\n\n\n\r\nEx.\n\r\nテーブルの上の飲みかけのコーヒー、誰の。"
    html: "ます形　＋　かける<br/>\n<br/>\r\n1. 〜かけている/〜かける：実際に起こる直前<br/>\r\nThis form takes the meaning of \"just as\", \"just before\", or \"on the verge of\" \"about to.\" It uses verbs that finish or change in an instant (一瞬で終わる/変わること), i.e. 消える、死ぬ、切れる etc.<br/>\n<br/>\r\nEx:<br/>\r\n携帯電話のバッテリーが切れかけている。<br/>\r\n私は子供の頃病気で死にかけたことがあるらしい。<br/>\r\n死にかけていた猫を拾ってきた。<br/>\n<br/>\r\n2. 〜かける/〜かけて: 直前<br/>\r\nThis form implies the idea that the action had barely begun and then stopped.<br/>\n<br/>\r\nEx.<br/>\r\n今日こそ彼に一言いってやろうと思ったが、言いかけてやめた。In other words, \"he\" never got the complaint. The speaker probably stopped at, \"umm... nevermind.\"<br/>\n<br/>\r\n宿題の文作を書きかけたが、なかなか先にすすまないので結局途中でやめてしまった。This person probably got as far as writing their name before quitting.<br/>\n<br/>\r\n3. 〜かけの/〜かけだ: 途中<br/>\r\nThis form means in the middle of an incomplete action. It takes verbs that take time/occur over time (動作が続く動詞), i.e. 食べる、飲む、etc.<br/>\n<br/>\r\nEx.<br/>\r\nテーブルの上の飲みかけのコーヒー、誰の。<br/>"
