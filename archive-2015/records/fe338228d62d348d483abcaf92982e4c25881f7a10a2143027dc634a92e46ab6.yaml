    original_updated_at: null
  - position: 2
    text: "Yahoo辞書に下記の解説を書いてあります：\n\r\n動詞の連用形に付いて、自分の思いのままにする意を浮ｷ。うまく…する。完全に…する。「使い―・す」「乗り―・す」「読み―・す」\n\n\n\r\nだから、[使いこなす]とは、deal with expertly, skilled.\n\r\nだが、「こなす」は単独に使う時、complete；finishの意味をあります。\n\r\nその仕事をこなす。"
    html: "Yahoo辞書に下記の解説を書いてあります：<br/>\r\n動詞の連用形に付いて、自分の思いのままにする意を浮ｷ。うまく…する。完全に…する。「使い―・す」「乗り―・す」「読み―・す」<br/>\n<br/>\r\nだから、[使いこなす]とは、deal with expertly, skilled.<br/>\r\nだが、「こなす」は単独に使う時、complete；finishの意味をあります。<br/>\r\nその仕事をこなす。<br/>\n<br/>\n<br/>"
    credits_raw: williamking
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    text: "Is both a verb suffix and a verb in its own right.\n\n\n\r\nIn the affirmative, has the connotation of doing something effectively."
    html: "Is both a verb suffix and a verb in its own right.<br/>\n<br/>\r\nIn the affirmative, has the connotation of doing something effectively."
    credits_raw: american57
