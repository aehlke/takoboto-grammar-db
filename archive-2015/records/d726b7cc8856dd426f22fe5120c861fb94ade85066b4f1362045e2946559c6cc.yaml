notes:
  - position: 0
    text: '〜ざるを得ない: 〜したくないが．．．しなければならない'
    html: '〜ざるを得ない: 〜したくないが．．．しなければならない'
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "This is an auxiliiary indicating that there is no other choice but to do something. Possible translations include: cannot help 〜ing; cannot help but; have no choice but to have to.\n\n\n\r\nＶneg + ざるを得ない\n\r\nExamples: 食べざるを得ない // 行かざるを得ない\n\r\nException: する -> せざるを得ない"
    html: "This is an auxiliiary indicating that there is no other choice but to do something. Possible translations include: cannot help 〜ing; cannot help but; have no choice but to have to.<br/>\n<br/>\r\nＶneg + ざるを得ない<br/>\r\nExamples: 食べざるを得ない // 行かざるを得ない<br/>\r\nException: する -&gt; せざるを得ない"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "＊Be very careful as to when you replace one of these phrases with another.\n\n\n\r\nＶneg + ざるを得ない : used in a situation where one has no choice but to do something.\n\n\n\r\nＶ + しかない : used in a situation where one has no choice but to do something.\n\n\n\r\nＶneg + なければならない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something.\n\n\n\r\nＶneg + わけに(は)いかない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something. It also expresses the unwillingness of the speaker to do Ｖ."
    html: "＊Be very careful as to when you replace one of these phrases with another.<br/>\n<br/>\r\nＶneg + ざるを得ない : used in a situation where one has no choice but to do something.<br/>\n<br/>\r\nＶ + しかない : used in a situation where one has no choice but to do something.<br/>\n<br/>\r\nＶneg + なければならない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something.<br/>\n<br/>\r\nＶneg + わけに(は)いかない : used in a situation where one has to do something because s/he has an obligation to do it OR where one has no choice but to do something. It also expresses the unwillingness of the speaker to do Ｖ."
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
