    text: "Please see the comment by bamboo4 in \x01. ざるを得ない is one word and always read as ざるをえない. There is no ざるを得る."
    html: "Please see the comment by bamboo4 in <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>. ざるを得ない is one word and always read as ざるをえない. There is no ざるを得る."
