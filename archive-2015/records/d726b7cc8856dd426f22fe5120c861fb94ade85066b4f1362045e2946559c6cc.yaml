  - position: 6
    credits_raw: bamboo4
    text: "ざる is an archaic particle indicating negation. It's root form is ず and it inflects as ず/ざら、ず/ざり、ざる/ぬ、ざれ/ね but its imperative form is ざれ. In tbis manner, it has very unique inflections.\n\r\n行かざる means not going, which is denied by えない so that it becomes \"not going is not capable,\" the double negative thus resulting in \"I must go.\""
    html: "ざる is an archaic particle indicating negation. It's root form is ず and it inflects as ず/ざら、ず/ざり、ざる/ぬ、ざれ/ね but its imperative form is ざれ. In tbis manner, it has very unique inflections.<br/>\r\n行かざる means not going, which is denied by えない so that it becomes \"not going is not capable,\" the double negative thus resulting in \"I must go.\"<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: bamboo4
    text: "#\x01 is not acceptable. 同情の涙を禁じ得ない would be the correct diction. ざるを得ない is not appropriate so that this example does not belong to this head."
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=zaruwoenai#\x01\">#\x01</a></b> is not acceptable. 同情の涙を禁じ得ない would be the correct diction. ざるを得ない is not appropriate so that this example does not belong to this head."
