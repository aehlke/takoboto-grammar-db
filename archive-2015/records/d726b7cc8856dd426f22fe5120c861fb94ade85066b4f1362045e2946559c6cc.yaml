  - position: 8
    credits_raw: 誠
    text: "#\x01 grammatically is not wrong, but the meaning is very strange. Because 〜ざるを得ない means you have to do 〜even you don't want to, and 禁じる means 抑える or suppress,\n\r\nSo, 同情の涙を禁じざるを得ない means:\n\r\nYou have to suppress tears of sympathy, even if you didn't want to (suppress).\n\n\n\r\nWhereas, 同情の涙を禁じ得ない means(which is more natural in this case):\n\r\nYou couldn't suppress/stop tears of sympathy (of dropping down).同情の涙を抑えることができない"
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=zaruwoenai#\x01\">#\x01</a></b> grammatically is not wrong, but the meaning is very strange. Because 〜ざるを得ない means you have to do 〜even you don't want to, and 禁じる means 抑える or suppress,<br/>\r\nSo, 同情の涙を禁じざるを得ない means:<br/>\r\nYou have to suppress tears of sympathy, even if you didn't want to (suppress).<br/>\n<br/>\r\nWhereas, 同情の涙を禁じ得ない means(which is more natural in this case):<br/>\r\nYou couldn't suppress/stop tears of sympathy (of dropping down).同情の涙を抑えることができない <br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
