notes:
  - position: 0
    text: "つい \x01\n\r\nyou may need to be a little careful to use つい as it means that you did something without thinking too much.\n\r\n       But sometimes it is used in a good way to express what one says is a gut feeling.\n\r\n       Surely つい結婚した　is not good.\n\n\n\r\n結局  \x01\n\r\noften implies that a negative thing follows afterwards.\n\n\n\r\nやっと \x01\n\r\nis not always used with positive feelings.\n\r\nSometimes it is used to show an innuendo.\n\r\nLike, やっと来た　= you are way too late."
    html: "つい <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b><br/>\r\nyou may need to be a little careful to use つい as it means that you did something without thinking too much.<br/>\r\n       But sometimes it is used in a good way to express what one says is a gut feeling.<br/>\r\n       Surely つい結婚した　is not good.<br/>\n<br/>\r\n結局  <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b><br/>\r\noften implies that a negative thing follows afterwards.<br/>\n<br/>\r\nやっと <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b><br/>\r\nis not always used with positive feelings.<br/>\r\nSometimes it is used to show an innuendo.<br/>\r\nLike, やっと来た　= you are way too late.<br/>"
