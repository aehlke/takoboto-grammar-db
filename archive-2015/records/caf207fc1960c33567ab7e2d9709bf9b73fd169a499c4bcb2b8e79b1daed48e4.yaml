    text: "１．〜（う）ようが〜まいが　＝　〜（う）ようと〜まいと :   〜ても、そうじゃなくても\n\r\nwhich means : 「whether will or will not doesn't matter, still....」\n\r\nex : 行こうと行くまいと = 行っても行かなくても\n\n\n\r\n２．〜（う）ようか〜まいか : 〜う／ようか、それとも．．．のを止めようか  which means :「 whether to do or not to do, (where there is uncertainty left / something undecided yet) 」\n\r\nex : 行こうか行くまいか : 行くかどうか／行くか行かないか\n\n\n\r\nExample ex #\x01  and ex #\x01 belongs to the 1st category.  ex #\x01 and ex #\x01 belongs to the 2nd category. The rest is different usage of まいか。"
    html: "１．〜（う）ようが〜まいが　＝　〜（う）ようと〜まいと :   〜ても、そうじゃなくても<br/>\r\nwhich means : 「whether will or will not doesn't matter, still....」<br/>\r\nex : 行こうと行くまいと = 行っても行かなくても<br/>\n<br/>\r\n２．〜（う）ようか〜まいか : 〜う／ようか、それとも．．．のを止めようか  which means :「 whether to do or not to do, (where there is uncertainty left / something undecided yet) 」<br/>\r\nex : 行こうか行くまいか : 行くかどうか／行くか行かないか<br/>\n<br/>\r\nExample ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=maika#\x01\">#\x01</a></b>  and ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=maika#\x01\">#\x01</a></b> belongs to the 1st category.  ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=maika#\x01\">#\x01</a></b> and ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=maika#\x01\">#\x01</a></b> belongs to the 2nd category. The rest is different usage of まいか。"
