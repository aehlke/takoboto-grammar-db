  - position: 9
    credits_raw: KyleGoetz
    text: "Example #\x01 has a typo: 思わない is correct, not 思はまい. Check hiragana and try again ;) If it was changed to 思うか思うまいか, then it is correct.\n\n\n\r\n@LJFURLONG, you are thinking of ま〜、いいか, which is often pronounced ま〜いっか, meaning literally \"well, is it ok?\" but figuratively \"nothing to do about it\" or something else difficult to translate into English. But, yes, you can use it to loosely mean \"to hell with it.\"\n\n\n\r\nThere are many まいか constructions in Japanese for different contexts. It seems that everyone is including examples of the form V-るかまいか (do or not do VERB), when in fact V-るまいか is in fact a phrase unto itself:\n\r\n食べるまいか, which is equivalent to 食べないだろう. I have included information on the second form, because there ought to be a different entry for V-るかまいか, since the construction requires more than just まいか.\n\n\n\r\nEdit: 2006/03/09\n\r\nI changed the English meaning to more closely match the phrase being taught (まいか). The English meaning originally given (will or won't) is incorrect. The construction whoever wrote that was thinking of is V-るかV-るまいか. まいか, as I've said before, merely expresses a little doubt. It is a related, but not equivalent, construction to the \"will or won't\" construction."
    html: "Example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=maika#\x01\">#\x01</a></b> has a typo: 思わない is correct, not 思はまい. Check hiragana and try again ;) If it was changed to 思うか思うまいか, then it is correct.<br/>\n<br/>\r\n@LJFURLONG, you are thinking of ま〜、いいか, which is often pronounced ま〜いっか, meaning literally \"well, is it ok?\" but figuratively \"nothing to do about it\" or something else difficult to translate into English. But, yes, you can use it to loosely mean \"to hell with it.\"<br/>\n<br/>\r\nThere are many まいか constructions in Japanese for different contexts. It seems that everyone is including examples of the form V-るかまいか (do or not do VERB), when in fact V-るまいか is in fact a phrase unto itself:<br/>\r\n食べるまいか, which is equivalent to 食べないだろう. I have included information on the second form, because there ought to be a different entry for V-るかまいか, since the construction requires more than just まいか.<br/>\n<br/>\r\nEdit: 2006/03/09<br/>\r\nI changed the English meaning to more closely match the phrase being taught (まいか). The English meaning originally given (will or won't) is incorrect. The construction whoever wrote that was thinking of is V-るかV-るまいか. まいか, as I've said before, merely expresses a little doubt. It is a related, but not equivalent, construction to the \"will or won't\" construction."
    source_id: null
