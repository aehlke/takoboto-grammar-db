  - position: 1
    text: "This is an auxiliary which expresses the negative volition or conjecture of the speaker. It is basically a written form, used in formal writing.\n\n\n\r\nFor Gr. 2 verbs, Ｖmasu is occasionally used instead of Ｖinf・nonpast. For irregular verbs, すまい and こまい are sometimes used instead of するまいand くるまい, respectively."
