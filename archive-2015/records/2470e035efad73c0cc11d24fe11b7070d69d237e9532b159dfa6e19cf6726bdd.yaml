    original_updated_at: null
  - position: 1
    text: "I have found that in working situations 失礼しますが is always a good way to interupt someone while they are in the middle of something. \n\n\n\r\nif someone is eating you can always say　すみません食事中のに　よろしいですか。"
    html: "I have found that in working situations 失礼しますが is always a good way to interupt someone while they are in the middle of something. <br/>\n<br/>\r\nif someone is eating you can always say　すみません食事中のに　よろしいですか。"
