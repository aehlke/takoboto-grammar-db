notes:
  - position: 0
    text: "I often wonder how to interrupt people to ask them a question at work...\n\r\n----\n\n\n\r\nすみません、少しよろしいですか？ might be short and polite enough.\n\n\n\r\nOne way to sound polite or reserved is try not to finish your sentence.\n\r\nIt might sound weird but a half-finished sense can hand over the baton to your partner.\n\r\nFor instance, ”すみません、質問があるんですが、、、。”\n\r\nIt lets the partner take over the conversation, he may say, \"何ですか？”then you can proceed saying, \"質問があるんですけど”.\n\r\nYour sentence ”すみません、質問ありますので、少し時間いただけますか？\"has no problem but it can be a too long sentence depending on the scene.\n\r\nIn other words you might end up with holding your partner from speaking for too long.\n\r\nYour sentence might be better to finish halfway such as ”すみません、質問があるんですけど…” or finish it by combining all the elements, ”すみません、質問してもよろしいですか？”"
    html: "I often wonder how to interrupt people to ask them a question at work...<br/>\r\n----<br/>\n<br/>\r\nすみません、少しよろしいですか？ might be short and polite enough.<br/>\n<br/>\r\nOne way to sound polite or reserved is try not to finish your sentence.<br/>\r\nIt might sound weird but a half-finished sense can hand over the baton to your partner.<br/>\r\nFor instance, ”すみません、質問があるんですが、、、。”<br/>\r\nIt lets the partner take over the conversation, he may say, \"何ですか？”then you can proceed saying, \"質問があるんですけど”.<br/>\r\nYour sentence ”すみません、質問ありますので、少し時間いただけますか？\"has no problem but it can be a too long sentence depending on the scene.<br/>\r\nIn other words you might end up with holding your partner from speaking for too long.<br/>\r\nYour sentence might be better to finish halfway such as ”すみません、質問があるんですけど…” or finish it by combining all the elements, ”すみません、質問してもよろしいですか？”<br/>"
    credits_raw: dc
