  - position: 2
    credits_raw: Amatuka
    text: |-
      "In motion constructions -ni and -e appear to have the same distribution [...]. The primary difference in distribution is that -ni may occur in other verbal contexts, as I show below, but -e may not, while -e may appear marking arguments in nominal constructions but -ni may not, [...]"
    html: |-
      "In motion constructions -ni and -e appear to have the same distribution [...]. The primary difference in distribution is that -ni may occur in other verbal contexts, as I show below, but -e may not, while -e may appear marking arguments in nominal constructions but -ni may not, [...]"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Amatuka
    text: "In theory へ is for movement in a direction, while に implies arrival at a specific destination.\n\r\n[or some such].  In practise there is very little difference."
    html: "In <b>theory</b> へ is for movement in a direction, while に implies arrival at a specific destination.<br/>\r\n[or some such].  In practise there is very little difference."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Amatuka
    text: N = noun
    html: N = noun
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Amatuka
    text: "Note: Apart from the \n\r\nDCへ \n\r\nletter / email addressing type usage you can't use へ to indicate going to a person.\n\r\ne.g. (BAD) DCへ行きました。[DC he ikimashita] I went to DC.\n\r\n(GOOD) DCの家へ行きました。[DC no ie he ikimashita] I went to DC's house."
    html: "<b>Note:</b> Apart from the <br/>\r\nDCへ <br/>\r\nletter / email addressing type usage you can't use へ to indicate going to a person.<br/>\r\ne.g. (BAD) DCへ行きました。[DC he ikimashita] I went to DC.<br/>\r\n(GOOD) DCの家へ行きました。[DC no ie he ikimashita] I went to DC's house."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: Anon
    text: |-
      I'd get rid of the above 'bad' example, because DC is also a place (Washington DC), in which case you CAN say "DCへ行きました。"  Put some other person's name in that to make your point, and then please delete this comment :)
