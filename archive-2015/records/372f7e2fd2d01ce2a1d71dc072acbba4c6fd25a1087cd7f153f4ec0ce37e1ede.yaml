notes:
  - position: 0
    text: "へ and に there is no difference. They can both be used and are considered interchangeable. I see both に and へ in writing and talking. \n\n\n\r\nSuch as:\n\n\n\r\nえきにいきます。- I'm going to the train station.\n\n\n\r\n へ can replace に and vice versa."
    html: "へ and に there is no difference. They can both be used and are considered interchangeable. I see both に and へ in writing and talking. <br/>\n<br/>\r\nSuch as:<br/>\n<br/>\r\nえきにいきます。- I'm going to the train station.<br/>\n<br/>\r\n へ can replace に and vice versa."
    credits_raw: Sakuratree
    source_id: null
