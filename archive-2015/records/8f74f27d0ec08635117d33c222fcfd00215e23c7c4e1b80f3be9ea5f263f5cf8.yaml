  - position: 1
    text: "＊について can replace に関して. It is less formal, though.\n\n\n\r\n＊The polite form に関しまして can appear in formal speech.\n\n\n\r\n＊に関する is the prenominal version of に関して and can be used to modify the noun which follows.\n\n\n\r\nFORMATION:\n\r\nＮ + に関して\n\r\nＮ1 + に関する + Ｎ2"
    html: "＊について can replace に関して. It is less formal, though.<br/>\n<br/>\r\n＊The polite form に関しまして can appear in formal speech.<br/>\n<br/>\r\n＊に関する is the prenominal version of に関して and can be used to modify the noun which follows.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + に関して<br/>\r\nＮ1 + に関する + Ｎ2"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "Note:  As previously stated above, though this is interchangeable with について,  there is a particular feeling and depth of conversational topics that に関して　is used for.  This is usually reserved for serious discussion topics, assignments, or \"grown-up\" levels of discussion, where as について has a more general usage.  \n\n\n\r\n最近、株に関する本がたくさん出版されています。\n\r\nRecently, many books about stocks are being published.\n\n\n\r\n昨日のレモネードの味に関して、砂糖を入れすぎたと思います。\n\n\n\r\nRegarding yesterday's lemonade, I think I put in too much sugar.\n\n\n\r\nIn the above sentences, the first one would be seen as a more proper usage of に関して given the overall tone and \"adult-ness\" of the conversation.  In contrast, the second sentence would benefit more from について as the depth of topics simply don't match well with the tone usually associated with に関して.  To make things a bit more pictorial, imagine a 6 year old speaking with a PhD's vocabulary and vernacular, something just wouldn't seem correct about it."
    html: "Note:  As previously stated above, though this is interchangeable with について,  there is a particular feeling and depth of conversational topics that に関して　is used for.  This is usually reserved for serious discussion topics, assignments, or \"grown-up\" levels of discussion, where as について has a more general usage.  <br/>\n<br/>\r\n最近、株に関する本がたくさん出版されています。<br/>\r\nRecently, many books about stocks are being published.<br/>\n<br/>\r\n昨日のレモネードの味に関して、砂糖を入れすぎたと思います。<br/>\n<br/>\r\nRegarding yesterday's lemonade, I think I put in too much sugar.<br/>\n<br/>\r\nIn the above sentences, the first one would be seen as a more proper usage of に関して given the overall tone and \"adult-ness\" of the conversation.  In contrast, the second sentence would benefit more from について as the depth of topics simply don't match well with the tone usually associated with に関して.  To make things a bit more pictorial, imagine a 6 year old speaking with a PhD's vocabulary and vernacular, something just wouldn't seem correct about it.<br/>\n<br/>\n<br/>\n<br/>"
    credits_raw: Tetsuzan
