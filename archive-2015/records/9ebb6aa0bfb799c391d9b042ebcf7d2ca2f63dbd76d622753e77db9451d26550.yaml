  - position: 14
    credits_raw: sky
    text: "Greetings.\n\r\nI understood the 払わせてください (Let me pay for it).\n\r\nAnd the 彼に払わせてあげる (I let him pay).\n\n\n\r\nWhat about:\n\r\n払わせてもらう?"
    html: "Greetings.<br/>\r\nI understood the 払わせてください (Let me pay for it).<br/>\r\nAnd the 彼に払わせてあげる (I let him pay).<br/>\n<br/>\r\nWhat about:<br/>\r\n払わせてもらう?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 15
    credits_raw: Lorenz
    text: |-
      sky, 払わせてもらう, like most things in Japanese is going to be translated slightly differently depending on context.  However, I think a good general idea is: "be allowed to pay."  Not necessarily a strict, weird 払う許可を得る type of way, but that is the idea.  It is a phrase you could use pretty often when you go out to eat with people who also try to flip the bill (as is often the case in Japan).  Saying that would be like saying "Let me get this one," or "I'll take care of it," because you are acknowledging that ultimately it is your companions who hold the power to decide and that you are "receiving" (貰う） their "letting"（させる） you pick up the tab.  It could be compared with 奢ってあげる, but the latter may be a bit more... ずうずうしいかな？ And after all, 驕る者久しからず＾＾. Anyway, yeah, this is going to vary with the situation, but I hope that helps.
    html: |-
      sky, 払わせてもらう, like most things in Japanese is going to be translated slightly differently depending on context.  However, I think a good general idea is: "be allowed to pay."  Not necessarily a strict, weird 払う許可を得る type of way, but that is the idea.  It is a phrase you could use pretty often when you go out to eat with people who also try to flip the bill (as is often the case in Japan).  Saying that would be like saying "Let me get this one," or "I'll take care of it," because you are acknowledging that ultimately it is your companions who hold the power to decide and that you are "receiving" (貰う） their "letting"（させる） you pick up the tab.  It could be compared with 奢ってあげる, but the latter may be a bit more... ずうずうしいかな？ And after all, 驕る者久しからず＾＾. Anyway, yeah, this is going to vary with the situation, but I hope that helps.
    source_id: null
