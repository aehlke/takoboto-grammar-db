  - position: 1
    text: "On the difference between とばかりに and と言わんばかりに\n\n\n\r\nと言わんばかりに\"as if to say\", and というように\"in such a way that, as if to say\" are synonymous with とばかりに and can be used in place of とばかりに in some cases.\n\n\n\r\nHowever, you can't say と言わんばかりabout yourself: \"The fog finally cleared so I ran outside as if to say this is my only chance\" would be weird in Japanese (surely you don't need to guess your own thinking), but in this sentence you could use とばかりに and it would be more like \"The fog finally cleared so I ran outside as if it was my only chance\"\n\r\nsee sentences at \x01"
    html: "<b>On the difference between <strong>とばかりに</strong> and <strong>と言わんばかりに</strong></b><br/>\n<br/>\r\nと言わんばかりに\"as if to say\", and というように\"in such a way that, as if to say\" are synonymous with とばかりに and can be used in place of とばかりに in some cases.<br/>\n<br/>\r\nHowever, you can't say と言わんばかりabout yourself: \"The fog finally cleared so I ran outside as if to say this is my only chance\" would be weird in Japanese (surely you don't need to guess your own thinking), but in this sentence you could use とばかりに and it would be more like \"The fog finally cleared so I ran outside as if it was my only chance\"<br/>\r\nsee sentences at <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>"
    credits_raw: LR
