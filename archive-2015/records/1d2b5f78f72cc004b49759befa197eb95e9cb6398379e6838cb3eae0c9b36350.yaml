    text: I cannot find a difference between V出すand vし始める.
    html: I cannot find a difference between V出すand vし始める.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: arkofnoah
    text: "出す have a nuance of sudden action\n\n\n\r\n走り出す means to \"break into a run\", like when a girl sees a cockroach and she \"走り出す\"。\n\n\n\r\n始めた have a more neutral meaning, as in started eating, or start running in the case of \"走り始めた\" (like you start running when a race start.)\n\n\n\r\nso that's what i think..."
    html: "出す have a nuance of sudden action<br/>\n<br/>\r\n走り出す means to \"break into a run\", like when a girl sees a cockroach and she \"走り出す\"。<br/>\n<br/>\r\n始めた have a more neutral meaning, as in started eating, or start running in the case of \"走り始めた\" (like you start running when a race start.)<br/>\n<br/>\r\nso that's what i think..."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: KyleGoetz
    text: "I changed the information about this entry, because the entry appeared to be a grammar rule for the plain past tense of 始める, when in fact the rule can be abstracted to cover the entirety of conjugations of the verb (be it plain, polite, past, non-past).\n\n\n\r\n@Miki - arkofnoah hit it right on the head; 〜出す carries an \"explosive\" feeling along with it. 〜始める does not."
    html: "I changed the information about this entry, because the entry appeared to be a grammar rule for the plain past tense of 始める, when in fact the rule can be abstracted to cover the entirety of conjugations of the verb (be it plain, polite, past, non-past).<br/>\n<br/>\r\n@Miki - arkofnoah hit it right on the head; 〜出す carries an \"explosive\" feeling along with it. 〜始める does not."
    source_id: null
    original_created_at: null
