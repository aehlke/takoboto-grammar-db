notes:
  - position: 0
    text: |-
      This construct expresses the beginning of an action or verb. It takes the [conjunctive form] of the verb and appends to it the auxiliary verb 始める.
    html: |-
      This construct expresses the beginning of an action or verb. It takes the [conjunctive form] of the verb and appends to it the auxiliary verb 始める.
    credits_raw: KyleGoetz
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "Hajimaru which also means to start same as hajimeru means the same.\n\n\n\r\nHowever, hajimaru doesn't require someone to do something and it never takes the を particle while hajimeru needs を.\n\n\n\r\nJapanese contains these types of verbs: transitive and intransitive."
    html: "Hajimaru which also means to start same as hajimeru means the same.<br/>\n<br/>\r\nHowever, hajimaru doesn't require someone to do something and it never takes the を particle while hajimeru needs を.<br/>\n<br/>\r\nJapanese contains these types of verbs: transitive and intransitive."
    credits_raw: Sakuratree
