    original_updated_at: null
  - position: 1
    credits_raw: dc
    text: "V-hajimeta and\n\r\nV-dashita\n\n\n\r\nI infer some differences from the examples we have so far (need more though, hint hint :)\n\n\n\r\nyomi-hajimeta : that was the first time I started reading\n\n\n\r\nugoki-dashita : it started moving\n\r\nnot neccesarily the first time.\n\n\n\r\nugoki-hajimeta : it started to move (first time?)\n\n\n\r\nalso, depends on the verb. -dashita seems to feel more sudden, violent to me, like machinery lurching to a start... ?"
    html: "V-hajimeta and<br/>\r\nV-dashita<br/>\n<br/>\r\nI infer some differences from the examples we have so far (need more though, hint hint :)<br/>\n<br/>\r\nyomi-hajimeta : that was the first time I started reading<br/>\n<br/>\r\nugoki-dashita : it started moving<br/>\r\nnot neccesarily the first time.<br/>\n<br/>\r\nugoki-hajimeta : it started to move (first time?)<br/>\n<br/>\r\nalso, depends on the verb. -dashita seems to feel more sudden, violent to me, like machinery lurching to a start... ?"
    source_id: null
