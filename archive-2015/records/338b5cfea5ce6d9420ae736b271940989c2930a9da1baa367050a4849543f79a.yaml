  - position: 2
    credits_raw: dc
    text: "ようだ is a very literal \"like\" something:\n\r\n> This meat tastes like chicken.\n\n\n\r\nかのうよう is usually more metaphorical\n\r\n> she is like a princess\n\n\n\r\nplease also see \x01 which is often used in the same sentence.\n\n\n\r\ncan a japanese native speaker please confirm this?"
    html: "ようだ is a very literal \"like\" something:<br/>\r\n&gt; This meat tastes like chicken.<br/>\n<br/>\r\nかのうよう is usually more metaphorical<br/>\r\n&gt; she is like a princess<br/>\n<br/>\r\nplease also see <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> which is often used in the same sentence.<br/>\n<br/>\r\ncan a japanese native speaker please confirm this?"
    source_id: null
