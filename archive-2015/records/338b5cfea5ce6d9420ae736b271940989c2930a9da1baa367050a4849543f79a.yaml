  - position: 7
    credits_raw: ahbonk
    text: "According to my Kanzen Master book, the difference between かのようだ and just ようだ is that in the case of かのようだ, it's not actually true but it just seems like it.\n\n\n\r\nSo for example, if you see the boss' packed schedule this month, you can't say:\n\n\n\r\n社長は来月忙しいかのようだ。 x Wrong\n\r\n社長は来月忙しいようだ。 o Right\n\n\n\r\nHere's the excerpt from the book:\n\n\n\r\n（意味）　実際にはそうではないが、〜のようだ。"
    html: "According to my Kanzen Master book, the difference between かのようだ and just ようだ is that in the case of かのようだ, it's not actually true but it just seems like it.<br/>\n<br/>\r\nSo for example, if you see the boss' packed schedule this month, you can't say:<br/>\n<br/>\r\n社長は来月忙しいかのようだ。 x Wrong<br/>\r\n社長は来月忙しいようだ。 o Right<br/>\n<br/>\r\nHere's the excerpt from the book:<br/>\n<br/>\r\n（意味）　実際にはそうではないが、〜のようだ。"
    source_id: null
