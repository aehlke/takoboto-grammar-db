notes:
  - position: 0
    text: "Can't believe this got uploaded without anyone explaining its usage.  You have to ask yourself - if \"so...\" is all monodesukara means, why not simply use \"desukara\"?\n\n\n\r\nMonodesukara is used in situations where you're giving a reason why something couldn't be helped, usually something negative - a \x01 kind of situation.\n\n\n\r\nFor instance, if the dog ate your homework and you were explaining that to your teacher, you'd use monodesukara to finish up giving your reason.\n\n\n\r\nIt's used in cases where you're obviously conciliatory due to the unfortunate outcome, but humbly emphasizing that it wasn't your fault."
    html: "Can't believe this got uploaded without anyone explaining its usage.  You have to ask yourself - if \"so...\" is all monodesukara means, why not simply use \"desukara\"?<br/>\n<br/>\r\nMonodesukara is used in situations where you're giving a reason why something couldn't be helped, usually something negative - a <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> kind of situation.<br/>\n<br/>\r\nFor instance, if the dog ate your homework and you were explaining that to your teacher, you'd use monodesukara to finish up giving your reason.<br/>\n<br/>\r\nIt's used in cases where you're obviously conciliatory due to the unfortunate outcome, but humbly emphasizing that it wasn't your fault."
