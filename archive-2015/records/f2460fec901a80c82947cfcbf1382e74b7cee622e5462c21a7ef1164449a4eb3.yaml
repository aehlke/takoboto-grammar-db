    japanese: 病気の時は寝るに越したことはない。
    body_text: "病気の時は寝るに越したことはない。 \n\n\t\tWhen you are sick, sleeping is the best thing to do."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ病気の時は寝るに越したことはない。\">\n\t\t\t\t病気の時は寝るに越したことはない。<strong></strong><strong></strong></a> <br/>\n\t\tWhen you are sick, sleeping is the best thing to do. \n\t\t<strong> </strong>"
