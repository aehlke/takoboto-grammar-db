  - source_id: 6809
    position: 4
    japanese: 日本語が話せるようになりたかったら、日本へ行くに越したことはないと思うけれど、まずアメリカでちゃんと勉強してから行った方がいいと思います。
    body_text: "日本語が話せるようになりたかったら、日本へ行くに越したことはないと思うけれど、まずアメリカでちゃんと勉強してから行った方がいいと思います。 \n\n\t\tIf you want to become proficient in Japanese, \n\t\tthe best thing \n\t\tis to go to Japan, but I think you should first study properly [i.e. the basics] in America."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ日本語が話せるようになりたかったら、日本へ行くに越したことはないと思うけれど、まずアメリカでちゃんと勉強してから行った方がいいと思います。\">\n\t\t\t\t日本語が話せるようになりたかったら、日本へ行く<strong>に越したことはない</strong>と思うけれど、まずアメリカでちゃんと勉強してから行った方がいいと思います。<strong></strong></a> <br/>\n\t\tIf you want to become proficient in Japanese, \n\t\t<strong>the best thing </strong>\n\t\tis to go to Japan, but I think you should first study properly [i.e. the basics] in America."
