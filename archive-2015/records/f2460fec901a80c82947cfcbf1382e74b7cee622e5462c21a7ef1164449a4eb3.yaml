    japanese: 明日、雨が降らないと言っても、傘を持つに越したことは無い。
    body_text: "明日、雨が降らないと言っても、傘を持つに越したことは無い。 \n\n\t\tEven though they said it won't rain tomorrow, \n\t\tbetter to \n\t\thave your umbrella with you just in case."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ明日、雨が降らないと言っても、傘を持つに越したことは無い。\">\n\t\t\t\t明日、雨が降らないと言っても、傘を持つ<strong>に越したことは無い</strong>。<strong></strong></a> <br/>\n\t\tEven though they said it won't rain tomorrow, \n\t\t<strong>better to </strong>\n\t\thave your umbrella with you just in case."
