    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの仕事は経験がなくてもかまわないが、もちろんあるに越したことは無い。\">\n\t\t\t\tこの仕事は経験がなくてもかまわないが、もちろんある\r\n<strong>に越したことは無い</strong>。<strong></strong></a> <br/>\n\t\tThis job doesn't require experience but it would probably \n\t\t<strong>be an advantage. </strong>"
