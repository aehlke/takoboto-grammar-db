    annotation_text: "you    (よう　implies some kind of thinking by the user. \n\n\n\n\x01 = \n\r\n\"it would appear from the clouds, it will rain\" \n\n\n\r\nas opposed to \n\n\x01 = \n\r\n\"hmm, seems like its gonna rain\"\n\n\n\n\x01 =\n\r\n\"I guess it'll rain\") [dc]"
    annotation_html: "<a href=\"http://jgram.org/pages/viewOne.php?tagE=you\">you</a>    (よう　implies some kind of thinking by the user. <br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> = <br/>\r\n\"it would appear from the clouds, it will rain\" <br/>\n<br/>\r\nas opposed to <br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> = <br/>\r\n\"hmm, seems like its gonna rain\"<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> =<br/>\r\n\"I guess it'll rain\") [<a href=\"http://jgram.org/pages/contributions.php?author=dc\">dc</a>]"
