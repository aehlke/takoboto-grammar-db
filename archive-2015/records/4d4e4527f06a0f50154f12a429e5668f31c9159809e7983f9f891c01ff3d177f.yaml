comments:
  - position: 0
    credits_raw: Pan
    text: -らしい is used primarily in spoken Japanese. -ようだ often takes its place when written.
    html: -らしい is used primarily in spoken Japanese. -ようだ often takes its place when written.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: nathy1985
    text: "-らしい and -ようだ have different meanings. \n\n\n\r\nYou use -らしい as a similie when something is like something else, but is expected to be like that; for example：\n\n\n\r\n'that man doesn't act like a woman'　\n\r\nその男女らしくしていない\n\n\n\r\n-ようだ is used to make a similie with a condition we don't expect the thing to be like. For example \n\r\n'That human being acts like a cat'\n\r\nあの人間は猫のようにしている\n\n\n\r\nIf you mean to describe how something seems to be, they differ again, as -らしい is used to make an assumption based on what you've heard (usually from other people) and -ようだ is is used to make assumptions based on what you observe or from what you gather from first hand information.\n\n\n\r\nhope that helps clear things up a little :)"
    html: "-らしい and -ようだ have different meanings. <br/>\n<br/>\r\nYou use -らしい as a similie when something is like something else, but is expected to be like that; for example：<br/>\n<br/>\r\n'that man doesn't act like a woman'　<br/>\r\nその男女らしくしていない<br/>\n<br/>\r\n-ようだ is used to make a similie with a condition we don't expect the thing to be like. For example <br/>\r\n'That human being acts like a cat'<br/>\r\nあの人間は猫のようにしている<br/>\n<br/>\r\nIf you mean to describe how something seems to be, they differ again, as -らしい is used to make an assumption based on what you've heard (usually from other people) and -ようだ is is used to make assumptions based on what you observe or from what you gather from first hand information.<br/>\n<br/>\r\nhope that helps clear things up a little :)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: mattypaps
    text: "There is also another way to use rashi. When I was in Japan I learned it.\n\r\n大阪らしい、東京らしい\n\r\n近くに大阪らしい居酒屋がありますか。It means. Is there a oosaka style bar close by. Rashi in this case means something to do with style. I have also heard it means ish like oosakaish.子供らしい"
    html: "There is also another way to use rashi. When I was in Japan I learned it.<br/>\r\n大阪らしい、東京らしい<br/>\r\n近くに大阪らしい居酒屋がありますか。It means. Is there a oosaka style bar close by. Rashi in this case means something to do with style. I have also heard it means ish like oosakaish.子供らしい"
