    body_text: "今、自分が親にやってもらっていることをやらないといけないかと思うとぞっとします。 \n\nWhen I think that \n\t\tnow I may have to do those things my parents did for me it gives me the shivers."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今、自分が親にやってもらっていることをやらないといけないかと思うとぞっとします。\">\n\t\t\t\t今、自分が親にやってもらっていることをやらないといけない<strong>かと思うと</strong>ぞっとします。<strong></strong></a> <br/>\n<strong>When I think that </strong>\n\t\tnow I may have to do those things my parents did for me it gives me the shivers."
