    body_text: "これからこの状態が続くのかと思うと落ち込んでしまう。 \n\nWhen I think that \n\t\tthis state may continue from now on I get really depressed."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこれからこの状態が続くのかと思うと落ち込んでしまう。\">\n\t\t\t\tこれからこの状態が続くの<strong>かと思うと</strong>落ち込んでしまう。<strong></strong></a> <br/>\n<strong>When I think that </strong>\n\t\tthis state may continue from now on I get really depressed."
