  - position: 2
    credits_raw: dc
    text: often this is used when a second, contradicting thought follows.
    html: often this is used when a second, contradicting thought follows.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Amatuka
    text: "I don't think that last example is the same usage.  \n\r\nWhat the others have in common are \n\r\n1. Continuing, every time type occurrence (e.g. When [every time] I think X ...)\n\r\n2. The result is feeling / emotion related.\n\n\n\r\nThe third example is a) Past tense, once off.\n\r\nb) The second half of the sentence /isn't/ the result of the first.\n\r\nc) Isn't かおもうと but かおもったら"
    html: "I don't think that last example is the same usage.  <br/>\r\nWhat the others have in common are <br/>\r\n1. Continuing, every time type occurrence (e.g. When [every time] I think X ...)<br/>\r\n2. The result is feeling / emotion related.<br/>\n<br/>\r\nThe third example is a) Past tense, once off.<br/>\r\nb) The second half of the sentence /isn't/ the result of the first.<br/>\r\nc) Isn't かおもうと but かおもったら"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Exrulez
    text: "Kono joutai ha kono mama da to tsudzuku ka to omou to ochikonde shimau.\n\r\nWhen i think this situation might continue on like this i get really depressed.\n\r\nWhat do you guys think about how this sounds?\n\r\n(roomaji de Gomen ne ^^')"
