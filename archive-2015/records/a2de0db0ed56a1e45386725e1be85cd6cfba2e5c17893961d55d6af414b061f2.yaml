    annotation_text: "dakenokotohaaru    (\x01haaru and \x01 are the same, but with the sentence order reversed. thus \n\r\n\"このメロンはおいしい。高かっただけのことはある。\" is essentially the same as \n\r\n\"このメロンは高かっただけあって、おいしい。”\n\r\nboth meanings are basically: \n\r\n\"as you'd expect for a melon that was so expensive, this is delicious.\") [dc]"
    annotation_html: "<a href=\"http://jgram.org/pages/viewOne.php?tagE=dakenokotohaaru\">dakenokotohaaru</a>    (<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>haaru and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> are the same, but with the sentence order reversed. thus <br/>\r\n\"このメロンはおいしい。高かっただけのことはある。\" is essentially the same as <br/>\r\n\"このメロンは高かっただけあって、おいしい。”<br/>\r\nboth meanings are basically: <br/>\r\n\"as you'd expect for a melon that was so expensive, this is delicious.\") [<a href=\"http://jgram.org/pages/contributions.php?author=dc\">dc</a>]"
    credits_raw: dc
