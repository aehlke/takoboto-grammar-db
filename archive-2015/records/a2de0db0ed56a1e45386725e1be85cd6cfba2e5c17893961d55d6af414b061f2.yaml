notes:
  - position: 0
    text: "This phrase needs a cause and effect. \n\r\n\"cause \x01 effect\"\n\r\n\"He studied hard \x01 passed the test\"\n\n\n\r\nYou cannot use just the result\n\r\nNG: \"he \x01 passed the test\"\n\n\n\r\nVery similiar to \x01 but that word can be used on its own a little more casually, as in\n\r\n\"sasuga Rob-san\" = isn't Rob great, after all.\n\n\n\r\nWorks also for negative nuance, as in the \"and got fat\" example below."
    html: "This phrase needs a cause and effect. <br/>\r\n\"cause <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> effect\"<br/>\r\n\"He studied hard <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> passed the test\"<br/>\n<br/>\r\nYou cannot use just the result<br/>\r\nNG: \"he <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> passed the test\"<br/>\n<br/>\r\nVery similiar to <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> but that word can be used on its own a little more casually, as in<br/>\r\n\"sasuga Rob-san\" = isn't Rob great, after all.<br/>\n<br/>\r\nWorks also for negative nuance, as in the \"and got fat\" example below."
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "だけあって is used for good merits. It should not be used for negative nuances. However, だけに can be used for both good and bad merits.\n\n\n\r\nOften, さすが(に) is used in conjunction with だけあって as emphasis."
    html: "だけあって is used for good merits. It should not be used for negative nuances. However, だけに can be used for both good and bad merits.<br/>\n<br/>\r\nOften, さすが(に) is used in conjunction with だけあって as emphasis."
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
