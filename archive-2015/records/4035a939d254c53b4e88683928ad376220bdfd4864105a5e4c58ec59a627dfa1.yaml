    original_updated_at: null
  - source_id: 4906
    position: 3
    japanese: あの会社との契約はあってなきに等しいものです。
    body_text: "あの会社との契約はあってなきに等しいものです。 \r \n\n\t\tA contract with that company is worth next to nothing."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあの会社との契約はあってなきに等しいものです。 \">\n\t\t\t\tあの会社との契約はあってなき<strong>に等しい</strong>ものです。 \r<strong></strong></a> <br/>\n\t\tA contract with that company is worth next to nothing. \n\t\t<strong> </strong>"
