    original_updated_at: null
  - source_id: 4912
    position: 9
    japanese: 水と魚の関係は、空気と人間の関係に等しい。
    body_text: "水と魚の関係は、空気と人間の関係に等しい。 \r \n\n\t\tWater is to fish what air is to man."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ水と魚の関係は、空気と人間の関係に等しい。 \">\n\t\t\t\t水と魚の関係は、空気と人間の関係<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tWater is to fish what air is to man. \n\t\t<strong> </strong>"
