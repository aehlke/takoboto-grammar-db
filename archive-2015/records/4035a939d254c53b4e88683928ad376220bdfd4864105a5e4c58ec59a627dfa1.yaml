    original_updated_at: null
  - source_id: 4905
    position: 2
    japanese: あなたの返答はほとんど脅迫に等しい。
    body_text: "あなたの返答はほとんど脅迫に等しい。 \r \n\n\t\tYour answer almost amounts to a threat."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJあなたの返答はほとんど脅迫に等しい。 \">\n\t\t\t\tあなたの返答はほとんど脅迫<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tYour answer almost amounts to a threat. \n\t\t<strong> </strong>"
