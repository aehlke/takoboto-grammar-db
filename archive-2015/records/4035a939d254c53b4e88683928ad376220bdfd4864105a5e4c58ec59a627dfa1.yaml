  - source_id: 4904
    position: 1
    japanese: ３角形のすべての角の和は１８０度に等しい。
    body_text: "３角形のすべての角の和は１８０度に等しい。 \r \n\n\t\tAll the angles in a triangle are equal to 180 degrees."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ３角形のすべての角の和は１８０度に等しい。 \">\n\t\t\t\t３角形のすべての角の和は１８０度<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tAll the angles in a triangle are equal to 180 degrees. \n\t\t<strong> </strong>"
