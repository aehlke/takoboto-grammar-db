    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ本の心に対する関係は、食糧の体に対する関係に等しい。 \">\n\t\t\t\t本の心に対する関係は、食糧の体に対する関係<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tBooks are to the mind what food is to the body. \n\t\t<strong> </strong>"
