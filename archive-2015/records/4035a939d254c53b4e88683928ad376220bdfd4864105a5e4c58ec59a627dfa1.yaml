    body_text: "君の言葉はほとんど屈辱に等しい。 \r \n\n\t\tYour remark amounts almost to insult."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ君の言葉はほとんど屈辱に等しい。 \">\n\t\t\t\t君の言葉はほとんど屈辱<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tYour remark amounts almost to insult. \n\t\t<strong> </strong>"
