    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの地域の失業はほぼないに等しい。 \">\n\t\t\t\tこの地域の失業はほぼない<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tUnemployment in this part of the country is virtually nonexistent. \n\t\t<strong> </strong>"
