    body_text: "滑り出しが好調なら事は半ば成就したのに等しい。 \r \n\n\t\tWell begun is half done.[Proverb]"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ滑り出しが好調なら事は半ば成就したのに等しい。 \">\n\t\t\t\t滑り出しが好調なら事は半ば成就したの<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tWell begun is half done.[Proverb] \n\t\t<strong> </strong>"
