  - source_id: 4911
    position: 8
    japanese: 真実と科学者の関係は言葉と詩人の関係に等しいとしばしば言われてきた。
    body_text: "真実と科学者の関係は言葉と詩人の関係に等しいとしばしば言われてきた。 \r \n\n\t\tIt has often been said that facts are to the scientist what words are to the poet."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ真実と科学者の関係は言葉と詩人の関係に等しいとしばしば言われてきた。 \">\n\t\t\t\t真実と科学者の関係は言葉と詩人の関係<strong>に等しい</strong>としばしば言われてきた。 \r<strong></strong></a> <br/>\n\t\tIt has often been said that facts are to the scientist what words are to the poet. \n\t\t<strong> </strong>"
