  - source_id: 4913
    position: 10
    japanese: 読書と精神の関係は、食物と肉体の関係に等しい。
    body_text: "読書と精神の関係は、食物と肉体の関係に等しい。 \r \n\n\t\tReading is to the mind what food is to the body."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ読書と精神の関係は、食物と肉体の関係に等しい。 \">\n\t\t\t\t読書と精神の関係は、食物と肉体の関係<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tReading is to the mind what food is to the body. \n\t\t<strong> </strong>"
