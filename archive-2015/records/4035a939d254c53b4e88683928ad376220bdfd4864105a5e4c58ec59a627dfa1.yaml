    japanese: 彼を雇うことは誰も雇わないことに等しい。
    body_text: "彼を雇うことは誰も雇わないことに等しい。 \r \n\n\t\tEmploying him amount to employing nobody."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼を雇うことは誰も雇わないことに等しい。 \">\n\t\t\t\t彼を雇うことは誰も雇わないこと<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tEmploying him amount to employing nobody. \n\t\t<strong> </strong>"
