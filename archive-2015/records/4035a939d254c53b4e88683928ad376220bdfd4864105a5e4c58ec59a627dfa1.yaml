  - source_id: 4907
    position: 4
    japanese: この条件では拒絶に等しい。
    body_text: "この条件では拒絶に等しい。 \r \n\n\t\tThese conditions amount to refusal."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの条件では拒絶に等しい。 \">\n\t\t\t\tこの条件では拒絶<strong>に等しい</strong>。 \r<strong></strong></a> <br/>\n\t\tThese conditions amount to refusal. \n\t\t<strong> </strong>"
