  - source_id: 8610
    position: 1
    japanese: そういう噂からして、あの二人は近々結婚するだろう。
    body_text: "そういう噂からして、あの二人は近々結婚するだろう。 \n\nSince \n\t\tthat sort of rumor is going around, consequently, it's likely that those two will get married soon."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそういう噂からして、あの二人は近々結婚するだろう。\">\n\t\t\t\tそういう噂<strong>からして</strong>、あの二人は近々結婚するだろう。<strong></strong></a> <br/>\n<strong>Since </strong>\n\t\tthat sort of rumor is going around, consequently, it's likely that those two will get married soon."
