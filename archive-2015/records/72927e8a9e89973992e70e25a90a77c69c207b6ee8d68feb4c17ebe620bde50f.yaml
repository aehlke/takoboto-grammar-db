    japanese: 今年の収支は赤字であるからして、来年はなんとか黒字にしよう。
    body_text: "今年の収支は赤字であるからして、来年はなんとか黒字にしよう。 \n\n\t\tOur balance sheet is in the red this year; \n\t\tconsequently \n\t\t,let's try to somehow come out on top next year."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今年の収支は赤字であるからして、来年はなんとか黒字にしよう。\">\n\t\t\t\t今年の収支は赤字である<strong>からして</strong>、来年はなんとか黒字にしよう。<strong></strong></a> <br/>\n\t\tOur balance sheet is in the red this year; \n\t\t<strong>consequently </strong>\n\t\t,let's try to somehow come out on top next year."
    credits_raw: leonardo.stylish
