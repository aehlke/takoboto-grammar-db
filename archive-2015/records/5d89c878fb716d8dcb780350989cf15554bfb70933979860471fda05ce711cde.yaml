  - position: 1
    text: "「ＡないことにはＢ(ない)」: A is a requirement in order to do B.\n\n\n\r\nFORMATION:\n\r\nＶない + ことには\n\r\nいＡ(minus い) + くないことには\n\r\nなＡ・Ｎ + でないことには"
