    text: "ex3235 Japanese is somewhat unnatural.Also I feel politeness is inconsistent.\n\r\nI prefer this \"鈴鹿での買い物に勝るものはないと思う。\" But to use くらい、、、はない　how about this?\n\r\n鈴鹿に買い物に行くくらいいいものはない。でも、今では高くなったよ。とにかく、今度の週末（今週末）行こうか。"
    html: "ex3235 Japanese is somewhat unnatural.Also I feel politeness is inconsistent.<br/>\r\nI prefer this \"鈴鹿での買い物に勝るものはないと思う。\" But to use くらい、、、はない　how about this?<br/>\r\n鈴鹿に買い物に行くくらいいいものはない。でも、今では高くなったよ。とにかく、今度の週末（今週末）行こうか。<br/>"
