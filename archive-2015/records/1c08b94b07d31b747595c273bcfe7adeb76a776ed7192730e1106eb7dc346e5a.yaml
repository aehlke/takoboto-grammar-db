    japanese: 専門家ならいざ知らず、素人ではこの化学品を作ることができない。
    body_text: "専門家ならいざ知らず、素人ではこの化学品を作ることができない。 \n\n\t\tMaybe it's possible for an expert, but a beginner can't make this chemical."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ専門家ならいざ知らず、素人ではこの化学品を作ることができない。\">\n\t\t\t\t専門家<strong>ならいざ知らず</strong>、素人ではこの化学品を作ることができない。<strong></strong></a> <br/>\n\t\tMaybe it's possible for an expert, but a beginner can't make this chemical. \n\t\t<strong> </strong>"
