  - position: 11
    credits_raw: tigert
    text: "how about this for a simpler explanation. the verb 見せる means to show. so してみせる　could best be translated as I will see (because I will show you). \n\n\n\r\nEx\n\n\n\r\n今年、僕は大学を卒業してみせる｡\n\r\nYou will see, This year I will graduate."
