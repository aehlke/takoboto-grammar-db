  - position: 8
    credits_raw: skottt
    text: "This is a tricky one. I think that the translation into \"I'll show you\" is good - except that you wouldn't really say that in English.\n\r\nIt is a form used when you have something to prove, or the desire to show someone that you can/will do (whatever).\n\r\nThat said, in English there is no set phrase commonly uttered aloud to express that feeling.\n\r\n(Other than \"I'll show you/him/her/them!\", but that is more often said to one's self, rather than to another.\n\r\nCompare \n\r\nりんごを食べる！　\n\r\n- I will eat an apple\n\n\n\r\nりんごを食べてみせる！\n\r\n- I will eat an apple (*while thinking* ...and show you! You said I couldn't, so this will show you how wrong you are!)"
    html: "This is a tricky one. I think that the translation into \"I'll show you\" is good - except that you wouldn't really say that in English.<br/>\r\nIt is a form used when you have something to prove, or the desire to show someone that you can/will do (whatever).<br/>\r\nThat said, in English there is no set phrase commonly uttered aloud to express that feeling.<br/>\r\n(Other than \"I'll show you/him/her/them!\", but that is more often said to one's self, rather than to another.<br/>\r\nCompare <br/>\r\nりんごを食べる！　<br/>\r\n- I will eat an apple<br/>\n<br/>\r\nりんごを食べてみせる！<br/>\r\n- I will eat an apple (*while thinking* ...and show you! You said I couldn't, so this will show you how wrong you are!)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: Televangelist
    text: "There are plenty of good translations in English.\n\n\n\r\nThe phrases \"Just you wait!\" and \"You'll see!\" pop immediately to mind, in terms of phrases you can use when you've got something to prove.\n\n\n\r\nThe only difference?  It's not in vogue in America to directly convey that you have something to prove -- has a bit of the air of a children's cartoon.  \n\n\n\r\nAs a result, both of the phrases above, while a good translation, are mostly only used in a silly or archaic fashion in English.\n\n\n\r\nFor instance, when I make fun of my girlfriend, she always replies defiantly, \"One day I'll show you, you big lout!\"\n\n\n\r\nYou could translate that to \"Itsuka Utte miseru!\" (The \"utsu\" verb for exacting revenge, I forget the kanji)\n\n\n\r\nIt's archaic language used to convey a silly effect, not because the words are \"old fashioned\" but because the *feeling behind them* isn't one that English speakers like to directly express."
    html: "There are plenty of good translations in English.<br/>\n<br/>\r\nThe phrases \"Just you wait!\" and \"You'll see!\" pop immediately to mind, in terms of phrases you can use when you've got something to prove.<br/>\n<br/>\r\nThe only difference?  It's not in vogue in America to directly convey that you have something to prove -- has a bit of the air of a children's cartoon.  <br/>\n<br/>\r\nAs a result, both of the phrases above, while a good translation, are mostly only used in a silly or archaic fashion in English.<br/>\n<br/>\r\nFor instance, when I make fun of my girlfriend, she always replies defiantly, \"One day I'll show you, you big lout!\"<br/>\n<br/>\r\nYou could translate that to \"Itsuka Utte miseru!\" (The \"utsu\" verb for exacting revenge, I forget the kanji)<br/>\n<br/>\r\nIt's archaic language used to convey a silly effect, not because the words are \"old fashioned\" but because the *feeling behind them* isn't one that English speakers like to directly express."
    source_id: null
    original_created_at: null
