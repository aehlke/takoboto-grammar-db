    japanese: 外相は「真の相互理解に基づく関係は、領土問題を解決して平和条約を締結することなしには構築し得ない」
    body_text: "外相は「真の相互理解に基づく関係は、領土問題を解決して平和条約を締結することなしには構築し得ない」 \n\n\t\tThe foreign minister said \"a relationship built on genuine mutual understanding means that \n\t\twithout \n\t\tsolving the territorial dispute and completing the peace treaty, we cannot secure construction works\""
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ外相は「真の相互理解に基づく関係は、領土問題を解決して平和条約を締結することなしには構築し得ない」\">\n\t\t\t\t外相は「真の相互理解に基づく関係は、領土問題を解決して平和条約を締結する<strong>ことなしには</strong>構築し得ない」<strong></strong></a> <br/>\n\t\tThe foreign minister said \"a relationship built on genuine mutual understanding means that \n\t\t<strong>without </strong>\n\t\tsolving the territorial dispute and completing the peace treaty, we cannot secure construction works\""
