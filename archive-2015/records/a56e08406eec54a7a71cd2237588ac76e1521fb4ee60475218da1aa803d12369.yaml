    body_text: "担当教師の許可を得ることなしに、履修科目の変更はできない。 \n\nWithout \n\t\tthe permission of the teacher in charge, you may not change your registered classes."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ担当教師の許可を得ることなしに、履修科目の変更はできない。\">\n\t\t\t\t担当教師の許可を得る<strong>ことなしに</strong>、履修科目の変更はできない。<strong></strong></a> <br/>\n<strong>Without </strong>\n\t\tthe permission of the teacher in charge, you may not change your registered classes."
