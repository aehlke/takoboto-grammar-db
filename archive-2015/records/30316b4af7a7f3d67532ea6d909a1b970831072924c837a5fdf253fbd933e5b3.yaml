comments:
  - position: 0
    credits_raw: KWhazit
    text: "Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (#\x01), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.\n\n\n\r\nI also have to call #\x01 and #\x01 into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me."
    html: "Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=tte%20ba#\x01\">#\x01</a></b>), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.<br/>\n<br/>\r\nI also have to call <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=tte%20ba#\x01\">#\x01</a></b> and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=tte%20ba#\x01\">#\x01</a></b> into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: cone
    text: |-
      One of my Japanese mentors says that ってば actually sounds sort of feminine, I forget why exactly, though.  Adding よ to the end of ってば, as in what Naruto says, is probably just a way to make ってば sound more masculine.
