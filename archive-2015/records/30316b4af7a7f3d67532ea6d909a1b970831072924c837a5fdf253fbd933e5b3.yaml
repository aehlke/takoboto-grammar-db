notes:
  - position: 0
    text: "It is used to emphasize speakers emotion/desire/will, and is not used in formal speeches but in casual conversations. Something like よ(yo) but far stronger.\n\n\n\r\nIt follows the +tte (って）short cut for と言う"
    html: "It is used to emphasize speakers emotion/desire/will, and is not used in formal speeches but in casual conversations. Something like よ(yo) but far stronger.<br/>\n<br/>\r\nIt follows the +tte (って）short cut for と言う<br/>"
