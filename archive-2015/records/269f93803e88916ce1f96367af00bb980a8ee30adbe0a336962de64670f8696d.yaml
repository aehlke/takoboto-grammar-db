    japanese: 昨日からの雨がようやくやんだが、運動場はまだぬれていた。試合を終えたサッカー三種の顔はみんな泥だらけだ。
    body_text: "昨日からの雨がようやくやんだが、運動場はまだぬれていた。試合を終えたサッカー三種の顔はみんな泥だらけだ。 \n\n\t\tIt was raining since yesterday, and the sports ground was still wet. When the contest finished, the faces of the three soccer team players were \n\t\tcovered with \nmud."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ昨日からの雨がようやくやんだが、運動場はまだぬれていた。試合を終えたサッカー三種の顔はみんな泥だらけ\">\n\t\t\t\t昨日からの雨がようやくやんだが、運動場はまだぬれていた。試合を終えたサッカー三種の顔はみんな泥<strong>だらけ</strong><strong></strong>だ。</a> <br/>\n\t\tIt was raining since yesterday, and the sports ground was still wet. When the contest finished, the faces of the three soccer team players were \n\t\t<strong>covered with </strong>\nmud."
