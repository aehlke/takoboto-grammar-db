notes:
  - position: 0
    text: "だらけ refers to bad things or objects, such as \"mistakes,\" \"garbage,\" etc. It is only used after nouns, but can be used in one of two ways.\n\n\n\r\nN + だらけ\n\r\n1. 「Aは(が)Bだらけだ」:　部屋はゴミだらけだ。\n\r\n2. 「BだらけのA」: ゴミだらけの部屋\n\r\n*Note that the 2nd use is not a complete sentence."
    html: "だらけ refers to bad things or objects, such as \"mistakes,\" \"garbage,\" etc. It is only used after nouns, but can be used in one of two ways.<br/>\n<br/>\r\nN + だらけ<br/>\r\n1. 「Aは(が)Bだらけだ」:　部屋はゴミだらけだ。<br/>\r\n2. 「BだらけのA」: ゴミだらけの部屋<br/>\r\n*Note that the 2nd use is not a complete sentence."
    credits_raw: rubyhatchet
