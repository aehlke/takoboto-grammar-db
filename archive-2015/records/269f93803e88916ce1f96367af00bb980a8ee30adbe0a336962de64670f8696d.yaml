    japanese: 私には、世界のあちこちに友達がいて、絵葉書を送ってくれる。そういう絵葉書を壁にはり始めたところ、それが、いつのまにかものすごい数になった。今や壁という壁が絵葉書だらけになってしまった。
    body_text: "私には、世界のあちこちに友達がいて、絵葉書を送ってくれる。そういう絵葉書を壁にはり始めたところ、それが、いつのまにかものすごい数になった。今や壁という壁が絵葉書だらけになってしまった。 \n\n\t\tAs I have friends here and there in the world, I receive the picture postcards they send to me. Once, I began to pin such postcards in a wall. Without even noticing it, they increased in number to a great extent. Now, the wall we are speaking about is definitely \n\t\tcovered with \npostcards."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私には、世界のあちこちに友達がいて、絵葉書を送ってくれる。そういう絵葉書を壁にはり始めたところ、それが、いつのまにかものすごい数になった。今や壁という壁が絵葉書だらけ\">\n\t\t\t\t私には、世界のあちこちに友達がいて、絵葉書を送ってくれる。そういう絵葉書を壁にはり始めたところ、それが、いつのまにかものすごい数になった。今や壁という壁が絵葉書<strong>だらけ</strong><strong></strong>になってしまった。</a> <br/>\n\t\tAs I have friends here and there in the world, I receive the picture postcards they send to me. Once, I began to pin such postcards in a wall. Without even noticing it, they increased in number to a great extent. Now, the wall we are speaking about is definitely \n\t\t<strong>covered with </strong>\npostcards."
