  - position: 1
    credits_raw: dc
    text: "According to EdJacob's page, there is not the meaning of \n\r\n \"just because of a small thing\" it is simply \n\r\n \"just - negative\" :\n\n\n\r\nBecause. Always indicates a negative outcome. \n\r\nI failed the  test because I didn’t study.\n\r\nI don’t have any money because I bought a new car.\n\nsee bakarini here"
    html: "According to EdJacob's page, there is not the meaning of <br/>\r\n \"just because of a small thing\" it is simply <br/>\r\n \"just - negative\" :<br/>\n<br/>\r\nBecause. Always indicates a negative outcome. <br/>\r\nI failed the  test because I didn’t study.<br/>\r\nI don’t have any money because I bought a new car.<br/>\n<a href=\"http://www.geocities.com/easykanji/jlptgrammar.html\">see bakarini here</a>"
    source_id: null
