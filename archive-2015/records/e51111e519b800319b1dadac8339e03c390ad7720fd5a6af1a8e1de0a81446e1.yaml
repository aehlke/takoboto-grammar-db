  - position: 9
    credits_raw: 誠
    text: "TC さん、\n\r\n〜ばかりに　and 〜ばこそ　is different. \n\r\n〜ばかりに　can be said as \"just because of 〜、.....(followed by negative consequences)\"\n\r\nWhereas,\n\r\n〜ばこそ can be said as \" exactly because of　〜、that is why........\"\n\r\nYou can refer to more examples in the entry of ばこそ。"
    html: "TC さん、<br/>\r\n〜ばかりに　and 〜ばこそ　is different. <br/>\r\n〜ばかりに　can be said as \"just because of 〜、.....(followed by negative consequences)\"<br/>\r\nWhereas,<br/>\r\n〜ばこそ can be said as \" exactly because of　〜、that is why........\"<br/>\r\nYou can refer to more examples in the entry of ばこそ。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: leslie
    text: "Is ばかりに the same as ばかりで?\n\n\n\r\n例：物価は上がるばかりで生活は少しも楽にならない。"
    html: "Is ばかりに the same as ばかりで?<br/>\n<br/>\r\n例：物価は上がるばかりで生活は少しも楽にならない。<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: bamboo4
    text: "Generally, ばかり has the connotation of limiting something and not going beyond. ばかりに therefore means \"because so limited,\" and ばかりで means \"not going beyond that limit.\" \n\r\nAccordingly, 物価は上がるばかりで would mean \"since the commodity prices only go up...\""
    html: "Generally, ばかり has the connotation of limiting something and not going beyond. ばかりに therefore means \"because so limited,\" and ばかりで means \"not going beyond that limit.\" <br/>\r\nAccordingly, 物価は上がるばかりで would mean \"since the commodity prices only go up...\""
    source_id: null
    original_created_at: null
    original_updated_at: null
