  - source_id: 7947
    position: 4
    japanese: 高齢化が進むにつれ、認知症老人の介護が問題になっているが、これかれは、介護のこともさることながらぼけをいかに予防するかがさらに重要だ。
    body_text: "高齢化が進むにつれ、認知症老人の介護が問題になっているが、これかれは、介護のこともさることながらぼけをいかに予防するかがさらに重要だ。 \n\n\t\tAs the population has aged, the care of senile seniors has become a problem. \n\t\tIt is true that \n\t\tfrom now on care will be an important issue, but the question of how to prevent people from becoming senile is more important."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ高齢化が進むにつれ、認知症老人の介護が問題になっているが、これかれは、介護のこともさることながらぼけをいかに予防するかがさらに重要だ。\">\n\t\t\t\t高齢化が進むにつれ、認知症老人の介護が問題になっているが、これかれは、介護のこと<strong>もさることながら</strong>ぼけをいかに予防するかがさらに重要だ。<strong></strong></a> <br/>\n\t\tAs the population has aged, the care of senile seniors has become a problem. \n\t\t<strong>It is true that </strong>\n\t\tfrom now on care will be an important issue, but the question of how to prevent people from becoming senile is more important."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7948
    position: 5
    japanese: 歌のうまさもさることながら彼女はピアノの名手なんです。
    body_text: "歌のうまさもさることながら彼女はピアノの名手なんです。\r \n\n\t\tShe is of course a skilled singer, but more significantly she is a master pianist."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ歌のうまさもさることながら彼女はピアノの名手なんです。\">\n\t\t\t\t歌のうまさ<strong>もさることながら</strong>彼女はピアノの名手なんです。\r<strong></strong></a> <br/>\n\t\tShe is of course a skilled singer, but more significantly she is a master pianist. \n\t\t<strong> </strong>"
    credits_raw: LR
