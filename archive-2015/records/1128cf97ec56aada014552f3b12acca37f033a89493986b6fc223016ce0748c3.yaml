  - source_id: 7949
    position: 6
    japanese: 会話の練習では、話すこともさることながら、確実に聞き取ることが重要です。
    body_text: "会話の練習では、話すこともさることながら、確実に聞き取ることが重要です。\r \n\n\t\tWhen it comes to practicing conversation, speaking is obviously important, but moreover making sure you follow what is being said is essential."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ会話の練習では、話すこともさることながら、確実に聞き取ることが重要です。\">\n\t\t\t\t会話の練習では、話すこと<strong>もさることながら</strong>、確実に聞き取ることが重要です。\r<strong></strong></a> <br/>\n\t\tWhen it comes to practicing conversation, speaking is obviously important, but moreover making sure you follow what is being said is essential. \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7950
    position: 7
    japanese: この合作映画は、作品の完成度の高さもさることながら、文化の異なるにこくが協力して一つの映画を完成させたという事実が非常に意義深い。
    body_text: "この合作映画は、作品の完成度の高さもさることながら、文化の異なるにこくが協力して一つの映画を完成させたという事実が非常に意義深い。\r \n\n\t\tThis jointluy produced movie is highly polished, but more importantly, the fact that two countries worked together and completed a film is in and of itself quite significant"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの合作映画は、作品の完成度の高さもさることながら、文化の異なるにこくが協力して一つの映画を完成させたという事実が非常に意義深い。\">\n\t\t\t\tこの合作映画は、作品の完成度の高さ<strong>もさることながら</strong>、文化の異なるにこくが協力して一つの映画を完成させたという事実が非常に意義深い。\r<strong></strong></a> <br/>\n\t\tThis jointluy produced movie is highly polished, but more importantly, the fact that two countries worked together and completed a film is in and of itself quite significant \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
