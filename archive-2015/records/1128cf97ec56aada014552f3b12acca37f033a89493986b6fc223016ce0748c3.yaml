  - source_id: 7946
    position: 3
    japanese: この図書館は蔵書の多さもさることながらサービスが実にすばらしい。
    body_text: "この図書館は蔵書の多さもさることながらサービスが実にすばらしい。\r \n\n\t\tThis library's large collection of books is one thing, but the services they provide are really wonderful."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの図書館は蔵書の多さもさることながらサービスが実にすばらしい。\">\n\t\t\t\tこの図書館は蔵書の多さ<strong>もさることながら</strong>サービスが実にすばらしい。\r<strong></strong></a> <br/>\n\t\tThis library's large collection of books is one thing, but the services they provide are really wonderful. \n\t\t<strong> </strong>"
    credits_raw: LR
