      もさることながら (も然る事乍ら) ([もさることながら] )(mosarukotonagara)
          Meaning: is (such) but (____) is also 〜もそうだが、そればかりでなく。前のことも勿論だが、後のことの方がもっと度合いが強いということを表す。
          Example: of course talent is important but practice cannot be neglected
