    japanese: アメリカではバスケもさることながらアメフトも人気だ
    body_text: "アメリカではバスケもさることながらアメフトも人気だ \n\n\t\tIn America, Basketball is clearly popular but so is Football."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJアメリカではバスケもさることながらアメフトも人気だ\">\n\t\t\t\tアメリカではバスケ<strong>もさることながら</strong>アメフトも人気だ<strong></strong></a> <br/>\n\t\tIn America, Basketball is clearly popular but so is Football. \n\t\t<strong> </strong>"
    credits_raw: danie115
