    japanese: 両親の意向もさることながら、子供自身が有名校にあこがれている。
    body_text: "両親の意向もさることながら、子供自身が有名校にあこがれている。 \n\nNot only \n\t\tintention of the parents, the child himself has yearned to the famous school."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ両親の意向もさることながら、子供自身が有名校にあこがれている。\">\n\t\t\t\t両親の意向<strong>もさることながら</strong>、子供自身が有名校にあこがれている。<strong></strong></a> <br/>\n<strong>Not only </strong>\n\t\tintention of the parents, the child himself has yearned to the famous school."
