  - position: 4
    credits_raw: bi-ru
    text: "As I found on (Takasugi Shinji's site) - contrast the difference of -tekuru and -teiku in the following:\n\n\n\r\n物価が下がっていく。\n\r\n物価が下がってくる。\n\n\n\r\nBoth mean that prices continue to fall. Both tekuru and teiku indicate continuation in this example. However teiku implies motion away from, whereas tekuru implies motion towards.\n\n\n\r\nYou think prices are going away from you in sentence 1, such as when you don't like the trend. You think prices are approaching you in sentence 2, such as when you like it."
    html: "As I found on (Takasugi Shinji's site) - contrast the difference of -tekuru and -teiku in the following:<br/>\n<br/>\r\n物価が下がっていく。<br/>\r\n物価が下がってくる。<br/>\n<br/>\r\nBoth mean that prices continue to fall. Both tekuru and teiku indicate continuation in this example. However teiku implies motion away from, whereas tekuru implies motion towards.<br/>\n<br/>\r\nYou think prices are going away from you in sentence 1, such as when you don't like the trend. You think prices are approaching you in sentence 2, such as when you like it."
    source_id: null
