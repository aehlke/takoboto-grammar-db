  - position: 3
    credits_raw: agiprasetiadi
    text: "But, sometime I found like this, 一人で来なくば、この剣を壊していくんだよ. Is this sentence means like that (about conditional)?\n\n\n\r\nSorry, my english is not good."
    html: "But, sometime I found like this, 一人で来なくば、この剣を壊していくんだよ. Is this sentence means like that (about conditional)?<br/>\n<br/>\r\nSorry, my english is not good."
    source_id: null
