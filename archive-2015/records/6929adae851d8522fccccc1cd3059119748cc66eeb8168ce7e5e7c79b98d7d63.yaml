    text: |-
      i have a question regarding the Past Conditional (-たら).. how does this work for verbs ending in -ぐ, -ぬ, -む, and -ぶ?? since their past tenses end in -だ, do you have to change anything or just add -ら??
    html: |-
      i have a question regarding the Past Conditional (-たら).. how does this work for verbs ending in -ぐ, -ぬ, -む, and -ぶ?? since their past tenses end in -だ, do you have to change anything or just add -ら??
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: agiprasetiadi
    text: 'Yeah, it''s working. Ex: 学んだらいいと思うよ.'
