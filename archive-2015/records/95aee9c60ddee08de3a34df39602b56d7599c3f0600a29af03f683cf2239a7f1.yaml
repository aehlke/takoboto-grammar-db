  - position: 1
    text: "formation: take the negative root (ない形）and replace the final ~ない　with ~ず\n\n\n\r\n例）\n\n\n\r\n　　書く　-> 書か「ない」 -> 書かず（に）\n\r\n　　見る　->　 見「ない」 -> 見ず\n\r\n　　来る　-> 来ず　（読み方：こず）\n\r\n　　する　-> せず　　\n\n\n\r\nCompared to the \"naide\" form, this one is used with a more negative connection to the thing you didn't do (as you would regret that you didn't do something). \n\n\n\r\n例）\n\n\n\r\n昨日学校へ行かず、ゲームセンターで遊んでしまった。"
    html: "formation: take the negative root (ない形）and replace the final ~ない　with ~ず<br/>\n<br/>\r\n例）<br/>\n<br/>\r\n　　書く　-&gt; 書か「ない」 -&gt; 書かず（に）<br/>\r\n　　見る　-&gt;　 見「ない」 -&gt; 見ず<br/>\r\n　　来る　-&gt; 来ず　（読み方：こず）<br/>\r\n　　する　-&gt; せず　　<br/>\n<br/>\r\nCompared to the \"naide\" form, this one is used with a more negative connection to the thing you didn't do (as you would regret that you didn't do something). <br/>\n<br/>\r\n例）<br/>\n<br/>\r\n昨日学校へ行かず、ゲームセンターで遊んでしまった。"
    credits_raw: maki
    source_id: null
