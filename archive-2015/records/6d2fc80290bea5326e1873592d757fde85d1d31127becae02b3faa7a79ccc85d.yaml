    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ眩しいというのは目をあけていられない\">\n\t\t\t\t眩しいというのは目をあけて<strong>いられない</strong><strong></strong>ほど光が強い様子だ。</a> <br/>\n\t\tDazzling is the state when light is so hard that you almost \n\t\t<strong>can't keep </strong>\n\t\t  the eyes open."
