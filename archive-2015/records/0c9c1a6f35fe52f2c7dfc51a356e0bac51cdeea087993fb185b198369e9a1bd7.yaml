comments:
  - position: 0
    credits_raw: Gren
    text: "Hi! If anyone can correct these, I`d appreciate it. I ran into example #\x01`s 「くれないか　い」form and wondered what in the heck the い　is.  No one seems to know, however, I do know that it is only used in spoken Japanese."
    html: "Hi! If anyone can correct these, I`d appreciate it. I ran into example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=kureru#\x01\">#\x01</a></b>`s 「くれないか　い」form and wondered what in the heck the い　is.  No one seems to know, however, I do know that it is only used in spoken Japanese."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "This entry \x01 may help you."
    html: "This entry <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> may help you."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: tigert
    text: "This grammar point not correct. くれる means to be given. It cannot mean to give. because くれる　is only used for things you are given or your inner family　(うち) are given. if you wanted to say someone gave someone other than your うち something you would use あげる.\n\n\n\r\nmy teacher taught my friend english.\n\r\n僕の先生が僕の友達に英語を教えてあげました.\n\n\n\r\nI gave my neighbor a gift.\n\r\n僕は　となりの人にギフトをあげました.\n\n\n\r\nJim loaned me $50.(did the favor of loaning)\n\r\nジムさんは　僕に　五十ドルを貸してくれました.\n\n\n\r\nJim loaned lee $50. (Jim did lee the favor of　loaning)\n\r\nジムさんはリーさんに五十ドルを貸してあげました."
    html: "This grammar point not correct. くれる means to be given. It cannot mean to give. because くれる　is only used for things you are given or your inner family　(うち) are given. if you wanted to say someone gave someone other than your うち something you would use あげる.<br/>\n<br/>\r\nmy teacher taught my friend english.<br/>\r\n僕の先生が僕の友達に英語を教えてあげました.<br/>\n<br/>\r\nI gave my neighbor a gift.<br/>\r\n僕は　となりの人にギフトをあげました.<br/>\n<br/>\r\nJim loaned me $50.(did the favor of loaning)<br/>\r\nジムさんは　僕に　五十ドルを貸してくれました.<br/>\n<br/>\r\nJim loaned lee $50. (Jim did lee the favor of　loaning)<br/>\r\nジムさんはリーさんに五十ドルを貸してあげました."
    source_id: null
