  - source_id: 1127
    position: 1
    japanese: 太郎は花子の行方を追って山に登りはじめた。今はそれはさておき、花子はそのとき東京行きの高速バスの上だった
    body_text: "太郎は花子の行方を追って山に登りはじめた。今はそれはさておき、花子はそのとき東京行きの高速バスの上だった \n\n\t\tIn pursuit of Hanako, Taro started to climb the mountain. \n\t\tLeaving that aside \n\t\tfor the moment, Hanako at that moment was on a highway bus heading out to Tokyo."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ太郎は花子の行方を追って山に登りはじめた。今はそれはさておき、花子はそのとき東京行きの高速バスの上だった\">\n\t\t\t\t太郎は花子の行方を追って山に登りはじめた。今は<strong>それはさておき、</strong>花子はそのとき東京行きの高速バスの上だった<strong></strong></a> <br/>\n\t\tIn pursuit of Hanako, Taro started to climb the mountain. \n\t\t<strong>Leaving that aside </strong>\n\t\tfor the moment, Hanako at that moment was on a highway bus heading out to Tokyo."
    credits_raw: bamboo4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3388
    position: 2
    japanese: それはさておき、他に必要なものはないか。
    body_text: "それはさておき、他に必要なものはないか。\r \n\n\t\tAside from that, is there anything else you want?"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJそれはさておき、他に必要なものはないか。\">\n<strong>それはさておき</strong>、他に必要なものはないか。\r<strong></strong></a> <br/>\n\t\tAside from that, is there anything else you want? \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5858
    position: 3
    japanese: 金の問題はさておき、そういう旅行は疲れるよ。
    body_text: "金の問題はさておき、そういう旅行は疲れるよ。 \n\nLeaving aside \n\t\tthe money problem, this trip would be very tiring."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ金の問題はさておき、そういう旅行は疲れるよ。\">\n\t\t\t\t金の問題<strong>はさておき</strong>、そういう旅行は疲れるよ。<strong></strong></a> <br/>\n<strong>Leaving aside </strong>\n\t\tthe money problem, this trip would be very tiring."
    credits_raw: 誠
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5859
    position: 4
    japanese: 仕事の話はさておき、今日は思い切り楽しみましょう。
    body_text: "仕事の話はさておき、今日は思い切り楽しみましょう。 \n\nLeaving aside \n\t\ttopics about work, today let's us enjoy to our hearts' content"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ仕事の話はさておき、今日は思い切り楽しみましょう。\">\n\t\t\t\t仕事の話<strong>はさておき、</strong>今日は思い切り楽しみましょう。<strong></strong></a> <br/>\n<strong>Leaving aside </strong>\n\t\ttopics about work, today let's us enjoy to our hearts' content"
    credits_raw: 誠
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6062
    position: 5
    japanese: 文句を言いがちはさておき、彼女は優しい人です。
    body_text: "文句を言いがちはさておき、彼女は優しい人です。 \n\nDespite \n\t\tthe fact that she complains a　lot, she is a sweet person."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ文句を言いがちはさておき、彼女は優しい人です。\">\n\t\t\t\t文句を言いがち<strong>はさておき</strong>、彼女は優しい人です。<strong></strong></a> <br/>\n<strong>Despite </strong>\n\t\tthe fact that she complains a　lot, she is a sweet person."
    credits_raw: KansaiAiko
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 8177
    position: 6
    japanese: 何はさておき月曜日の朝一番にいらっしゃい。
    body_text: "何はさておき月曜日の朝一番にいらっしゃい。 \n\n\t\tCome to me (the) first thing on Monday morning."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ何はさておき月曜日の朝一番にいらっしゃい。\">\n\t\t\t\t何<strong>はさておき</strong>月曜日の朝一番にいらっしゃい。<strong></strong></a> <br/>\n\t\tCome to me (the) first thing on Monday morning. \n\t\t<strong> </strong>"
