  - position: 4
    credits_raw: yookoso
    text: "I saw the following explanation of the difference between kara and node on a mailing list today: \n\n\n\r\nThe conjunction \"kara\" and \"node\" both express reason or cause. While \"kara\" is used for reason or cause of a speaker's volition, opinion and so on, \"node\" is for existing (existed) action or situation.\n\r\n- Kino wa samukatta node uchi ni imashita. Since it was cold, I stayed home.\n\r\n- Atama ga itakatta node gakkou o yasunda. Since I had a headache, I didn't go to school. \n\r\n- Totemo shizukadatta node yoku nemuremashita. Since it was very quiet, I could sleep well.\n\r\n- Yoku benkyou shita node shiken ni goukaku shita. Since I studied hard, I passed the examination.\n\n\n\r\nThe sentences expressing personal judgment such as speculation, suggestion, intention, request, opinion, volition, invitation, and so forth must take \"kara.\"\n\r\n- Kono kawa wa kitanai kara tabun sakana wa inai deshou. Since this river is polluted, there is probably no fish. \n\r\n- Mou osoi kara hayaku nenasai. Go to bed, since it is getting late.\n\r\n- Kono hon wa totemo omoshiroi kara yonda hou ga ii. This book is very interesting, so you'd better to read it.\n\r\n- Kono kuruma wa furui kara atarashi kuruma ga hoshii desu. This car is old, so I want a new car.\n\n\n\r\nWhile \"kara\" focuses more on the reason, \"node\" focuses more on the resulting effect. This is why the \"kara\" clause is used independently more often than \"node\".\n\r\n- Doushite okureta no. Why were you late?\n\r\n- Densha ni nori okureta kara. Because I missed the train.\n\n\n\r\n\"Kara\" can be immediately followed by \"~ desu.\"\n\r\n- Atama ga itakatta kara desu. Because I had a headache. (OK)\n\r\n- Atama ga itakatta node desu. Because I had a headache. (Not OK = Wrong)\n\n\n\r\nAny comments, corrections?"
    html: "I saw the following explanation of the difference between kara and node on a mailing list today: <br/>\n<br/>\r\nThe conjunction \"kara\" and \"node\" both express reason or cause. While \"kara\" is used for reason or cause of a speaker's volition, opinion and so on, \"node\" is for existing (existed) action or situation.<br/>\r\n- Kino wa samukatta node uchi ni imashita. Since it was cold, I stayed home.<br/>\r\n- Atama ga itakatta node gakkou o yasunda. Since I had a headache, I didn't go to school. <br/>\r\n- Totemo shizukadatta node yoku nemuremashita. Since it was very quiet, I could sleep well.<br/>\r\n- Yoku benkyou shita node shiken ni goukaku shita. Since I studied hard, I passed the examination.<br/>\n<br/>\r\nThe sentences expressing personal judgment such as speculation, suggestion, intention, request, opinion, volition, invitation, and so forth must take \"kara.\"<br/>\r\n- Kono kawa wa kitanai kara tabun sakana wa inai deshou. Since this river is polluted, there is probably no fish. <br/>\r\n- Mou osoi kara hayaku nenasai. Go to bed, since it is getting late.<br/>\r\n- Kono hon wa totemo omoshiroi kara yonda hou ga ii. This book is very interesting, so you'd better to read it.<br/>\r\n- Kono kuruma wa furui kara atarashi kuruma ga hoshii desu. This car is old, so I want a new car.<br/>\n<br/>\r\nWhile \"kara\" focuses more on the reason, \"node\" focuses more on the resulting effect. This is why the \"kara\" clause is used independently more often than \"node\".<br/>\r\n- Doushite okureta no. Why were you late?<br/>\r\n- Densha ni nori okureta kara. Because I missed the train.<br/>\n<br/>\r\n\"Kara\" can be immediately followed by \"~ desu.\"<br/>\r\n- Atama ga itakatta kara desu. Because I had a headache. (OK)<br/>\r\n- Atama ga itakatta node desu. Because I had a headache. (Not OK = Wrong)<br/>\n<br/>\r\nAny comments, corrections?"
