  - position: 1
    text: "「男女を問わず募集します」とは言っても「男女にかかわらず募集します」というのは何か変ですよね。\n\n\n\r\n「ナンニョニ　カカワラズ　ココニ　イルベカラズ」（和英語林集成）はよくて「男女を問わずここに立ち入るべからず」は……？\n\n\n\n\n\r\n「○○を問わず××」は、○○はどちらであってもかまわないから、××します。\n\n\n\r\n「○○にかかわらず××」は、○○がどちらであろうとなかろうと、××します。\n\n\n\n\n\r\nなんて感じですけれど、こじつけかもしれません。"
    html: "「男女を問わず募集します」とは言っても「男女にかかわらず募集します」というのは何か変ですよね。<br/>\n<br/>\r\n「ナンニョニ　カカワラズ　ココニ　イルベカラズ」（和英語林集成）はよくて「男女を問わずここに立ち入るべからず」は……？<br/>\n<br/>\n<br/>\r\n「○○を問わず××」は、○○はどちらであってもかまわないから、××します。<br/>\n<br/>\r\n「○○にかかわらず××」は、○○がどちらであろうとなかろうと、××します。<br/>\n<br/>\n<br/>\r\nなんて感じですけれど、こじつけかもしれません。"
