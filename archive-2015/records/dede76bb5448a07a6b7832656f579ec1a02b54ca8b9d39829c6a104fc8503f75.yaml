    label: にかかわらず
    annotation_text: |-
      にかかわらず    (最近聞かなくなりましたが、古紙回収の車が「古新聞、古雑誌、ぼろぎれなどございましたら、多少にかかわらずお声をおかけください」というようなアナウンスをしていたのが耳に残っています。これは「×多少を問わずお声をおかけください」とは言えません。「多少を問わず回収にまいります」ならばOKです。実際に「問う」すなわち「質問する」ことがあるかどうかが関ってくるのでしょう。古新聞を出す側は、「新聞の量が多いか少ないか」は自分のことであって分かっているので、「×多少を問わず回収業者を呼び止める」と阜ｻすることはないのでしょう。) [sureshnihon]
