notes:
  - position: 0
    text: "【にかかわらず】\n\n\n\r\n1 Nにかかわらず\n\n\n\r\n天候、性別、年齢など、異なりを含んで成り立つ名詞を受けて、「その違いに関係なく」「その違いを問題とせずに」という意味を浮ｷ。\n\n\n\r\n2 ...にかかわらず〔略〕\n\n\n\n\n\r\n【を問わず】\n\n\n\r\nNを問わず\n\n\n\r\n「それに関係なく」「それを問題にせず」という意味を浮ｷ。「昼夜」「男女」など対になった名詞が使われることが多い。次のように「Nはとわず」の形となることもある。\n\n\n\r\n（例）（アルバイトの広告で）販売員募集。性別は問わず。\n\n\n\n\n\r\n上記がたたき台になるでしょうか。私には、すぐには両者の違いを明瞭にするアイデアが浮かびませんが。"
    html: "【にかかわらず】<br/>\n<br/>\r\n1 Nにかかわらず<br/>\n<br/>\r\n天候、性別、年齢など、異なりを含んで成り立つ名詞を受けて、「その違いに関係なく」「その違いを問題とせずに」という意味を浮ｷ。<br/>\n<br/>\r\n2 ...にかかわらず〔略〕<br/>\n<br/>\n<br/>\r\n【を問わず】<br/>\n<br/>\r\nNを問わず<br/>\n<br/>\r\n「それに関係なく」「それを問題にせず」という意味を浮ｷ。「昼夜」「男女」など対になった名詞が使われることが多い。次のように「Nはとわず」の形となることもある。<br/>\n<br/>\r\n（例）（アルバイトの広告で）販売員募集。性別は問わず。<br/>\n<br/>\n<br/>\r\n上記がたたき台になるでしょうか。私には、すぐには両者の違いを明瞭にするアイデアが浮かびませんが。"
