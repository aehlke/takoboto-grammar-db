comments:
  - position: 0
    credits_raw: Amatuka
    text: Short and long なあ versions, both mean the same thing.
    html: Short and long なあ versions, both mean the same thing.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: Won't it be gret if (we) can fish tomorrow. ではありませんか？　釣る=to fish、釣りに行く=to go fishing
    html: Won't it be gret if (we) can fish tomorrow. ではありませんか？　釣る=to fish、釣りに行く=to go fishing
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: Hmm, true.  But you can't fish without going to fish so it's not such a big difference.
    html: |-
      Hmm, true.  But you can't <b>fish</b> without <b>going to fish</b> so it's not such a big difference.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Amatuka
    text: '"going to fish" is probably rather more common - but both are OK so I''ll change it as you suggest.'
    html: '"going to fish" is probably rather more common - but both are OK so I''ll change it as you suggest.'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Miki
    text: "In note, I think \"watashi no aibou no aidea wa ii deshou?\" would be better instead of \"... naa.\"\n\r\nOr \"yappari watashi no aibou no aidea wa iinaa.\" might be ok. tras. what I expected, my partner's idea is great."
    html: "In note, I think \"watashi no aibou no aidea wa ii deshou?\" would be better instead of \"... naa.\"<br/>\r\nOr \"yappari watashi no aibou no aidea wa iinaa.\" might be ok. tras. what I expected, my partner's idea is great.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: FatPianoBoy
    text: It seems that "naa" is used with sentences which are suggestive, while "yo" is more definite.
    html: It seems that "naa" is used with sentences which are suggestive, while "yo" is more definite.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: 誠
    text: "Wouldn't it be great if (we) can go fishing tomorrow?\n\r\nIt can also be 明日は釣りに行けるといいなあ\n\n\n\r\nIf you don't translate literally/exactly in English terms, both the meaning is the same."
    html: "Wouldn't it be great if (we) can go fishing tomorrow?<br/>\r\nIt can also be 明日は釣りに行けるといいなあ<br/>\n<br/>\r\nIf you don't translate literally/exactly in English terms, both the meaning is the same."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: 誠
    text: "If it is just 釣れるといいなあ\n\r\nIt means:\n\r\n How nice(Wouldn't it be great) if (I) can(ability) fish.."
    html: "If it is just 釣れるといいなあ<br/>\r\nIt means:<br/>\r\n How nice(Wouldn't it be great) if (I) can(ability) fish..<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
