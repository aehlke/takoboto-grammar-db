  - source_id: 7034
    position: 6
    japanese: 長い時間テレビをみつづけると、目がいたくなる。
    body_text: "長い時間テレビをみつづけると、目がいたくなる。 \n\n\t\tWhen you \n\t\tkeep \nwatching  TV for a long time, your eyes become painful."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ長い時間テレビをみつづける\">\n\t\t\t\t長い時間テレビをみ<strong>つづける</strong><strong></strong>と、目がいたくなる。</a> <br/>\n\t\tWhen you \n\t\t<strong>keep </strong>\nwatching  TV for a long time, your eyes become painful."
