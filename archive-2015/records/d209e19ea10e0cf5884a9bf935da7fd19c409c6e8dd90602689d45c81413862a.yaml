examples:
  - source_id: 925
    position: 0
    japanese: ダイエット中のくせにあくまでも甘い物を食べつづけます
    body_text: "ダイエット中のくせにあくまでも甘い物を食べつづけます \n\n\t\teven though I'm on a diet, I will \n\t\tkeep on \n\t\teating sweet things until the end."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJダイエット中のくせにあくまでも甘い物を食べつづけます\">\n\t\t\t\tダイエット中のくせにあくまでも甘い物を<strong>食べつづけます</strong><strong></strong></a> <br/>\n\t\teven though I'm on a diet, I will \n\t\t<strong>keep on </strong>\n\t\teating sweet things until the end."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4192
    position: 1
    japanese: お金のために、愛してもいない男との生活をつづけるならば、すっかり失望して、進退きわまる時が将来やってくることだろう。
    body_text: "お金のために、愛してもいない男との生活をつづけるならば、すっかり失望して、進退きわまる時が将来やってくることだろう。 \n\n\t\tIf she continues to live with a man she doesn't love for his money, the day will come when she will be utterly frustrated and between the devil and the deep blue sea."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJお金のために、愛してもいない男との生活をつづけるならば、すっかり失望して、進退きわまる時が将来やってくることだろう。\">\n\t\t\t\tお金のために、愛してもいない男との生活を<strong>つづける</strong>ならば、すっかり失望して、進退きわまる時が将来やってくることだろう。<strong></strong></a> <br/>\n\t\tIf she continues to live with a man she doesn't love for his money, the day will come when she will be utterly frustrated and between the devil and the deep blue sea. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4193
    position: 2
    japanese: この失敗、きっと一生、言われつづけるなあ。
    body_text: "この失敗、きっと一生、言われつづけるなあ。 \n\n\t\tPeople \n\t\twill keep talking \n\t\tabout this mistake forever."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJこの失敗、きっと一生、言われつづけるなあ。\">\n\t\t\t\tこの失敗、きっと一生、言われ<strong>つづける</strong>なあ。<strong></strong></a> <br/>\n\t\tPeople \n\t\t<strong>will keep talking </strong>\n\t\tabout this mistake forever."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4194
    position: 3
    japanese: 私は母国を愛しているし、これからも愛しつづけるだろう。
    body_text: "私は母国を愛しているし、これからも愛しつづけるだろう。 \n\n\t\tI love, and will \n\t\tcontinue to \n\t\tlove, my mother country."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私は母国を愛しているし、これからも愛しつづけるだろう。\">\n\t\t\t\t私は母国を愛しているし、これからも愛し<strong>つづける</strong>だろう。<strong></strong></a> <br/>\n\t\tI love, and will \n\t\t<strong>continue to </strong>\n\t\tlove, my mother country."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5703
    position: 4
    japanese: 無視しろぅ！　じゃ、書き続けて！
    body_text: "無視しろぅ！　じゃ、書き続けて！ \n\n\t\tIgnore it! Keep writing!"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ無視しろぅ！　じゃ、書き続けて！\">\n\t\t\t\t無視しろぅ！　じゃ、書き続けて！<strong></strong><strong></strong></a> <br/>\n\t\tIgnore it! Keep writing! \n\t\t<strong> </strong>"
    credits_raw: ninja_k
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7033
    position: 5
    japanese: 小さい字を書きつづけて、手がつかれました。
    body_text: "小さい字を書きつづけて、手がつかれました。 \n\n\t\tBecause I have been writing\ncontinuously \n\t\t  small characters, my hand got tired."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ小さい字を書きつづけて\">\n\t\t\t\t小さい字を書き<strong>つづけて</strong><strong></strong>、手がつかれました。</a> <br/>\n\t\tBecause I have been writing\n<strong>continuously </strong>\n\t\t  small characters, my hand got tired."
