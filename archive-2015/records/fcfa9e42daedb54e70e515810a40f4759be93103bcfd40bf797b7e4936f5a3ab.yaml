  - position: 1
    text: "連れて行く means to take someone with (you)\n\n\n\r\n私は友達を連れて行きました\n\r\nI took my friend along\n\n\n\r\nWill you take us for a drive next Sunday?\n\r\n今度の日曜日にドライブにつれていってくれませんか。"
    html: "<br/>\r\n連れて行く means to take someone with (you)<br/>\n<br/>\r\n私は友達を連れて行きました<br/>\r\nI took my friend along<br/>\n<br/>\r\nWill you take us for a drive next Sunday?<br/>\r\n今度の日曜日にドライブにつれていってくれませんか。<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "＊につれ(て) is a phrase used to indicate that a change occurs in accordance with another simultaneous change. Because of this, the verbs in the につれ(て) clause and the main clause have to be verbs of change or of a process, such as 'become proficient' and 'increase.'\n\n\n\r\n＊When と共に(とともに) means 'as,' it can be rephrased as につれて, に伴って(にともなって), or に従って(にしたがって).\n\r\nEXAMPLE: 景気の回復[と共に/につれて/に伴って/に従って]失業率が下がってきた。(As business recovers, the unemployment rate is coming down.)\n\n\n\r\n＊The difference between Ｖ(inf・nonpast)にしたがって and Ｖ(inf・nonpast)につれて is that the former is more of a written style and the latter is more of a spoken style.\n\n\n\r\nFORMATION:\n\r\nＶ(inf・nonpast) + につれて\n\r\nＮ + につれて"
    html: "＊につれ(て) is a phrase used to indicate that a change occurs in accordance with another simultaneous change. Because of this, the verbs in the につれ(て) clause and the main clause have to be verbs of change or of a process, such as 'become proficient' and 'increase.'<br/>\n<br/>\r\n＊When と共に(とともに) means 'as,' it can be rephrased as につれて, に伴って(にともなって), or に従って(にしたがって).<br/>\r\nEXAMPLE: 景気の回復[と共に/につれて/に伴って/に従って]失業率が下がってきた。(As business recovers, the unemployment rate is coming down.)<br/>\n<br/>\r\n＊The difference between Ｖ(inf・nonpast)にしたがって and Ｖ(inf・nonpast)につれて is that the former is more of a written style and the latter is more of a spoken style.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(inf・nonpast) + につれて<br/>\r\nＮ + につれて"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
