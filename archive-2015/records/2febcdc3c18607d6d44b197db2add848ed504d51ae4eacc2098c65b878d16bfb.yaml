  - position: 9
    credits_raw: spurrymoses
    text: "Campbell said: \"行ったつもりだ? in english it doesn't make sense to say: I intend to went\"\n\n\n\r\nYou're right, you wouldn't say \"I intend to went\". But that's hardly an honest attempt - it's just a deliberately poor attempt at translation.\n\n\n\r\nHow about \"I intended to go\" or \"it was my intention to have gone\""
    html: "Campbell said: \"行ったつもりだ? in english it doesn't make sense to say: I intend to went\"<br/>\n<br/>\r\nYou're right, you wouldn't say \"I intend to went\". But that's hardly an honest attempt - it's just a deliberately poor attempt at translation.<br/>\n<br/>\r\nHow about \"I intended to go\" or \"it was my intention to have gone\"<br/>"
