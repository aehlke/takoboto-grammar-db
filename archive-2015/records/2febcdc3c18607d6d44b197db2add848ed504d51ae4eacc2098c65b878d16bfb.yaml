  - position: 3
    credits_raw: tigert
    text: "The thing about つもり is that using it gives the listener the impression that you won`t complete the action you intend on doing. From the people that I have talked with there are levels of commitment in the japanese language. the first level is negative statement. which is avoided at all cost.\n\r\nEX No, I won`t go.\n\n\n\r\nthen comes  passive nagative statement.\n\n\n\r\nEX I would like to go, but ....(I`m not going)\n\n\n\r\nthen comes probablility related statements. which have their own level.\n\r\n行くかも知らない I don`t know if I`ll go,(but I probably won`t)\n\r\n行くつもり　I intend to go (but I won`t go because well you know how it is)\n\r\n多分行く　I think I will go ( unless something comes up.) \n\n\n\r\nand the final stage is the affirmative statement.\n\r\n行く　I　will go."
    html: "The thing about つもり is that using it gives the listener the impression that you won`t complete the action you intend on doing. From the people that I have talked with there are levels of commitment in the japanese language. the first level is negative statement. which is avoided at all cost.<br/>\r\nEX No, I won`t go.<br/>\n<br/>\r\nthen comes  passive nagative statement.<br/>\n<br/>\r\nEX I would like to go, but ....(I`m not going)<br/>\n<br/>\r\nthen comes probablility related statements. which have their own level.<br/>\r\n行くかも知らない I don`t know if I`ll go,(but I probably won`t)<br/>\r\n行くつもり　I intend to go (but I won`t go because well you know how it is)<br/>\r\n多分行く　I think I will go ( unless something comes up.) <br/>\n<br/>\r\nand the final stage is the affirmative statement.<br/>\r\n行く　I　will go.<br/>\n<br/>"
    source_id: null
    original_created_at: null
