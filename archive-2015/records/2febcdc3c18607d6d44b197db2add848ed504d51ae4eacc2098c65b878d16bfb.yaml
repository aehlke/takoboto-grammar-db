notes:
  - position: 0
    text: "Two ways to inform the interlocutor of the wishes of the speaker \n\r\n(different in Japanese from the way to tell about the wishes of a third person):\n\r\n1) Verb in volitional form (意向形) + と + 思う: \n\r\njp: 一万円ほど父に都合してもらおうと思う。\n\r\nen: I think I will ask my father to lend me 10000 yen.\n\r\n2) Verb in plain form + noun to mark intention + だ or です or である\n\r\nThe noun can be 考え（かんがえ）,予定（よてい）, or 積もり（つもり）which is the more common.\n\r\nThis last way is easier, for example to say you don't want to do something. The negative form of つもりだ is つもりはない (and not つもりではない).\n\n\n\r\nBe careful, the use of つもり after た形 have a different meaning \n\r\n(see entry \x01 and \x01)."
    html: "Two ways to inform the interlocutor of the wishes of the speaker <br/>\r\n(different in Japanese from the way to tell about the wishes of a third person):<br/>\r\n1) Verb in volitional form (意向形) + と + 思う: <br/>\r\njp: 一万円ほど父に都合してもらおう<strong>と思う。<br/>\r\nen: I think I will ask my father to lend me 10000 yen.<br/>\r\n2) Verb in plain form + noun to mark intention + だ or です or である<br/>\r\nThe noun can be 考え（かんがえ）,予定（よてい）, or 積もり（つもり）which is the more common.<br/>\r\nThis last way is easier, for example to say you don't want to do something. The negative form of つもりだ is つもりはない (and not つもりではない).<br/>\n<br/>\r\nBe careful, the use of つもり after た形 have a different meaning <br/>\r\n(see entry <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> and <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b>).</strong>"
    credits_raw: 赤毛
