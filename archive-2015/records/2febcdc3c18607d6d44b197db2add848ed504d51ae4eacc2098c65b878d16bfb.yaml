    credits_raw: jmadsen
    text: "I'd like to explain this completely differently, if I can risk it.\n\n\n\r\nつもり should be better described as an adverb of certainty, being VERY CERTAIN.\n\n\n\r\nAn example you won't often see, but that illustrates this could be:\n\n\n\r\n彼女はきれいなつもりだ\n\r\nShe is really good looking, isn't she (or, \"She's hot!\")\n\n\n\r\nso,\n\r\n 会議には出ないつもりです \n\r\n= The meeting - to attend - not - is certain."
    html: "I'd like to explain this completely differently, if I can risk it.<br/>\n<br/>\r\nつもり should be better described as an adverb of certainty, being VERY CERTAIN.<br/>\n<br/>\r\nAn example you won't often see, but that illustrates this could be:<br/>\n<br/>\r\n彼女はきれいなつもりだ<br/>\r\nShe is really good looking, isn't she (or, \"She's hot!\")<br/>\n<br/>\r\nso,<br/>\r\n 会議には出ないつもりです <br/>\r\n= The meeting - to attend - not - is certain.<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: Forveya
    text: "If I were to believe the JDIC entry, it can mean both to intend to do something or to be very certain of something. Perhaps it should be edited accordingly.\n\n\n\r\nintention; plan; (2) conviction; belief"
