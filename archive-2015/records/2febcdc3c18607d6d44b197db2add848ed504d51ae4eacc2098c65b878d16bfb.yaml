  - position: 1
    credits_raw: Campbell
    text: "つもり does not really mean intention.  American textbooks and instructors simply explain it as such because it is simpler.  つもり really describes a state of mind.  行くつもりだ it is the state of mind to go = I intend to go.  what about: 行ったつもりだ?  in english it doesn't make sense to say: I intend to went...  it is I am in the frame of mind as if I had gone...  if that makes any sense...\n\n\n\r\nよく読んだつもりです。I am convinced I read it carefully.\n\r\n一所懸命やったつもりで。　I believe I did my best.\n\r\n(Examples provided from Making Sense of Japanese: What the Textbooks don't tell you by Jay Rubin)"
    html: "つもり does not really mean intention.  American textbooks and instructors simply explain it as such because it is simpler.  つもり really describes a state of mind.  行くつもりだ it is the state of mind to go = I intend to go.  what about: 行ったつもりだ?  in english it doesn't make sense to say: I intend to went...  it is I am in the frame of mind as if I had gone...  if that makes any sense...<br/>\n<br/>\r\nよく読んだつもりです。I am convinced I read it carefully.<br/>\r\n一所懸命やったつもりで。　I believe I did my best.<br/>\r\n(Examples provided from Making Sense of Japanese: What the Textbooks don't tell you by Jay Rubin)"
    source_id: null
    original_created_at: null
    original_updated_at: null
