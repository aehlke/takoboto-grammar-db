  - source_id: 3439
    position: 8
    japanese: 小屋の様子から見ると、そこには誰も住んでいないようだ。
    body_text: "小屋の様子から見ると、そこには誰も住んでいないようだ。  \n\n\t\tFrom the look of the cabin, no one lives in it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ小屋の様子から見ると、そこには誰も住んでいないようだ。 \">\n\t\t\t\t小屋の様子<strong>から見ると</strong>、そこには誰も住んでいないようだ。 <strong></strong></a> <br/>\n\t\tFrom the look of the cabin, no one lives in it. \n\t\t<strong> </strong>"
