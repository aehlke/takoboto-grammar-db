    japanese: しかし、外から見ると、なぜこんなに非効率な作業をしているのだろう、と疑問に思うことが少なくない
    body_text: "しかし、外から見ると、なぜこんなに非効率な作業をしているのだろう、と疑問に思うことが少なくない \n\n\t\tHowever, \n\t\twhen looked at from an outside perspective, \n\t\tit'd not be uncommon to think \"Why are they doing such inefficent work I wonder.\""
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJしかし、外から見ると、なぜこんなに非効率な作業をしているのだろう、と疑問に思うことが少なくない\">\n\t\t\t\tしかし、外<strong>から見ると</strong>、なぜこんなに非効率な作業をしているのだろう、と疑問に思うことが少なくない<strong></strong></a> <br/>\n\t\tHowever, \n\t\t<strong>when looked at from an outside perspective, </strong>\n\t\tit'd not be uncommon to think \"Why are they doing such inefficent work I wonder.\""
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 332
    position: 1
    japanese: 私の立場からみると当然でしょう。
    body_text: "私の立場からみると当然でしょう。 \n\nFrom my point of view, \n\t\tit makes sense."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私の立場からみると当然でしょう。\">\n私の立場<strong>からみると</strong>当然でしょう。<strong></strong></a> <br/>\n<strong>From my point of view, </strong>\n\t\tit makes sense."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3433
    position: 2
    japanese: 月から見ると、地球はボールのように見える。
    body_text: "月から見ると、地球はボールのように見える。\r \n\n\t\tSeen from the moon, the earth looks like a ball."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ月から見ると、地球はボールのように見える。\">\n\t\t\t\t月<strong>から見ると</strong>、地球はボールのように見える。\r<strong></strong></a> <br/>\n\t\tSeen from the moon, the earth looks like a ball. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3434
    position: 3
    japanese: 現在の空模様から見るといつ土砂降りになるかわからない。
    body_text: "現在の空模様から見るといつ土砂降りになるかわからない。\r \n\n\t\tJudging from the present look of the sky, we may have a downpour any moment."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ現在の空模様から見るといつ土砂降りになるかわからない。\">\n\t\t\t\t現在の空模様<strong>から見ると</strong>いつ土砂降りになるかわからない。\r<strong></strong></a> <br/>\n\t\tJudging from the present look of the sky, we may have a downpour any moment. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3435
    position: 4
    japanese: 雇用者の数という見地から見ると、すべての工場のうちここは最も大規模なところだ。
    body_text: "雇用者の数という見地から見ると、すべての工場のうちここは最も大規模なところだ。\r \n\n\t\tIt terms of the number of employees, this is the largest of all industries."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ雇用者の数という見地から見ると、すべての工場のうちここは最も大規模なところだ。\">\n\t\t\t\t雇用者の数という見地<strong>から見ると</strong>、すべての工場のうちここは最も大規模なところだ。\r<strong></strong></a> <br/>\n\t\tIt terms of the number of employees, this is the largest of all industries. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3436
    position: 5
    japanese: 山頂から見ると、その島はとても美しい。
    body_text: "山頂から見ると、その島はとても美しい。 \n\nSeen from \n\t\tthe top of the hill, the island is very beautiful."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ山頂から見ると、その島はとても美しい。\">\n山頂<strong>から見ると</strong>、その島はとても美しい。<strong></strong></a> <br/>\n<strong>Seen from </strong>\n\t\tthe top of the hill, the island is very beautiful."
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3437
    position: 6
    japanese: 私たちの家は西欧の基準から見ると小さすぎるとのことです。
    body_text: "私たちの家は西欧の基準から見ると小さすぎるとのことです。\r \n\n\t\tThey say our house is too small by Western standards."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私たちの家は西欧の基準から見ると小さすぎるとのことです。\">\n\t\t\t\t私たちの家は西欧の基準<strong>から見ると</strong>小さすぎるとのことです。\r<strong></strong></a> <br/>\n\t\tThey say our house is too small by Western standards. \n\t\t<strong> </strong>"
    credits_raw: dbx
