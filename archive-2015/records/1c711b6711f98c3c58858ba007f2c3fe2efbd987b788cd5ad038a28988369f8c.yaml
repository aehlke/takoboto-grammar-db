  - source_id: 3438
    position: 7
    japanese: 私の目から見ると彼なんかまだ赤ん坊だ。
    body_text: "私の目から見ると彼なんかまだ赤ん坊だ。\r \n\n\t\tHe is only a baby in my eyes."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ私の目から見ると彼なんかまだ赤ん坊だ。\">\n\t\t\t\t私の目<strong>から見ると</strong>彼なんかまだ赤ん坊だ。\r<strong></strong></a> <br/>\n\t\tHe is only a baby in my eyes. \n\t\t<strong> </strong>"
