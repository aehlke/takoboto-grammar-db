    text: "In ex #\x01, 見地から見ると is a redundancy - you either say 見地からは or からすると. Making the same mistake of 馬から落ちて落馬して"
    html: "In ex <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=karamiruto#\x01\">#\x01</a></b>, 見地から見ると is a redundancy - you either say 見地からは or からすると. Making the same mistake of 馬から落ちて落馬して"
