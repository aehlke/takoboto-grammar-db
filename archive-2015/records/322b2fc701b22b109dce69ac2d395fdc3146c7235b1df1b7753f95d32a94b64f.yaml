  - position: 1
    text: "[kurai / くらい] with a negative predicate indicates a superlative. (Mr. Yamada is the most forgetful.)\n\n\n\r\nIt also expresses the idea of \"at least.\" Ⅹくらい in this use implies that the degree of a state is such that one cannot expect much more than X from that state.\n\n\n\r\nＳのはⅩくらいのものだ expresses the idea that the speaker cannot think of anyone or anything else but Ⅹ that meets the description in Ｓ. In other words, Ⅹ meets the description in Ｓ to the highest degree among those the speaker can think of.\n\n\n\r\nＶ1くらいならＶ2ほうがましだ expresses the idea the one would rather Ｖ2 than Ｖ1."
    html: "[kurai / くらい] with a negative predicate indicates a superlative. (Mr. Yamada is the most forgetful.)<br/>\n<br/>\r\nIt also expresses the idea of \"at least.\" Ⅹくらい in this use implies that the degree of a state is such that one cannot expect much more than X from that state.<br/>\n<br/>\r\nＳのはⅩくらいのものだ expresses the idea that the speaker cannot think of anyone or anything else but Ⅹ that meets the description in Ｓ. In other words, Ⅹ meets the description in Ｓ to the highest degree among those the speaker can think of.<br/>\n<br/>\r\nＶ1くらいならＶ2ほうがましだ expresses the idea the one would rather Ｖ2 than Ｖ1."
