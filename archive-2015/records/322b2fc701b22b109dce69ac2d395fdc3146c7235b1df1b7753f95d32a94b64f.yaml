  - position: 3
    credits_raw: tigert
    text: "I think this grammar point is a little misleading, くらい､ぐらい　means approximately, about, almost. it is used to state unspacific amounts of what comes before it. it does not carry a meaning of minimal amount, rather than, so～that,the least or the only. \n\n\n\r\nI think that you need to look at other sections of each of the examples to understand their true meaning. \n\n\n\n#\x01 does not translate to he is the only one. if you wanted to say he is the only or no one else could do the job, you would say. \n\r\n今彼しかこの仕事ができません。or\n\r\n今この仕事ができるのは　彼だけです。　\n\n\n\r\nbecause you use ぐらい　your saying that if it wasn`t someone that has about as much (unidentified ablility) as he does they couldn`t do the job. \n\n\n\r\nThe next example #\x01\n\n\n\r\nthe real operator in the sentence is the last part. ”ほうがました”　and くらい　is not nessasary to hold the meaning I would rather die than do such a thing. そんなことするなら　already has the meaning."
    html: "I think this grammar point is a little misleading, くらい､ぐらい　means approximately, about, almost. it is used to state unspacific amounts of what comes before it. it does not carry a meaning of minimal amount, rather than, so～that,the least or the only. <br/>\n<br/>\r\nI think that you need to look at other sections of each of the examples to understand their true meaning. <br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=kurai,%20gurai#\x01\">#\x01</a></b> does not translate to he is the only one. if you wanted to say he is the only or no one else could do the job, you would say. <br/>\r\n今彼しかこの仕事ができません。or<br/>\r\n今この仕事ができるのは　彼だけです。　<br/>\n<br/>\r\nbecause you use ぐらい　your saying that if it wasn`t someone that has about as much (unidentified ablility) as he does they couldn`t do the job. <br/>\n<br/>\r\nThe next example <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=kurai,%20gurai#\x01\">#\x01</a></b><br/>\n<br/>\r\nthe real operator in the sentence is the last part. ”ほうがました”　and くらい　is not nessasary to hold the meaning I would rather die than do such a thing. そんなことするなら　already has the meaning."
