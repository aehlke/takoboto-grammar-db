comments:
  - position: 0
    credits_raw: Dahak
    text: Is there any difference between そのとき and Verb + ときに?   "At the time" is just short for "At the time when."
    html: Is there any difference between そのとき and Verb + ときに?   "At the time" is just short for "At the time when."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: dc
    text: "yes, they seem to be.\n\n\n\r\nat the time when (verb)\n\r\nat that time...\n\n\n\r\n私が買ったときに、高いと思った、、\n\r\nそのときは高かったけど\n\n\n\r\nat the time when i bought it, i thot it was expensive\n\r\nat that time it was expensive"
    html: "yes, they seem to be.<br/>\n<br/>\r\nat the time when (verb)<br/>\r\nat that time...<br/>\n<br/>\r\n私が買ったときに、高いと思った、、<br/>\r\nそのときは高かったけど<br/>\n<br/>\r\nat the time when i bought it, i thot it was expensive<br/>\r\nat that time it was expensive<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Dahak
    text: "そのときは高いと思った?\n\r\nAt that time, I thought it was expensive.\n\n\n\r\nBasically use そのとき when you don't link the time (とき) to an action (verb).\n\n\n\r\nCorrect?"
    html: "そのときは高いと思った?<br/>\r\nAt that time, I thought it was expensive.<br/>\n<br/>\r\nBasically use そのとき when you don't link the time (とき) to an action (verb).<br/>\n<br/>\r\nCorrect?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: dc
    text: "seems like it. その時 is a standalone.　\n\r\n当時 = at the designated time (more formal)"
    html: "seems like it. その時 is a standalone.　<br/>\r\n当時 = at the designated time (more formal)"
