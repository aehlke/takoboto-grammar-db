examples:
  - source_id: 5505
    position: 0
    japanese: 友人に相談したところで、同じだろう。
    body_text: "友人に相談したところで、同じだろう。 \n\n\t\tNothing will change \n\t\teven if \n\t\tI asked advice from my friend."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ友人に相談したところで、同じだろう\">\n友人に相談し<strong>たところで</strong>、同じだろう<strong></strong>。</a> <br/>\n\t\tNothing will change \n\t\t<strong>even if </strong>\n\t\tI asked advice from my friend."
    credits_raw: eastmael
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5507
    position: 1
    japanese: 喧嘩したところでどうにもならないだろ。
    body_text: "喧嘩したところでどうにもならないだろ。 \n\n\t\tFighting won't do any good. ( \n\t\tEven if \n\t\t  you fight...)"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ喧嘩したところでどうにもならないだろ。\">\n\t\t\t\t喧嘩した<strong>ところで</strong>どうにもならないだろ。<strong></strong></a> <br/>\n\t\tFighting won't do any good. ( \n\t\t<strong>Even if </strong>\n\t\t  you fight...)"
    credits_raw: blabby
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5508
    position: 2
    japanese: 癌(がん)が肺まで広がっている。手術したところで、助からない。
    body_text: "癌(がん)が肺まで広がっている。手術したところで、助からない。 \n\n\t\tThe cancer has spread to the lungs. Even if we operate now, there is no hope."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ癌(がん)が肺まで広がっている。手術したところで、助からない。\">\n\t\t\t\t癌(がん)が肺まで広がっている。手術し<strong>たところで</strong>、助からない。<strong></strong></a> <br/>\n\t\tThe cancer has spread to the lungs. Even if we operate now, there is no hope. \n\t\t<strong> </strong>"
    credits_raw: blabby
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5740
    position: 3
    japanese: タクシーで行ったところで、もう間に合わない.
    body_text: "タクシーで行ったところで、もう間に合わない. \n\nEven if \n\t\tI take a taxi, I don't make it."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJタクシーで行ったところで、もう間に合わない.\">\n\t\t\t\tタクシーで行っ<strong>たところで</strong>、もう間に合わない.<strong></strong></a> <br/>\n<strong>Even if </strong>\n\t\tI take a taxi, I don't make it."
    credits_raw: Alfredo
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5746
    position: 4
    japanese: 君がいくら話をしたところで私を納得させることはできないよ。
    body_text: "君がいくら話をしたところで私を納得させることはできないよ。 \n\n\t\tYou can talk until you're blue in the face, but you'll never convince me."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ君がいくら話をしたところで私を納得させることはできないよ。\">\n\t\t\t\t君がいくら話をし<strong>たところで</strong>私を納得させることはできないよ。<strong></strong></a> <br/>\n\t\tYou can talk until you're blue in the face, but you'll never convince me. \n\t\t<strong> </strong>"
    credits_raw: Paul
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6958
    position: 5
    japanese: いくら話し合ったところで、この問題を解決することはできません。
    body_text: "いくら話し合ったところで、この問題を解決することはできません。 \n\nDespite having \ndiscussed it  many times, I cannot solve this problem."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJいくら話し合ったところで\">\n\t\t\t\tいくら話し合った<strong>ところで</strong><strong></strong>、この問題を解決することはできません。</a> <br/>\n<strong>Despite having </strong>\ndiscussed it  many times, I cannot solve this problem."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6959
    position: 6
    japanese: もともと勉強する気がないのなら、大学を受けてみたところで何の意味があるのか。
    body_text: "もともと勉強する気がないのなら、大学を受けてみたところで何の意味があるのか。 \n\n\t\tIf by nature you don't have interest in studying, \n\t\teven if \nyou intended to take the university entry exam,  does it make sense?"
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJもともと勉強する気がないのなら、大学を受けてみたところで\">\n\t\t\t\tもともと勉強する気がないのなら、大学を受けてみた<strong>ところで</strong><strong></strong>何の意味があるのか。</a> <br/>\n\t\tIf by nature you don't have interest in studying, \n\t\t<strong>even if </strong>\nyou intended to take the university entry exam,  does it make sense?"
    credits_raw: 赤毛
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6960
    position: 7
    japanese: どんなに一生懸命働いたところで、生活は楽にならないだろうと思う。
    body_text: "どんなに一生懸命働いたところで、生活は楽にならないだろうと思う。 \n\nEven if \nI worked  with utmost effort, I think that the daily existence wouldn't become easier."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJどんなに一生懸命働いたところで\">\n\t\t\t\tどんなに一生懸命働いた<strong>ところで</strong><strong></strong>、生活は楽にならないだろうと思う。</a> <br/>\n<strong>Even if </strong>\nI worked  with utmost effort, I think that the daily existence wouldn't become easier."
    credits_raw: 赤毛
    verification_class:
      - red-bottom
