    credits_raw: blabby
    text: "#\x01 has redundant kana?\n\n\n\r\nI have heard this grammar used a lot right at the point where the speaker gives up in a hopeless situation. Simlar to saying \"Even if ... it's too late.\"\n\n\n\r\nThe sentence usually ends in 〜ない or words such as 無理だ or 無駄だ。"
    html: "<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=tatokorode#\x01\">#\x01</a></b> has redundant kana?<br/>\n<br/>\r\nI have heard this grammar used a lot right at the point where the speaker gives up in a hopeless situation. Simlar to saying \"Even if ... it's too late.\"<br/>\n<br/>\r\nThe sentence usually ends in 〜ない or words such as 無理だ or 無駄だ。"
