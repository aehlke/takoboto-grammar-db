  - position: 4
    credits_raw: bamboo4
    text: |-
      からには has the connotation of "since" or "so long as" or "Now that" which cannot be dispensed with simply as "because." 女性に生まれたからには has the connotation of "So long as I was born a woman" instead of "because." Also 女性に生まれたからには is an awkward expression. Say 女として生まれたからには.
    html: |-
      からには has the connotation of "since" or "so long as" or "Now that" which cannot be dispensed with simply as "because." 女性に生まれたからには has the connotation of "So long as I was born a woman" instead of "because." Also 女性に生まれたからには is an awkward expression. Say 女として生まれたからには.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
