[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takoboto-grammar-db"
version = "0.2.0"
description = "Archive Takoboto's public JGram-derived grammar collection"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.28,<1"]

[project.scripts]
takoboto-grammar = "takoboto_grammar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takoboto_grammar = ["schema.sql"]
