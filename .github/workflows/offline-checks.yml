name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run fixture tests
        run: uv run --locked --offline python -m unittest discover -s tests -v
      - name: Verify committed YAML and SQLite offline
        run: uv run --locked --offline python scripts/verify_dataset.py
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
