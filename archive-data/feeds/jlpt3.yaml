channel_xml: "<channel>\n<title>JGram Grammar a Day - JLPT 3</title>\n<link>http://www.jgram.org</link>\n<description>JGram RSS Grammar a Day - JLPT 3</description>\n<item>\n   <title>訳 (wake)</title>\n   <link>http://www.jgram.org/pages/viewOne.php?tagE=wake&amp;date=2019-11-20</link>\n   <description> \n   &lt;span style='FONT-SIZE: 24px; FONT-WEIGHT: BOLD'&gt;訳 (wake)&lt;/span&gt;&lt;BR /&gt;&lt;BR /&gt;\n   &amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;span style='FONT-SIZE: 16px;'&gt;&lt;b&gt;Meaning&lt;/b&gt;: meaning; reason; circumstances &lt;/span&gt;&lt;BR /&gt;\n&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;strong&gt;Example&lt;/strong&gt;: &lt;i&gt;And by that reasoning ...&lt;/i&gt;&lt;BR&gt;\n   &lt;BR /&gt;\n   &amp;nbsp; [ &lt;a href='http://www.jgram.org/pages/viewOne.php?tagE=wake'&gt;View this entry online&lt;/a&gt; ]&lt;BR /&gt;\n   &lt;BR /&gt;\n&lt;span style='font-weight: bold; background: #eeeeee; letter-spacing: 1px; border-left: 1px solid #999999; border-bottom: 1px solid #999999; display: block'&gt;&lt;strong&gt; &amp;nbsp; Notes: &amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;\nSorry...no Notes exist yet for this entry...&lt;a href='http://www.jgram.org/pages/addNote.php?tagE=wake'&gt;Add Note(s)&lt;/a&gt;\n   &lt;BR /&gt;&lt;BR /&gt;\n&lt;span style='font-weight: bold; background: #eeeeee; letter-spacing: 1px; border-left: 1px solid #999999; border-bottom: 1px solid #999999; display: block'&gt;&lt;strong&gt; &amp;nbsp; Examples: &amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;\nNote: visit &lt;a href='http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9T'&gt;WWWJDIC&lt;/a&gt; to lookup any unknown words found in the example(s)...&lt;br /&gt;\nAlternatively, view this page on &lt;a href='http://www.popjisyo.com/WebHint/AddHint.aspx?d=7&amp;r=jg&amp;s=0&amp;e=Shift_JIS&amp;u=http://www.jgram.org/pages/viewOne.php?tagE=wake'&gt;POPjisyo.com&lt;/a&gt; or \n&lt;a href='http://www.rikai.com/perl/LangMediator.En.pl?mediate_uri=http://www.jgram.org/pages/viewOne.php?tagE=wake'&gt;Rikai.com&lt;/a&gt;&lt;br /&gt;&lt;br /&gt;\n&lt;ul style='margin-top: 0px; margin-bottom: 15px; margin-left: 0px; padding-left: 5px'&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='902'&gt;[that]と言うわけで、[this] &amp;nbsp; [ex #902]&lt;/a&gt;&lt;/li&gt;\nAnd for [that] &lt;font color='red'&gt;reason &lt;/font&gt;[this]   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='903'&gt;僕は決して農業が嫌いな訳じゃない。   &amp;nbsp; [ex #903]&lt;/a&gt;&lt;/li&gt;\nBy no means do I dislike farming. (Lit: The &lt;font color='red'&gt;reason &lt;/font&gt;is not that I dislike farming)   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='904'&gt;私は訳もなく悲しくなった。 &amp;nbsp; [ex #904]&lt;/a&gt;&lt;/li&gt;\nI felt sad for no &lt;font color='red'&gt;reason &lt;/font&gt;.   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='1268'&gt;わけありの二人 &amp;nbsp; [ex #1268]&lt;/a&gt;&lt;/li&gt;\nA couple with &lt;font color='red'&gt;some amorous circumstances &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='1269'&gt;それを纏めるのはわけはない &amp;nbsp; [ex #1269]&lt;/a&gt;&lt;/li&gt;\nNot &lt;font color='red'&gt;difficult &lt;/font&gt;to resolve that issue.   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='1270'&gt;それとこれとはわけが違う &amp;nbsp; [ex #1270]&lt;/a&gt;&lt;/li&gt;\nYou are trying to compare &lt;font color='red'&gt;apples and oranges. &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='4960'&gt;そういうわけには行かない. &amp;nbsp; [ex #4960]&lt;/a&gt;&lt;/li&gt;\nThat is not &lt;font color='red'&gt;the way &lt;/font&gt;the ball bounces.   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='4961'&gt;訳の判らぬことを言うな。 &amp;nbsp; [ex #4961]&lt;/a&gt;&lt;/li&gt;\nDon&amp;#039;t tell me such &lt;font color='red'&gt;nonsense! &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='5735'&gt;たとえアルバイトしても、勉強を残るわけにはいかない。. &amp;nbsp; [ex #5735]&lt;/a&gt;&lt;/li&gt;\nEven if you do have a part-time job, that's no reason to drop your study. &lt;font color='red'&gt;. &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='6991'&gt;彼女の部屋に行った事がある訳ないよ！ &amp;nbsp; [ex #6991]&lt;/a&gt;&lt;/li&gt;\nThere&amp;#039;s no way I&amp;#039;ve been to her room! &lt;font color='red'&gt; &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='6990'&gt;そんなにたくさん食べられる訳ないよ！\n &amp;nbsp; [ex #6990]&lt;/a&gt;&lt;/li&gt;\nThere&amp;#039;s no way I can eat that much! &lt;font color='red'&gt; &lt;/font&gt;   &lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px; margin-top: 8px'&gt;&lt;a name='8049'&gt;毎日三時間も日本語を勉強しているんですか。　よく出来るわけですね。wake &amp;nbsp; [ex #8049]&lt;/a&gt;&lt;/li&gt;\n(Are you studying Japanese(as long as)three hours every day? No wonder your Japanese is good.) &lt;font color='red'&gt;wake &lt;/font&gt;   &lt;br /&gt;\n&lt;/ul&gt;\n&lt;br /&gt;&lt;b&gt;Help JGram by picking and editing examples!!&lt;/b&gt;\n&lt;ul style='margin-top: 0px; margin-bottom: 15px; margin-left: 0px; padding-left: 5px'&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/parser.php?tagJ=訳&amp;max=500000&amp;tagE=wake'&gt;Search big database for more examples of 訳&lt;/a&gt;&lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/addBatch.php?tagE=wake'&gt;Add an example sentence&lt;/a&gt;&lt;br /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/addExForm.php?tagE=wake'&gt;Detailed example form&lt;/a&gt;&lt;/ul&gt;\n&lt;/ul&gt;\n&lt;span style='font-weight: bold; background: #eeeeee; letter-spacing: 1px; border-left: 1px solid #999999; border-bottom: 1px solid #999999; display: block'&gt;&lt;strong&gt; &amp;nbsp; See Also: &amp;nbsp;\n&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;&lt;ul style='margin-top: 0px; margin-bottom: 15px; margin-left: 0px; padding-left: 5px'&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/viewOne.php?tagE=wakedehanai'&gt;wakedehanai&lt;/a&gt;\n &amp;nbsp;&amp;nbsp; (negative of the same)\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/viewOne.php?tagE=kanarazushimo'&gt;kanarazushimo&lt;/a&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;a href='http://jgram.org/pages/viewOne.php?tagE=kkonai'&gt;kkonai&lt;/a&gt;\n &amp;nbsp;&amp;nbsp; (this grammar is also similar to わけがない [wake ga/wa nai])\n&lt;/ul&gt;\n[ &lt;a href='http://jgram.org/pages/seeAlsoForm.php?tagE=wake'&gt;Add a See Also&lt;/a&gt; ]&lt;br /&gt;\n   &lt;BR /&gt;\n&lt;span style='font-weight: bold; background: #eeeeee; letter-spacing: 1px; border-left: 1px solid #999999; border-bottom: 1px solid #999999; display: block'&gt;&lt;strong&gt; &amp;nbsp; Comments: &amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;&lt;ul style='margin-top: 0px; margin-bottom: 15px; margin-left: 0px; padding: 5px'&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;Often used with \"わけじゃない\" for \"not like that\", &lt;br /&gt;\n\"that's not the reason\" (contributor: &lt;i&gt;Amatuka&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;is it ok to say this?&lt;br /&gt;\n&lt;br /&gt;\nうなぎはおいしい。毎週食べるわけです。&lt;br /&gt;\n(unagi is delicious.  thats why I eat it every week). (contributor: &lt;i&gt;hatsumomo&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;Yes, it's ok but I think それが毎週食べる訳です。is more natural. (contributor: &lt;i&gt;Miki&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;b&gt;&lt;A HREF=\"http://jgram.org/pages/viewOne.php?tagE=wake\" TARGET=\"_blank\"&gt;wake&lt;/a&gt;&lt;/b&gt; like zen &lt;b&gt;&lt;A HREF=\"http://jgram.org/pages/viewOne.php?tagE=wasabi\" TARGET=\"_blank\"&gt;wasabi&lt;/a&gt;&lt;/b&gt; seems one of the most difficult multipurpose phrases to translate in japanese. it means reason, circumstance, method, many things. (contributor: &lt;i&gt;dc&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;What is zen wasabi? Do you mean wabi sabi? (contributor: &lt;i&gt;Miki&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;それが毎週食べる訳です might be そのわけで毎週食べてます.&lt;br /&gt;\nI kinda like \"zen wasabi\" as a subsitute for \"wabi and sabi\"!&lt;br /&gt;\n (contributor: &lt;i&gt;bamboo4&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;私は 訳  もなく悲しくなった。&lt;br /&gt;\nshouldn't it be:&lt;br /&gt;\n私は 訳  もなくて悲しくなった。 (contributor: &lt;i&gt;KotatsuSama&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;訳 もなく悲しくなった is better, while the other is kind of awkward. (contributor: &lt;i&gt;bamboo4&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;”わけ”　is usually use in oral ? moreover, is it same use to \"理由”? appreciate in  teaching me. (contributor: &lt;i&gt;hkhkhk8888&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;\"訳（わけ）\" is used in oral and written.&lt;br /&gt;\n訳 does not always mean 理由 as you can see english for this 訳 entry. 訳 in ex &lt;b&gt;&lt;a href=#1268&gt;#1268&lt;/a&gt;&lt;/b&gt;, &lt;b&gt;&lt;a href=#1269&gt;#1269&lt;/a&gt;&lt;/b&gt;, &lt;b&gt;&lt;a href=#1270&gt;#1270&lt;/a&gt;&lt;/b&gt; means different from \"理由\". (contributor: &lt;i&gt;Miki&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;わけ originally comes from the act of dividing things into what is right and what is wrong.Therefore, わけ came to mean \"reason\" or the rationale of how things are done. That later got expanded to include the amorous relationship in the sense of \"there is a reason for them to be together or in love,\" as suggested by &lt;b&gt;&lt;a href=#1268&gt;#1268&lt;/a&gt;&lt;/b&gt;.&lt;br /&gt;\n (contributor: &lt;i&gt;bamboo4&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;〜わけだ:&lt;br /&gt;\n１．〜ということが納得できる (no wonder.../ that's why....)&lt;br /&gt;\n&lt;br /&gt;\n2.　〜という結論になる; Note:「〜というわけだ」の形も多い。&lt;br /&gt;\ne.g. 「200キロ1000円なら、2000円で400キロ買えるわけだ。」&lt;br /&gt;\n (contributor: &lt;i&gt;誠&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;「〜というわけだ。」: (Therefore) 〜as a conclusion / 〜as a result / \"By this reason....., therefore can be concluded that 〜\"/ \"It can be said that 〜　as a conclusion/result\"  &lt;br /&gt;\n&lt;br /&gt;\n&lt;br /&gt;\n「〜というわけで．．．」: \"By 〜 as the conclusion,... \"/ \"Concluding with 〜 as a result,...\"&lt;br /&gt;\n&lt;br /&gt;\n「〜というわけではない」: \"It can't be concluded that 〜\" /  \"It doesn't mean that 〜\" / \"It doesn't follow that 〜 as a conclusion/result\"&lt;br /&gt;\n&lt;br /&gt;\n〜次第だ：〜というわけだ　（事情／経過を示す）&lt;br /&gt;\ne.g.「　．．．。以上のような次第で、....」＝&lt;br /&gt;\n　　「．．．というわけで、....」&lt;br /&gt;\n (contributor: &lt;i&gt;誠&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;&lt;b&gt;&lt;a href=#5735&gt;#5735&lt;/a&gt;&lt;/b&gt; 勉強を残るわけにはいかない。doesn't make sense. Need to change the verb.&lt;br /&gt;\n (contributor: &lt;i&gt;Miki&lt;/i&gt;)&lt;BR /&gt;\n&lt;li type=square style='list-style-position: outside; margin-left: 15px'&gt;A slang term that's used a LOT is \"訳分からない”：”I don't get it.\"/\"what the heck are they talking about\"... very useful! ^_^  (contributor: &lt;i&gt;EvilKyra&lt;/i&gt;)&lt;BR /&gt;\n\n&lt;br /&gt;[ &lt;a href='http://www.jgram.org/pages/viewOne.php?tagE=wake'&gt;Add a Comment&lt;/a&gt; ]&lt;br /&gt;\n&lt;/ul&gt;\n   </description>\n   <pubDate>Wed, 20 Nov 2019 01:08:02 PST</pubDate>\n</item>\n</channel>\n"
