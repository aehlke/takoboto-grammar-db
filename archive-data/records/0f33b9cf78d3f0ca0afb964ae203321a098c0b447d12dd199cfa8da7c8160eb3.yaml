notes:
  - position: 0
    text: "\"after much (verb)-ing\"\n\n\n\r\nageku implies doing something a lot. \n\n\n\r\n\"after much to-ing and fro-ing we finally decided to ..\"\n\n\n\r\n悩んだ挙句、\n\r\n\"after a lot of worrying, we gave up caring\""
    html: "\"after much (verb)-ing\"<br/>\n<br/>\r\nageku implies doing something a lot. <br/>\n<br/>\r\n\"after much to-ing and fro-ing we finally decided to ..\"<br/>\n<br/>\r\n悩んだ挙句、<br/>\r\n\"after a lot of worrying, we gave up caring\"<br/>\n<br/>\n<br/>"
    credits_raw: dc
