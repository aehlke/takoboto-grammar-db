    original_updated_at: null
  - position: 1
    text: "ageku and kekkyoku do both seem to be negative\n\nyatto seems to be mostly positive \n\nsekkaku can be both\n\n\n\r\n勉強したあげくに卒業しました\n\r\nafter much studying, i graduated \n\r\n(implies a long sigh about the process of studying... even though the result was positive)\n\n\n\r\nせっかく勉強したので、卒業しました\n\r\nthanks to all the studying, I passed!\n\n\n\r\nヤット！卒業しました！\n\r\nfinally! I passed!\n\n\n\r\n勉強した後、卒業しました\n\r\nafter studying, I passed.\n\n\n\r\n注意→　日本語のnative speakerチェックして下さい！"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageku\">ageku</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kekkyoku\">kekkyoku</a></b> do both seem to be negative<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=yatto\">yatto</a></b> seems to be mostly positive <br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=sekkaku\">sekkaku</a></b> can be both<br/>\n<br/>\r\n勉強したあげくに卒業しました<br/>\r\nafter much studying, i graduated <br/>\r\n(implies a long sigh about the process of studying... even though the result was positive)<br/>\n<br/>\r\nせっかく勉強したので、卒業しました<br/>\r\nthanks to all the studying, I passed!<br/>\n<br/>\r\nヤット！卒業しました！<br/>\r\nfinally! I passed!<br/>\n<br/>\r\n勉強した後、卒業しました<br/>\r\nafter studying, I passed.<br/>\n<br/>\r\n注意→　日本語のnative speakerチェックして下さい！"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "corrections to note above:\n\n\n\r\n勉強したあげくに卒業しました It's better to add adjectives to make it natural.\n\r\n→suggestion : 散々（さんざん） or 色々（いろいろ）_勉強した挙句に卒業しました。\n\n\n\r\nせっかく勉強したので、卒業しました\n\r\n→suggestion : 折角（せっかく）\n\r\n折角勉強したので、教師（きょう）の資格（しかく）を取得（しゅとく）して、卒業しました。\n\r\nSince I studied it all the way, I passed with a teacher's license.\n\r\n折角勉強したのに、卒業することができませんでした。\n\n\n\r\n勉強した後、卒業しました→勉強した後、合格しました。\n\r\nafter studying, I passed."
    html: "corrections to note above:<br/>\n<br/>\r\n勉強したあげくに卒業しました It's better to add adjectives to make it natural.<br/>\r\n→suggestion : 散々（さんざん） or 色々（いろいろ）_勉強した挙句に卒業しました。<br/>\n<br/>\r\nせっかく勉強したので、卒業しました<br/>\r\n→suggestion : 折角（せっかく）<br/>\r\n折角勉強したので、教師（きょう）の資格（しかく）を取得（しゅとく）して、卒業しました。<br/>\r\nSince I studied it all the way, I passed with a teacher's license.<br/>\r\n折角勉強したのに、卒業することができませんでした。<br/>\n<br/>\r\n勉強した後、卒業しました→勉強した後、合格しました。<br/>\r\nafter studying, I passed."
    credits_raw: dc
    source_id: null
    original_created_at: null
