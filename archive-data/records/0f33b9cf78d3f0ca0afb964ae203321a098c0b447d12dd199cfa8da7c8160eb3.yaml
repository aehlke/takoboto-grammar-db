    text: "(n-adv,n-t) Noun-Adverb (a noun that can be used as an adverb) + Noun-timelike (a noun that can be used where a 'time' reference is expected).\n\n\n\r\nNoun use 'ageku no hate' - ageku modifies hate\n\r\n'time-like' use 'ageku kare no sasoi wo kotawatte shimatta.' (ageku specifies when 'kare no ...')"
