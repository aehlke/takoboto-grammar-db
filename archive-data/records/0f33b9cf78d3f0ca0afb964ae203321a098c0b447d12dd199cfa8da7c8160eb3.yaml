  - position: 4
    text: "According to a native speaker, this grammar adds a negative feeling to the sentence, so either the first part preceding the 挙句 or the following part should have a negative feel to reflect that. \n\n\n\r\nIn the example:\n\r\n「散々考えた挙げ句その計画を実行にうつした」\n\r\nthis is equivalent to \n\r\n「散々悩んだ挙げ句その計画を実行にうつした」\n\r\nin feeling due to the presence of 挙句. \n\n\n\r\nSimilarly in another example\n\r\n「両親に相談したあげくに、彼と結婚することにした。」\n\r\nsounds unnatural, because the decision to marry someone is a positive one. If it was instead \n\r\n「両親に相談したあげくに、彼と離婚することにした。」\n\r\nthen it would sound more natural because divorce has a negative connotation."
    html: "According to a native speaker, this grammar adds a negative feeling to the sentence, so either the first part preceding the 挙句 or the following part should have a negative feel to reflect that. <br/>\n<br/>\r\nIn the example:<br/>\r\n「散々考えた挙げ句その計画を実行にうつした」<br/>\r\nthis is equivalent to <br/>\r\n「散々悩んだ挙げ句その計画を実行にうつした」<br/>\r\nin feeling due to the presence of 挙句. <br/>\n<br/>\r\nSimilarly in another example<br/>\r\n「両親に相談したあげくに、彼と結婚することにした。」<br/>\r\nsounds unnatural, because the decision to marry someone is a positive one. If it was instead <br/>\r\n「両親に相談したあげくに、彼と離婚することにした。」<br/>\r\nthen it would sound more natural because divorce has a negative connotation."
    credits_raw: khyron
    source_id: null
