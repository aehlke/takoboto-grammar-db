notes:
  - position: 0
    text: "I`m not sure if this should be entered as grammar or as vocabulary, but it is a very important saying. Japan has a lot of set phrases and in order to sound natural its best to memorize as many as you can. \n\n\n\r\nあっという間　lit. translates to \n\r\n\"In the middle of saying あぁ”\n\n\n\r\nbefore you could finish your sentence time had run out"
