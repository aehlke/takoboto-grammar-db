notes:
  - position: 0
    text: "On the difference between nitaienai1 and nitaienai2\n\r\nThere are two たえないs of note in the Japanese language... hurray.　How to distinguish them?\n\nnitaienai1 is for saying you just can't stand something and should be constructed from VERB辞書形 + にたえない\n\nnitaienai2 is for saying that you have a strong emotional reaction to something - \"氏の当会へのご援助はまことに感謝に堪えません｜We cannot be too grateful to him for the help he has given our society.\" and should be constructed NOUN + たえない.\n\n\n\r\nBoth are on the old JLPT 1 syllabus, if anyone knows what's on the new N1, please advise"
    html: "<b>On the difference between <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitaienai1\">nitaienai1</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitaienai2\">nitaienai2</a></b></b><br/>\r\nThere are two たえないs of note in the Japanese language... hurray.　How to distinguish them?<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitaienai1\">nitaienai1</a></b> is for saying you just can't stand something and should be constructed from VERB辞書形 + にたえない<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitaienai2\">nitaienai2</a></b> is for saying that you have a strong emotional reaction to something - \"氏の当会へのご援助はまことに感謝に堪えません｜We cannot be too grateful to him for the help he has given our society.\" and should be constructed NOUN + たえない.<br/>\n<br/>\r\nBoth are on the old JLPT 1 syllabus, if anyone knows what's on the new N1, please advise"
    credits_raw: LR
