notes:
  - position: 0
    text: "(名詞)＋〜のことだから:〜という特徴のある．．．だから．．．（〜と予想される）\n\n\n\r\nTherefore, it has the meaning of :\n\n\n\r\n\"It is therefore typical of he/she to ....,being (serious, ect) all this while\"\n\n\n\r\n\"Being a (characteristics,e.g. serious) person, it is typical of he/she to...\"\n\n\n\r\n\"As it is known for his/her 〜, he/she will therefore .... \"\n\n\n\r\n\"Known for his/her 〜, he/ she will therefore .... \""
    html: "(名詞)＋〜のことだから:〜という特徴のある．．．だから．．．（〜と予想される）<br/>\n<br/>\r\nTherefore, it has the meaning of :<br/>\n<br/>\r\n\"It is therefore typical of he/she to ....,being (serious, ect) all this while\"<br/>\n<br/>\r\n\"Being a (characteristics,e.g. serious) person, it is typical of he/she to...\"<br/>\n<br/>\r\n\"As it is known for his/her 〜, he/she will therefore .... \"<br/>\n<br/>\r\n\"Known for his/her 〜, he/ she will therefore .... \""
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "This is the only acceptable use of this grammar:\n\r\nＮ + の + ことだから\n\n\n\r\n「Ａ(の)ことだから、Ｂ」\n\r\nThe case where Ａ is a person occurs often. Ｂ predicts or anticipates the nature or usual circumstances of Ａ."
    html: "This is the only acceptable use of this grammar:<br/>\r\nＮ + の + ことだから<br/>\n<br/>\r\n「Ａ(の)ことだから、Ｂ」<br/>\r\nThe case where Ａ is a person occurs often. Ｂ predicts or anticipates the nature or usual circumstances of Ａ."
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
