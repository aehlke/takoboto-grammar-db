comments:
  - position: 0
    credits_raw: 誠
    text: "Only ex#251 fits into this category of grammar, ex #3788, ex #3790 , ex #3792  all not examples of this grammar pattern, they are こと(事）　＋　だから。Therefore is :\n\n\n\r\nex#3788 : そういうこと　＋　だから\n\r\nex#3790 : 大事なこと　＋　だから\n\r\nex#3792 : やったこと　＋　だから\n\r\nThe above 3 examples, こと can be replaced by 事"
    html: "Only ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#251\">#251</a></b> fits into this category of grammar, ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3788\">#3788</a></b>, ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3790\">#3790</a></b> , ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3792\">#3792</a></b>  all not examples of this grammar pattern, they are こと(事）　＋　だから。Therefore is :<br/>\n<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3788\">#3788</a></b> : そういうこと　＋　だから<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3790\">#3790</a></b> : 大事なこと　＋　だから<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara#3792\">#3792</a></b> : やったこと　＋　だから<br/>\r\nThe above 3 examples, こと can be replaced by 事"
