      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7927
    position: 2
    japanese: これからの企業は単に利益を追求するのみならず、環境に配慮した生産活動を行わなければならない。
    body_text: "これからの企業は単に利益を追求するのみならず、環境に配慮した生産活動を行わなければならない。 \n\n\t\tToday's companies should \n\t\tnot just \n\t\tpursue profits; they should also consider envrionmental protection issues in their production activities."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれからの企業は単に利益を追求する\">\n\t\t\t\tこれからの企業は<strong>単に</strong>利益を追求する<strong>のみならず</strong>、環境に配慮した生産活動を行わなければならない。</a> <br/>\n\t\tToday's companies should \n\t\t<strong>not just </strong>\n\t\tpursue profits; they should also consider envrionmental protection issues in their production activities."
