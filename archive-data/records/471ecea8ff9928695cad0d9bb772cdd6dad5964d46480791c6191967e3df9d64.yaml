category: null
jlpt_level_original: '1'
meaning: |-
  Not only ~ (but also ~); not only that. Used in comparison, juxtaposition, and analogy - literary language. Formal, written. 「AのみならずB(まで)(も)」の形でも用い、「ただ」がつくと、より強調する阜ｻとなる。
meaning_example: I heard that she didn't just look after the the elderly man who'd fallen over, she took him all the way home
