examples:
  - source_id: 7925
    position: 0
    japanese: 富士山はただ高いのみならず、姿も美しいので、日本の象徴として愛されている。
    body_text: "富士山はただ高いのみならず、姿も美しいので、日本の象徴として愛されている。 \n\n\t\tMount Fuji is \n\t\tnot just \n\t\ta high mountain, it has a beautiful shape so it is loved as a symbol of Japan."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ富士山はただ高い\">\n\t\t\t\t富士山は<strong>ただ</strong>高い<strong>のみならず</strong>、姿も美しいので、日本の象徴として愛されている。</a> <br/>\n\t\tMount Fuji is \n\t\t<strong>not just </strong>\n\t\ta high mountain, it has a beautiful shape so it is loved as a symbol of Japan."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7926
    position: 1
    japanese: 彼はただ勇敢であるのみならず、優しい心の持ち主である。
    body_text: "彼はただ勇敢であるのみならず、優しい心の持ち主である。 \n\n\t\tHe is \n\t\tnot only \n\t\tbrave, but the owner of a kind heart."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼はただ勇敢である\">\n\t\t\t\t彼は<strong>ただ</strong>勇敢である<strong>のみならず</strong>、優しい心の持ち主である。</a> <br/>\n\t\tHe is \n\t\t<strong>not only </strong>\n\t\tbrave, but the owner of a kind heart."
    credits_raw: LR
