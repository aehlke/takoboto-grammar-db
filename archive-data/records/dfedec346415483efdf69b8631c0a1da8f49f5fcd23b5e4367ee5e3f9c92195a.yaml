    text: "Usage:\n\n\n\r\nnoun + no+kawarini\n\r\n　先生の代わりに\n\r\n　sensei no kawarini\n\n\n\r\nnoun+ ni kawatte\n\r\n　先生に代わって\n\n\n\r\nverb-masu + kawarini\n\r\n　遊ぶ代わりに\n\r\n　asobu kawarini\n\n\n\r\nadj+ kawarini\n\r\n　高い代わりに\n\r\n　takai kawarini"
