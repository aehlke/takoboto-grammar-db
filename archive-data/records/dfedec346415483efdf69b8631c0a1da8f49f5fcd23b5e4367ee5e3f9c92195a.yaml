    text: "kawarini can be used for all the meanings below\n\nnikawatte is mainly for \"instead\"\n\n\n\r\n- on behalf of\n\r\nI will go on your behalf\n\n\n\r\n- instead of\n\r\nI want coffee instead of tea\n\n\n\r\n- to make up for\n\r\nI am going to enjoy myself in the daytime, but to make up for it I intend to study at night."
