    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女は英語はもちろん、フランス語も話せる。\">\n\t\t\t\t彼女は英語<strong>はもちろん</strong>、フランス語も話せる。<strong></strong></a> <br/>\n\t\tShe can speak French, \n\t\t<strong>to say nothing of </strong>\n\t\tEnglish."
