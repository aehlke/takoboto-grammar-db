    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女は言語はもちろん、文学も研究している。\">\n\t\t\t\t彼女は言語<strong>はもちろん</strong>、文学も研究している。\r<strong></strong></a> <br/>\n\t\tShe studies literature as well as language. \n\t\t<strong> </strong>"
