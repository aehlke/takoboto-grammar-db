    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は、勉強はもちろんスポーツもよくできる。 \">\n\t\t\t\t彼は、勉強<strong>はもちろん</strong>スポーツもよくできる。 <strong></strong></a> <br/>\n\t\tHe is not only a good student, he is a good athlete \n\t\t<strong>as well </strong>\n\t\t。"
