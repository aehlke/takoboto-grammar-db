    japanese: 国が違うと、言葉や文化はもちろん、人々の考え方まで違う。
    body_text: "国が違うと、言葉や文化はもちろん、人々の考え方まで違う。 \n\n\t\tIn different countries \n\t\tnot only \n\t\tare the language and culture different, but so is the way people think."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ国が違うと、言葉や文化はもちろん、人々の考え方まで違う。\">\n\t\t\t\t国が違うと、言葉や文化<strong>はもちろん、</strong>人々の考え方まで違う。<strong></strong></a> <br/>\n\t\tIn different countries \n\t\t<strong>not only </strong>\n\t\tare the language and culture different, but so is the way people think."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 321
    position: 1
    japanese: あのレストランはサービスはもちろん味も悪くない。
    body_text: "あのレストランはサービスはもちろん味も悪くない。 \n\n\t\tThat restaurant \n\t\tof course \n\t\tthe service is good but also the food (LIT: flavor) is not bad."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあのレストランはサービスはもちろん味も悪くない。\">\n\t\t\t\tあのレストランはサービス<strong>はもちろん</strong>味も悪くない。<strong></strong></a> <br/>\n\t\tThat restaurant \n\t\t<strong>of course </strong>\n\t\tthe service is good but also the food (LIT: flavor) is not bad."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3375
    position: 2
    japanese: 彼は私たちに着物はもちろんお金もくれた。
    body_text: "彼は私たちに着物はもちろんお金もくれた。\r \n\n\t\tHe gave us not only clothes but some money."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は私たちに着物はもちろんお金もくれた。\">\n\t\t\t\t彼は私たちに着物<strong>はもちろん</strong>お金もくれた。\r<strong></strong></a> <br/>\n\t\tHe gave us not only clothes but some money. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3376
    position: 3
    japanese: 彼は書くことはもちろん読むことも出来ない。
    body_text: "彼は書くことはもちろん読むことも出来ない。 \n\n\t\tHe can't even read, \n\t\tlet alone \n\t\twrite."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は書くことはもちろん読むことも出来ない。\">\n\t\t\t\t彼は書くこと<strong>はもちろん</strong>読むことも出来ない。<strong></strong></a> <br/>\n\t\tHe can't even read, \n\t\t<strong>let alone </strong>\n\t\twrite."
