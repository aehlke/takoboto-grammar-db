    body_text: "疲れきっていたので勉強するのはもちろん考えるのも嫌だった。  \n\n\t\tI was too exhausted to think, let alone study."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ疲れきっていたので勉強するのはもちろん考えるのも嫌だった。 \">\n\t\t\t\t疲れきっていたので勉強するの<strong>はもちろん</strong>考えるのも嫌だった。 <strong></strong></a> <br/>\n\t\tI was too exhausted to think, let alone study. \n\t\t<strong> </strong>"
