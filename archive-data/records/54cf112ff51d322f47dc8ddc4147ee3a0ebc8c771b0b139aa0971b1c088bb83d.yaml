  - source_id: 3377
    position: 4
    japanese: 彼は走ることはもちろん、歩くこともできない。
    body_text: "彼は走ることはもちろん、歩くこともできない。\r \n\n\t\tHe cannot walk, let alone run."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は走ることはもちろん、歩くこともできない。\">\n\t\t\t\t彼は走ること<strong>はもちろん</strong>、歩くこともできない。\r<strong></strong></a> <br/>\n\t\tHe cannot walk, let alone run. \n\t\t<strong> </strong>"
