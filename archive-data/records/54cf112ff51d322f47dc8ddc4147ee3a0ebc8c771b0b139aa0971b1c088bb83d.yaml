    body_text: "彼女はピアノはもちろんのこと、バイオリンも弾ける。\r \n\n\t\tShe can play the violin, not to mention the piano."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女はピアノはもちろんのこと、バイオリンも弾ける。\">\n\t\t\t\t彼女はピアノ<strong>はもちろん</strong>のこと、バイオリンも弾ける。\r<strong></strong></a> <br/>\n\t\tShe can play the violin, not to mention the piano. \n\t\t<strong> </strong>"
