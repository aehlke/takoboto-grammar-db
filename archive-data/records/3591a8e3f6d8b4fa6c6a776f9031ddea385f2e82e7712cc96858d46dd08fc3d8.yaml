    body_text: "今週末から来週にかけて大蔵大臣は中国を訪問する嵐閧ｾ。 \n\n\t\tThe Minister of Finance is scheduled to visit China from this weekend \n\t\tto \n\t\t  early next week."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ今週末から来週にかけて大蔵大臣は中国を訪問する嵐閧ｾ。\">\n\t\t\t\t今週末から来週<strong>にかけて</strong>大蔵大臣は中国を訪問する嵐閧ｾ。<strong></strong></a> <br/>\n\t\tThe Minister of Finance is scheduled to visit China from this weekend \n\t\t<strong>to </strong>\n\t\t  early next week."
