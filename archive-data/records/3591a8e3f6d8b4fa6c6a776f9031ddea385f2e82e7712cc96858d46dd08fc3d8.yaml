  - position: 5
    credits_raw: jpmandy
    text: "#\x01 \n\r\n（〜から〜にかけて』は始まりと終わりがそれほどはっきりしていない。後の文は一回だけのことではなく。連続的なこと。\n\r\nだから、『彼は腰からひざまでびしょぬれになった』のほうが正しいと思います。"
    html: "<b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=kara-nikakete#\x01\">#\x01</a></b> <br/>\r\n（〜から〜にかけて』は始まりと終わりがそれほどはっきりしていない。後の文は一回だけのことではなく。連続的なこと。<br/>\r\nだから、『彼は腰からひざまでびしょぬれになった』のほうが正しいと思います。"
    source_id: null
    original_created_at: null
