    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "Yes but nuance is different.\n\r\nWhen you use \"made\", the end of time/place is very clear. While \"nikakete\" is the end is ambiguous."
    html: "Yes but nuance is different.<br/>\r\nWhen you use \"made\", the end of time/place is very clear. While \"nikakete\" is the end is ambiguous."
