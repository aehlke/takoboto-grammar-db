    body_text: "彼は腰からひざにかけてびしょぬれになった。 \n\n\t\tHe got drenched \n\t\tfrom \n\t\tthe waist to the knees."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は腰からひざにかけてびしょぬれになった。\">\n\t\t\t\t彼は腰からひざ<strong>にかけて</strong>びしょぬれになった。<strong></strong></a> <br/>\n\t\tHe got drenched \n\t\t<strong>from </strong>\n\t\tthe waist to the knees."
