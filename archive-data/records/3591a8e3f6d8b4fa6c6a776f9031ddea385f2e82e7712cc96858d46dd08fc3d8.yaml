    japanese: 秋から冬にかけては、秋味と呼ばれる鮭の旬です。
    body_text: "秋から冬にかけては、秋味と呼ばれる鮭の旬です。 \n\n\t\tThe \n\t\tperiod from \n\t\tautumn to winter is the season of the 'autumn flavour' salmon."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ秋から冬\">\n秋<strong>から</strong>冬<strong>にかけて</strong>は、秋味と呼ばれる鮭の旬です。</a> <br/>\n\t\tThe \n\t\t<strong>period from </strong>\n\t\tautumn to winter is the season of the 'autumn flavour' salmon."
    credits_raw: Amatuka
