    text: "Gerund form (Ｖて形) + は + いけない\n\r\nGerund form (Ｖて形) + は + いけません\n\r\nDoing that, it cannot work. => You should not do that."
    html: "Gerund form (Ｖて形) + は + いけない<br/>\r\nGerund form (Ｖて形) + は + いけません<br/>\r\nDoing that, it cannot work. =&gt; You should not do that."
