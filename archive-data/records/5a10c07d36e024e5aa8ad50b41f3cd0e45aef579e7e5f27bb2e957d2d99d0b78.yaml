  - position: 2
    credits_raw: blabby
    text: "Miki, thanks for your valuable advice.\n\n\n\r\nIn #5428, I understand that the の is optional but is #5432 incorrect?  Or are 生けるがごとく and 生けるごとく both acceptable?　Google gives me 79 results to 31 respectively.\n\n\n\r\nRather than delete #5433, I marked it as \"question\" so other readers can see that it is different."
    html: "Miki, thanks for your valuable advice.<br/>\n<br/>\r\nIn <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=gotoki%2Fgotoku#5428\">#5428</a></b>, I understand that the の is optional but is <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=gotoki%2Fgotoku#5432\">#5432</a></b> incorrect?  Or are 生けるがごとく and 生けるごとく both acceptable?　Google gives me 79 results to 31 respectively.<br/>\n<br/>\r\nRather than delete <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=gotoki%2Fgotoku#5433\">#5433</a></b>, I marked it as \"question\" so other readers can see that it is different.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: bamboo4
    text: "ごとく or 如く is literal diction and not normally used (sounds pedantic) in conversational speech. ような or ように can usually replace ごとく. \n\r\nAs between 生けるがごとく and 生けるごとく, the former is the conventional usage, but the latter is more or less acceptable (with emphasis on \"less\")."
    html: "ごとく or 如く is literal diction and not normally used (sounds pedantic) in conversational speech. ような or ように can usually replace ごとく. <br/>\r\nAs between 生けるがごとく and 生けるごとく, the former is the conventional usage, but the latter is more or less acceptable (with emphasis on \"less\")."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: 「ごとく、ごとき」は「ように、ような」の古い言葉で、名詞の前に付かれて、改まった場所での会話や、硬い文章に使われます。
    html: 「ごとく、ごとき」は「ように、ような」の古い言葉で、名詞の前に付かれて、改まった場所での会話や、硬い文章に使われます。
    source_id: null
    original_created_at: null
    original_updated_at: null
