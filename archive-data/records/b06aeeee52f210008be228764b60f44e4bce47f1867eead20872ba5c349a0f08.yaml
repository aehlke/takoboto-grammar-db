notes:
  - position: 0
    text: "科学者にして出来事\n\n\n\r\nother similar meanings:\n\n\n\ndake だけ only：\n\r\n　科学者＿だけ＿出来事\n\r\n　a thing only a scholar could do\n\n\n\ndakara だから so\n\r\n　科学者＿だから＿出来た\n\r\n　he is a scholar so he could do it\n\n\n\ndakarakoso だからこそ due to/because of\n\r\n　科学者だからこそできた\n\r\n　because he is a great scholar he could do it"
    html: "科学者にして出来事<br/>\n<br/>\r\nother similar meanings:<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=dake\">dake</a></b> だけ only：<br/>\r\n　科学者＿だけ＿出来事<br/>\r\n　a thing only a scholar could do<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=dakara\">dakara</a></b> だから so<br/>\r\n　科学者＿だから＿出来た<br/>\r\n　he is a scholar so he could do it<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=dakarakoso\">dakarakoso</a></b> だからこそ due to/because of<br/>\r\n　科学者だからこそできた<br/>\r\n　because he is a great scholar he could do it"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
examples:
  - source_id: 5146
    position: 0
    japanese: かれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者にして初めてできることであろう。
    body_text: "かれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者にして初めてできることであろう。\r \n\n\t\tHe worked hard to execute Nobel Prize level research. This was the something only a great scholar could achieve."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJかれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者にして初めてできることであろう。\">\n\t\t\t\tかれはノーベル賞に値する研究を成し遂げた。これは、偉大な科学者<strong>にして</strong>初めてできることであろう。\r<strong></strong></a> <br/>\n\t\tHe worked hard to execute Nobel Prize level research. This was the something only a great scholar could achieve. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - red-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6138
    position: 1
    japanese: 留学生にして日本に行った。
    body_text: "留学生にして日本に行った。 \n\nOnly \n\t\tas a student did I go to Japan."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ留学生にして日本に行った。\">\n留学生<strong>にして</strong>日本に行った。<strong></strong></a> <br/>\n<strong>Only </strong>\n\t\tas a student did I go to Japan."
    credits_raw: Perches
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6139
    position: 2
    japanese: ９０歳 にして彼はいまだに驚くほど元気である。
    body_text: "９０歳 にして彼はいまだに驚くほど元気である。 \n\nAt the age of ninety \n\t\the still has surprising vigour."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ９０歳 にして彼はいまだに驚くほど元気である。\">\n９０歳 <strong>にして</strong>彼はいまだに驚くほど元気である。<strong></strong></a> <br/>\n<strong>At the age of ninety </strong>\n\t\the still has surprising vigour."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7814
    position: 3
    japanese: これは長年訓練を積んだ彼のような人にして初めてできる技だ。
    body_text: "これは長年訓練を積んだ彼のような人にして初めてできる技だ。 \n\n\t\tThis is a skill that only a person with long-term training such as he can pull off."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれは長年訓練を積んだ彼のような人にして初めてできる技だ。\">\n\t\t\t\tこれは長年訓練を積んだ彼のような人<strong>にして</strong>初めてできる技だ。<strong></strong></a> <br/>\n\t\tThis is a skill that only a person with long-term training such as he can pull off. \n\t\t<strong> </strong>"
