examples:
  - source_id: 405
    position: 0
    japanese: 以前は経験を元にして設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。
    body_text: "以前は経験を元にして設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。 \n\n\t\tBefore we would design \n\t\tfrom our \n\t\tpast experience but now experience and intuition alone aren't enough to built a machine that can win races."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ以前は経験を元にして設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。\">\n\t\t\t\t以前は経験<strong>を元にして</strong>設計していましたが、 今や経験と勘だけではレースに勝てるような マシンを作ることはできません。<strong></strong></a> <br/>\n\t\tBefore we would design \n\t\t<strong>from our </strong>\n\t\tpast experience but now experience and intuition alone aren't enough to built a machine that can win races."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3369
    position: 1
    japanese: この映画は小説をもとにしている。
    body_text: "この映画は小説をもとにしている。\r \n\n\t\tThis film is an adaptation of a novel."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの映画は小説をもとにしている。\">\n\t\t\t\tこの映画は小説<strong>をもとにして</strong>いる。\r<strong></strong></a> <br/>\n\t\tThis film is an adaptation of a novel. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3370
    position: 2
    japanese: 自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。
    body_text: "自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。\r \n\n\t\tAround his facts the scientist weaves a logical pattern or theory which gives the facts meaning, order, and significance."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。\">\n\t\t\t\t自分が集めた事実<strong>をもとにして</strong>、科学者は、その事実に意味と秩序と勝ちを与える論理の模様すなわち理論を織りあげるのである。\r<strong></strong></a> <br/>\n\t\tAround his facts the scientist weaves a logical pattern or theory which gives the facts meaning, order, and significance. \n\t\t<strong> </strong>"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3371
    position: 3
    japanese: 彼は親譲りの財産をもとにして富を作った。
    body_text: "彼は親譲りの財産をもとにして富を作った。\r \n\n\t\tHe built on his father's fortune."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は親譲りの財産をもとにして富を作った。\">\n\t\t\t\t彼は親譲りの財産<strong>をもとにして</strong>富を作った。\r<strong></strong></a> <br/>\n\t\tHe built on his father's fortune. \n\t\t<strong> </strong>"
