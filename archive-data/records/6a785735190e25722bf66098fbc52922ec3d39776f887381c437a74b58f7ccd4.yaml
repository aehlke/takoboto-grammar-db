  - position: 6
    credits_raw: tigert
    text: "Hey 赤毛､　I agree with you. the と　in 納豆が美味しいと気が付いた　is a quotation marker. it is the same と used in 納豆が美味しいと思います. but it has nothing to do with the second 気が付ける｡\n\n\n\n\n\r\nI think there should also be a note about the diffrence between 気が付ける　and 気を付ける　their meanings are completely diffrent. the first being \"I realized\" and the second being \"being safe\" or \"taking care\"\n\n\n\r\nwell thats my two yen lol じゃね"
    html: "Hey 赤毛､　I agree with you. the と　in 納豆が美味しいと気が付いた　is a quotation marker. it is the same と used in 納豆が美味しいと思います. but it has nothing to do with the second 気が付ける｡<br/>\n<br/>\n<br/>\r\nI think there should also be a note about the diffrence between 気が付ける　and 気を付ける　their meanings are completely diffrent. the first being \"I realized\" and the second being \"being safe\" or \"taking care\"<br/>\n<br/>\r\nwell thats my two yen lol じゃね"
    source_id: null
    original_created_at: null
    original_updated_at: null
