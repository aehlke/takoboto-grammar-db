notes:
  - position: 0
    text: "＊This expression is meant to emphasize the speaker's criticism or judgement. See example #6233, #6234, and #6235.\n\n\n\r\n＊Be careful with というもの because という by itself or with other pieces of grammar, such as ということ, have COMPLETELY different uses and meanings. It's difficult to offer a good English translation of this grammar other than \"what's called,\" and some of the below examples may be for the wrong grammar.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + というもの(だ)\n\r\nなＡ・Ｎ + というもの(だ)"
    html: "＊This expression is meant to emphasize the speaker's criticism or judgement. See example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toiumono#6233\">#6233</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toiumono#6234\">#6234</a></b>, and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toiumono#6235\">#6235</a></b>.<br/>\n<br/>\r\n＊Be careful with というもの because という by itself or with other pieces of grammar, such as ということ, have COMPLETELY different uses and meanings. It's difficult to offer a good English translation of this grammar other than \"what's called,\" and some of the below examples may be for the wrong grammar.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + というもの(だ)<br/>\r\nなＡ・Ｎ + というもの(だ)"
