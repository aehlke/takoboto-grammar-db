    text: "A good translation of the 2nd form is \"it's obvious that\".\n\r\ne.g. これ以上待つのはそれこそ時間の浪費というものだ。could be translated as \"It's _obviously_ a waste of time to wait any longer than this."
    html: "A good translation of the 2nd form is \"it's obvious that\".<br/>\r\ne.g. これ以上待つのはそれこそ時間の浪費というものだ。could be translated as \"It's _obviously_ a waste of time to wait any longer than this."
