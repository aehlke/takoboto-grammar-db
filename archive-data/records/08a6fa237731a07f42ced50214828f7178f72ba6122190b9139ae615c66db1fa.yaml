  - position: 7
    credits_raw: tigert
    text: "If I`m not mistaken　のに　carries with it a sense that the result was contradictory to what one would usually expect. IE 「If someone is dashing down the stairs, of course he/she will be able to catch his/her train. yet dispite all that dashing he/she failed to catch his/her train」\n\r\nそな通りですか"
    html: "If I`m not mistaken　のに　carries with it a sense that the result was contradictory to what one would usually expect. IE 「If someone is dashing down the stairs, of course he/she will be able to catch his/her train. yet dispite all that dashing he/she failed to catch his/her train」<br/>\r\nそな通りですか"
