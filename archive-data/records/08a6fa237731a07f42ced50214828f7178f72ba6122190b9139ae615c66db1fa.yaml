    label: noni-2
    annotation_text: "noni-2    (Careful not to get のに (but / although) mixed up with のに (to / in order to).\n\r\nThe 'but' のに is joins two sentences while the 'in order to' is the nominaliser の + に) [Amatuka]"
    annotation_html: "<a href=\"http://jgram.org:80/pages/viewOne.php?tagE=noni-2\">noni-2</a>    (Careful not to get のに (but / although) mixed up with のに (to / in order to).<br/>\r\nThe 'but' のに is joins two sentences while the 'in order to' is the nominaliser の + に) [<a href=\"http://jgram.org:80/pages/contributions.php?author=Amatuka\">Amatuka</a>]"
    credits_raw: Amatuka
