notes:
  - position: 0
    text: "I think this can better be translated as 'despite' or 'in spite of' or 'even though' rather than 'although' or 'but' as there are many forms of 'but' which is rather confusing.\n\n\n\r\nEG: Even though I dashed down the stairs/ despite dashing down the stairs, I missed the train by one minute."
    html: "I think this can better be translated as 'despite' or 'in spite of' or 'even though' rather than 'although' or 'but' as there are many forms of 'but' which is rather confusing.<br/>\n<br/>\r\nEG: Even though I dashed down the stairs/ despite dashing down the stairs, I missed the train by one minute.<br/>"
    credits_raw: BB
    source_id: null
    original_created_at: null
    original_updated_at: null
