    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJうちの会社は人手が足りないから、ひまなわけがない。\">\n\t\t\t\tうちの会社は人手が足りないから、ひまな<strong>わけがない。</strong><strong></strong></a> <br/>\n\t\tSince my company has unsufficient workers, \n\t\t<strong>there's no way </strong>\n\t\tI can have free time."
