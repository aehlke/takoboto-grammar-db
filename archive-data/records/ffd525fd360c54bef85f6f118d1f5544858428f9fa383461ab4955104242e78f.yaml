  - position: 1
    credits_raw: PACMAN
    text: "ex #5817 ex #5819\n\r\nThe english translation is a bit misleading.  Rather than use \"there is no reason\", it would be better to use \"there is no way\".\"there is no reason\" needs a negative afterwards to make sense."
    html: "ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wakeganai,+wakehanai#5817\">#5817</a></b> ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wakeganai,+wakehanai#5819\">#5819</a></b><br/>\r\nThe english translation is a bit misleading.  Rather than use \"there is no reason\", it would be better to use \"there is no way\".\"there is no reason\" needs a negative afterwards to make sense."
