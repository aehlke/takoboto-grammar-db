  - position: 1
    text: "＊This grammar is meant to express strong negative judgement.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + わけがない\n\r\nいＡ + わけがない\n\r\nなＡ + わけがない\n\r\nＮ + の・である + わけがない"
    html: "＊This grammar is meant to express strong negative judgement.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + わけがない<br/>\r\nいＡ + わけがない<br/>\r\nなＡ + わけがない<br/>\r\nＮ + の・である + わけがない"
