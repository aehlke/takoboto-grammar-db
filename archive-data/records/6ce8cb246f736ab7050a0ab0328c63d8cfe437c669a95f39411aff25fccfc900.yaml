    text: 「であろうと」は書き方ので、「だろうと」を話せるんですか？それとも他の阜ｻを使う？
    html: |-
      「であろうと」は書き方ので、「だろうと」を話せるんですか？それとも他の阜ｻを使う？<br/>
      <br/>
