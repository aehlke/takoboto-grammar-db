  - position: 6
    credits_raw: 誠
    text: "ex #1202 \" (Generally known), companies do have the possiblity of facing bankruptcy\". \n\r\nWhere here I treat the sentence as 会社は潰れる　＋　ものだ. But if you want to say \" The company is a thing that can face bankruptcy\" then you are treating it as 会社は＋潰れるものだ which is a dfferent meaning. \n\r\nSo ex#1202 isn't a good example and I think can be safely removed. 〜ものだ usually used in advising or reminding someone of something of a common sense and a sense of \"should\"ness or obligation . \n\r\n\"It is common sense that (one should)....\""
    html: "ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda#1202\">#1202</a></b> \" (Generally known), companies do have the possiblity of facing bankruptcy\". <br/>\r\nWhere here I treat the sentence as 会社は潰れる　＋　ものだ. But if you want to say \" The company is a thing that can face bankruptcy\" then you are treating it as 会社は＋潰れるものだ which is a dfferent meaning. <br/>\r\nSo ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda#1202\">#1202</a></b> isn't a good example and I think can be safely removed. 〜ものだ usually used in advising or reminding someone of something of a common sense and a sense of \"should\"ness or obligation . <br/>\r\n\"It is common sense that (one should)....\""
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: nay
    text: "Oh uhm.. no.\n\r\nPlease don't confuse this construction with an other use of mono da.(-> monoda-2)\n\n\n\r\nWhile this one here is used to create a sentence structure which represents a characteristic of the subject instead of describing the actions taken or received by the subject (change of sentence pattern) the latter may be used to express something as common sense [it is (generally) known/common sense that ...(should)\"\t(also an ideal or one’s conviction)] with an emotional nuance.\n\n\n\r\nSo actually I'd say that example #1202 is the one to show this grammars use most obviously. #5894, however, should be moved to \"monoda-2\".\n\n\n\r\nBut as mono da has so many meanings it's hard to differenciate. Though one..\n\n\n\r\nSource: A Dict. of Intermediate Jap. Grammar, p.189;"
    html: "Oh uhm.. no.<br/>\r\nPlease don't confuse this construction with an other use of mono da.(-&gt; monoda-2)<br/>\n<br/>\r\nWhile this one here is used to create a sentence structure which represents a characteristic of the subject instead of describing the actions taken or received by the subject (change of sentence pattern) the latter may be used to express something as common sense [it is (generally) known/common sense that ...(should)\"\t(also an ideal or one’s conviction)] with an emotional nuance.<br/>\n<br/>\r\nSo actually I'd say that example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda#1202\">#1202</a></b> is the one to show this grammars use most obviously. <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda#5894\">#5894</a></b>, however, should be moved to \"monoda-2\".<br/>\n<br/>\r\nBut as mono da has so many meanings it's hard to differenciate. Though one..<br/>\n<br/>\r\nSource: A Dict. of Intermediate Jap. Grammar, p.189;"
