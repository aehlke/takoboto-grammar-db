    text: |-
      It shouldn't be translated as " a thing" since もの（thing) and ものだ are different, the latter is a grammar. 〜ものだ has different meanings and one of it is 〜が一般的な常識だ as what bladdy さん said.  Translated as " It is known that..." ,  "It is common sense that ...." , "It is commonly known that...." , "It is generally known that...."
    html: |-
      It shouldn't be translated as " a thing" since もの（thing) and ものだ are different, the latter is a grammar. 〜ものだ has different meanings and one of it is 〜が一般的な常識だ as what bladdy さん said.  Translated as " It is known that..." ,  "It is common sense that ...." , "It is commonly known that...." , "It is generally known that...."<br/>
    source_id: null
    original_created_at: null
