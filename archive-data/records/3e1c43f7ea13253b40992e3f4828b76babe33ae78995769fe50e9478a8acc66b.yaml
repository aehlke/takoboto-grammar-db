    text: "〜のことだから　：〜という特徴のある．．．だから．．．（〜と予想される）\n\r\n              Since it's (someone who...), therefore it is natural to have (someone).... \n\n\n\r\n〜ことから　：　〜という理由で\n\r\n               Since ...."
