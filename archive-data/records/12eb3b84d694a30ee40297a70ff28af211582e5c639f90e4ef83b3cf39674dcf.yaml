    text: "Conjugation:\n\n\n\r\n(plain form) + はず\n\n\n\r\nイー形容詞：　高いはず　　→　高かったはずです。\n\r\nなー形容詞：　静かなはず　→　静かだったはずです。\n\r\n　　　名詞：　学生の　　　→　学生だったはずです\n\r\n　　　動詞：　話す　　　　→　話したはずです"
    html: "Conjugation:<br/>\n<br/>\r\n(plain form) + はず<br/>\n<br/>\r\nイー形容詞：　高いはず　　→　高かったはずです。<br/>\r\nなー形容詞：　静かなはず　→　静かだったはずです。<br/>\r\n　　　名詞：　学生の　　　→　学生だったはずです<br/>\r\n　　　動詞：　話す　　　　→　話したはずです"
    credits_raw: dc
