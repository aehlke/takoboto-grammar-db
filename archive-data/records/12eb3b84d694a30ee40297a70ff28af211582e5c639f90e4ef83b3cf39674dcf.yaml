  - position: 1
    text: "This is copied from http://www.guidetojapanese.org/should.html of Tae Kim.\n\nUsing はず to describe an expectation\n\r\nはず is used to express something that was or is supposed to be. You can treat はず just like a regular noun as it is usually attached to the adjective or verb that is supposed to be or supposed to happen.\n\n\n\r\nThe only thing to be careful about here is expressing an expectation of something not happening. To do this, you must use the negative existence verb ない to say that such an expectation does not exist. This might be in the form of 〜はずがない or 〜はずはない depending on which particle you want to use. The negative conjugation はずじゃない is really only used when you want to confirm in a positive sense such as 〜はずじゃないか？."
    html: "This is copied from <a href=\"http://www.guidetojapanese.org/should.html\">http://www.guidetojapanese.org/should.html</a> of Tae Kim.<br/>\n<b>Using はず to describe an expectation</b><br/>\r\nはず is used to express something that was or is supposed to be. You can treat はず just like a regular noun as it is usually attached to the adjective or verb that is supposed to be or supposed to happen.<br/>\n<br/>\r\nThe only thing to be careful about here is expressing an expectation of something not happening. To do this, you must use the negative existence verb ない to say that such an expectation does not exist. This might be in the form of 〜はずがない or 〜はずはない depending on which particle you want to use. The negative conjugation はずじゃない is really only used when you want to confirm in a positive sense such as 〜はずじゃないか？."
    credits_raw: 赤毛
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: |-
      "S hazu" expresses the speakers expectation, not in the sense of hoping or looking forward to something, but in the sense that the proposition expressed by S should be true or come true. Thus, when the speaker uses <b>hazu</b>, he is not merely guessing, but stating a proposition based on reliable information or knowledge.
    html: |-
      "S hazu" expresses the speakers expectation, not in the sense of hoping or looking forward to something, but in the sense that the proposition expressed by S should be true or come true. Thus, when the speaker uses &lt;b&gt;hazu&lt;/b&gt;, he is not merely guessing, but stating a proposition based on reliable information or knowledge.
