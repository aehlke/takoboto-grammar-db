    japanese: 彼女が舞台に登場すると、「待ってました！」とばかりに大きな拍手が起こった
    body_text: "彼女が舞台に登場すると、「待ってました！」とばかりに大きな拍手が起こった\r \n\n\t\tshe appeared on the stage, and as if everyone had been waiting, huge applause broke out"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女が舞台に登場すると、「待ってました！」とばかりに大きな拍手が起こった\">\n\t\t\t\t彼女が舞台に登場すると、「待ってました！」<strong>とばかりに</strong>大きな拍手が起こった\r<strong></strong></a> <br/>\n\t\tshe appeared on the stage, and as if everyone had been waiting, huge applause broke out \n\t\t<strong> </strong>"
