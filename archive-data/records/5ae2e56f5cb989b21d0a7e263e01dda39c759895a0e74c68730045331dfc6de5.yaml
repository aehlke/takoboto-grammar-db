notes:
  - position: 0
    text: "BE CAREFUL not to confuse ばかりに with とばかりに.\n\nばかりに is for indicating a single factor that causes a negative situation and is formed \n\n{VERB-past-tense / いadj. / なadj.stem / NOUN} +ばかりに\n\nとばかりに indicates that s.o does s.t in such a way that s.o. is convinced that something is the case - \"思い立ったが吉日とばかりにエアロビクスを始めました。\n\r\nI began aerobics believing that the day you think of something is an auspicious day to start it.\" and is formed\n\n{direct quotation / indirect quotation / noun} + とばかりに\n\r\nSee bakarini"
    html: "<b>BE CAREFUL</b> not to confuse ばかりに with とばかりに.<br/>\n<strong>ばかりに</strong> is for indicating a single factor that causes a negative situation and is formed <br/>\n{VERB-past-tense / いadj. / なadj.stem / NOUN} +ばかりに<br/>\n<strong>とばかりに</strong> indicates that s.o does s.t in such a way that s.o. is convinced that something is the case - \"思い立ったが吉日とばかりにエアロビクスを始めました。<br/>\r\nI began aerobics believing that the day you think of something is an auspicious day to start it.\" and is formed<br/>\n{direct quotation / indirect quotation / noun} + とばかりに<br/>\r\nSee <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=bakarini\">bakarini</a></b>"
    credits_raw: LR
