    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ日本語のクラスは、テストの点数と今までの学習期間をもとに\">\n\t\t\t\t日本語のクラスは、テストの点数と今までの学習期間<strong>をもとに</strong><strong></strong>決定される。</a> <br/>\n\t\tAbout the class of Japanese, the decision will be taken \n\t\t<strong>on the basis of </strong>\nthe period of study until now and the score points of the tests  ."
