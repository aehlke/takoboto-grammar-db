    japanese: 自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と価値を与える論理の模様、すなわち理論を織りあげるのである。
    body_text: "自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と価値を与える論理の模様、すなわち理論を織りあげるのである。 \n\n\t\tAround his facts the scientist weaves a logical pattern or theory which gives the facts meaning, order, and significance."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ自分が集めた事実をもとにして、科学者は、その事実に意味と秩序と価値を与える論理の模様、すなわち理論を織りあげるのである。\">\n\t\t\t\t自分が集めた事実<strong>をもとに</strong>して、科学者は、その事実に意味と秩序と価値を与える論理の模様、すなわち理論を織りあげるのである。<strong></strong></a> <br/>\n\t\tAround his facts the scientist weaves a logical pattern or theory which gives the facts meaning, order, and significance. \n\t\t<strong> </strong>"
    credits_raw: dbx
