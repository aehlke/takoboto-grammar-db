  - position: 10
    credits_raw: bamboo4
    text: |-
      わけ originally comes from the act of dividing things into what is right and what is wrong.Therefore, わけ came to mean "reason" or the rationale of how things are done. That later got expanded to include the amorous relationship in the sense of "there is a reason for them to be together or in love," as suggested by #1268.
    html: |-
      わけ originally comes from the act of dividing things into what is right and what is wrong.Therefore, わけ came to mean "reason" or the rationale of how things are done. That later got expanded to include the amorous relationship in the sense of "there is a reason for them to be together or in love," as suggested by <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=wake#1268">#1268</a></b>.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: 誠
    text: "〜わけだ:\n\r\n１．〜ということが納得できる (no wonder.../ that's why....)\n\n\n\r\n2.　〜という結論になる; Note:「〜というわけだ」の形も多い。\n\r\ne.g. 「200キロ1000円なら、2000円で400キロ買えるわけだ。」"
    html: "〜わけだ:<br/>\r\n１．〜ということが納得できる (no wonder.../ that's why....)<br/>\n<br/>\r\n2.　〜という結論になる; Note:「〜というわけだ」の形も多い。<br/>\r\ne.g. 「200キロ1000円なら、2000円で400キロ買えるわけだ。」<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 12
    credits_raw: 誠
    text: "「〜というわけだ。」: (Therefore) 〜as a conclusion / 〜as a result / \"By this reason....., therefore can be concluded that 〜\"/ \"It can be said that 〜　as a conclusion/result\"  \n\n\n\n\n\r\n「〜というわけで．．．」: \"By 〜 as the conclusion,... \"/ \"Concluding with 〜 as a result,...\"\n\n\n\r\n「〜というわけではない」: \"It can't be concluded that 〜\" /  \"It doesn't mean that 〜\" / \"It doesn't follow that 〜 as a conclusion/result\"\n\n\n\r\n〜次第だ：〜というわけだ　（事情／経過を示す）\n\r\ne.g.「　．．．。以上のような次第で、....」＝\n\r\n　　「．．．というわけで、....」"
    html: "「〜というわけだ。」: (Therefore) 〜as a conclusion / 〜as a result / \"By this reason....., therefore can be concluded that 〜\"/ \"It can be said that 〜　as a conclusion/result\"  <br/>\n<br/>\n<br/>\r\n「〜というわけで．．．」: \"By 〜 as the conclusion,... \"/ \"Concluding with 〜 as a result,...\"<br/>\n<br/>\r\n「〜というわけではない」: \"It can't be concluded that 〜\" /  \"It doesn't mean that 〜\" / \"It doesn't follow that 〜 as a conclusion/result\"<br/>\n<br/>\r\n〜次第だ：〜というわけだ　（事情／経過を示す）<br/>\r\ne.g.「　．．．。以上のような次第で、....」＝<br/>\r\n　　「．．．というわけで、....」<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
