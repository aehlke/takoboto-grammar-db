  - position: 9
    credits_raw: Miki
    text: "\"訳（わけ）\" is used in oral and written.\n\r\n訳 does not always mean 理由 as you can see english for this 訳 entry. 訳 in ex #1268, #1269, #1270 means different from \"理由\"."
    html: "\"訳（わけ）\" is used in oral and written.<br/>\r\n訳 does not always mean 理由 as you can see english for this 訳 entry. 訳 in ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wake#1268\">#1268</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wake#1269\">#1269</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wake#1270\">#1270</a></b> means different from \"理由\"."
    source_id: null
