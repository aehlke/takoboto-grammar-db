notes:
  - position: 0
    text: "Hiragana is one of the three syllabaries in Japanese. Hiragana is the basic Japanese phonetic alphabet. It represents every sound in the Japanese language. Therefore, you can theoretically write everything in hiragana. However, because Japanese is written with no spaces, this will create a nearly indecipherable text. It is very important for you to write the strokes in the correct order and direction and to pronounce it correctly. Use Duolingo to listen to pronunciation. You should also record yourself and compare it to the correct pronunciation.\n\n\n\r\n(1) As you can see, not all sounds match the way our consonant system works, for example, the way \"chi\" and \"tsu\" are pronounced.\n\n\n\r\n(2) The /r/ or /l/ sound in Japanese is quite different from any sound in English. It involves more of a roll and clip by hitting the roof of your mouth with your tongue.\n\n\n\r\n(3) Pay careful to the difference between /tsu/ and /su/."
    html: "Hiragana is one of the three syllabaries in Japanese. Hiragana is the basic Japanese phonetic alphabet. It represents every sound in the Japanese language. Therefore, you can theoretically write everything in hiragana. However, because Japanese is written with no spaces, this will create a nearly indecipherable text. It is very important for you to write the strokes in the correct order and direction and to pronounce it correctly. Use Duolingo to listen to pronunciation. You should also record yourself and compare it to the correct pronunciation.<br/>\n<br/>\r\n(1) As you can see, not all sounds match the way our consonant system works, for example, the way \"chi\" and \"tsu\" are pronounced.<br/>\n<br/>\r\n(2) The /r/ or /l/ sound in Japanese is quite different from any sound in English. It involves more of a roll and clip by hitting the roof of your mouth with your tongue.<br/>\n<br/>\r\n(3) Pay careful to the difference between /tsu/ and /su/.<br/>"
