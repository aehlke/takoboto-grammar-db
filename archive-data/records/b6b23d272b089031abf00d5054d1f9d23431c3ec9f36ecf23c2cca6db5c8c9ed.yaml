    japanese: 皆さんからお褒めの言葉を頂きこれ以上の光栄はございません。
    body_text: "皆さんからお褒めの言葉を頂きこれ以上の光栄はございません。 \n\n\t\tHaving received many kind compliments from all of you, I cannot feel \n\t\tany more \n\t\thonored than this."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ皆さんからお褒めの言葉を頂きこれ以上の光栄はございません。\">\n\t\t\t\t皆さんからお褒めの言葉を頂き<strong>これ以上</strong>の光栄はございません。<strong></strong></a> <br/>\n\t\tHaving received many kind compliments from all of you, I cannot feel \n\t\t<strong>any more </strong>\n\t\thonored than this."
