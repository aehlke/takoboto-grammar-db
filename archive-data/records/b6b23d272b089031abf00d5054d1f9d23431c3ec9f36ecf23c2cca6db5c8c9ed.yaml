    japanese: これ以上待つのは時間の浪費だ。
    body_text: "これ以上待つのは時間の浪費だ。 \n\n\t\tIt's a waste of time to wait any longer."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれ以上待つの\">\n<strong>これ以上</strong>待つの<strong>は</strong>時間の浪費だ。</a> <br/>\n\t\tIt's a waste of time to wait any longer. \n\t\t<strong> </strong>"
