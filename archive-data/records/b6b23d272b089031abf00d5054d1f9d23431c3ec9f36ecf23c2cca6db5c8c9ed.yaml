    japanese: これ以上何を失えば　心は許されるの
    body_text: "これ以上何を失えば　心は許されるの \n\n\t\tHow much more do I have to lose, before my heart is forgiven? (from \"one more time, one more chance\" by yamasaki masayoshi)"
