    text: "In the English version of the first example, perhaps \"just those\" instead of \"(just) people.\" \n\r\nAlso, I don't know how they do it in schools abroad, but in Japan, the teacher normally says \"should stand up\" instead of \"should sit down.\""
    html: "In the English version of the first example, perhaps \"just those\" instead of \"(just) people.\" <br/>\r\nAlso, I don't know how they do it in schools abroad, but in Japan, the teacher normally says \"should stand up\" instead of \"should sit down.\""
