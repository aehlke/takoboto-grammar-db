    credits_raw: Amatuka
    text: "'[The teacher]' isn't explicitly in the Japanese version, but the English might look odd without it.\n\n\n\r\n'(just)' wouldn't be natural in the English - the だけ in the Japanese doesn't explicitly tranlate."
