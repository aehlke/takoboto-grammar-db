    japanese: 「一人で間違えずに歌える自信のある人だけ座りなさい。」と指示しました
    body_text: "「一人で間違えずに歌える自信のある人だけ座りなさい。」と指示しました \n\n\t\t[The teacher] directed that (just) people who had the confidence that they could sing, on their own, without error \n\t\tshould \n\t\tsit down."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ「一人で間違えずに歌える自信のある人だけ座りなさい。」と指示しました\">\n\t\t\t\t「一人で間違えずに歌える自信のある人だけ座り<strong>なさい</strong>。」と指示しました<strong></strong></a> <br/>\n\t\t[The teacher] directed that (just) people who had the confidence that they could sing, on their own, without error \n\t\t<strong>should </strong>\n\t\tsit down."
