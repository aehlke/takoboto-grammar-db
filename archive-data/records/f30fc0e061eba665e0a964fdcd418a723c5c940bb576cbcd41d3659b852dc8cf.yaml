    credits_raw: Amatuka
    text: なら is used in the context of suggestions, commands, violitional sentences and such. (One example of each above ;-)
    html: なら is used in the context of suggestions, commands, violitional sentences and such. (One example of each above ;-)
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Therefore なら can't be used in sentences like the following where no such elements are present.\n\r\n(BAD) 冷蔵庫を閉めるなら電気が消えますか。\n\r\n(GOOD) 冷蔵庫を閉めると電気が消えますか。\n\r\nIf(when) you shut the fridge does the light go out?"
    html: "Therefore なら can't be used in sentences like the following where no such elements are present.<br/>\r\n(BAD) 冷蔵庫を閉めるなら電気が消えますか。<br/>\r\n(GOOD) 冷蔵庫を閉めると電気が消えますか。<br/>\r\nIf(when) you shut the fridge does the light go out?"
    source_id: null
