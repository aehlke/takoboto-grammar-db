    credits_raw: フリザ
    text: "「なら」と「たら」の違い\n\r\n例：「山田さんが来たら、私は帰ります。」の場合には、\n\r\n山田さんが来てから私が帰るという意味であるが、「山田さんが来るなら、私は帰ります。」の場合には、山田さんが来る前に私が帰るという意味になる。\n\r\nうふふふ、朝飯前わね＾＾"
    html: "「なら」と「たら」の違い<br/>\r\n例：「山田さんが来たら、私は帰ります。」の場合には、<br/>\r\n山田さんが来てから私が帰るという意味であるが、「山田さんが来るなら、私は帰ります。」の場合には、山田さんが来る前に私が帰るという意味になる。<br/>\r\nうふふふ、朝飯前わね＾＾"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: 誠
    text: "と can also mean \" that...\" \n\r\n行かないとまずい \" It is not good that (I/you/one) don't go\""
    html: "と can also mean \" that...\" <br/>\r\n行かないとまずい \" It is not good that (I/you/one) don't go\""
