notes:
  - position: 0
    text: "there are a few if/when constructs:\n\n\n\nnara is similar to -eba\n\r\nformed with verb-plain form + nara\n\r\n　行くなら分かる = if/when you go you will understand\n\n\n\nto is used when the action is expected to happen, rather than use the english 'if' use 'when...' \n\r\nformed with verb-plain form + to\n\r\n　行かないとまずい = it will be bad if you dont go\n\n\n\neba is used when PEOPLE do the actions or suggesting an action. masu-stem + ba\n\r\n　行けばいいよ　= its ok to go\n\n\n\ntara is used in the other cases\n\r\n　寒かったら行かない = if its cold i won't go"
    html: "there are a few if/when constructs:<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=nara\">nara</a></b> is similar to -<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=eba\">eba</a></b><br/>\r\nformed with verb-plain form + nara<br/>\r\n　行くなら分かる = if/when you go you will understand<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=to\">to</a></b> is used when the action is expected to happen, rather than use the english 'if' use 'when...' <br/>\r\nformed with verb-plain form + to<br/>\r\n　行かないとまずい = it will be bad if you dont go<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=eba\">eba</a></b> is used when PEOPLE do the actions or suggesting an action. masu-stem + ba<br/>\r\n　行けばいいよ　= its ok to go<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=tara\">tara</a></b> is used in the other cases<br/>\r\n　寒かったら行かない = if its cold i won't go<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "〜なら：１．もし (if) ;  辞書形 +（の,optional)なら\n\n\n\r\n         2.勧告(advice);  辞書形 + (の,optional)なら\n\n\n\r\n　　　　  3.話題を出す時;  (Speaking of.../ For...) ; 名詞 +（の,optional)なら"
    html: "〜なら：１．もし (if) ;  辞書形 +（の,optional)なら<br/>\n<br/>\r\n         2.勧告(advice);  辞書形 + (の,optional)なら<br/>\n<br/>\r\n　　　　  3.話題を出す時;  (Speaking of.../ For...) ; 名詞 +（の,optional)なら　 <br/>\n<br/>"
    credits_raw: 誠
    source_id: null
    original_created_at: null
