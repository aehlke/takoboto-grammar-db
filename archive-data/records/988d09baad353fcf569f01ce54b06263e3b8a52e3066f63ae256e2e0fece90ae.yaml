notes:
  - position: 0
    text: "Verb-masu stem\n\r\n　尋ねさえ　　＞ just ask\n\r\n　待ってさえ　＞ just wait\n\n\n\r\nV-te\n\r\n　使ってさえ = just use\n\n\n\r\nNoun\n\r\n　あなたさえよければ = if its OK with you\n\r\n　\n\r\nirregular:\n\r\n　する　＞　しさえ = if you just do..\n\r\n　　　　　　勉強しさえ　= only study\n\r\n　くる　＞　来さえ　（きさえ）＞　just come\n\r\n　　　　　　ついてきさえ　＞ just follow \n\n\n\r\noften used with ーば \n\r\n　意見を述べさえすればよい。\n\r\n　If you just tell us your opinion it would be great.\n\n\n\r\nnegative\n\r\n　見えます　＞　見えさえしない\n\r\n　can NOT even see"
    html: "Verb-masu stem<br/>\r\n　尋ねさえ　　＞ just ask<br/>\r\n　待ってさえ　＞ just wait<br/>\n<br/>\r\nV-te<br/>\r\n　使ってさえ = just use<br/>\n<br/>\r\nNoun<br/>\r\n　あなたさえよければ = if its OK with you<br/>\r\n　<br/>\r\nirregular:<br/>\r\n　する　＞　しさえ = if you just do..<br/>\r\n　　　　　　勉強しさえ　= only study<br/>\r\n　くる　＞　来さえ　（きさえ）＞　just come<br/>\r\n　　　　　　ついてきさえ　＞ just follow <br/>\n<br/>\r\noften used with ーば <br/>\r\n　意見を述べさえすればよい。<br/>\r\n　If you just tell us your opinion it would be great.<br/>\n<br/>\r\nnegative<br/>\r\n　見えます　＞　見えさえしない<br/>\r\n　can NOT even see<br/>\n<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "note this usage:\n\n\n\r\n○　見ることさえしない\n\r\n　　cannot even see\n\n\n\r\n○　見さえしない\n\r\n　　did not even look\n\n\n\r\n×　見るさえない　\n\r\n　　incorrect"
    html: "note this usage:<br/>\n<br/>\r\n○　見ることさえしない<br/>\r\n　　cannot even see<br/>\n<br/>\r\n○　見さえしない<br/>\r\n　　did not even look<br/>\n<br/>\r\n×　見るさえない　<br/>\r\n　　incorrect"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "sae and sura are slightly formal. an informal way of saying \"even\" is with mo\n\r\n見ることもできない - cannot even see"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=sae\">sae</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=sura\">sura</a></b> are slightly formal. an informal way of saying \"even\" is with <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mo\">mo</a></b><br/>\r\n見ることもできない - cannot even see"
    credits_raw: dc
    source_id: null
