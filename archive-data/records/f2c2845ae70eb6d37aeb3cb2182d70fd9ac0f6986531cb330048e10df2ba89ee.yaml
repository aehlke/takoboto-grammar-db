  - position: 0
    credits_raw: bamboo4
    text: I don't like the second example. せめて is not used that way.
    html: I don't like the second example. せめて is not used that way.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: dc
    text: "would you use seizei instead? \n\r\nせいぜい、つまらないものですが、、"
    html: "would you use seizei instead? <br/>\r\nせいぜい、つまらないものですが、、"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: |-
      せいぜい also does not cut it. If you really want to use it in the context of the second example, it would be like せめてもと持参したつまらないものですが(it's an uninteresting thing that I at least brought," but that's really stretching it.
    html: |-
      せいぜい also does not cut it. If you really want to use it in the context of the second example, it would be like せめてもと持参したつまらないものですが(it's an uninteresting thing that I at least brought," but that's really stretching it.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: You can say せめてのもの instead of せめて. せめてのもの is stronger than せめて.
    html: You can say せめてのもの instead of せめて. せめてのもの is stronger than せめて.
    source_id: null
