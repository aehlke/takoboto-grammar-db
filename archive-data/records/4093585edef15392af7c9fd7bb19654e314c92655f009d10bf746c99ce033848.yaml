notes:
  - position: 0
    text: "Verb (dictionary form) + まえに\n\r\nNoun + のまえに\n\n\n\r\n(いちだん)  \n\r\n食べるまえに /  (たべるまえに) Before eating\n\n\n\r\n(ごだん)\n\r\n行くまえに (いくまえに)Before going\n\n\n\r\nNoun:\n\r\n会議のまえに (かいぎのまえに) Before the meeting"
    html: "Verb (dictionary form) + <b>まえに</b><br/>\r\nNoun + <b>のまえに</b><br/>\n<br/>\r\n(いちだん)  <br/>\r\n食べる<strong>まえに</strong> /  (たべる<strong>まえに</strong>) Before eating<br/>\n<br/>\r\n(ごだん)<br/>\r\n行く<strong>まえに</strong> (いく<strong>まえに</strong>)Before going<br/>\n<br/>\r\nNoun:<br/>\r\n会議<strong>のまえに</strong> (かいぎ<strong>のまえに</strong>) Before the meeting"
    credits_raw: jayupuro
