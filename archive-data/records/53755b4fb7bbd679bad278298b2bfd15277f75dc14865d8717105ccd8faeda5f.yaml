  - position: 3
    credits_raw: Eeker
    text: |-
      I don't see why である is being distinguished from だ even though ではない is included on the page for だ.  Furthermore, several forms have been missed, such as でない (traditional negative form of である) as well as であろう (traditional negative form of darou).
    html: |-
      I don't see why である is being distinguished from だ even though ではない is included on the page for だ.  Furthermore, several forms have been missed, such as でない (traditional negative form of である) as well as であろう (traditional negative form of darou).
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Miki
    text: I agree with Eeker. It would be better remove English meaning of (formal equivalent of だ da).
    html: |-
      I agree with Eeker. It would be better remove English meaning of (formal equivalent of だ <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=da">da</a></b>).
