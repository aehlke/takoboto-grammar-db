comments:
  - position: 0
    credits_raw: Amatuka
    text: Usually used in written, formal works.
    html: Usually used in written, formal works.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "One way in which である (dearu) can be used where だ (da) cannot is to modify nouns.\n\r\ne.g. 医者である田中さん (senshu de aru tanakasan) The Tanakasan who is a doctor."
    html: "One way in which である (dearu) can be used where だ (da) cannot is to modify nouns.<br/>\r\ne.g. 医者である田中さん (senshu de aru tanakasan) The Tanakasan who is a doctor."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "roma-ji is wrong for e.g. in user comments.\n\r\n医者である田中さん(isha de aru tanaka-san)"
    html: "roma-ji is wrong for e.g. in user comments.<br/>\r\n医者である田中さん(isha de aru tanaka-san)"
