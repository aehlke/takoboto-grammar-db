notes:
  - position: 0
    text: "Pattern:\n\r\nN であろうが　N　であろうが(FerrariであろうがJaguarであろうが)\n\r\nN だろうが　N　だろうが　(FerrariだろうがJaguarだろうが)\n\r\nV　しようが　V　しようが (印刷しようが手で書こうが）\n\r\nV　〜ようが　V　〜ようが (食べようが飲もうが）\n\r\nA　かろうが　A　かろうが (寒かろうが熱かろうが)"
    html: "Pattern:<br/>\r\nN であろうが　N　であろうが(FerrariであろうがJaguarであろうが)<br/>\r\nN だろうが　N　だろうが　(FerrariだろうがJaguarだろうが)<br/>\r\nV　しようが　V　しようが (印刷しようが手で書こうが）<br/>\r\nV　〜ようが　V　〜ようが (食べようが飲もうが）<br/>\r\nA　かろうが　A　かろうが (寒かろうが熱かろうが)"
    credits_raw: Ricky
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "A であろうが　B　であろうが、C\n\r\nIt's used to indicate, that it doesn't matter if it's going to be A or B (one of the two) , but in any case C want to be obtained."
    html: "A であろうが　B　であろうが、C<br/>\r\nIt's used to indicate, that it doesn't matter if it's going to be A or B (one of the two) , but in any case C want to be obtained."
    credits_raw: Ricky
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: 「絶対」という感じがついている
    html: 「絶対」という感じがついている
