  - position: 1
    text: "＊わけではない sentences and their context (whether before or after) are often connected by conjunctions like が and しかし.\n\n\n\r\nFORMATION:\n\r\nいＡ + わけではない\n\r\nなＡ + な + わけではない\n\r\nＶ(plain form) + わけではない"
