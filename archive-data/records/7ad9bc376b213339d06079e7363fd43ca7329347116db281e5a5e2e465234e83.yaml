he giving done by everybody else \"goes down\" to the speaker. This is probably related to the fact that there is an identical verb 「上げる」 meaning \"to raise\" that contains the character for \"above\" （上） and that the honorific version of 「くれる」 is 「下さる」 with the character for down （下）. This restriction allows us to make certain deductions from vague sentences like the following:<br/>\n<br/>\r\n（１）　先生が教えてあげるんですか。<br/>\r\n- Teacher, will you be the one to give favor of teaching to... [anybody other than the speaker]?<br/>\n<br/>\r\nBecause all giving done to the speaker must always use 「くれる」, we know that the teacher must be doing it for someone else and not the speaker. The speaker is also looking at it from the teacher's point of view as doing a favor for someone else.<br/>\n<br/>\r\n（２）　先生が教えてくれるんですか。<br/>\r\n- Teacher, will you be the one to give favor of teaching to... [anybody including the speaker]?<br/>\n<br/>\r\nBecause the giver is not the speaker, the teacher is either giving to the speaker or anyone else. The speaker is viewing it from the receiver's point of view as receiving a favor done by the teacher.<br/>\n<br/>\r\nLet's see some mistakes to watch out for.<br/>\r\n（誤）　私が全部食べてくれました。- 「くれる」 is being used as giving done by the speaker. (Wrong)<br/>\r\n（正）　私が全部食べてあげました。- I gave favor of eating it all. (Correct)<br/>\n<br/>\r\n（誤）　友達がプレゼントを私にあげた。- 「あげる」 is being used as giving to the speaker. (Wrong)<br/>\r\n（正）　友達がプレゼントを私にくれた。- Friend gave present to me. (Correct)<br/>\r\nWhen to use 「もらう」<br/>\r\n「もらう」 meaning, \"to receive\" has only one version unlike 「あげる／くれる」 so there's very little to explain. One thing to point out is that since you receive from someone, 「から」 is also appropriate in addition to the 「に」 target particle.<br/>\r\nExamples<br/>\n<br/>\r\n（１）　私が友達にプレゼントをもらった。<br/>\r\n- I received present from friend.<br/>\n<br/>\r\n（２）　友達からプレゼントをもらった。<br/>\r\n- I received present from friend.<br/>\n<br/>\r\n（３）　これは友達に買ってもらった。<br/>\r\n- About this, received the favor of buying it from friend.<br/>\n<br/>\r\n（４）　宿題をチェックしてもらいたかったけど、時間がなくて無理だった。<br/>\r\n- I wanted to receive the favor of checking homework but there was no time and it was impossible.<br/>\n<br/>\r\n「もらう」 is seen from the perspective of the receiver, so in the case of first-person, others usually don't receive things from you. However, you might want to use 「私からもらう」 when you want to emphasive that fact that the other person received it from you. For instance, if you wanted to say, \"Hey, I gave you that!\" you would use 「あげる」. However, you would use 「もらう」 if you wanted to say, \"Hey, you got that from me!\"<br/>\n<br/>\r\n（５）　その時計は私からもらったのよ。<br/>\r\n- <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=He\">He</a></b> received that watch from me.<br/>\r\nAsking favors with 「くれる」 or 「もらえる」<br/>\r\nYou can make requests by using 「くれる」 and the potential form of 「もらう」 (can I receive the favor of...). We've already seen an example of this in example （４） of the 「くれる」 section. Because requests are favors done for the speaker, you cannot use 「あげる」 in this situation.<br/>\r\nExamples<br/>\n<br/>\r\n（１）　千円を貸してくれる？<br/>\r\n- Will you give me the favor of lending 1000 yen?<br/>\n<br/>\r\n（２）　千円を貸してもらえる？<br/>\r\n- Can I receive the favor of you lending 1000 yen?<br/>\n<br/>\r\nNotice that the two sentences essentially mean the same thing. This is because the giver and receiver has been omitted because it is obvious from the context. If we were to write out the full sentence, it would look like this:<br/>\n<br/>\r\n（１）　あなたが、私に千円を貸してくれる？<br/>\r\n- Will you give me the favor of lending 1000 yen?<br/>\n<br/>\r\n（２）　私が、あなたに千円を貸してもらえる？<br/>\r\n- Can I receive the favor of you lending 1000 yen?<br/>\n<br/>\r\nIt is not normal to explicitly include the subject and target like this when directly addressing someone but is provided here to illustrate the change of subject and target depending on the verb 「くれる」 and 「もらえる」.<br/>\n<br/>\r\nYou can use the negative to make the request a little softer. You'll see that this is true in many other types of grammar.<br/>\n<br/>\r\n（１）　ちょっと静かにしてくれない？<br/>\r\n- Won't you be a little quieter?<br/>\n<br/>\r\n（２）　漢字を書いてもらえませんか。<br/>\r\n- Can you write this in kanji for me?<br/>\r\nAsking someone to not do something<br/>\n<br/>\r\nIn order to request that someone not do something, you simply attach 「で」 to the negative form of the verb and proceed as before.<br/>\n<br/>\r\n（１）　全部食べないでくれますか。<br/>\r\n- Can you not eat it all?<br/>\n<br/>\r\n（２）　高い物を買わないでくれる？<br/>\r\n- Can you not buy expensive thing(s)?<br/>\r\n← Previous (To try things) \tTable of Contents"
