    text: "In addition...\n\n\n\r\nさしあげる and やる are used in the same pattern as あげる.\n\r\nくださる is used in the same pattern as くれる.\n\r\nいただく is used in the same pattern as もらう.\n\n\n\r\nさしあげる is used when the receiver is superior to the giver.\n\r\nあげる is used when the receiver is equal to the giver.\n\r\nやる is used when the receiver is inferior to the giver.\n\n\n\r\nくださる is used when the giver is superior to the receiver.\n\r\nくれる is used when the giver is equal or inferior to the receiver.\n\n\n\r\nいただく is used when the giver is superior to the receiver.\n\r\nもらう is used when the giver is equal or inferior to the receiver."
    html: "In addition...<br/>\n<br/>\r\nさしあげる and やる are used in the same pattern as あげる.<br/>\r\nくださる is used in the same pattern as くれる.<br/>\r\nいただく is used in the same pattern as もらう.<br/>\n<br/>\r\nさしあげる is used when the receiver is superior to the giver.<br/>\r\nあげる is used when the receiver is equal to the giver.<br/>\r\nやる is used when the receiver is inferior to the giver.<br/>\n<br/>\r\nくださる is used when the giver is superior to the receiver.<br/>\r\nくれる is used when the giver is equal or inferior to the receiver.<br/>\n<br/>\r\nいただく is used when the giver is superior to the receiver.<br/>\r\nもらう is used when the giver is equal or inferior to the receiver."
