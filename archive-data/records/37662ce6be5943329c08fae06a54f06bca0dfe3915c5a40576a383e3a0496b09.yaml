notes:
  - position: 0
    text: "~のような (〜の様な), usually written in kana, means \"like, similar to\"; compare to ~ようだ youda meaning \"seeming to be, appearing to be\" and usually written at sentence-end, and 〜ように youni* meaning \"in order to (e.g. meet goal), so that\".\n\r\n*〜ように youni at the end of a sentence indicates hope, wish, request or mild command."
    html: "~のような (〜の様な), usually written in kana, means \"like, similar to\"; compare to ~ようだ <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=youda\">youda</a></b> meaning \"seeming to be, appearing to be\" and usually written at sentence-end, and 〜ように <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=youni\">youni</a></b>* meaning \"in order to (e.g. meet goal), so that\".<br/>\r\n*〜ように <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=youni\">youni</a></b> at the end of a sentence indicates hope, wish, request or mild command."
