notes:
  - position: 0
    text: "1. When hodo is preceded by a noun, the predicate must be negative. The following sentence is ungrammatical.\n\n\n\r\n*私は太郎ほどつよい。\n\r\n(I am as strong as Taro.)\n\n\n\n\n\r\nIf a sentence or a demonstrative modifies hodo, however, the predicate of the main clause can be either affirmative or negative.\n\n\n\r\nその仕事はそれほど易しいんですか。\n\r\nIs that job that easy (lit. easy to that extent)?\n\n\n\n\n\r\nWhen hodo is used with a quantifier, it means 'about'. Example:\n\n\n\r\nビールを三本ほど飲みました。\n\r\n(I drank about three bottles of beer.)"
    html: "1. When hodo is preceded by a noun, the predicate must be negative. The following sentence is ungrammatical.<br/>\n<br/>\r\n*私は太郎ほどつよい。<br/>\r\n(I am as strong as Taro.)<br/>\n<br/>\n<br/>\r\nIf a sentence or a demonstrative modifies hodo, however, the predicate of the main clause can be either affirmative or negative.<br/>\n<br/>\r\nその仕事はそれほど易しいんですか。<br/>\r\nIs that job that easy (lit. easy to that extent)?<br/>\n<br/>\n<br/>\r\nWhen hodo is used with a quantifier, it means 'about'. Example:<br/>\n<br/>\r\nビールを三本ほど飲みました。<br/>\r\n(I drank about three bottles of beer.)<br/>"
