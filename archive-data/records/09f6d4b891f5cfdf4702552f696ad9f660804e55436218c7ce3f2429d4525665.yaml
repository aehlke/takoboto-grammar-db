    japanese: 風邪をひいた。暖かくして寝るよりほかない。
    body_text: "風邪をひいた。暖かくして寝るよりほかない。 \n\n\t\tI have a cold, so \n\t\tthere is nothing else to do but \n\t\tstay warm and sleep."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ風邪をひいた。暖かくして寝るよりほかない。\">\n\t\t\t\t風邪をひいた。暖かくして寝る<strong>よりほかない。</strong><strong></strong></a> <br/>\n\t\tI have a cold, so \n\t\t<strong>there is nothing else to do but </strong>\n\t\tstay warm and sleep."
