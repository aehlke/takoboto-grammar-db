    japanese: 台風で家が押し流された。人々はどうすることもできず、じっと見ているほかなかった。
    body_text: "台風で家が押し流された。人々はどうすることもできず、じっと見ているほかなかった。 \n\n\t\tHouses were washed away because of the typhoon. People could do nothing but helplessly and quietly watch."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ台風で家が押し流された。人々はどうすることもできず、じっと見ているほかなかった。\">\n\t\t\t\t台風で家が押し流された。人々はどうすることもできず、じっと見ているほかなかった。<strong></strong><strong></strong></a> <br/>\n\t\tHouses were washed away because of the typhoon. People could do nothing but helplessly and quietly watch. \n\t\t<strong> </strong>"
