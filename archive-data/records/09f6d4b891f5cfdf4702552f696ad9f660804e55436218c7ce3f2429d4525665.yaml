examples:
  - source_id: 241
    position: 0
    japanese: もはや、盧武鉉（ノ・ムヒョン）大統領の再信任を問う国民投票に進むほかない。それが好ましいからではなく、その他の途が閉ざされているからだ。
    body_text: "もはや、盧武鉉（ノ・ムヒョン）大統領の再信任を問う国民投票に進むほかない。それが好ましいからではなく、その他の途が閉ざされているからだ。 \n\n\t\tAlready \n\t\tthere is nothing else but \n\t\tto proceed with a national referendum for a vote of confidence in Prime Minister No Muhyon. This route is not taken because [we] want to, but because there is no other alternative available - that"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJもはや、盧武鉉（ノ・ムヒョン）大統領の再信任を問う国民投票に進むほかない。それが好ましいからではなく、その他の途が閉ざされているからだ。\">\n\t\t\t\tもはや、盧武鉉（ノ・ムヒョン）大統領の再信任を問う国民投票に進む<strong>ほかない</strong>。それが好ましいからではなく、その他の途が閉ざされているからだ。<strong></strong></a> <br/>\n\t\tAlready \n\t\t<strong>there is nothing else but </strong>\n\t\tto proceed with a national referendum for a vote of confidence in Prime Minister No Muhyon. This route is not taken because [we] want to, but because there is no other alternative available - that"
    credits_raw: Amatuka
