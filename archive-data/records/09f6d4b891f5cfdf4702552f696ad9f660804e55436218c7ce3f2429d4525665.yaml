    japanese: 雪のため、新幹線が駅と駅の間で止まってしまった。乗客はじっと車内で待つよりほかない。
    body_text: "雪のため、新幹線が駅と駅の間で止まってしまった。乗客はじっと車内で待つよりほかない。\r \n\n\t\tThe shinkansen stopped between stations due to snow. The passengers had nothing to do but patiently wait inside the train."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ雪のため、新幹線が駅と駅の間で止まってしまった。乗客はじっと車内で待つよりほかない。\">\n\t\t\t\t雪のため、新幹線が駅と駅の間で止まってしまった。乗客はじっと車内で待つより<strong>ほかない</strong>。\r<strong></strong></a> <br/>\n\t\tThe shinkansen stopped between stations due to snow. The passengers had nothing to do but patiently wait inside the train. \n\t\t<strong> </strong>"
