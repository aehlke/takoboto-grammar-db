  - position: 1
    text: "「ＡのわりにＢ」\n\r\n＊This grammar expresses a judgement in which the situation expressed by Ｂ does not meet the expectations of Ａ or seem like what Ａ implies.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + わりに\n\r\nＮ + の + わりに\n\r\nいＡ + わりに\n\r\nなＡ + な + わりに"
    html: "「ＡのわりにＢ」<br/>\r\n＊This grammar expresses a judgement in which the situation expressed by Ｂ does not meet the expectations of Ａ or seem like what Ａ implies.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + わりに<br/>\r\nＮ + の + わりに<br/>\r\nいＡ + わりに<br/>\r\nなＡ + な + わりに"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
