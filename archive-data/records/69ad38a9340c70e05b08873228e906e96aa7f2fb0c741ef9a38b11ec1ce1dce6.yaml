    text: "So would this be right?\n\n\n\r\n彼はうるさいことを話しかねない。\n\r\nHe cant help saying annoying things?\n\r\nI guess I am not sure how to form a negative verb sentence using this pattern...\n\r\nHe cant help not doing the dishes.\n\n\n\r\nand in the examples above there seems to be no difference if it is a -ている (ing) sentence or dictionary form."
    html: "So would this be right?<br/>\n<br/>\r\n彼はうるさいことを話しかねない。<br/>\r\nHe cant help saying annoying things?<br/>\r\nI guess I am not sure how to form a negative verb sentence using this pattern...<br/>\r\nHe cant help not doing the dishes.<br/>\n<br/>\r\nand in the examples above there seems to be no difference if it is a -ている (ing) sentence or dictionary form. <br/>"
