  - position: 11
    credits_raw: slopethisway
    text: "真面目なように見えるが彼は嘘をつきかねない。 \n\r\nHe could lie but look serious. \n\n\n\r\nあの男は裏切りもしかねない。  \n\r\nHe's quite (also) capable of betrayal.  \n\n\n\r\nジョンさんは作りたて チョコケーキを全て食べかねない。 \n\r\nJohn is capable of eating the entire freshly  made chocolate cake."
    html: "真面目なように見えるが彼は嘘をつき<strong>かねない</strong>。 <br/>\r\nHe <strong>could</strong> lie but look serious. <br/>\n<br/>\r\nあの男は裏切りもし<strong>かねない</strong>。  <br/>\r\nHe's quite (also) <strong>capable of</strong> betrayal.  <br/>\n<br/>\r\nジョンさんは作りたて チョコケーキを全て食べ<strong>かねない</strong>。 <br/>\r\nJohn is <strong>capable of</strong> eating the entire freshly  made chocolate cake.  <br/>"
