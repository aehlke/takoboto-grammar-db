    text: "I'm not sure of the seconde J-example.\n\r\n真面目なように見える_が_彼は嘘をつきかねない。\n\r\nor\n\r\n真面目なように見える qualify 彼? \n\r\nE-translation matches the former."
    html: "I'm not sure of the seconde J-example.<br/>\r\n真面目なように見える_が_彼は嘘をつきかねない。<br/>\r\nor<br/>\r\n真面目なように見える qualify 彼? <br/>\r\nE-translation matches the former."
