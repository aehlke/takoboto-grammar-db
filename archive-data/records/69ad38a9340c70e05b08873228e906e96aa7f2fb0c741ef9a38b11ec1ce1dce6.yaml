  - position: 4
    credits_raw: Amatuka
    text: "Incidently, is the following Japanese grammatical?\n\r\n真面目なように見えるが真面目でもないが、彼はやる事はやっている\n\r\nHe looks serious but he isn't, but he does the things to be done.\n\r\n(The English is dubious because of the two 'but's in the same sentence.)"
    html: "Incidently, is the following Japanese grammatical?<br/>\r\n真面目なように見えるが真面目でもないが、彼はやる事はやっている<br/>\r\nHe looks serious but he isn't, but he does the things to be done.<br/>\r\n(The English is dubious because of the two 'but's in the same sentence.)"
