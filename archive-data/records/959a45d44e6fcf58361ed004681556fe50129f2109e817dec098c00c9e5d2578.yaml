notes:
  - position: 0
    text: "で has many uses. It can be used for sentences like:\n\n\n\r\nI went to the park by bus.\n\r\nバスで公園に行きました。\n\n\n\r\nOr 'with' when talking about objects such as:\n\n\n\r\nパソコンで日本語とイタリア語を勉強しています。- With my PC, I'm studying Japanese and Italian.\n\n\n\r\nIt can be used with 'jibun' (myself) and hitori (alone)\n\n\n\r\n一人でこのケーキを作りました。-I made this cake alone.\n\n\n\r\n自分で料理しました。- I cooked by myself.\n\n\n\r\nIt can be used as a price for something:\n\n\n\r\n曙ﾜドルでゲームを買いました。- I bought this game at the price for 15 dollars.\n\n\n\r\nA location where something took place:\n\n\n\r\n喫茶店でドーナツを食べました。- I ate a doughnut at the cafe.\n\n\n\r\nIt can mean 'within'...\n\n\n\r\n一日で本を読みました。- I read it within a day."
    html: "で has many uses. It can be used for sentences like:<br/>\n<br/>\r\nI went to the park by bus.<br/>\r\nバスで公園に行きました。<br/>\n<br/>\r\nOr 'with' when talking about objects such as:<br/>\n<br/>\r\nパソコンで日本語とイタリア語を勉強しています。- With my PC, I'm studying Japanese and Italian.<br/>\n<br/>\r\nIt can be used with 'jibun' (myself) and hitori (alone)<br/>\n<br/>\r\n一人でこのケーキを作りました。-I made this cake alone.<br/>\n<br/>\r\n自分で料理しました。- I cooked by myself.<br/>\n<br/>\r\nIt can be used as a price for something:<br/>\n<br/>\r\n曙ﾜドルでゲームを買いました。- I bought this game at the price for 15 dollars.<br/>\n<br/>\r\nA location where something took place:<br/>\n<br/>\r\n喫茶店でドーナツを食べました。- I ate a doughnut at the cafe.<br/>\n<br/>\r\nIt can mean 'within'...<br/>\n<br/>\r\n一日で本を読みました。- I read it within a day.<br/>\n<br/>\n<br/>"
