    text: "desu, how \"to be\" came \"to be\"\n\n\n\r\nPronounced as \"deehs\" with the \"u\" being whispered, or near slient.\n\n\n\r\nThere are two theories of how \"Desu\" came to be.\n\n\n\r\nIn both instances, desu is a contraction of a verb.\n\n\n\nTheory #1\n\r\nSome believe desu is a contraction of the verb \"De arimasu\". \n\n\n\r\nAs of today\n\r\n\"De arimasu\" is still used in the military.\n\r\n\"De arimasu\" originally came from a dialect of Choshu (now called Yamaguchi).\n\r\nChoshu was one of the driving forces of Meiji Restoration. When ground troops were established, \"De arimasu\" became part of army speak.\n\r\n\"De arimasu\" was not only reserved for the military. People used the expression, because retired veterans used it in their home-towns at the time.\n\r\nAs of today, \"de arimasu\" is still used in formal writing.\n\n\n\nTheory #2\n\ndesu is the contraction of \"de gozaimasu\". \"de gozaimasu\" is very polite and used today in certain phrases, and formal writing. It's considered samurai speak now.\n\n\n\r\nIn both cases, after the caste system from the Edo period fell, everyone was made equal. Everyone also went to school, regardless to whether they were a poor merchants daughter, or of a higher class.\n\n\n\r\nAt this time, it is said that it was mostly the merchants daughters who started the contraction of the verb because the polite forms were too confusing to remember. Most merchants were very poor, and could not afford special education before this time. This is highly plausible.\n\r\nIn modern Japan, most children speak in plain speech, until they are taught polite Japanese in Elementary school. The tradition of polite Japanese being taught in school still exists.\n\n\n\r\nMuch to educators dismay at the time, the desu tend did catch on, and it is now used today.\n\n\n\nOther variations of desu\n\r\nJapanese is a continually changing language. Even desu is changing.\n\n\n\r\nっす ssu is used in colloquial speech.\n\r\nThe copula is subject to dialectal variation throughout Japan, resulting in forms such as や ya (in Kansai) and じゃ ja (in Hiroshima).\n\n\n\r\nス su is used by the Yakuza as a shorter form of desu. This is typically used to sound a little more polite when speaking with authorities, but not going all out and using desu."
    html: "<b>desu, how \"to be\" came \"to be\"</b><br/>\n<br/>\r\nPronounced as \"deehs\" with the \"u\" being whispered, or near slient.<br/>\n<br/>\r\nThere are two theories of how \"Desu\" came to be.<br/>\n<br/>\r\nIn both instances, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=desu\">desu</a></b> is a contraction of a verb.<br/>\n<br/>\n<b>Theory <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=is,+am,+are#1\">#1</a></b></b><br/>\r\nSome believe desu is a contraction of the verb \"De arimasu\". <br/>\n<br/>\r\nAs of today<br/>\r\n\"De arimasu\" is still used in the military.<br/>\r\n\"De arimasu\" originally came from a dialect of Choshu (now called Yamaguchi).<br/>\r\nChoshu was one of the driving forces of Meiji Restoration. When ground troops were established, \"De arimasu\" became part of army speak.<br/>\r\n\"De arimasu\" was not only reserved for the military. People used the expression, because retired veterans used it in their home-towns at the time.<br/>\r\nAs of today, \"de arimasu\" is still used in formal writing.<br/>\n<br/>\n<b>Theory <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=is,+am,+are#2\">#2</a></b></b><br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=desu\">desu</a></b> is the contraction of \"de gozaimasu\". \"de gozaimasu\" is very polite and used today in certain phrases, and formal writing. It's considered samurai speak now.<br/>\n<br/>\r\nIn both cases, after the caste system from the Edo period fell, everyone was made equal. Everyone also went to school, regardless to whether they were a poor merchants daughter, or of a higher class.<br/>\n<br/>\r\nAt this time, it is said that it was mostly the merchants daughters who started the contraction of the verb because the polite forms were too confusing to remember. Most merchants were very poor, and could not afford special education before this time. This is highly plausible.<br/>\r\nIn modern Japan, most children speak in plain speech, until they are taught polite Japanese in Elementary school. The tradition of polite Japanese being taught in school still exists.<br/>\n<br/>\r\nMuch to educators dismay at the time, the <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=desu\">desu</a></b> tend did catch on, and it is now used today.<br/>\n<br/>\n<b>Other variations of <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=desu\">desu</a></b></b><br/>\r\nJapanese is a continually changing language. Even desu is changing.<br/>\n<br/>\r\nっす ssu is used in colloquial speech.<br/>\r\nThe copula is subject to dialectal variation throughout Japan, resulting in forms such as や ya (in Kansai) and じゃ ja (in Hiroshima).<br/>\n<br/>\r\nス su is used by the Yakuza as a shorter form of desu. This is typically used to sound a little more polite when speaking with authorities, but not going all out and using desu."
