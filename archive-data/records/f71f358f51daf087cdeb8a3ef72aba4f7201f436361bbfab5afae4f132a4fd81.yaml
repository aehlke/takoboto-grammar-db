    japanese: 友達を傷つけるくらいなら、自分が我慢したほうがいい
    body_text: "友達を傷つけるくらいなら、自分が我慢したほうがいい \n\nI would much rather \n\t\tendure and keep it to myself, rather than hurt my friends."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ友達を傷つけるくらいなら、自分が我慢\">\n\t\t\t\t友達を傷つける<strong>くらいなら</strong>、自分が我慢<strong>したほうがいい</strong></a> <br/>\n<strong>I would much rather </strong>\n\t\tendure and keep it to myself, rather than hurt my friends."
    credits_raw: dc
