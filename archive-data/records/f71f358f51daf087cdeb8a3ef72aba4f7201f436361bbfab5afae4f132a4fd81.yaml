    japanese: あなたと結婚するくらいだったら鳥と結婚するわ。
    body_text: "あなたと結婚するくらいだったら鳥と結婚するわ。 \n\n\t\tI might as well marry a bird as marry you. [F]"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあなたと結婚するくらいだったら鳥と結婚するわ。\">\n\t\t\t\tあなたと結婚する<strong>くらい</strong>だったら鳥と結婚するわ。<strong></strong></a> <br/>\n\t\tI might as well marry a bird as marry you. [F] \n\t\t<strong> </strong>"
    credits_raw: Miki
