    original_updated_at: null
  - source_id: 8263
    position: 10
    japanese: 降参するぐらいなら死んだほうがましだ　（ほうがいいだ）。
    body_text: "降参するぐらいなら死んだほうがましだ　（ほうがいいだ）。\r \n\n\t\tI would sooner die than give up."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ降参するぐらいなら死んだほうがましだ　（ほうがいいだ）。\">\n\t\t\t\t降参するぐらいなら死んだほうがましだ　（ほうがいいだ）。\r<strong></strong><strong></strong></a> <br/>\n\t\tI would sooner die than give up. \n\t\t<strong> </strong>"
