  - source_id: 8262
    position: 9
    japanese: 君を捨てるぐらいなら死んだほうがましだ　（ほうがいいだ）。
    body_text: "君を捨てるぐらいなら死んだほうがましだ　（ほうがいいだ）。\r \n\n\t\tI would die before leaving you."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ君を捨てるぐらいなら死んだほうがましだ　（ほうがいいだ）。\">\n\t\t\t\t君を捨てるぐらいなら死んだほうがましだ　（ほうがいいだ）。\r<strong></strong><strong></strong></a> <br/>\n\t\tI would die before leaving you. \n\t\t<strong> </strong>"
    credits_raw: karekano
