      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4682
    position: 2
    japanese: ここにいるくらいならすぐに出発したほうがいいですよ。
    body_text: "ここにいるくらいならすぐに出発したほうがいいですよ。 \n\n\t\tYou may as well start at once as stay here."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJここにいるくらいならすぐに出発したほうが\">\n\t\t\t\tここにいる<strong>くらい</strong>ならすぐに出発したほうが<strong>いいです</strong>よ。</a> <br/>\n\t\tYou may as well start at once as stay here. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
