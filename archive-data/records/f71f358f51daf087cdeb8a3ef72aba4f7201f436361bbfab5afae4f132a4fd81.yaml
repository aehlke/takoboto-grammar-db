    original_updated_at: null
  - source_id: 4683
    position: 3
    japanese: あんな男と結婚するくらいなら死んだほうがましだ。
    body_text: "あんな男と結婚するくらいなら死んだほうがましだ。 \n\n\t\tI might as well die as marry such a man."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあんな男と結婚するくらいなら死んだ\">\n\t\t\t\tあんな男と結婚する<strong>くらい</strong>なら死んだ<strong>ほうがまし</strong>だ。</a> <br/>\n\t\tI might as well die as marry such a man. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
