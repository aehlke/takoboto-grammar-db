    original_updated_at: null
  - source_id: 4684
    position: 4
    japanese: ここでタクシーを拾おうとするくらいなら家まで歩いたほうがましだ。
    body_text: "ここでタクシーを拾おうとするくらいなら家まで歩いたほうがましだ。 \n\n\t\tWe might as well walk home as try to catch a taxi here."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJここでタクシーを拾おうとするくらいなら家まで歩いた\">\n\t\t\t\tここでタクシーを拾おうとする<strong>くらい</strong>なら家まで歩いた<strong>ほうがまし</strong>だ。</a> <br/>\n\t\tWe might as well walk home as try to catch a taxi here. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4685
    position: 5
    japanese: このお金を彼にあげるくらいなら、捨てたほうがいい。
    body_text: "このお金を彼にあげるくらいなら、捨てたほうがいい。 \n\n\t\tI may as well throw the money away as give it to him."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこのお金を彼にあげるくらいなら、捨てた\">\n\t\t\t\tこのお金を彼にあげる<strong>くらい</strong>なら、捨てた<strong>ほうがいい。</strong></a> <br/>\n\t\tI may as well throw the money away as give it to him. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4686
    position: 6
    japanese: この会社でそんな仕事をするくらいなら会社をやめる（ほうがいい）。
    body_text: "この会社でそんな仕事をするくらいなら会社をやめる（ほうがいい）。 \n\n\t\tI would quit before I would do that job in this company."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの会社でそんな仕事をするくらいなら会社をやめる\">\n\t\t\t\tこの会社でそんな仕事をする<strong>くらい</strong>なら会社をやめる<strong>（ほうがいい）。</strong></a> <br/>\n\t\tI would quit before I would do that job in this company. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4687
    position: 7
    japanese: この暑い中を外出するくらいなら家にいた方がよい。
    body_text: "この暑い中を外出するくらいなら家にいた方がよい。 \n\n\t\tI would rather stay at home than go out in this hot weather."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの暑い中を外出するくらいなら家にいた\">\n\t\t\t\tこの暑い中を外出する<strong>くらい</strong>なら家にいた<strong>方がよい。</strong></a> <br/>\n\t\tI would rather stay at home than go out in this hot weather. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4688
    position: 8
    japanese: こんな料理を食べるくらいならドッグフードを食べたほうがましだ。
    body_text: "こんな料理を食べるくらいならドッグフードを食べたほうがましだ。 \n\n\t\tWe might as well eat dog food as eat such a dish."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこんな料理を食べるくらいならドッグフードを食べた\">\n\t\t\t\tこんな料理を食べる<strong>くらい</strong>ならドッグフードを食べた<strong>ほうがましだ。</strong></a> <br/>\n\t\tWe might as well eat dog food as eat such a dish. \n\t\t<strong> </strong>"
    credits_raw: Miki
