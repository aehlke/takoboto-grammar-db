  - position: 2
    credits_raw: calltometal
    text: |-
      This is more of a culture piece, not grammar. Anyone who studies Japanese or reads about Japanese culture should be able to note this difference. On top of that, this seems more like an entry for someone to advertise their website instead of teaching us something useful. Also, 徒名 isn't used for nickname. Double checking the dictionary, 徒名 is rumor of a romance. あだ名 is used for nickname. This entry is very poorly constructed and should be highly revised or deleted.
    html: |-
      This is more of a culture piece, not grammar. Anyone who studies Japanese or reads about Japanese culture should be able to note this difference. On top of that, this seems more like an entry for someone to advertise their website instead of teaching us something useful. Also, 徒名 isn't used for nickname. Double checking the dictionary, 徒名 is rumor of a romance. あだ名 is used for nickname. This entry is very poorly constructed and should be highly revised or deleted.
