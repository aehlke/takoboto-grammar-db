notes:
  - position: 0
    text: |-
      Sometimes names of your friends or pets are often shortened and known exclusively to your ingroup.In Japanese, this is normally done by shortening the given to half it's size and is common to have an abrupt sound っ in it. For example, if your friend is Tatsuki you might have called here Tatchan ever since you've known each other and has lasted to the present day. I also teach Japanese at www.freewebs.com/kanjiwebs/ which is great for beginners. Not so much as good as this place as it's only 3 months old.
