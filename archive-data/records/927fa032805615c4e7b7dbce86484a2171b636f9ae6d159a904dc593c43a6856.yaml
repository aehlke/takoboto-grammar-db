    text: "can it be used with negatives?\n\n\n\r\nできるだけ遅く\n\r\nas slowly/late as possible?"
    html: "can it be used with negatives?<br/>\n<br/>\r\nできるだけ遅く<br/>\r\nas slowly/late as possible?"
