    text: "is this used with the leading verb being a potential?\n\r\n会えるだけ早く\n\r\nmeet as soon as possible\n\n\n\r\n作れるだけ早く\n\r\nmake as soon as possible\n\n\n\r\n食べられるだけ早く\n\r\neat as quickly as possible"
    html: "is this used with the leading verb being a potential?<br/>\r\n会えるだけ早く<br/>\r\nmeet as soon as possible<br/>\n<br/>\r\n作れるだけ早く<br/>\r\nmake as soon as possible<br/>\n<br/>\r\n食べられるだけ早く<br/>\r\neat as quickly as possible"
    source_id: null
