  - position: 2
    credits_raw: Miki
    text: If you use the verb twice like this, it is possible. 会えるだけ早く会う。
    html: If you use the verb twice like this, it is possible. 会えるだけ早く会う。
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: "With negative, you can use it.　\n\r\nできるだけ遅く、来てください。\n\r\nPlease come as late as possible."
    html: "With negative, you can use it.　<br/>\r\nできるだけ遅く、来てください。<br/>\r\nPlease come as late as possible."
    source_id: null
