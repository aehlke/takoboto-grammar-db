notes:
  - position: 0
    text: "dekirudake + adverb means \"as much as (adverb)\".\n\r\nits used as an almost set phrase with 'hayaku':early/fast.\n\r\ndekirudake hayaku: as quickly/soon/early as possible."
    html: "dekirudake + adverb means \"as much as (adverb)\".<br/>\r\nits used as an almost set phrase with 'hayaku':early/fast.<br/>\r\ndekirudake hayaku: as quickly/soon/early as possible."
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
