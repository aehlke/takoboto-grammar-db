    text: "Maybe this should be listed as \"だけ-2\" - \"As much as 〜\"?\n\r\nできるだけ - \"As much as you can do\"\n\r\n好きなだけ - \"As much as you like\"\n\r\nほしいだけを取り下さい - \"Please take as much as you want\"\n\r\n寝たいだけ寝ることができない - \"I can't sleep as much as I want to.\""
    html: "Maybe this should be listed as \"だけ-2\" - \"As much as 〜\"?<br/>\r\nできるだけ - \"As much as you can do\"<br/>\r\n好きなだけ - \"As much as you like\"<br/>\r\nほしいだけを取り下さい - \"Please take as much as you want\"<br/>\r\n寝たいだけ寝ることができない - \"I can't sleep as much as I want to.\""
