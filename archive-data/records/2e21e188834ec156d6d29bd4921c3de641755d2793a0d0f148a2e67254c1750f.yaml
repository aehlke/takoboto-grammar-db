  - position: 11
    credits_raw: Nashira
    text: "~も~ば~も has 2 different meanings according to my teacher. (I'm still trying to grasp them both)\n\n\n\r\n1.いろいろな場合がある。\n\r\nSo the first meaning is to express different contrasting situations such as \"If there are people who like it, there are people who don't.\"\n\n\n\r\n2.二つのことが同時に備わっている。\n\r\nThe harder one of the two (for me)I interpret as something that possesses two simultaneous qualities or abiliities.\"He has neither money or status.\"\n\n\n\r\nCan anybody help clear this up for me? :)"
    html: "~も~ば~も has 2 different meanings according to my teacher. (I'm still trying to grasp them both)<br/>\n<br/>\r\n1.いろいろな場合がある。<br/>\r\nSo the first meaning is to express different contrasting situations such as \"If there are people who like it, there are people who don't.\"<br/>\n<br/>\r\n2.二つのことが同時に備わっている。<br/>\r\nThe harder one of the two (for me)I interpret as something that possesses two simultaneous qualities or abiliities.\"He has neither money or status.\"<br/>\n<br/>\r\nCan anybody help clear this up for me? :)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 12
    credits_raw: DrJones
    text: "I think both meanings can be translated as:\n\n\n\r\n\"as much (from one) as (from the other)\""
    html: "I think both meanings can be translated as:<br/>\n<br/>\r\n\"as much (from one) as (from the other)\""
