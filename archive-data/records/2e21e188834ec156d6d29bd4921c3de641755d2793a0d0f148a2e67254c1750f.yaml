  - position: 8
    credits_raw: 赤毛
    text: "I intent to answer to Tigertさん. About the conditional form (条件形), we learned that this form apply to more words than verbs in japanese:\n\r\nVウ->Vエバ:     する->すれば\n\r\nAイ->Aケレバ：  高い->高ければ\n\r\nAナ->Aナラ:     嫌[な]->嫌なら\n\r\nN->Nナラ:       雨->雨なら\n\r\nSomewhere も〜ば〜も and も〜なら〜も don't seem different."
    html: "I intent to answer to Tigertさん. About the conditional form (条件形), we learned that this form apply to more words than verbs in japanese:<br/>\r\nVウ-&gt;Vエバ:     する-&gt;すれば<br/>\r\nAイ-&gt;Aケレバ：  高い-&gt;高ければ<br/>\r\nAナ-&gt;Aナラ:     嫌[な]-&gt;嫌なら<br/>\r\nN-&gt;Nナラ:       雨-&gt;雨なら<br/>\r\nSomewhere も〜ば〜も and も〜なら〜も don't seem different."
    source_id: null
    original_created_at: null
    original_updated_at: null
