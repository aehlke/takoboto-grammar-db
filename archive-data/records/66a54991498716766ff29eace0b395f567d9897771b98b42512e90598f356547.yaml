  - position: 7
    credits_raw: blabby
    text: "I think \"you're screwed\" is also a good translation (意訳) in the case of my example #5315. \"That's the end of that\" might not be the most natural, but it is a general translation which fits almost all examples.\n\n\n\r\nTo me \"That's bad and you shouldn't be doing that. If they ever find out, you will be hitting your point of no return. \" seems a little strange."
    html: "I think \"you're screwed\" is also a good translation (意訳) in the case of my example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5315\">#5315</a></b>. \"That's the end of that\" might not be the most natural, but it is a general translation which fits almost all examples.<br/>\n<br/>\r\nTo me \"That's bad and you shouldn't be doing that. If they ever find out, you will be hitting your point of no return. \" seems a little strange."
    source_id: null
