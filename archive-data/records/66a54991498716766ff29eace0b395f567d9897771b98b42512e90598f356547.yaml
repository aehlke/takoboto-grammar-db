  - position: 8
    credits_raw: srobertson
    text: |-
      I also like to use "that's all she wrote" for this one. Like, "then you're screwed", it's a bit colloquial, but definitely sounds natural.　I also wonder if using a repetition here: for instance [#5315] could be written "...if you fail, you fail." However, in English, this can also have the sense of "no big deal", or "you can't argue with fate". So for [#5316] "If it rains, it rains" - in English, this has the implication that a) there's nothing you can do about it, and possibly b) no big deal. Are these nuances present in the Japanese?
    html: |-
      I also like to use "that's all she wrote" for this one. Like, "then you're screwed", it's a bit colloquial, but definitely sounds natural.　I also wonder if using a repetition here: for instance [<b><a href="http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5315">#5315</a></b>] could be written "...if you fail, you fail." However, in English, this can also have the sense of "no big deal", or "you can't argue with fate". So for [<b><a href="http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5316">#5316</a></b>] "If it rains, it rains" - in English, this has the implication that a) there's nothing you can do about it, and possibly b) no big deal. Are these nuances present in the Japanese?
    source_id: null
    original_created_at: null
    original_updated_at: null
