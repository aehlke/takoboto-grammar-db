  - position: 10
    credits_raw: Dutch
    text: |-
      'That's the end of that' is (I believe) much better English than those very odd phrases suggested above. The only problem with #4765 is that it is conditional, and therefore should be written: If you study hard and still fail the exam, that's the end of that.
    html: |-
      'That's the end of that' is (I believe) much better English than those very odd phrases suggested above. The only problem with <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#4765">#4765</a></b> is that it is conditional, and therefore should be written: If you study hard and still fail the exam, that's the end of that.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: bamboo
    text: |-
      [#5316] "If it rains, it rains" would be a good translation, since in Japanese, it conveys the feeling of resignation, too. Such tautological statement has the connotation of emphasis in Japanese. 雨が降るから雨が降る.
    html: |-
      [<b><a href="http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5316">#5316</a></b>] "If it rains, it rains" would be a good translation, since in Japanese, it conveys the feeling of resignation, too. Such tautological statement has the connotation of emphasis in Japanese. 雨が降るから雨が降る.
