  - position: 3
    credits_raw: blabby
    text: "You can also use this with other conditionals such as 〜たら, 〜なら, 〜と. Although most JLPT books only have the 〜ばそれまでだ version.\n\n\n\r\n\"that's the end of that\" is a great translation.  Thanks."
    html: "You can also use this with other conditionals such as 〜たら, 〜なら, 〜と. Although most JLPT books only have the 〜ばそれまでだ version.<br/>\n<br/>\r\n\"that's the end of that\" is a great translation.  Thanks."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: "I think \"that's the end of that\" is grossly ambiguous and it is not a good English. I suggest the following:\n\n\n\n#4765 \n\r\nEven if you study hard, should you fail the exams,then the things would go kaput!     \n\n\n\n#5315 \n\r\nThat's bad and you shouldn't be doing that. If they ever find out, you will be hitting your point of no return.     \n\n\n\n#5316 \n\r\nIf it rains, that's how the ball bounces."
    html: "I think \"that's the end of that\" is grossly ambiguous and it is not a good English. I suggest the following:<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#4765\">#4765</a></b> <br/>\r\nEven if you study hard, should you fail the exams,then the things would go kaput!     <br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5315\">#5315</a></b> <br/>\r\nThat's bad and you shouldn't be doing that. If they ever find out, you will be hitting your point of no return.     <br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=basoremadeda#5316\">#5316</a></b> <br/>\r\nIf it rains, that's how the ball bounces.<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: HokkaidoHillbilly
    text: |-
      To me, rather than "that's the end of that", it sounds more natural to say something more along the lines of " that's it" or depending on the case, "you're screwed".  A good example would be from the sentence above -  悪いことをしないほうがいいよ。見つかればそれまでだ。 You shouldn't be doing stuff like that.  Somebody sees you and you're gonna be screwed.
    html: |-
      To me, rather than "that's the end of that", it sounds more natural to say something more along the lines of " that's it" or depending on the case, "you're screwed".  A good example would be from the sentence above -  悪いことをしないほうがいいよ。見つかればそれまでだ。 You shouldn't be doing stuff like that.  Somebody sees you and you're gonna be screwed.
    source_id: null
    original_created_at: null
    original_updated_at: null
