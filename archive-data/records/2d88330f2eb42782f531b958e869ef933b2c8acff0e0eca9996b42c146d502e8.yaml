notes:
  - position: 0
    text: "VBryk（ます）\n\r\n→　an event is about to take place\n\r\n→　the VB is usually intransitive and has to be a Non-volitional, punctual VB\n\r\n→　can be replaced by KAKERU without a substantial change of meaning\n\r\n　　　　死にかかった＝faced death\n\r\n　　　　死に掛けた＝was half dead\n\n\n\r\n(Punctual VBs: \n\r\n：a Punctual VB with the auxiliary VB いる expresses a repeated action or a state after an action was taken or something took place:\n\r\n  知る（=>知っている）(get to know after studying)\n\r\n　死ぬ（=>死んでいる）(die after living)\n\r\n　忘れる（=>忘れている）(as a result of the passage of time)\n\r\n　飛ぶ、乗る、起きる、結婚する、困る,...  ）\n\r\n(Non-volitional VBs:\n\r\n：a Non-volitional VB usually does not take the voltional form, the imperative form and the potential form.\n\r\n-Non-volitional VBs are classified into  emotive VBs and non-emotive VBs\n\r\na) emotive VBs: 喜ぶ、悲しむ、好む、怒る、嫌う、苦しむ、…\n\r\nb).non-emotive VBｓ：　出来る、要る、知る、見える、聞こえる、似合う、違う、疲れる、分かる）"
    html: "VBryk（ます）<br/>\r\n→　an event is about to take place<br/>\r\n→　the VB is usually intransitive and has to be a Non-volitional, punctual VB<br/>\r\n→　can be replaced by KAKERU without a substantial change of meaning<br/>\r\n　　　　死にかかった＝faced death<br/>\r\n　　　　死に掛けた＝was half dead<br/>\n<br/>\r\n(Punctual VBs: <br/>\r\n：a Punctual VB with the auxiliary VB いる expresses a repeated action or a state after an action was taken or something took place:<br/>\r\n  知る（=&gt;知っている）(get to know after studying)<br/>\r\n　死ぬ（=&gt;死んでいる）(die after living)<br/>\r\n　忘れる（=&gt;忘れている）(as a result of the passage of time)<br/>\r\n　飛ぶ、乗る、起きる、結婚する、困る,...  ）<br/>\r\n(Non-volitional VBs:<br/>\r\n：a Non-volitional VB usually does not take the voltional form, the imperative form and the potential form.<br/>\r\n-Non-volitional VBs are classified into  emotive VBs and non-emotive VBs<br/>\r\na) emotive VBs: 喜ぶ、悲しむ、好む、怒る、嫌う、苦しむ、…<br/>\r\nb).non-emotive VBｓ：　出来る、要る、知る、見える、聞こえる、似合う、違う、疲れる、分かる）<br/>"
