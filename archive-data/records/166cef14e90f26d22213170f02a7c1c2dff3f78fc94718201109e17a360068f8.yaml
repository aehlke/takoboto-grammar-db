    credits_raw: iamharenchi
    text: |-
      たとえば？あの人はスミスさんでなくてだれだろう？とか？I think its grammatically correct its just probably not used.  Also consider that when speaking about other people you have to be careful about politeness, so saying なくてだれだろう？might be considered a little bit rude.
    html: |-
      たとえば？あの人はスミスさんでなくてだれだろう？とか？I think its grammatically correct its just probably not used.  Also consider that when speaking about other people you have to be careful about politeness, so saying なくてだれだろう？might be considered a little bit rude.
    source_id: null
