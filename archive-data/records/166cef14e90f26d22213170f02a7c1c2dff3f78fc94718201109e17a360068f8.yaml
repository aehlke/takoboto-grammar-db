    japanese: 自分の命を犠牲にして多くの人を救ったあの男が英雄でなくてなんだろう。
    body_text: "自分の命を犠牲にして多くの人を救ったあの男が英雄でなくてなんだろう。 \n\n\t\tThat man who sacrificed his own life to help so many people, if he isn't a hero I don't know who is. \n\t\tでなくてなんだろう"
