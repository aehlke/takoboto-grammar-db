    japanese: あの国の大統領は国民の意見は無視して何でも自分一人で決定する。これが独裁者でなくてなんだろう。
    body_text: "あの国の大統領は国民の意見は無視して何でも自分一人で決定する。これが独裁者でなくてなんだろう。 \n\n\t\tThe president of that country decides everything himself ignoring nation's concerns. If that's not dictatorship, then i don't know what is."
