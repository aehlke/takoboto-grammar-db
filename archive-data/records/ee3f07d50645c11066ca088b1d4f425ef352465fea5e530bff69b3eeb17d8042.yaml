    japanese: 出荷は遅れないよう改善しようと思っていたが、かえってデリバリデートが延長してしまう。
    body_text: "出荷は遅れないよう改善しようと思っていたが、かえってデリバリデートが延長してしまう。\r \n\n\t\tI intended to improve the shipment so as not to be late, but the delivery date will be extended instead."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ出荷は遅れないよう改善しようと思っていたが、かえってデリバリデートが延長してしまう。\">\n\t\t\t\t出荷は遅れないよう改善しようと思っていたが、<strong>かえって</strong>デリバリデートが延長してしまう。\r<strong></strong></a> <br/>\n\t\tI intended to improve the shipment so as not to be late, but the delivery date will be extended instead. \n\t\t<strong> </strong>"
