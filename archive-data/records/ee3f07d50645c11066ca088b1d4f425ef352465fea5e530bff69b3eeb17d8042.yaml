    japanese: 彼はえさをやりすぎてかえって犬をだめにしている。
    body_text: "彼はえさをやりすぎてかえって犬をだめにしている。\r \n\n\t\tHe is killing his dog with kindness by feeding it too much."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼はえさをやりすぎてかえって犬をだめにしている。\">\n\t\t\t\t彼はえさをやりすぎて<strong>かえって</strong>犬をだめにしている。\r<strong></strong></a> <br/>\n\t\tHe is killing his dog with kindness by feeding it too much. \n\t\t<strong> </strong>"
