  - source_id: 1349
    position: 0
    japanese: 安いと思って買ったのに、腐っていたのでかえって損をした。
    body_text: "安いと思って買ったのに、腐っていたのでかえって損をした。 \n\n\t\tI thought I was getting a bargain because it was so cheap. \n\t\tBut in fact I was surprised \n\t\tit was no good anyway."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ安いと思って買ったのに、腐っていたのでかえって損をした。\">\n\t\t\t\t安いと思って買ったのに、腐っていたので<strong>かえって</strong>損をした。<strong></strong></a> <br/>\n\t\tI thought I was getting a bargain because it was so cheap. \n\t\t<strong>But in fact I was surprised </strong>\n\t\tit was no good anyway."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4606
    position: 1
    japanese: あまりにしっかりうなぎを握ると、かえって逃げられる。
    body_text: "あまりにしっかりうなぎを握ると、かえって逃げられる。 \n\n\t\tHolding an eel too fast is the way to let her escape."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあまりにしっかりうなぎを握ると、かえって逃げられる。\">\n\t\t\t\tあまりにしっかりうなぎを握ると、<strong>かえって</strong>逃げられる。<strong></strong></a> <br/>\n\t\tHolding an eel too fast is the way to let her escape. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4607
    position: 2
    japanese: これだけ悪口雑言を浴びせられれば、後は怖いものなどありゃしない。かえってすっきりするよ。
    body_text: "これだけ悪口雑言を浴びせられれば、後は怖いものなどありゃしない。かえってすっきりするよ。 \n\n\t\tI'm not afraid of anything after having (verbal) abuse heaped on me like that. In fact I feel braced by it."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれだけ悪口雑言を浴びせられれば、後は怖いものなどありゃしない。かえってすっきりするよ。\">\n\t\t\t\tこれだけ悪口雑言を浴びせられれば、後は怖いものなどありゃしない。<strong>かえって</strong>すっきりするよ。<strong></strong></a> <br/>\n\t\tI'm not afraid of anything after having (verbal) abuse heaped on me like that. In fact I feel braced by it. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4608
    position: 3
    japanese: これはあまり自分を守ろうとすると、かえって大きな間違いを犯すことになるだけだ、ということです。
    body_text: "これはあまり自分を守ろうとすると、かえって大きな間違いを犯すことになるだけだ、ということです。 \n\n\t\tThis means that if you try to protect yourself too much, you will only make bigger mistakes."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれはあまり自分を守ろうとすると、かえって大きな間違いを犯すことになるだけだ、ということです。\">\n\t\t\t\tこれはあまり自分を守ろうとすると、<strong>かえって</strong>大きな間違いを犯すことになるだけだ、ということです。<strong></strong></a> <br/>\n\t\tThis means that if you try to protect yourself too much, you will only make bigger mistakes. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4609
    position: 4
    japanese: そんなに美辞麗句を並べられると、かえって嘘に聞こえるよね。
    body_text: "そんなに美辞麗句を並べられると、かえって嘘に聞こえるよね。 \n\n\t\tWhen someone speaks with such rhetorical flourish it starts to sound like they're lying."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJそんなに美辞麗句を並べられると、かえって嘘に聞こえるよね。\">\n\t\t\t\tそんなに美辞麗句を並べられると、<strong>かえって</strong>嘘に聞こえるよね。<strong></strong></a> <br/>\n\t\tWhen someone speaks with such rhetorical flourish it starts to sound like they're lying. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4610
    position: 5
    japanese: 完全を求めるとかえって失敗する。
    body_text: "完全を求めるとかえって失敗する。 \n\n\t\tThe best is often the enemy of the good."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ完全を求めるとかえって失敗する。\">\n\t\t\t\t完全を求めると<strong>かえって</strong>失敗する。<strong></strong></a> <br/>\n\t\tThe best is often the enemy of the good. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4611
    position: 6
    japanese: 休養するどころかかえっていつもより仕事に励んだ。
    body_text: "休養するどころかかえっていつもより仕事に励んだ。 \n\n\t\tInstead of taking a rest, he worked much harder than usual."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ休養するどころかかえっていつもより仕事に励んだ。\">\n\t\t\t\t休養するどころか<strong>かえって</strong>いつもより仕事に励んだ。<strong></strong></a> <br/>\n\t\tInstead of taking a rest, he worked much harder than usual. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4612
    position: 7
    japanese: 事故は減らずにかえって多くなっている。
    body_text: "事故は減らずにかえって多くなっている。 \n\n\t\tInstead of fewer accidents there are more."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ事故は減らずにかえって多くなっている。\">\n\t\t\t\t事故は減らずに<strong>かえって</strong>多くなっている。<strong></strong></a> <br/>\n\t\tInstead of fewer accidents there are more. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7018
    position: 8
    japanese: この問題が分からなくて、先生に聞いたけど、説明してくれて、かえって頭が混乱してきた。
    body_text: "この問題が分からなくて、先生に聞いたけど、説明してくれて、かえって頭が混乱してきた。 \n\n\t\tI didn't understand this question, so I asked the teacher, but after being given the explanation I just got more confused."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの問題が分からなくて、先生に聞いたけど、説明してくれて、かえって頭が混乱してきた。\">\n\t\t\t\tこの問題が分からなくて、先生に聞いたけど、説明してくれて、<strong>かえって</strong>頭が混乱してきた。<strong></strong></a> <br/>\n\t\tI didn't understand this question, so I asked the teacher, but after being given the explanation I just got more confused. \n\t\t<strong> </strong>"
    credits_raw: agnestan
