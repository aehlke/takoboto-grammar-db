      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 8192
    position: 9
    japanese: 欠点があるからかえって彼女が好きだ。
    body_text: "欠点があるからかえって彼女が好きだ。 \n\n\t\tI like her all the better for her faults."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ欠点があるからかえって彼女が好きだ。\">\n\t\t\t\t欠点があるから<strong>かえって</strong>彼女が好きだ。<strong></strong></a> <br/>\n\t\tI like her all the better for her faults. \n\t\t<strong> </strong>"
