    japanese: それはかえって家庭問題をさらに悪化させるだけだろう。
    body_text: "それはかえって家庭問題をさらに悪化させるだけだろう。 \n\n\t\tIt will only make family matters worse."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJそれはかえって家庭問題をさらに悪化させるだけだろう。\">\n\t\t\t\tそれは<strong>かえって</strong>家庭問題をさらに悪化させるだけだろう。<strong></strong></a> <br/>\n\t\tIt will only make family matters worse. \n\t\t<strong> </strong>"
