notes:
  - position: 0
    text: "＊This grammar is used to indicate time when one faces something formal. The compound particle is primarily used in written Japanese. When a verb precedes it, the verb is often a Sino-Japanese する verb, as in example #6306.\n\n\n\r\n＊The tense of the verb before に当たって;に当たり is always nonpast regardless of the tense of the final predicate. In this way, an incomplete aspect of an action is indicated by the verb. This is why the phrase can be translated into English as 'before' or 'prior to.'\n\n\n\r\n＊に当たり is more formal than　に当たって.\n\n\n\r\nFORMATION:\n\r\nＶ(plain nonpast) + にあたって・にあたり\n\r\nＮ + にあたって・にあたり"
    html: "＊This grammar is used to indicate time when one faces something formal. The compound particle is primarily used in written Japanese. When a verb precedes it, the verb is often a Sino-Japanese する verb, as in example <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=niatatte;+niatari#6306\">#6306</a></b>.<br/>\n<br/>\r\n＊The tense of the verb before に当たって;に当たり is always nonpast regardless of the tense of the final predicate. In this way, an incomplete aspect of an action is indicated by the verb. This is why the phrase can be translated into English as 'before' or 'prior to.'<br/>\n<br/>\r\n＊に当たり is more formal than　に当たって.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain nonpast) + にあたって・にあたり<br/>\r\nＮ + にあたって・にあたり"
    credits_raw: rubyhatchet
