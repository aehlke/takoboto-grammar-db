  - position: 14
    credits_raw: Unnamed
    text: "寒い　でした is incorrect. \n\r\n寒かった is ok.\n\r\n寒かった　です is politer because of the word です which expresses the standard polite form.\n\n\n\r\n犬だ is ok, all Japs say that. And if you change だ into です, it shows your politeness"
    html: "寒い　でした is incorrect. <br/>\r\n寒かった is ok.<br/>\r\n寒かった　です is politer because of the word です which expresses the standard polite form.<br/>\n<br/>\r\n犬だ is ok, all Japs say that. And if you change だ into です, it shows your politeness"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 15
    credits_raw: Max
    text: "For understanding the logic behind the copula transformations across tenses, affirmative/negative form etc... it helps to fall back to a vision of だ as the contraction of the canonic (formal) form である.\n\n\n\r\ncanonic         contraction\n\r\nである　　　　　だ\n\r\nであります　　　です\n\r\nであった　　　　だった\n\r\nでありました　　でした\n\r\nであろう　　　　だろう\n\r\nでありましょう　でしょう\n\n\n\r\nYou can then mostly rebuild the whole conjugation table by combining that with the following:\n\r\n- は is (generally) appended to で for the negative form: では,  contracted to じゃ in less formal situations\n\r\n- conjugation of ある: negative plain form of 5段 verb ある is い-adjective ない,  polite form of 5段 verb ある is irregular verb ござる\n\r\n- standard understanding of 5段 verb and い-adjective conjugations"
    html: "For understanding the logic behind the copula transformations across tenses, affirmative/negative form etc... it helps to fall back to a vision of だ as the contraction of the canonic (formal) form である.<br/>\n<br/>\r\ncanonic         contraction<br/>\r\nである　　　　　だ<br/>\r\nであります　　　です<br/>\r\nであった　　　　だった<br/>\r\nでありました　　でした<br/>\r\nであろう　　　　だろう<br/>\r\nでありましょう　でしょう<br/>\n<br/>\r\nYou can then mostly rebuild the whole conjugation table by combining that with the following:<br/>\r\n- は is (generally) appended to で for the negative form: では,  contracted to じゃ in less formal situations<br/>\r\n- conjugation of ある: negative plain form of 5段 verb ある is い-adjective ない,  polite form of 5段 verb ある is irregular verb ござる<br/>\r\n- standard understanding of 5段 verb and い-adjective conjugations"
    source_id: null
    original_created_at: null
    original_updated_at: null
