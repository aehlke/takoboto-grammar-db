    credits_raw: Amatuka
    text: "Note the particle は is _said_ 'wa' but (depending on romaji system used) may be written 'ha'.\n\r\nThe kana わ on the other hand is always said and written 'wa'."
    html: "Note the <b>particle</b> は is _said_ 'wa' but (depending on romaji system used) may be written 'ha'.<br/>\r\nThe <b>kana</b> わ on the other hand is always said <b>and</b> written 'wa'."
    source_id: null
    original_created_at: null
