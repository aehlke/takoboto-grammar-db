  - position: 18
    credits_raw: karamu san
    text: |-
      So, all conjugations of the copula are derived from contractions of である and ではある (for negative tenses). In the negative present and past possible tenses, the conjugations are ないでしょう and なかったでしょう. Why can't they also become ではないでしょう and ではなかったでしょう? Also, why can't the plain past and negative possible tenses be contracted from ではないだろう and ではなかっただろう to じゃないだろう and じゃなかっただろう?
    html: |-
      So, all conjugations of the copula are derived from contractions of である and ではある (for negative tenses). In the negative present and past possible tenses, the conjugations are ないでしょう and なかったでしょう. Why can't they also become ではないでしょう and ではなかったでしょう? Also, why can't the plain past and negative possible tenses be contracted from ではないだろう and ではなかっただろう to じゃないだろう and じゃなかっただろう?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 19
    credits_raw: Sumofan
    text: "Re Mitokomun and dc's comments on は/wa/ha: \n\r\nI just checked about 20 text books/dictionaries. Without exception they all romanize the particle は as \"wa\". The only place I have ever come across the particle は written \"ha\" is on the Internet. I presume this is due to cases where computers have done automatic transcriptions of hiragana to romaji without regard for the grammatical context."
