  - position: 12
    credits_raw: dc
    text: "I always found this \"tense\" for adjectives confusing. guess we dont have a past tense of \"cold\" in english. colded?\n\n\n\r\nNG:　寒い　でした : cold , it was \n\r\nOK:　寒かった　です: colded , it is"
    html: "I always found this \"tense\" for adjectives confusing. guess we dont have a past tense of \"cold\" in english. colded?<br/>\n<br/>\r\nNG:　寒い　でした : cold , it was <br/>\r\nOK:　寒かった　です: colded , it is<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 13
    credits_raw: dc
    text: "Mitokomun > romanized japanese textbooks that I have seen always write は as \"ha\" even when they know it should be pronounced \"wa\". \n\r\nTo make it even more confusing, there are occasions where it is pronounced \"wa\" too...\n\r\nMaybe someone else can explain why this is, but we are sticking to the standard romanization method. I guess I got used to it but it really threw me at first.\n\r\ncheck the ha page for more."
    html: "Mitokomun &gt; romanized japanese textbooks that I have seen always write は as \"ha\" even when they know it should be pronounced \"wa\". <br/>\r\nTo make it even more confusing, there are occasions where it is pronounced \"wa\" too...<br/>\r\nMaybe someone else can explain why this is, but we are sticking to the standard romanization method. I guess I got used to it but it really threw me at first.<br/>\r\ncheck the <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ha\">ha</a></b> page for more."
