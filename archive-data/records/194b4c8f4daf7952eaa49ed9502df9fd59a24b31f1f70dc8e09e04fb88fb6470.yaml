examples:
  - source_id: 7912
    position: 0
    japanese: 人がなんと言おう（と/が）、私は自分の子供を信じている。
    body_text: "人がなんと言おう（と/が）、私は自分の子供を信じている。 \n\nWhatever \n\t\tother people say, I believe my child"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ人がなんと言おう（と/が）、私は自分の子供を信じている。\">\n\t\t\t\t人がなんと言<strong>おう（と/が）</strong>、私は自分の子供を信じている。<strong></strong></a> <br/>\n<strong>Whatever </strong>\n\t\tother people say, I believe my child"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7913
    position: 1
    japanese: 頑固と言われよう（と／が）バカと言われよう（と／が）、私は自分の信じることをやります。
    body_text: "頑固と言われよう（と／が）バカと言われよう（と／が）、私は自分の信じることをやります。 \n\nEven if \n\t\tpeople say I'm stubborn or stupid, I'll do what I believe in."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ頑固と言われよう（と／が）バカと言われ\">\n\t\t\t\t頑固と言われ<strong>よう（と／が）</strong>バカと言われ<strong>よう（と／が）</strong>、私は自分の信じることをやります。</a> <br/>\n<strong>Even if </strong>\n\t\tpeople say I'm stubborn or stupid, I'll do what I believe in."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7914
    position: 2
    japanese: あの教授は学生が分かろう（と／が）分かるまい（と／が）かまわず授業を進めていく。
    body_text: "あの教授は学生が分かろう（と／が）分かるまい（と／が）かまわず授業を進めていく。 \n \n\n\t\tThat professor keeps lecturing \n\t\tregardlesss of whether \n\t\this students understand it or not."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあの教授は学生が分かろう（と／が）分かるまい（と／が）かまわず授業を進めていく。 \">\n\t\t\t\tあの教授は学生が分か<strong>ろう（と／が）</strong>分かるまい（と／が）かまわず授業を進めていく。 <strong>\n</strong></a> <br/>\n\t\tThat professor keeps lecturing \n\t\t<strong>regardlesss of whether </strong>\n\t\this students understand it or not."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7915
    position: 3
    japanese: 報酬が多かろう（と／が）少なかろう（と／が）私はやるべきことをやるだけだ。
    body_text: "報酬が多かろう（と／が）少なかろう（と／が）私はやるべきことをやるだけだ。  \n\nWhether \n\t\tthe compensation is high or low, I'll just do what I have to do."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ報酬が多かろう（と／が）\">\n\t\t\t\t報酬が多<strong>かろう（と／が）</strong><strong>少なかろう（と／が）</strong>私はやるべきことをやるだけだ。 </a> <br/>\n<strong>Whether </strong>\n\t\tthe compensation is high or low, I'll just do what I have to do."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7916
    position: 4
    japanese: 周囲に反対されようが、自分でやると決めた以上は最後までやり抜くつもりだ
    body_text: "周囲に反対されようが、自分でやると決めた以上は最後までやり抜くつもりだ \n\neven if \n\t\tthose around me disagree, once I've decided I'll do it, I'll give it my all"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ周囲に反対されようが、自分でやると決めた以上は最後までやり抜くつもりだ\">\n\t\t\t\t周囲に反対され<strong>ようが</strong>、自分でやると決めた以上は最後までやり抜くつもりだ<strong></strong></a> <br/>\n<strong>even if </strong>\n\t\tthose around me disagree, once I've decided I'll do it, I'll give it my all"
