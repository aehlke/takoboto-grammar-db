examples:
  - source_id: 6377
    position: 0
    japanese: 彼は本当にプロ並みのDJのように、一曲が終わったか終わらないかのうちに、次の一曲を整えてくる。
    body_text: "彼は本当にプロ並みのDJのように、一曲が終わったか終わらないかのうちに、次の一曲を整えてくる。 \n\r\n\t\tHe is such a good DJ, \r\n\t\tno sooner has \r\n\t\tone song finished, he already has the next record ready to play."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJ彼は本当にプロ並みのDJのように、一曲が終わったか終わら\">\r\n\t\t\t\t彼は本当にプロ並みのDJのように、一曲が終わった<strong>か</strong>終わら<strong>ないかのうちに、</strong>次の一曲を整えてくる。</a> <br/>\r\n\t\tHe is such a good DJ, \r\n\t\t<strong>no sooner has </strong>\r\n\t\tone song finished, he already has the next record ready to play."
    credits_raw: kadoka66
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6378
    position: 1
    japanese: 日本では電車のドアが開くか開かないかのうちに,乗客が飛び出してくる。
    body_text: "日本では電車のドアが開くか開かないかのうちに,乗客が飛び出してくる。 \n\r\n\t\tIn Japan \r\n\t\tno sooner have \r\n\t\tthe train doors opened, people start rushing out."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJ日本では電車のドアが開くか開か\">\r\n\t\t\t\t日本では電車のドアが開く<strong>か</strong>開か<strong>ないかのうちに,</strong>乗客が飛び出してくる。</a> <br/>\r\n\t\tIn Japan \r\n\t\t<strong>no sooner have </strong>\r\n\t\tthe train doors opened, people start rushing out."
    credits_raw: kadoka66
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6379
    position: 2
    japanese: この店の寿司弁当は、店頭に並ぶか並ばないかのうちに、飛ぶように売れていく。
    body_text: "この店の寿司弁当は、店頭に並ぶか並ばないかのうちに、飛ぶように売れていく。 \n\r\n\t\tThis shops sushi lunchbox is \r\n\t\tno sooner \r\n\t\tput on sale, it sells like hot cakes."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJこの店の寿司弁当は、店頭に並ぶか並ば\">\r\n\t\t\t\tこの店の寿司弁当は、店頭に並ぶ<strong>か</strong>並ば<strong>ないかのうちに</strong>、飛ぶように売れていく。</a> <br/>\r\n\t\tThis shops sushi lunchbox is \r\n\t\t<strong>no sooner </strong>\r\n\t\tput on sale, it sells like hot cakes."
