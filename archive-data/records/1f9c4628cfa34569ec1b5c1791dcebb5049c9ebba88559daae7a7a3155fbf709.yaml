    credits_raw: Miki
    text: "As for the first example, J should be どうやら彼_は_分からないらしい。\n\r\n彼が分からないらしい would be, it seems she doesn't know who he is."
    html: "As for the first example, J should be どうやら彼_は_分からないらしい。<br/>\r\n彼が分からないらしい would be, it seems she doesn't know who he is."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: "どうやら彼が分からないらしい means someone (who remains unidentified but not the speaker) cannot discern him.\n\n\n\r\nどうやら彼は分からないらしい means \"he\" is not able to discern something (not dicclosed) as observed by the speaker."
    html: "どうやら彼が分からないらしい means someone (who remains unidentified but not the speaker) cannot discern him.<br/>\n<br/>\r\nどうやら彼は分からないらしい means \"he\" is not able to discern something (not dicclosed) as observed by the speaker.   <br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: Accordingly, 彼が分からないらしい should be changed to 彼は知らないらしい.
    html: |-
      Accordingly, 彼が分からないらしい should be changed to 彼は知らないらしい.<br/>
      <br/>
