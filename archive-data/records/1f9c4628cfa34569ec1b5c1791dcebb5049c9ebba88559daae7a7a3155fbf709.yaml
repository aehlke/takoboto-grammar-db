  - position: 8
    credits_raw: Nick
    text: "〜らしい (I hear that... / Someone says that...)\n\r\n〜ようだ (It seems that...)\n\r\nThese are not interchangeable."
    html: "〜らしい (I hear that... / Someone says that...)<br/>\r\n〜ようだ (It seems that...)<br/>\r\nThese are not interchangeable."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: Petra
    text: "Perhaps I don't understand. This is what I think from these two phrases:\n\n\n\r\nどうやら、私はバスの中で財布を盗まれたようだ。\n\r\nIt looks like I had my wallet stolen on the bus somehow. (The person has noticed their wallet is missing all on their own.)\n\n\n\r\nどうやら、私はバスの中で財布を盗まれたらしい\n\r\nI heard/It seems that I had my wallet stolen on the bus somehow. \n\r\n(They don't remember what happened on the bus, but someone has told them later they saw the wallet being stolen. Or maybe someone has told them their wallet was stolen before they noticed it themselves. However, I don't think I would have the nerve to tell someone I saw their wallet being stolen yet didn't say it at the time it was happening...)\n\n\n\r\nPlease correct me if I'm wrong."
    html: "Perhaps I don't understand. This is what I think from these two phrases:<br/>\n<br/>\r\nどうやら、私はバスの中で財布を盗まれたようだ。<br/>\r\nIt looks like I had my wallet stolen on the bus somehow. (The person has noticed their wallet is missing all on their own.)<br/>\n<br/>\r\nどうやら、私はバスの中で財布を盗まれたらしい<br/>\r\nI heard/It seems that I had my wallet stolen on the bus somehow. <br/>\r\n(They don't remember what happened on the bus, but someone has told them later they saw the wallet being stolen. Or maybe someone has told them their wallet was stolen before they noticed it themselves. However, I don't think I would have the nerve to tell someone I saw their wallet being stolen yet didn't say it at the time it was happening...)<br/>\n<br/>\r\nPlease correct me if I'm wrong."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: jmadsen
    text: "Please note that どうやら\n\r\nis used with -らしい, -みたい, -そうだ, etc.\n\n\n\r\nTo use どうやら by itself is, in the words of my wife, \"strange\""
    html: "Please note that どうやら<br/>\r\nis used with -らしい, -みたい, -そうだ, etc.<br/>\n<br/>\r\nTo use どうやら by itself is, in the words of my wife, \"strange\"<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
