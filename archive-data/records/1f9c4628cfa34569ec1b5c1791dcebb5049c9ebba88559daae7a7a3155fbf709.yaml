    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=douyara#3095\">#3095</a></b><br/>\r\nI would say \"どうやら、あの人は判らないらしい。\"<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=douyara#3930\">#3930</a></b><br/>\r\nI would say \"どうやら、私はバスの中で財布を盗まれたようだ。\"<br/>\n<br/>\r\nThe other examples are OK."
