    text: "niyotte = depending on\n\r\ndepending on the weather\n\r\n(also, \"by\" as in \"by picasso\")\n\n\n\nniyoruto = according to\n\n\n\nshidai = as soon\n\r\nas soon as you can do it\n\n\n\nkekka = as a result of\n\r\nas a result of our consultation, i decided\n\n\n\nnioujite = according to\n\r\nexercise according to your age\n\n\n\nnishitagatte = accordingly\n\r\nno budget, so accordingly its cancelled\n\n\n\ntabi each time\n\n\n\nnitsukete = each time\n\n\n\r\nwokikkakeni = on doing A, B occurred\n\r\nat the time of climbed mt fuji, i found an interest in hiking \n\n\n\r\nwokeikini = on the opportunity/occasion of\n\r\non the occasion of his visit to China, he met the Premier\n\r\n(fml, wr)\n\n\n\r\n------ 1級 ------\n\n\n\nikande = depending on\n\r\n(fml, wr)\n\n\n\nikandeha"
