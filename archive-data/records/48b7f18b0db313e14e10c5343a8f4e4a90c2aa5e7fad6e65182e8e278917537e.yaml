    credits_raw: dbartlett95
    text: |-
      According to my Japanese friend they never use "の中に" when you are picking items out of a list (like picking your favorite).   They say, "スポーツの中で、どちらが一番好き？　I think that "の中に" translates more to "within" and "の中で”is "in or out of".  So the sentence 箱の中に、なにがあるの？ is correct because it can be translated as "What is there within the box?"
    html: |-
      According to my Japanese friend they never use "の中に" when you are picking items out of a list (like picking your favorite).   They say, "スポーツの中で、どちらが一番好き？　I think that "の中に" translates more to "within" and "の中で”is "in or out of".  So the sentence 箱の中に、なにがあるの？ is correct because it can be translated as "What is there within the box?"<br/>
