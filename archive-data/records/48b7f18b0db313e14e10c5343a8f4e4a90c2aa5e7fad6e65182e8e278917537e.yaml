  - position: 4
    credits_raw: bsloh
    text: "の中に is to indicate object location, for example スパートの中に本屋があります。(Bookshop is in the supermarket.)\n\n\n\r\nの中で is exlpain as \"among the category\", for example 果物の中で、どちらが一番すきですか。(Among the fruits,what is your favourite?)"
    html: "の中に is to indicate object location, for example スパートの中に本屋があります。(Bookshop is in the supermarket.)<br/>\n<br/>\r\nの中で is exlpain as \"among the category\", for example 果物の中で、どちらが一番すきですか。(Among the fruits,what is your favourite?)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: bamboo4
    text: 'ex #5902  の中に should be changed to 中で(なかで）. Also "out of" should be "among".'
