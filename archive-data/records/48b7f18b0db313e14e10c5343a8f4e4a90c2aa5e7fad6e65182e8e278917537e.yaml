notes:
  - position: 0
    text: "Location is specified with the combination of a location noun and/or relative place word (上、下、中、外、後ろ、前、横、そば）and the location marker に､and one of the two existance verbs ある or いる\n\n\n\r\nある　is used when talking about inanimate objects or states of being. while いる　is used for animate objects.\n\n\n\r\nMy dog is in your car\n\r\nわたしの犬はあなたの車にいます｡\n\r\nMy hat is in your car\n\r\nわたしのぼうしはあなたの車にあります｡\n\n\n\r\nIf you want to specify a relative location IE in something, next to something, on something. you combine the　location noun with the relative location word using the posessive particle　の\n\n\n\r\nOn the desk\n\r\nつくえの上\n\r\nIn the bag\n\r\nかばんの中\n\r\nby the tv\n\r\nテレビの横\n\r\nbehind the car\n\r\n車の後ろ\n\r\ninfront of the computer\n\r\nパャRンの前\n\n\n\r\nbecareful to include the location particle に at the end of the relative location statement.\n\r\nで can also be used for location, but not in combination with the いる　and ある verbs."
    html: "Location is specified with the combination of a location noun and/or relative place word (上、下、中、外、後ろ、前、横、そば）and the location marker に､and one of the two existance verbs ある or いる<br/>\n<br/>\r\nある　is used when talking about inanimate objects or states of being. while いる　is used for animate objects.<br/>\n<br/>\r\nMy dog is in your car<br/>\r\nわたしの犬はあなたの車にいます｡<br/>\r\nMy hat is in your car<br/>\r\nわたしのぼうしはあなたの車にあります｡<br/>\n<br/>\r\nIf you want to specify a relative location IE in something, next to something, on something. you combine the　location noun with the relative location word using the posessive particle　の<br/>\n<br/>\r\nOn the desk<br/>\r\nつくえの上<br/>\r\nIn the bag<br/>\r\nかばんの中<br/>\r\nby the tv<br/>\r\nテレビの横<br/>\r\nbehind the car<br/>\r\n車の後ろ<br/>\r\ninfront of the computer<br/>\r\nパャRンの前<br/>\n<br/>\r\nbecareful to include the location particle に at the end of the relative location statement.<br/>\r\nで can also be used for location, but not in combination with the いる　and ある verbs.<br/>\n<br/>"
