    body_text: "あなたが出かけるときドアに鍵をかけるのを忘れないように気をつけてください。 \n\n\t\tPlease be careful not to forget to lock the door when you go out."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあなたが出かけるときドアに鍵をかけるのを忘れないように気をつけ\">\n\t\t\t\tあなたが出かけるときドアに鍵をかけるのを忘れない<strong>ように</strong>気をつけ<strong>て</strong>ください。</a> <br/>\n\t\tPlease be careful not to forget to lock the door when you go out. \n\t\t<strong> </strong>"
