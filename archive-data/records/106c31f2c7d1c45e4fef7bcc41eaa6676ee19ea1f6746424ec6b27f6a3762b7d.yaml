    body_text: "私は部長にこの点について榎本さんに確認するように言われました。 \n\n\t\tI was asked by the Boss to confirm with you (mr enomoto) on this point."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私は部長にこの点について榎本さんに確認するように言われました。\">\n\t\t\t\t私は部長にこの点について榎本さんに確認する<strong>ように</strong>言われました。<strong></strong></a> <br/>\n\t\tI was asked by the Boss to confirm with you (mr enomoto) on this point. \n\t\t<strong> </strong>"
