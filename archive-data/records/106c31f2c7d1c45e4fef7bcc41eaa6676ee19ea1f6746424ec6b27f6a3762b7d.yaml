    japanese: ドアの所にいる人が誰であれ、待つように言ってください。
    body_text: "ドアの所にいる人が誰であれ、待つように言ってください。  \n\n\t\tWhoever is at your door, \n\t\task them \n\t\tto wait  ."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJドアの所にいる人が誰であれ、待つように\">\n\t\t\t\tドアの所にいる人が誰であれ、待つ<strong>ように</strong><strong>言って</strong>ください。 </a> <br/>\n\t\tWhoever is at your door, \n\t\t<strong>ask them </strong>\n\t\tto wait  ."
