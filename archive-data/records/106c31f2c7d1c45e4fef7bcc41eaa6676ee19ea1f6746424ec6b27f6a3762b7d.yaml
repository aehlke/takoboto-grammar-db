    body_text: "急ぐときほど、安全の確認を怠らないようにして下さい。 \n\n\t\tEven if you're in a hurry, please \n\t\tdo the necessary so \nyou don't neglect  the security recommendations."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ急ぐときほど、安全の確認を怠らないようにして\">\n\t\t\t\t急ぐときほど、安全の確認を怠らない<strong>ようにして</strong><strong></strong>下さい。</a> <br/>\n\t\tEven if you're in a hurry, please \n\t\t<strong>do the necessary so </strong>\nyou don't neglect  the security recommendations."
