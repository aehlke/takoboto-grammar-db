    japanese: 日本語の場合、先ずは私に連絡するように伝えて頂ければ幸いです。
    body_text: "日本語の場合、先ずは私に連絡するように伝えて頂ければ幸いです。 \n\n\t\tIf it is in Japanese, at first I would be happy if \n\t\tyou could please ask him \n\t\tto contact me."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ日本語の場合、先ずは私に連絡するように伝え\">\n\t\t\t\t日本語の場合、先ずは私に連絡する<strong>ように</strong>伝え<strong>て</strong>頂ければ幸いです。</a> <br/>\n\t\tIf it is in Japanese, at first I would be happy if \n\t\t<strong>you could please ask him </strong>\n\t\tto contact me."
