    body_text: "明日妹さんを早く来るようにさせて下さい、聞きたいことがあるんですよ。 \n\n\t\tCan you \n\t\tmake \n\t\tyour sister come early tomorrow, cause I have something to ask her."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ明日妹さんを早く来るようにさせて下さい、聞きたいことがあるんですよ。\">\n\t\t\t\t明日妹さんを早く来る<strong>ように</strong>させて下さい、聞きたいことがあるんですよ。<strong></strong></a> <br/>\n\t\tCan you \n\t\t<strong>make </strong>\n\t\tyour sister come early tomorrow, cause I have something to ask her."
