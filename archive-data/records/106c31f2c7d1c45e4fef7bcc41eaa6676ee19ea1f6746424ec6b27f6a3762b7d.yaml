    credits_raw: dc
    text: "youniiu is the same. \n\r\nthis ends in -te (continuous form) because it is usually finished with -kudasai.\n\n\n\r\nsuru you ni itte kudasai - tell to do (please)\n\r\nsuru you ni iu  - tell to do"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=youniiu\">youniiu</a></b> is the same. <br/>\r\nthis ends in -te (continuous form) because it is usually finished with -kudasai.<br/>\n<br/>\r\nsuru you ni itte kudasai - tell to do (please)<br/>\r\nsuru you ni iu  - tell to do"
