    body_text: "残念なことに、ストで新幹線が止まり、旅行は中止になってしまった。 \n\nQuite \n\t\tunfortunately, the bullet trains have been stopped because of a strike, and our trip got cancelled."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ残念なことに、ストで新幹線が止まり、旅行は中止になってしまった。\">\n\t\t\t\t残念な<strong>ことに</strong>、ストで新幹線が止まり、旅行は中止になってしまった。<strong></strong></a> <br/>\n<strong>Quite </strong>\n\t\tunfortunately, the bullet trains have been stopped because of a strike, and our trip got cancelled."
