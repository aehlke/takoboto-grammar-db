    body_text: "残念なことに、楽しみにしていたキャンプが雨で中止になった。 \n\n\t\tThe unfortunate thing is that the camp I had looked forward to was canceled due to rain."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ残念なことに、楽しみにしていたキャンプが雨で中止になった。\">\n\t\t\t\t残念なことに、楽しみにしていたキャンプが雨で中止になった。<strong></strong><strong></strong></a> <br/>\n\t\tThe unfortunate thing is that the camp I had looked forward to was canceled due to rain. \n\t\t<strong> </strong>"
