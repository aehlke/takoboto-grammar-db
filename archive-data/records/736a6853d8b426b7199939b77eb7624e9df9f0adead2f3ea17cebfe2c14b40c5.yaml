    body_text: "驚いたことになくした財布が無事に警察に届けられていた。 \n\n\t\tTo my \n\t\tgreat \n\t\tsurprise, my lost wallet made it to the police intact."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ驚いたことになくした財布が無事に警察に届けられていた。\">\n\t\t\t\t驚いた<strong>ことに</strong>なくした財布が無事に警察に届けられていた。<strong></strong></a> <br/>\n\t\tTo my \n\t\t<strong>great </strong>\n\t\tsurprise, my lost wallet made it to the police intact."
