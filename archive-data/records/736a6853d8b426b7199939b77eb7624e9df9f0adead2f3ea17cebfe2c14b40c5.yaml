    japanese: 嬉しいことに４月から、給料が１割りほど上がる。
    body_text: "嬉しいことに４月から、給料が１割りほど上がる。 \n\n\t\tIt is \n\t\ta totally \n\t\tgreat thing, from April my salary goes up by 10%"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ嬉しいことに４月から、給料が１割りほど上がる。\">\n嬉しい<strong>ことに</strong>４月から、給料が１割りほど上がる。<strong></strong></a> <br/>\n\t\tIt is \n\t\t<strong>a totally </strong>\n\t\tgreat thing, from April my salary goes up by 10%"
