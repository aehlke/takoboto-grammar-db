    body_text: "驚いたことには、彼女は7か国語が話せるそうだ。 \n\nQuite \n\t\tsurprisingly, I heard that she can speak seven foreign languages."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ驚いたことには、彼女は7か国語が話せるそうだ。\">\n\t\t\t\t驚いた<strong>ことには</strong>、彼女は7か国語が話せるそうだ。<strong></strong></a> <br/>\n<strong>Quite </strong>\n\t\tsurprisingly, I heard that she can speak seven foreign languages."
