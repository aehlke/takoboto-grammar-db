  - source_id: 5256
    position: 1
    japanese: "残念な\r\nことに、ポケットの穴から全部のお釣りを落としてしまいました。"
    body_text: "残念な\r\nことに、ポケットの穴から全部のお釣りを落としてしまいました。 \n\nUnfortunately \n\t\t, I've lost all my change through a hole in my pocket."
