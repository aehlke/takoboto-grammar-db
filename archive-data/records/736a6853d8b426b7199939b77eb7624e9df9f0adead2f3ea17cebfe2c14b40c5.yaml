comments:
  - position: 0
    credits_raw: 誠
    text: "I think the English translation should be better with 「The 〜 thing is that, .....」for 「〜ことに」. So for\n\r\nex#310 嬉しいことに、四月から給料が一割ほど上がる\n\r\n「The happy/hearthening thing is that, from April onwards my salary will go up by around 10%.」I prefer to use \"hearthening\" in this case.\n\r\nNotice the comma is at the ことに\n\n\n\r\nex#5256「The unfortunate thing is that, I dropped and lost all my change through a hole in my pocket.」"
    html: "I think the English translation should be better with 「The 〜 thing is that, .....」for 「〜ことに」. So for<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotoni#310\">#310</a></b> 嬉しいことに、四月から給料が一割ほど上がる<br/>\r\n「The happy/hearthening thing is that, from April onwards my salary will go up by around 10%.」I prefer to use \"hearthening\" in this case.<br/>\r\nNotice the comma is at the ことに<br/>\n<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotoni#5256\">#5256</a></b>「The unfortunate thing is that, I dropped and lost all my change through a hole in my pocket.」"
    source_id: null
    original_created_at: null
