  - position: 7
    credits_raw: 誠
    text: "トイレに行きたいんですが．．．could mean \"I would like to go to the toilet, (could please let me go...)\" Here が is just a polite or humble way of asking or saying, instead of the meaning \" but \"\n\r\nトイレに行きたいんですけど．．．has the same meaning but けどless polite than が.\n\n\n\r\nPolite usage of が with んです:\n\r\nちょっと聞きたいんですが... ”Excuse me, may I ask you / I would like to ask you something....\"\n\r\nFor example , asking the way to a place."
    html: "トイレに行きたいんですが．．．could mean \"I would like to go to the toilet, (could please let me go...)\" Here が is just a polite or humble way of asking or saying, instead of the meaning \" but \"<br/>\r\nトイレに行きたいんですけど．．．has the same meaning but けどless polite than が.<br/>\n<br/>\r\nPolite usage of が with んです:<br/>\r\nちょっと聞きたいんですが... ”Excuse me, may I ask you / I would like to ask you something....\"<br/>\r\nFor example , asking the way to a place."
    source_id: null
