notes:
  - position: 0
    text: "〜んですね（確認）seeking affirmations or confirmation or agreement.\n\r\ne.g.  A:「ここで受験を申し込むんですね。」\n\r\n      B:「ええ、ここで申し込んでください。」\n\n\n\r\n疑問詞＋んですか（説明を求める）seeking explanation\n\r\ne.g. : 「何時ごろ学校に集まるんですか」\n\n\n\r\nどうして〜んですか（理由を聞く）asking reason\n\r\ne.g.: 「どうして勉強しないんですか」\n\n\n\r\n〜んです(理由を説明する）giving reason(s)\n\r\ne.g. A:「どうして日本語を勉強しているんですか。」\n\r\n     B:「日本の生活を経験したいんです。」\n\r\nHere please note that one should never use ので、から、だから、ものだから together with んです. んですhere is giving the reason.And whenever one is asked with んですか, one should reply with んです。\n\n\n\r\n〜んですが、どうしたらいいですか（助言を求めるときの前置き）seeking for suggestions,advice,help\n\r\ne.g.　荷物が着かないんですが、どうしたらいいですか／どうしたらいいんでしょうか\n\n\n\r\n〜んですが、〜ていただけませんか（依頼するときの前置き）requesting or asking others for a favour.\n\r\ne.g. 日本語を勉強したいんですが、ラジオを小さくしていただけませんか。"
    html: "〜んですね（確認）seeking affirmations or confirmation or agreement.<br/>\r\ne.g.  A:「ここで受験を申し込むんですね。」<br/>\r\n      B:「ええ、ここで申し込んでください。」<br/>\n<br/>\r\n疑問詞＋んですか（説明を求める）seeking explanation<br/>\r\ne.g. : 「何時ごろ学校に集まるんですか」<br/>\n<br/>\r\nどうして〜んですか（理由を聞く）asking reason<br/>\r\ne.g.: 「どうして勉強しないんですか」<br/>\n<br/>\r\n〜んです(理由を説明する）giving reason(s)<br/>\r\ne.g. A:「どうして日本語を勉強しているんですか。」<br/>\r\n     B:「日本の生活を経験したいんです。」<br/>\r\nHere please note that one should never use ので、から、だから、ものだから together with んです. んですhere is giving the reason.And whenever one is asked with んですか, one should reply with んです。<br/>\n<br/>\r\n〜んですが、どうしたらいいですか（助言を求めるときの前置き）seeking for suggestions,advice,help<br/>\r\ne.g.　荷物が着かないんですが、どうしたらいいですか／どうしたらいいんでしょうか<br/>\n<br/>\r\n〜んですが、〜ていただけませんか（依頼するときの前置き）requesting or asking others for a favour.<br/>\r\ne.g. 日本語を勉強したいんですが、ラジオを小さくしていただけませんか。"
