    credits_raw: 誠
    text: "gtunak85さん、you are quite right. actually there is no need to have a separate entry for なん。Here is the explanation:\n\r\n動詞：行く／行かない／行った／行かなかった\n\r\n　　　＋んです\n\n\n\r\nい形容詞：高い／高くない／高かった／高くなかった\n\r\n　　　　　＋んです\n\n\n\r\nな形容詞：元気な／元気じゃない／元気だった／元気じゃなかった　＋　んです\n\n\n\r\n名詞　：学生な／学生じゃない／学生だった／学生じゃなかった　＋　んです\n\n\n\r\nPlease refer the な形容詞 and 名詞 above."
    html: "gtunak85さん、you are quite right. actually there is no need to have a separate entry for なん。Here is the explanation:<br/>\r\n動詞：行く／行かない／行った／行かなかった<br/>\r\n　　　＋んです<br/>\n<br/>\r\nい形容詞：高い／高くない／高かった／高くなかった<br/>\r\n　　　　　＋んです<br/>\n<br/>\r\nな形容詞：元気な／元気じゃない／元気だった／元気じゃなかった　＋　んです<br/>\n<br/>\r\n名詞　：学生な／学生じゃない／学生だった／学生じゃなかった　＋　んです<br/>\n<br/>\r\nPlease refer the な形容詞 and 名詞 above.<br/>"
    source_id: null
    original_created_at: null
