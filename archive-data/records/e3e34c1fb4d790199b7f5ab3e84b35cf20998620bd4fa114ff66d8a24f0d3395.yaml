    japanese: 確かに違法じゃないんです。そんな簡単に儲からないし、絶対に破綻するシステムでありながら、一律に禁止できないから見逃されているんです。
    body_text: "確かに違法じゃないんです。そんな簡単に儲からないし、絶対に破綻するシステムでありながら、一律に禁止できないから見逃されているんです。 \n\n\t\tCertainly it isn't \n\t\t(that it's) \n\t\tillegal. But being a system that doesn't easily generate a profit, is sure to go bankrupt, in the same way it's not possible to ban so it's (that it's) overlooked."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ確かに違法じゃないんです。そんな簡単に儲からないし、絶対に破綻するシステムでありながら、一律に禁止できないから見逃されている\">\n\t\t\t\t確かに違法じゃない<strong>んです</strong>。そんな簡単に儲からないし、絶対に破綻するシステムでありながら、一律に禁止できないから見逃されている<strong>んです</strong>。</a> <br/>\n\t\tCertainly it isn't \n\t\t<strong>(that it's) </strong>\n\t\tillegal. But being a system that doesn't easily generate a profit, is sure to go bankrupt, in the same way it's not possible to ban so it's (that it's) overlooked."
