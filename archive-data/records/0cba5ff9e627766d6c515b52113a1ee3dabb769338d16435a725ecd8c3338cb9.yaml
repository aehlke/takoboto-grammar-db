  - source_id: 8691
    position: 7
    japanese: サメの写真を上手に撮ってきましたよ。ジョーズだけに。
    body_text: "サメの写真を上手に撮ってきましたよ。ジョーズだけに。 \n\n\t\tI took a great picture of a shark. \n\t\tSince \n\t\tit's a great white (Jaws) after all."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJサメの写真を上手に撮ってきましたよ。ジョーズだけに。\">\nサメの写真を上手に撮ってきましたよ。ジョーズ<strong>だけに</strong>。<strong></strong></a> <br/>\n\t\tI took a great picture of a shark. \n\t\t<strong>Since </strong>\n\t\tit's a great white (Jaws) after all."
