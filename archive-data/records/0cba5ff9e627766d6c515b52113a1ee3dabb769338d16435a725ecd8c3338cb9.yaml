    position: 0
    japanese: 苦難の途を歩んできただけにできたひとだ。
    body_text: "苦難の途を歩んできただけにできたひとだ。 \n\nAs might be expected \n\t\tof those who trod the path of hardships, he is a man of character."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ苦難の途を歩んできただけにできたひとだ。\">\n苦難の途を歩んできた<strong>だけに</strong>できたひとだ。<strong></strong></a> <br/>\n<strong>As might be expected </strong>\n\t\tof those who trod the path of hardships, he is a man of character."
    credits_raw: bamboo4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3094
    position: 1
    japanese: やっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。
    body_text: "やっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。 \n\nAs might be expected \n\t\tof a city like Tokyo, world-wide cuisine is available there."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJやっぱり東京だけに（だけあって）世界各地の食べ物が揃っている。\">\nやっぱり東京<strong>だけに（だけあって）</strong>世界各地の食べ物が揃っている。<strong></strong></a> <br/>\n<strong>As might be expected </strong>\n\t\tof a city like Tokyo, world-wide cuisine is available there."
    credits_raw: bamboo4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3918
    position: 2
    japanese: 火星は地球とよく似ているだけにひとしお興味をひく。
    body_text: "火星は地球とよく似ているだけにひとしお興味をひく。 \n\n\t\tMars is all the more interesting \n\t\tfor \n\t\tits close resemblance to our earth."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ火星は地球とよく似ているだけにひとしお興味をひく。\">\n\t\t\t\t火星は地球とよく似ている<strong>だけに</strong>ひとしお興味をひく。<strong></strong></a> <br/>\n\t\tMars is all the more interesting \n\t\t<strong>for </strong>\n\t\tits close resemblance to our earth."
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6175
    position: 3
    japanese: フランスで勉強しただけに、彼女のフランス語は発音がきれいだ。
    body_text: "フランスで勉強しただけに、彼女のフランス語は発音がきれいだ。 \n\nAs expected \n\t\tof someone who studied in France, her pronunciation of French is lovely."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJフランスで勉強しただけに、彼女のフランス語は発音がきれいだ。\">\n\t\t\t\tフランスで勉強した<strong>だけに</strong>、彼女のフランス語は発音がきれいだ。<strong></strong></a> <br/>\n<strong>As expected </strong>\n\t\tof someone who studied in France, her pronunciation of French is lovely."
    credits_raw: rubyhatchet
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6176
    position: 4
    japanese: 両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。
    body_text: "両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。 \n\n\t\t(Her) parents are living together in the countryside. \n\t\tSince \n\t\tthey are getting older, she is worrying about them."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ両親は、田舎で二人だけで暮らしている。年をとっているだけに、娘としては心配だ。\">\n\t\t\t\t両親は、田舎で二人だけで暮らしている。年をとっている<strong>だけに</strong>、娘としては心配だ。<strong></strong></a> <br/>\n\t\t(Her) parents are living together in the countryside. \n\t\t<strong>Since </strong>\n\t\tthey are getting older, she is worrying about them."
    credits_raw: rubyhatchet
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6541
    position: 5
    japanese: 一生懸命働いただけに、彼に促成をしました
    body_text: "一生懸命働いただけに、彼に促成をしました\r \n\n\t\tAs expected he performed well and got the promotion"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ一生懸命働いただけに、彼に促成をしました\">\n\t\t\t\t一生懸命働いた<strong>だけに</strong>、彼に促成をしました\r<strong></strong></a> <br/>\n\t\tAs expected he performed well and got the promotion \n\t\t<strong> </strong>"
