  - source_id: 8690
    position: 6
    japanese: トラもウマも私は怖いです。トラウマだけに
    body_text: "トラもウマも私は怖いです。トラウマだけに \n\n\t\tTigers and horses are scary to me. \n\t\tFor \n\t\tthey are traumatic indeed."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJトラもウマも私は怖いです。トラウマだけに\">\n\t\t\t\tトラもウマも私は怖いです。トラウマ<strong>だけに</strong><strong></strong></a> <br/>\n\t\tTigers and horses are scary to me. \n\t\t<strong>For </strong>\n\t\tthey are traumatic indeed."
    credits_raw: HADAA
