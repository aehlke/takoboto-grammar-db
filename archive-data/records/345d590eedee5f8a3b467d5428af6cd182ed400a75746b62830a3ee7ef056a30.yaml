  - position: 8
    credits_raw: mochabean
    text: "I've edited the translation and gone for 'non-attendance'. This term seems to be used a lot, at least here in the UK, when describing the problems of children who are 'serial truants' and essentially refusing to go at all, rather than simply skipping school for a day here and there (it's in the news a lot since it became law that the parents can be prosecuted and even sent to prison for failing to ensure their child attends school). 'Drop-out' to me suggests someone who is no longer enroled at the school as a result of non-attendance, which is perhaps a little different (?)\n\r\nIf anyone disagrees, feel free to edit!"
    html: "I've edited the translation and gone for 'non-attendance'. This term seems to be used a lot, at least here in the UK, when describing the problems of children who are 'serial truants' and essentially refusing to go at all, rather than simply skipping school for a day here and there (it's in the news a lot since it became law that the parents can be prosecuted and even sent to prison for failing to ensure their child attends school). 'Drop-out' to me suggests someone who is no longer enroled at the school as a result of non-attendance, which is perhaps a little different (?)<br/>\r\nIf anyone disagrees, feel free to edit!"
    source_id: null
