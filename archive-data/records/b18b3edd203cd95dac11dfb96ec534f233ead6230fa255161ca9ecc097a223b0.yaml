notes:
  - position: 0
    text: "[がてら]\n\r\nUsed to express getting one thing accomplished while doing a second thing. Perhaps a good English equivalent would be \"to kill two birds with one stone.\""
    html: "<b>[がてら]</b><br/>\r\nUsed to express getting one thing accomplished while doing a second thing. Perhaps a good English equivalent would be \"to kill two birds with one stone.\""
