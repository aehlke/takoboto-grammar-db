    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "gatera can be reaplced with tsuideniついでに or wokanete を兼ねて.\n\r\n○散歩ついでに、本屋に寄った。\n\r\n○散歩を兼ねて、本屋に寄った。\n\r\nｘ散歩をしながら、本屋に寄った。This is not natural.\n\r\nI think that がてら is used to show another action （本屋に寄る） taken place in the middle of one main action （散歩をする）,  散歩→本屋→散歩\n\r\nWhile ながら、two or more actions are at the same time. \n\r\neg. 友だちと喋りながら歩く。 I walk as talking with a friend.　歩く=喋る"
    html: "gatera can be reaplced with <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsuideni\">tsuideni</a></b>ついでに or wo<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kanete\">kanete</a></b> を兼ねて.<br/>\r\n○散歩ついでに、本屋に寄った。<br/>\r\n○散歩を兼ねて、本屋に寄った。<br/>\r\nｘ散歩をしながら、本屋に寄った。This is not natural.<br/>\r\nI think that がてら is used to show another action （本屋に寄る） taken place in the middle of one main action （散歩をする）,  散歩→本屋→散歩<br/>\r\nWhile ながら、two or more actions are at the same time. <br/>\r\neg. 友だちと喋りながら歩く。 I walk as talking with a friend.　歩く=喋る"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: "You can also use かたがた.\n\r\n散歩かたがた公園に行った."
    html: "You can also use かたがた.<br/>\r\n散歩かたがた公園に行った."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: dc
    text: "got it. so its not a verb ending like 〜ながら。\n\r\nIt means more like \"on the occasion of\" or \"while doing A, also did B\" than \"during or while\" ... ie slightly separated incidents.\n\n\n\r\nIs it a very formal/written phrase?"
    html: "got it. so its not a verb ending like 〜ながら。<br/>\r\nIt means more like \"on the occasion of\" or \"while doing A, also did B\" than \"during or while\" ... ie slightly separated incidents.<br/>\n<br/>\r\nIs it a very formal/written phrase?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: "Right on, dc.\n\n\n\r\nついでに is conversational, がてら,かねて and かたがた are predominantly used in writing."
    html: "Right on, dc.<br/>\n<br/>\r\nついでに is conversational, がてら,かねて and かたがた are predominantly used in writing."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: blabby
    text: "My book says that this is not used for a \"big\" event.  It is used for something small or something that can be finished soon.\n\r\n旅行がてら = NO\n\r\n散歩がてら = OK"
    html: "My book says that this is not used for a \"big\" event.  It is used for something small or something that can be finished soon.<br/>\r\n旅行がてら = NO<br/>\r\n散歩がてら = OK"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: bamboo4
    text: "No, that is not correct.がてら can be used in any situation where you say \"while doing X, I also did Y.\"\n\n\n\r\nThere is such limitation as Blabby refers to. \n\n\n\r\nIt is perfectly correct to say 中国旅行がてらタイにも足を伸ばした。Or 花子と話がてら、夏子にも挨拶した。\n\n\n\r\nI dn't know what your book is, but if that's what it says,it is not correct."
    html: "No, that is not correct.がてら can be used in any situation where you say \"while doing X, I also did Y.\"<br/>\n<br/>\r\nThere is such limitation as Blabby refers to. <br/>\n<br/>\r\nIt is perfectly correct to say 中国旅行がてらタイにも足を伸ばした。Or 花子と話がてら、夏子にも挨拶した。<br/>\n<br/>\r\nI dn't know what your book is, but if that's what it says,it is not correct.<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: blabby
    text: "The book I am using is 実力アップ！日本語能力試験一級文法編 by Unicom. The explanations are in Japanese so Ill quote from the book.\n\n\n\r\n〜がてら　ー　(〜をするときに)\n\r\nたいへんなことや大きいことではなく、小さいことやすぐに終わること。\n\r\n×旅行がてら　　○散歩がてる\n\n\n\r\nMaybe this books explanations are not as good as I thought..."
    html: "The book I am using is 実力アップ！日本語能力試験一級文法編 by Unicom. The explanations are in Japanese so Ill quote from the book.<br/>\n<br/>\r\n〜がてら　ー　(〜をするときに)<br/>\r\nたいへんなことや大きいことではなく、小さいことやすぐに終わること。<br/>\r\n×旅行がてら　　○散歩がてる<br/>\n<br/>\r\nMaybe this books explanations are not as good as I thought..."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: amenya
    text: "I think that \"gatera\" is most like \"tsuideni\". It means \"on the occasion of\". \n\r\nTo Mikisan: Vる/N の+ ついでに\n\r\n--> 散歩のついでに...."
    html: "I think that \"gatera\" is most like \"tsuideni\". It means \"on the occasion of\". <br/>\r\nTo Mikisan: Vる/N の+ ついでに<br/>\r\n--&gt; 散歩のついでに....<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 9
    credits_raw: Iso
    text: "がてら has two meanings. \n\r\n1.verb + がてら + A\n\r\n  In this case, がてら is used to show another action(A) taken place in the middle of one main action. This can be replaced with ついでに, but not with 兼ねて.\n\n\n\r\n2. noun(A) + がてら + B\n\r\n In this case, it can be replaced with ついでに or 兼ねて. But be carefull, there's a subtle difference between the two. \n\r\nついでに = doing B while doing A\n\r\n兼ねて = doing B with the intention of doing A"
    html: "がてら has two meanings. <br/>\r\n1.verb + がてら + A<br/>\r\n  In this case, がてら is used to show another action(A) taken place in the middle of one main action. This can be replaced with ついでに, but not with 兼ねて.<br/>\n<br/>\r\n2. noun(A) + がてら + B<br/>\r\n In this case, it can be replaced with ついでに or 兼ねて. But be carefull, there's a subtle difference between the two. <br/>\r\nついでに = doing B while doing A<br/>\r\n兼ねて = doing B with the intention of doing A"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: mc
    text: "In the book くらべてわかる中級日本語阜ｻ文型ドリル, they talk about the fact that it depends on the location where the 2 actions take place.\n\r\nThe 2 actions take place in same or different location -> AついでにB\n\r\nThe 2 actions take place in different location -> AがてらB(unless the main action implies a movement or displacement 〜しに行く)\n\r\nAlso the 2nd meaning of AがてらB could be \"doing B will help to do A\" and also only ついでに can be used at the beginning of a sentence.\n\r\nBut the two expressions can mean \"killing 2 birds with one stone\".\n\n\n\r\nIn fact, after reading many exemple sentences, I think that the difference between がてら and ついでに\n\r\ndoesn't lie in the meaning (beside the 2nd meaning of がてら).\n\r\nMost of the time they mean the same. What makes me choose one over the other is how I construct the sentence, which words I use and how the whole sentence sounds.\n\r\nIn the end, I believe one shouldn't try too hard to build a rule to differentiate them.\n\r\nIf a rule is not obvious enough or contains too much exceptions, then it shouldn't be used as a rule in the first place.\n\r\nI think it's one of those cases where you have 2 ways for saying the same thing, which is great so when you talk, you don't sound all the same."
    html: "In the book くらべてわかる中級日本語阜ｻ文型ドリル, they talk about the fact that it depends on the location where the 2 actions take place.<br/>\r\nThe 2 actions take place in same or different location -&gt; AついでにB<br/>\r\nThe 2 actions take place in different location -&gt; AがてらB(unless the main action implies a movement or displacement 〜しに行く)<br/>\r\nAlso the 2nd meaning of AがてらB could be \"doing B will help to do A\" and also only ついでに can be used at the beginning of a sentence.<br/>\r\nBut the two expressions can mean \"killing 2 birds with one stone\".<br/>\n<br/>\r\nIn fact, after reading many exemple sentences, I think that the difference between がてら and ついでに<br/>\r\ndoesn't lie in the meaning (beside the 2nd meaning of がてら).<br/>\r\nMost of the time they mean the same. What makes me choose one over the other is how I construct the sentence, which words I use and how the whole sentence sounds.<br/>\r\nIn the end, I believe one shouldn't try too hard to build a rule to differentiate them.<br/>\r\nIf a rule is not obvious enough or contains too much exceptions, then it shouldn't be used as a rule in the first place.<br/>\r\nI think it's one of those cases where you have 2 ways for saying the same thing, which is great so when you talk, you don't sound all the same."
