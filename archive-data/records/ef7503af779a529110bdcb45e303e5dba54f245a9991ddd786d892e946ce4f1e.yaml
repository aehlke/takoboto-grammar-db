examples:
  - source_id: 544
    position: 0
    japanese: 学歴、経験は問わず、やる気のある社員を募集します。
    body_text: "学歴、経験は問わず、やる気のある社員を募集します。 \n\n\t\tWe are recruting employees who have the get up and go \n\t\tregardless of \n\t\tacademic background and experience."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ学歴、経験は問わず、やる気のある社員を募集します。\">\n学歴、経験<strong>は問わず、</strong>やる気のある社員を募集します。<strong></strong></a> <br/>\n\t\tWe are recruting employees who have the get up and go \n\t\t<strong>regardless of </strong>\n\t\tacademic background and experience."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 896
    position: 1
    japanese: 私が書いたかを問わず、(全て）「作者：あまつか」です。
    body_text: "私が書いたかを問わず、(全て）「作者：あまつか」です。 \n\n\t\tIt's (always) [Author : Amatuka] \n\t\twhether \n\t\tI wrote it or not."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私が書いたかを問わず、(全て）「作者：あまつか」です。\">\n\t\t\t\t私が書いたか<strong>を問わず</strong>、(全て）「作者：あまつか」です。<strong></strong></a> <br/>\n\t\tIt's (always) [Author : Amatuka] \n\t\t<strong>whether </strong>\n\t\tI wrote it or not."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3082
    position: 2
    japanese: 著作権表示があると否とを問わず真実の作者は法律上当然著作権者になります。
    body_text: "著作権表示があると否とを問わず真実の作者は法律上当然著作権者になります。 \n\nWhether or not \n\t\tany copyright indication is made, the true author by operation of law becomes the copyright owner."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ著作権表示があると否とを問わず真実の作者は法律上当然著作権者になります。\">\n著作権表示があると否とを<strong>問わず</strong>真実の作者は法律上当然著作権者になります。<strong></strong></a> <br/>\n<strong>Whether or not </strong>\n\t\tany copyright indication is made, the true author by operation of law becomes the copyright owner."
    credits_raw: bamboo4
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4344
    position: 3
    japanese: その試合には国籍のいかんを問わず誰でも参加できる。
    body_text: "その試合には国籍のいかんを問わず誰でも参加できる。 \n\n\t\tAnyone can participate in the game, no matter what nationality they are."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその試合には国籍のいかんを問わず誰でも参加できる。\">\n\t\t\t\tその試合には国籍のいかんを<strong>問わず</strong>誰でも参加できる。<strong></strong></a> <br/>\n\t\tAnyone can participate in the game, no matter what nationality they are. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4345
    position: 4
    japanese: 試合は晴雨を問わず行われます。
    body_text: "試合は晴雨を問わず行われます。 \n\n\t\tThe game will be held rain or shine."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ試合は晴雨を問わず行われます。\">\n\t\t\t\t試合は晴雨を<strong>問わず</strong>行われます。<strong></strong></a> <br/>\n\t\tThe game will be held rain or shine. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4346
    position: 5
    japanese: 年齢を問わず人々はこの歌が好きだ。
    body_text: "年齢を問わず人々はこの歌が好きだ。 \n\n\t\tPeople of the ages like this song."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ年齢を問わず人々はこの歌が好きだ。\">\n年齢を<strong>問わず</strong>人々はこの歌が好きだ。<strong></strong></a> <br/>\n\t\tPeople of the ages like this song. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4347
    position: 6
    japanese: 肌の色のいかんを問わず、彼は万人の言論の自由を擁護した。
    body_text: "肌の色のいかんを問わず、彼は万人の言論の自由を擁護した。 \n\n\t\tHe stood for freedom of speech for everyone regardless of color."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ肌の色のいかんを問わず、彼は万人の言論の自由を擁護した。\">\n\t\t\t\t肌の色のいかんを<strong>問わず、</strong>彼は万人の言論の自由を擁護した。<strong></strong></a> <br/>\n\t\tHe stood for freedom of speech for everyone regardless of color. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4348
    position: 7
    japanese: 老いも若きも、また男女を問わず、地元の浴場で一緒になることを楽しみにしていた。
    body_text: "老いも若きも、また男女を問わず、地元の浴場で一緒になることを楽しみにしていた。 \n\n\t\tBoth young and old, men and women, regularly get together at the local bathhouses."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ老いも若きも、また男女を問わず、地元の浴場で一緒になることを楽しみにしていた。\">\n\t\t\t\t老いも若きも、また男女を<strong>問わず、</strong>地元の浴場で一緒になることを楽しみにしていた。<strong></strong></a> <br/>\n\t\tBoth young and old, men and women, regularly get together at the local bathhouses. \n\t\t<strong> </strong>"
    credits_raw: Miki
