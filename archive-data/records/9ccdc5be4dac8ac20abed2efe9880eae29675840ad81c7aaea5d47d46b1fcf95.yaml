    text: "This is usually used in the patterns:\n\n\n\r\n(a) does not neccesarily mean (b)\n\n\n\r\n(big) kanarazushimo (strong) tohakagiranai\n\r\n(big) kanarazushimo (strong) to iu wake de ha nai\n\r\n(big) kanarazushimo (strong) bakari de ha nai\n\n\n\r\n(big) does not neccesarily mean (strong)"
    html: "This is usually used in the patterns:<br/>\n<br/>\r\n(a) does not neccesarily mean (b)<br/>\n<br/>\r\n(big) kanarazushimo (strong) <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tohakagiranai\">tohakagiranai</a></b><br/>\r\n(big) kanarazushimo (strong) to iu <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wake\">wake</a></b> de ha nai<br/>\r\n(big) kanarazushimo (strong) <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=bakari\">bakari</a></b> de ha nai<br/>\n<br/>\r\n(big) does not neccesarily mean (strong)"
