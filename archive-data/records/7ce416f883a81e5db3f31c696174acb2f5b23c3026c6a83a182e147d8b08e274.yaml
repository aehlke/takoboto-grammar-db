title_raw: と いいですね　/　いいんですが [と いいですね　/　いいんですが] ((short present) + to (ii desu ne / iin desu ga))
title: と いいですね　/　いいんですが
reading: と いいですね　/　いいんですが
romanized_label: (short present) + to (ii desu ne / iin desu ga)
category: grammar
jlpt_level_original: '0'
meaning: |-
  you can use the present tense short form + (to ii desu ne) to hope something good happens for others. If you hope for your own good, use (to iin desu ga). if the action is under your control, you should first change the verb to potential form.
meaning_example: ii arubaito ga aru to ii desu ne / shiken ga yasashii to ii n desu ga / daigaku ni ikeru to ii n desu ga
