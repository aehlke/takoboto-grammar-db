    credits_raw: Miki
    text: |-
      #5703 I would write 無視しろっ！ to emphasize. Though this is not CORRECT Japanese writing. Also, it is not appreciated that female speaks like this. I feel 無視して! is more sophisticated.
    html: |-
      <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=tsudsukeru#5703">#5703</a></b> I would write 無視しろっ！ to emphasize. Though this is not CORRECT Japanese writing. Also, it is not appreciated that female speaks like this. I feel 無視して! is more sophisticated.
