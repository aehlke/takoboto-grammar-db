notes:
  - position: 0
    text: "Informal clause + とは限らない/とも限らない\n\n\n\r\nWith 〜とは限らない、what comes before is not 100% guaranteed.\n\n\n\r\nWith 〜ないとも限らない what comes before it is not unlikely to happen (i.e. there is a possibility).\n\n\n\r\nは or も? - も is for emphasis."
    html: "Informal clause + とは限らない/とも限らない<br/>\n<br/>\r\nWith 〜とは限らない、what comes before is not 100% guaranteed.<br/>\n<br/>\r\nWith 〜ないとも限らない what comes before it is not unlikely to happen (i.e. there is a possibility).<br/>\n<br/>\r\nは or も? - も is for emphasis."
