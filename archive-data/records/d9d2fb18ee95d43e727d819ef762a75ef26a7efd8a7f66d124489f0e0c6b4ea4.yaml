notes:
  - position: 0
    text: "kudasai is an auxiliary verb which indicates a polite request: \"please do\"\n\n\n\r\n1) kudasai is a polite imperative form of kudasaru, the honorofic version of kureru 'give'(me) and is used as an auxiliary verb with the te-form of verbs.\n\r\n　ゆっくり飲んでください。\n\r\n　please drink slowly/at your own pace\n\n\n\r\n2) The negtative question form kudasaimasenka makes a request more polite　\n\r\n　あした８時に来てくださいませんか。\n\r\n　Won't you come tomorrow at 8 O'Clock?\n\n\n\r\n3) douzo emphasizes the speakers request and makes it more polite.\n\r\n　どうぞたくさん食べてください。\n\r\n　Go ahead please, and eat as much as you like\n\n\n\r\n4) In very informal speech, kudasai may drop(this form of request is often used by female speakers)\n\r\n　はやく言って。\n\r\n　go on say it (please)\n\n\n\r\n　まだ帰らないで。\n\r\n　dont come back yet (please)\n\n\n\r\n5) kure, the imperative form of kureru, can also be used in place of kudasai in informal male speech.[Vte/Vneg nai de] kure is the least polite request form.\n\r\n　いっしょに来てくれ。\n\r\n　can you come together (for me?)\n\r\n  (=can you let me go with you?)\n\n\n\r\n　うちへ帰らないでくれ。\n\r\n　don't come back to our place (OK?)"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kudasai\">kudasai</a></b> is an auxiliary verb which indicates a polite request: \"please do\"<br/>\n<br/>\r\n1) kudasai is a polite imperative form of <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kudasaru\">kudasaru</a></b>, the honorofic version of <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kureru\">kureru</a></b> 'give'(me) and is used as an auxiliary verb with the te-form of verbs.<br/>\r\n　ゆっくり飲んでください。<br/>\r\n　please drink slowly/at your own pace<br/>\n<br/>\r\n2) The negtative question form <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kudasaimasenka\">kudasaimasenka</a></b> makes a request more polite　<br/>\r\n　あした８時に来てくださいませんか。<br/>\r\n　Won't you come tomorrow at 8 O'Clock?<br/>\n<br/>\r\n3) <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=douzo\">douzo</a></b> emphasizes the speakers request and makes it more polite.<br/>\r\n　どうぞたくさん食べてください。<br/>\r\n　Go ahead please, and eat as much as you like<br/>\n<br/>\r\n4) In very informal speech, kudasai may drop(this form of request is often used by female speakers)<br/>\r\n　はやく言って。<br/>\r\n　go on say it (please)<br/>\n<br/>\r\n　まだ帰らないで。<br/>\r\n　dont come back yet (please)<br/>\n<br/>\r\n5) <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kure\">kure</a></b>, the imperative form of kureru, can also be used in place of kudasai in informal male speech.[Vte/Vneg nai de] kure is the least polite request form.<br/>\r\n　いっしょに来てくれ。<br/>\r\n　can you come together (for me?)<br/>\r\n  (=can you let me go with you?)<br/>\n<br/>\r\n　うちへ帰らないでくれ。<br/>\r\n　don't come back to our place (OK?)"
