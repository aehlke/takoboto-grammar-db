  - position: 13
    credits_raw: KyleGoetz
    text: "I went through the examples and replaced 下 with くだ. Japanese manuals of style say to use the kanji with NOUNを下さい, contrasted with the TE-form VERBてください, in which you do not use the kanji.\n\n\n\r\nIt's not technically incorrect, but it's preferred, similar to how in English spelling out zero through ten is preferred, but using numbers for values greater than ten is preferred."
