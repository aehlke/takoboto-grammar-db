  - position: 12
    credits_raw: Radish
    text: "Yes, muki's broadest meaning applies to describing an inherent characteristic of something. This grammar entry does a bit of a poor job in elucidating that.\n\n\n\r\nSo, sometimes muki translates into \"is (inherently) suitable for\". \n\n\n\r\nIn your example, about summer. The comment is based on an observation of the architecture.Maybe the walls of the cottage are thin. Maybe there is no fireplace, or even electricity, etc.\n\n\n\r\nI could also say:\n\n\n\r\n彼女はアニメの声優向きの声をしている。\n\r\nShe has a voice that's meant for (voice) acting.\n\n\n\r\nIn other words, that quality of being meant for voice acting, is inherent the timbre or w/e of her voice."
    html: "Yes, muki's broadest meaning applies to describing an inherent characteristic of something. This grammar entry does a bit of a poor job in elucidating that.<br/>\n<br/>\r\nSo, sometimes muki translates into \"is (inherently) suitable for\". <br/>\n<br/>\r\nIn your example, about summer. The comment is based on an observation of the architecture.Maybe the walls of the cottage are thin. Maybe there is no fireplace, or even electricity, etc.<br/>\n<br/>\r\nI could also say:<br/>\n<br/>\r\n彼女はアニメの声優向きの声をしている。<br/>\r\nShe has a voice that's meant for (voice) acting.<br/>\n<br/>\r\nIn other words, that quality of being meant for voice acting, is inherent the timbre or w/e of her voice."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 13
    credits_raw: Radish
    text: "It is not entirely accurate, but let me share my way of thinking about muke vs muki. \n\n\n\r\nMuke describes the \"intent\" of something. \n\n\n\r\nSo, \"X is made for kids.\" --- but that does not necessarily mean kids will like it.It is someone's intent or belief that this is true.　And maybe it is true, but that is not what is being stressed.\n\n\n\r\nmuki's, \"X is made for kids.\" means that \"It is obvious that this item contains qualities that kids would enjoy.\" It is not about anyone's belief or intent.\n\n\n\r\nKind of like taking the transitive vs intransitive aspects of a verb."
    html: "It is not entirely accurate, but let me share my way of thinking about muke vs muki. <br/>\n<br/>\r\nMuke describes the \"intent\" of something. <br/>\n<br/>\r\nSo, \"X is made for kids.\" --- but that does not necessarily mean kids will like it.It is someone's intent or belief that this is true.　And maybe it is true, but that is not what is being stressed.<br/>\n<br/>\r\nmuki's, \"X is made for kids.\" means that \"It is obvious that this item contains qualities that kids would enjoy.\" It is not about anyone's belief or intent.<br/>\n<br/>\r\nKind of like taking the transitive vs intransitive aspects of a verb."
    source_id: null
    original_created_at: null
