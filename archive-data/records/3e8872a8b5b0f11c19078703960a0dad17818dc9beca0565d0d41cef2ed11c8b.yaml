    original_updated_at: null
  - position: 5
    credits_raw: bamboo4
    text: "もがな dates bqck to the Heian era, and it means that what precedes もがな would be the desire of the speaker. It is an archaic Japanese which only finds its use in some set expressions, such as 言わずもがな,which literally would mean \"I desire that I do not say that\" that would include the case of my regret for having said what I said.\n\r\nMy 広辞苑 shows the following:\n\r\nあらずもがな、言わずもがな、無くもがな、やらずもがな and 由もがな.\n\r\nWhile 買わずもがな is grammatically correct, I am not sure if it is actually used.\n\r\nIn any event, except perhaps 言わずもがな, all other instances of the use of もがな are pretty archaic."
    html: "もがな dates bqck to the Heian era, and it means that what precedes もがな would be the desire of the speaker. It is an archaic Japanese which only finds its use in some set expressions, such as 言わずもがな,which literally would mean \"I desire that I do not say that\" that would include the case of my regret for having said what I said.<br/>\r\nMy 広辞苑 shows the following:<br/>\r\nあらずもがな、言わずもがな、無くもがな、やらずもがな and 由もがな.<br/>\r\nWhile 買わずもがな is grammatically correct, I am not sure if it is actually used.<br/>\r\nIn any event, except perhaps 言わずもがな, all other instances of the use of もがな are pretty archaic.<br/>\n<br/>\n<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: kanoko
    text: "なくもがな 【無くもがな】 \n\n\n\r\n（連語）\n\n\n\r\nないほうがよい。あらずもがな。\n\r\n「あの一言は≠ｾった」「≠ﾌ差しで口」"
    html: "なくもがな 【無くもがな】 <br/>\n<br/>\r\n（連語）<br/>\n<br/>\r\nないほうがよい。あらずもがな。<br/>\r\n「あの一言は≠ｾった」「≠ﾌ差しで口」"
    source_id: null
