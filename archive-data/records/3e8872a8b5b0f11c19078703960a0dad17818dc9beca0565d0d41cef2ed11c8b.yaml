  - position: 4
    credits_raw: Amatuka
    text: "Formed by V-nai base + ずもがな\n\r\ne.g. 買う→買わない→買わずもがな\n\n\n\r\nVn = V-nai base"
    html: "Formed by V-nai base + ずもがな<br/>\r\ne.g. 買う→買わない→買わずもがな<br/>\n<br/>\r\nVn = V-nai base"
    source_id: null
