    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ新しい電気製品なんて、買わずもがなで、買うとろくなものがない。\">\n\t\t\t\t新しい電気製品なんて、買わ<strong>ずもがな</strong>で、買うとろくなものがない。<strong></strong></a> <br/>\n\t\tYou \n\t\t<strong>might as well not </strong>\n\t\tbuy those new electronic gadgets. If you do then nothing good will come of it."
