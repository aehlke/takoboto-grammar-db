    japanese: サッカーで日本が勝って、韓国人の金さんがどんな気持ちかなんて、そんなこと、言わずもがなのことだよ。
    body_text: "サッカーで日本が勝って、韓国人の金さんがどんな気持ちかなんて、そんなこと、言わずもがなのことだよ。 \n\n\t\tWhen Japan wins at football (soccer), \n\t\tyou don't even need to \n\t\task to know how the Korean Mr. Kim feels."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJサッカーで日本が勝って、韓国人の金さんがどんな気持ちかなんて、そんなこと、言わずもがなのことだよ。\">\n\t\t\t\tサッカーで日本が勝って、韓国人の金さんがどんな気持ちかなんて、そんなこと、言わ<strong>ずもがな</strong>のことだよ。<strong></strong></a> <br/>\n\t\tWhen Japan wins at football (soccer), \n\t\t<strong>you don't even need to </strong>\n\t\task to know how the Korean Mr. Kim feels."
