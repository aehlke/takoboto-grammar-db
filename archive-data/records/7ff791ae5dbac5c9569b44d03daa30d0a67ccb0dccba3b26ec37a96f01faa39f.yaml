notes:
  - position: 0
    text: "とも‐かく\n\r\n    ［副］\n\r\n    １ とにかく。ともかくも。\n\r\n    　「うまくいくかどうか、≠竄ﾁてみよう」\n\n\n\r\n    ２ （「…はともかく」の形で）…は別として。…はさておき。\n\r\n    　「交通の便は＝A閑静でいい」\n\n\n\r\n    ◆「兎も角」とも当てて書く。"
    html: "とも‐かく<br/>\r\n    ［副］<br/>\r\n    １ とにかく。ともかくも。<br/>\r\n    　「うまくいくかどうか、≠竄ﾁてみよう」<br/>\n<br/>\r\n    ２ （「…はともかく」の形で）…は別として。…はさておき。<br/>\r\n    　「交通の便は＝A閑静でいい」<br/>\n<br/>\r\n    ◆「兎も角」とも当てて書く。"
    credits_raw: sureshnihon
