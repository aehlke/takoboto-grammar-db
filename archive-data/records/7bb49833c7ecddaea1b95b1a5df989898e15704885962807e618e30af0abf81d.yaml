    japanese: 卒業に際して、私たちは感謝の印として彼に置き時計を贈りました。
    body_text: "卒業に際して、私たちは感謝の印として彼に置き時計を贈りました。 \n\nUpon \n\t\tleaving school, we presented him with a table clock as a token of our thanks."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ卒業に際して、私たちは感謝の印として彼に置き時計を贈りました。\">\n卒業<strong>に際して</strong>、私たちは感謝の印として彼に置き時計を贈りました。<strong></strong></a> <br/>\n<strong>Upon </strong>\n\t\tleaving school, we presented him with a table clock as a token of our thanks."
