  - source_id: 6348
    position: 3
    japanese: 卒業式に際して、市長からお祝いの言葉が卒業生に送られた。
    body_text: "卒業式に際して、市長からお祝いの言葉が卒業生に送られた。\r \n\n\t\tUpon their graduation, the mayor sent his congratulatory words to the graduates."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ卒業式に際して、市長からお祝いの言葉が卒業生に送られた。\">\n\t\t\t\t卒業式<strong>に際して</strong>、市長からお祝いの言葉が卒業生に送られた。\r<strong></strong></a> <br/>\n\t\tUpon their graduation, the mayor sent his congratulatory words to the graduates. \n\t\t<strong> </strong>"
