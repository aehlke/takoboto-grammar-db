  - position: 4
    credits_raw: bamboo4
    text: |-
      まいか or ないか is normally used by a senior person to address his junior. It is not a honorrific.頂けませんか would be the polite form.頂けないものか would be the mordern version of まいか.
    html: |-
      まいか or ないか is normally used by a senior person to address his junior. It is not a honorrific.頂けませんか would be the polite form.頂けないものか would be the mordern version of まいか.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Yuri
    text: "I was taught that this まいか form is also used to express some confusion : whether...or not -- don't know yet. \n\r\n...行こうか行くまいか考えている。\n\r\n..still considering whether going or not."
