  - position: 3
    credits_raw: Miki
    text: "Did you pick up the translation from Google? Searched by よろしく相談。The sentence is from a letter written in 1916. The Japanese is old.\n\r\n…、この話を先生に相談していただけませんか？or 相談していただけないものか？ would be modern expression."
