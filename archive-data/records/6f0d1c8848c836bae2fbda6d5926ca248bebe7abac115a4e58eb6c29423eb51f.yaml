    body_text: "君のおかげで、お金を全部使ってしまい歩いて帰宅せねばならなかった。\r \n\n\t\tThanks to you, I spent all my money and had to walk home."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ君のおかげで、お金を全部使ってしまい歩いて帰宅せねばならなかった。\">\n\t\t\t\t君の<strong>おかげで</strong>、お金を全部使ってしまい歩いて帰宅せねばならなかった。\r<strong></strong></a> <br/>\n\t\tThanks to you, I spent all my money and had to walk home. \n\t\t<strong> </strong>"
