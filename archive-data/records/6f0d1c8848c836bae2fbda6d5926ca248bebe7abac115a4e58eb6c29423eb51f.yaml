  - source_id: 300
    position: 0
    japanese: そんな中、ホストファミリーが陽気に話しかけ、あちらこちらへ連れ出してくれたお蔭で、徐々に英語にも慣れ理解できるようになっていきました。
    body_text: "そんな中、ホストファミリーが陽気に話しかけ、あちらこちらへ連れ出してくれたお蔭で、徐々に英語にも慣れ理解できるようになっていきました。 \n\n\t\tAmong which, \n\t\tthanks to \n\t\tthe host family cheerfully chatting with me,  taking me hither and thither I gradually accustomed to and able to understand English."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJそんな中、ホストファミリーが陽気に話しかけ、あちらこちらへ連れ出してくれたお蔭で、徐々に英語にも慣れ理解できるようになっていきました。\">\n\t\t\t\tそんな中、ホストファミリーが陽気に話しかけ、あちらこちらへ連れ出してくれた<strong>お蔭で</strong>、徐々に英語にも慣れ理解できるようになっていきました。<strong></strong></a> <br/>\n\t\tAmong which, \n\t\t<strong>thanks to </strong>\n\t\tthe host family cheerfully chatting with me,  taking me hither and thither I gradually accustomed to and able to understand English."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
