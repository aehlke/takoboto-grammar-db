    japanese: 私が成功したのはあなたのおかげです。
    body_text: "私が成功したのはあなたのおかげです。\r \n\n\t\tI owe my success to you."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私が成功したのはあなたのおかげです。\">\n\t\t\t\t私が成功したのはあなたの<strong>おかげで</strong>す。\r<strong></strong></a> <br/>\n\t\tI owe my success to you. \n\t\t<strong> </strong>"
