    credits_raw: tigert
    text: "I have heard it used in negative situations as well, although this site is for JLPT preperation. the ultimate goal should be to learn Japanese. \n\n\n\r\nClassroom Japanese is far from the real thing. keep that in mind while you study and you might improve faster than you had expected."
