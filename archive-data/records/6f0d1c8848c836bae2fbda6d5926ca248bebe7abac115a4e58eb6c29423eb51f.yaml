    body_text: "私は彼の援助のおかげで成功した。\r \n\n\t\tI had succeed through his help."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私は彼の援助のおかげで成功した。\">\n\t\t\t\t私は彼の援助の<strong>おかげで</strong>成功した。\r<strong></strong></a> <br/>\n\t\tI had succeed through his help. \n\t\t<strong> </strong>"
