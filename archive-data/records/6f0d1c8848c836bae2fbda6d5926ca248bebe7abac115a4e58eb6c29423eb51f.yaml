  - position: 3
    credits_raw: PaulO
    text: "Hang on bamboo4,\n\n\n\r\nIn all of the textbooks I've read, お陰で can only be used to indicate a positive outcome in JLPT2. It may be used in other contexts (maybe to express irony in colloquial Japanese) but for JLPT2, I don't think your example is valid.\n\n\n\r\nI think you mean 〜のせいで."
    html: "Hang on bamboo4,<br/>\n<br/>\r\nIn all of the textbooks I've read, お陰で can only be used to indicate a positive outcome in JLPT2. It may be used in other contexts (maybe to express irony in colloquial Japanese) but for JLPT2, I don't think your example is valid.<br/>\n<br/>\r\nI think you mean 〜のせいで."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: "On the contrary, お陰で can be used in a negative sense in many situations, e.g., お前さんのお陰で大変な損をしたよ.\n\n\n\r\nI don't personally care a hoot about JLPT or whatever - when you have to learn, you have to learn."
    html: "On the contrary, お陰で can be used in a negative sense in many situations, e.g., お前さんのお陰で大変な損をしたよ.<br/>\n<br/>\r\nI don't personally care a hoot about JLPT or whatever - when you have to learn, you have to learn.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: tanuki86
    text: "PaulO is correct. おかげで is used in positive connotations, such as \"thanks to...\".\n\n\n\r\nWhile せいで is used in negative connotations, usually to express blame, such as \"because of...\".\n\n\n\r\nAnd I agree that these examples should be groomed according to grammar level. However, exceptions can be noted if the context/situation is properly explained."
    html: "PaulO is correct. おかげで is used in positive connotations, such as \"thanks to...\".<br/>\n<br/>\r\nWhile せいで is used in negative connotations, usually to express blame, such as \"because of...\".<br/>\n<br/>\r\nAnd I agree that these examples should be groomed according to grammar level. However, exceptions can be noted if the context/situation is properly explained."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: laki-laura
    text: 普通はよい結果になる場合に使うが、皮肉な表現として、悪い結果になる場合にも使うことがある。 This is written in my JLPT2 book, so bamboo4 is right.
    html: |-
      普通はよい結果になる場合に使うが、皮肉な表現として、悪い結果になる場合にも使うことがある。 This is written in my JLPT2 book, so bamboo4 is right.<br/>
    source_id: null
