    japanese: "両親の\r\nお陰で、私はアルバイトをしないで勉強することができる。"
    body_text: "両親の\r\nお陰で、私はアルバイトをしないで勉強することができる。 \n\nThanks to \n\t\tmy parents, I can study without working."
