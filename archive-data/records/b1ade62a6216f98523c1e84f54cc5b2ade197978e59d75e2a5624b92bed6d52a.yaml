    japanese: わたしにしたらアメリカの冷たいビールよりイギリス生ぬるいビールがおいしい。
    body_text: "わたしにしたらアメリカの冷たいビールよりイギリス生ぬるいビールがおいしい。 \n\nFor me \n\t\twarm English ale is more delicious than cold American beer."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJわたしにしたらアメリカの冷たいビールよりイギリス生ぬるいビールがおいしい。\">\n\t\t\t\tわたし<strong>にしたら</strong>アメリカの冷たいビールよりイギリス生ぬるいビールがおいしい。<strong></strong></a> <br/>\n<strong>For me </strong>\n\t\twarm English ale is more delicious than cold American beer."
