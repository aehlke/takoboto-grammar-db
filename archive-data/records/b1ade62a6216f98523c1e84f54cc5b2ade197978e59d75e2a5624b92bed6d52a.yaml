  - source_id: 6352
    position: 2
    japanese: 経営者にしたらボーナスは安いほうがいいが、社員の身にしたら1000円でも高いほうがいい。
    body_text: "経営者にしたらボーナスは安いほうがいいが、社員の身にしたら1000円でも高いほうがいい。\r \n\n\t\tFrom the manager's point of view, a smaller bonus would be better, but from the employee's point of view, even 1000 more yen would be better."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ経営者にしたらボーナスは安いほうがいいが、社員の身にしたら1000円でも高いほうがいい。\">\n\t\t\t\t経営者<strong>にしたら</strong>ボーナスは安いほうがいいが、社員の身にしたら1000円でも高いほうがいい。\r<strong></strong></a> <br/>\n\t\tFrom the manager's point of view, a smaller bonus would be better, but from the employee's point of view, even 1000 more yen would be better. \n\t\t<strong> </strong>"
