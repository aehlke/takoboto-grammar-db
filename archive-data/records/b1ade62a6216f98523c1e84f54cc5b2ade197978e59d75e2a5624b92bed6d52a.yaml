    japanese: この階段は、私にはたいしたことはありませんが、足の弱い人にしたら、とても大変だろうと思いますよ。
    body_text: "この階段は、私にはたいしたことはありませんが、足の弱い人にしたら、とても大変だろうと思いますよ。 \n\n\t\tI've never disapproved of this stairway, but \n\t\tif I were \n\t\tsomeone with weak legs, I think I'd probably have a difficult time."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの階段は、私にはたいしたことはありませんが、足の弱い人にしたら、とても大変だろうと思いますよ。\">\n\t\t\t\tこの階段は、私にはたいしたことはありませんが、足の弱い人<strong>にしたら</strong>、とても大変だろうと思いますよ。<strong></strong></a> <br/>\n\t\tI've never disapproved of this stairway, but \n\t\t<strong>if I were </strong>\n\t\tsomeone with weak legs, I think I'd probably have a difficult time."
