notes:
  - position: 0
    text: "Formation:\n\r\n(Person)に(message plain form)と伝えていただけませんか。\n\r\n例えば：すみませんが、渡辺さんに明日のパーティーは６時からだと伝えていただけませんか。\n\r\n英語：Excuse me but, could you tell Watanabe that the party tomorrow will start from 6."
    html: "Formation:<br/>\r\n(Person)に(message plain form)と伝えていただけませんか。<br/>\r\n例えば：すみませんが、渡辺さんに明日のパーティーは６時からだと伝えていただけませんか。<br/>\r\n英語：Excuse me but, could you tell Watanabe that the party tomorrow will start from 6."
