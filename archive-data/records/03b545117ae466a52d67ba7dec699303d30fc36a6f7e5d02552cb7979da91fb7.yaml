notes:
  - position: 0
    text: "＊This is an expression of a strong conclusion or decision. It can only be used with nouns.\n\n\n\r\n＊ほかならぬ means \"very important\" or \"none other.\" For example:\n\r\nほかならぬあなたの頼みだから、聞かないわけにはいきません。\n\r\n\"I can't help but listen since it's a request from none other than you.\"\n\n\n\r\nFORMATION:\n\r\nＮ + にほかならない\n\r\nほかならぬ + Ｎ"
    html: "＊This is an expression of a strong conclusion or decision. It can only be used with nouns.<br/>\n<br/>\r\n＊ほかならぬ means \"very important\" or \"none other.\" For example:<br/>\r\nほかならぬあなたの頼みだから、聞かないわけにはいきません。<br/>\r\n\"I can't help but listen since it's a request from none other than you.\"<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + にほかならない<br/>\r\nほかならぬ + Ｎ"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "PLAIN FORMS (Verb, i/na Adjectives, Noun) + にほかならない\n\r\nBut in case of Noun an na-Adjective だ　is not added\n\r\nThere are also Noun/na-Adjective + である\n\r\nwhen expressing reason から　can also be added"
    html: "PLAIN FORMS (Verb, i/na Adjectives, Noun) + にほかならない<br/>\r\nBut in case of Noun an na-Adjective だ　is not added<br/>\r\nThere are also Noun/na-Adjective + である<br/>\r\nwhen expressing reason から　can also be added"
