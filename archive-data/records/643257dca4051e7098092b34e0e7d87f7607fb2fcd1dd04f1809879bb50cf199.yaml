comments:
  - position: 0
    credits_raw: bamboo4
    text: "In the second example, 閉まらないほど would be \"cannot be closed\" instead of opened.\n\r\nIn the third example, \"can be made\" assumes possibility of human intervention, whereas 出来る denies that. So, the English should be \"can become\" instead of \"can be made.\""
    html: "In the second example, 閉まらないほど would be \"cannot be closed\" instead of opened.<br/>\r\nIn the third example, \"can be made\" assumes possibility of human intervention, whereas 出来る denies that. So, the English should be \"can become\" instead of \"can be made.\""
    source_id: null
    original_created_at: null
    original_updated_at: null
