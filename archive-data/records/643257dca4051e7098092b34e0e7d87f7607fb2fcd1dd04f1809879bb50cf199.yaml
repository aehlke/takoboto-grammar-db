    text: "ex. 666 and 1211 seem different from 263.\n\r\nThe first two have the effect coming before ほど.. can not speakほどangry. can not openほどcrowded.\n\r\nExample 263 seems backwards, but is similar to the explanation for 〜ば〜ほど.\n\r\nCould someone explain the first two examples, please?"
    html: "ex. 666 and 1211 seem different from 263.<br/>\r\nThe first two have the effect coming before ほど.. can not speakほどangry. can not openほどcrowded.<br/>\r\nExample 263 seems backwards, but is similar to the explanation for 〜ば〜ほど.<br/>\r\nCould someone explain the first two examples, please?"
