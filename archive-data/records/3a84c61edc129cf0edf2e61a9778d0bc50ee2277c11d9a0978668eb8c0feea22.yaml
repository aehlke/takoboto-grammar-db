  - source_id: 7967
    position: 1
    japanese: 内容といい話し方といい、見事なスピーチでした。
    body_text: "内容といい話し方といい、見事なスピーチでした。\r \n\n\t\tIt was a splendid speech in terms of content as well as delivery."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ内容といい話し方といい、見事なスピーチでした。\">\n\t\t\t\t内容<strong>といい</strong>話し方といい、見事なスピーチでした。\r<strong></strong></a> <br/>\n\t\tIt was a splendid speech in terms of content as well as delivery. \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7968
    position: 2
    japanese: 家柄といい学歴といい、彼は非の打ちどころがない。
    body_text: "家柄といい学歴といい、彼は非の打ちどころがない。\r \n\n\t\tHe is just perfect, both in terms of his family and educational background."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ家柄といい学歴といい、彼は非の打ちどころがない。\">\n\t\t\t\t家柄<strong>といい</strong>学歴といい、彼は非の打ちどころがない。\r<strong></strong></a> <br/>\n\t\tHe is just perfect, both in terms of his family and educational background. \n\t\t<strong> </strong>"
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7969
    position: 3
    japanese: スピードといいパワーといい、今の彼に勝てる選手はいない。
    body_text: "スピードといいパワーといい、今の彼に勝てる選手はいない。\r \n\n\t\tNo player can beat him now in terms of either speed or power."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJスピードといいパワーといい、今の彼に勝てる選手はいない。\">\n\t\t\t\tスピード<strong>といい</strong>パワーといい、今の彼に勝てる選手はいない。\r<strong></strong></a> <br/>\n\t\tNo player can beat him now in terms of either speed or power. \n\t\t<strong> </strong>"
