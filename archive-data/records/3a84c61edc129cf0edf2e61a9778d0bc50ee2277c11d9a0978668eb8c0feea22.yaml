    japanese: このスーツ、色といいデザインといい、お客様はよく似合いですよ
    body_text: "このスーツ、色といいデザインといい、お客様はよく似合いですよ\r \n\n\t\tFrom the perspective of the colour as well as the design, this suit is a good match for you"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこのスーツ、色といいデザインといい、お客様はよく似合いですよ\">\n\t\t\t\tこのスーツ、色<strong>といい</strong>デザインといい、お客様はよく似合いですよ\r<strong></strong></a> <br/>\n\t\tFrom the perspective of the colour as well as the design, this suit is a good match for you \n\t\t<strong> </strong>"
