    credits_raw: Amatuka
    text: "Note this form shortens in a similar way to てしまう。\n\r\nては→ちゃ\n\r\nでは→じゃ"
    html: "Note this form shortens in a similar way to てしまう。<br/>\r\nては→ちゃ<br/>\r\nでは→じゃ"
