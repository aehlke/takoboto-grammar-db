  - position: 5
    credits_raw: ljfurlong
    text: "I guess this just means \"doing (this) would be...\" \n\n\n\r\nThe two examples given (だめ、まずい）are negative. Can this be used positively?\n\r\n例：行っては素晴らしい。\n\r\n行っちゃ素晴らしい。"
    html: "I guess this just means \"doing (this) would be...\" <br/>\n<br/>\r\nThe two examples given (だめ、まずい）are negative. Can this be used positively?<br/>\r\n例：行っては素晴らしい。<br/>\r\n行っちゃ素晴らしい。<br/>"
