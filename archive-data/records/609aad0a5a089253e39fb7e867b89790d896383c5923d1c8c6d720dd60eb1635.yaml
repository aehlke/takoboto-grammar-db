  - position: 1
    credits_raw: Amatuka
    text: "Formed from te-form verb + ha (wa)\n\n\n\r\nVte = te-form verb"
    html: "Formed from te-form verb + ha (wa)<br/>\n<br/>\r\nVte = te-form verb"
