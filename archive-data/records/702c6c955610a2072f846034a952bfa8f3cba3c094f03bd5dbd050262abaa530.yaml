    body_text: "The child messes it up as soon as I clean, so I've gotten to the point of not wanting to even try anymore. \n\n\t\t子供が掃除 \n\t\tするそばから \n\t\t散らかすから、もうあきらめたくなった。"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJThe child messes it up as soon as I clean, so I\">\n\t\t\t\tThe child messes it up <strong>as soon as </strong>I clean, so I've gotten to the point of not wanting to even try anymore.<strong></strong></a> <br/>\n\t\t子供が掃除 \n\t\t<strong>するそばから </strong>\n\t\t散らかすから、もうあきらめたくなった。"
