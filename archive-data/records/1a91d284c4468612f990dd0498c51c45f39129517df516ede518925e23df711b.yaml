comments:
  - position: 0
    credits_raw: bamboo4
    text: |-
      済みません means that one's mind remains unsettled and therefore not 澄む, that is not clear. From 澄む came the concept of 済む meaning "finishied."
    html: |-
      済みません means that one's mind remains unsettled and therefore not 澄む, that is not clear. From 澄む came the concept of 済む meaning "finishied."<br/>
