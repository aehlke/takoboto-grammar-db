notes:
  - position: 0
    text: "Since doing one thing anyway, do something else at the same time.\n\n\n\ntsuideni since, anyway doing A, do B\n\r\n郵便局へ行くついでに、この手紙を出してくれる？\n\r\n= since you're going to the post office anyway, can you mail this letter for me?\n\r\nThe most casual form in daily use.\n\n\n\nokeikini = on the opportunity of A, did B\n\r\nmore formal and used written, but similar meaning to tsuideni\n\r\n大統領が中国に 行ったの を契機に  万里の長城を訪問しておりました。\n\r\n= When the president visited China, he took the chance to visit the Great Wall.\n\n\n\nokikkakeni = implies more cause and effect. Often used when a major event occurs and gives you a chance to also do something else:\n\r\n子供が生まれたの をきっかけに  タバコを止めました\n\r\n= Since I had kids, I took the opportunity to quit smoking\n\r\n= as a trigger"
    html: "Since doing one thing anyway, do something else at the same time.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsuideni\">tsuideni</a></b> since, anyway doing A, do B<br/>\r\n郵便局へ行く<b>ついでに</b>、この手紙を出してくれる？<br/>\r\n= since you're going to the post office <b>anyway</b>, can you mail this letter for me?<br/>\r\nThe most casual form in daily use.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=okeikini\">okeikini</a></b> = on the opportunity of A, did B<br/>\r\nmore formal and used written, but similar meaning to tsuideni<br/>\r\n大統領が中国に 行ったの を契機に  万里の長城を訪問しておりました。<br/>\r\n= When the president visited China, he took the chance to visit the Great Wall.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=okikkakeni\">okikkakeni</a></b> = implies more cause and effect. Often used when a major event occurs and gives you a chance to also do something else:<br/>\r\n子供が生まれたの をきっかけに  タバコを止めました<br/>\r\n= Since I had kids, I took the opportunity to quit smoking<br/>\r\n= as a trigger<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: |-
      It’s easy to confuse tsuideni with gatera. 



      gatera, both actions are of equal importance, 

      tsuideni implies doing one thing, and then just adding something else at the same time, "since its there anyway"
    html: |-
      It’s easy to confuse <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=tsuideni">tsuideni</a></b> with <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=gatera">gatera</a></b>. <br/>
      <br/>
      <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=gatera">gatera</a></b>, both actions are of equal importance, <br/>
      <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=tsuideni">tsuideni</a></b> implies doing one thing, and then just adding something else at the same time, "since its there anyway"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "kanete implies combining, not just time-related. \n\r\ncombined the sightseeing and business trip\n\r\nmixing work and pleasure"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kanete\">kanete</a></b> implies combining, not just time-related. <br/>\r\ncombined the sightseeing and business trip<br/>\r\nmixing work and pleasure"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    text: katagata is similar to tsuideni but more formal
    html: |-
      <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=katagata">katagata</a></b> is similar to <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=tsuideni">tsuideni</a></b> but more formal
