notes:
  - position: 0
    text: "までに is giving a time limit which must be kept. Finishing the required action before is also fine.\n\n\n\r\nIn opposition まで denotes an action etc. which continues until the given time and does not finish before."
    html: "までに is giving a time limit which must be kept. Finishing the required action before is also fine.<br/>\n<br/>\r\nIn opposition まで denotes an action etc. which continues until the given time and does not finish before."
