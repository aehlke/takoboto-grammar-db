    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ人間は赤ん坊のときは四つんばいで、それから２本の足で歩くようになり、最後は年をとって杖が必要になる。\">\n\t\t\t\t人間は赤ん坊のときは四つんばいで、それから２本の足で歩く<strong>ように</strong>なり、最後は年をとって杖が必要になる。<strong></strong></a> <br/>\n\t\tIt crawls on all fours as a baby, then learns to walk on two legs, and finally needs a cane in old age. \n\t\t<strong> </strong>"
