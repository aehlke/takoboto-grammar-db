comments:
  - position: 0
    credits_raw: bamboo4
    text: "ように has a meaning of \"to do\" or \"so that one can do\" which I guess would include \"become.\" The first example can literally be translated as \"For that reason, I want to do so that I can speak better English.\" \n\n\n\r\nMy second example follows that vein."
    html: "ように has a meaning of \"to do\" or \"so that one can do\" which I guess would include \"become.\" The first example can literally be translated as \"For that reason, I want to do so that I can speak better English.\" <br/>\n<br/>\r\nMy second example follows that vein.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Naino
    text: "Um, this might be of use but it's especially for the youni NARU -sentence pattern. But it said in the comments of the \"youninaru\" that this grammar entry would do, so...One of the possible usages of ように:\n\n\n\r\nようになる expresses a change that takes place gradually.\n\n\n\r\nWith verbs:\n\n\n\r\nVdic + you ni naru= \"reach the point where~\"/\"come to~\"\n\n\n\r\n子供は自分で部屋を片付けるようになりました。\n\r\n(My) child has reached the point where she cleans her room herself.\n\n\n\r\nVneg + you ni naru= \"reach the point where ~not\"\n\n\n\r\n林さんはたばこを吸わないようになる。\n\r\nMr.Hayashi has reached the point where he does not smoke.\n\n\n\r\n*Vdic= Verb, dictionary form\n\n\n\r\n---\n\n\n\r\nBesides なる, there's also する and 言う verbs that can be connected with ように to create more specific meanings...Did some of these have their own entries...?"
    html: "Um, this might be of use but it's especially for the youni NARU -sentence pattern. But it said in the comments of the \"youninaru\" that this grammar entry would do, so...One of the possible usages of ように:<br/>\n<br/>\r\nようになる expresses a change that takes place gradually.<br/>\n<br/>\r\nWith verbs:<br/>\n<br/>\r\nVdic + you ni naru= \"reach the point where~\"/\"come to~\"<br/>\n<br/>\r\n子供は自分で部屋を片付けるようになりました。<br/>\r\n(My) child has reached the point where she cleans her room herself.<br/>\n<br/>\r\nVneg + you ni naru= \"reach the point where ~not\"<br/>\n<br/>\r\n林さんはたばこを吸わないようになる。<br/>\r\nMr.Hayashi has reached the point where he does not smoke.<br/>\n<br/>\r\n*Vdic= Verb, dictionary form<br/>\n<br/>\r\n---<br/>\n<br/>\r\nBesides なる, there's also する and 言う verbs that can be connected with ように to create more specific meanings...Did some of these have their own entries...?"
