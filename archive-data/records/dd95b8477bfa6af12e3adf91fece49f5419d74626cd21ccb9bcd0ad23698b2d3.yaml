    position: 0
    japanese: ご飯の一粒たりとも無駄にするな！
    body_text: "ご飯の一粒たりとも無駄にするな！ \n\n\t\tDon't you dare waste \n\t\teven one \n\t\tgrain of rice!"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJご飯の一粒たりとも無駄にするな！\">\n\t\t\t\tご飯の一粒<strong>たりとも</strong>無駄にするな！<strong></strong></a> <br/>\n\t\tDon't you dare waste \n\t\t<strong>even one </strong>\n\t\tgrain of rice!"
    credits_raw: blabby
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5443
    position: 1
    japanese: こんなテレビゲームをやる時、一瞬たりとも気を抜くことが出来ない。
    body_text: "こんなテレビゲームをやる時、一瞬たりとも気を抜くことが出来ない。 \n\n\t\tWith this type of video game, you can't afford to lose your concentration for even just a second."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこんなテレビゲームをやる時、一瞬たりとも気を抜くことが出来ない。\">\n\t\t\t\tこんなテレビゲームをやる時、一瞬<strong>たりとも</strong>気を抜くことが出来ない。<strong></strong></a> <br/>\n\t\tWith this type of video game, you can't afford to lose your concentration for even just a second. \n\t\t<strong> </strong>"
    credits_raw: blabby
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5444
    position: 2
    japanese: １センチたりとも進まない。
    body_text: "１センチたりとも進まない。 \n\n\t\tNot progress even a centimeter."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ１センチたりとも進まない。\">\n\t\t\t\t１センチ<strong>たりとも</strong>進まない。<strong></strong></a> <br/>\n\t\tNot progress even a centimeter. \n\t\t<strong> </strong>"
