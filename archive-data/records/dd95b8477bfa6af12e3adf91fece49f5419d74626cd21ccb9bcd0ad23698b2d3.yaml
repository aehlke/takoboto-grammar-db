    japanese: 一分たりとも無駄に出来ないぞ。
    body_text: "一分たりとも無駄に出来ないぞ。 \n\n\t\t(We) don't have a minute to waste!"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ一分たりとも無駄に出来ないぞ。\">\n\t\t\t\t一分<strong>たりとも</strong>無駄に出来ないぞ。<strong></strong></a> <br/>\n\t\t(We) don't have a minute to waste! \n\t\t<strong> </strong>"
