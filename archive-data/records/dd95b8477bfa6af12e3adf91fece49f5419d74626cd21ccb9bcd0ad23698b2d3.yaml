    body_text: "試合の最中は、一瞬たりとも油断はできない。 \n\n\t\tWe can't afford even a moment of carelessness during the game."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ試合の最中は、一瞬たりとも油断はできない。\">\n\t\t\t\t試合の最中は、一瞬<strong>たりとも</strong>油断はできない。<strong></strong></a> <br/>\n\t\tWe can't afford even a moment of carelessness during the game. \n\t\t<strong> </strong>"
