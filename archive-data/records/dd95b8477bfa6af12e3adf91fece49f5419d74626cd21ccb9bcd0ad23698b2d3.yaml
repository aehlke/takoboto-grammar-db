comments:
  - position: 0
    credits_raw: bamboo4
    text: "#5444 is awkward. You just use も in that case and say:\n\n\n\r\n1センチも進まない or 1センチも進むことができない.\n\r\nたりとも in such cases is used to prevent or deter the progress. E.g., 1センチたりとも進ませない."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=taritomo#5444\">#5444</a></b> is awkward. You just use も in that case and say:<br/>\n<br/>\r\n1センチも進まない or 1センチも進むことができない.<br/>\r\nたりとも in such cases is used to prevent or deter the progress. E.g., 1センチたりとも進ませない.<br/>"
    source_id: null
    original_created_at: null
