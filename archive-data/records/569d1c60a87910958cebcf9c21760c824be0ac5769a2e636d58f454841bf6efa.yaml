  - position: 1
    credits_raw: Miki
    text: 'smack v. smack of sth : slight flavour of sth　お尻ぺんぺんも同じスペル。'
    html: 'smack v. smack of sth : slight flavour of sth　お尻ぺんぺんも同じスペル。'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "I think it would normally be the plural \"smacks of\"\n\nhttp://dictionary.reference.com/search?q=smacks\n\r\n\"A distinctive flavor or taste. \n\r\nA suggestion or trace.\"\n\r\nI'm not sure it's a great translation though."
    html: "I think it would normally be the plural \"smacks of\"<br/>\n<a href=\"http://dictionary.reference.com/search?q=smacks\">http://dictionary.reference.com/search?q=smacks</a><br/>\r\n\"A distinctive flavor or taste. <br/>\r\nA suggestion or trace.\"<br/>\r\nI'm not sure it's a great translation though."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: |-
      I was wrong. I mixed up the lines for v with that of n. It is for n-explanation but it should be used in singular according to an OXFORD dictionary. In contect "smack" is V after "This soup". いい訳に見えるけど。
    html: |-
      I was wrong. I mixed up the lines for v with that of n. It is for n-explanation but it should be used in singular according to an OXFORD dictionary. In contect "smack" is V after "This soup". いい訳に見えるけど。
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: ixtli
    text: |-
      Not sure if the issue is resolved, but the phrase is always "X smacks of Y".  Its a good enough translation, though, as a native speaker i can say this phrase has become _slightly_ archaic.
    html: |-
      Not sure if the issue is resolved, but the phrase is always "X smacks of Y".  Its a good enough translation, though, as a native speaker i can say this phrase has become _slightly_ archaic.
