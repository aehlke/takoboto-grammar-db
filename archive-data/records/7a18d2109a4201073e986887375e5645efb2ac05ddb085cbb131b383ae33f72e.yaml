  - position: 4
    credits_raw: Amatuka
    text: |-
      nominative: The subject particle が ga is also referred to as the nominative an English grammar term defined as "Of, relating to, or being the case of the subject of a finite verb (as I in I wrote the letter) and of words identified with the subject of a copula, such as a predicate nominative"
    html: |-
      <b>nominative</b>: The subject particle が <b><a href="http://www.jgram.org/pages/viewOne.php?tagE=ga">ga</a></b> is also referred to as the <a href="http://dictionary.reference.com/search?q=nominative">nominative</a> an English grammar term defined as "Of, relating to, or being the case of the subject of a finite verb (as I in I wrote the letter) and of words identified with the subject of a copula, such as a predicate nominative"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Amatuka
    text: |-
      Accusative: The object particle を [wo / o] is also referred to as the accusative an English grammar term defined as "Of, relating to, or being the grammatical case that is the direct object of a verb or the object of certain prepositions."
    html: |-
      <b>Accusative</b>: The object particle を [wo / o] is also referred to as the <a href="http://dictionary.reference.com/search?q=accusative">accusative</a> an English grammar term defined as "Of, relating to, or being the grammatical case that is the direct object of a verb or the object of certain prepositions."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: Amatuka
    text: "genitive: The possessive particle の no is also referred to as the genitive an English grammar term defined as \"1. Of, relating to, or being the grammatical case expressing possession, measurement, or source. \n\r\n2. Of or relating to an affix or construction, such as a prepositional phrase, characteristic of the genitive case.\""
    html: "<b>genitive</b>: The possessive particle の <b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=no\">no</a></b> is also referred to as the <a href=\"http://dictionary.reference.com/search?q=Genitive\">genitive</a> an English grammar term defined as \"1. Of, relating to, or being the grammatical case expressing possession, measurement, or source. <br/>\r\n2. Of or relating to an affix or construction, such as a prepositional phrase, characteristic of the genitive case.\"<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: Amatuka
    text: |-
      postposition marker: Various particles may be referred to as 'postposition markers'.  This word is derived from the English grammar term preposition and indicates a marker placed after a substantive to indicate the relation of that substantive to a verb, adjective or other substantive.
    html: |-
      <b>postposition marker</b>: Various particles may be referred to as 'postposition markers'.  This word is derived from the English grammar term <a href="http://dictionary.reference.com/search?q=preposition">preposition</a> and indicates a marker placed after a substantive to indicate the relation of that substantive to a verb, adjective or other substantive.
