  - position: 5
    credits_raw: のぶた
    text: "hi everyone.Correct me if I'm wrong but as I was searching for more examples on のに, I found that sometimes you can put it at the end of the sentence so as to create[ i wish...]. For example: I wish he could have driven a car a year ago. \n\r\n１年前、彼に車の運転ができていたらよかったのに。\n\r\nThe translation is [ I wish he could have driven a car a year ago]. Is it a kind of ように?\n\r\nthanx for the answer..."
    html: "hi everyone.Correct me if I'm wrong but as I was searching for more examples on のに, I found that sometimes you can put it at the end of the sentence so as to create[ i wish...]. For example: I wish he could have driven a car a year ago. <br/>\r\n１年前、彼に車の運転ができていたらよかったのに。<br/>\r\nThe translation is [ I wish he could have driven a car a year ago]. Is it a kind of ように?<br/>\r\nthanx for the answer..."
    source_id: null
