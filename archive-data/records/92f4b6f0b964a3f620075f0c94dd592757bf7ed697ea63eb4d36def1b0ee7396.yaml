notes:
  - position: 0
    text: "-my notes-\n\r\nのに is different from ので\n\n\n\r\nEX)From Jgram,Jlpt3\n\r\n日本語を覚えるのに時間がかかります\n\n\n\r\nのにis used the same exact way as ので, but のに means \"despite\" or \"in order to\".\n\n\n\r\nAnother Example:(From tai kims japanese guide)\n\r\n毎日運動したのに、全然痩せなかった。 \n\n\n\r\n-end my notes-"
    html: "-my notes-<br/>\r\nのに is different from ので<br/>\n<br/>\r\nEX)From Jgram,Jlpt3<br/>\r\n日本語を覚えるのに時間がかかります<br/>\n<br/>\r\nのにis used the same exact way as ので, but のに means \"despite\" or \"in order to\".<br/>\n<br/>\r\nAnother Example:(From tai kims japanese guide)<br/>\r\n毎日運動したのに、全然痩せなかった。 <br/>\n<br/>\r\n-end my notes-"
