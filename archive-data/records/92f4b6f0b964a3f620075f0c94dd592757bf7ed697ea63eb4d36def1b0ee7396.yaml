  - position: 2
    credits_raw: Norgus
    text: "ex #4747 has furigana for 何時 as どこ, which is simply not true and should be read なんじ, which has nothing to do with place but is asking 'what time'.\n\n\n\r\nDoko is normally written in just hiragana anyway.\n\n\n\r\nreguarding the first example #586 日本語を覚えるのに時間がかかります\n\r\nIs there an easy way to tell that it wasn't intended to mean 'despite that I am going to remember Japanese, it will take time' ?\n\r\n(and wouldn't the verb 習う(ならう) 'to learn' fit this best?)"
    html: "ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=noni-2#4747\">#4747</a></b> has furigana for 何時 as どこ, which is simply not true and should be read なんじ, which has nothing to do with place but is asking 'what time'.<br/>\n<br/>\r\nDoko is normally written in just hiragana anyway.<br/>\n<br/>\r\nreguarding the first example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=noni-2#586\">#586</a></b> 日本語を覚えるのに時間がかかります<br/>\r\nIs there an easy way to tell that it wasn't intended to mean 'despite that I am going to remember Japanese, it will take time' ?<br/>\r\n(and wouldn't the verb 習う(ならう) 'to learn' fit this best?)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: KyleGoetz
    text: |-
      @Norgus, it does not sound like the "although" のに because when using the form ＡのにＢ to show a contrast, A and B must be contrastive. "I am going to remember Japanese" and "It will take time" are not really that contrastive. It just doesn't sound like that. That's all I can offer on the topic.
    html: |-
      @Norgus, it does not sound like the "although" のに because when using the form ＡのにＢ to show a contrast, A and B must be contrastive. "I am going to remember Japanese" and "It will take time" are not really that contrastive. It just doesn't sound like that. That's all I can offer on the topic.
    source_id: null
