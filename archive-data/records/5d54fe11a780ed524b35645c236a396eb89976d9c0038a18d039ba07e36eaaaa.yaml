    japanese: その結果として、大切な躾や社会道徳の教育がおろそかにされてきたことは否めない。多くの親自身が、子供の勉強を優先するあまり、他人への思いやりなど社会の一員としての責任を忘れがちになっているのも事実である。
    body_text: "その結果として、大切な躾や社会道徳の教育がおろそかにされてきたことは否めない。多くの親自身が、子供の勉強を優先するあまり、他人への思いやりなど社会の一員としての責任を忘れがちになっているのも事実である。\r \n\n\t\tBy placing excessive importance on scholastic achievement, many parents have forgotten such basic social courtesies as consideration for others."
