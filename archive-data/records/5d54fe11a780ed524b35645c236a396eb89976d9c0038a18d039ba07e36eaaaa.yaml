    text: "I have an important question.\n\n\n\r\nWhat's the meaning of the usage of 〜を〜として?\n\n\n\r\nチンさんを先生として、中国語の勉強会を開いた。\n\n\n\r\nI don't understand the meaning of を. In this case, として should be translated as \"as\"?\n\n\n\r\nWhen and how I use the pattern 〜を〜として or 〜を〜とする or 〜を〜とした?"
    html: "I have an important question.<br/>\n<br/>\r\nWhat's the meaning of the usage of 〜を〜として?<br/>\n<br/>\r\nチンさんを先生として、中国語の勉強会を開いた。<br/>\n<br/>\r\nI don't understand the meaning of を. In this case, として should be translated as \"as\"?<br/>\n<br/>\r\nWhen and how I use the pattern 〜を〜として or 〜を〜とする or 〜を〜とした?"
