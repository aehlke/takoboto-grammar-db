    text: "＊This is a compound particle which indicates the capacity, role, or function of someone or something.\n\n\n\r\nFORMATION:\n\r\nＮ + として\n\n\n\r\n＊Be careful! としては (toshiteha) has a different connotation. See that entry for more."
