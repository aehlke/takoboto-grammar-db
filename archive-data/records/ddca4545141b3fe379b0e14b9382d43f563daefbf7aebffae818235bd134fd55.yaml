    body_text: "日本のソフトクリームとは、ラベンダーひとつとっても様々な珍しい味が楽しめる商品だ。 \n\n\t\tJapanese soft-serve ice cream is a product you can enjoy in a variety of exotic flavors, \n\t\tsuch as \n\t\tLavender."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ日本のソフトクリームとは、ラベンダーひとつとっても様々な珍しい味が楽しめる商品だ。\">\n\t\t\t\t日本のソフトクリームとは、ラベンダー<strong>ひとつとっても</strong>様々な珍しい味が楽しめる商品だ。<strong></strong></a> <br/>\n\t\tJapanese soft-serve ice cream is a product you can enjoy in a variety of exotic flavors, \n\t\t<strong>such as </strong>\n\t\tLavender."
