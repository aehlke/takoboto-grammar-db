    japanese: 部屋探しひとつとっても外国人として日本に生活を始めるのが難しいと言われる。
    body_text: "部屋探しひとつとっても外国人として日本に生活を始めるのが難しいと言われる。 \n\n\t\tIt is said that it is hard to start living in Japan as a foreigner; take the search for an apartment \n\t\tas an example."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ部屋探しひとつとっても外国人として日本に生活を始めるのが難しいと言われる。\">\n\t\t\t\t部屋探し<strong>ひとつとっても</strong>外国人として日本に生活を始めるのが難しいと言われる。<strong></strong></a> <br/>\n\t\tIt is said that it is hard to start living in Japan as a foreigner; take the search for an apartment \n\t\t<strong>as an example. </strong>"
