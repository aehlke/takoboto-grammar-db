    credits_raw: dc
    text: "'At the very outside' means \"at the worst\". maybe literally, \"on the border of what might and might not happen\" \n\r\n-> さいていの場合、三日掛かる。"
    html: "'At the very outside' means \"at the worst\". maybe literally, \"on the border of what might and might not happen\" <br/>\r\n-&gt; さいていの場合、三日掛かる。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Miki
    text: hmm it would be 最長（さいちょう）instead of 最低（さいてい）. 最長⇔最短（さいたん）、最高（さいこう）⇔最低
    html: hmm it would be 最長（さいちょう）instead of 最低（さいてい）. 最長⇔最短（さいたん）、最高（さいこう）⇔最低
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: |-
      You guys must mean 最悪の場合. You would not say さいていの場合、三日掛かる but could say さいてい三日掛かる, which would mean "takes the minimum of three days."The former says that it could be done in less than three days, but the latter would say it takes three days or more.
    html: |-
      You guys must mean 最悪の場合. You would not say さいていの場合、三日掛かる but could say さいてい三日掛かる, which would mean "takes the minimum of three days."The former says that it could be done in less than three days, but the latter would say it takes three days or more.
    source_id: null
