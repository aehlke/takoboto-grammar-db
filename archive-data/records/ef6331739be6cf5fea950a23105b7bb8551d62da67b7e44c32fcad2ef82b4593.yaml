    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼が日本のみならず、世界においても有名な物理学者である。\">\n\t\t\t\t彼が日本<strong>のみならず</strong>、世界においても有名な物理学者である。\r<strong></strong></a> <br/>\n\t\tHe is a famous physicist not only in Japan, but in the world. \n\t\t<strong> </strong>"
