    japanese: 日本人学生は極度に内気であるのみならず、時としてほとんど全く話したがらないように見える。
    body_text: "日本人学生は極度に内気であるのみならず、時としてほとんど全く話したがらないように見える。\r \n\n\t\tJapanese students seem not merely to be extremely reserved, but to have at times almost a complete reluctance to speak."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ日本人学生は極度に内気であるのみならず、時としてほとんど全く話したがらないように見える。\">\n\t\t\t\t日本人学生は極度に内気である<strong>のみならず</strong>、時としてほとんど全く話したがらないように見える。\r<strong></strong></a> <br/>\n\t\tJapanese students seem not merely to be extremely reserved, but to have at times almost a complete reluctance to speak. \n\t\t<strong> </strong>"
