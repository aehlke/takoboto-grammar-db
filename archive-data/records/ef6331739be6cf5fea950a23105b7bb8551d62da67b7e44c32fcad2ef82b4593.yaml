  - position: 2
    credits_raw: Miki
    text: "I think, AをはじめB : A is the major example and B is others.\n\r\nWhile CのみならずD, there is no rank in importance of examples."
    html: "I think, AをはじめB : A is the major example and B is others.<br/>\r\nWhile CのみならずD, there is no rank in importance of examples."
