    credits_raw: sevaa
    text: "Do they ever say \"までは\"?\n\r\nAs in,\n\r\n\"３時までは、来ないでください。\"　for \"Please don't come until 3.\"\n\n\n\r\nOr would simple \"３時まで\" suffice?\n\r\nThank you."
    html: "Do they ever say \"までは\"?<br/>\r\nAs in,<br/>\r\n\"３時までは、来ないでください。\"　for \"Please don't come until 3.\"<br/>\n<br/>\r\nOr would simple \"３時まで\" suffice?<br/>\r\nThank you.<br/>\n<br/>\n<br/>"
    source_id: null
