    credits_raw: Amatuka
    text: 'The ''to'' indicated by made can be time like (40 days) space like (Kyushu) or more metaphorical ([lit: up to raining])'
    html: 'The ''to'' indicated by made can be time like (40 days) space like (Kyushu) or more metaphorical ([lit: up to raining])'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Note there is some difference between までに and まで.  \n\r\nまで : \"I stayed up till 10pm\" \n\r\n１０時まで起きてた。\n\r\n[You actually went to bed at 10pm]\n\r\nまでに : \"I had to get back by 10pm\" \n\r\n１０時までに帰らなくっちゃ\n\r\n[You could come back earlier, but not later]\n\r\n(Hmm, hope that last example is OK)"
    html: "Note there is some difference between までに and まで.  <br/>\r\nまで : \"I stayed up till 10pm\" <br/>\r\n１０時まで起きてた。<br/>\r\n[You actually went to bed at 10pm]<br/>\r\nまでに : \"I had to get back by 10pm\" <br/>\r\n１０時までに帰らなくっちゃ<br/>\r\n[You could come back earlier, but not later]<br/>\r\n(Hmm, hope that last example is OK)"
    source_id: null
