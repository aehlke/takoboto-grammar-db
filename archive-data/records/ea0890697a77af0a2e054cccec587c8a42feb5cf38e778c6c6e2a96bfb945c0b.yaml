    japanese: 人間は食べ物がなくても４０日まで生きられるが、水がないと７日間しか生きられない。
    body_text: "人間は食べ物がなくても４０日まで生きられるが、水がないと７日間しか生きられない。 \n\n\t\tHuman beings can live \n\t\tup to \n\t\t40 days without food, but no more than 7 without water."
