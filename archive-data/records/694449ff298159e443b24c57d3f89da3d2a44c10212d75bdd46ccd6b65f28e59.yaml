    text: "とても..から　(x)　\n\r\nとても...ので (x)\n\r\n...しすぎるので (x)\n\r\nExpresses that a lot of or too much of (something) was the reason for (x)\n\n\n\r\n(Dictionary form) verb + あまり\n\r\nNoun　＋の＋あまり \n\r\nEG.痛さのあまり、涙が出てきた。\n\r\nその会社では働きすぎたあまり、病気で倒れる社員が増えている。"
    html: "とても..から　(x)　<br/>\r\nとても...ので (x)<br/>\r\n...しすぎるので (x)<br/>\r\nExpresses that a lot of or too much of (something) was the reason for (x)<br/>\n<br/>\r\n(Dictionary form) verb + あまり<br/>\r\nNoun　＋の＋あまり <br/>\r\nEG.痛さのあまり、涙が出てきた。<br/>\r\nその会社では働きすぎたあまり、病気で倒れる社員が増えている。"
