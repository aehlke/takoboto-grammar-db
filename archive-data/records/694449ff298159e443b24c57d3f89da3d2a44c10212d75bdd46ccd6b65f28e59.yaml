    credits_raw: jmadsen
    text: "I think the JLPT 2 version of this has been confused with the lower forms. JLPT 2 form means \"too much, in an unusual or unexpected way\"\n\n\n\r\nex. 驚き　の　あまり、声も　出なかった。\n\r\nHis surprise was so great, he couldn't even shout out."
    html: "I think the JLPT 2 version of this has been confused with the lower forms. JLPT 2 form means \"too much, in an unusual or unexpected way\"<br/>\n<br/>\r\nex. 驚き　の　あまり、声も　出なかった。<br/>\r\nHis surprise was so great, he couldn't even shout out."
    source_id: null
