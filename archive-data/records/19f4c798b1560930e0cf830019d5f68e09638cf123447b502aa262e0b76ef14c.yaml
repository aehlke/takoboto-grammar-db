notes:
  - position: 0
    text: "aru is used for inanimate things, ie objects rather than animals or people.\n\n\n\r\nsee also iru いる the equivalent for living things.\n\n\n\r\ntake's が particle."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> is used for inanimate things, ie objects rather than animals or people.<br/>\n<br/>\r\nsee also <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=iru\">iru</a></b> いる the equivalent for living things.<br/>\n<br/>\r\ntake's が particle."
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "aru is one of three common verbs with the equivalent of English verb \"to be\".\n\n\n\r\nUsage is roughly equivalent to \"is\" or \"Exists\" for inanimate things.\n\r\nLiving things are generally excluded.\n\r\nFor instance, a cat would use the verb iru as it has intelligence, and an insect would use iru. But living things such as plants use aru.\n\n\n\naru is stative (non-action) verb. To express location, the particle ni/に is used. Otherwise ga/が　is used (if you can find some exceptions to this rule, please let us know!).\n\n\n\r\nExample:\n\r\n本はテエブルの上にあります。　ほんはテエブルのうえにあります。\n\r\n(The) book is on table's top. Hon ha teeburu no ue ni arimasu. \n\n\n\n* \"to have\" is also expressed often using aru. The thing that is being possession in this construction, uses the particle ga/が.\n\n\n\r\nExample:\n\r\nお金がありますか？　おかねがありますか？\n\r\n(as for you) does money exist? Okane ga arimasu ka?\n\n\n\nOther notes:\n\naru is generally written in kana alone, instead of using kanji.\n\n\n\r\nForgetting to use が and using plain form aru might make your sound rude and like a yakuza member. Dropping を has a similar effect."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> is one of three common verbs with the equivalent of English verb \"to be\".<br/>\n<br/>\r\nUsage is roughly equivalent to \"is\" or \"Exists\" for inanimate things.<br/>\r\nLiving things are generally excluded.<br/>\r\nFor instance, a cat would use the verb <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=iru\">iru</a></b> as it has intelligence, and an insect would use <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=iru\">iru</a></b>. But living things such as plants use <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b>.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> is stative (non-action) verb. To express location, the particle <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ni\">ni</a></b>/に is used. Otherwise <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ga\">ga</a></b>/が　is used (if you can find some exceptions to this rule, please let us know!).<br/>\n<br/>\r\nExample:<br/>\r\n本はテエブルの上にあります。　ほんはテエブルのうえにあります。<br/>\r\n(The) book is on table's top. Hon ha teeburu no ue ni arimasu. <br/>\n<br/>\n<b>*</b> \"to have\" is also expressed often using <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b>. The thing that is being possession in this construction, uses the particle <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ga\">ga</a></b>/が.<br/>\n<br/>\r\nExample:<br/>\r\nお金がありますか？　おかねがありますか？<br/>\r\n(as for you) does money exist? Okane ga arimasu ka?<br/>\n<br/>\n<b>Other notes:</b><br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> is generally written in kana alone, instead of using kanji.<br/>\n<br/>\r\nForgetting to use が and using plain form <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> might make your sound rude and like a yakuza member. Dropping を has a similar effect."
    credits_raw: Rinji_HalfElf
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "aru conjugation chart.\n\n\n\r\ndictionary form aru　　affirmative　　negative\n\r\n-------------------------------------------------\n\r\nPresent  Plain　　　　　　aru　　　　　　　nai\n\r\nPresent  Polite　　　　　arimasu　　　　arimasen\n\r\n-------------------------------------------------\n\r\nPast  Plain　　　　　　　　atta 　　　　　　nakatta\n\r\nPast Polite 　　　　　　　arimashita 　　arimasen deshita\n\r\n-------------------------------------------------\n\r\nProbable Plain 　　　　　aru darou 　　nai darou\n\r\nProbable Polite　　　　　aru deshou　　naideshou\n\r\n-------------------------------------------------"
    html: "<b><b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b> conjugation chart.</b><br/>\n<br/>\r\ndictionary form <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=aru\">aru</a></b>　　affirmative　　negative<br/>\r\n-------------------------------------------------<br/>\r\nPresent  Plain　　　　　　aru　　　　　　　nai<br/>\r\nPresent  Polite　　　　　arimasu　　　　arimasen<br/>\r\n-------------------------------------------------<br/>\r\nPast  Plain　　　　　　　　atta 　　　　　　nakatta<br/>\r\nPast Polite 　　　　　　　arimashita 　　arimasen deshita<br/>\r\n-------------------------------------------------<br/>\r\nProbable Plain 　　　　　aru darou 　　nai darou<br/>\r\nProbable Polite　　　　　aru deshou　　naideshou<br/>\r\n-------------------------------------------------<br/>"
    credits_raw: Rinji_HalfElf
