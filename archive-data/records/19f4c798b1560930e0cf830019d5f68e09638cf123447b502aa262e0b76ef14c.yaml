  - position: 1
    credits_raw: Amatuka
    text: ている teiru can't be used with the verbs of existance (e.g. ある aru and いる iru)
    html: |-
      ている <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=teiru">teiru</a></b> can't be used with the verbs of existance (e.g. ある <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=aru">aru</a></b> and いる <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=iru">iru</a></b>)
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: |-
      在る indicates the physical existence of something, while 有る could be either possession or existence of some state or event. In either case, it is normal to use ある without making fine distinction.
    html: |-
      在る indicates the physical existence of something, while 有る could be either possession or existence of some state or event. In either case, it is normal to use ある without making fine distinction.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Eeker
    text: |-
      To be anal, I think the translation of 丘の上に家が在り（あり）ます is slightly off... In English we do not generally use "located" when the article is indefinite, i.e. when you use "a" or "an".  I believe a more accurate translation would be "There is a house on the hill".
    html: |-
      To be anal, I think the translation of 丘の上に家が在り（あり）ます is slightly off... In English we do not generally use "located" when the article is indefinite, i.e. when you use "a" or "an".  I believe a more accurate translation would be "There is a house on the hill".
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: I think Eeker is correct.
    html: I think Eeker is correct.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Saralynne
    text: |-
      I've seen in some examples that ある is used to mean "to have"... and I know there is another word for "to hold" or "to carry", but is this how you say you have something?
