  - position: 3
    credits_raw: Miki
    text: |-
      Yes, it is. にしたがって（従う） is not as casual as にそって（沿う） and is also not formal as に即して。に従って and に沿って are used in conversation as well.
    html: |-
      Yes, it is. にしたがって（従う） is not as casual as にそって（沿う） and is also not formal as に即して。に従って and に沿って are used in conversation as well.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: dc
    text: "I thought に従って nishitagatte implied more hierarchy, or cause and effect, whereas nisotte is more in parallel?\n\n\n\r\n(fact) nishitagatte (effect)\n\n\n\r\n高い。従って、買わなかった\n\r\nIt was expensive. Accordingly, I did not buy it.\n\n\n\r\n川に沿って道\n\r\nthe street parallel with the river"
    html: "I thought に従って <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nishitagatte\">nishitagatte</a></b> implied more hierarchy, or cause and effect, whereas <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nisotte\">nisotte</a></b> is more in parallel?<br/>\n<br/>\r\n(fact) <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nishitagatte\">nishitagatte</a></b> (effect)<br/>\n<br/>\r\n高い。従って、買わなかった<br/>\r\nIt was expensive. Accordingly, I did not buy it.<br/>\n<br/>\r\n川に沿って道<br/>\r\nthe street parallel with the river"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Miki
    text: "Your 従って in the eg above is 接続詞 conjunction. \n\r\nMy 従って is a transformation of 従う。Yes, 従う implies hierarchy but not all the time. Also 沿う and 従う aren't the same meaning but implications are the same here. \n\r\nexample :\n\r\nPlease answer following the example\n\r\n例題に即して、回答してください。\n\r\n例題に沿って、回答してください。\n\r\n例題に従って、回答してください。"
    html: "Your 従って in the eg above is 接続詞 conjunction. <br/>\r\nMy 従って is a transformation of 従う。Yes, 従う implies hierarchy but not all the time. Also 沿う and 従う aren't the same meaning but implications are the same here. <br/>\r\nexample :<br/>\r\nPlease answer following the example<br/>\r\n例題に即して、回答してください。<br/>\r\n例題に沿って、回答してください。<br/>\r\n例題に従って、回答してください。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: Paul
    text: "See also に即した \"based on, adapted to\"\n\r\nプロとして現実に即した解決策を提示します。\n\r\nAs professionals we present solutions adapted to the facts of the situation."
    html: "See also に即した \"based on, adapted to\"<br/>\r\nプロとして現実に即した解決策を提示します。<br/>\r\nAs professionals we present solutions adapted to the facts of the situation."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: srobertson
    text: |-
      According to two of my texts, this phrase is written using different 漢字 depending on the nuance: に即して (in accordance with the facts, objective reality, experience, etc.) and に則して (in accordance with arbitrary rules, laws, etc.) Following that, #5151 is not written correctly (boo to ALC). However, I also see that another source uses に即して in both cases, so maybe this is just a nitpicky distinction. Can any native speakers address this?
    html: |-
      According to two of my texts, this phrase is written using different 漢字 depending on the nuance: に即して (in accordance with the facts, objective reality, experience, etc.) and に則して (in accordance with arbitrary rules, laws, etc.) Following that, <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=nisokushite#5151">#5151</a></b> is not written correctly (boo to ALC). However, I also see that another source uses に即して in both cases, so maybe this is just a nitpicky distinction. Can any native speakers address this?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: LR
    text: |-
      In Kanzen master it says 即 is appropriate for things that conform to experience or a situation, and 則 is for when things conform to laws and rules.
    html: |-
      In Kanzen master it says 即 is appropriate for things that conform to experience or a situation, and 則 is for when things conform to laws and rules.
