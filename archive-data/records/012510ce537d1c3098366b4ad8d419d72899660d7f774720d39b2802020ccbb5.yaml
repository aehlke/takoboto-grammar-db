comments:
  - position: 0
    credits_raw: lucinda lohmanoota
    text: Is this the same as "[to atte"?]
    html: Is this the same as "[to atte"?]
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: LR
    text: "Hi Lucinda,\n\r\nThe two look very similar. The main difference I can see is that the clause that follows [to atte] is usually quite descriptive and not very disputable - \"(in the special condition) of the summer holidays, the tourist spots are crowded\"\n\r\nWhere as clauses that follow [to areba] seem to be more like opinions or necessary actions as a result of the clause before [to areba] - like \"if (in the special condition that) tourists are coming from far away we should make an effort\".\n\r\nIf you find any sentences that clarify this, please post!"
    html: "Hi Lucinda,<br/>\r\nThe two look very similar. The main difference I can see is that the clause that follows [to atte] is usually quite descriptive and not very disputable - \"(in the special condition) of the summer holidays, the tourist spots are crowded\"<br/>\r\nWhere as clauses that follow [to areba] seem to be more like opinions or necessary actions as a result of the clause before [to areba] - like \"if (in the special condition that) tourists are coming from far away we should make an effort\".<br/>\r\nIf you find any sentences that clarify this, please post!"
    source_id: null
    original_created_at: null
    original_updated_at: null
