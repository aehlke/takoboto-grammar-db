title_raw: 〜が最後 ([〜がさいご] )(gasaigo)
title: 〜が最後
reading: 〜がさいご
romanized_label: gasaigo
category: grammar
jlpt_level_original: '1'
meaning: |-
  If s.o. does s.t for even a moment, the following result will necessarily occur • Once someone starts something, the person can’t stop it 〜したら • いったん〜たらそのまま • いったん〜たら必ず
meaning_example: If the boss even touches  the mic for a second, he won't let anyone else sing karaoke ALL night
