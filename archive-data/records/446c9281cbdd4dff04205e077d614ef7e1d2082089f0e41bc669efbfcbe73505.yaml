    japanese: 男は踏み入れたが最後、生きては帰られない地獄寺で噴出する女の怨念
    body_text: "男は踏み入れたが最後、生きては帰られない地獄寺で噴出する女の怨念 \n\n\t\tIf a man \n\t\tso much as \n\t\tsteps inside, he won't return alive from this hellish temple of gushing women's hatred. (description of alt. J-film \"牧口雄二の世界\")"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ男は踏み入れたが最後、生きては帰られない地獄寺で噴出する女の怨念\">\n\t\t\t\t男は踏み入れた<strong>が最後</strong>、生きては帰られない地獄寺で噴出する女の怨念<strong></strong></a> <br/>\n\t\tIf a man \n\t\t<strong>so much as </strong>\n\t\tsteps inside, he won't return alive from this hellish temple of gushing women's hatred. (description of alt. J-film \"牧口雄二の世界\")"
