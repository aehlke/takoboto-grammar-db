notes:
  - position: 0
    text: "see http://www.geocities.com/easykanji/jlptgrammar.html\n\n\n\r\nOnce someone starts something, the person can’t stop it.\n\n\n\r\nNotes: Easily confused with ~kiri, but the meanings are completely different and ga saigo doesn’t mean ‘for the last time’. Always used with past tense verbs."
    html: "see <a href=\"http://www.geocities.com/easykanji/jlptgrammar.html\">http://www.geocities.com/easykanji/jlptgrammar.html</a><br/>\n<br/>\r\nOnce someone starts something, the person can’t stop it.<br/>\n<br/>\r\nNotes: Easily confused with ~kiri, but the meanings are completely different and ga saigo doesn’t mean ‘for the last time’. Always used with past tense verbs.<br/>\n<br/>"
