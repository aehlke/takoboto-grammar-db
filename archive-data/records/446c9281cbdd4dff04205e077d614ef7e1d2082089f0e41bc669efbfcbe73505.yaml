    japanese: 冒頭の一文がいい。「これからする話を聞いてほしいんだ。」素直に耳を傾け始めたが最後、そのまま止まらなくなること必定である。
    body_text: "冒頭の一文がいい。「これからする話を聞いてほしいんだ。」素直に耳を傾け始めたが最後、そのまま止まらなくなること必定である。 \n\n\t\tThe opening sentence is good. \"I want you to listen to the following story\". \n\t\tIf you just \n\t\tobediently lean in your ears, it's certain that you won't be able to stop (reading).  (Nikkei book review)"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ冒頭の一文がいい。「これからする話を聞いてほしいんだ。」素直に耳を傾け始めたが最後、そのまま止まらなくなること必定である。\">\n\t\t\t\t冒頭の一文がいい。「これからする話を聞いてほしいんだ。」素直に耳を傾け始めた<strong>が最後</strong>、そのまま止まらなくなること必定である。<strong></strong></a> <br/>\n\t\tThe opening sentence is good. \"I want you to listen to the following story\". \n\t\t<strong>If you just </strong>\n\t\tobediently lean in your ears, it's certain that you won't be able to stop (reading).  (Nikkei book review)"
