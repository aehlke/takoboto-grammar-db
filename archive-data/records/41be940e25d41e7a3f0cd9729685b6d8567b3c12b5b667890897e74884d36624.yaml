notes:
  - position: 0
    text: うち　（内） means inside. so this is "inside the time" or while.
    html: うち　（内） means inside. so this is "inside the time" or while.
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "I found this helpful:\n\r\nうちに indicates a period of time WITHIN WHICH an action occurs, and corresposnds to English \"while still\", or in negative constructions \"before\".\n\n\n\r\nIt is different to あいだ, which indicates a period DURING OR THROUGHOUT WHICH an action occurs, and is equivalent to English \"while\".\n\n\n\r\n学生のうちに、よく勉強ひておきなさい。\n\r\nStudy hard while you are still a student.\n\n\n\r\nDifferent to: 学生の間に、いろんな所を、旅行するつもりです。　I plan to travel to lots of places during the time I am a student.\n\n\n\r\nうちに is also used to indicate an event building up or reaching a climax AS some action is being done.\n\n\n\r\n先生の話を聞いているうちに、眠くなってきた。\n\r\nI grew tired as I listened to the teacher speak."
    html: "I found this helpful:<br/>\r\nうちに indicates a period of time WITHIN WHICH an action occurs, and corresposnds to English \"while still\", or in negative constructions \"before\".<br/>\n<br/>\r\nIt is different to あいだ, which indicates a period DURING OR THROUGHOUT WHICH an action occurs, and is equivalent to English \"while\".<br/>\n<br/>\r\n学生のうちに、よく勉強ひておきなさい。<br/>\r\nStudy hard while you are still a student.<br/>\n<br/>\r\nDifferent to: 学生の間に、いろんな所を、旅行するつもりです。　I plan to travel to lots of places during the time I am a student.<br/>\n<br/>\r\nうちに is also used to indicate an event building up or reaching a climax AS some action is being done.<br/>\n<br/>\r\n先生の話を聞いているうちに、眠くなってきた。<br/>\r\nI grew tired as I listened to the teacher speak.<br/>"
    credits_raw: minutiae
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "Another way to keep うちに and あいだ apart is:\n\n\n\r\nうちに: An abstract timespan with diffuse start and end time; e.g. childhood, rainy season\n\n\n\r\nあいだ: A timespan where you can pinpoint start and end time; e.g. lecture, summer holiday"
    html: "Another way to keep うちに and あいだ apart is:<br/>\n<br/>\r\nうちに: An abstract timespan with diffuse start and end time; e.g. childhood, rainy season<br/>\n<br/>\r\nあいだ: A timespan where you can pinpoint start and end time; e.g. lecture, summer holiday<br/>"
    credits_raw: Chad
    source_id: null
