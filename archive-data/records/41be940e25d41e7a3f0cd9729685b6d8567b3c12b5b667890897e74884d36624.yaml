    credits_raw: 赤毛
    text: "Minutiaeさん> Please correct the notes:\n\r\n勉強ひて->勉強して as in ex#6184.\n\r\nWhy are they 2 different grammar entry うちに+うちに-2?\n\r\nIn my point of view:\n\r\nOne use of うちに describe a progressive change in the 2 clauses before and after うちに. This use is associated with progressive form of verbs like Vテ+行く(change in the future) and Vテ+来る(change in the past) or sudden change like Vイ+出す and Vイ+始める. In this use, うちに cannot be substituted by あいだに. These examples like ex #3160 are the best for uchini.\n\r\nThe other use of うちに make an opposition between  a temporary state in the clause before うちに which permits the clause after うちに, and the end of this temporary clause when it will be too late. This use should be in uchini-2 but there are various example here in uchini.\n\r\nI think it will be great to rearrange these 2 entry. So I moved Ex #6186 from here to #6903 of uchini-2 and I changed it with the example from the notes which fits better."
    html: "Minutiaeさん&gt; Please correct the notes:<br/>\r\n勉強ひて-&gt;勉強して as in ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini#6184\">#6184</a></b>.<br/>\r\nWhy are they 2 different grammar entry うちに+うちに-2?<br/>\r\nIn my point of view:<br/>\r\nOne use of うちに describe a progressive change in the 2 clauses before and after うちに. This use is associated with progressive form of verbs like Vテ+行く(change in the future) and Vテ+来る(change in the past) or sudden change like Vイ+出す and Vイ+始める. In this use, うちに cannot be substituted by あいだに. These examples like ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini#3160\">#3160</a></b> are the best for <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini\">uchini</a></b>.<br/>\r\nThe other use of うちに make an opposition between  a temporary state in the clause before うちに which permits the clause after うちに, and the end of this temporary clause when it will be too late. This use should be in <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini-2\">uchini-2</a></b> but there are various example here in <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini\">uchini</a></b>.<br/>\r\nI think it will be great to rearrange these 2 entry. So I moved Ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini#6186\">#6186</a></b> from here to <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini#6903\">#6903</a></b> of <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=uchini-2\">uchini-2</a></b> and I changed it with the example from the notes which fits better."
    source_id: null
