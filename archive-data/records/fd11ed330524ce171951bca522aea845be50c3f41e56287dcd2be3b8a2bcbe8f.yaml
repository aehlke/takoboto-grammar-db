    japanese: この農園は私たちの必要を満たすに足るだけの野菜を産出する。
    body_text: "この農園は私たちの必要を満たすに足るだけの野菜を産出する。\r \n\n\t\tThis farm yields enough vegetables to meet our needs."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの農園は私たちの必要を満たすに足るだけの野菜を産出する。\">\n\t\t\t\tこの農園は私たちの必要を満たす<strong>に足る</strong>だけの野菜を産出する。\r<strong></strong></a> <br/>\n\t\tThis farm yields enough vegetables to meet our needs. \n\t\t<strong> </strong>"
