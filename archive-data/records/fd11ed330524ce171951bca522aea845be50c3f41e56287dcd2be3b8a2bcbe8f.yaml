    body_text: "いやしくもなすに足る事なら立派にやるだけの価値がある。\r \n\n\t\tIf it is worth doing at all it is worth doing well."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJいやしくもなすに足る事なら立派にやるだけの価値がある。\">\n\t\t\t\tいやしくもなす<strong>に足る</strong>事なら立派にやるだけの価値がある。\r<strong></strong></a> <br/>\n\t\tIf it is worth doing at all it is worth doing well. \n\t\t<strong> </strong>"
