    body_text: "大衆によって重んじられている人が必ずしもそれを受けるに足る人とは言えない。\r \n\n\t\tPeople who are made much of by the public are not always those who must deserve it."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ大衆によって重んじられている人が必ずしもそれを受けるに足る人とは言えない。\">\n\t\t\t\t大衆によって重んじられている人が必ずしもそれを受ける<strong>に足る</strong>人とは言えない。\r<strong></strong></a> <br/>\n\t\tPeople who are made much of by the public are not always those who must deserve it. \n\t\t<strong> </strong>"
