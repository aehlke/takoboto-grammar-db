    credits_raw: 誠
    text: "〜たform of verb + ところで\n\r\nand just ところで、ちがうのものです。\n\r\nIf it is just ところで,which being used at the beginning of a separate sentence, it means 'By the way'.\n\r\nIf it is a verb in 〜たform + ところで　、then it is \n\r\n「〜ても．．．」という意味です。（希望どおりにはならないだろう）"
    html: "〜たform of verb + ところで<br/>\r\nand just ところで、ちがうのものです。<br/>\r\nIf it is just ところで,which being used at the beginning of a separate sentence, it means 'By the way'.<br/>\r\nIf it is a verb in 〜たform + ところで　、then it is <br/>\r\n「〜ても．．．」という意味です。（希望どおりにはならないだろう）"
