comments:
  - position: 0
    credits_raw: dc
    text: "different ways of saying \"by the way\"\n\n\n\r\nchinami ni > related to that...\n\r\ntokorode > by the way (unrelated)\n\r\nsoieba > speaking of that\n\n\n\nfrom here\n\n\n\r\n「ところで」は、今まで話していた事とまったく違う話題に変えるとき使います。「ちなみに」は、今まで話していたことと関連して他の例などを挙げるときや、ある話題に対して相手の感想などを聞くときにも使います。だから「ところで」と「ちなみに」はまったく違う意味を持っています。"
    html: "different ways of saying \"by the way\"<br/>\n<br/>\r\nchinami ni &gt; related to that...<br/>\r\ntokorode &gt; by the way (unrelated)<br/>\r\nsoieba &gt; speaking of that<br/>\n<br/>\n<a href=\"http://www.jref.com/forum/showthread.php?t=7318\">from here</a><br/>\n<br/>\r\n「ところで」は、今まで話していた事とまったく違う話題に変えるとき使います。「ちなみに」は、今まで話していたことと関連して他の例などを挙げるときや、ある話題に対して相手の感想などを聞くときにも使います。だから「ところで」と「ちなみに」はまったく違う意味を持っています。"
    source_id: null
    original_created_at: null
