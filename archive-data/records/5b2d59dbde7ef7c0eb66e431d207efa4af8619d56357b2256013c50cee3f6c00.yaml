notes:
  - position: 0
    text: "This is from my Barron's Japanese Vocabulary Book.\n\n\n\r\nIt appears as though the function is similar to -i adjective, where desu is dropped. Or desu is not needed due to the operators plain verb form.\n\n\n\r\nThat or \"ha\" functions opposite of contrast in this case, and functions as \"comparable\" as the last example may indicate."
    html: "This is from my Barron's Japanese Vocabulary Book.<br/>\n<br/>\r\nIt appears as though the function is similar to -i adjective, where desu is dropped. Or desu is not needed due to the operators plain verb form.<br/>\n<br/>\r\nThat or \"ha\" functions opposite of contrast in this case, and functions as \"comparable\" as the last example may indicate."
    credits_raw: Rinji_HalfElf
