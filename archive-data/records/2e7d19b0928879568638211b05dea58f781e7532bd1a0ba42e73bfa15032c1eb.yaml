  - position: 1
    credits_raw: bamboo4
    text: |-
      につき or について is also used for "regarding" or "concerning" such as 山田さんにつき（について）何かご存じですか(Do you know anything about Mr. Yamada?).
    html: |-
      につき or について is also used for "regarding" or "concerning" such as 山田さんにつき（について）何かご存じですか(Do you know anything about Mr. Yamada?).<br/>
