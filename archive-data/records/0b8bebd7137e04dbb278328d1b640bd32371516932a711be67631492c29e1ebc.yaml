notes:
  - position: 0
    text: "There are various levels of suggesting/asking/telling/ordering someone to do something in japanese, just like in english.\n\n\n\r\nIn general order of the strength of the suggestion:\n\n\n\nhougaii = better if/ought to\n\r\nit would be better if you do this\n\r\nこれをした方がよい\n\n\n\r\nit would be better to do it this way\n\r\nこいう風にした方がよい\n\n\n\r\nyou should exercise more\n\r\nもっと運動したほうがいい\n\n\n\nbeki = should\n\r\nYou should do this \n\r\nあなたはこれをするべきです。\n\r\n(it sounds stronger in Japanese, I guess.)\n\n\n\nnakerebanaranai = must/have to\n\r\nYou must do this \n\r\nあなたはこれをしなければなりません\n\n\n\nhitsuyou = neccessary\n\r\nit is neccessary that you do this\n\r\nこれをする必要があります\n\n\n\ngimu = obligation\n\r\nyou are obliged \n\r\nあなたは。。。する義務があります\n\n\n\nzaruwoenai = required to (formal) eg by law\n\r\nit is required to do this (eg by law)\n\r\nこれをせざるを得ない"
    html: "There are various levels of suggesting/asking/telling/ordering someone to do something in japanese, just like in english.<br/>\n<br/>\r\nIn general order of the strength of the suggestion:<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=hougaii\">hougaii</a></b> = better if/ought to<br/>\r\nit would be better if you do this<br/>\r\nこれをした方がよい<br/>\n<br/>\r\nit would be better to do it this way<br/>\r\nこいう風にした方がよい<br/>\n<br/>\r\nyou should exercise more<br/>\r\nもっと運動したほうがいい<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=beki\">beki</a></b> = should<br/>\r\nYou should do this <br/>\r\nあなたはこれをするべきです。<br/>\r\n(it sounds stronger in Japanese, I guess.)<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nakerebanaranai\">nakerebanaranai</a></b> = must/have to<br/>\r\nYou must do this <br/>\r\nあなたはこれをしなければなりません<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=hitsuyou\">hitsuyou</a></b> = neccessary<br/>\r\nit is neccessary that you do this<br/>\r\nこれをする必要があります<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=gimu\">gimu</a></b> = obligation<br/>\r\nyou are obliged <br/>\r\nあなたは。。。する義務があります<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=zaruwoenai\">zaruwoenai</a></b> = required to (formal) eg by law<br/>\r\nit is required to do this (eg by law)<br/>\r\nこれをせざるを得ない<br/>"
