comments:
  - position: 0
    credits_raw: Miki
    text: "As for the comment in Notes, t should be にくい, not いくい. typo? \n\r\nIn kanji 'にくい' is in 難い or 悪い\n\r\n'verb conjugation + にくい'."
    html: "As for the comment in Notes, t should be にくい, not いくい. typo? <br/>\r\nIn kanji 'にくい' is in 難い or 悪い<br/>\r\n'verb conjugation + にくい'.<br/>"
    source_id: null
    original_created_at: null
