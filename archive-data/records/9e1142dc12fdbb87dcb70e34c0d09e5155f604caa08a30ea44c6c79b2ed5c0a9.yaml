    original_updated_at: null
  - position: 2
    credits_raw: crbennett
    text: What's the difference between むずかしい and にくい?
    html: What's the difference between むずかしい and にくい?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Groove
    text: "The different is that 難い is added to a verb stem to change it to an adjective, whereas 難しい is an existing adjective meaning 'difficult', and thus can't be conjugated to a verb stem.\n\n\n\r\nFor example:\n\n\n\r\nThat word is difficult to remember (lit. That word's remembering is difficult.)\n\r\nその言葉が思い出し難いな。\n\n\n\r\nas compared to:\n\n\n\r\nRemembering that word is difficult (lit. That word's remembering is difficult).\n\r\nその言葉は思い出すことが難しいだ。\n\n\n\r\nEDIT 10/15/07: You're right; thanks tiger!"
    html: "The different is that 難い is added to a verb stem to change it to an adjective, whereas 難しい is an existing adjective meaning 'difficult', and thus can't be conjugated to a verb stem.<br/>\n<br/>\r\nFor example:<br/>\n<br/>\r\nThat word is difficult to remember (lit. That word's remembering is difficult.)<br/>\r\nその言葉が思い出し難いな。<br/>\n<br/>\r\nas compared to:<br/>\n<br/>\r\nRemembering that word is difficult (lit. That word's remembering is difficult).<br/>\r\nその言葉は思い出すことが難しいだ。<br/>\n<br/>\r\nEDIT 10/15/07: You're right; thanks tiger!"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: tigert
    text: "Hey groove in your second example. I don`t think you need the する.\n\n\n\r\n思い出す　is a verb already. other than that I like your explaination very clear I added a vocabulary note for yasui"
    html: "Hey groove in your second example. I don`t think you need the する.<br/>\n<br/>\r\n思い出す　is a verb already. other than that I like your explaination very clear I added a vocabulary note for yasui"
    source_id: null
    original_created_at: null
    original_updated_at: null
