notes:
  - position: 0
    text: "を follows a noun or place. It indicates that that noun is the direct object of the verb, that the place is the place of departure, or that the place was passed through.\n\n\n\r\nを is romanized as \"wo\" or \"o\".\n\n\n\r\nAmatuka said this below."
    html: "を follows a noun or place. It indicates that that noun is the direct object of the verb, that the place is the place of departure, or that the place was passed through.<br/>\n<br/>\r\nを is romanized as \"wo\" or \"o\".<br/>\n<br/>\r\nAmatuka said this below."
    credits_raw: sarruby
    source_id: null
