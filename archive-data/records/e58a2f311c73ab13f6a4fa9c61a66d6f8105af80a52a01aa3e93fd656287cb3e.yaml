notes:
  - position: 0
    text: "Noun + にあって\n\r\n　混乱期にあって\n\r\n　幼児期にあって\n\n\n\r\noften used to with situation that has a time span. \"At the time that\" or \"under the circumstances of...\""
    html: "Noun + にあって<br/>\r\n　混乱期にあって<br/>\r\n　幼児期にあって<br/>\n<br/>\r\noften used to with situation that has a time span. \"At the time that\" or \"under the circumstances of...\""
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
