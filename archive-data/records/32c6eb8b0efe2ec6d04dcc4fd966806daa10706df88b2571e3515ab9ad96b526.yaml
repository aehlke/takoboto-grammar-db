    text: "hitoikide means [with one breath] and it is used to describe a short period of time, Usually in which something will accure. \n\n\n\n\n\r\n休憩しないで、後一息仕事が終わりますよ。\n\n\n\r\nDon`t rest now, works almost finished."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=hitoikide\">hitoikide</a></b> means [with one breath] and it is used to describe a short period of time, Usually in which something will accure. <br/>\n<br/>\n<br/>\r\n休憩しないで、後一息仕事が終わりますよ。<br/>\n<br/>\r\nDon`t rest now, works almost finished."
