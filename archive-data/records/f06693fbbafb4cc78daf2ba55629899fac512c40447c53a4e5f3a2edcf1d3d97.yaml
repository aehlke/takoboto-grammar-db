    body_text: "彼は会社へ来ても仕事をしないばかりか女性社員としゃべってばかりいる。 \n\n\t\tHe is \n\t\tnot only \n\t\tcome for not working moreover he is talking with other  ladies."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼は会社へ来ても仕事をしないばかりか\">\n\t\t\t\t彼は会社へ来ても仕事をし<strong>ないばかりか</strong><strong></strong>女性社員としゃべってばかりいる。</a> <br/>\n\t\tHe is \n\t\t<strong>not only </strong>\n\t\tcome for not working moreover he is talking with other  ladies."
