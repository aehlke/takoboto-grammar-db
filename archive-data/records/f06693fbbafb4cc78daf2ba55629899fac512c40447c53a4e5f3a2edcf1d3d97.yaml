    japanese: 彼女は歌をよく歌えないばかりかピアノもよく弾けます。
    body_text: "彼女は歌をよく歌えないばかりかピアノもよく弾けます。 \n\n\t\tShe not only sings well, but she also plays the piano well too."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼女は歌をよく歌えないばかりかピアノもよく弾けます。\">\n\t\t\t\t彼女は歌をよく歌え<strong>ないばかりか</strong>ピアノもよく弾けます。<strong></strong></a> <br/>\n\t\tShe not only sings well, but she also plays the piano well too. \n\t\t<strong> </strong>"
