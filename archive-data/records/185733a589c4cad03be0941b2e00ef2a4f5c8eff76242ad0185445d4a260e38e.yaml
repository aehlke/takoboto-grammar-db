  - position: 6
    credits_raw: yari
    text: "Isn't the verb in #4902 in passive form? If that's the case, then に denotes the agent (I think that's the correct English term) of the action. In other words, the one acting/subject.\n\n\n\r\nThat's why the English translation is in passive form also. I think."
    html: "Isn't the verb in <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ni-2#4902\">#4902</a></b> in passive form? If that's the case, then に denotes the agent (I think that's the correct English term) of the action. In other words, the one acting/subject.<br/>\n<br/>\r\nThat's why the English translation is in passive form also. I think."
