    japanese: いろいろな説はあるものの、恐竜がなぜ突然絶滅してしまったのかはまだ謎のままである。
    body_text: "いろいろな説はあるものの、恐竜がなぜ突然絶滅してしまったのかはまだ謎のままである。 \n\n\t\tThere are many theories about the sudden extinction of the dinosaurs, \n\t\tbut \n\t\tthe real cause still remains anyone's guess."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJいろいろな説はあるものの、恐竜がなぜ突然絶滅してしまったのかはまだ謎のままである。\">\nいろいろな説はある<strong>ものの</strong>、恐竜がなぜ突然絶滅してしまったのかはまだ謎のままである。<strong></strong></a> <br/>\n\t\tThere are many theories about the sudden extinction of the dinosaurs, \n\t\t<strong>but </strong>\n\t\tthe real cause still remains anyone's guess."
