    body_text: "あのホワイト・ライオンの子どもはおとなしいとはいうものの、なんといっても獣ですから、気を許さないで下さい。 \n\nWhile you can say the white lion cub is tame, \n\t\tit is a wild animal after all; so please do not let down your guard."
