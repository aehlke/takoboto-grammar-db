notes:
  - position: 0
    text: "monono is basically the same as \n\nshikashi or \n\nkeredomo \n\r\nand interchangeable:\n\n\n\r\n　　パソコンを買った[ものの]、使い方が全然わからない。\n\r\n→　パソコンを買った[けれども]、\n\r\n→　パソコンを買った[しかし]\n\r\n→　パソコンを買った[ということは本当だが]\n\n\n\r\nIts true I bought a PC, but ... (I have no idea how to use it)"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monono\">monono</a></b> is basically the same as <br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=shikashi\">shikashi</a></b> or <br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=keredomo\">keredomo</a></b> <br/>\r\nand interchangeable:<br/>\n<br/>\r\n　　パソコンを買った[ものの]、使い方が全然わからない。<br/>\r\n→　パソコンを買った[けれども]、<br/>\r\n→　パソコンを買った[しかし]<br/>\r\n→　パソコンを買った[ということは本当だが]<br/>\n<br/>\r\nIts true I bought a PC, but ... (I have no idea how to use it)"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
