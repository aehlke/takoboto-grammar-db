    japanese: 雪国で育った彼のことだから、さぞかしスキーがうまいだろうと思いきや、滑っては転び、滑っては転びの繰り返しだった
    body_text: "雪国で育った彼のことだから、さぞかしスキーがうまいだろうと思いきや、滑っては転び、滑っては転びの繰り返しだった \n\n\t\tFor someone brought up in a snowy country, \n\t\tyou'd think \n\t\the'd be great at skiing, but he just slips and falls, slips and falls."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ雪国で育った彼のことだから、さぞかしスキーがうまいだろうと思いきや、滑っては転び、滑っては転びの繰り返しだった\">\n\t\t\t\t雪国で育った彼のことだから、さぞかしスキーがうまいだろう<strong>と思いきや</strong>、滑っては転び、滑っては転びの繰り返しだった<strong></strong></a> <br/>\n\t\tFor someone brought up in a snowy country, \n\t\t<strong>you'd think </strong>\n\t\the'd be great at skiing, but he just slips and falls, slips and falls."
