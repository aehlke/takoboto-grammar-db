    japanese: 老後は退職金の蓄えで安泰だと思いきや、インフレで預金が目減りしてしまった。
    body_text: "老後は退職金の蓄えで安泰だと思いきや、インフレで預金が目減りしてしまった。 \n\n\t\tIn my remaining years \n\t\tI thought I could \n\t\tlive in peace and security from the stores of my retirement savings, but to my surprise , inflation has diminished the value of my savings."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ老後は退職金の蓄えで安泰だと思いきや、インフレで預金が目減りしてしまった。\">\n\t\t\t\t老後は退職金の蓄えで安泰だ<strong>と思いきや</strong>、インフレで預金が目減りしてしまった。<strong></strong></a> <br/>\n\t\tIn my remaining years \n\t\t<strong>I thought I could </strong>\n\t\tlive in peace and security from the stores of my retirement savings, but to my surprise , inflation has diminished the value of my savings."
