    text: "‘Beku’ is the same as ‘~ngatame’ but they differ grammatically. ‘Beku’ comes after the dictionary form of a verb, whereas ‘~ngatame’ follows the ‘~tai’ form of a verb. Written.\n\n\n\r\nsee http://www.geocities.com/easykanji/jlptgrammar.html"
