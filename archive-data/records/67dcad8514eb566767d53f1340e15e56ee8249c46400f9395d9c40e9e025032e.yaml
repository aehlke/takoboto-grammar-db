  - position: 2
    credits_raw: infinite_trial
    text: how does this differ from ために？
    html: how does this differ from ために？
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: blabby
    text: "I've read that they are more or less inerchangable but ために is used more for something you want to do - personal will (個人の意思)\n\r\nHowever べく is used more for some assumed responsibility (当然の義務).  Can anyone help us out and explain this better?\n\r\nべく is also mainly used in written Japanese."
    html: "I've read that they are more or less inerchangable but ために is used more for something you want to do - personal will (個人の意思)<br/>\r\nHowever べく is used more for some assumed responsibility (当然の義務).  Can anyone help us out and explain this better?<br/>\r\nべく is also mainly used in written Japanese."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: "べく is 連用形 of べし. It could oerate as an imperative or as firm presumption, indication of probability or expression of a plan.\n\r\nImperative = 全員参加すべく\n\r\nPresumption = 後日登城の御裁可あるべく候(archaic)\n\r\nIndication = 期待にこたえるべく努力する\n\r\nPlan = 犯人を逮捕すべく\n\n\n\r\nThis expression is basically archaic, but it is still used in conversation in such set phrases as 成るべくして成った or 勝つべくして勝った."
    html: "べく is 連用形 of べし. It could oerate as an imperative or as firm presumption, indication of probability or expression of a plan.<br/>\r\nImperative = 全員参加すべく<br/>\r\nPresumption = 後日登城の御裁可あるべく候(archaic)<br/>\r\nIndication = 期待にこたえるべく努力する<br/>\r\nPlan = 犯人を逮捕すべく<br/>\n<br/>\r\nThis expression is basically archaic, but it is still used in conversation in such set phrases as 成るべくして成った or 勝つべくして勝った.<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: Paul
    text: "I came across this in a JLPT 1 problem collection.  Note the unusual use of the ~ます form - 励ますべく appears to be a special case of some kind.\n\n\n\r\n試合に負けて落ち込んでいる友達をはげますべく、酒を飲みに誘った。"
    html: "I came across this in a JLPT 1 problem collection.  Note the unusual use of the ~ます form - 励ますべく appears to be a special case of some kind.<br/>\n<br/>\r\n試合に負けて落ち込んでいる友達をはげますべく、酒を飲みに誘った。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: blabby
    text: "励ます(はげます) is the dictionary form of 励まします(はげまします)\n\r\nIt is not a special case but sometimes easy to be confused with a  ます形 verb."
    html: "励ます(はげます) is the dictionary form of 励まします(はげまします)<br/>\r\nIt is not a special case but sometimes easy to be confused with a  ます形 verb."
    source_id: null
    original_created_at: null
