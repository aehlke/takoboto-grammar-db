    credits_raw: bamboo4
    text: "戦争に なる おそれがある literally means \"There is the likelihood of a war breaking out\" and does not mean \"I worry there might be a war.\"\n\r\nI also added an example."
    html: "戦争に なる おそれがある literally means \"There is the likelihood of a war breaking out\" and does not mean \"I worry there might be a war.\"<br/>\r\nI also added an example.  <br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: dc
    text: Is this always used for things that have a negative outcome?
    html: Is this always used for things that have a negative outcome?
    source_id: null
