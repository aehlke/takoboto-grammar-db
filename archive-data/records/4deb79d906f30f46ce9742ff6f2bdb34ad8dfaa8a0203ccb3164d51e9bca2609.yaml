    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: Yes, おそれ is related to "fear" so that the expression generally relate to those that have a negative consequence.
    html: Yes, おそれ is related to "fear" so that the expression generally relate to those that have a negative consequence.
    source_id: null
