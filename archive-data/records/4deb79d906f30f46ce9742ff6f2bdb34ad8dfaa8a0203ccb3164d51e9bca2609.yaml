  - position: 3
    credits_raw: dc
    text: "Q: can this be used with adjectives, or just verb-plain?\n\n\n\r\nこの車は高いおそれがある\n\r\nI worry that this car is expensive.\n\r\n〜高すぎるおそれがある\n\r\n~ too expensive"
    html: "Q: can this be used with adjectives, or just verb-plain?<br/>\n<br/>\r\nこの車は高いおそれがある<br/>\r\nI worry that this car is expensive.<br/>\r\n〜高すぎるおそれがある<br/>\r\n~ too expensive"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: "この車は高いおそれがある is awkward and not normally used. \n\r\n〜高すぎるおそれがある is okay but still somewhat awkward. \n\r\n恐らくこの車は高すぎる may be acceptable.."
    html: "この車は高いおそれがある is awkward and not normally used. <br/>\r\n〜高すぎるおそれがある is okay but still somewhat awkward. <br/>\r\n恐らくこの車は高すぎる may be acceptable.."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: MM
    text: |-
      I ran these examples past a native speaker (a teacher of English). From what he said, if it refers to something physically happening (a war starting, a house collapsing, etc) then おそれがある is natural. If it refers to a situation (as in 3294) then だろう is natural sounding.
    html: |-
      I ran these examples past a native speaker (a teacher of English). From what he said, if it refers to something physically happening (a war starting, a house collapsing, etc) then おそれがある is natural. If it refers to a situation (as in 3294) then だろう is natural sounding.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: MM
    text: |-
      I should add that he said that all the examples were gramatically acceptable - only that some didn't sound entirely natural.
