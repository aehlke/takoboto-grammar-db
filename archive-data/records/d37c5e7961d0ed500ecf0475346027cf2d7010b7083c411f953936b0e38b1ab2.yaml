notes:
  - position: 0
    text: |-
      Dani is similar to sae, and sura. The particle ni is often inserted between a noun and dani but is not necessary. There is a difference between dani and [imada ni]. Dani gives the definition just/ even. As do sae and sura and can directly follow nouns, adverbs, and verbs. [Imada ni] is different. One main difference is the fact that it is from 未だに showing a relation to the word mada. Infact, some dictionaries say that [imada ni] is a variation of mada ni. [Imada ni] therefore reflects the range of meaning is mada ni. Meaning still and yet. It is placed in the sentence the same way as a normal Ni-type adverb while dani being after what it modifies. [Imada ni] is often in practice written as 今だに although according to Meikyou dictionary to be be a common misinterpretation which would be in turn on how Japanese people themselves think about the phrase as Imada ni does influence the state in the present more than anything else.
    html: |-
      <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=Dani">Dani</a></b> is similar to <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=sae">sae</a></b>, and <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=sura">sura</a></b>. The particle <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=ni">ni</a></b> is often inserted between a noun and dani but is not necessary. There is a difference between <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=dani">dani</a></b> and [imada ni]. Dani gives the definition just/ even. As do <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=sae">sae</a></b> and <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=sura">sura</a></b> and can directly follow nouns, adverbs, and verbs. [Imada ni] is different. One main difference is the fact that it is from 未だに showing a relation to the word mada. Infact, some dictionaries say that [imada ni] is a variation of mada ni. [Imada ni] therefore reflects the range of meaning is mada ni. Meaning still and yet. It is placed in the sentence the same way as a normal Ni-type adverb while dani being after what it modifies. [Imada ni] is often in practice written as 今だに although according to Meikyou dictionary to be be a common misinterpretation which would be in turn on how Japanese people themselves think about the phrase as Imada ni does influence the state in the present more than anything else.
