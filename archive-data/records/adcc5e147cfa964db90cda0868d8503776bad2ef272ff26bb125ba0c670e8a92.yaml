  - position: 1
    credits_raw: ninja_k
    text: |-
      Wouldn't this fall under the other category of しまう？「その映画を見て泣いてしまった」にはほかの翻訳あると思いますが。。。 Watching that movie, I cried (not that I wanted to, or expected to cry). Perhaps because this would be a case where there isn't regret?
    html: |-
      Wouldn't this fall under the other category of しまう？「その映画を見て泣いてしまった」にはほかの翻訳あると思いますが。。。 Watching that movie, I cried (not that I wanted to, or expected to cry). Perhaps because this would be a case where there isn't regret?<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: eastmael
    text: "I think 〜てしまう can imply two meanings:\n\r\n1) completed\n\r\n2) to my regret\n\r\nI'm really not sure how one can distinguish which one a person is trying to imply.. I guess it's based on the context of what one is saying?"
    html: "I think 〜てしまう can imply two meanings:<br/>\r\n1) completed<br/>\r\n2) to my regret<br/>\r\nI'm really not sure how one can distinguish which one a person is trying to imply.. I guess it's based on the context of what one is saying?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: 誠
    text: "I agree with eastmael. Here is some explanation from text :\n\r\n〜てしまう\n\r\n１．全部終わる\n\r\nE.g. : 作文をかいてしまったら、公園に行きましょう\n\n\n\r\n２．失敗する・残念だと思う\n\r\nE.g.: 1.大切な結婚指輪を無くしてしまいました。\n\r\n　　　2.大好きな猫が既に死んでしまったんだ。\n\n\n\r\nI think if something bad happened unwillingly, 〜しまう goes to the 2nd meaning.Otherwise, if it is something done without any special adverse effects or just a plain task or action, it goes to the 1st meaning."
    html: "I agree with eastmael. Here is some explanation from text :<br/>\r\n〜てしまう<br/>\r\n１．全部終わる<br/>\r\nE.g. : 作文をかいてしまったら、公園に行きましょう<br/>\n<br/>\r\n２．失敗する・残念だと思う<br/>\r\nE.g.: 1.大切な結婚指輪を無くしてしまいました。<br/>\r\n　　　2.大好きな猫が既に死んでしまったんだ。<br/>\n<br/>\r\nI think if something bad happened unwillingly, 〜しまう goes to the 2nd meaning.Otherwise, if it is something done without any special adverse effects or just a plain task or action, it goes to the 1st meaning."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: tigert
    text: "I don`t know about everyone else, but I have never heard しまう used to mean \"I finished Ving\"\n\r\nIt always seems to have a negative meaning attached to it."
    html: "I don`t know about everyone else, but I have never heard しまう used to mean \"I finished Ving\"<br/>\r\nIt always seems to have a negative meaning attached to it."
    source_id: null
    original_created_at: null
    original_updated_at: null
