  - position: 1
    text: "It may be worth mentioning that sometimes \n\r\nVて　しまいました is sometimes shortened to \n\r\nVちゃった."
    html: "It may be worth mentioning that sometimes <br/>\r\nVて　しまいました is sometimes shortened to <br/>\r\nVちゃった."
    credits_raw: agnestan
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: |-
      Literally, しまう means "to finish." Do not be surprised to find this word used only in this meaning sometimes, with no "undesired"-connotation.
