  - position: 5
    credits_raw: kadoka66
    text: "Isn't the definition closer to, 'In particular'.\n\r\nIt seems to me after all that this grammar is used to highlight one thing out of a group to describe something or use as an example. I think it could also be written as 'for a start' in some examples.\n\n\n\r\n\"田舎は空気からして違う。\" The countryside, in particular the air is different.\n\n\n\r\n\"彼は礼儀を知らない　挨拶からして、きちんとしていない。\"\n\r\nHe doesn't have any manners, for a start he never greets people properly.\n\n\n\r\n(all example taken from Kanzen Master level 2 Green Grammar book)\n\n\n\r\nRUBYHATCHET : That example using からして actually exists in the Kanzen Master book and my Japanese friend insists it is grammatically correct."
    html: "Isn't the definition closer to, 'In particular'.<br/>\r\nIt seems to me after all that this grammar is used to highlight one thing out of a group to describe something or use as an example. I think it could also be written as 'for a start' in some examples.<br/>\n<br/>\r\n\"田舎は空気からして違う。\" The countryside, in particular the air is different.<br/>\n<br/>\r\n\"彼は礼儀を知らない　挨拶からして、きちんとしていない。\"<br/>\r\nHe doesn't have any manners, for a start he never greets people properly.<br/>\n<br/>\r\n(all example taken from Kanzen Master level 2 Green Grammar book)<br/>\n<br/>\r\nRUBYHATCHET : That example using からして actually exists in the Kanzen Master book and my Japanese friend insists it is grammatically correct."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: rubyhatchet
    text: "KADOKE66: Thinking about it again, you're right. I'm still not sure if \"judging by/from\" is a good translation into English because of the \"judging\" part. Just using \"by\" or \"given\" works well, such as \"by the feel of it (その感じからして).\" However, からして in example #3222 should and does make grammatical and practical sense in Japanese. Something like, \"Given his physical condition, he can't handle sports.\"\n\n\n\r\nIn ＡからしてＢ, Ａ has to be an example of extremely basic or \"at the very least,\" while Ｂ gives the meaning of \"because of Ａ, anything above that is 〜.\"\n\n\n\r\nI tried to include a couple more examples like #3222 to illustrate the two meanings you pointed out."
    html: "KADOKE66: Thinking about it again, you're right. I'm still not sure if \"judging by/from\" is a good translation into English because of the \"judging\" part. Just using \"by\" or \"given\" works well, such as \"by the feel of it (その感じからして).\" However, からして in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=karashite#3222\">#3222</a></b> should and does make grammatical and practical sense in Japanese. Something like, \"Given his physical condition, he can't handle sports.\"<br/>\n<br/>\r\nIn ＡからしてＢ, Ａ has to be an example of extremely basic or \"at the very least,\" while Ｂ gives the meaning of \"because of Ａ, anything above that is 〜.\"<br/>\n<br/>\r\nI tried to include a couple more examples like <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=karashite#3222\">#3222</a></b> to illustrate the two meanings you pointed out."
