notes:
  - position: 0
    text: "This grammar should be used to refer to extremely basic things. For example, \"He cannot even read hiragana.\" If you were to say, \"He would eat even rats,\" then you need a different bit of grammar (see さえ).\n\n\n\r\nAlso, this grammar can only be used with nouns!"
    html: "This grammar should be used to refer to extremely basic things. For example, \"He cannot even read hiragana.\" If you were to say, \"He would eat even rats,\" then you need a different bit of grammar (see さえ).<br/>\n<br/>\r\nAlso, this grammar can only be used with nouns!"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "I wouldn't add a third meaning to this, but according to \"A dictionary of Japanese Particles\", p65, it is translated in a different manner. Like in \"Starting with...\".\n\n\n\r\nThe whole meaning would be: \"Cites one characteristic of something/someone in order to make an emphatic statement about the whole thing/person.\" \n\n\n\r\nSo what I concluded so far, is that it belongs to the first meaning but translated in another way. Here a couple of sentences:\n\n\n\r\nExample:\n\r\n(1.1) あの男の人は顔つきからしてちょっと変だ。 - Starting with his face, he is a little strange.\n\r\n(1.2) 彼女は持ち物からして贅沢だ。- Starting with her possessions, she is extravagant."
    html: "I wouldn't add a third meaning to this, but according to \"A dictionary of Japanese Particles\", p65, it is translated in a different manner. Like in \"Starting with...\".<br/>\n<br/>\r\nThe whole meaning would be: \"Cites one characteristic of something/someone in order to make an emphatic statement about the whole thing/person.\" <br/>\n<br/>\r\nSo what I concluded so far, is that it belongs to the first meaning but translated in another way. Here a couple of sentences:<br/>\n<br/>\r\nExample:<br/>\r\n(1.1) あの男の人は顔つき<strong>からして</strong>ちょっと変だ。 - <strong>Starting with</strong> his face, he is a little strange.<br/>\r\n(1.2) 彼女は持ち物<strong>からして</strong>贅沢だ。- <strong>Starting with</strong> her possessions, she is extravagant."
    credits_raw: leonardo.stylish
