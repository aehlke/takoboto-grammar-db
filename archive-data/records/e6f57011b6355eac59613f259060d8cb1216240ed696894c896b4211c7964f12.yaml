    text: |-
      It's probably better to use からすると for example #3222. That grammar has the meaning of "judging by." Using からして is grammatically weird: "Even his physical condition can't do sports."
    html: |-
      It's probably better to use からすると for example <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=karashite#3222">#3222</a></b>. That grammar has the meaning of "judging by." Using からして is grammatically weird: "Even his physical condition can't do sports."
