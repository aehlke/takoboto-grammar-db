notes:
  - position: 0
    text: "＊This grammar is used to express a certain time or circumstances, NOT a place.\n\n\n\r\n＊All three versions of ところ are interchangeable grammatically, though nuance can differ.\n\n\n\r\nFORMATION:\n\r\nＶ(dict. form / たform / ているform) + ところ\n\r\nいＡ + ところ\n\r\nＮ + のところ"
    html: "＊This grammar is used to express a certain time or circumstances, NOT a place.<br/>\n<br/>\r\n＊All three versions of ところ are interchangeable grammatically, though nuance can differ.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(dict. form / たform / ているform) + ところ<br/>\r\nいＡ + ところ<br/>\r\nＮ + のところ"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "Generally speaking, the final particle in this grammar is interchangable with others, giving different nuance.\n\r\n[ところへ] emphasizes the process of getting to the given situation described by ところ such as XXXのところへ行った、\n\r\n[ところに] emphasizes the fact that you were at that given situation such as XXXのところに出くわした.\n\r\n[ところを] takes the situation described by ところ and provide the bridge to whatever was done to that siatuation, such as XXXのところを見られた"
    html: "Generally speaking, the final particle in this grammar is interchangable with others, giving different nuance.<br/>\r\n[ところへ] emphasizes the process of getting to the given situation described by ところ such as XXXのところへ行った、<br/>\r\n[ところに] emphasizes the fact that you were at that given situation such as XXXのところに出くわした.<br/>\r\n[ところを] takes the situation described by ところ and provide the bridge to whatever was done to that siatuation, such as XXXのところを見られた"
    credits_raw: claytonian
    source_id: null
    original_created_at: null
    original_updated_at: null
