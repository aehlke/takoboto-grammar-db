  - position: 6
    credits_raw: KWhazit
    text: "Another phrase I like to use when translating まさか is \"Don't tell me ... !\", though that doesn't work in every case.\n\n\n\r\nAnd a まさか phrase that doesn't translate literally is そのまさかだ！ (or the equivalent). Sometimes, when someone says, for example, まさか、(insert unlikely/unwelcome situation here)じゃないだろう？ (It COULDN'T be (situation), right?), the response is そのまさかだ！ (It IS that (situation)!). Try translating まさか itself directly in that case, and you're just asking for trouble."
    html: "Another phrase I like to use when translating まさか is \"Don't tell me ... !\", though that doesn't work in every case.<br/>\n<br/>\r\nAnd a まさか phrase that doesn't translate literally is そのまさかだ！ (or the equivalent). Sometimes, when someone says, for example, まさか、(insert unlikely/unwelcome situation here)じゃないだろう？ (It COULDN'T be (situation), right?), the response is そのまさかだ！ (It IS that (situation)!). Try translating まさか itself directly in that case, and you're just asking for trouble."
    source_id: null
    original_created_at: null
    original_updated_at: null
