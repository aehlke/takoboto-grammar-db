    credits_raw: deweychetham
    text: "真逆 [まさか] (adv) (uk) by no means, (P)\n\r\nまさか (adv) never!, well, I never!, you don't say!\n\r\nLiterally:\n\r\n真 [ま] (n,pref) just, right, due (east), pure, genuine, true, (P)\n\r\n逆 [ぎゃく] (adj-na,n) reverse, opposite, (P)\n\r\n逆さ [さかさ] (n) reverse, inversion, upside down, (P)\n\r\nIn English: \"directly opposite\""
    html: "真逆 [まさか] (adv) (uk) by no means, (P)<br/>\r\nまさか (adv) never!, well, I never!, you don't say!<br/>\r\nLiterally:<br/>\r\n真 [ま] (n,pref) just, right, due (east), pure, genuine, true, (P)<br/>\r\n逆 [ぎゃく] (adj-na,n) reverse, opposite, (P)<br/>\r\n逆さ [さかさ] (n) reverse, inversion, upside down, (P)<br/>\r\nIn English: \"directly opposite\"<br/>\n<br/>\n<br/>"
    source_id: null
    original_created_at: null
