  - position: 3
    credits_raw: nhk9
    text: "I think using only まさか can have the connotation of \"no way\"... the \"nai\" is often left unsaid.  \n\n\n\r\nex:\n\r\nA: 彼がもう結婚しちゃったって\n\r\nB: まさか(そういうことあるわけないだろう)"
    html: "I think using only まさか can have the connotation of \"no way\"... the \"nai\" is often left unsaid.  <br/>\n<br/>\r\nex:<br/>\r\nA: 彼がもう結婚しちゃったって<br/>\r\nB: まさか(そういうことあるわけないだろう)"
    source_id: null
