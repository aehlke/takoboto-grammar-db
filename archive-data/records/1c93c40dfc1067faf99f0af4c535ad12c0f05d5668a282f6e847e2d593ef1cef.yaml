    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: "I agree with nhk9さん、but i think that should be under the entry of まさか／まさか〜ないだろう\n\r\nwhich literally \" it can't be that 〜,right?\"\n\n\n\r\nまさか〜とは思わなかった　should deserve a different entry , since it literally means \n\r\n\"Didn't expect 〜(to be) \""
    html: "I agree with nhk9さん、but i think that should be under the entry of まさか／まさか〜ないだろう<br/>\r\nwhich literally \" it can't be that 〜,right?\"<br/>\n<br/>\r\nまさか〜とは思わなかった　should deserve a different entry , since it literally means <br/>\r\n\"Didn't expect 〜(to be) \""
    source_id: null
