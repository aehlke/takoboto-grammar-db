comments:
  - position: 0
    credits_raw: KWhazit
    text: "Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (#6485), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.\n\n\n\r\nI also have to call #5470 and #5471 into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me."
    html: "Using ってば tends to mean that the speaker is fairly annoyed. Taking the example I added from Chrono Trigger (<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tte+ba#6485\">#6485</a></b>), the character (whose actual name is マールディア) HATES formality and is SICK of being called by her full name and title. ってば should be used sparingly, unless you're Naruto, who tacks ってばよ！ onto every other sentence for no apparent reason.<br/>\n<br/>\r\nI also have to call <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tte+ba#5470\">#5470</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tte+ba#5471\">#5471</a></b> into question... the first looks like it's missing a だって思った or something similar, and the second just doesn't make any sense to me."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: cone
    text: |-
      One of my Japanese mentors says that ってば actually sounds sort of feminine, I forget why exactly, though.  Adding よ to the end of ってば, as in what Naruto says, is probably just a way to make ってば sound more masculine.
