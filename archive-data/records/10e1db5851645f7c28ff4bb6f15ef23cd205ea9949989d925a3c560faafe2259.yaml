notes:
  - position: 0
    text: "Verb in volitional form (意向形)+と+思う is used to inform the interlocutor of the speaker's intention.\n\r\n思う/思います is used to express this intention in the moment the speaker is speaking.\n\r\n思っている/思っています is used to express that the decision of the speaker have been taken sometimes ago, but is still valid now.\n\r\nと思っている may be use to express the intention of a third person."
    html: "Verb in volitional form (意向形)+と+思う is used to inform the interlocutor of the speaker's intention.<br/>\r\n思う/思います is used to express this intention in the moment the speaker is speaking.<br/>\r\n思っている/思っています is used to express that the decision of the speaker have been taken sometimes ago, but is still valid now.<br/>\r\nと思っている may be use to express the intention of a third person."
