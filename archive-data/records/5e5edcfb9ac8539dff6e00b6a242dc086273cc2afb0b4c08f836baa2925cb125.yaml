  - position: 2
    credits_raw: bamboo4
    text: "ex #5490   かれはかれのかみをブロンド染まった is weird. 彼は髪をブロンドに染めた is acceptable. 染まる is intransitive verb. 彼の髪はブロンドに染まった would be okay.\n\r\nかれはかれの is simply redundant for Japanese."
    html: "ex <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=somaru#5490\">#5490</a></b>   かれはかれのかみをブロンド染まった is weird. 彼は髪をブロンドに染めた is acceptable. 染まる is intransitive verb. 彼の髪はブロンドに染まった would be okay.<br/>\r\nかれはかれの is simply redundant for Japanese.<br/>"
