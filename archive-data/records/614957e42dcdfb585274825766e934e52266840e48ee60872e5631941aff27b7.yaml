comments:
  - position: 0
    credits_raw: dc
    text: "DC>\n\r\nQ: does this\n\r\n　　行きたい＿という＿ことを聞いた\n\r\nconstruct put more emphasis than just using a simple verb ending\n\r\n　　行きたい＿そうです\n\r\nI guess you can't use the second form to indicate exactly -who- you heard it from...or can you?\n\r\n　　トムから、(あなたは）フランスに　行きたい　そうです\n\n\n\r\nMiki>\n\r\nトムから聞いたけ（れ）ど、フランスに 行きたいそうです ね。\n\r\nMaybe it would be the same sentence in English.... \n\n\n\r\nbamboo4>\n\r\nということを聞いた would indicate what precedes that phrase is a hearsay, while そうです would indicate your view of what someone wants to do."
    html: "DC&gt;<br/>\r\nQ: does this<br/>\r\n　　行きたい＿という＿ことを聞いた<br/>\r\nconstruct put more emphasis than just using a simple verb ending<br/>\r\n　　行きたい＿そうです<br/>\r\nI guess you can't use the second form to indicate exactly -who- you heard it from...or can you?<br/>\r\n　　トムから、(あなたは）フランスに　行きたい　そうです<br/>\n<br/>\r\nMiki&gt;<br/>\r\nトムから聞いたけ（れ）ど、フランスに 行きたいそうです ね。<br/>\r\nMaybe it would be the same sentence in English.... <br/>\n<br/>\r\nbamboo4&gt;<br/>\r\nということを聞いた would indicate what precedes that phrase is a hearsay, while そうです would indicate your view of what someone wants to do."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: your name
    text: "As for the first example, the Japanese is not natural.　I would say あなたが酒嫌い だと 聞いた。 \n\r\nOr あなたが　酒が好きでない／酒嫌いである　ということを 聞いた。"
    html: "As for the first example, the Japanese is not natural.　I would say あなたが酒嫌い だと 聞いた。 <br/>\r\nOr あなたが　酒が好きでない／酒嫌いである　ということを 聞いた。"
    source_id: null
