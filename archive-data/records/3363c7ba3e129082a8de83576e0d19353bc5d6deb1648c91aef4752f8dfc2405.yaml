    japanese: 医者なら誰でも君に禁煙するように言うだろう。
    body_text: "医者なら誰でも君に禁煙するように言うだろう。 \n\n\t\tAny doctor will tell you to quit smoking."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ医者なら誰でも君に禁煙するように言うだろう。\">\n\t\t\t\t医者なら誰でも君に禁煙する<strong>ように言う</strong>だろう。<strong></strong></a> <br/>\n\t\tAny doctor will tell you to quit smoking. \n\t\t<strong> </strong>"
