    body_text: "医者は彼に酒を控えるように忠告した。 \n\n\t\tThe doctor \n\t\tadvised him \n\t\tto keep away from drinking."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ医者は彼に酒を控えるように忠告した。\">\n\t\t\t\t医者は彼に酒を控える<strong>ように忠告</strong>した。<strong></strong></a> <br/>\n\t\tThe doctor \n\t\t<strong>advised him </strong>\n\t\tto keep away from drinking."
