  - source_id: 3894
    position: 3
    japanese: 私は図書館の職員に金曜日締め切りのレポートのためにその本が必要だと言った。そうしたら彼女は借りている人に返却を求めるように言うと言った。
    body_text: "私は図書館の職員に金曜日締め切りのレポートのためにその本が必要だと言った。そうしたら彼女は借りている人に返却を求めるように言うと言った。\r \n\n\t\tI told the librarian that I needed the book for a report due on Friday; so she said she would call it in."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私は図書館の職員に金曜日締め切りのレポートのためにその本が必要だと言った。そうしたら彼女は借りている人に返却を求めるように言うと言った。\">\n\t\t\t\t私は図書館の職員に金曜日締め切りのレポートのためにその本が必要だと言った。そうしたら彼女は借りている人に返却を求める<strong>ように言う</strong>と言った。\r<strong></strong></a> <br/>\n\t\tI told the librarian that I needed the book for a report due on Friday; so she said she would call it in. \n\t\t<strong> </strong>"
