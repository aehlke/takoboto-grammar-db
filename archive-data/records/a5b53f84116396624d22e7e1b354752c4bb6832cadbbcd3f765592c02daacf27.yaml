  - position: 6
    credits_raw: bamboo4
    text: "どうして来るのですか。招待していなのに。\n\r\nWhy do you come?\n\n\n\r\nThe above is rather ambiguous. The English translation should be \"Why do you want to come,even when not invited.\" \n\n\n\r\nBesides, the expression is pretty rude. Consider: どうしてお出でになりたいのですか、ご招待申しあげてもいませんのに."
    html: "どうして来るのですか。招待していなのに。<br/>\r\nWhy do you come?<br/>\n<br/>\r\nThe above is rather ambiguous. The English translation should be \"Why do you want to come,even when not invited.\" <br/>\n<br/>\r\nBesides, the expression is pretty rude. Consider: どうしてお出でになりたいのですか、ご招待申しあげてもいませんのに."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 7
    credits_raw: tigert
    text: "bamboo\n\n\n\r\nI have never said \"why do you want to come, even when not invited\" in my entire life. (native English speaker)\n\n\n\r\nA natural translation would be \"Why are you coming? I didn`t invite you.\" \n\n\n\r\nEnglish is a little more direct than Japanese. translating a phrase word for word never sounds natural."
    html: "bamboo<br/>\n<br/>\r\nI have never said \"why do you want to come, even when not invited\" in my entire life. (native English speaker)<br/>\n<br/>\r\nA natural translation would be \"Why are you coming? I didn`t invite you.\" <br/>\n<br/>\r\nEnglish is a little more direct than Japanese. translating a phrase word for word never sounds natural."
