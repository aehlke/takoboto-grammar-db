    text: "I don't know if it help you lean 来る conjugation. It is also said to be カ行の三段 in a dictionary but I leant as カ行変格活用 at school as a child.\n\r\n「こ・き・くる・くる・くれ・こい」\n\r\n来ない・来ます・来る。・来るとき・来れば・来い！"
