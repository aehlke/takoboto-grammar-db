  - position: 7
    credits_raw: godfrey
    text: |-
      I disagree with bamboo4 and　誠.  I think that the given definition itself is too restrictive and wrong.  The literal meaning of #4233 could be more accurately described as "sympathy (for that person) DOES NOT MATCH the reality (of what that person has done) = sympathy is not warranted in this case."  I think that #3680 should stay, because it shows the diversity and the true basic spirit of this expression.  That is, all examples here have the meaning of something "not matching,"  "being off the mark" or "not appropriate."  I think we should change the definition since it is misleading.
    html: |-
      I disagree with bamboo4 and　誠.  I think that the given definition itself is too restrictive and wrong.  The literal meaning of <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=niataranai#4233">#4233</a></b> could be more accurately described as "sympathy (for that person) DOES NOT MATCH the reality (of what that person has done) = sympathy is not warranted in this case."  I think that <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=niataranai#3680">#3680</a></b> should stay, because it shows the diversity and the true basic spirit of this expression.  That is, all examples here have the meaning of something "not matching,"  "being off the mark" or "not appropriate."  I think we should change the definition since it is misleading.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 8
    credits_raw: bamboo4
    text: |-
      当たる in #3680 does not mean "match" but it really means phyisical striking like an arrow hitting the target. The other examples of あたる does not have that physical meaning. While I agree that the definition is not appropriate, I still think #3680 stands alone here.
    html: |-
      当たる in <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=niataranai#3680">#3680</a></b> does not mean "match" but it really means phyisical striking like an arrow hitting the target. The other examples of あたる does not have that physical meaning. While I agree that the definition is not appropriate, I still think <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=niataranai#3680">#3680</a></b> stands alone here.<br/>
