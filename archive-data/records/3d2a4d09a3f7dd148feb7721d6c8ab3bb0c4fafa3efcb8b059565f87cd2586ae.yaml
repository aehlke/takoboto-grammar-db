notes:
  - position: 0
    text: "あ-Stem + ず\n\n\n\r\nIt means _without_, it is formed by the \x01 + zu\" and means \"without doing\".\n\n\n\r\n\"~zu ni\" is the same as \"~nai de\"."
    html: "<br/>\r\nあ-Stem + ず<br/>\n<br/>\r\nIt means _without_, it is formed by the <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> + zu\" and means \"without doing\".<br/>\n<br/>\r\n\"~zu ni\" is the same as \"~nai de\"."
    credits_raw: cup
    source_id: null
    original_created_at: null
    original_updated_at: null
