    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ試合に勝ったのにもまして、全力を出し切れたことを誇りに思う\">\n\t\t\t\t試合に勝ったの<strong>にもまして</strong>、全力を出し切れたことを誇りに思う\r<strong></strong></a> <br/>\n\t\tMore than winning the match, i think we can be proud that we really gave it our all \n\t\t<strong> </strong>"
