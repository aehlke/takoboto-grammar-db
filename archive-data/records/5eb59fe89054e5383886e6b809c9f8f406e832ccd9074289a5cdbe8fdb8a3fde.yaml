  - position: 2
    text: "あの (ano) and その (sono) are similar. However, ano is used for objects- people, places...and same with sono.\n\n\n\r\nAno however is for a thing far away from both the speaker and listener.\n\n\n\r\nMeanwhile, sono is for something close to the listener but not close to the speaker."
    html: "あの (ano) and その (sono) are similar. However, ano is used for objects- people, places...and same with sono.<br/>\n<br/>\r\nAno however is for a thing far away from both the speaker and listener.<br/>\n<br/>\r\nMeanwhile, sono is for something close to the listener but not close to the speaker."
