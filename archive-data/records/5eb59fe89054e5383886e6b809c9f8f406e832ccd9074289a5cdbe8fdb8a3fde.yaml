  - position: 3
    credits_raw: walter
    text: 'ex 6194: Wouldn''t the use of お父さん mean that　わたしの is redundant?'
    html: 'ex 6194: Wouldn''t the use of お父さん mean that　わたしの is redundant?'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: KWhazit
    text: "In response to walter's questions:\n\r\n-There are several ways of Romanizing Japanese. Depending on the system you use, かのじょ could be either 'kanojo' or 'kanojyo'. Miki's point is that it's not 'kanojou' because there's no う on the end.\n\r\n-As for the second question...\n\r\n...first off, you can use お父さん to talk about other people's fathers:\n\r\nみちこのお父さんは親切です。 - Michiko's father is kind.\n\r\n...and secondly, if you're being formal (which the example seems to be), you'd normally us 父 (ちち) to refer to your own father. But that's not stopping anyone in more casual speech, though I think there's a tendency to drop the お in that case:\n\r\n父さんに部屋を掃除させられちゃった…\n\r\nI got forced to clean my room by my dad..."
    html: "In response to walter's questions:<br/>\r\n-There are several ways of Romanizing Japanese. Depending on the system you use, かのじょ could be either 'kanojo' or 'kanojyo'. Miki's point is that it's not 'kanojou' because there's no う on the end.<br/>\r\n-As for the second question...<br/>\r\n...first off, you can use お父さん to talk about other people's fathers:<br/>\r\nみちこのお父さんは親切です。 - Michiko's father is kind.<br/>\r\n...and secondly, if you're being formal (which the example seems to be), you'd normally us 父 (ちち) to refer to your own father. But that's not stopping anyone in more casual speech, though I think there's a tendency to drop the お in that case:<br/>\r\n父さんに部屋を掃除させられちゃった…<br/>\r\nI got forced to clean my room by my dad..."
    source_id: null
    original_created_at: null
    original_updated_at: null
