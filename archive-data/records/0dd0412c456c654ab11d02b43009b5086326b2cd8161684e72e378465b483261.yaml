  - position: 2
    text: "(X) + tomonaruto is used when a situation or thing expressed by (X) is perceived as special. This meaning comes from the use of the particle mo as in:\n\r\na. 夜も更けていた (It was late at night)\n\r\nb. 夏も終わってしまった (Summer is over now)\n\n\n\r\nNote that the speaker feels special about yoru \"night\" in a. or natsu \"summer\" in b.\n\n\n\r\nmo can be omitted from tomonaruto but it takes away the special significance\n\n\n\r\n(Advanced Grammar Dictionary, p403)"
    html: "(X) + tomonaruto is used when a situation or thing expressed by (X) is perceived as special. This meaning comes from the use of the particle mo as in:<br/>\r\na. 夜も更けていた (It was late at night)<br/>\r\nb. 夏も終わってしまった (Summer is over now)<br/>\n<br/>\r\nNote that the speaker feels special about yoru \"night\" in a. or natsu \"summer\" in b.<br/>\n<br/>\r\nmo can be omitted from tomonaruto but it takes away the special significance<br/>\n<br/>\r\n(Advanced Grammar Dictionary, p403)"
    credits_raw: LR
    source_id: null
    original_created_at: null
