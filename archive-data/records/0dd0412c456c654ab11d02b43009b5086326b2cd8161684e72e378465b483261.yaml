examples:
  - source_id: 7232
    position: 0
    japanese: プロともなると体つきが変わってくるというが、目の前の彼女のきゃしゃで凛とした立ち姿からは、とても激しいダンスを一人で踊り通す人のようには見えない。
    body_text: "プロともなると体つきが変わってくるというが、目の前の彼女のきゃしゃで凛とした立ち姿からは、とても激しいダンスを一人で踊り通す人のようには見えない。 \n\nWhen you become \n\t\ta professional dancer, certain characteristics appear on your body, but looking at Kimura with her slim upright figure, she doesn't look like the vigorous dancing type."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJプロともなると体つきが変わってくるというが、目の前の彼女のきゃしゃで凛とした立ち姿からは、とても激しいダンスを一人で踊り通す人のようには見えない。\">\n\t\t\t\tプロ<strong>ともなると</strong>体つきが変わってくるというが、目の前の彼女のきゃしゃで凛とした立ち姿からは、とても激しいダンスを一人で踊り通す人のようには見えない。<strong></strong></a> <br/>\n<strong>When you become </strong>\n\t\ta professional dancer, certain characteristics appear on your body, but looking at Kimura with her slim upright figure, she doesn't look like the vigorous dancing type."
    credits_raw: mdobrin
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7862
    position: 1
    japanese: 大学へ進学するともなると、学問、バイト、サークルなど、人それぞれのライフスタイルができてくる。
    body_text: "大学へ進学するともなると、学問、バイト、サークルなど、人それぞれのライフスタイルができてくる。 \n\nWhen \n\t\tyou enter college, each of you will develop your own lifestyle, with studies, work and club activities."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ大学へ進学するともなると、学問、バイト、サークルなど、人それぞれのライフスタイルができてくる。\">\n\t\t\t\t大学へ進学する<strong>ともなると</strong>、学問、バイト、サークルなど、人それぞれのライフスタイルができてくる。<strong></strong></a> <br/>\n<strong>When </strong>\n\t\tyou enter college, each of you will develop your own lifestyle, with studies, work and club activities."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7863
