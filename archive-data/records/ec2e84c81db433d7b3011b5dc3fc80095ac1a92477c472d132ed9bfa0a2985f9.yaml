  - position: 2
    text: "NOUN ((or nominalized phrase)) + をものともせずに\n\r\nSometimes the に is omitted"
    html: "NOUN ((or nominalized phrase)) + をものともせずに<br/>\r\nSometimes the に is omitted"
    credits_raw: LR
