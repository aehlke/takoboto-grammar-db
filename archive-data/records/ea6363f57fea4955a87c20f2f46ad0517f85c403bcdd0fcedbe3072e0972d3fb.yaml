  - position: 1
    text: "〜つつ(1)\n\r\n「Ａつつ、Ｂ」: A and B are done simultaneously.\n\r\n＊This expression is more \"solid\" than ながら. See examples #6213, #6214, and #6215.\n\r\nFORMATION:\n\r\nＶ(minus ます) + つつ\n\n\n\r\n〜つつ(2)・つつも\n\r\n＊This expression is used alongside negative emotions. The forms used most often include: 「〜と思いつつ」 and 「〜と知りつつ」. See examples #6216, #6217, and #6218.\n\r\nFORMATION:\n\r\nＶ(minus ます) + つつ・つつも"
    html: "〜つつ(1)<br/>\r\n「Ａつつ、Ｂ」: A and B are done simultaneously.<br/>\r\n＊This expression is more \"solid\" than ながら. See examples <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6213\">#6213</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6214\">#6214</a></b>, and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6215\">#6215</a></b>.<br/>\r\nFORMATION:<br/>\r\nＶ(minus ます) + つつ<br/>\n<br/>\r\n〜つつ(2)・つつも<br/>\r\n＊This expression is used alongside negative emotions. The forms used most often include: 「〜と思いつつ」 and 「〜と知りつつ」. See examples <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6216\">#6216</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6217\">#6217</a></b>, and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tsutsu#6218\">#6218</a></b>.<br/>\r\nFORMATION:<br/>\r\nＶ(minus ます) + つつ・つつも"
    credits_raw: rubyhatchet
