      ところを ([ところを] )(tokorowo)
          Meaning: despite a certain time / despite a certain situation 〜時（なの）に・状況（なの）に　・相手の状況を配慮する阜ｻとして、話の前置きに用いることも多い。
          Example: Thank you for seeing me despite being so busy.
