    body_text: "赤ちゃんは, もうすぐ笑うようになる。 \n\n\t\tThe baby will soon reach the point where he will smile."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ赤ちゃんは, もうすぐ笑うようになる。\">\n\t\t\t\t赤ちゃんは, もうすぐ笑うようになる。<strong></strong><strong></strong></a> <br/>\n\t\tThe baby will soon reach the point where he will smile. \n\t\t<strong> </strong>"
