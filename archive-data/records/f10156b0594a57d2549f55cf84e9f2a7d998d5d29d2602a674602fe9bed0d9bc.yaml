notes:
  - position: 0
    text: "Not normally used in speech. A more formal, written word for letters and whatnot.  Explains the reason for something with the sense that it is precisely because of (person,thing) that(  ). \n\r\n昼間はにぎやかなこの道も、早朝のこととてあたりに犬一匹いなかった。\n\r\nBecause it was early in the morning, there wasn't even a dog around this street that is so lively during the day.\n\r\n〜のことだから、〜のことなので　kotodakara"
    html: "Not normally used in speech. A more formal, written word for letters and whatnot.  Explains the reason for something with the sense that it is precisely because of (person,thing) that(  ). <br/>\r\n昼間はにぎやかなこの道も、早朝のこととてあたりに犬一匹いなかった。<br/>\r\nBecause it was early in the morning, there wasn't even a dog around this street that is so lively during the day.<br/>\r\n〜のことだから、〜のことなので　<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotodakara\">kotodakara</a></b>"
    credits_raw: crlane
