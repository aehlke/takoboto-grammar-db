    body_text: "今回の転勤は急なこととて、ゆっくりに挨拶にも伺えませんでした。 \n\n\t\tI could not stop by to say hello \n\t\tbecause \n\t\tthe current change of job was so hurried."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ今回の転勤は急なこととて、ゆっくりに挨拶にも伺えませんでした。\">\n\t\t\t\t今回の転勤は急な<strong>こととて、</strong>ゆっくりに挨拶にも伺えませんでした。<strong></strong></a> <br/>\n\t\tI could not stop by to say hello \n\t\t<strong>because </strong>\n\t\tthe current change of job was so hurried."
