notes:
  - position: 0
    text: "Strictly speaking, the conjugations of 得る are:\n\r\n- negative: えない\n\r\n- masu form: えます\n\r\n- te form: えて\n\r\n- terminal form (i.e. at the end of sentences, or when attaching to べき): える／うる\n\r\n- attributive form (i.e. akin to such things as すきな for すき; used when attaching to nouns): うる\n\r\n- conditional form: うれば\n\n\n\r\nIt is the only 二段 (nidan) verb from old Japanese that hasn't fully become an 一段 (ichidan) verb in modern Japanese.  (える／うる in old Japanese was う, so it has changed a little already.)\n\n\n\r\nIn summary, although うる is a more archaic way of saying える, the only time you can choose between える／うる is when it comes at the end of the sentence, or when attaching to べき (in which case, however, うる is also preferable due to the also archaic nature of べき).  This means one should say for example うるために, うるように, うること, うるところ and so on.  Additionally, ありうる is never ありえる.\n\n\n\r\nHowever, in practice, the \"wrong\" forms are still somewhat often used."
    html: "Strictly speaking, the conjugations of 得る are:<br/>\r\n- negative: えない<br/>\r\n- masu form: えます<br/>\r\n- te form: えて<br/>\r\n- terminal form (i.e. at the end of sentences, or when attaching to べき): える／うる<br/>\r\n- attributive form (i.e. akin to such things as すきな for すき; used when attaching to nouns): うる<br/>\r\n- conditional form: うれば<br/>\n<br/>\r\nIt is the only 二段 (nidan) verb from old Japanese that hasn't fully become an 一段 (ichidan) verb in modern Japanese.  (える／うる in old Japanese was う, so it has changed a little already.)<br/>\n<br/>\r\nIn summary, although うる is a more archaic way of saying える, the only time you can choose between える／うる is when it comes at the end of the sentence, or when attaching to べき (in which case, however, うる is also preferable due to the also archaic nature of べき).  This means one should say for example うるために, うるように, うること, うるところ and so on.  Additionally, ありうる is never ありえる.<br/>\n<br/>\r\nHowever, in practice, the \"wrong\" forms are still somewhat often used."
