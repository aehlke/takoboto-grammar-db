notes:
  - position: 0
    text: "toshiteha always follows a noun, whereas warini can be used after a noun or adjective\n\r\n<font color=red>\n\r\nnoun + toshite ha\n\r\nnoun + no wari ni\n\r\n</font>\n\r\n先生としては、若いです。\n\r\n先生<b>の</b>割りに、若いです\n\r\nfor a teacher, he is young\n\n\n\r\n<font color=red>\n\r\nadj +  warini\n\r\n</font>\n\r\nOK○　高い割りに、不味かった\n\r\nfor the expensive price, it wasnt very tasty\n\n\n\r\nNG×　高いとしては、不味かった　\n\r\ncannot use toshiteha after adjective"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toshiteha\">toshiteha</a></b> always follows a noun, whereas <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=warini\">warini</a></b> can be used after a noun or adjective<br/>\r\n&lt;font color=red&gt;<br/>\r\nnoun + toshite ha<br/>\r\nnoun + no wari ni<br/>\r\n&lt;/font&gt;<br/>\r\n先生としては、若いです。<br/>\r\n先生&lt;b&gt;の&lt;/b&gt;割りに、若いです<br/>\r\nfor a teacher, he is young<br/>\n<br/>\r\n&lt;font color=red&gt;<br/>\r\nadj +  warini<br/>\r\n&lt;/font&gt;<br/>\r\nOK○　高い割りに、不味かった<br/>\r\nfor the expensive price, it wasnt very tasty<br/>\n<br/>\r\nNG×　高いとしては、不味かった　<br/>\r\ncannot use toshiteha after adjective<br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "toshiteha and warini imply that something is odd or unexpected. toshite and nitotte do not really have such an implication.\n\n\n\r\nComparison:\n\r\n敏之としては、数学が上手です。\n\r\nFor Toshiyuki, he is good at math.\n\r\nとしては implies, perhaps, that Toshiyuki is usually bad at any academics, so it is odd that he is good at math. So the meaning might be, \"for someone as stupid as Toshiyuki, it's amazing that he's actually good at math.\"\n\n\n\r\n敏之にとって、数学が上手です。\n\r\nFor Toshiyuki, he is good at math.\n\r\nにとって implies that Toshiyuki is normally good at math. So the meaning might be, \"Toshiyuki is good at math, but we kinda all knew that already.\""
    html: "toshiteha and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=warini\">warini</a></b> imply that something is odd or unexpected. <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toshite\">toshite</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitotte\">nitotte</a></b> do not really have such an implication.<br/>\n<br/>\r\nComparison:<br/>\r\n敏之としては、数学が上手です。<br/>\r\nFor Toshiyuki, he is good at math.<br/>\r\nとしては implies, perhaps, that Toshiyuki is usually bad at any academics, so it is odd that he is good at math. So the meaning might be, \"for someone as stupid as Toshiyuki, it's amazing that he's actually good at math.\"<br/>\n<br/>\r\n敏之にとって、数学が上手です。<br/>\r\nFor Toshiyuki, he is good at math.<br/>\r\nにとって implies that Toshiyuki is normally good at math. So the meaning might be, \"Toshiyuki is good at math, but we kinda all knew that already.\""
    credits_raw: gtunak85
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "＊This is a compound particle which indicates a standard for comparisons.\n\n\n\r\nFORMATION:\n\r\nＮ + としては\n\n\n\r\n＊Be careful! として (toshite) has a different connotation. See that entry for more."
    html: "＊This is a compound particle which indicates a standard for comparisons.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + としては<br/>\n<br/>\r\n＊Be careful! として (<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toshite\">toshite</a></b>) has a different connotation. See that entry for more."
