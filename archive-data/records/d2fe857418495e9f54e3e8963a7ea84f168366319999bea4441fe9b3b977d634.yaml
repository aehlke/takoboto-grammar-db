    text: '"about to" is also volitional form 彼女に電話をしようとしたところ、電話がかけて来た。 Just as I was about to ring her, the phone rang.'
    html: '"about to" is also volitional form 彼女に電話をしようとしたところ、電話がかけて来た。 Just as I was about to ring her, the phone rang.'
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "1. That's a 'たところ'\n\r\n2. I'd translate it as \"Just as I decided to phone her [...]\" because the 'とした' is past tense."
    html: "1. That's a 'たところ'<br/>\r\n2. I'd translate it as \"Just as I decided to phone her [...]\" because the 'とした' is past tense."
