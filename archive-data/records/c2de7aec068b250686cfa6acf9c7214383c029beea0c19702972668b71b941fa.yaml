    body_text: "「日本語は難しくありませんか。」「いえ、難しくないこともないんですが、日本語の難しさは強調されすぎていると思いますよ。」 \n\n\t\t\"Isn't Japanese difficult?\" \"Yes, it is difficult, but I think that the difficulty of Japanese is overemphasized.\""
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ「日本語は難しくありませんか。」「いえ、難しくないこともないんですが、日本語の難しさは強調されすぎていると思いますよ。」\">\n\t\t\t\t「日本語は難しくありませんか。」「いえ、難しくないこともないんですが、日本語の難しさは強調されすぎていると思いますよ。」<strong></strong><strong></strong></a> <br/>\n\t\t\"Isn't Japanese difficult?\" \"Yes, it is difficult, but I think that the difficulty of Japanese is overemphasized.\" \n\t\t<strong> </strong>"
