  - position: 4
    credits_raw: bamboo4
    text: |-
      The difference between 食べないこともない and 食べられないこともない is that the former is subjective and the latter is objective. 食べられない=it is normally not fit to eat. 食べられないこともない=it is not that [it is normally not fit to eat]. 食べない=The speaker does not eat. 食べないこともない=it is not that [speaker does not eat].
    html: |-
      The difference between 食べないこともない and 食べられないこともない is that the former is subjective and the latter is objective. 食べられない=it is normally not fit to eat. 食べられないこともない=it is not that [it is normally not fit to eat]. 食べない=The speaker does not eat. 食べないこともない=it is not that [speaker does not eat].<br/>
