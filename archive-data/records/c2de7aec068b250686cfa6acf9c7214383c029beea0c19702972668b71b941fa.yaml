    body_text: "「田中さんのふるさとは雪がたくさん降るところだから、スキーはお得意でしょう。」\r\n「ううん、できないことはないけど、もう何年もやってないから…」 \n\n\t\t\"The native place of Mr Tanaka is an area where much snow use to fall so it a good occasion for skiing I guess, don't you agree?\" \"No, \n\t\tit is not that \nI can't,  but there is a long time already that I don't go skiing...\""
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ「田中さんのふるさとは雪がたくさん降るところだから、スキーはお得意でしょう。」「ううん、できないことはない\">\n\t\t\t\t「田中さんのふるさとは雪がたくさん降るところだから、スキーはお得意でしょう。」\r\n「ううん、でき<strong>ないことはない</strong><strong></strong>けど、もう何年もやってないから…」</a> <br/>\n\t\t\"The native place of Mr Tanaka is an area where much snow use to fall so it a good occasion for skiing I guess, don't you agree?\" \"No, \n\t\t<strong>it is not that </strong>\nI can't,  but there is a long time already that I don't go skiing...\""
