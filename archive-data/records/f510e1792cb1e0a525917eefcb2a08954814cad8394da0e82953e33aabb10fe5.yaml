    body_text: "関東から東北にいたるまで \n\n\t\tFrom Kantou \n\t\tas far as \n\t\tTouhoku."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ関東から東北にいたるまで\">\n\t\t\t\t関東から東北<strong>にいたる</strong>まで<strong></strong></a> <br/>\n\t\tFrom Kantou \n\t\t<strong>as far as </strong>\n\t\tTouhoku."
