    original_updated_at: null
  - source_id: 3513
    position: 7
    japanese: 彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。
    body_text: "彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。\r \n\n\t\tThey have branches all over the world, from Calcutta to New York City."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼らは、カルカッタからニュウーヨーク市に至るまで、世界中に支部を持っている。\">\n\t\t\t\t彼らは、カルカッタからニュウーヨーク市<strong>に至る</strong>まで、世界中に支部を持っている。\r<strong></strong></a> <br/>\n\t\tThey have branches all over the world, from Calcutta to New York City. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3514
    position: 8
    japanese: 滅びに至る門は大きく、その道は広い。
    body_text: "滅びに至る門は大きく、その道は広い。\r \n\n\t\tFor the gate is wide and the way is easy, that leads to destruction."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ滅びに至る門は大きく、その道は広い。\">\n\t\t\t\t滅び<strong>に至る</strong>門は大きく、その道は広い。\r<strong></strong></a> <br/>\n\t\tFor the gate is wide and the way is easy, that leads to destruction. \n\t\t<strong> </strong>"
    credits_raw: dbx
