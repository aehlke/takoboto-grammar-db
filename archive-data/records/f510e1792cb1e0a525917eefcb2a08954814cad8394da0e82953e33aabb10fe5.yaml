  - source_id: 3507
    position: 1
    japanese: 義務の路は栄光に至る道であった。
    body_text: "義務の路は栄光に至る道であった。\r \n\n\t\tThe path of duty was the way to glory."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ義務の路は栄光に至る道であった。\">\n\t\t\t\t義務の路は栄光<strong>に至る</strong>道であった。\r<strong></strong></a> <br/>\n\t\tThe path of duty was the way to glory. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3508
    position: 2
    japanese: 公民権運動はある夢に至る。
    body_text: "公民権運動はある夢に至る。\r \n\n\t\tThe civil rights movement leads to a dream."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ公民権運動はある夢に至る。\">\n\t\t\t\t公民権運動はある夢<strong>に至る</strong>。\r<strong></strong></a> <br/>\n\t\tThe civil rights movement leads to a dream. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3509
    position: 3
    japanese: 重要なのはゴールではなく、そこに至る道程である。
    body_text: "重要なのはゴールではなく、そこに至る道程である。\r \n\n\t\tIt is not the goal but the way there that matters."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ重要なのはゴールではなく、そこに至る道程である。\">\n\t\t\t\t重要なのはゴールではなく、そこ<strong>に至る</strong>道程である。\r<strong></strong></a> <br/>\n\t\tIt is not the goal but the way there that matters. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
