  - source_id: 3510
    position: 4
    japanese: 昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。
    body_text: "昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。\r \n\n\t\tThe history of all hitherto existing society is the history of class struggles."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ昔から今に至るまで存在する、あらゆる社会の歴史は階級闘争の歴史である。\">\n\t\t\t\t昔から今<strong>に至る</strong>まで存在する、あらゆる社会の歴史は階級闘争の歴史である。\r<strong></strong></a> <br/>\n\t\tThe history of all hitherto existing society is the history of class struggles. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3511
    position: 5
    japanese: 宣戦布告に至るまでの時期はこのような状況であったと言える。
    body_text: "宣戦布告に至るまでの時期はこのような状況であったと言える。\r \n\n\t\tThus were affairs circumstanced in the period leading up to the declaration of war."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ宣戦布告に至るまでの時期はこのような状況であったと言える。\">\n\t\t\t\t宣戦布告<strong>に至る</strong>までの時期はこのような状況であったと言える。\r<strong></strong></a> <br/>\n\t\tThus were affairs circumstanced in the period leading up to the declaration of war. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3512
    position: 6
    japanese: 大事に至る前に火事は消し止められた。
    body_text: "大事に至る前に火事は消し止められた。\r \n\n\t\tThe fire was put out before it got serious."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ大事に至る前に火事は消し止められた。\">\n\t\t\t\t大事<strong>に至る</strong>前に火事は消し止められた。\r<strong></strong></a> <br/>\n\t\tThe fire was put out before it got serious. \n\t\t<strong> </strong>"
    credits_raw: dbx
