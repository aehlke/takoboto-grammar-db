    japanese: この道は公園に至る。
    body_text: "この道は公園に至る。 \n\n\t\tThis road goes to the park."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの道は公園に至る。\">\n\t\t\t\tこの道は公園<strong>に至る</strong>。<strong></strong></a> <br/>\n\t\tThis road goes to the park. \n\t\t<strong> </strong>"
