    japanese: 問題が起これば、学校だけで何とかしよう、外にはもらすまい。
    body_text: "問題が起これば、学校だけで何とかしよう、外にはもらすまい。 \n\n\t\tIf some trouble crops up, sort it out somehow or other in school - \n\t\tdon't let it \n\t\tleak outside."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ問題が起これば、学校だけで何とかしよう、外にはもらすまい。\">\n\t\t\t\t問題が起これば、学校だけで何とかしよう、外にはもらす<strong>まい</strong>。<strong></strong></a> <br/>\n\t\tIf some trouble crops up, sort it out somehow or other in school - \n\t\t<strong>don't let it </strong>\n\t\tleak outside."
    credits_raw: Amatuka
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 2896
