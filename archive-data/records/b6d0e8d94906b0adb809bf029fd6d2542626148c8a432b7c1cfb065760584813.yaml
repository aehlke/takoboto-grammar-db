    japanese: あいつはそこまではやるまい。
    body_text: "あいつはそこまではやるまい。 \n\n\t\tI \n\t\tdon't think \n\t\the would dare go that far."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあいつはそこまではやるまい。\">\nあいつはそこまではやる<strong>まい</strong>。<strong></strong></a> <br/>\n\t\tI \n\t\t<strong>don't think </strong>\n\t\the would dare go that far."
