    japanese: 窓を開けたとたんに小鳥が外へ逃げてしまった。
    body_text: "窓を開けたとたんに小鳥が外へ逃げてしまった。 \n\n\t\tThe small bird has run away to the outside as soon as having opened the window."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ窓を開けたとたんに小鳥が外へ逃げてしまった。\">\n\t\t\t\t窓を開け<strong>たとたん</strong>に小鳥が外へ逃げてしまった。<strong></strong></a> <br/>\n\t\tThe small bird has run away to the outside as soon as having opened the window. \n\t\t<strong> </strong>"
