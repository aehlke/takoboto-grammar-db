notes:
  - position: 0
    text: "I can't help doing ...\n\r\nI can't stop doing ...\n\n\n\r\nthese are both the same:\n\r\nverb+ ~zu ni ha irarenai\n\r\nverb+~nai de ha irarenai\n\n\n\r\n(eg sezuni is a contraction of shinai)"
    html: "I can't help doing ...<br/>\r\nI can't stop doing ...<br/>\n<br/>\r\nthese are both the same:<br/>\r\nverb+ ~zu ni ha irarenai<br/>\r\nverb+~nai de ha irarenai<br/>\n<br/>\r\n(eg sezuni is a contraction of shinai)"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "Not used for \"feeling\" something, where you should use tenaranai\n\n\n\r\n-- doing\n\r\nI can't help shopping\n\r\n買い物せずにはいられない\n\r\n買い物しないではいられない\n\n\n\r\n-- feeling\n\r\nI can't help feeling anxious\n\r\nNG: 私は不安しないではいられない\n\r\nOK: 私は不安でならない"
    html: "Not used for \"feeling\" something, where you should use <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tenaranai\">tenaranai</a></b><br/>\n<br/>\r\n-- doing<br/>\r\nI can't help shopping<br/>\r\n買い物せずにはいられない<br/>\r\n買い物しないではいられない<br/>\n<br/>\r\n-- feeling<br/>\r\nI can't help feeling anxious<br/>\r\nNG: 私は不安しないではいられない<br/>\r\nOK: 私は不安でならない <br/>"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
