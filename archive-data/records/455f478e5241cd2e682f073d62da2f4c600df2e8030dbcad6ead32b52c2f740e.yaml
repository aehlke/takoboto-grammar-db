    text: "can be used at the beginning of a setence:\n\r\nI think. Therefore I am.\n\r\n我思う。ゆえに我在り。"
    html: "can be used at the beginning of a setence:<br/>\r\nI think. Therefore I am.<br/>\r\n我思う。<strong>ゆえに</strong>我在り。"
