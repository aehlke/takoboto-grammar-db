    japanese: 彼女はその美貌の故に、悩みも多い。
    body_text: "彼女はその美貌の故に、悩みも多い。 \n\nBecause of \n\t\ther good looks, she also has many things to worry about."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女はその美貌の故に、悩みも多い。\">\n\t\t\t\t彼女はその美貌の<strong>故に</strong>、悩みも多い。<strong></strong></a> <br/>\n<strong>Because of </strong>\n\t\ther good looks, she also has many things to worry about."
