  - position: 1
    credits_raw: PaulO
    text: "Bamboo4, please excuse my ignorance - I'm a brit and I only found out the meaning of \"druthers\" in the The American Heritage Dictionary as a slang term for \"would rather\" from the 1800s.\n\n\n\r\nCan anyone suggest a less esoteric translation for どちらかと言えば - \"If it's all the same\" or \"above all else\" ????"
    html: "Bamboo4, please excuse my ignorance - I'm a brit and I only found out the meaning of \"druthers\" in the The American Heritage Dictionary as a slang term for \"would rather\" from the 1800s.<br/>\n<br/>\r\nCan anyone suggest a less esoteric translation for どちらかと言えば - \"If it's all the same\" or \"above all else\" ????"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: ドニー
    text: "I suppose you could say, \"If I had to say (one way or the other)\" or \"If I were to say...\"\n\n\n\r\nAs in, one way or the other.\n\n\n\r\nどちらかと言えば、彼女が作ったケーキはちょっと・・・\n\r\nIf I say which way is, she-made cake is a little...\n\n\n\r\n\"If I had to say one way or the other, the cake she made is a little...\"\n\n\n\r\nI think we use this sort of construction in English, too. We say, \"If I had to say...\" and then state an opinion or observation.\n\n\n\r\nIn the case of stating one's desire (If I had my druthers, I'd like to go to the beach) maybe we would say \"If I may say...\" or something of this nature.\n\n\n\r\nJust my two cents."
    html: "I suppose you could say, \"If I had to say (one way or the other)\" or \"If I were to say...\"<br/>\n<br/>\r\nAs in, one way or the other.<br/>\n<br/>\r\nどちらかと言えば、彼女が作ったケーキはちょっと・・・<br/>\r\nIf I say which way is, she-made cake is a little...<br/>\n<br/>\r\n\"If I had to say one way or the other, the cake she made is a little...\"<br/>\n<br/>\r\nI think we use this sort of construction in English, too. We say, \"If I had to say...\" and then state an opinion or observation.<br/>\n<br/>\r\nIn the case of stating one's desire (If I had my druthers, I'd like to go to the beach) maybe we would say \"If I may say...\" or something of this nature.<br/>\n<br/>\r\nJust my two cents."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Syintaex
    text: "Changed the English meaning from \"druthers\" to something more natural, namely \"if I had to say.\"\n\r\nPaulO, I'm an American and I've never heard this word in my entire life. It is considered to be very outdated and slightly unnatural.\n\r\nBamboo, I'm not sure where you're from, so I can't attest to whether or not you have used this word before, but please check with another English speaker when making an entry like this."
