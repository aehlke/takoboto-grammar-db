    credits_raw: Tetsuzan
    text: |-
      Can someone explain what are the nuances between:  にかけては・に関して・について？  Does にかけては have more of a competitive connotation?  I've seen most sentences with this grammar seem to have to do with competition or comparisons.
    html: |-
      Can someone explain what are the nuances between:  にかけては・に関して・について？  Does にかけては have more of a competitive connotation?  I've seen most sentences with this grammar seem to have to do with competition or comparisons.<br/>
      <br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: missshapoooo
    text: "About nuances between these 3 patterns. Firstly,に関して and について are absoulutely the same (=about, concerning) except for the former is used in formal speeches, reports, TV news, on paper etc. So when we speak, search, know...ABOUT smth we use them.\n\r\nSpeaking about にかけては it is more like についていえば. So yes, these three patterns can have the same meaning in case when we speak about N. But also the nuanse in first to patterns and にかけては is that in case of the latter one, after pattern there goes some statement concerning N, but in case of the former ones these patterns are just a conjucture for direct object (N)."
    html: "About nuances between these 3 patterns. Firstly,に関して and について are absoulutely the same (=about, concerning) except for the former is used in formal speeches, reports, TV news, on paper etc. So when we speak, search, know...ABOUT smth we use them.<br/>\r\nSpeaking about にかけては it is more like についていえば. So yes, these three patterns can have the same meaning in case when we speak about N. But also the nuanse in first to patterns and にかけては is that in case of the latter one, after pattern there goes some statement concerning N, but in case of the former ones these patterns are just a conjucture for direct object (N)."
    source_id: null
    original_created_at: null
