    body_text: "人がせっかく作ってくれた料理を食べないのは失礼だ。\r \n\n\t\tIt's impolite not to eat food which someone has taken the trouble of preparing for you.  (from An Integrated Approach to Intermediate Japanese)"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ人がせっかく作ってくれた料理を食べないのは失礼だ。\">\n\t\t\t\t人が<strong>せっかく</strong>作ってくれた料理を食べないのは失礼だ。\r<strong></strong></a> <br/>\n\t\tIt's impolite not to eat food which someone has taken the trouble of preparing for you.  (from An Integrated Approach to Intermediate Japanese) \n\t\t<strong> </strong>"
