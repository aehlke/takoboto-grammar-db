    body_text: "せっかく彼女に手紙を書いたのに、送るのを忘れちゃった。 \n\n\t\tI took the effort to write a letter to her and forgot to send it."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJせっかく彼女に手紙を書いたのに、送るのを忘れちゃった。\">\n<strong>せっかく</strong>彼女に手紙を書いたのに、送るのを忘れちゃった。<strong></strong></a> <br/>\n\t\tI took the effort to write a letter to her and forgot to send it. \n\t\t<strong> </strong>"
