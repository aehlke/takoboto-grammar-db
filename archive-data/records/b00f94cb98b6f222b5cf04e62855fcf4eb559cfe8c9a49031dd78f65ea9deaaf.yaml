  - position: 1
    text: "＊How to use this grammar as an adjective or adverb (works just like an い adjective): 「〜っぽい + Ｎ」 or 「〜っぽく + Ｖ」.\n\r\nExample: 子供っぽい人 [a childish person] \n\r\n子供っぽく見える [look childish]\n\n\n\r\nFORMATION:\n\r\nＶ(minus ます) + っぽい\n\r\nいＡ(minus い) + っぽい\n\r\nＮ + っぽい"
    html: "＊How to use this grammar as an adjective or adverb (works just like an い adjective): 「〜っぽい + Ｎ」 or 「〜っぽく + Ｖ」.<br/>\r\nExample: 子供っぽい人 [a childish person] <br/>\r\n子供っぽく見える [look childish]<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(minus ます) + っぽい<br/>\r\nいＡ(minus い) + っぽい<br/>\r\nＮ + っぽい"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
