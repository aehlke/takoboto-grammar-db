    japanese: 一日風邪で休んだだけなのに、机の上に書類が山積みになっている。
    body_text: "一日風邪で休んだだけなのに、机の上に書類が山積みになっている。\r \n\n\t\tI only missed one day of work because of a cold and my desk is piled high with papers."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ一日風邪で休んだだけなのに、机の上に書類が山積みになっている。\">\n\t\t\t\t一日風邪で休んだだけ<strong>なのに</strong>、机の上に書類が山積みになっている。\r<strong></strong></a> <br/>\n\t\tI only missed one day of work because of a cold and my desk is piled high with papers. \n\t\t<strong> </strong>"
