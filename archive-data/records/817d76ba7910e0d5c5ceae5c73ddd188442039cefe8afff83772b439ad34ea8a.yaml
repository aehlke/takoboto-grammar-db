    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJずっと歩いて来たとは、あなたは足が丈夫なのにちがいない。\">\n\t\t\t\tずっと歩いて来たとは、あなたは足が丈夫<strong>なのに</strong>ちがいない。\r<strong></strong></a> <br/>\n\t\tYou must be a good walker to have walked all the way. \n\t\t<strong> </strong>"
