    body_text: "ベンチに腰かけたとたんに、ペンキが塗りたてなのに気づいた。\r \n\n\t\tI had hardly sat down on the bench when I found it had just been painted."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJベンチに腰かけたとたんに、ペンキが塗りたてなのに気づいた。\">\n\t\t\t\tベンチに腰かけたとたんに、ペンキが塗りたて<strong>なのに</strong>気づいた。\r<strong></strong></a> <br/>\n\t\tI had hardly sat down on the bench when I found it had just been painted. \n\t\t<strong> </strong>"
