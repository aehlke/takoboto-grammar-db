notes:
  - position: 0
    text: "<b>を始め</b> is used to preface a list of items, and also to emphasize the first one.\n\n\n\r\nA をはじめ、B, C ...\n\n\n\r\nEnglish equivalents might be <b>not only, but also</b> \n\r\nNot only A, but also B and C\n\r\nEspecially A, but also B and C\n\n\n\r\nsimilar to karashite which is mostly used for negative things.\n\n\n\r\nかれの下品の言い方<b>からして</b>、すごく嫌な人です\n\r\nI really dislike him, <b>especially</b> because of his foul mouth."
    html: "&lt;b&gt;を始め&lt;/b&gt; is used to preface a list of items, and also to emphasize the first one.<br/>\n<br/>\r\nA をはじめ、B, C ...<br/>\n<br/>\r\nEnglish equivalents might be &lt;b&gt;not only, but also&lt;/b&gt; <br/>\r\nNot only A, but also B and C<br/>\r\nEspecially A, but also B and C<br/>\n<br/>\r\nsimilar to <b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=karashite\">karashite</a></b> which is mostly used for negative things.<br/>\n<br/>\r\nかれの下品の言い方&lt;b&gt;からして&lt;/b&gt;、すごく嫌な人です<br/>\r\nI really dislike him, &lt;b&gt;especially&lt;/b&gt; because of his foul mouth."
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
