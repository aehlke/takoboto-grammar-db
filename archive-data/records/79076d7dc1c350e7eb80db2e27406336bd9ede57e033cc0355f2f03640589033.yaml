  - position: 6
    credits_raw: bamboo4
    text: |-
      を始め does not necessairly mean "to start with" but the means of enumeration.　彼は英語を始め、フランス語とロシア語にも堪能だ only serves as the means of enumeration. "He is conversant not only in English but also in French and Russian."
    html: |-
      を始め does not necessairly mean "to start with" but the means of enumeration.　彼は英語を始め、フランス語とロシア語にも堪能だ only serves as the means of enumeration. "He is conversant not only in English but also in French and Russian." <br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
