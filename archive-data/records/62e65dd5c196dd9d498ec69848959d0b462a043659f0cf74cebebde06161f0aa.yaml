  - position: 10
    credits_raw: KWhazit
    text: "This shows up constantly in the (imitation?) archaic style that seems to be preferred for writing spell incantations in the fantasy genre.\n\n\n\r\nTaking a few examples from spell incantations in the Slayers anime...\n\r\nドラグ・スレイブ（竜破斬） (Dragon Slave):\n\r\n...偉大[なる]汝の名において　我ここに　闇に誓わん...\n\r\n...I hereby swear unto darkness by thy * great name...\n\r\nリカバリイ（治療） (Recovery):\n\r\n聖[なる]癒しの御手よ　母[なる]大地の息吹よ...\n\r\nO holy * healing hand, O breath of Mother * Earth...\n\n\n\r\nLooking at 母なる大地, it seems that なる can also be used with nouns (like の in modern Japanese)."
    html: "This shows up constantly in the (imitation?) archaic style that seems to be preferred for writing spell incantations in the fantasy genre.<br/>\n<br/>\r\nTaking a few examples from spell incantations in the Slayers anime...<br/>\r\nドラグ・スレイブ（竜破斬） (Dragon Slave):<br/>\r\n...偉大[なる]汝の名において　我ここに　闇に誓わん...<br/>\r\n...I hereby swear unto darkness by thy * great name...<br/>\r\nリカバリイ（治療） (Recovery):<br/>\r\n聖[なる]癒しの御手よ　母[なる]大地の息吹よ...<br/>\r\nO holy * healing hand, O breath of Mother * Earth...<br/>\n<br/>\r\nLooking at 母なる大地, it seems that なる can also be used with nouns (like の in modern Japanese)."
