    japanese: 地図さえあれば、何の迷いもなく目的地に到着します。.
    body_text: "地図さえあれば、何の迷いもなく目的地に到着します。.  \n\nIf only \r\n\t\twe had a map we'd get to our destination without going astray."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJ地図さえあれ\">\n地図<strong>さえ</strong>あれ<strong>ば、</strong>何の迷いもなく目的地に到着します。. </a> <br/>\n<strong>If only </strong>\r\n\t\twe had a map we'd get to our destination without going astray."
    credits_raw: Amatuka
