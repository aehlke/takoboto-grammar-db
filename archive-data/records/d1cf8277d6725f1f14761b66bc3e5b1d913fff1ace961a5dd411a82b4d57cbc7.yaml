notes:
  - position: 0
    text: "さえ is often used in a pattern like:\n\n\n\r\nnoun-sae　verb-ba = result\n\r\nnoun-only verb-if = result\n\n\n\r\nひま<b>さえ</b>　あれ<b>ば</b>　幸せです\n\r\nfree time <b>only</b> <b>if</b> I had = I would be happy\n\r\nif only i had some free time, i would be happy\n\n\n\r\n薬<b>さえ</b>　飲め<b>ば</b>、直ります\n\r\nmedicine <b>only</b> <b>if</b> you drink = get better\n\r\nif you just take your medicine, you will get better"
    html: "さえ is often used in a pattern like:<br/>\n<br/>\r\nnoun-sae　verb-ba = result<br/>\r\nnoun-only verb-if = result<br/>\n<br/>\r\nひま&lt;b&gt;さえ&lt;/b&gt;　あれ&lt;b&gt;ば&lt;/b&gt;　幸せです<br/>\r\nfree time &lt;b&gt;only&lt;/b&gt; &lt;b&gt;if&lt;/b&gt; I had = I would be happy<br/>\r\nif only i had some free time, i would be happy<br/>\n<br/>\r\n薬&lt;b&gt;さえ&lt;/b&gt;　飲め&lt;b&gt;ば&lt;/b&gt;、直ります<br/>\r\nmedicine &lt;b&gt;only&lt;/b&gt; &lt;b&gt;if&lt;/b&gt; you drink = get better<br/>\r\nif you just take your medicine, you will get better"
