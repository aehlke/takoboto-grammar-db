    body_text: "お金さえあれば、この車を買います。 \n\nIf only I had the money, \r\n\t\tI would have bought this car."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJお金さえあれ\">\nお金<strong>さえ</strong>あれ<strong>ば</strong>、この車を買います。</a> <br/>\n<strong>If only I had the money, </strong>\r\n\t\tI would have bought this car."
