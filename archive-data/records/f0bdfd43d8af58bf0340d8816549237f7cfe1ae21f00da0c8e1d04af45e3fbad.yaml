    text: "kotonisuru\n\r\n日本へ行くことにする\n\r\nI have decided to go to japan\n\n\n\nkotoninaru\n\r\n日本へ行くことになった\n\r\nIt has been decided I will go to japan\n\n\n\nkotoninatteiru\n\r\n日本へ行くことになっている\n\r\nI go to Japan \n\r\n(eg as a rule, once a month)"
