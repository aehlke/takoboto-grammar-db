    japanese: 彼女は優しいですが、知らずに人を傷付けることを言うきらいがある。
    body_text: "彼女は優しいですが、知らずに人を傷付けることを言うきらいがある。 \n\n\t\tShe is a nice person; however, she tends to say hurtful things unintentionally."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼女は優しいですが、知らずに人を傷付けることを言うきらいがある。\">\n\t\t\t\t彼女は優しいですが、知らずに人を傷付けることを言う<strong>きらいがある</strong>。<strong></strong></a> <br/>\n\t\tShe is a nice person; however, she tends to say hurtful things unintentionally. \n\t\t<strong> </strong>"
