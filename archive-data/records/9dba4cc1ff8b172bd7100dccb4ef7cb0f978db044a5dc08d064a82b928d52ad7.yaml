    japanese: 人間は年をとると、ほかの人の話しを聞かなくなるきらいがある。
    body_text: "人間は年をとると、ほかの人の話しを聞かなくなるきらいがある。 \n\n\t\tAs humans get on in years, they tend to not listen to what others say."
