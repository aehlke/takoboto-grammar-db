    body_text: "電車のドアが開いたかどうかのうちに \n\nBefore you know \n\t\tif the train doors opened or not."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ電車のドアが開いたかどうかのうちに\">\n\t\t\t\t電車のドアが開いた<strong>かどうかのうちに</strong><strong></strong></a> <br/>\n<strong>Before you know </strong>\n\t\tif the train doors opened or not."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5243
    position: 1
    japanese: 授業ベルが鳴らすかどうか教室から学生が出ました。
    body_text: "授業ベルが鳴らすかどうか教室から学生が出ました。 \n\nJust as the school bell rang, \n\t\tthe students dashed out of the classroom."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ授業ベルが鳴らすかどうか教室から学生が出ました。\">\n授業ベルが<strong>鳴らすかどうか</strong>教室から学生が出ました。<strong></strong></a> <br/>\n<strong>Just as the school bell rang, </strong>\n\t\tthe students dashed out of the classroom."
