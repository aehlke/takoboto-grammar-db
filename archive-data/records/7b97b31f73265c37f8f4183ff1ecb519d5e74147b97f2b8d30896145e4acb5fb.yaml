comments:
  - position: 0
    credits_raw: dc
    text: |-
      this is almost as if the user is not sure the new state has occurred yet.. did the doors open ("ka dou ka") or not yet..
    html: |-
      this is almost as if the user is not sure the new state has occurred yet.. did the doors open ("ka dou ka") or not yet..
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: |-
      Literally, it means "while it is not certain whether the door opened or not," so you cannot tell if the door opened or not. It depends upon the text that follows, but normally, it would mean that the door did open.
    html: |-
      Literally, it means "while it is not certain whether the door opened or not," so you cannot tell if the door opened or not. It depends upon the text that follows, but normally, it would mean that the door did open.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: "#5243 授業（終了の）ベルが鳴るかどうかのうちに　is better. \n\r\nI would say from the English...\n\r\n授業終了のベルが鳴るか鳴らないかのうちに、学生たちは教室から飛び出しました。  This does not mean students flew out, by the way."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kadoukanouchini#5243\">#5243</a></b> 授業（終了の）ベルが鳴るかどうかのうちに　is better. <br/>\r\nI would say from the English...<br/>\r\n授業終了のベルが鳴るか鳴らないかのうちに、学生たちは教室から飛び出しました。  This does not mean students flew out, by the way."
