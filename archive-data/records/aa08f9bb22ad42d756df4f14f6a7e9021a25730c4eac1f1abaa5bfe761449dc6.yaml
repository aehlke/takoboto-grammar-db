    original_updated_at: null
  - source_id: 7878
    position: 1
    japanese: 夏休みが始まったとあって、子供たちはみんな嬉しそうだ。
    body_text: "夏休みが始まったとあって、子供たちはみんな嬉しそうだ。 \n\n\t\tSummer vacation has begun, \n\t\tso \n\t\tthe children all look happy."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ夏休みが始まったとあって、子供たちはみんな嬉しそうだ。\">\n\t\t\t\t夏休みが始まった<strong>とあって</strong>、子供たちはみんな嬉しそうだ。<strong></strong></a> <br/>\n\t\tSummer vacation has begun, \n\t\t<strong>so </strong>\n\t\tthe children all look happy."
    credits_raw: LR
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 7879
    position: 2
    japanese: 人気スターがやって来るとあって、空港は大勢の人たちが待ち受けていた
    body_text: "人気スターがやって来るとあって、空港は大勢の人たちが待ち受けていた \n\nbecause \n\t\ta popular star is coming, a large crowd gathered to meet him at the airport"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ人気スターがやって来るとあって、空港は大勢の人たちが待ち受けていた\">\n\t\t\t\t人気スターがやって来る<strong>とあって</strong>、空港は大勢の人たちが待ち受けていた<strong></strong></a> <br/>\n<strong>because </strong>\n\t\ta popular star is coming, a large crowd gathered to meet him at the airport"
    credits_raw: LR
