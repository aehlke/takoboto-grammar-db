meaning: |-
  Because ~; ~ as expected; because ~, naturally ~; Introduces an expected reason for some circumstance that is different from the usual situation.
meaning_example: Because this is the series of holidays after the bonus season, (unsurprisingly), all the tourist spots are crowded.
