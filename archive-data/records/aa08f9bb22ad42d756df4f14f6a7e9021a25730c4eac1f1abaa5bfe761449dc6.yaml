  - source_id: 7880
    position: 3
    japanese: 掃除が終わったらお菓子がもらえるとあって、子供たちは一生懸命手伝っている。
    body_text: "掃除が終わったらお菓子がもらえるとあって、子供たちは一生懸命手伝っている。 \n\nBecause \n\t\tthey know they'll get sweets after they finish cleaning, the children are doing their very best to help out."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ掃除が終わったらお菓子がもらえるとあって、子供たちは一生懸命手伝っている。\">\n\t\t\t\t掃除が終わったらお菓子がもらえる<strong>とあって</strong>、子供たちは一生懸命手伝っている。<strong></strong></a> <br/>\n<strong>Because </strong>\n\t\tthey know they'll get sweets after they finish cleaning, the children are doing their very best to help out."
