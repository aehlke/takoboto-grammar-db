    japanese: ボーナス後の連休とあって、観光地はどこも人でいっぱいだ。
    body_text: "ボーナス後の連休とあって、観光地はどこも人でいっぱいだ。 \n\nBecause \n\t\tthis is the series of holidays after the bonus season, unsurprisingly, all the tourist spots are crowded."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJボーナス後の連休とあって、観光地はどこも人でいっぱいだ。\">\n\t\t\t\tボーナス後の連休<strong>とあって</strong>、観光地はどこも人でいっぱいだ。<strong></strong></a> <br/>\n<strong>Because </strong>\n\t\tthis is the series of holidays after the bonus season, unsurprisingly, all the tourist spots are crowded."
    credits_raw: LR
