comments:
  - position: 0
    credits_raw: hana
    text: what are the rules for it being juu rather than chuu?
    html: what are the rules for it being juu rather than chuu?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: sekaiget_dominic
    text: "I thought the rule was as follows:\n\n\n\r\nChuu = indicates the continuation of an activity or a time period\n\r\njuu = indicates a space/time period without a break\n\n\n\r\nSo 営業中 (chuu)　indicates the activity of sales continuing. 春休み中 (chuu) indicates the period of time \"Spring holiday\"\n\n\n\r\n夏休み中　(juu) indicates the entire summer holidays. 　\n\n\n\r\n世界中　(juu) indicates the entire world\n\n\n\r\nso to distinguish between the summer and spring examples above:\n\n\n\r\n春休み中（ちゅう）は旅行に行くつもりです。\n\r\n夏休み中（じゅう）テレビゲームばかりしていた。\n\n\n\r\nThe spring example defines a period of time and allows us to mention activities that will occur in that time etc.\n\n\n\r\nThe summer example indicates that for the entire period of the summer holidays a single event occured. \n\n\n\r\nWhat's confusing me is that I thought Miki's  summer holidays example should be (juu), because of the zutto. perhaps if the emphasis was more on the fact that the entire holiday had been taken up by camping, we could have used juu?"
    html: "I thought the rule was as follows:<br/>\n<br/>\r\nChuu = indicates the continuation of an activity or a time period<br/>\r\njuu = indicates a space/time period without a break<br/>\n<br/>\r\nSo 営業中 (chuu)　indicates the activity of sales continuing. 春休み中 (chuu) indicates the period of time \"Spring holiday\"<br/>\n<br/>\r\n夏休み中　(juu) indicates the entire summer holidays. 　<br/>\n<br/>\r\n世界中　(juu) indicates the entire world<br/>\n<br/>\r\nso to distinguish between the summer and spring examples above:<br/>\n<br/>\r\n春休み中（ちゅう）は旅行に行くつもりです。<br/>\r\n夏休み中（じゅう）テレビゲームばかりしていた。<br/>\n<br/>\r\nThe spring example defines a period of time and allows us to mention activities that will occur in that time etc.<br/>\n<br/>\r\nThe summer example indicates that for the entire period of the summer holidays a single event occured. <br/>\n<br/>\r\nWhat's confusing me is that I thought Miki's  summer holidays example should be (juu), because of the zutto. perhaps if the emphasis was more on the fact that the entire holiday had been taken up by camping, we could have used juu?"
    source_id: null
    original_created_at: null
    original_updated_at: null
