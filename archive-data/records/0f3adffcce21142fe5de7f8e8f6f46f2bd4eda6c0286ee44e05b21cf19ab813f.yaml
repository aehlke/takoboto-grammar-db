    text: |-
      あの映画は良いけど、映画館に見に行くまでもないと思う。DVDで見れは十分だよ。　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　[That film is nice but, there is no need to go theater, DVD is enough for that.]
