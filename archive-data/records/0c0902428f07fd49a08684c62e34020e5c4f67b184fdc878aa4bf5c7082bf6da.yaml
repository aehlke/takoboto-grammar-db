    original_updated_at: null
  - position: 6
    credits_raw: televangelist
    text: |-
      Kana is usable by Japanese women, but mainly for monologues - it's more versatile for usage by men.  And yeah, go with the plain form if you're under 40.
    html: |-
      Kana is usable by Japanese women, but mainly for monologues - it's more versatile for usage by men.  And yeah, go with the plain form if you're under 40.
