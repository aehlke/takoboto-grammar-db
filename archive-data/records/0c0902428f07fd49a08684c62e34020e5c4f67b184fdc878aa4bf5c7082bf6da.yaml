  - position: 2
    credits_raw: bamboo4
    text: "かな is made up of か, a particle for interrogatory and な a particle to express one's emotion. It is used to ask oneself a question or a question to another as to the degree of uncertainty involved. When you use it in the form of ないかな, you are expressing a desire for something to come true.\n\n\n\r\n間違えたかな = Did I screw it up?\n\r\n天気にならないかな = Hope the weather clears up!"
    html: "かな is made up of か, a particle for interrogatory and な a particle to express one's emotion. It is used to ask oneself a question or a question to another as to the degree of uncertainty involved. When you use it in the form of ないかな, you are expressing a desire for something to come true.<br/>\n<br/>\r\n間違えたかな = Did I screw it up?<br/>\r\n天気にならないかな = Hope the weather clears up!<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
