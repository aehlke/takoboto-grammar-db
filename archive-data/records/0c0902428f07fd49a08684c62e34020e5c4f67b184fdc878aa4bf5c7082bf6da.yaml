comments:
  - position: 0
    credits_raw: Amatuka
    text: "Three main uses of かな.\n\r\n1. A question with little doubt.\n\r\ne.g. ジムならうまくいくかな。As it's Jim I wonder whether it will go well.\n\r\n2. Talking to yourself.\n\r\nゲーセンに行こうかな。Shall I go to the game center?\n\r\n3. Expressing wish / hope.\n\r\n誰かこないかな。Is anybody going to come? (I hope somebody comes.)"
    html: "Three main uses of かな.<br/>\r\n1. A question with little doubt.<br/>\r\ne.g. ジムならうまくいくかな。As it's Jim I wonder whether it will go well.<br/>\r\n2. Talking to yourself.<br/>\r\nゲーセンに行こうかな。Shall I go to the game center?<br/>\r\n3. Expressing wish / hope.<br/>\r\n誰かこないかな。Is anybody going to come? (I hope somebody comes.)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Placed on the end of a sentence.\n\n\n\r\nS = Sentence."
