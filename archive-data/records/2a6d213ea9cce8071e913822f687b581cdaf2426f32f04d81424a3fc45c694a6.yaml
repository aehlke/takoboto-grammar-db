    text: "from sci.lang.japan\n\n\n\r\nIt might be easier to think of it as\n\n\n\nka[to omou]to\n\n\n\r\nrather than\n\nkatoomouto\n\n\n\r\nIt would be even easier to think of it as\n\n\n\r\n[(missing phrase) ka][to omou]to"
    html: "from <a href=\"http://groups.google.com/groups?hl=en&amp;lr=&amp;ie=UTF-8&amp;oe=UTF-8&amp;threadm=2e5b8611.0401221149.81c351d%40posting.google.com&amp;rnum=2&amp;prev=/groups%3Fq%3DJGram%2Bgroup:sci.lang.japan%26hl%3Den%26lr%3D%26ie%3DUTF-8%26oe%3DUTF-8%26group%3Dsci.lang.japan%26selm%3D2e5b8611.0401221149.81c351d%2540posting.google.com%26rnum%3D2\">sci.lang.japan</a><br/>\n<br/>\r\nIt might be easier to think of it as<br/>\n<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=ka\">ka</a></b>[to omou]<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=to\">to</a></b><br/>\n<br/>\r\nrather than<br/>\n<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=kato\">kato</a></b><b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=omou\">omou</a></b><b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=to\">to</a></b><br/>\n<br/>\r\nIt would be even easier to think of it as<br/>\n<br/>\r\n[(missing phrase) ka][to omou]<b><a href=\"http://www.jgram.org/pages/viewOne.php?tagE=to\">to</a></b>"
