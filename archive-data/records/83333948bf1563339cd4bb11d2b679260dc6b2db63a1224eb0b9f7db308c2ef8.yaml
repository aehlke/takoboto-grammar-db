    japanese: 少年にしろ、成人にしろ、悪いことをしたら、厳しい罰を受けるべきです。
    body_text: "少年にしろ、成人にしろ、悪いことをしたら、厳しい罰を受けるべきです。\r \n\n\t\tWhether a juvenile or an adult, if someone does something bad, he/she should receive strict punishment."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ少年にしろ、成人にしろ、悪いことをしたら、厳しい罰を受けるべきです。\">\n\t\t\t\t少年にしろ、成人にしろ、悪いことをしたら、厳しい罰を受けるべきです。\r<strong></strong><strong></strong></a> <br/>\n\t\tWhether a juvenile or an adult, if someone does something bad, he/she should receive strict punishment. \n\t\t<strong> </strong>"
    credits_raw: rubyhatchet
    verification_class:
