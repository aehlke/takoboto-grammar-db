    japanese: 彼に同意するにせよしないにせよ、考えさせられる話だ。
    body_text: "彼に同意するにせよしないにせよ、考えさせられる話だ。\r \n\n\t\tWhether you agree with him or not, that is thought-provoking."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ彼に同意するにせよしないにせよ、考えさせられる話だ。\">\n\t\t\t\t彼に同意するにせよしないにせよ、考えさせられる話だ。\r<strong></strong><strong></strong></a> <br/>\n\t\tWhether you agree with him or not, that is thought-provoking. \n\t\t<strong> </strong>"
