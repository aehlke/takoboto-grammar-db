    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJどんな人に会うにしろ、失礼はだめです。\">\n\t\t\t\tどんな人に会うにしろ、失礼はだめです。<strong></strong><strong></strong></a> <br/>\n\t\tregardless of who ever you meet, bad manners are unacceptable. \n\t\t<strong> </strong>"
