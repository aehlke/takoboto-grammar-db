    japanese: どういう結果になるにせよ、やるだけやってみるべきだ。
    body_text: "どういう結果になるにせよ、やるだけやってみるべきだ。\r \n\n\t\tNo matter the outcome, you at least have to try."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJどういう結果になるにせよ、やるだけやってみるべきだ。\">\n\t\t\t\tどういう結果になるにせよ、やるだけやってみるべきだ。\r<strong></strong><strong></strong></a> <br/>\n\t\tNo matter the outcome, you at least have to try. \n\t\t<strong> </strong>"
