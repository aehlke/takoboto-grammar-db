    japanese: いくら有能があるにせよ、努力なしに成功できるとは思わない。
    body_text: "いくら有能があるにせよ、努力なしに成功できるとは思わない。 \n\nNo matter how much \n\t\tskill you have, I don't think you can succeed without great effort."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJいくら有能がある\">\n<strong>いくら</strong>有能がある<strong>にせよ</strong>、努力なしに成功できるとは思わない。</a> <br/>\n<strong>No matter how much </strong>\n\t\tskill you have, I don't think you can succeed without great effort."
