    japanese: どんな理由があるにせよ人を殺す権利はない。
    body_text: "どんな理由があるにせよ人を殺す権利はない。 \n\n\t\tYou have no right to kill anybody, no matter the reason (for any reason)."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJどんな理由があるにせよ人を殺す権利はない。\">\n\t\t\t\tどんな理由があるにせよ人を殺す権利はない。<strong></strong><strong></strong></a> <br/>\n\t\tYou have no right to kill anybody, no matter the reason (for any reason). \n\t\t<strong> </strong>"
