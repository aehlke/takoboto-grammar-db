notes:
  - position: 0
    text: "use it like this\n\n\n\r\n(although A) -nishiro- (you should not B)\n\r\n(poor) -nishiro- (you should not steal)\n\n\n\r\noften \x01 (even) is used as a prefix."
    html: "use it like this<br/>\n<br/>\r\n(although A) -nishiro- (you should not B)<br/>\r\n(poor) -nishiro- (you should not steal)<br/>\n<br/>\r\noften <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> (even) is used as a prefix."
    credits_raw: dc
