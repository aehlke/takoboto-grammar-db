    japanese: 旅行に行くにせよ、行かないにせよ、早く決めたほうがいい。
    body_text: "旅行に行くにせよ、行かないにせよ、早く決めたほうがいい。 \n\n\t\tYou should decide soon whether or not you're going to take a trip."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ旅行に行くにせよ、行かないにせよ、早く決めたほうがいい。\">\n\t\t\t\t旅行に行くにせよ、行かないにせよ、早く決めたほうがいい。<strong></strong><strong></strong></a> <br/>\n\t\tYou should decide soon whether or not you're going to take a trip. \n\t\t<strong> </strong>"
    credits_raw: rubyhatchet
    verification_class:
      - green-bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6757
