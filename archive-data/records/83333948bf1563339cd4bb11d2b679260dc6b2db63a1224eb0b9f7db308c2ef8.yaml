    japanese: たった三日の旅行にせよ、準備は必要だ。
    body_text: "たった三日の旅行にせよ、準備は必要だ。 \n\nEven if \n\t\tit is a journey of three days only, preparation is necessary."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJたった三日の旅行にせよ\">\n\t\t\t\tたった三日の旅行<strong>にせよ</strong><strong></strong>、準備は必要だ。</a> <br/>\n<strong>Even if </strong>\n\t\tit is a journey of three days only, preparation is necessary."
