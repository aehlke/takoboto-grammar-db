  - position: 3
    credits_raw: blabby
    text: "This is in my 一級 grammar book.  The explanation is \"〜しながら、同時に\"\n\r\nThis is different to 傍ら/側ら/かたわら(で/に) \"Next to/Nearby\" as bamboo4 said."
    html: "This is in my 一級 grammar book.  The explanation is \"〜しながら、同時に\"<br/>\r\nThis is different to 傍ら/側ら/かたわら(で/に) \"Next to/Nearby\" as bamboo4 said."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: blabby
    text: "An example of the 一級 grammar is\n\r\n私は会社に勤めてるかたわら、夜は家で日本語を勉強しています。\n\r\nBesides working, at night I study Japanese at home."
    html: "An example of the 一級 grammar is<br/>\r\n私は会社に勤めてるかたわら、夜は家で日本語を勉強しています。<br/>\r\nBesides working, at night I study Japanese at home."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: crlane
    text: "平日に仕事をするかたわら、休みの日にはボランティアをしている。\n\r\nBesides working during the week, (he/she/they)do/does volunteer work on (his/her/their) days off.\n\n\n\r\nYou could also replace \"besides\" with \"while\".  かたわら is used figuratively and not.  \n\r\nWhen used after a verb it usually means 〜しながら、同時に\n\r\nWhen used after a noun it usually means \"to be physicaly beside\".\n\r\nかたわらに置いています　\"placed beside\"\n\r\n〜のかたわらに \"beside 〜\" \n\r\nThere should most definatley be another meaning and example added to the entry."
    html: "平日に仕事をするかたわら、休みの日にはボランティアをしている。<br/>\r\nBesides working during the week, (he/she/they)do/does volunteer work on (his/her/their) days off.<br/>\n<br/>\r\nYou could also replace \"besides\" with \"while\".  かたわら is used figuratively and not.  <br/>\r\nWhen used after a verb it usually means 〜しながら、同時に<br/>\r\nWhen used after a noun it usually means \"to be physicaly beside\".<br/>\r\nかたわらに置いています　\"placed beside\"<br/>\r\n〜のかたわらに \"beside 〜\" <br/>\r\nThere should most definatley be another meaning and example added to the entry."
    source_id: null
    original_created_at: null
    original_updated_at: null
