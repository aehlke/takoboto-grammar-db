  - position: 3
    credits_raw: Celesta
    text: "We were taught by a native speaker in Japan Society that the polite forms are as follows:\n\r\nchikai desu\n\r\nchikakunai desu\n\r\nchikakatta desu\n\r\nchikakunakatta desu\n\r\n...while desu would only be conjugated for -na adjectives (kirei desu, kirei de wa arimasen, kirei deshita, kirei de wa arimasen deshita)."
    html: "We were taught by a native speaker in Japan Society that the polite forms are as follows:<br/>\r\nchikai desu<br/>\r\nchikakunai desu<br/>\r\nchikakatta desu<br/>\r\nchikakunakatta desu<br/>\r\n...while desu would only be conjugated for -na adjectives (kirei desu, kirei de wa arimasen, kirei deshita, kirei de wa arimasen deshita)."
