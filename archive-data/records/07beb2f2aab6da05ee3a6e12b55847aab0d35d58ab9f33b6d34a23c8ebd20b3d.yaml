comments:
  - position: 0
    credits_raw: KyleGoetz
    text: "I changed the information about this entry, because it is not just about the adjective \"chikai\", but rather about the method of conjugating i-adjectives as a whole. I also fixed a typo.\n\n\n\r\nThe spacing of the romanized words need to be fixed in the example sentences -- the current formatting muddies the logic behind the grammar. Instead of \"chika kunakatta\", it should be \"chikaku nakatta\", because the grammatical construct behind the form is the adverbial form of \"chikai\" (\"chikaku\") plus the plain negative past form of \"aru\" (\"nakatta\").\n\n\n\r\nOf course, I believe it is better to have no space, favoring\n\r\nchikai, chikakunai, chikakatta, chikakunakatta\n\r\nchikai desu, chikakunai desu (or chikaku arimasen), chikakatta desu, chikakunakatta desu (or chikaku arimasen deshita). However, if you feel the need to put spaces, they more logically should be as follows:\n\r\nchikai, chikaku nai, chikakatta, chikaku nakatta\n\r\nchikai desu, chikaku nai desu (or chikaku arimasen), chikakatta desu, chikaku nakatta desu (or chikaku arimasen deshita).\n\n\n\r\nEdit: Well, I tried to make a full-fledged entry, but this site doesn't allow freaking tables. Screw that, then."
    html: "I changed the information about this entry, because it is not just about the adjective \"chikai\", but rather about the method of conjugating i-adjectives as a whole. I also fixed a typo.<br/>\n<br/>\r\nThe spacing of the romanized words need to be fixed in the example sentences -- the current formatting muddies the logic behind the grammar. Instead of \"chika kunakatta\", it should be \"chikaku nakatta\", because the grammatical construct behind the form is the adverbial form of \"chikai\" (\"chikaku\") plus the plain negative past form of \"aru\" (\"nakatta\").<br/>\n<br/>\r\nOf course, I believe it is better to have no space, favoring<br/>\r\nchikai, chikakunai, chikakatta, chikakunakatta<br/>\r\nchikai desu, chikakunai desu (or chikaku arimasen), chikakatta desu, chikakunakatta desu (or chikaku arimasen deshita). However, if you feel the need to put spaces, they more logically should be as follows:<br/>\r\nchikai, chikaku nai, chikakatta, chikaku nakatta<br/>\r\nchikai desu, chikaku nai desu (or chikaku arimasen), chikakatta desu, chikaku nakatta desu (or chikaku arimasen deshita).<br/>\n<br/>\r\nEdit: Well, I tried to make a full-fledged entry, but this site doesn't allow freaking tables. Screw that, then."
