    japanese: ２０才になって初めて、彼女は歌手になろうと決心した。
    body_text: "２０才になって初めて、彼女は歌手になろうと決心した。\r \n\n\t\tShe did not decide to be a singer until she reached the age of twenty."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ２０才になって初めて、彼女は歌手になろうと決心した。\">\n\t\t\t\t２０才になっ<strong>て初めて</strong>、彼女は歌手になろうと決心した。\r<strong></strong></a> <br/>\n\t\tShe did not decide to be a singer until she reached the age of twenty. \n\t\t<strong> </strong>"
