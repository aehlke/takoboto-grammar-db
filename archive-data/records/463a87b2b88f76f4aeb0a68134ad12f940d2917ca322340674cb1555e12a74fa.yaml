    body_text: "あとになって初めて、それをやった理由を彼は説明した。\r \n\n\t\tOnly afterward did he explain why he did it."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあとになって初めて、それをやった理由を彼は説明した。\">\n\t\t\t\tあとになっ<strong>て初めて</strong>、それをやった理由を彼は説明した。\r<strong></strong></a> <br/>\n\t\tOnly afterward did he explain why he did it. \n\t\t<strong> </strong>"
