    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJそして１４歳になって初めてピアノに触れたのです。\">\n\t\t\t\tそして１４歳になっ<strong>て初めて</strong>ピアノに触れたのです。\r<strong></strong></a> <br/>\n\t\tAnd I was fourteen years old before I touched a piano for the first time. \n\t\t<strong> </strong>"
