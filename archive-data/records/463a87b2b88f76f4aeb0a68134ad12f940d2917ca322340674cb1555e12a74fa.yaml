    body_text: "２、３日たって初めて彼が到着した。\r \n\n\t\tIt was not until a few days later that he arrived."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ２、３日たって初めて彼が到着した。\">\n\t\t\t\t２、３日たっ<strong>て初めて</strong>彼が到着した。\r<strong></strong></a> <br/>\n\t\tIt was not until a few days later that he arrived. \n\t\t<strong> </strong>"
    credits_raw: dbx
