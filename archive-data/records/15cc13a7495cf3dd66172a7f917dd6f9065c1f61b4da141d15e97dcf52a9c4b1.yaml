comments:
  - position: 0
    credits_raw: Amatuka
    text: "Two forms, \n\r\n\"noun no hou ga ___\" (e.g. ３月１日の 方が 都合がよい)\n\r\n\"verb no hou ga ___\" (e.g.  電話した方が安い)\n\r\nIf the verb is positive it is usually past tense, even if you are talking about actions to be taken in the future.\n\r\nIf the verb is negative it does not need to be put into past tense."
    html: "Two forms, <br/>\r\n\"<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=noun\">noun</a></b> no hou ga ___\" (e.g. ３月１日の 方が 都合がよい)<br/>\r\n\"<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=verb\">verb</a></b> no hou ga ___\" (e.g.  電話した方が安い)<br/>\r\nIf the verb is positive it is usually <b>past tense</b>, even if you are talking about actions to be taken in the future.<br/>\r\nIf the verb is negative it does not need to be put into past tense."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Several forms, \n\r\n\"noun no hou ga ___\" (e.g. ３月１日の 方が 都合がよい)\n\r\n\"na-adjective na hou ga ___\" (e.g. 着実な 方が 競争に勝つ)\n\r\n\"verb no hou ga ___\" (e.g. 電話した方が安い)\n\r\nIf the verb is positive it is usually past tense, even if you are talking about actions to be taken in the future.\n\r\nIf the verb is negative it does not need to be put into past tense."
    html: "Several forms, <br/>\r\n\"<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=noun\">noun</a></b> no hou ga ___\" (e.g. ３月１日の 方が 都合がよい)<br/>\r\n\"<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=na-adjective\">na-adjective</a></b> na hou ga ___\" (e.g. 着実な 方が 競争に勝つ)<br/>\r\n\"<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=verb\">verb</a></b> no hou ga ___\" (e.g. 電話した方が安い)<br/>\r\nIf the verb is positive it is usually past tense, even if you are talking about actions to be taken in the future.<br/>\r\nIf the verb is negative it does not need to be put into past tense."
    source_id: null
    original_created_at: null
    original_updated_at: null
