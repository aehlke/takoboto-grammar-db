    text: "Some commonly used \"interrogative\" words used with this grammar include: 何〜, なんと, どんなに, どれだけ, etc.\n\n\n\r\nＶ(plain form) + ことか\n\r\nいＡ + い + ことか // いＡ + かった + ことか\n\r\nなＡ + な + ことか // なＡ + だった + ことか"
    html: "Some commonly used \"interrogative\" words used with this grammar include: 何〜, なんと, どんなに, どれだけ, etc.<br/>\n<br/>\r\nＶ(plain form) + ことか<br/>\r\nいＡ + い + ことか // いＡ + かった + ことか<br/>\r\nなＡ + な + ことか // なＡ + だった + ことか"
