comments:
  - position: 0
    credits_raw: bamboo4
    text: "ことか has the sense of exclamatory sentence. Thus, in the first example, \"Ohm how many years did we wait for his return!\" and the second exmaple, \"Imagine how much money it would take to get three kids educated.\"\n\r\n３人の子供を教育するには sounds like \"to educate three kids\" in which the speaker is the educator. More precisely, it should be ３人の子供に教育を受けさせるには(to have three kids receive education). However, The expression used in the example would probably be acceptable except for a perennial nitpicker like me."
    html: "ことか has the sense of exclamatory sentence. Thus, in the first example, \"Ohm how many years did we wait for his return!\" and the second exmaple, \"Imagine how much money it would take to get three kids educated.\"<br/>\r\n３人の子供を教育するには sounds like \"to educate three kids\" in which the speaker is the educator. More precisely, it should be ３人の子供に教育を受けさせるには(to have three kids receive education). However, The expression used in the example would probably be acceptable except for a perennial nitpicker like me.<br/>\n<br/>"
    source_id: null
    original_created_at: null
