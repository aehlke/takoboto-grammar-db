notes:
  - position: 0
    text: "＊This grammar is meant to negate expressions of opinion or ways of thinking. For example: \"If you put forth great effort, you'll surely succeed.\" (努力すれば必ず成功する。) To negate this opinion, use this grammar: \"It's not true that if you put forth great effort, you'll surely succeed.\" (努力すれば必ず成功するというものではない。)\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + というものでは(も)ない\n\r\nいＡ + というものでは(も)ない\n\r\nなＡ・Ｎ + (だ)というものでは(も)ない"
    html: "＊This grammar is meant to negate expressions of opinion or ways of thinking. For example: \"If you put forth great effort, you'll surely succeed.\" (努力すれば必ず成功する。) To negate this opinion, use this grammar: \"It's not true that if you put forth great effort, you'll surely succeed.\" (努力すれば必ず成功するというものではない。)<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + というものでは(も)ない<br/>\r\nいＡ + というものでは(も)ない<br/>\r\nなＡ・Ｎ + (だ)というものでは(も)ない"
    credits_raw: rubyhatchet
