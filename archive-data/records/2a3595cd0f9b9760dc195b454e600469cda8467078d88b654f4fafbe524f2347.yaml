    japanese: 彼の論文は決して多くないまでも、その質は非常に高い。
    body_text: "彼の論文は決して多くないまでも、その質は非常に高い。\r \n\n\t\tAlthough he hasn't published many papers at all, the quality of those he has published is extremely high."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼の論文は決して多くないまでも、その質は非常に高い。\">\n\t\t\t\t彼の論文は決して多く<strong>ないまでも</strong>、その質は非常に高い。\r<strong></strong></a> <br/>\n\t\tAlthough he hasn't published many papers at all, the quality of those he has published is extremely high. \n\t\t<strong> </strong>"
    credits_raw: LR
