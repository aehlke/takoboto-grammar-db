  - source_id: 7930
    position: 2
    japanese: 彼が犯人だと断定できないまでも、いろいろと怪しいところがある
    body_text: "彼が犯人だと断定できないまでも、いろいろと怪しいところがある\r \n\n\t\tEven though we can't conclude he's the culprit, he has many suspicious points"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼が犯人だと断定できないまでも、いろいろと怪しいところがある\">\n\t\t\t\t彼が犯人だと断定でき<strong>ないまでも</strong>、いろいろと怪しいところがある\r<strong></strong></a> <br/>\n\t\tEven though we can't conclude he's the culprit, he has many suspicious points \n\t\t<strong> </strong>"
    credits_raw: LR
