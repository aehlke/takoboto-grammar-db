    japanese: 別に心配するほどのものでもないと思ったうえに、有益な情報や新しい提案があるなら聞いてはみたいと思ったのでしょう。
    body_text: "別に心配するほどのものでもないと思ったうえに、有益な情報や新しい提案があるなら聞いてはみたいと思ったのでしょう。 \n\nOver and above \n\t\tnot really being a worrying matter [he] also thought that if there was beneficial information or new suggestions he'd like to hear about them."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ別に心配するほどのものでもないと思ったうえに、有益な情報や新しい提案があるなら聞いてはみたいと思ったのでしょう。\">\n\t\t\t\t別に心配するほどのものでもないと思った<strong>うえに</strong>、有益な情報や新しい提案があるなら聞いてはみたいと思ったのでしょう。<strong></strong></a> <br/>\n<strong>Over and above </strong>\n\t\tnot really being a worrying matter [he] also thought that if there was beneficial information or new suggestions he'd like to hear about them."
