    japanese: その日の帰宅後、僕はママとパパに髪を切らされてしまい、全くうんざりだった上に2人とも僕の進学適性試験のことでうるさかった。
    body_text: "その日の帰宅後、僕はママとパパに髪を切らされてしまい、全くうんざりだった上に2人とも僕の進学適性試験のことでうるさかった。 \n\n\t\tAfter I went home that day, my mom and dad made me cut my hair, which was a real drag, \n\t\tand then \n\t\tthey hassled me about my SATs."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその日の帰宅後、僕はママとパパに髪を切らされてしまい、全くうんざりだった上に2人とも僕の進学適性試験のことでうるさかった。\">\n\t\t\t\tその日の帰宅後、僕はママとパパに髪を切らされてしまい、全くうんざりだった<strong>上に</strong>2人とも僕の進学適性試験のことでうるさかった。<strong></strong></a> <br/>\n\t\tAfter I went home that day, my mom and dad made me cut my hair, which was a real drag, \n\t\t<strong>and then </strong>\n\t\tthey hassled me about my SATs."
