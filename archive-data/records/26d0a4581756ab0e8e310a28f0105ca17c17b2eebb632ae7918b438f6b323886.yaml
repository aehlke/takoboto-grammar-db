notes:
  - position: 0
    text: "itashimasu is \"to do\" spoken in a modest manner, or which the Japanese call 謙譲語 (kenjyougo or humble language).\n\n\n\r\n私がいたします would be directed to your superior meaning that \"I will do that.\" \n\r\nIt has nothing to do with \"giving\" or \"receiving\" which would be involved in 貰う and あげる."
    html: "itashimasu is \"to do\" spoken in a modest manner, or which the Japanese call 謙譲語 (kenjyougo or humble language).<br/>\n<br/>\r\n私がいたします would be directed to your superior meaning that \"I will do that.\" <br/>\r\nIt has nothing to do with \"giving\" or \"receiving\" which would be involved in 貰う and あげる."
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: |-
      致します　is the keigo form of suru. Although it can mean I will do, it can also take the past tense form and mean I have done. IE 致しました
    html: |-
      致します　is the keigo form of suru. Although it can mean I will do, it can also take the past tense form and mean I have done. IE 致しました<br/>
