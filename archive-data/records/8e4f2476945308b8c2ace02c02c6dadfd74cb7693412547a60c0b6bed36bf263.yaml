    japanese: 先生が余所見をしているすきに、ラブレターをきみが渡してくれたんだな。
    body_text: "先生が余所見をしているすきに、ラブレターをきみが渡してくれたんだな。 \n\nWhile \n\t\tthe teacher's attention was momentarily distracted you passed me a love letter didn't you."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ先生が余所見をしているすきに、ラブレターをきみが渡してくれたんだな。\">\n\t\t\t\t先生が余所見をしている<strong>すきに</strong>、ラブレターをきみが渡してくれたんだな。<strong></strong></a> <br/>\n<strong>While </strong>\n\t\tthe teacher's attention was momentarily distracted you passed me a love letter didn't you."
