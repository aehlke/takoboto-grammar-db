  - position: 9
    credits_raw: 誠
    text: "〜ものだ：1. 本当に〜だなあ　　（感慨）an emotional exclamations, expression sort of \" ..oh..is (really) so...\".\n\n\n\r\n          2. 過去の回想　「〜たものだ」の形で使われる  something nostalgic\n\n\n\r\n          3. 〜が一般的な常識だ　（人に対して注意する時によく使われる）\n\r\n         \"It is generally known that......\"\n\r\n         \"It is common sense that ....(should)..\"\n\r\n         \"It is known that ....\"\n\n\n\r\nex#1035 means the above category 3 of common sense. \n\r\n \"People would generally greet 'Good Morning' when they meet others in the morning\" \n\n\n\r\nWhile ex#503 has the meaning of category 1 which is an exclamation of strong feelings, 楽しいものだな、楽しいものですね, \" oh... is really fun!\" \n\n\n\r\nFor the rest of the examples,  I cannot figure out yet the usage of ものです.... \n\n\n\r\nSo which category does this entry belongs to?"
    html: "〜ものだ：1. 本当に〜だなあ　　（感慨）an emotional exclamations, expression sort of \" ..oh..is (really) so...\".<br/>\n<br/>\r\n          2. 過去の回想　「〜たものだ」の形で使われる  something nostalgic<br/>\n<br/>\r\n          3. 〜が一般的な常識だ　（人に対して注意する時によく使われる）<br/>\r\n         \"It is generally known that......\"<br/>\r\n         \"It is common sense that ....(should)..\"<br/>\r\n         \"It is known that ....\"<br/>\n<br/>\r\nex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda-2#1035\">#1035</a></b> means the above category 3 of common sense. <br/>\r\n \"People would generally greet 'Good Morning' when they meet others in the morning\" <br/>\n<br/>\r\nWhile ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=monoda-2#503\">#503</a></b> has the meaning of category 1 which is an exclamation of strong feelings, 楽しいものだな、楽しいものですね, \" oh... is really fun!\" <br/>\n<br/>\r\nFor the rest of the examples,  I cannot figure out yet the usage of ものです.... <br/>\n<br/>\r\nSo which category does this entry belongs to?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 10
    credits_raw: jrebong
    text: "Some examples i tried to compose based from the explanations/examples above -\n\r\n1. A general trend - \n\r\n  約束は壊すものだ \n\r\n  (promises are meant to be broken)\n\r\n2. A hope\n\r\n  日本語は上手になりたいものだ\n\r\n  (I wish my nihongo will get better) \n\r\n3. A memory\n\r\n  野球をよく見たものだ\n\r\n  (I used to watch a lot of baseball)\n\n\n\r\nIs this okay?\n\n\n\r\np.s.\n\r\nCan i use monodesu/monodeshita(?) instead of monoda?"
