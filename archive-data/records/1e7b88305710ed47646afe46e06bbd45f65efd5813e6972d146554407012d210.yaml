    japanese: "生け花を習い始めて10年目になる田口さんは,自分ではまだまだ下手だと言っている.しかし,まだ2年目のわたしから見ればあの人の作品は実に見事な\r\nものだ."
    body_text: "生け花を習い始めて10年目になる田口さんは,自分ではまだまだ下手だと言っている.しかし,まだ2年目のわたしから見ればあの人の作品は実に見事な\r\nものだ. \n\n\t\tMr.Daguchi has learned flower arrangement for 10 years and still thinks he's not very good at it. However, to me, who has only learned flower arrangement only for 2 years, his work is \n\t\tjust \n\t\texcellent."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ生け花を習い始めて10年目になる田口さんは,自分ではまだまだ下手だと言っている.しかし,まだ2年目のわたしから見ればあの人の作品は実に見事なものだ.\">\n\t\t\t\t生け花を習い始めて10年目になる田口さんは,自分ではまだまだ下手だと言っている.しかし,まだ2年目のわたしから見ればあの人の作品は実に見事な\r\n<strong>ものだ</strong>.<strong></strong></a> <br/>\n\t\tMr.Daguchi has learned flower arrangement for 10 years and still thinks he's not very good at it. However, to me, who has only learned flower arrangement only for 2 years, his work is \n\t\t<strong>just </strong>\n\t\texcellent."
