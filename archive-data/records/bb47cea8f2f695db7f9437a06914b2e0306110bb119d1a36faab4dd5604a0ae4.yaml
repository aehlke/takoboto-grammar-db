  - position: 4
    credits_raw: blabby
    text: "I good translation I use is\n\r\nにかかわらず    - Regardless of\n\r\nにもかかわらず  - In spite of\n\n\n\r\n雨にもかかわらず出かけました。 Similar to なのに\n\r\nIn spite of the rain, I went out.\n\n\n\r\n曜日にかかわらず入ることができます。 Similar to を問わず\n\r\nRegardless of which day it is, you can enter."
    html: "I good translation I use is<br/>\r\nにかかわらず    - Regardless of<br/>\r\nにもかかわらず  - In spite of<br/>\n<br/>\r\n雨にもかかわらず出かけました。 Similar to なのに<br/>\r\nIn spite of the rain, I went out.<br/>\n<br/>\r\n曜日にかかわらず入ることができます。 Similar to を問わず<br/>\r\nRegardless of which day it is, you can enter."
