    text: "Mostly, に or にも + かかわらず    I think the \"mo\" is optional.\n\r\nException I realized are\n\r\nそれにもかかわらず\n\r\n-た／だ + にもかかわらず　ex#4468, ex#4469, ex#4478"
    html: "Mostly, に or にも + かかわらず    I think the \"mo\" is optional.<br/>\r\nException I realized are<br/>\r\nそれにもかかわらず<br/>\r\n-た／だ + にもかかわらず　ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nikakawarazu#4468\">#4468</a></b>, ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nikakawarazu#4469\">#4469</a></b>, ex<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nikakawarazu#4478\">#4478</a></b>"
