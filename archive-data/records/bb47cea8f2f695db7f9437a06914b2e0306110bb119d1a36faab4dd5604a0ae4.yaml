  - position: 3
    credits_raw: dc
    text: "the も would seem to be emphasis. \n\n\n\r\n来るにもかかわらず\n\r\n\"even if they come\"\n\n\n\r\n来るにかかわらず\n\r\nregardless of whether they come \n\r\n来るか来ないかにかかわらず\n\r\nwhether they come or not"
    html: "the も would seem to be emphasis. <br/>\n<br/>\r\n来るにもかかわらず<br/>\r\n\"even if they come\"<br/>\n<br/>\r\n来るにかかわらず<br/>\r\nregardless of whether they come <br/>\r\n来るか来ないかにかかわらず<br/>\r\nwhether they come or not<br/>\n<br/>"
