    japanese: １０年ぶりで兄に会った。兄のあまりの変化に言葉が出なかった。
    body_text: "１０年ぶりで兄に会った。兄のあまりの変化に言葉が出なかった。 \n\n\t\tIt's been ten years since I saw my brother. I couldn't say any words \n\t\tbecause \n\t\tmy brother had changed a lot ."
