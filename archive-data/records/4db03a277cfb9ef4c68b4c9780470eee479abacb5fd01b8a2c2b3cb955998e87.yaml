notes:
  - position: 0
    text: "Ni can mark time such as:\n\n\n\r\nAt 3:00 pm, I studied French.\n\r\n午後三時間にフランス語を勉強しました。\n\n\n\r\nAn object location marker:\n\n\n\r\nIn Tokyo, there is the Tokyo Tower.\n\r\n東京に東京タワーにあります。\n\n\n\r\nAnd direction:\n\n\n\r\nI'm going to the store tomorrow.\n\r\n明日店に行きます。"
    html: "Ni can mark time such as:<br/>\n<br/>\r\nAt 3:00 pm, I studied French.<br/>\r\n午後三時間にフランス語を勉強しました。<br/>\n<br/>\r\nAn object location marker:<br/>\n<br/>\r\nIn Tokyo, there is the Tokyo Tower.<br/>\r\n東京に東京タワーにあります。<br/>\n<br/>\r\nAnd direction:<br/>\n<br/>\r\nI'm going to the store tomorrow.<br/>\r\n明日店に行きます。"
