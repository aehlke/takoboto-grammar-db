    body_text: "チョコレートを食べ過ぎると、鼻血が出ることがある。 \n\n\t\tWhen you eat too much chocolate, \n\t\tthere are times when \n\t\tyou get a nosebleed."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJチョコレートを食べ過ぎると、鼻血が出ることがある\">\n\t\t\t\tチョコレートを食べ過ぎると、鼻血が出る<strong>ことがある</strong><strong></strong>。</a> <br/>\n\t\tWhen you eat too much chocolate, \n\t\t<strong>there are times when </strong>\n\t\tyou get a nosebleed."
