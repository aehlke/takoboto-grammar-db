    original_updated_at: null
  - position: 1
    text: "-ta form + koto ga aru/arimasu means \"ever\" or \"once\"\n\r\n-ta form + koto ga nai/arimasen means \"never\" or \"not once\"\n\n\n\r\nAffirmative:\n\r\nI once studied Spanish.\n\r\nスペイン語を勉強したことがある。\n\n\n\r\nNegative:\n\r\nI've never studied Spanish.\n\r\nスペイン語を勉強したことがない。"
    html: "-ta form + koto ga aru/arimasu means \"ever\" or \"once\"<br/>\r\n-ta form + koto ga nai/arimasen means \"never\" or \"not once\"<br/>\n<br/>\r\nAffirmative:<br/>\r\nI once studied Spanish.<br/>\r\nスペイン語を勉強したことがある。<br/>\n<br/>\r\nNegative:<br/>\r\nI've never studied Spanish.<br/>\r\nスペイン語を勉強したことがない。"
    credits_raw: illegalwaffles
    source_id: null
    original_created_at: null
    original_updated_at: null
