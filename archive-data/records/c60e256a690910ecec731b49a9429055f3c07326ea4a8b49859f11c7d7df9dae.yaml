    body_text: "たいてい私が犬を散歩させていた。しかし最近、妻が散歩させることがある。 \n\n\t\tI usually was the one walking the dog, but lately \n\t\tthere are times when \n\t\tmy wife does it."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJたいてい私が犬を散歩させていた。しかし最近、妻が散歩させることがある。\">\n\t\t\t\tたいてい私が犬を散歩させていた。しかし最近、妻が散歩させる<strong>ことがある</strong>。<strong></strong></a> <br/>\n\t\tI usually was the one walking the dog, but lately \n\t\t<strong>there are times when </strong>\n\t\tmy wife does it."
