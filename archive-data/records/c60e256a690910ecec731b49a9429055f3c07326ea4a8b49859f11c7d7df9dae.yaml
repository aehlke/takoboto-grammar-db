    credits_raw: tigert
    text: "wouldn`t this translate a little better as `there are times when`, sometimes already has a word 時々\n\n\n\r\nand since the grammar point uses  the existance verb ある, including it in the translation makes it a little easier to remember.  \n\n\n\r\nI hope you don`t mind but I made some changes to the above examples.\n\n\n\r\nnosebleed is a noun so it requires a preposition article\n\r\n\"solution way\" is redundant because a solution is a way\n\r\n相談する means to consult, 会話する means to conversate.\n\r\n研究室 translates to research room. of course it can also mean the professor`s office, but one would never say \"at your professor`s office\""
    html: "wouldn`t this translate a little better as `there are times when`, sometimes already has a word 時々<br/>\n<br/>\r\nand since the grammar point uses  the existance verb ある, including it in the translation makes it a little easier to remember.  <br/>\n<br/>\r\nI hope you don`t mind but I made some changes to the above examples.<br/>\n<br/>\r\nnosebleed is a noun so it requires a preposition article<br/>\r\n\"solution way\" is redundant because a solution is a way<br/>\r\n相談する means to consult, 会話する means to conversate.<br/>\r\n研究室 translates to research room. of course it can also mean the professor`s office, but one would never say \"at your professor`s office\""
    source_id: null
    original_created_at: null
