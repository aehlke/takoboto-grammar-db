    credits_raw: Tetsuzan
    text: "linnenpotter\n\n\n\r\nI believe from the explanation rubyhatchetさん has above, には, similar to にとって, does pertain to the subject of the sentence; however, には, at least from what I've seen, seems to single out and place emphasis on the preceding noun to the point that it is referring to what the doer can accomplish with their own abilities.  Hence it's why この仕事は私にはできない is correct.  には specifically refers to myself and what I'm describing what is capable by my own abilities and power.\n\n\n\r\nにとって、on the other hand has neither the specificity nor the singling out of the preceding noun.  Compare the following:\n\n\n\r\n外人にとって、納豆は食べにくい\n\r\nFor foreigners (from their standpoint), nattou is difficult to eat.\n\n\n\r\n外人には、納豆は食べにくい\n\r\nFor foreigners (specifically for them), nattou is difficult to eat.\n\n\n\r\nこの仕事は私にとって出来ない isn't grammatically correct since in this case we're referring to a problem specifically for us that is unable to be accomplished.  We need the specificity of には to throw across this notion.  \n\n\n\n#213, #6819, and #7036 are all correct usage since they're all describing situations from their own position and standpoint."
    html: "linnenpotter<br/>\n<br/>\r\nI believe from the explanation rubyhatchetさん has above, には, similar to にとって, does pertain to the subject of the sentence; however, には, at least from what I've seen, seems to single out and place emphasis on the preceding noun to the point that it is referring to what the doer can accomplish with their own abilities.  Hence it's why この仕事は私にはできない is correct.  には specifically refers to myself and what I'm describing what is capable by my own abilities and power.<br/>\n<br/>\r\nにとって、on the other hand has neither the specificity nor the singling out of the preceding noun.  Compare the following:<br/>\n<br/>\r\n外人にとって、納豆は食べにくい<br/>\r\nFor foreigners (from their standpoint), nattou is difficult to eat.<br/>\n<br/>\r\n外人には、納豆は食べにくい<br/>\r\nFor foreigners (specifically for them), nattou is difficult to eat.<br/>\n<br/>\r\nこの仕事は私にとって出来ない isn't grammatically correct since in this case we're referring to a problem specifically for us that is unable to be accomplished.  We need the specificity of には to throw across this notion.  <br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitotte#213\">#213</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitotte#6819\">#6819</a></b>, and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nitotte#7036\">#7036</a></b> are all correct usage since they're all describing situations from their own position and standpoint.  <br/>"
    source_id: null
