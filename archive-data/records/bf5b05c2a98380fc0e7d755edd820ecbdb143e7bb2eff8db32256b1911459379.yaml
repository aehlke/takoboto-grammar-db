notes:
  - position: 0
    text: "＊This grammar has the connotation of \"from the standpoint of; so far as s.o./s.t. is concerned.\"\n\n\n\r\n＊にとって cannot mark a noun which represents the \"semantic subject,\" or the doer of the action as expressed by the verb.\n\r\nUNGRAMMATICAL: この仕事は私にとってできない。\n\r\nGRAMMATICAL: この仕事は私にはできない。\n\n\n\r\n＊にとって(の) VS には: Because of the particle は, には gives a sense of contrast in some contexts while にとって(の) does not.\n\r\nFOR EXAMPLE: これは様々[には/にとって]無視できない問題だ。\n\r\nIn the above example, the sense with には can imply that not for others but for us, or at least for us, this is a problem which cannot be ignored. The sentence with にとって does not have this implication.\n\n\n\r\nFORMATION:\n\r\nＮ + にとって(は/も)"
    html: "＊This grammar has the connotation of \"from the standpoint of; so far as s.o./s.t. is concerned.\"<br/>\n<br/>\r\n＊にとって cannot mark a noun which represents the \"semantic subject,\" or the doer of the action as expressed by the verb.<br/>\r\nUNGRAMMATICAL: この仕事は私にとってできない。<br/>\r\nGRAMMATICAL: この仕事は私にはできない。<br/>\n<br/>\r\n＊にとって(の) VS には: Because of the particle は, には gives a sense of contrast in some contexts while にとって(の) does not.<br/>\r\nFOR EXAMPLE: これは様々[には/にとって]無視できない問題だ。<br/>\r\nIn the above example, the sense with には can imply that not for others but for us, or at least for us, this is a problem which cannot be ignored. The sentence with にとって does not have this implication.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＮ + にとって(は/も)"
