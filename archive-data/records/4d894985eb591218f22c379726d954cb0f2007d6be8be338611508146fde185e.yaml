notes:
  - position: 0
    text: "たまらない 【▽堪らない】 \n\n\n\r\n（連語）\n\n\n\r\n〔動詞「堪る」に打ち消しの助動詞「ない」の付いたもの。「たまらぬ」の形でも用いられる〕\n\n\n\r\n(1)持ちこたえられない。だめになってしまう。\n\r\n「いくら丈夫な身体でも無理がつづいては≠ﾈい」\n\n\n\r\n(2)ある感情・感覚をおさえきれない。がまんできない。\n\r\n「現在の生活が≠ﾈくいやになる」「寒くて≠ﾈい」「男性には≠ﾈい魅力を感じさせるらしい」\n\n\n\r\n(3)…されることに耐えられない。とても困る。\n\r\n「毎朝五時に起こされたのでは≠ﾈい」\n\n\n\r\n(4)程度がはなはだしい。じっとしていられないほどである。\n\r\n「≠ﾈくかわいい」「≠ﾈく好きだ」"
    html: "たまらない 【▽堪らない】 <br/>\n<br/>\r\n（連語）<br/>\n<br/>\r\n〔動詞「堪る」に打ち消しの助動詞「ない」の付いたもの。「たまらぬ」の形でも用いられる〕<br/>\n<br/>\r\n(1)持ちこたえられない。だめになってしまう。<br/>\r\n「いくら丈夫な身体でも無理がつづいては≠ﾈい」<br/>\n<br/>\r\n(2)ある感情・感覚をおさえきれない。がまんできない。<br/>\r\n「現在の生活が≠ﾈくいやになる」「寒くて≠ﾈい」「男性には≠ﾈい魅力を感じさせるらしい」<br/>\n<br/>\r\n(3)…されることに耐えられない。とても困る。<br/>\r\n「毎朝五時に起こされたのでは≠ﾈい」<br/>\n<br/>\r\n(4)程度がはなはだしい。じっとしていられないほどである。<br/>\r\n「≠ﾈくかわいい」「≠ﾈく好きだ」"
