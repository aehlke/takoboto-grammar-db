    credits_raw: xabre24
    text: |-
      As shown in Example #3111, another version of 〜と言っても　is 〜と言ったって. This is no less formal and has exactly the same meaning. A less formal and less common version is 〜ったって, which is placed after a plain affirmative verb, eg 帰るったって.
    html: |-
      As shown in Example <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=toittemo#3111">#3111</a></b>, another version of 〜と言っても　is 〜と言ったって. This is no less formal and has exactly the same meaning. A less formal and less common version is 〜ったって, which is placed after a plain affirmative verb, eg 帰るったって.<br/>
    source_id: null
    original_created_at: null
