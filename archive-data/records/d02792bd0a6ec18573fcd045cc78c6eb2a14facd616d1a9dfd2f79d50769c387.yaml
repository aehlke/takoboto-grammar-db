  - position: 2
    credits_raw: rubyhatchet
    text: "In the first example, the highlights are positioned wrong. 「大変だといっても3ヶ月間だけですから。」 (It's tough, but it only lasts three months.) The \"but\" should be highlighted. Also, the given English translation adds too many extras, such as \"you can say\" and \"keep in mind.\" Those are not present in the Japanese sentence. Also, can we try to remember periods?\n\n\n\r\nExample #4409 is in the wrong grammar entry. It should be in たとえ〜ても, which means \"even if.\" といっても by itself means \"yet, however, but.\" Also, the correct translation is, \"Even if I say that there's a convention, I really shouldn't ask them for so much money.\"\n\n\n\r\nExample #4412, it should be \"I was wrong after all.\" Example #5995 doesn't have an English translation, which should be \"Although there's a garden, it's rather tiny.\""
    html: "In the first example, the highlights are positioned wrong. 「大変だといっても3ヶ月間だけですから。」 (It's tough, but it only lasts three months.) The \"but\" should be highlighted. Also, the given English translation adds too many extras, such as \"you can say\" and \"keep in mind.\" Those are not present in the Japanese sentence. Also, can we try to remember periods?<br/>\n<br/>\r\nExample <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toittemo#4409\">#4409</a></b> is in the wrong grammar entry. It should be in たとえ〜ても, which means \"even if.\" といっても by itself means \"yet, however, but.\" Also, the correct translation is, \"Even if I say that there's a convention, I really shouldn't ask them for so much money.\"<br/>\n<br/>\r\nExample <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toittemo#4412\">#4412</a></b>, it should be \"I was wrong after all.\" Example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=toittemo#5995\">#5995</a></b> doesn't have an English translation, which should be \"Although there's a garden, it's rather tiny.\"<br/>\n<br/>"
    source_id: null
    original_created_at: null
