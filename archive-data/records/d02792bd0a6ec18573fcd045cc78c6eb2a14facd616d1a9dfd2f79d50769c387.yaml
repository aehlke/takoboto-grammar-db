    text: |-
      The translation for ex #5995 was inaccurate. 額（ひたい）in this context means "forehead", not "amount". So you get, "the forehead of a cat", an amusing Japanese way of saying "tiny". "The amount of a cat" makes absolutely no sense. Think harder next time about your translations.
    html: |-
      The translation for ex <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=toittemo#5995">#5995</a></b> was inaccurate. 額（ひたい）in this context means "forehead", not "amount". So you get, "the forehead of a cat", an amusing Japanese way of saying "tiny". "The amount of a cat" makes absolutely no sense. Think harder next time about your translations.
    source_id: null
