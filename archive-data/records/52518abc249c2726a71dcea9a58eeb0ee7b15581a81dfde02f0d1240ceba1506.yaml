notes:
  - position: 0
    text: "In regular I(ru-verbs) verbs such as 食べる one simply needs to drop the る and add て.\n\r\nIn regular II(u-verbs) verbs such as 買う one then can conjugate the verb into it's ます form. From there you simply follow the chart below.\n\n\n\r\ne.g. \n\r\n買う→買[い]ます→買って\n\r\n書く→書[き]ます→書いて\n\r\n勉強する→勉強[し]ます→勉強して\n\r\n遊ぶ→遊[び]ます→遊んで\n\n\n\r\nIrregulars: 来て、して\n\n\n\r\n※This can be sung to help you remember, use the tune of \"London Bridge is Falling Down\"※\n\n\n\r\nい,ち,り→って\n\r\nき→いて\n\r\nし→して\n\r\nぎ→いで\n\r\nに,み,び→んで\n\r\nい,ち,り→って\n\r\nに,み,び→んで　\n\r\n________________________________________________________________\n\r\nTo make a verb past tense simply change て to た."
    html: "In regular I(ru-verbs) verbs such as 食べる one simply needs to drop the る and add て.<br/>\r\nIn regular II(u-verbs) verbs such as 買う one then can conjugate the verb into it's ます form. From there you simply follow the chart below.<br/>\n<br/>\r\ne.g. <br/>\r\n買う→買[い]ます→買って<br/>\r\n書く→書[き]ます→書いて<br/>\r\n勉強する→勉強[し]ます→勉強して<br/>\r\n遊ぶ→遊[び]ます→遊んで<br/>\n<br/>\r\nIrregulars: 来て、して<br/>\n<br/>\r\n※This can be sung to help you remember, use the tune of \"London Bridge is Falling Down\"※<br/>\n<br/>\r\nい,ち,り→って<br/>\r\nき→いて<br/>\r\nし→して<br/>\r\nぎ→いで<br/>\r\nに,み,び→んで<br/>\r\nい,ち,り→って<br/>\r\nに,み,び→んで　<br/>\r\n________________________________________________________________<br/>\r\nTo make a verb past tense simply change て to た.<br/>"
