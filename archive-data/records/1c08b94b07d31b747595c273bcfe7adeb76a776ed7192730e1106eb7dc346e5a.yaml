  - position: 1
    credits_raw: 誠
    text: 'ex#5780 ものではない　means : " shouldn''t". So,I feel that it may be わけがない　(impossible, by no means) or ことができない'
    html: |-
      ex<b><a href="http://jgram.org:80/pages/viewOne.php?tagE=naraizashirazu#5780">#5780</a></b> ものではない　means : " shouldn't". So,I feel that it may be わけがない　(impossible, by no means) or ことができない
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: blabby
    text: ">誠\n\r\nThanks for your great contributions to this site!\n\r\nYes you are correct that わけがない and ことができない are good translations for \"by no means\"/\"impossible\". \n\n\n\r\nHowever, this example uses \"読める\" which is like saying \"できるものではない\" rather than just \"ものではない\". Therefore I stand by my translation."
    html: "&gt;誠<br/>\r\nThanks for your great contributions to this site!<br/>\r\nYes you are correct that わけがない and ことができない are good translations for \"by no means\"/\"impossible\". <br/>\n<br/>\r\nHowever, this example uses \"読める\" which is like saying \"できるものではない\" rather than just \"ものではない\". Therefore I stand by my translation."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: otenba
    text: You can also put 「は」 or 「だったら」 before 「いざしらず」, not only 「なら」.
    html: You can also put 「は」 or 「だったら」 before 「いざしらず」, not only 「なら」.
    source_id: null
    original_created_at: null
    original_updated_at: null
