    body_text: "辞書があるならいざ知らず、何もなくてはこの文章はとても読めるものではない。 \n\nMaybe it would be possible \n\t\tif I had a dictionary, but with nothing, it is by no means easy to read."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ辞書があるならいざ知らず、何もなくてはこの文章はとても読めるものではない。\">\n\t\t\t\t辞書がある<strong>ならいざ知らず</strong>、何もなくてはこの文章はとても読めるものではない。<strong></strong></a> <br/>\n<strong>Maybe it would be possible </strong>\n\t\tif I had a dictionary, but with nothing, it is by no means easy to read."
