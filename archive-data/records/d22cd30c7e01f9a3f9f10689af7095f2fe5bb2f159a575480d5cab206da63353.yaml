    label: kotonashini
    annotation_text: "kotonashini    (kotonashini is {verb (dict. form) + kotonashini}\n\r\nnashini is {noun + nashini}\n\n\n\r\nkotonashini expresses things that aren't possible without the preceding clause\n\n\n\r\nnashini is mostly instructional - \"don't come in without knocking\", \"you can't enter university without the proper forms\") [LR]"
    annotation_html: "<a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kotonashini\">kotonashini</a>    (kotonashini is {verb (dict. form) + kotonashini}<br/>\r\nnashini is {noun + nashini}<br/>\n<br/>\r\nkotonashini expresses things that aren't possible without the preceding clause<br/>\n<br/>\r\nnashini is mostly instructional - \"don't come in without knocking\", \"you can't enter university without the proper forms\") [<a href=\"http://jgram.org:80/pages/contributions.php?author=LR\">LR</a>]"
    credits_raw: LR
  - position: 1
    target_label: nakushite
    label: nakushite
    annotation_text: "nakushite    ((X) nashi ni (wa) is close in meaning to (X) nakushite (wa). nashi ni could replace nakushite in some cases:\n\r\n山川教授なしには今の私は存在しなかったであろう。\n\n\n\r\nHowever the reverse is not true - since nashini means \"without doing s.t. that should be done in advance\"\n\r\nAdvanced grammar dictionary - p317) [LR]"
    annotation_html: "<a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nakushite\">nakushite</a>    ((X) nashi ni (wa) is close in meaning to (X) nakushite (wa). nashi ni could replace nakushite in some cases:<br/>\r\n山川教授なしには今の私は存在しなかったであろう。<br/>\n<br/>\r\nHowever the reverse is not true - since nashini means \"without doing s.t. that should be done in advance\"<br/>\r\nAdvanced grammar dictionary - p317) [<a href=\"http://jgram.org:80/pages/contributions.php?author=LR\">LR</a>]"
    credits_raw: LR
