notes:
  - position: 0
    text: "＊This expression is nearly interchangeable with に違いない. However, に相違ない is a more formal expression.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + に相違ない\n\r\nＮ・なＡ + (である) + に相違ない\n\r\nいＡ + に相違ない"
