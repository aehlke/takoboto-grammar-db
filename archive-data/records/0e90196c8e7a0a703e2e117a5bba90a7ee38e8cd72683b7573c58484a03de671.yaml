    japanese: 現在の私たちにとって、もっとも重要なのは、地球の環境を守ることであろう。自分と関係がないと考えずに、自分の問題として、この問題を考えることが求められている。
    body_text: "現在の私たちにとって、もっとも重要なのは、地球の環境を守ることであろう。自分と関係がないと考えずに、自分の問題として、この問題を考えることが求められている。 \n\nI fear \n\t\tthe more essential fact nowdays is the planet invironnement.  If you don't think this have no relation whith you, you are part of the problem, and you will be asked to think about this problem."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ現在の私たちにとって、もっとも重要なのは、地球の環境を守ることであろう\">\n\t\t\t\t現在の私たちにとって、もっとも重要なのは、地球の環境を守ること<strong>であろう</strong><strong></strong>。自分と関係がないと考えずに、自分の問題として、この問題を考えることが求められている。</a> <br/>\n<strong>I fear </strong>\n\t\tthe more essential fact nowdays is the planet invironnement.  If you don't think this have no relation whith you, you are part of the problem, and you will be asked to think about this problem."
