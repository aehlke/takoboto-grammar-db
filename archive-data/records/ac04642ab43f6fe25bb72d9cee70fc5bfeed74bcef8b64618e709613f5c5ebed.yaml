notes:
  - position: 0
    text: "PLAIN FORMS of (Verb, Noun, i and na Adjectives) + からといって\n\r\n　\n\r\n文１　からといって、　文２\n\n\n\n\n\r\nIn general means that \" just because　文１ , does not necessarily mean..\". Although after the pattern in lots of cases there go negative sentenses (否定形）, it is not necessarily always so.\n\n\n\r\nWhat comes after the pattern showes or explains that in truth it is differ from what could be thought of 文１."
    html: "PLAIN FORMS of (Verb, Noun, i and na Adjectives) + からといって<br/>\r\n　<br/>\r\n文１　からといって、　文２<br/>\n<br/>\n<br/>\r\nIn general means that \" just because　文１ , does not necessarily mean..\". Although after the pattern in lots of cases there go negative sentenses (否定形）, it is not necessarily always so.<br/>\n<br/>\r\nWhat comes after the pattern showes or explains that in truth it is differ from what could be thought of 文１."
    credits_raw: missshapoooo
    source_id: null
    original_created_at: null
    original_updated_at: null
