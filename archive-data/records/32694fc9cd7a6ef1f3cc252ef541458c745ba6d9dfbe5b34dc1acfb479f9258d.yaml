  - position: 4
    credits_raw: blabby
    text: "When I learnt this grammar for the first time, my teacher said not to think of it in terms of 見る/see. I have never seen the kanji 見 used for this grammar.\n\n\n\r\nChecking google\n\r\n行ってみる - 3,400,000 results.\n\r\n行って見る - 179,000 results. Howerver many results were out of this context.\n\n\n\r\nyookoso, thanks for that explanation. That textbook sounds very helpful. I think it is about level 3 too."
    html: "When I learnt this grammar for the first time, my teacher said not to think of it in terms of 見る/see. I have never seen the kanji 見 used for this grammar.<br/>\n<br/>\r\nChecking google<br/>\r\n行ってみる - 3,400,000 results.<br/>\r\n行って見る - 179,000 results. Howerver many results were out of this context.<br/>\n<br/>\r\nyookoso, thanks for that explanation. That textbook sounds very helpful. I think it is about level 3 too."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: yookoso
    text: "I am still reading the Basic Connections book, but I can already say it is excellent. It was written \"to provide helpful information about Japanese expressions and usages that facilitate the flow of ideas and thought in written and spoken Japanese...The book focuses on those grammatical items, idiomatic expressions, and set phrases that have proven to be most problematic to students.\" It is an inexpensive, small paperback that I highly recommend. \n\r\nRef: http://www.amazon.com/exec/obidos/ASIN/4770028601/"
    html: "I am still reading the Basic Connections book, but I can already say it is excellent. It was written \"to provide helpful information about Japanese expressions and usages that facilitate the flow of ideas and thought in written and spoken Japanese...The book focuses on those grammatical items, idiomatic expressions, and set phrases that have proven to be most problematic to students.\" It is an inexpensive, small paperback that I highly recommend. <br/>\r\nRef: <a href=\"http://www.amazon.com/exec/obidos/ASIN/4770028601/\">http://www.amazon.com/exec/obidos/ASIN/4770028601/</a>"
