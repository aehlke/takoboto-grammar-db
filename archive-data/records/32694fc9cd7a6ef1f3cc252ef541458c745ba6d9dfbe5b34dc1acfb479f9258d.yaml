notes:
  - position: 0
    text: "見る (miru) as a verb means to see, but used with another verb it means \"try to do something\".\n\n\n\r\ntheres a similar phrase in english: \"try it and see\""
    html: "見る (miru) as a verb means to see, but used with another verb it means \"try to do something\".<br/>\n<br/>\r\ntheres a similar phrase in english: \"try it and see\""
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "used with the -te form of the previous verb\n\r\n書いてみる　- try and write it\n\r\n食べてみる　- try and eat it (taste a bit of it to see what its like)"
    html: "used with the -te form of the previous verb<br/>\r\n書いてみる　- try and write it<br/>\r\n食べてみる　- try and eat it (taste a bit of it to see what its like)"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "miru itself can be converted to a -te form to keep the sentence flowing... like \n\n\n\r\n食べてみたけど、、、\n\r\nI tried to eat it, but...\n\r\n(-ta is past of -te)"
    html: "miru itself can be converted to a -te form to keep the sentence flowing... like <br/>\n<br/>\r\n食べてみたけど、、、<br/>\r\nI tried to eat it, but...<br/>\r\n(-ta is past of -te)"
    credits_raw: dc
    source_id: null
