  - position: 2
    credits_raw: yookoso
    text: "Success and Failure: \n\r\nAccording to the book Basic Connections by Kakuko Shoji, 〜てみた indicates that the subject actually tried and achieved the result. When the speaker tried or intended to do something but failed, 〜うとした (volitional verb form + toshita) is used.\n\n\n\r\nexample: 一所懸命、納豆を食べようとしたのですが、やっぱりだめでした。\n\r\n(Isshoukenmei, nattou o tabeyou to shita no desu ga, yappari dame deshita)"
    html: "Success and Failure: <br/>\r\nAccording to the book Basic Connections by Kakuko Shoji, 〜てみた indicates that the subject actually tried and achieved the result. When the speaker tried or intended to do something but failed, 〜うとした (volitional verb form + toshita) is used.<br/>\n<br/>\r\nexample: 一所懸命、納豆を食べようとしたのですが、やっぱりだめでした。<br/>\r\n(Isshoukenmei, nattou o tabeyou to shita no desu ga, yappari dame deshita)"
    source_id: null
    original_created_at: null
    original_updated_at: null
