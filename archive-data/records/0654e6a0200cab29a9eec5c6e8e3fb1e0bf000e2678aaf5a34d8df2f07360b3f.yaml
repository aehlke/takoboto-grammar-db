    japanese: コミュニケーションの方法が多種にわたって増加する一方で、人間関係が希薄なものになりつつある。まさに本末転倒だ。
    body_text: "コミュニケーションの方法が多種にわたって増加する一方で、人間関係が希薄なものになりつつある。まさに本末転倒だ。 \n\n\t\tThe interpersonal relationship is becoming thin while the method of communications increases over many kinds. It is mistaking the means for the end exactly."
