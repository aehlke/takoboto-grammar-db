  - position: 1
    credits_raw: dc
    text: "i guess you're right, although つもり often comes up as a grammar item. the usage is different too.\n\n\n\r\n行くつもりがあります\n\r\n行く予定です。\n\n\n\r\n合ってる？"
    html: "i guess you're right, although つもり often comes up as a grammar item. the usage is different too.<br/>\n<br/>\r\n行くつもりがあります<br/>\r\n行く予定です。<br/>\n<br/>\r\n合ってる？"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: yookoso
    text: |-
      I also have come across つもり and 予定 during class studies. If I recall correctly, つもり can only be used to discuss yourself whereas 予定 can be used to discuss yourself or others.
    html: |-
      I also have come across つもり and 予定 during class studies. If I recall correctly, つもり can only be used to discuss yourself whereas 予定 can be used to discuss yourself or others.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: bamboo4
    text: "Yes, dc, you are correct. yookoo is also correct in that つもり is essentuially used to express one's intentions, but you have to say that is not necessarily absolute. When you ask a question like あなたは行くつもりですか？ \"tumori\" in that context is not your own but somebody else's so that it is esentially equivalent to あなたは行く予定ですか？.\n\n\n\r\nThe example I gave for 予定,however, cannot be replaced by つもり."
    html: "Yes, dc, you are correct. yookoo is also correct in that つもり is essentuially used to express one's intentions, but you have to say that is not necessarily absolute. When you ask a question like あなたは行くつもりですか？ \"tumori\" in that context is not your own but somebody else's so that it is esentially equivalent to あなたは行く予定ですか？.<br/>\n<br/>\r\nThe example I gave for 予定,however, cannot be replaced by つもり.<br/>"
    source_id: null
    original_created_at: null
