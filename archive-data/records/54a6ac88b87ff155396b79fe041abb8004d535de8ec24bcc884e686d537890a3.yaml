  - source_id: 5487
    position: 5
    japanese: 僕には自転車を買う余裕がなかった。ましてや車なんて。
    body_text: "僕には自転車を買う余裕がなかった。ましてや車なんて。  \n\n\t\tI could not afford to buy a bicycle, much less a car."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ僕には自転車を買う余裕がなかった。ましてや車なんて。 \">\n\t\t\t\t僕には自転車を買う余裕がなかった。<strong>ましてや</strong>車なんて。 <strong></strong></a> <br/>\n\t\tI could not afford to buy a bicycle, much less a car. \n\t\t<strong> </strong>"
