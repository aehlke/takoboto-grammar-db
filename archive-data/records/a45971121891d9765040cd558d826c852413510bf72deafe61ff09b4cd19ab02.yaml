  - position: 10
    credits_raw: komainu
    text: |-
      The difference between ばかりか and だけでなくseems to be that ばかりか is not used in sentences expressing wish, desire, an order or command.  So like 寿司ばかりか、肉も食べたい。　would be incorrect, as it expresses desire.
    html: |-
      The difference between ばかりか and だけでなくseems to be that ばかりか is not used in sentences expressing wish, desire, an order or command.  So like 寿司ばかりか、肉も食べたい。　would be incorrect, as it expresses desire.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: komainu
    text: In addition, ばかりでなく can be used to express a command or desire, while ばかりか is not. お菓子ばかりでなく、ご飯もちゃんと食べなさい。
    html: In addition, ばかりでなく can be used to express a command or desire, while ばかりか is not. お菓子ばかりでなく、ご飯もちゃんと食べなさい。
    source_id: null
