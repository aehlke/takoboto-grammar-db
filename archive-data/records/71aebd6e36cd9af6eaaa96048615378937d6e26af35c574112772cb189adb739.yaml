comments:
  - position: 0
    credits_raw: Miki
    text: "The Japanese is not natural from the context. It should be 毎年9月の最終日曜日.\n\r\nFor example, if the Sunday was 26th, we don't say 9月末（９がつすえ）。\n\r\nちなみに、月末（げつまつ） is at the end of month. 下旬（げじゅん） is end of month."
    html: "The Japanese is not natural from the context. It should be 毎年9月の最終日曜日.<br/>\r\nFor example, if the Sunday was 26th, we don't say 9月末（９がつすえ）。<br/>\r\nちなみに、月末（げつまつ） is at the end of month. 下旬（げじゅん） is end of month."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "9月末 is read ９がつまつ.\n\r\nhmm but I found some sites 毎年○月末の▲曜日…。"
    html: "9月末 is read ９がつまつ.<br/>\r\nhmm but I found some sites 毎年○月末の▲曜日…。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: I agree with Miki. It sounds more natural. If you don't like 最終日曜日、you can say 最後の日曜日.
    html: |-
      I agree with Miki. It sounds more natural. If you don't like 最終日曜日、you can say 最後の日曜日.<br/>
