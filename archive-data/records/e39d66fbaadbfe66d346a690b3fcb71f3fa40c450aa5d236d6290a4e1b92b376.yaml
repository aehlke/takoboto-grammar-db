comments:
  - position: 0
    credits_raw: dc
    text: can someone explain the difference between this and just node ?
    html: |-
      can someone explain the difference between this and just <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=node">node</a></b> ?<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bi-ru
    text: "I think it is simply that if the clause before node is a noun, such as in this example, then you use 'nanode'. If it is a verb then you only use 'node'. \n\n\n\r\nAs far as I know, 'na' seems to be related to the copula 'da', and can be seen in other similar circumstances such as 'nanoni'. Exactly why it changes to na instead of da I don't know. \n\n\n\r\nContrast 'sou da to omou',and 'sou na node...'"
    html: "I think it is simply that if the clause before node is a noun, such as in this example, then you use 'nanode'. If it is a verb then you only use 'node'. <br/>\n<br/>\r\nAs far as I know, 'na' seems to be related to the copula 'da', and can be seen in other similar circumstances such as 'nanoni'. Exactly why it changes to na instead of da I don't know. <br/>\n<br/>\r\nContrast 'sou da to omou',and 'sou na node...'<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: な is 連体形 of 助動詞「だ」which inflect as だろ、で、だっ、だ、な、なら but な only connects to particles の、ので、のに.
    html: |-
      な is 連体形 of 助動詞「だ」which inflect as だろ、で、だっ、だ、な、なら but な only connects to particles の、ので、のに.<br/>
    source_id: null
    original_created_at: null
