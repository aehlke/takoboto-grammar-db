  - position: 0
    text: "This is an auxiliary which expresses the negative volition or conjecture of the speaker. It is basically a written form, used in formal writing.\n\n\n\r\nFor Gr. 2 verbs, Ｖmasu is occasionally used instead of Ｖinf・nonpast. For irregular verbs, すまい and こまい are sometimes used instead of するまいand くるまい, respectively. See examples #6088, #6089, and #6090.\n\n\n\r\nまい does not have a past form. The past tense is expressed by other verbs. See examples #6091 and #6092.\n\n\n\r\nThe volition of someone other than the speaker can be expressed by まい, as in example #6093. Note that と思う is used to express the volition of someone other than the speaker. Thus, example #6094 expresses the conjecture of the speaker rather than the volition of Keiko.\n\n\n\r\nＶinf・nonpastまいとする expresses the idea of \"try not to Ｖ.\" See example #6095. When this structure is used in a subordinate clause, する is often omitted, as in example #6096.\n\n\n\r\nＶvolitionalかＶinf・nonpastまいか expresses the idea \"whether (I) will Ｖ or not,\" as in example #6098."
    html: "This is an auxiliary which expresses the negative volition or conjecture of the speaker. It is basically a written form, used in formal writing.<br/>\n<br/>\r\nFor Gr. 2 verbs, Ｖmasu is occasionally used instead of Ｖinf・nonpast. For irregular verbs, すまい and こまい are sometimes used instead of するまいand くるまい, respectively. See examples <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6088\">#6088</a></b>, <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6089\">#6089</a></b>, and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6090\">#6090</a></b>.<br/>\n<br/>\r\nまい does not have a past form. The past tense is expressed by other verbs. See examples <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6091\">#6091</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6092\">#6092</a></b>.<br/>\n<br/>\r\nThe volition of someone other than the speaker can be expressed by まい, as in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6093\">#6093</a></b>. Note that と思う is used to express the volition of someone other than the speaker. Thus, example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6094\">#6094</a></b> expresses the conjecture of the speaker rather than the volition of Keiko.<br/>\n<br/>\r\nＶinf・nonpastまいとする expresses the idea of \"try not to Ｖ.\" See example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6095\">#6095</a></b>. When this structure is used in a subordinate clause, する is often omitted, as in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6096\">#6096</a></b>.<br/>\n<br/>\r\nＶvolitionalかＶinf・nonpastまいか expresses the idea \"whether (I) will Ｖ or not,\" as in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=mai-2#6098\">#6098</a></b>."
    credits_raw: rubyhatchet
