  - position: 1
    text: "Ｖnonpastまい\n\r\n1. 行くまい (〜will not go; probably will not go)\n\r\n2. 教えるまい (〜will not teach; probably will not teach)\n\n\n\r\nAdj(i)stemくはあるまい\n\r\n1. 高くはあるまい (〜is probably not expensive)\n\n\n\r\nAdj(na)stem/Nounであるまい\n\r\n1. 静かではあるまい (〜is probably not quiet)\n\r\n2. 先生ではあるまい (〜is probably not a teacher)"
    html: "Ｖnonpastまい<br/>\r\n1. 行くまい (〜will not go; probably will not go)<br/>\r\n2. 教えるまい (〜will not teach; probably will not teach)<br/>\n<br/>\r\nAdj(i)stemくはあるまい<br/>\r\n1. 高くはあるまい (〜is probably not expensive)<br/>\n<br/>\r\nAdj(na)stem/Nounであるまい<br/>\r\n1. 静かではあるまい (〜is probably not quiet)<br/>\r\n2. 先生ではあるまい (〜is probably not a teacher)"
