title_raw: てやがる ([てやがる] )(teyagaru)
title: てやがる
reading: てやがる
romanized_label: teyagaru
category: grammar
jlpt_level_original: '2'
meaning: |-
  Verb suffix emphasizing a disliking of the action taken. To describe someone is doing something which is annoying to the speaker. 自分にとって嫌なことや、して欲しくないことを相手がしてきた時に使う。主に男性が使う言葉で、きれいな言葉ではない。
meaning_example: What have you done?!
