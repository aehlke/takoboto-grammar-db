notes:
  - position: 0
    text: "Formal. Kiwamaru and kiwamarinai are exactly the same meaning and can be used interchangeably. Kiwamatte is also the same meaning, but is used as a conjunction and is often used with the word感 (かん, feeling).\n\n\n\r\nsee http://www.geocities.com/easykanji/jlptgrammar.html"
    html: "Formal. Kiwamaru and kiwamarinai are exactly the same meaning and can be used interchangeably. Kiwamatte is also the same meaning, but is used as a conjunction and is often used with the word感 (かん, feeling).<br/>\n<br/>\r\nsee <a href=\"http://www.geocities.com/easykanji/jlptgrammar.html\">http://www.geocities.com/easykanji/jlptgrammar.html</a>"
