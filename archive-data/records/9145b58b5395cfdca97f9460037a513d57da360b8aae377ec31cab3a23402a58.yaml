  - position: 4
    credits_raw: erekose200
    text: So what is the difference between 「がち」and 「ぎみ」？
    html: |-
      So what is the difference between 「がち」and 「ぎみ」？<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: bluntcrayon
    text: "The main difference between 「がち」and ぎみ is that 「がち」usually describes a general tendency in someone or something while 「ぎみ」describes a visible indication of a tendency. \n\r\ne.g. 1 田中は最近太りがちだ\n\r\nTanaka has a general tendency to gain weigh but is not necessarily overweight at the moment of speech。Compare with;\n\r\n２）田中は最近太り気味だ\n\r\nTanaka is showing signs of being overweight。\n\n\n\r\nAlso 「がち」Cannot express the idea of \"a touch of\" or \" a little\".\n\r\n(taken from the Intermediate grammar dictionary)"
    html: "The main difference between 「がち」and ぎみ is that 「がち」usually describes a general tendency in someone or something while 「ぎみ」describes a visible indication of a tendency. <br/>\r\ne.g. 1 田中は最近太りがちだ<br/>\r\nTanaka has a general tendency to gain weigh but is not necessarily overweight at the moment of speech。Compare with;<br/>\r\n２）田中は最近太り気味だ<br/>\r\nTanaka is showing signs of being overweight。<br/>\n<br/>\r\nAlso 「がち」Cannot express the idea of \"a touch of\" or \" a little\".<br/>\r\n(taken from the Intermediate grammar dictionary)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 6
    credits_raw: hungry-sumo
    text: "does gimi work with adjectives?\n\n\n\r\nlike 暑い気味"
