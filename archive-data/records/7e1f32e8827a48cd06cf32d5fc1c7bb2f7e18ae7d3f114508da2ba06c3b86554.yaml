examples:
  - source_id: 5726
    position: 0
    japanese: 雪だからこそ、うちにいたくない。雪の日にうちにいるのは寂しすぎる。
    body_text: "雪だからこそ、うちにいたくない。雪の日にうちにいるのは寂しすぎる。 \n\n\t\tI don't want to stay at home, \n\t\tespecially since \n\t\t  it's snowing. On snowy days, being at home is too lonely."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ雪だからこそ、うちにいたくない。雪の日にうちにいるのは寂しすぎる。\">\n\t\t\t\t雪<strong>だからこそ</strong>、うちにいたくない。雪の日にうちにいるのは寂しすぎる。<strong></strong></a> <br/>\n\t\tI don't want to stay at home, \n\t\t<strong>especially since </strong>\n\t\t  it's snowing. On snowy days, being at home is too lonely."
    credits_raw: srobertson
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5727
    position: 1
    japanese: 頭がいいと思っているからこそ、厳しくしつけるのです。
    body_text: "頭がいいと思っているからこそ、厳しくしつけるのです。 \n\n\t\tIt's \n\t\tprecisely because \n\t\t  I think you've got brains that I'm bringing you up so strictly."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ頭がいいと思っているからこそ\">\n\t\t\t\t頭がいいと思っている<strong>からこそ</strong><strong></strong>、厳しくしつけるのです。</a> <br/>\n\t\tIt's \n\t\t<strong>precisely because </strong>\n\t\t  I think you've got brains that I'm bringing you up so strictly."
    credits_raw: srobertson
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 5728
    position: 2
    japanese: 実は、知らない人ばかりだったからこそ、言いにくいことも言うことができたのだ。
    body_text: "実は、知らない人ばかりだったからこそ、言いにくいことも言うことができたのだ。 \n\n\t\tActually, it was \n\t\tespecially_because \n\t\t  they were all people I didn't know that I was able to say things I usually find difficult to say."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ実は、知らない人ばかりだったからこそ、言いにくいことも言うことができたのだ。\">\n\t\t\t\t実は、知らない人ばかりだった<strong>からこそ</strong>、言いにくいことも言うことができたのだ。<strong></strong></a> <br/>\n\t\tActually, it was \n\t\t<strong>especially_because </strong>\n\t\t  they were all people I didn't know that I was able to say things I usually find difficult to say."
    credits_raw: srobertson
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6503
    position: 3
    japanese: 手伝ってくれたからこそ、仕事が早く出来ましたよ。
    body_text: "手伝ってくれたからこそ、仕事が早く出来ましたよ。 \n\n\t\tI was able to do this work quickly, \n\t\t(especially) because of \n\t\t  all your help."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ手伝ってくれたからこそ、仕事が早く出来ましたよ。\">\n\t\t\t\t手伝ってくれた<strong>からこそ</strong>、仕事が早く出来ましたよ。<strong></strong></a> <br/>\n\t\tI was able to do this work quickly, \n\t\t<strong>(especially) because of </strong>\n\t\t  all your help."
    credits_raw: aoiaki
    verification_class:
      - bottom
