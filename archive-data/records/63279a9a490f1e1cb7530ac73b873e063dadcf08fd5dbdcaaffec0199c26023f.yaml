  - position: 1
    text: "The na adjective version of ookii can only be used with abstract concepts.\n\r\ni.e. ookina mondai (a big problem)."
    html: "The na adjective version of ookii can only be used with abstract concepts.<br/>\r\ni.e. ookina mondai (a big problem)."
    credits_raw: deviruchi
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "Adjectives are seperated into 3 groups, much the same way that verbs are. these groups are\n\r\nい-Adjectives, な-Adjectives, and irregular Adjectives. \n\n\n\r\nいーadjectives are the easiest to spot because the end with い\n\r\nexamples\n\r\nおいし<font color=blue>い</font>\n\r\n大き<font color=blue>い</font>\n\r\n小さ<font color=blue>い</font>\n\n\n\r\nな-adjectives are all adjectives that don`t end with い, they are called な- adjectives because when you attach them to nouns you insert a な　at the end of the adjective.\n\r\nexample\n\r\n親切<font color=red size=1>な</font>ひと\n\r\nat the moment I can@t think of any other examples but trust me there are more than a few な　adjectives. if you see two kanji together then chances are it is a な adjective. \n\n\n\r\nthe final group is the Irregulare adjectives. As I`m sure you have guessed they get their name because they don`t follow the rules of the other two groups. Irregulare adjectives are adjectives that end in い　but when attached to a noun follow the rules of the な　adjectives.\n\r\nThe best example of this is \n\r\nきれ<font color=blue>い</font><font color=red>な</font>女\n\n\n\r\nirregulare adjectives are the least common the the three groups.\n\n\n\r\nUsing な with い-Adjectives\n\r\nit is true that you can treat most いadjectives as な adjectives by replacing the final い　with な\n\r\n大きな問題\n\r\n小さな間違い\n\n\n\r\nbut as far as I know this can only be used with abstract concepts. I have heard it used to discribe objects, but only when the object was a wish or desire"
    html: "Adjectives are seperated into 3 groups, much the same way that verbs are. these groups are<br/>\r\nい-Adjectives, な-Adjectives, and irregular Adjectives. <br/>\n<br/>\r\nいーadjectives are the easiest to spot because the end with い<br/>\r\nexamples<br/>\r\nおいし&lt;font color=blue&gt;い&lt;/font&gt;<br/>\r\n大き&lt;font color=blue&gt;い&lt;/font&gt;<br/>\r\n小さ&lt;font color=blue&gt;い&lt;/font&gt;<br/>\n<br/>\r\nな-adjectives are all adjectives that don`t end with い, they are called な- adjectives because when you attach them to nouns you insert a な　at the end of the adjective.<br/>\r\nexample<br/>\r\n親切&lt;font color=red size=1&gt;な&lt;/font&gt;ひと<br/>\r\nat the moment I can@t think of any other examples but trust me there are more than a few な　adjectives. if you see two kanji together then chances are it is a な adjective. <br/>\n<br/>\r\nthe final group is the Irregulare adjectives. As I`m sure you have guessed they get their name because they don`t follow the rules of the other two groups. Irregulare adjectives are adjectives that end in い　but when attached to a noun follow the rules of the な　adjectives.<br/>\r\nThe best example of this is <br/>\r\nきれ&lt;font color=blue&gt;い&lt;/font&gt;&lt;font color=red&gt;な&lt;/font&gt;女<br/>\n<br/>\r\nirregulare adjectives are the least common the the three groups.<br/>\n<br/>\r\nUsing な with い-Adjectives<br/>\r\nit is true that you can treat most いadjectives as な adjectives by replacing the final い　with な<br/>\r\n大きな問題<br/>\r\n小さな間違い<br/>\n<br/>\r\nbut as far as I know this can only be used with abstract concepts. I have heard it used to discribe objects, but only when the object was a wish or desire"
    credits_raw: tigert
