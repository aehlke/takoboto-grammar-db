  - position: 3
    credits_raw: inevittable
    text: |-
      This is similar to darake, but mimare is only for liquids or powders like blood or dust, whereas darake can be for these things and things like mistakes, and holes (as in a car riddled with bullet holes).
    html: |-
      This is similar to darake, but mimare is only for liquids or powders like blood or dust, whereas darake can be for these things and things like mistakes, and holes (as in a car riddled with bullet holes).
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: tmkain
    text: inevittable, I'm pretty sure 4175 needs the に because まみれ is in its verb form and not followed by だ or だった。
