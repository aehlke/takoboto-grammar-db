notes:
  - position: 0
    text: |-
      Is only used for powdery like, or liquid such as blood, dust, oil, etc. Mamire is meant for physical items. However, this physicality can be stretched enough to include things that are related to a physical state such as failure or trends which both of which show the current state of something. Similar to mamire, darake is similar and can be used for both physical and abstract concepts.
    html: |-
      Is only used for powdery like, or liquid such as blood, dust, oil, etc. Mamire is meant for physical items. However, this physicality can be stretched enough to include things that are related to a physical state such as failure or trends which both of which show the current state of something. Similar to mamire, <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=darake">darake</a></b> is similar and can be used for both physical and abstract concepts.
