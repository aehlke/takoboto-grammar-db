    body_text: "さすがに偉大な学者だけあって、彼はその問いに容易に答えた。 \n\nLike \n\t\tthe great scholar that he was, he answered the question easily."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJさすがに偉大な学者だけあって、彼はその問いに容易に答えた。\">\n<strong>さすがに</strong>偉大な学者だけあって、彼はその問いに容易に答えた。<strong></strong></a> <br/>\n<strong>Like </strong>\n\t\tthe great scholar that he was, he answered the question easily."
