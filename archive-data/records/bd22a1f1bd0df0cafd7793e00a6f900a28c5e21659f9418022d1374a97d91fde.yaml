    japanese: 年の功と言うのか、彼の意見はさすがに一日の長があるね。
    body_text: "年の功と言うのか、彼の意見はさすがに一日の長があるね。 \n\n\t\tMaybe it's his age but his opinions seem a little more grounded in experience than everyone else's."
