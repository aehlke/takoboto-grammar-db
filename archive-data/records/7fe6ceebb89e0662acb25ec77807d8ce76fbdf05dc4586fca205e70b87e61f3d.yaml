    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ祖母が編んだセーターを見るにつけ、やさしかった祖母を思い出す。\">\n\t\t\t\t祖母が編んだセーターを見る<strong>につけ</strong>、やさしかった祖母を思い出す。\r<strong></strong></a> <br/>\n\t\tWhen I look at the sweater my grandma knitted, I always remember her kindness. \n\t\t<strong> </strong>"
