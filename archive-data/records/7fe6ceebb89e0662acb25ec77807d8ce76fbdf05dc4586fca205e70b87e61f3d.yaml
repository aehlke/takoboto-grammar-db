    japanese: 親は、暑いにつけ寒いにつけ、離れて暮らす子供を思い出し、心配するものだ。
    body_text: "親は、暑いにつけ寒いにつけ、離れて暮らす子供を思い出し、心配するものだ。 \n\nBe it \n\t\t(the weather) hot or cold, parents remember their children who live away from home, and are prone to worry."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ親は、暑いにつけ寒い\">\n\t\t\t\t親は、暑い<strong>につけ</strong>寒い<strong>につけ</strong>、離れて暮らす子供を思い出し、心配するものだ。</a> <br/>\n<strong>Be it </strong>\n\t\t(the weather) hot or cold, parents remember their children who live away from home, and are prone to worry."
