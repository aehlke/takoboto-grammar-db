    japanese: 試験での失敗を思い出すにつけ、悔しさがよみがえる。
    body_text: "試験での失敗を思い出すにつけ、悔しさがよみがえる。 \n\n\t\tMy regrets come back \n\t\teach time \n\t\tI remember the exam that I failed."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ試験での失敗を思い出すにつけ、悔しさがよみがえる。\">\n\t\t\t\t試験での失敗を思い出す<strong>につけ</strong>、悔しさがよみがえる。<strong></strong></a> <br/>\n\t\tMy regrets come back \n\t\t<strong>each time </strong>\n\t\tI remember the exam that I failed."
