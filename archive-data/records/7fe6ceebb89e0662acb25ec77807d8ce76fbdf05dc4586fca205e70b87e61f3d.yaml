    body_text: "私が料理すると、味が濃いにつけ薄いにつけ、家族から文句が出る。 \n\n\t\tWhen I cook, \n\t\twhether \n\t\tthe taste is strong or bland, my family complains."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私が料理すると、味が濃いにつけ薄い\">\n\t\t\t\t私が料理すると、味が濃い<strong>につけ</strong>薄い<strong>につけ</strong>、家族から文句が出る。</a> <br/>\n\t\tWhen I cook, \n\t\t<strong>whether </strong>\n\t\tthe taste is strong or bland, my family complains."
