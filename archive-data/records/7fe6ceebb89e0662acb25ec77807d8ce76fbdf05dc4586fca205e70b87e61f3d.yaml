notes:
  - position: 0
    text: "＊A tricky piece of grammar. The meaning in Japanese is as follows:\n\r\n〜ときは、いつも\n\r\n〜ときも、ときも\n\n\n\r\n＊「Ａにつけ、Ｂにつけ」 is a common construction. A and B are often pairs or two of a kind, such as strong/weak, good/evil, etc.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + につけ\n\r\nいＡ + につけ"
    html: "＊A tricky piece of grammar. The meaning in Japanese is as follows:<br/>\r\n〜ときは、いつも<br/>\r\n〜ときも、ときも<br/>\n<br/>\r\n＊「Ａにつけ、Ｂにつけ」 is a common construction. A and B are often pairs or two of a kind, such as strong/weak, good/evil, etc.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + につけ<br/>\r\nいＡ + につけ"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
