    japanese: 来春結婚する孫が、結婚の報告かたがた婚約者を連れてやってきた。
    body_text: "来春結婚する孫が、結婚の報告かたがた婚約者を連れてやってきた。 \n\n\t\tMy grandson, who is getting married next spring, has brought his fiancee with him to visit \n\t\twhile \n\t\tbringing us news of his wedding."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ来春結婚する孫が、結婚の報告かたがた婚約者を連れてやってきた。\">\n\t\t\t\t来春結婚する孫が、結婚の報告<strong>かたがた</strong>婚約者を連れてやってきた。<strong></strong></a> <br/>\n\t\tMy grandson, who is getting married next spring, has brought his fiancee with him to visit \n\t\t<strong>while </strong>\n\t\tbringing us news of his wedding."
