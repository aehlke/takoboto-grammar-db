    text: "Does this mean that while doing X, you have the alternate motive of Y? I'm using 新完全マスターN1 and it says: 〜という別の目的も持って、ことをする。\n\r\nTo me, this makes it seems like that the difference between 〜かたがた and 〜ついでに,etc. is motive"
