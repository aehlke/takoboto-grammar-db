    body_text: "無事に卒業できたので、恩師に報告かたがた、手紙を書いた. \n\n\t\tShe was able to graduate without any problems \n\t\tand so \n\t\twrote a letter to thank her professor."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ無事に卒業できたので、恩師に報告かたがた、手紙を書いた.\">\n\t\t\t\t無事に卒業できたので、恩師に報告<strong>かたがた</strong>、手紙を書いた.<strong></strong></a> <br/>\n\t\tShe was able to graduate without any problems \n\t\t<strong>and so </strong>\n\t\twrote a letter to thank her professor."
