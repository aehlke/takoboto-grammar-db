  - position: 3
    text: "On the difference between womotte1 and womotte2\n\nwomotte1 is a Time phrase\n\r\nmeaning \"at\"  - marks beginnings, ends, or borders between times.\n\r\nIt is often used as a greeting to お客 with the extended form  をもちまして.\n\nwomotte2 is the method by which you do something - victory achieved via effort, announcement made via a blackboard.\n\n\n\r\nBoth are formal, both are NOUN + をもって\n\r\nbe careful."
    html: "<b>On the difference between <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=womotte1\">womotte1</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=womotte2\">womotte2</a></b></b><br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=womotte1\">womotte1</a></b> is a Time phrase<br/>\r\nmeaning \"at\"  - marks beginnings, ends, or borders between times.<br/>\r\nIt is often used as a greeting to お客 with the extended form  をもちまして.<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=womotte2\">womotte2</a></b> is the method by which you do something - victory achieved via effort, announcement made via a blackboard.<br/>\n<br/>\r\nBoth are formal, both are NOUN + をもって<br/>\r\nbe careful."
    credits_raw: LR
