notes:
  - position: 0
    text: "てある only combines with transitive verbs, never intransitive. \n\r\nThe result of transitive + てある is an intransitive itself.\n\n\n\r\n窓が開いている -> The window is open. (no agent or reason implied)\n\n\n\r\n窓が開けてある -> The window is open (because someone opened it)."
    html: "てある only combines with transitive verbs, never intransitive. <br/>\r\nThe result of transitive + てある is an intransitive itself.<br/>\n<br/>\r\n窓が開いている -&gt; The window is open. (no agent or reason implied)<br/>\n<br/>\r\n窓が開けてある -&gt; The window is open (because someone opened it)."
