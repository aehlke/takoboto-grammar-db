    japanese: 引き受けるにしろ引き受けないにしろ、なるべく早く決めたほうがいい。
    body_text: "引き受けるにしろ引き受けないにしろ、なるべく早く決めたほうがいい。 \n\nIt doesn't matter whether \nyou undertake or not , but you'd better decide as quickly as possible."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ引き受けるにしろ引き受けない\">\n引き受ける<strong>にしろ</strong>引き受けない<strong>にしろ</strong>、なるべく早く決めたほうがいい。</a> <br/>\n<strong>It doesn't matter whether </strong>\nyou undertake <strong>or not , but you'd better decide as quickly as possible.   \n\t\t</strong>"
