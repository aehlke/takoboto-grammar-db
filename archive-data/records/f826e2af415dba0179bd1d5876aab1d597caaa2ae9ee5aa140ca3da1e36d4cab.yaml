    japanese: 日本にしろ、中国にしろ、アジアの国へ行くのは面白い。（にほんにしろ、ちゅうごくにしろアジアのくにへいくのはおもしろい。）
    body_text: "日本にしろ、中国にしろ、アジアの国へ行くのは面白い。（にほんにしろ、ちゅうごくにしろアジアのくにへいくのはおもしろい。）\r \n\n\t\tIt doesn’t matter whether it’s Japan or China, going to Asian countries is interesting."
    body_html: "<a href=\"http://www.csse.monash.edu.au/~jwb/cgi-bin/wwwjdic.cgi?9MHJ日本にしろ、中国にしろ、アジアの国へ行くのは面白い。（にほんにしろ、ちゅうごくにしろアジアのくにへいくのはおもしろい。）\">\n\t\t\t\t日本にしろ、中国にしろ、アジアの国へ行くのは面白い。（にほんにしろ、ちゅうごくにしろアジアのくにへいくのはおもしろい。）\r<strong></strong><strong></strong></a> <br/>\n\t\tIt doesn’t matter whether it’s Japan or China, going to Asian countries is interesting. \n\t\t<strong> </strong>"
