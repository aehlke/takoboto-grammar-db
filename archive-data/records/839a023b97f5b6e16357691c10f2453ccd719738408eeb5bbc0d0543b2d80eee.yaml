    japanese: 新幹線の中では、東京から青森まで３時間立ちっぱなしだった。足が痛くなっちゃった！
    body_text: "新幹線の中では、東京から青森まで３時間立ちっぱなしだった。足が痛くなっちゃった！ \n\n\t\tOn the shinkansen from Toukyou to Aomori I kept standing up for 3 hours. My feet hurt!"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ新幹線の中では、東京から青森まで３時間立ちっぱなしだった。足が痛くなっちゃった！\">\n\t\t\t\t新幹線の中では、東京から青森まで３時間立ち<strong>っぱなし</strong>だった。足が痛くなっちゃった！<strong></strong></a> <br/>\n\t\tOn the shinkansen from Toukyou to Aomori I kept standing up for 3 hours. My feet hurt! \n\t\t<strong> </strong>"
    credits_raw: blabby
