comments:
  - position: 0
    credits_raw: blabby
    text: |-
      This is a rare case of 一級 grammar that I hear in every day conversation.  I learnt this when I was still a beginner.  I think it has a similar meaning to "〜たまま".
    html: |-
      This is a rare case of 一級 grammar that I hear in every day conversation.  I learnt this when I was still a beginner.  I think it has a similar meaning to "〜たまま".
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: It is a colloqual form of 放し, meaning doing something and leave it at that.It has a lot more emphasis than ...たままにする.
    html: It is a colloqual form of 放し, meaning doing something and leave it at that.It has a lot more emphasis than ...たままにする.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Futaro
    text: "How can I know how must I read the kanji, if in on yomi or kunyomi.\n\r\nFor example: in nﾂｰ 5446 is:\n\r\nkoko ni \"TE\" ki ppanachi\n\r\nor\n\r\nkoko ni \"OKU\" ki ppanachi?\n\r\nIt is very difficult for people who donﾂｴt know japanese very well."
    html: "How can I know how must I read the kanji, if in on yomi or kunyomi.<br/>\r\nFor example: in nﾂｰ 5446 is:<br/>\r\nkoko ni \"TE\" ki ppanachi<br/>\r\nor<br/>\r\nkoko ni \"OKU\" ki ppanachi?<br/>\r\nIt is very difficult for people who donﾂｴt know japanese very well."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: kryptolus
    text: "It's not that difficult.\n\r\nThe fact that there's a hiragana 'ki' after it tells you that it should be 'oki'. This has nothing to do with this grammar though..."
    html: "It's not that difficult.<br/>\r\nThe fact that there's a hiragana 'ki' after it tells you that it should be 'oki'. This has nothing to do with this grammar though..."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: Cacawate
    text: It's common practice that in compounds you'll be using onyomi.
    html: It's common practice that in compounds you'll be using onyomi.
    source_id: null
    original_created_at: null
