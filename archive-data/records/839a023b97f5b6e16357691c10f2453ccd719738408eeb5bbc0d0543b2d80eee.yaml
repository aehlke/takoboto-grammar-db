    body_text: "ここに置きっぱなしにしちゃダメでしょ。 \n\n\t\tHey, you can't leave your things here."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJここに置きっぱなしにしちゃダメでしょ。\">\n\t\t\t\tここに置き<strong>っぱなし</strong>にしちゃダメでしょ。<strong></strong></a> <br/>\n\t\tHey, you can't leave your things here. \n\t\t<strong> </strong>"
