    body_text: "父親になったつもりで学生の世話をした。 \n\n\t\tI attended this student \n\t\tas if \nI were his father."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ父親になったつもりで\">\n父親になった<strong>つもりで</strong><strong></strong>学生の世話をした。</a> <br/>\n\t\tI attended this student \n\t\t<strong>as if </strong>\nI were his father."
