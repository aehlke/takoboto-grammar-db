    japanese: 死んだつもりで決心した。
    body_text: "死んだつもりで決心した。 \n\n\t\tYou made the decision \n\t\twith the same feeling as if \n\t\tyou were going to die."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ死んだつもりで\">\n死んだ<strong>つもりで</strong><strong></strong>決心した。</a> <br/>\n\t\tYou made the decision \n\t\t<strong>with the same feeling as if </strong>\n\t\tyou <strong>were going</strong> to die."
