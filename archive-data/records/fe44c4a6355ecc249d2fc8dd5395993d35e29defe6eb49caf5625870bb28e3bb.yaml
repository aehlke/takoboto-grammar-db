    japanese: ボナスは買いに使ったつもりで銀行にお金を入れた。
    body_text: "ボナスは買いに使ったつもりで銀行にお金を入れた。 \n\nInstead of \nusing  the bonus pay to buy things, I saved it (in the bank)."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJボナスは買いに使ったつもりで\">\n\t\t\t\tボナスは買いに使った<strong>つもりで</strong><strong></strong>銀行にお金を入れた。</a> <br/>\n<strong>Instead of </strong>\nusing  the bonus pay to buy things, I saved it (in the bank)."
