    japanese: 特別料金は五百円だから、コーヒーを一杯飲んだつもりで、特急電車に乗った。
    body_text: "特別料金は五百円だから、コーヒーを一杯飲んだつもりで、特急電車に乗った。 \n\n\t\tBecause the added charge is 500 Yen (the same value than the coffee), \n\t\tinstead of \ndrinking  a coffee cup, I took the limited express train."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ特別料金は五百円だから、コーヒーを一杯飲んだつもりで\">\n\t\t\t\t特別料金は五百円だから、コーヒーを一杯飲んだ<strong>つもりで</strong><strong></strong>、特急電車に乗った。</a> <br/>\n\t\tBecause the added charge is 500 Yen (the same value than the coffee), \n\t\t<strong>instead of </strong>\ndrinking  a coffee cup, I took the limited express train."
