notes:
  - position: 0
    text: "te is more of a \"parallel\" tense in Japanese.  It reflects that the verb goes on along with the rest of the sentence or in a sequence.\n\r\nte-iru is the same way, the verb is going on at the same time \"you exist\" hence the -ing."
    html: "te is more of a \"parallel\" tense in Japanese.  It reflects that the verb goes on along with the rest of the sentence or in a sequence.<br/>\r\nte-iru is the same way, the verb is going on at the same time \"you exist\" hence the -ing."
    credits_raw: KotatsuSama
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "The -te form has many uses; here there are just some of them:\n\n\n\r\n1) It's a way to connect two sentences (a kind of equivalent expression for \"and\").\n\n\n\r\n2) Equivalent to English \"-ing\".\n\n\n\r\n3) -te+iru: to describe an action that is now happening or that is not already finished.\n\r\n[There are similar grammatical structures with verbs like \"shimau\", \"ageru\", \"yaru\", \"miru\"... but I guess they should have their own section]\n\n\n\r\n4) Replacing an adverb.\n\n\n\r\n5) Motte+iku/kuru: to bring, to take, to carry something.\n\n\n\r\n6) Present perfect in some cases.\n\n\n\r\nWhen the -te form is applied to adjectives finished in -i, it has also a copulative function: joining two or more adjectives by adding -kute instead -i. \n\n\n\r\n天気が悪くて、たいへん困りました。\n\r\nThe weather was bad, and that bothered us.\n\n\n\r\nあの映画は短く面白いです。= あの映画は短くて面白いです。\n\r\nThat film is short and amusing.\n\n\n\r\n[I must apologize for the possible mistakes this note may have. English is not my native language]"
    html: "The -te form has many uses; here there are just some of them:<br/>\n<br/>\r\n1) It's a way to connect two sentences (a kind of equivalent expression for \"and\").<br/>\n<br/>\r\n2) Equivalent to English \"-ing\".<br/>\n<br/>\r\n3) -te+iru: to describe an action that is now happening or that is not already finished.<br/>\r\n[There are similar grammatical structures with verbs like \"shimau\", \"ageru\", \"yaru\", \"miru\"... but I guess they should have their own section]<br/>\n<br/>\r\n4) Replacing an adverb.<br/>\n<br/>\r\n5) Motte+iku/kuru: to bring, to take, to carry something.<br/>\n<br/>\r\n6) Present perfect in some cases.<br/>\n<br/>\r\nWhen the -te form is applied to adjectives finished in -i, it has also a copulative function: joining two or more adjectives by adding -kute instead -i. <br/>\n<br/>\r\n天気が悪くて、たいへん困りました。<br/>\r\nThe weather was bad, and that bothered us.<br/>\n<br/>\r\nあの映画は短く面白いです。= あの映画は短くて面白いです。<br/>\r\nThat film is short and amusing.<br/>\n<br/>\r\n[I must apologize for the possible mistakes this note may have. English is not my native language]"
    credits_raw: fio
