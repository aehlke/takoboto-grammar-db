  - position: 3
    credits_raw: Amatuka
    text: "Verbs with auxillary verbs and auxillary adjectives use the -te form.  e.g. やってみてください。\n\r\nやる(in -te form, to do) みる (in -te form, to try) ください (request).  All together Please try to do it."
    html: "Verbs with auxillary verbs and auxillary adjectives use the -te form.  e.g. <b>やってみてください。</b><br/>\r\nやる(in -te form, to do) みる (in -te form, to try) ください (request).  All together <b>Please try to do it.</b>"
    source_id: null
