comments:
  - position: 0
    credits_raw: blabby
    text: By the look of the examples, this is spoken grammar?
    html: By the look of the examples, this is spoken grammar?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "Kaens, I think you mistake 辛 for 幸. 幸 is used in 幸福、幸運 etc.\n\r\nかろうじて is written as 辛うじて."
    html: "Kaens, I think you mistake 辛 for 幸. 幸 is used in 幸福、幸運 etc.<br/>\r\nかろうじて is written as 辛うじて."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Kaens
    text: "blabby, this is the grammar for both spoken and written language (of course).\n\r\nMiki, true, I did mistake that ^^; So, the meaning would be 'bitter, painful, bad' - the opposite to my first comment, so I'm removing that one. Ugh."
    html: "blabby, this is the grammar for both spoken and written language (of course).<br/>\r\nMiki, true, I did mistake that ^^; So, the meaning would be 'bitter, painful, bad' - the opposite to my first comment, so I'm removing that one. Ugh."
