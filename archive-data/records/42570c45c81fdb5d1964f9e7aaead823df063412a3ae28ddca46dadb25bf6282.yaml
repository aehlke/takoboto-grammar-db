    text: "Actually, the past tense usage of たら is okay, as long as the second phrase shows an uncontrollable situation.\n\r\n(BAD) 京都に行ったら、古い旅館に泊まりました。\n\r\n(GOOD) 先生の説明を聞いたら、すぐ分かった。"
