notes:
  - position: 0
    text: "〜たら use for：\n\r\n１．もし(if)\n\r\n２．〜た後、〜てから、〜たとき(When.../ After...)\n\r\n３．本当ではないのこと (If (I) was/could/would...., )\n\r\n４．勧め(advice/suggestions) (Why don't (you/we)...)"
    html: "〜たら use for：<br/>\r\n１．もし(if)<br/>\r\n２．〜た後、〜てから、〜たとき(When.../ After...)<br/>\r\n３．本当ではないのこと (If (I) was/could/would...., )<br/>\r\n４．勧め(advice/suggestions) (Why don't (you/we)...)"
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
