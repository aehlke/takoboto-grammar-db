    japanese: その夜半に目覚めたら呼吸が酷く不規則で苦しくなっていました。
    body_text: "その夜半に目覚めたら呼吸が酷く不規則で苦しくなっていました。 \n\nWhen \n\t\t(I) woke up late that night (my) breathing had become horribly irregular and  difficult."
