  - position: 2
    credits_raw: Miki
    text: "#5254 もしまず here is wordy. Also, it is always 読んだら、not 読んたら、.\n\r\nまず説明書を読んだら、／もし説明書を読んだら、would be better."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=tara#5254\">#5254</a></b> もしまず here is wordy. Also, it is always 読んだら、not 読んたら、.<br/>\r\nまず説明書を読んだら、／もし説明書を読んだら、would be better."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: bi-ru
    text: "Note that it is unnatural to use -tara in circumstances in the past, where a volitional element is present. For example, if you wanted to say 'I stayed in an old ryokan when I went to Kyouto':\n\n\n\r\n京都に行ったら、古い旅館に泊まりました\n\n\n\r\nThis sentence is unnatural. Using ~tara in the past would only be used for states or circumstances, e.g.\n\n\n\r\n教室に入ったら、小さなネコがいた"
    html: "Note that it is unnatural to use -tara in circumstances in the past, where a volitional element is present. For example, if you wanted to say 'I stayed in an old ryokan when I went to Kyouto':<br/>\n<br/>\r\n京都に行ったら、古い旅館に泊まりました<br/>\n<br/>\r\nThis sentence is unnatural. Using ~tara in the past would only be used for states or circumstances, e.g.<br/>\n<br/>\r\n教室に入ったら、小さなネコがいた"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: "Maybe the following would be more natural:\n\r\n「京都に行ったとき、古い旅館に泊まりました。」\n\r\n「教室に入ったとき、小さなネコがいた。」"
    html: "Maybe the following would be more natural:<br/>\r\n「京都に行ったとき、古い旅館に泊まりました。」<br/>\r\n「教室に入ったとき、小さなネコがいた。」"
    source_id: null
    original_created_at: null
