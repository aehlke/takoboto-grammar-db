comments:
  - position: 0
    credits_raw: Amatuka
    text: "Used to join two sentences.\n\r\nけれども (most formal) →けれど→けど (least formal)\n\r\nけど used in speech, not when writing.\n\r\nUsing けれども etc to start a sentence is frowned upon.  But, like using 'but' to start a sentence in English, is sometimes done anyway."
    html: "Used to join two sentences.<br/>\r\nけれども (most formal) →けれど→けど (least formal)<br/>\r\nけど used in speech, not when writing.<br/>\r\nUsing けれども etc to start a sentence is frowned upon.  But, like using 'but' to start a sentence in English, is sometimes done anyway."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Verb, i-adjective or the copula should be before けれども.\n\n\n\r\ne.g. 彼は１６歳だけれど、両親から独立しています。"
    html: "Verb, i-adjective or the copula should be before けれども.<br/>\n<br/>\r\ne.g. 彼は１６歳<b>だ</b>けれど、両親から独立しています。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "In polite/formal use \n\r\nsentence-A -masu けれども sentence-B -masu can be used, but \n\r\nsentence-A plain けれど(も) sentence-B -masu\n\r\nis also possible."
    html: "In polite/formal use <br/>\r\nsentence-A <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=-masu\">-masu</a></b> けれども sentence-B <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=-masu\">-masu</a></b> can be used, but <br/>\r\nsentence-A <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=plain\">plain</a></b> けれど(も) sentence-B <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=-masu\">-masu</a></b><br/>\r\nis also possible."
    source_id: null
    original_created_at: null
    original_updated_at: null
