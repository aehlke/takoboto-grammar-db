    credits_raw: tigert
    text: "せねばならない?　I have never heard this.  I have heard しなければならない　Or　しなければいけない　which both mean \"must\" or \"have to\" \n\n\n\r\nIs the せねば　part of a regional accent? If so what region?"
    html: "せねばならない?　I have never heard this.  I have heard しなければならない　Or　しなければいけない　which both mean \"must\" or \"have to\" <br/>\n<br/>\r\nIs the せねば　part of a regional accent? If so what region?<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Auxabois
    text: |-
      It looks to me that instead of an appendage to a verb like 食べなくてければなりません, せねばならない　becomes the verb. It appears all the exp. sentances have a suru verb minus suru with せねばならない added? So does this only work with suru verbs?
    html: |-
      It looks to me that instead of an appendage to a verb like 食べなくてければなりません, せねばならない　becomes the verb. It appears all the exp. sentances have a suru verb minus suru with せねばならない added? So does this only work with suru verbs?
