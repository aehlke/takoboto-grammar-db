  - position: 3
    credits_raw: expandover
    text: "here you go how this is used:\n\r\n1- verb in the negative form drop the ない and add ねばならない\n\r\nex: 行かない drop ない and attach ねばならない to いか, so it becomes いかねばならない which means must go.\n\r\n2-for せねばならない is added to しない which means do not do by changing し==>せ and dropping ない \n\r\nex: 勉強せねばならない which means must study."
    html: "here you go how this is used:<br/>\r\n1- verb in the negative form drop the ない and add ねばならない<br/>\r\nex: 行かない drop ない and attach ねばならない to いか, so it becomes いかねばならない which means must go.<br/>\r\n2-for せねばならない is added to しない which means do not do by changing し==&gt;せ and dropping ない <br/>\r\nex: 勉強せねばならない which means must study."
    source_id: null
    original_created_at: null
