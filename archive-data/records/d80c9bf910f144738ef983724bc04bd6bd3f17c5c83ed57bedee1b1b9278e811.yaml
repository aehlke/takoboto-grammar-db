  - position: 11
    credits_raw: simvoodoo2215@hotmail.com
    text: "私【わたくしWATAKUSHI 】 myself; private affairs.\n\r\n私【わたしWATASHI】 (a-no) I.\n\r\n僕【しもべ /ぼくSHIMOBE/BOKU】 manservant; servant (of God).\n\r\n俺【おれ ORE 】 I (boastful first-person pronoun); someone as skilled as me; someone like me.\n\r\nあたし【あたしATASHI 】 (fem) I.\n\r\nわし【わしWASHI】\n\n\n\r\n（１）　私 の 名前 は キム です。- My name is Kim. (Neutral, polite)\n\r\nWatashi no namae wa kimu desu.\t\n\r\n（２）　僕 の 名前 は キム です。- My name is Kim. (Masculine, polite)\n\r\nBoku no namae wa kimu desu.\n\r\n（３）　僕 の 名前 は ボブ だ。- My name is Bob. (Masculine, casual)\n\r\nBoku no namae wa bobu da.\n\r\n（４）　俺 の 名前 は ボブ だ。- My name is Bob. (Masculine, casual)\n\r\nOre no namae wa bobu da.\n\r\n（５）　あたし の 名前 は アリス。- My name is Alice. (Feminine, casual)\x14\n\r\nAtashi no namae wa arisu.\n\n\n\r\n社長【しゃちょう】 company president; manager; director.\n\r\n課長【かちょう】 section manager; section chief.\n\r\n先生【せんせい】 teacher; master; doctor.\n\r\n田中先生【たなかせんせい】\n\r\nさん (suf) Mr or Mrs.\n\r\nちゃん suffix for familiar (female) person.\n\r\n貴女【あなた】 (oK) (fem) you; lady. \n\r\n君【きみ】 (fam) (fem) you.\n\r\n お前【おまえ】 (fam) you (sing).\n\r\n手前【てまえ】 before; this side; we; you.\n\r\n貴様【きさま】 (vulg) you.\n\r\n彼【かれ】 he; boyfriend.\n\r\n彼女【かのじょ】 she; girl friend; sweetheart.\n\r\n彼氏【かれし】 boyfriend.\n\r\nガールフレンド girl friend."
    html: "私【わたくしWATAKUSHI 】 myself; private affairs.<br/>\r\n私【わたしWATASHI】 (a-no) I.<br/>\r\n僕【しもべ /ぼくSHIMOBE/BOKU】 manservant; servant (of God).<br/>\r\n俺【おれ ORE 】 I (boastful first-person pronoun); someone as skilled as me; someone like me.<br/>\r\nあたし【あたしATASHI 】 (fem) I.<br/>\r\nわし【わしWASHI】<br/>\n<br/>\r\n（１）　私 の 名前 は キム です。- My name is Kim. (Neutral, polite)<br/>\r\nWatashi no namae wa kimu desu.\t<br/>\r\n（２）　僕 の 名前 は キム です。- My name is Kim. (Masculine, polite)<br/>\r\nBoku no namae wa kimu desu.<br/>\r\n（３）　僕 の 名前 は ボブ だ。- My name is Bob. (Masculine, casual)<br/>\r\nBoku no namae wa bobu da.<br/>\r\n（４）　俺 の 名前 は ボブ だ。- My name is Bob. (Masculine, casual)<br/>\r\nOre no namae wa bobu da.<br/>\r\n（５）　あたし の 名前 は アリス。- My name is Alice. (Feminine, casual)\x14<br/>\r\nAtashi no namae wa arisu.<br/>\n<br/>\r\n社長【しゃちょう】 company president; manager; director.<br/>\r\n課長【かちょう】 section manager; section chief.<br/>\r\n先生【せんせい】 teacher; master; doctor.<br/>\r\n田中先生【たなかせんせい】<br/>\r\nさん (suf) Mr or Mrs.<br/>\r\nちゃん suffix for familiar (female) person.<br/>\r\n貴女【あなた】 (oK) (fem) you; lady. <br/>\r\n君【きみ】 (fam) (fem) you.<br/>\r\n お前【おまえ】 (fam) you (sing).<br/>\r\n手前【てまえ】 before; this side; we; you.<br/>\r\n貴様【きさま】 (vulg) you.<br/>\r\n彼【かれ】 he; boyfriend.<br/>\r\n彼女【かのじょ】 she; girl friend; sweetheart.<br/>\r\n彼氏【かれし】 boyfriend.<br/>\r\nガールフレンド girl friend."
