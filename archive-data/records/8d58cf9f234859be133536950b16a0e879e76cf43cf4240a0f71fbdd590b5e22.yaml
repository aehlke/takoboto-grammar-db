examples:
  - source_id: 318
    position: 0
    japanese: 電車のドアが開くか開かないかのうちに乗客が飛び出して来る
    body_text: "電車のドアが開くか開かないかのうちに乗客が飛び出して来る \n\njust at the moment when \n\t\tthe train doors are opening, the passengers fly out."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ電車のドアが開くか開か\">\n\t\t\t\t電車のドアが開く<strong>か</strong>開か<strong>ないかのうちに</strong>乗客が飛び出して来る</a> <br/>\n<strong>just at the moment when </strong>\n\t\tthe train doors are opening, the passengers fly out."
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3306
    position: 1
    japanese: ピストルの音が鳴ったか鳴らないかのうちにスタートしました。
    body_text: "ピストルの音が鳴ったか鳴らないかのうちにスタートしました。 \n\nJust as \n\t\tthe pistol sounded, they started"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJピストルの音が鳴ったか鳴らないかのうちにスタートしました。\">\n\t\t\t\tピストルの音が<strong>鳴ったか鳴らないかのうちに</strong>スタートしました。<strong></strong></a> <br/>\n<strong>Just as </strong>\n\t\tthe pistol sounded, they started"
    credits_raw: dc
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4603
    position: 2
    japanese: その一行が出発するかしないかのうちに、雨が振り出した。
    body_text: "その一行が出発するかしないかのうちに、雨が振り出した。 \n\n\t\tThe party had hardly left when it began to rain."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその一行が出発するかし\">\n\t\t\t\tその一行が出発する<strong>か</strong>し<strong>ないかのうちに、</strong>雨が振り出した。</a> <br/>\n\t\tThe party had hardly left when it began to rain. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4604
    position: 3
    japanese: 私がホールに入るか入らないかのうちに式が始まった。
    body_text: "私がホールに入るか入らないかのうちに式が始まった。 \n\n\t\tNo sooner had I entered the hall than the ceremony began."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私がホールに入るか入ら\">\n\t\t\t\t私がホールに入る<strong>か</strong>入ら<strong>ないかのうちに</strong>式が始まった。</a> <br/>\n\t\tNo sooner had I entered the hall than the ceremony began. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 4605
    position: 4
    japanese: 私が寝入るか寝入らぬかのうちに、電話がなった。
    body_text: "私が寝入るか寝入らぬかのうちに、電話がなった。 \n\n\t\tI had hardly fallen asleep when the telephone rang."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ私が寝入るか寝入ら\">\n\t\t\t\t私が寝入る<strong>か</strong>寝入ら<strong>ぬかのうちに、</strong>電話がなった。</a> <br/>\n\t\tI had hardly fallen asleep when the telephone rang. \n\t\t<strong> </strong>"
    credits_raw: Miki
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6923
    position: 5
    japanese: 彼は本当にプロ並みのDJのように、一曲が終わったか終わらないかのうちに、次の一曲を整えてくる。
    body_text: "彼は本当にプロ並みのDJのように、一曲が終わったか終わらないかのうちに、次の一曲を整えてくる。 \n\n\t\tHe is such a good DJ, \n\t\tno sooner has \n\t\t  one song finished, he already has the next record ready to play."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼は本当にプロ並みのDJのように、一曲が終わったか終わら\">\n\t\t\t\t彼は本当にプロ並みのDJのように、一曲が終わった<strong>か</strong>終わら<strong>ないかのうちに</strong>、次の一曲を整えてくる。</a> <br/>\n\t\tHe is such a good DJ, \n\t\t<strong>no sooner has </strong>\n\t\t  one song finished, he already has the next record ready to play."
    credits_raw: kadoka66
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6924
    position: 6
    japanese: 電話が鳴るか鳴らないかのうちに、受話器を取りました。
    body_text: "電話が鳴るか鳴らないかのうちに、受話器を取りました。 \n\n\t\tI took the phone off the hook \n\t\tbefore it had a chance to \nring."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ電話が鳴るか鳴ら\">\n\t\t\t\t電話が鳴る<strong>か</strong>鳴ら<strong>ないかのうちに</strong>、受話器を取りました。</a> <br/>\n\t\tI took the phone off the hook \n\t\t<strong>before it had a chance to </strong>\nring."
    credits_raw: kadoka66
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 6925
    position: 7
    japanese: この店の寿司弁当は、店頭に並ぶか並ばないかのうちに、飛ぶように売れていく。
    body_text: "この店の寿司弁当は、店頭に並ぶか並ばないかのうちに、飛ぶように売れていく。 \n\n\t\tThis shops sushi lunchbox is \n\t\tno sooner \n\t\t  put on sale, it sells like hot cakes."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ この店の寿司弁当は、店頭に並ぶか並ば\">\n\t\t\t\t この店の寿司弁当は、店頭に並ぶ<strong>か</strong>並ば<strong>ないかのうちに</strong>、飛ぶように売れていく。</a> <br/>\n\t\tThis shops sushi lunchbox is \n\t\t<strong>no sooner </strong>\n\t\t  put on sale, it sells like hot cakes."
    credits_raw: kadoka66
    verification_class:
