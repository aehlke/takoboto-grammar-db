    text: "How to decide when to use 〜際は or 〜際に ?\n\r\nExample :\n\r\n家を建てる際は、不動産屋には大変世話になりました。\n\r\nor\n\r\n家を建てる際に、不動産屋には大変世話になりました。\n\r\nIt seems the first one is correct but I wonder why..."
