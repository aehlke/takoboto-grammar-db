    credits_raw: Radish
    text: "Remember that this can also be translated as \"...and it's good that...\"\n\n\n\r\nSee Unicom N2 Dokkai, pg 20. The reason \"sumu\" works this way is because the Chinese character's (original) meaning is \"to relieve.\"."
