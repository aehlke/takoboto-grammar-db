    japanese: 久しぶりに田舎へ帰って結黒ﾏわってきたのを見にした。
    body_text: "久しぶりに田舎へ帰って結黒ﾏわってきたのを見にした。 \n\n\t\tAfter a long time I returned back to my native and found most of the things have changed."
