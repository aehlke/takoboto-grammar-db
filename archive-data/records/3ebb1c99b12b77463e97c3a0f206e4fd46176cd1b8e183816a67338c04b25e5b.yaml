notes:
  - position: 0
    text: "か has many uses but it can be used as a question mark, just like what we have in English:\n\n\n\r\nDid he eat dinner?\n\r\n彼は夕方ご飯を食べましたか。\n\n\n\r\nDid he go to Japan last year?\n\r\n来年彼は日本に行きましたか。"
    html: "か has many uses but it can be used as a question mark, just like what we have in English:<br/>\n<br/>\r\nDid he eat dinner?<br/>\r\n彼は夕方ご飯を食べましたか。<br/>\n<br/>\r\nDid he go to Japan last year?<br/>\r\n来年彼は日本に行きましたか。"
    credits_raw: Sakuratree
    source_id: null
    original_created_at: null
    original_updated_at: null
