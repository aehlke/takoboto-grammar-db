comments:
  - position: 0
    credits_raw: blabby
    text: "Similar in some ways to \"だらけ\" and \"まみれ\" and it seems to have the same meaning as \"全て〜ばかり\" or \"〜ばかりたくさんある\".\n\r\nIt often has the form of  Adjective+こと+ずくめ"
    html: "Similar in some ways to \"だらけ\" and \"まみれ\" and it seems to have the same meaning as \"全て〜ばかり\" or \"〜ばかりたくさんある\".<br/>\r\nIt often has the form of  Adjective+こと+ずくめ<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: |-
      ずくめ also written 尽くめ added to a noun means 100% so.But there are a lot of nouns and noun phrases which to do accept ずくめ.
