    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ息子は桜大学に進学することを希望している。しかし、今の息子の学力ではとても無理だから、別の大学を受験させるしかない\">\n\t\t\t\t息子は桜大学に進学することを希望している。しかし、今の息子の学力ではとても無理だから、別の大学を受験させる<strong>しかない</strong><strong></strong>。本人の希望とは違ってもしかたがないことだ。</a> <br/>\n\t\tMy daughter hopes to enter the Sakura University. However, her capacity is very poor, so \n\t\t<strong>I have no choice but to compel her </strong>\ntake the exam  of another university. Although it's not her hope, there is no way."
