notes:
  - position: 0
    text: "[wo nuki ni shite/wa nuki ni shite] can have two generally the same usages. It can be used to show that something is without, or left out. Wa does not have to follow after shite but it does give extra emphasis as \x01 is frequently called the highlighting particle. \x01 itself can be used to follow a noun directly to mean \"without\" especially when listing ingredients or talking about doing something \"without\". [Ni shite] itself gives meaning to nuki showing that it is \"for\" whatever \x01 is excluding that causes/does such and such. So [nuki ni shite wa]could be looked at as meaning for without...\n\r\nI would also like to mention that a lot of people need to watch their Romanization on this site as somethings are just wrong. This page should be wo nuki ni shite/ wa naku ni shite not ha, wa is just a spelling rule since the Heian period to be written with the Kana character for ha."
    html: "[wo nuki ni shite/wa nuki ni shite] can have two generally the same usages. It can be used to show that something is without, or left out. Wa does not have to follow after shite but it does give extra emphasis as <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is frequently called the highlighting particle. <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> itself can be used to follow a noun directly to mean \"without\" especially when listing ingredients or talking about doing something \"without\". [Ni shite] itself gives meaning to nuki showing that it is \"for\" whatever <b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> is excluding that causes/does such and such. So [nuki ni shite wa]could be looked at as meaning for without...<br/>\r\nI would also like to mention that a lot of people need to watch their Romanization on this site as somethings are just wrong. This page should be wo nuki ni shite/ wa naku ni shite not ha, wa is just a spelling rule since the Heian period to be written with the Kana character for ha."
