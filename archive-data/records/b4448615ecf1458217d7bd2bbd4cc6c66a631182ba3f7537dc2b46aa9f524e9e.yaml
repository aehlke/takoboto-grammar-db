  - position: 1
    text: "If conversing with friends, family, etc, desu is not necessary.\n\r\nこれは私のペン。\n\r\ndesu is only necessary when talking to adults, teachers, etc..."
    html: "If conversing with friends, family, etc, desu is not necessary.<br/>\r\nこれは私のペン。<br/>\r\ndesu is only necessary when talking to adults, teachers, etc..."
    credits_raw: pingpongpaddle
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "Desu is placed at the end of the sentence after:\n\r\n1) Nouns\n\r\n2) Adjectives (I-adj remain the same whereas there is no 'na' after na-adj)\n\n\n\r\nNote: It is not usually placed after verbs as they are usually in the 'masu' form unless there is a change to the verb. E.g. the '-tai' (want to...) form; the verb is put into polite negative past form - '-masendeshita'. \n\n\n\r\nWhen translated to english, it can mean, 'is' or 'am' etc. \n\n\n\r\nTo change to past tense, 'desu' becomes 'deshita'. \n\n\n\r\nNote: Adjectives do not have 'deshita' to imply past tense. You would change the adjectives themselves into past tense and then add 'desu'.\n\n\n\nExamples\n\r\nI am a Japanese person. (noun)\n\r\n日本人です。\n\n\n\r\nIt is a melon. (noun)\n\r\nメロンです。\n\n\n\r\nIt was a melon. (past, noun)\n\r\nメロンでした。\n\n\n\r\nI'm Talon. (noun)\n\r\n私はタロンです。\n\n\n\r\nIt's cute. (I-adj)\n\r\nかわいいです。\n\n\n\r\nIt's famous. (Na-adj)\n\r\n有名です。"
    html: "Desu is placed at the end of the sentence after:<br/>\r\n1) Nouns<br/>\r\n2) Adjectives (I-adj remain the same whereas there is no 'na' after na-adj)<br/>\n<br/>\r\nNote: It is not usually placed after verbs as they are usually in the 'masu' form unless there is a change to the verb. E.g. the '-tai' (want to...) form; the verb is put into polite negative past form - '-masendeshita'. <br/>\n<br/>\r\nWhen translated to english, it can mean, 'is' or 'am' etc. <br/>\n<br/>\r\nTo change to past tense, 'desu' becomes 'deshita'. <br/>\n<br/>\r\nNote: Adjectives do not have 'deshita' to imply past tense. You would change the adjectives themselves into past tense and then add 'desu'.<br/>\n<br/>\n<b>Examples</b><br/>\r\nI am a Japanese person. (noun)<br/>\r\n日本人です。<br/>\n<br/>\r\nIt is a melon. (noun)<br/>\r\nメロンです。<br/>\n<br/>\r\nIt was a melon. (past, noun)<br/>\r\nメロンでした。<br/>\n<br/>\r\nI'm Talon. (noun)<br/>\r\n私はタロンです。<br/>\n<br/>\r\nIt's cute. (I-adj)<br/>\r\nかわいいです。<br/>\n<br/>\r\nIt's famous. (Na-adj)<br/>\r\n有名です。"
