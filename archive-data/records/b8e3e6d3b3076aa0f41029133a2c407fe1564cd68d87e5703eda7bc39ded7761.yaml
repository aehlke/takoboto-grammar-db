    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "Note that in textbooks outside of Japan する suru is usually introduced as an 'irregular verb'.\n\r\nHowever inside Japan it is referred to as サ変, also still can be used for some other verbs (e.g. 準ずる).\n\r\nSimilarly the 'irregular' verb くる kuru is referred to as カ変."
    html: "Note that in textbooks outside of Japan する <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=suru\">suru</a></b> is usually introduced as an 'irregular verb'.<br/>\r\nHowever inside Japan it is referred to as サ変, also still can be used for some other verbs (e.g. 準ずる).<br/>\r\nSimilarly the 'irregular' verb くる <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kuru\">kuru</a></b> is referred to as カ変."
    source_id: null
    original_created_at: null
