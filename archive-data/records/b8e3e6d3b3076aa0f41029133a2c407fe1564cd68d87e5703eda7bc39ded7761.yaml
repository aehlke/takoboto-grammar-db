notes:
  - position: 0
    text: "There are only two irregular verbs, kuru (to come) and suru (to do). \n\n\n\r\nThe verb \"suru\" is probably the most often used verb in Japanese. It is used as \"to do,\" \"to make,\" or \"to cost\". It is also combined with many nouns (of Chinese or Western origin) to make them into verbs."
    html: "There are only two irregular verbs, kuru (to come) and suru (to do). <br/>\n<br/>\r\nThe verb \"suru\" is probably the most often used verb in Japanese. It is used as \"to do,\" \"to make,\" or \"to cost\". It is also combined with many nouns (of Chinese or Western origin) to make them into verbs."
    credits_raw: joe cello
    source_id: null
    original_created_at: null
    original_updated_at: null
