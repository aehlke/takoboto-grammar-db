    credits_raw: Amatuka
    text: "常体 = Plain / Direct form ~る[~ru]\n\r\n敬体 = Polite / Distal form ~ます [~masu]"
    html: "常体 = Plain / Direct form ~る[~ru]<br/>\r\n敬体 = Polite / Distal form ~ます [~masu]"
    source_id: null
