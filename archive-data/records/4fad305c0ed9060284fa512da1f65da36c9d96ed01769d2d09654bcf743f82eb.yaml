comments:
  - position: 0
    credits_raw: kadoka66
    text: "The meaning I think is much stronger than しかったが無い. It expresses the fact that in certain special situations an action or event which is forthcoming is unavoidable. On the other hand although the former is used in similar situations it expresses more the idea that something always pans out in a certain way. \n\n\n\r\nComing I expect from the grammar construct 〜ざるをえない\n\n\n\r\nYou can also say やむにやまれず to mean the same thing. \n\n\n\r\nI added my own example to show an alternative usage."
    html: "The meaning I think is much stronger than しかったが無い. It expresses the fact that in certain special situations an action or event which is forthcoming is unavoidable. On the other hand although the former is used in similar situations it expresses more the idea that something always pans out in a certain way. <br/>\n<br/>\r\nComing I expect from the grammar construct 〜ざるをえない<br/>\n<br/>\r\nYou can also say やむにやまれず to mean the same thing. <br/>\n<br/>\r\nI added my own example to show an alternative usage."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: tmkain
    text: |-
      if anyone reads the above comment, be careful.  しかったが無い is incorrect; the correct phrase is 仕方が無い（しかたがない）, without the small "tsu."
    html: |-
