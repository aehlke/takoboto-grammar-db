    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: When I talk about "my" husband, I would say 夫 but talk about other's husband, we don't use 夫 and usually use ご主人。
    html: When I talk about "my" husband, I would say 夫 but talk about other's husband, we don't use 夫 and usually use ご主人。
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Miki
    text: |-
      note : When you talk about "your" wife, you'd say 妻(つま）、家内（かない）、or 女房（にょうぼう）. And when you talk about other's wife, 奥様（おくさま）。
    html: |-
      note : When you talk about "your" wife, you'd say 妻(つま）、家内（かない）、or 女房（にょうぼう）. And when you talk about other's wife, 奥様（おくさま）。
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: your name
    text: "But we don't have a custom to call somebody's husband by name though it has been changing.\n\r\nah, だんな is also used but this may be also 考え直すべき問題??"
