    credits_raw: Amatuka
    text: 'Note: 主人 is non-PC (because it can also be used to mean ''master''). I think 夫(おっと) is more common now ...'
    html: 'Note: 主人 is non-PC (because it can also be used to mean ''master''). I think 夫(おっと) is more common now ...'
    source_id: null
