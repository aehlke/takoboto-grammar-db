notes:
  - position: 0
    text: "nikagitte\n\r\ncan mean limited to\n\r\n明日に限って、割引します\n\r\njust for tomorrow, we are giving a discount"
    html: "nikagitte<br/>\r\ncan mean limited to<br/>\r\n明日に限って、割引します<br/>\r\njust for tomorrow, we are giving a discount"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "＊This is a compound particle to show that only X is different from others. It's meant to express an exclusive focus on topic item X. The predicate is either explicitly negative as in example #6312, or implicitly negative as in example #6313. An explicitly affirmative predicate cannot occur with に限って.\n\n\n\r\nTHIS IS WRONG: その日に限っていい天気だった。 (Only on that day, the weather was good.)"
    html: "＊This is a compound particle to show that only X is different from others. It's meant to express an exclusive focus on topic item X. The predicate is either explicitly negative as in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nikagitte#6312\">#6312</a></b>, or implicitly negative as in example <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nikagitte#6313\">#6313</a></b>. An explicitly affirmative predicate cannot occur with に限って.<br/>\n<br/>\r\nTHIS IS WRONG: その日に限っていい天気だった。 (Only on that day, the weather was good.)"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
