notes:
  - position: 0
    text: "focus を subject の　中心に する\n\r\nchina を meeting の　中心に する\n\n\n\r\n= make china the center of the meeting\n\n\n\r\n　中国<font color=red>を</font>議論<b>の</b><font color=red>中心に</font>しましょう\n\r\n　lets make china <font color=red>the center</font> <b>of</b> our discussion\n\n\n\r\njapanese native speakers will go \"huh?\" if you get your を and の mixed up - its like mixing \"the\" and \"of\"!\n\n\n\r\nand this is a different word order:\n\r\n　<font color=red>中国</font><b>を中心に</b>議論をする\n\r\n　<font color=red>focus</font> <b>を中心に</b> discussion を suru\n\r\n　<font color=red>china</font> <b>as the center</b> lets discuss"
    html: "focus を subject の　中心に する<br/>\r\nchina を meeting の　中心に する<br/>\n<br/>\r\n= make china the center of the meeting<br/>\n<br/>\r\n　中国&lt;font color=red&gt;を&lt;/font&gt;議論&lt;b&gt;の&lt;/b&gt;&lt;font color=red&gt;中心に&lt;/font&gt;しましょう<br/>\r\n　lets make china &lt;font color=red&gt;the center&lt;/font&gt; &lt;b&gt;of&lt;/b&gt; our discussion<br/>\n<br/>\r\njapanese native speakers will go \"huh?\" if you get your を and の mixed up - its like mixing \"the\" and \"of\"!<br/>\n<br/>\r\nand this is a different word order:<br/>\r\n　&lt;font color=red&gt;中国&lt;/font&gt;&lt;b&gt;を中心に&lt;/b&gt;議論をする<br/>\r\n　&lt;font color=red&gt;focus&lt;/font&gt; &lt;b&gt;を中心に&lt;/b&gt; discussion を suru<br/>\r\n　&lt;font color=red&gt;china&lt;/font&gt; &lt;b&gt;as the center&lt;/b&gt; lets discuss"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
