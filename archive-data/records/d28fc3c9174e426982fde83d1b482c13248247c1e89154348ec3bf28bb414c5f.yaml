    credits_raw: Amatuka
    text: |-
      First example is a literal physical centre - with 'in the centre of' meaning, second is a metaphorical centre - with the 'centre on'  meaning.
    html: |-
      First example is a literal physical centre - with 'in the centre of' meaning, second is a metaphorical centre - with the 'centre on'  meaning.
    source_id: null
