    japanese: 昔の恋人が結婚しようとしまいと、今の私に関係ないことです。
    body_text: "昔の恋人が結婚しようとしまいと、今の私に関係ないことです。 \n\nWhether \n\t\tmy childhood sweetheart gets married or not, it's got nothing to do with me now."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ昔の恋人が結婚しようとし\">\n\t\t\t\t昔の恋人が結婚し<strong>ようと</strong>し<strong>まい</strong>と、今の私に関係ないことです。</a> <br/>\n<strong>Whether </strong>\n\t\tmy childhood sweetheart gets married or not, it's got nothing to do with me now."
