    japanese: パーティに参加しようがするまいが、会費は全員払わなければならない。
    body_text: "パーティに参加しようがするまいが、会費は全員払わなければならない。  \n\nRegardless of whether or not \n\t\tyou go to the parties,  all members must pay the membership fees."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJパーティに参加しようがする\">\n\t\t\t\tパーティに参加し<strong>ようが</strong>する<strong>まいが</strong>、会費は全員払わなければならない。 </a> <br/>\n<strong>Regardless of whether or not </strong>\n\t\tyou go to the parties,  all members must pay the membership fees."
