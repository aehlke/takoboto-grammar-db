    japanese: あの教授は学生がわかろうと分かるまいとかまわず授業を進めて行く
    body_text: "あの教授は学生がわかろうと分かるまいとかまわず授業を進めて行く  \n\n\t\tThat professor keeps lecturing, \n\t\tregardless of whether \n\t\this students understand it or not."
