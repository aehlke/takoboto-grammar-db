    text: "〜がち: tendency; inclination\n\r\nThis suggests that a situation tends to occur often or easily, as in, 'to be absent often' or 'to become ill easily'. \n\r\nBoth 〜ぎみ and 〜がち are almost always used in a neagtive sense."
