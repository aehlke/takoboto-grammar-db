notes:
  - position: 0
    text: "verb masu stem + gachi\n\r\n　遅れます　⇒　遅れがち = tends to be late\n\n\n\r\nnoun + gachi\n\r\n　怒りがち = tends to anger (get angry)\n\n\n\r\nnote: many verbs can be turned into nouns by using a -ri ending.\n\n\n\r\n　怒る【いかる】(v5r) to get angry, to be angry\n\r\n　怒り【いかり】(n) anger, hatred, (P)\n\r\n　　⇒　怒りがち"
    html: "verb masu stem + gachi<br/>\r\n　遅れます　⇒　遅れがち = tends to be late<br/>\n<br/>\r\nnoun + gachi<br/>\r\n　怒りがち = tends to anger (get angry)<br/>\n<br/>\r\nnote: many verbs can be turned into nouns by using a -ri ending.<br/>\n<br/>\r\n　怒る【いかる】(v5r) to get angry, to be angry<br/>\r\n　怒り【いかり】(n) anger, hatred, (P)<br/>\r\n　　⇒　怒りがち"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
