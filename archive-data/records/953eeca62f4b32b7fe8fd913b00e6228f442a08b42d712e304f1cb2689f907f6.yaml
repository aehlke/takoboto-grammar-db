    japanese: 老いたりといえども、まだまだ若いものには負けないつもりだ。
    body_text: "老いたりといえども、まだまだ若いものには負けないつもりだ。 \n\nEven though \n\t\tI am getting on a bit, I don't intend to lose out to the youngsters for some time to come."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ老いたりといえども、まだまだ若いものには負けないつもりだ。\">\n\t\t\t\t老いたり<strong>といえども</strong>、まだまだ若いものには負けないつもりだ。<strong></strong></a> <br/>\n<strong>Even though </strong>\n\t\tI am getting on a bit, I don't intend to lose out to the youngsters for some time to come."
