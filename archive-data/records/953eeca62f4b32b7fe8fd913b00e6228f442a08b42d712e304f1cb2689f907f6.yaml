    japanese: いかに日本での生活が長いといえども、言葉の問題には常に遭遇する。
    body_text: "いかに日本での生活が長いといえども、言葉の問題には常に遭遇する。 \n\nAlthough \n\t\tI've lived in Japan for a long time, I constantly encounter language problems"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJいかに日本での生活が長いといえども、言葉の問題には常に遭遇する。\">\n\t\t\t\tいかに日本での生活が長い<strong>といえども</strong>、言葉の問題には常に遭遇する。<strong></strong></a> <br/>\n<strong>Although </strong>\n\t\tI've lived in Japan for a long time, I constantly encounter language problems"
