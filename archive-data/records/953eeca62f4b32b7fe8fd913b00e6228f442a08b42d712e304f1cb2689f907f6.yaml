    japanese: 近年、医学が目覚ましく進歩したといえども、病人の数は減少傾向にはない
    body_text: "近年、医学が目覚ましく進歩したといえども、病人の数は減少傾向にはない \n\n\t\tin recent years, \n\t\teven though \n\t\tyou could say medical science has been progressing greatly, the number of sick people has not decreased"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ近年、医学が目覚ましく進歩したといえども、病人の数は減少傾向にはない\">\n\t\t\t\t近年、医学が目覚ましく進歩した<strong>といえども</strong>、病人の数は減少傾向にはない<strong></strong></a> <br/>\n\t\tin recent years, \n\t\t<strong>even though </strong>\n\t\tyou could say medical science has been progressing greatly, the number of sick people has not decreased"
