    japanese: たとえ外国人といえども「郷に入って、郷に従え」です。
    body_text: "たとえ外国人といえども「郷に入って、郷に従え」です。 \n\nEven though \n\t\the is a foreigner, it's a case of when in Rome, do as the Romans do."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJたとえ外国人といえども「郷に入って、郷に従え」です。\">\n\t\t\t\tたとえ外国人<strong>といえども</strong>「郷に入って、郷に従え」です。<strong></strong></a> <br/>\n<strong>Even though </strong>\n\t\the is a foreigner, it's a case of when in Rome, do as the Romans do."
    credits_raw: LR
