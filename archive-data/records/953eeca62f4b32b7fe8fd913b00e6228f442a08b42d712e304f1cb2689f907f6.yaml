label: toiedomo
title_raw: といえども ([といえども] )(toiedomo)
title: といえども
reading: といえども
romanized_label: toiedomo
category: grammar
jlpt_level_original: '1'
meaning: |-
  even, although, though, even though けれども、〜ても、〜であっても (文語体の逆説の表現。後ろには、前の内容から当然予想されることと反対の内容を表すぶんがくることが多い。「いかに〜といえども」や「たとえ〜といえども」のような形をとると、特別な状況を強調する表現になる。)
meaning_example: Even though I live in Tokyo, there are many sightseeing spots in the city that I don't know.
