    japanese: いかに多忙といえども、健康管理を怠ってはならない
    body_text: "いかに多忙といえども、健康管理を怠ってはならない \n\nEven though \n\t\tyou might be so busy, you must not neglect your health"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJいかに多忙といえども、健康管理を怠ってはならない\">\n\t\t\t\tいかに多忙<strong>といえども</strong>、健康管理を怠ってはならない<strong></strong></a> <br/>\n<strong>Even though </strong>\n\t\tyou might be so busy, you must not neglect your health"
