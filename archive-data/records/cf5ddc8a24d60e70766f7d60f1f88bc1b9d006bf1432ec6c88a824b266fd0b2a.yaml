comments:
  - position: 0
    credits_raw: dc
    text: is this the same as tenaranai
    html: |-
      is this the same as <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=tenaranai">tenaranai</a></b>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Miki
    text: "Tenaranaiis not the same as 禁じえない. 抑えられない can be the similar to 禁じえない. \n\r\n禁じえない would be used when you talk about feelings.　同情を抑えられない。"
    html: "Tenaranaiis not the same as 禁じえない. 抑えられない can be the similar to 禁じえない. <br/>\r\n禁じえない would be used when you talk about feelings.　同情を抑えられない。"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: blabby
    text: "I think the nuance is more towards \"(I) can't control/supress\".\n\r\nIt is often used with 怒り,同情,驚き,失望,涙,笑い"
    html: "I think the nuance is more towards \"(I) can't control/supress\".<br/>\r\nIt is often used with 怒り,同情,驚き,失望,涙,笑い"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: yookoso
    text: Is this just the verb 禁じる + 得る eru? If so, should it have it's own entry when eru already exists?
    html: |-
      Is this just the verb 禁じる + 得る <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=eru">eru</a></b>? If so, should it have it's own entry when <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=eru">eru</a></b> already exists?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: 誠
    text: |-
      yookoso, you are right. 禁じる means 抑える or " to suppress", while 得ない means cannot or できない。禁じ得ない　literally means 禁じることができない／抑えることができない or "unable to supress", but this grammar always used together with feelings such as 同情、驚き、失望、涙,....
    html: |-
      yookoso, you are right. 禁じる means 抑える or " to suppress", while 得ない means cannot or できない。禁じ得ない　literally means 禁じることができない／抑えることができない or "unable to supress", but this grammar always used together with feelings such as 同情、驚き、失望、涙,....
    source_id: null
