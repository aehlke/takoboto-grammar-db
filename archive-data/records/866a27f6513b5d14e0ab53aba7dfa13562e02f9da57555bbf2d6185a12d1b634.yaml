notes:
  - position: 0
    text: |-
      に ni is a placement particle locating a point in time or space, で de indicates the domain in which the totality of an event takes place.
    html: |-
      に <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=ni">ni</a></b> is a placement particle locating a point in time or space, で <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=de">de</a></b> indicates the domain in which the totality of an event takes place.
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: The particle に requires something physical, such as 東京に本店があります,whereas, で requires some activity, such as 東京で会合があります.
    html: The particle に requires something physical, such as 東京に本店があります,whereas, で requires some activity, such as 東京で会合があります.
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
