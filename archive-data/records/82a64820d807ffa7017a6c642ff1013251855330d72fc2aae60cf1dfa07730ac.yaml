comments:
  - position: 0
    credits_raw: Amatuka
    text: "The three uses of を wo are \n\r\n1. objective / target (目的) \n\r\n2. area passed through (通過点) \n\r\n3. departure point (出発点)"
    html: "The three uses of を <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=wo\">wo</a></b> are <br/>\r\n1. objective / target (目的) <br/>\r\n2. area passed through (通過点) <br/>\r\n3. departure point (出発点)"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: Amatuka
    text: "を is used to mark a noun or noun phrase.\n\n\n\r\nN = noun."
    html: "を is used to mark a noun or noun phrase.<br/>\n<br/>\r\nN = noun."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: bamboo4
    text: |-
      を is a particle which is essentially acusative case. It also serves as connective of opposing thoughts,as shown in #4962.
    html: |-
      を is a particle which is essentially acusative case. It also serves as connective of opposing thoughts,as shown in <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=wo-2#4962">#4962</a></b>.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: KWhazit
    text: |-
      If you're used to seeing を as marking a direct object, and having it mark an area passed through seems strange, consider this: Even English does this occasionally to what grammatically ought to be direct objects, as in "travel the world" and "sail the seven seas". While you wouldn't normally say "I walked the park" (#889) in English, it's the same concept.
    html: |-
      If you're used to seeing を as marking a direct object, and having it mark an area passed through seems strange, consider this: Even English does this occasionally to what grammatically ought to be direct objects, as in "travel the world" and "sail the seven seas". While you wouldn't normally say "I walked the park" (<b><a href="http://jgram.org:80/pages/viewOne.php?tagE=wo-2#889">#889</a></b>) in English, it's the same concept.
    source_id: null
    original_created_at: null
    original_updated_at: null
