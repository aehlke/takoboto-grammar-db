    japanese: しっと深い人は、友達についてすら、いじわるをして、満足感をうる。
    body_text: "しっと深い人は、友達についてすら、いじわるをして、満足感をうる。\r \n\n\t\tA jealous person gets a feeling of contentment by behaving like a dog in the manger even with his friends."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJしっと深い人は、友達についてすら、いじわるをして、満足感をうる。\">\n\t\t\t\tしっと深い人は、友達について<strong>すら</strong>、いじわるをして、満足感をうる。\r<strong></strong></a> <br/>\n\t\tA jealous person gets a feeling of contentment by behaving like a dog in the manger even with his friends. \n\t\t<strong> </strong>"
