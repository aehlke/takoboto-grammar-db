    japanese: 「人」の漢字すら知らない生徒は、いないでしょ！
    body_text: "「人」の漢字すら知らない生徒は、いないでしょ！ \n\n\t\tThere are no students that \n\t\tdon't even \n\t\tknow the 「人」 kanji!"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ「人」の漢字すら知らない生徒は、いないでしょ！\">\n\t\t\t\t「人」の漢字<strong>すら</strong>知らない生徒は、いないでしょ！<strong></strong></a> <br/>\n\t\tThere are no students that \n\t\t<strong>don't even </strong>\n\t\tknow the 「人」 kanji!"
