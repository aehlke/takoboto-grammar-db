    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその生徒は先生に返事すらしませんでした。\">\n\t\t\t\tその生徒は先生に返事<strong>すら</strong>しませんでした。\r<strong></strong></a> <br/>\n\t\tThe student did not so much as answer the teacher. \n\t\t<strong> </strong>"
