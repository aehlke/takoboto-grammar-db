  - source_id: 6039
    position: 3
    japanese: この大学の学生の中には教師に対する口の聞き方すら知らないものがいる。
    body_text: "この大学の学生の中には教師に対する口の聞き方すら知らないものがいる。\r \n\n\t\tSome student in this university don't even know how to talk to teachers."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの大学の学生の中には教師に対する口の聞き方すら知らないものがいる。\">\n\t\t\t\tこの大学の学生の中には教師に対する口の聞き方<strong>すら</strong>知らないものがいる。\r<strong></strong></a> <br/>\n\t\tSome student in this university don't even know how to talk to teachers. \n\t\t<strong> </strong>"
