    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこんなケーブル線ですら、６０００円もした。\">\n\t\t\t\tこんなケーブル線で<strong>すら</strong>、６０００円もした。\r<strong></strong></a> <br/>\n\t\tEven this cable cost me 6000 yen. \n\t\t<strong> </strong>"
