    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれらの言葉ですらいつか消えてしまいます。\">\n\t\t\t\tこれらの言葉で<strong>すら</strong>いつか消えてしまいます。\r<strong></strong></a> <br/>\n\t\tEven these words will someday disappear. \n\t\t<strong> </strong>"
