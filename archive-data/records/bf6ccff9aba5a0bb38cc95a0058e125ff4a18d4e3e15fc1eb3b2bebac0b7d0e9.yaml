    japanese: 海外で育つ日本人の子供の場合、日本語が完璧にできる場合ですら、帰国後日本の学校に適応するのに大変苦労することが時々ある。
    body_text: "海外で育つ日本人の子供の場合、日本語が完璧にできる場合ですら、帰国後日本の学校に適応するのに大変苦労することが時々ある。\r \n\n\t\tJapanese children brought up overseas sometimes face great difficulty in adjusting themselves to Japanese schools after returning, even though they have a perfect command of Japanese."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ海外で育つ日本人の子供の場合、日本語が完璧にできる場合ですら、帰国後日本の学校に適応するのに大変苦労することが時々ある。\">\n\t\t\t\t海外で育つ日本人の子供の場合、日本語が完璧にできる場合で<strong>すら</strong>、帰国後日本の学校に適応するのに大変苦労することが時々ある。\r<strong></strong></a> <br/>\n\t\tJapanese children brought up overseas sometimes face great difficulty in adjusting themselves to Japanese schools after returning, even though they have a perfect command of Japanese. \n\t\t<strong> </strong>"
    credits_raw: dc
