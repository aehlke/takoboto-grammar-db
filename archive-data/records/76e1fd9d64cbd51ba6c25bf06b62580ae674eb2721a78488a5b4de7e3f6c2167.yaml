    japanese: その力士はまわしを取るが早いか、相手を投げ飛ばした。
    body_text: "その力士はまわしを取るが早いか、相手を投げ飛ばした。 \n\nAs soon as \n\t\tthe sumo wrestler snared the front of the opponent's sash, he tumbled him onto the ground."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその力士はまわしを取るが早いか、相手を投げ飛ばした。\">\n\t\t\t\tその力士はまわしを取る<strong>が早いか</strong>、相手を投げ飛ばした。<strong></strong></a> <br/>\n<strong>As soon as </strong>\n\t\tthe sumo wrestler snared the front of the opponent's sash, he tumbled him onto the ground."
