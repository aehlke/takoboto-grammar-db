    body_text: "ベルが鳴ったが早いか、生徒たちは教室を飛び出して行った。 \n\nAs soon as \n\t\tthe bell rang, the students left the classroom."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJベルが鳴ったが早いか、生徒たちは教室を飛び出して行った。\">\n\t\t\t\tベルが鳴った<strong>が早いか</strong>、生徒たちは教室を飛び出して行った。<strong></strong></a> <br/>\n<strong>As soon as </strong>\n\t\tthe bell rang, the students left the classroom."
