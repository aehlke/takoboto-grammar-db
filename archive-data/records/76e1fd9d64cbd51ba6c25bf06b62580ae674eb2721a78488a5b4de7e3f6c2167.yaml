  - source_id: 6672
    position: 4
    japanese: ことによるとあの女は、私が太刀打ちを始めるが早いか、人の助けでも呼ぶために、藪をくぐって逃げたかもしれない。
    body_text: "ことによるとあの女は、私が太刀打ちを始めるが早いか、人の助けでも呼ぶために、藪をくぐって逃げたかもしれない。 \n\n\t\tIt's possible that \n\t\tas soon as \n\t\t I started the sword fight, that that woman ran slipped into the grove and ran to call for help."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJことによるとあの女は、私が太刀打ちを始めるが早いか、人の助けでも呼ぶために、藪をくぐって逃げたかもしれない。\">\n\t\t\t\tことによるとあの女は、私が太刀打ちを始める<strong>が早いか</strong>、人の助けでも呼ぶために、藪をくぐって逃げたかもしれない。<strong></strong></a> <br/>\n\t\tIt's possible that \n\t\t<strong>as soon as </strong>\n\t\t I started the sword fight, that that woman ran slipped into the grove and ran to call for help."
    credits_raw: nazonatte69
