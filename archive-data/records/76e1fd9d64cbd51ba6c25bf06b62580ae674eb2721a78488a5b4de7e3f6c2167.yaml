    body_text: "社長が会議室に入ったがはやいか、早速会議が始まった。 \n\n\t\tAs soon as the company president entered the meeting room, the meeting started."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ社長が会議室に入ったがはやいか、早速会議が始まった。\">\n\t\t\t\t社長が会議室に入った<strong>がはやいか</strong>、早速会議が始まった。<strong></strong></a> <br/>\n\t\tAs soon as the company president entered the meeting room, the meeting started. \n\t\t<strong> </strong>"
