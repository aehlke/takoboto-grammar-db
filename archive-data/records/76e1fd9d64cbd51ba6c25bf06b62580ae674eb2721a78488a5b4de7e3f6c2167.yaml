    japanese: その朝彼がキッチンに入って来るがはやいか、彼女は彼と些細なことで口論を始めた。
    body_text: "その朝彼がキッチンに入って来るがはやいか、彼女は彼と些細なことで口論を始めた。 \n\nAs soon as \n\t\the came into the room in the morning, she got into a shouting match with him over the most trivial thing."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJその朝彼がキッチンに入って来るがはやいか、彼女は彼と些細なことで口論を始めた。\">\n\t\t\t\tその朝彼がキッチンに入って来る<strong>がはやいか</strong>、彼女は彼と些細なことで口論を始めた。<strong></strong></a> <br/>\n<strong>As soon as </strong>\n\t\the came into the room in the morning, she got into a shouting match with him over the most trivial thing."
