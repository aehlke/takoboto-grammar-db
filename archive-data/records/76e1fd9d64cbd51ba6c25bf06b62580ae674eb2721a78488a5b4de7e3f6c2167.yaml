  - position: 1
    credits_raw: bamboo4
    text: "やいなや meaning \"almost as soon as\" is normally used and the use of が早いか in the examples is kind of stroange. \n\n\n\r\nWe normally use it in such sentence as 聞くが早いか、あいつは飛び出していった。"
    html: "やいなや meaning \"almost as soon as\" is normally used and the use of が早いか in the examples is kind of stroange. <br/>\n<br/>\r\nWe normally use it in such sentence as 聞くが早いか、あいつは飛び出していった。 <br/>\n<br/>\n<br/>"
    source_id: null
