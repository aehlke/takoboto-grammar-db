  - source_id: 6403
    position: 3
    japanese: 新刊を出版したのですが、出版するが早いか腹を立てた人から手紙が届き始めました。
    body_text: "新刊を出版したのですが、出版するが早いか腹を立てた人から手紙が届き始めました。 \n\n\t\tWe put a new book out, but \n\t\tthe second \n\t\tit was published we started to get letters from angry people."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ新刊を出版したのですが、出版するが早いか腹を立てた人から手紙が届き始めました。\">\n\t\t\t\t新刊を出版したのですが、出版する<strong>が早いか</strong>腹を立てた人から手紙が届き始めました。<strong></strong></a> <br/>\n\t\tWe put a new book out, but \n\t\t<strong>the second </strong>\n\t\tit was published we started to get letters from angry people."
    credits_raw: EvilKyra
