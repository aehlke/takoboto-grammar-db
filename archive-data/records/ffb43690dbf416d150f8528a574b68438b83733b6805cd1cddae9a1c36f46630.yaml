    text: |-
      I think the meaning here is more like "That's what you'd expect" or "You would expect no less." I puzzled over this and "dakeatte" for a while with my girlfriend here, and that's what we arrived at. I've submitted a couple of sample sentences to demonstrate this meaning. So, for example, #326 might translate a little more literally as "This melon is great. As you'd expect, since it was so expensive."
    html: |-
