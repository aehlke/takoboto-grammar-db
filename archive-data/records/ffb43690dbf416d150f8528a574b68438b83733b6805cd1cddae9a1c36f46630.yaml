notes:
  - position: 0
    text: "dakenokotohaaru and dakeatte are the same, but with the sentence order reversed. \n\n\n\ndakenokoto\n\r\nその映画は面白かった。Woody Allenが作っただけのことはある。 \n\r\nThat movie was really interesting. That's what I expect of a Woody Allen film.\n\n\n\ndakeatte\n\r\nWoody Allenが作った映画だけあって、面白かった。  \n\r\nAs I'd expect from a Woody Allen film, that was really interesting.\n\n\n\n\n\r\nこのメロンはおいしい。高かっただけのことはある\n\r\nこのメロンは高かっただけあって、おいしい\n\r\nboth meanings are basically:\n\r\nas you'd expect for a melon that was so expensive, this is delicious."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=dakenokoto\">dakenokoto</a></b>haaru and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=dakeatte\">dakeatte</a></b> are the same, but with the sentence order reversed. <br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=dakenokoto\">dakenokoto</a></b><br/>\r\nその映画は面白かった。Woody Allenが作っただけのことはある。 <br/>\r\nThat movie was really interesting. That's what I expect of a Woody Allen film.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=dakeatte\">dakeatte</a></b><br/>\r\nWoody Allenが作った映画だけあって、面白かった。  <br/>\r\nAs I'd expect from a Woody Allen film, that was really interesting.<br/>\n<br/>\n<br/>\r\nこのメロンはおいしい。高かっただけのことはある<br/>\r\nこのメロンは高かっただけあって、おいしい<br/>\r\nboth meanings are basically:<br/>\r\nas you'd expect for a melon that was so expensive, this is delicious."
    credits_raw: dc
    source_id: null
