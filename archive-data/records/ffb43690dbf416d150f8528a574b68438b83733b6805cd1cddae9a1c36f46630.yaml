  - position: 1
    text: "「Ａだけあって・だけに、Ｂ。」＝「Ｂ。Ａだけのことはある。」\n\n\n\r\nYou should only use this grammar for positive nuances.\n\n\n\r\nFORMATION;\n\r\nＶnormal form + だけのことはある\n\r\nＮ + だけのことはある\n\r\nいＡ + だけのことはある\n\r\nなＡ + な・だった + だけのことはある"
    html: "「Ａだけあって・だけに、Ｂ。」＝「Ｂ。Ａだけのことはある。」<br/>\n<br/>\r\nYou should only use this grammar for positive nuances.<br/>\n<br/>\r\nFORMATION;<br/>\r\nＶnormal form + だけのことはある<br/>\r\nＮ + だけのことはある<br/>\r\nいＡ + だけのことはある<br/>\r\nなＡ + な・だった + だけのことはある"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    text: "I changed the entry tag from だけのこと to だけのことはある because they are different. だけのこと was the original intent for this entry, but everyone was using it as an entry for the latter.\n\n\n\r\nThis grammar has several meanings depending on your preference or on context. 気を付けてね。"
