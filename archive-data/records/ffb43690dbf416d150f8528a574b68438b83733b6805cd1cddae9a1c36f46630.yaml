    text: "nearly - but not quite. I should really write up a better \"how to\" one day.\n\r\nBasically the \"grammar\" field is just for the hilite in red part, eg dakenokoto in this case. Not the whole sentence. so you need to break up the sentence. \n\r\nThis is so other parts of the site like our flash quiz can just pick out the grammar parts of a sentence.\n\r\nIf you use the basic add example form we try and parse out the grammar automatically, but only in the japanese.\n\r\nThe \"prior form\" field is for the verb or whatever that goes right before the grammar. This is usually very important in japanese (eg you have to use dictionary form with this grammar).\n\r\nThanks again and sorry its not very well explained."
    html: "nearly - but not quite. I should really write up a better \"how to\" one day.<br/>\r\nBasically the \"grammar\" field is just for the hilite in red part, eg <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=dakenokoto\">dakenokoto</a></b> in this case. Not the whole sentence. so you need to break up the sentence. <br/>\r\nThis is so other parts of the site like our flash quiz can just pick out the grammar parts of a sentence.<br/>\r\nIf you use the basic <a href=\"http://www.jgram.org/pages/addBatch.php?tagE=dakenokoto\">add example form</a> we try and parse out the grammar automatically, but only in the japanese.<br/>\r\nThe \"prior form\" field is for the verb or whatever that goes right before the grammar. This is usually very important in japanese (eg you have to use dictionary form with this grammar).<br/>\r\nThanks again and sorry its not very well explained."
