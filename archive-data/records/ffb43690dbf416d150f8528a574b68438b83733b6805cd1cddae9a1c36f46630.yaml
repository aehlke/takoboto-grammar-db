    text: "hi dc - i submitted the examples, but perhaps they haven't been checked yet? nothing ever appeared. my 1st time posting, so perhaps i did something wrong. i'll re-enter them again when i get back home this week, but not sure why they're not here. \n\r\nanyway, the understanding i have (and checked with a few native speakers) is that \"dakenokotohaaru\" and \"dakeatte\" are the same, but with the sentence order reversed. thus \"このメロンはおいしい。高かっただけのことはある。\" is essentially the same as \"このメロンは高かっただけあって、おいしい。”both meanings are basically, \"as you'd expect for a melon that was so expensive, this is delicious.\""
