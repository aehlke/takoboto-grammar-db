  - position: 10
    credits_raw: DealPete
    text: "言わん can be short for 言わない, but in this case,  言わん = 言わむ is an old fashioned subjunctive, equivalent to 言おう.\n\r\nI was highly confused at first until I discovered that the final \"ん\" can signal two different inflectional forms"
    html: "言わん can be short for 言わない, but in this case,  言わん = 言わむ is an old fashioned subjunctive, equivalent to 言おう.<br/>\r\nI was highly confused at first until I discovered that the final \"ん\" can signal two different inflectional forms"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 11
    credits_raw: blabby
    text: "Maybe this should be listed as \"と(言わん)ばかりに\". I've seen lots of examples such as \n\r\nうちの犬は「散歩に行こうよ」とばかりに僕の顔を見て吠えた。\n\r\nMy dog looked at me and barked as if to say \"let's go for a walk!\""
