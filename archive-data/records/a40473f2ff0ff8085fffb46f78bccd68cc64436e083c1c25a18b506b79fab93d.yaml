  - position: 9
    credits_raw: bamboo4
    text: You would say 言わなかったばかりに and 言わんばかりに, but not 言わないばかりに.
    html: |-
      You would say 言わなかったばかりに and 言わんばかりに, but not 言わないばかりに.<br/>
