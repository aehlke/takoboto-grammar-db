    japanese: 「結構です」レモン・キャンディーなど食べている場合ではないとばかりに、マクゴナガル先生は冷ややかに答えた。
    body_text: "「結構です」レモン・キャンディーなど食べている場合ではないとばかりに、マクゴナガル先生は冷ややかに答えた。 \n\n\t\t\"I'm fine thanks.\"  McDonagal answered cooly, \n\t\tas if to say \n\t\tthis is no occasion to be eating lemon candies."
    body_html: "<a href=\"http://www.csse.monash.edu.au/cgi-bin/cgiwrap/jwb/wwwjdic?9MHJ「結構です」レモン・キャンディーなど食べている場合ではないとばかりに、マクゴナガル先生は冷ややかに答えた。\">\n\t\t\t\t「結構です」レモン・キャンディーなど食べている場合ではないと<strong>ばかりに</strong>、マクゴナガル先生は冷ややかに答えた。<strong></strong></a> <br/>\n\t\t\"I'm fine thanks.\"  McDonagal answered cooly, \n\t\t<strong>as if to say </strong>\n\t\tthis is no occasion to be eating lemon candies."
