  - position: 1
    credits_raw: Amatuka
    text: |-
      Note that in general this can be replaced with から kara but there are some places where one can be used but not the other and vice versa.
    html: |-
      Note that in <b>general</b> this can be replaced with から <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=kara">kara</a></b> but there are some places where one can be used but not the other and vice versa.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: Amatuka
    text: "を is used to mark a noun or noun phrase.\n\n\n\r\nN = noun."
    html: "を is used to mark a noun or noun phrase.<br/>\n<br/>\r\nN = noun."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: hikey
    text: Can someone give some examples of where one can be used and not the other, to clarify this point, please?
    html: Can someone give some examples of where one can be used and not the other, to clarify this point, please?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: bamboo4
    text: |-
      から has the connotation that one has left to go to some other place, e.g, 大阪からヨーロッパに向かった(he left Osaka to go to Europe). 大阪を出発した could simply suggest that one left Osaka but it leaves unsaid any other information as to his destination or his purpose.On the other hand, you can also supplement that and say 大阪を出発してヨーロッパに向かった. The difference is that, in most cases,から requires destination, whereas を does not.
    html: |-
      から has the connotation that one has left to go to some other place, e.g, 大阪からヨーロッパに向かった(he left Osaka to go to Europe). 大阪を出発した could simply suggest that one left Osaka but it leaves unsaid any other information as to his destination or his purpose.On the other hand, you can also supplement that and say 大阪を出発してヨーロッパに向かった. The difference is that, in most cases,から requires destination, whereas を does not.<br/>
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 5
    credits_raw: razovsuki
    text: "Have a question:\n\r\nNormally, the presence of a を necessarily leads to the presence of a verb somewhere behind it, right? Which is to assume that if I have for instance 3 を there should be at least 3 verbs in the sentence...\n\r\n(I'm not talking about a specific を here, the question goes for all 3 of them)\n\r\nAre there cases where it's possible to have more を than actual verbs??"
    html: "Have a question:<br/>\r\nNormally, the presence of a を necessarily leads to the presence of a verb somewhere behind it, right? Which is to assume that if I have for instance 3 を there should be at least 3 verbs in the sentence...<br/>\r\n(I'm not talking about a specific を here, the question goes for all 3 of them)<br/>\r\nAre there cases where it's possible to have more を than actual verbs??"
    source_id: null
