comments:
  - position: 0
    credits_raw: Amatuka
    text: "1. objective / target (目的) \n\r\n2. area passed through (通過点) \n\r\n3. departure point (出発点)"
    html: "1. objective / target (目的) <br/>\r\n2. area passed through (通過点) <br/>\r\n3. departure point (出発点)"
