  - position: 2
    credits_raw: bamboo4
    text: "Just a note to say that いくらか is a completely diferent word meaning \"a relatively small amount.\" \n\n\n\r\nいくらか得したの = Did you make some gain?\n\r\nいくら得したの = HOw much gain did you make?"
    html: "Just a note to say that いくらか is a completely diferent word meaning \"a relatively small amount.\" <br/>\n<br/>\r\nいくらか得したの = Did you make some gain?<br/>\r\nいくら得したの = HOw much gain did you make?<br/>\n<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: feralkat
    text: |-
      I'm not sure it's wrong per se, but it is bad English because it's unclear when stated alone.  In a known context it would be fine, but alone it could mean anything like, "I don't know how much this motorcycle is loved."
    html: |-
      I'm not sure it's wrong per se, but it is bad English because it's unclear when stated alone.  In a known context it would be fine, but alone it could mean anything like, "I don't know how much this motorcycle is loved."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 4
    credits_raw: feralkat
    text: |-
      ...and I concur with bamboo4 that いくらか means "some," and could be confusing Japanese to a non-native speaker, but in this case and in this  context it clearly means "how much?"
    html: |-
