  - position: 20
    credits_raw: 誠
    text: "There are many other forms using 限る as root besides the ４ in the added notes above:\n\n\n\r\n１．〜に限ったことではない：　〜だけではない\n\r\ne.g. :「いじめは子供の世界に限ったことではない。大人の世界にもある。」\n\n\n\r\n２．〜ないとも限らない：　〜可能性がある、「１００％〜ない」とは言えない\n\r\ne.g.: 「電車が遅れないとも限らないから、早く家を出ましょう。」\n\n\n\r\n３．〜限りで：　〜を最後にして \"Until/By this〜\" or \"By 〜 as the last of...\"\n\r\ne.g.: 「無料サ―ビスは、今週限りで終わらせて頂きます。」\n\n\n\r\n４．〜限りに（一級文法）：　〜を最後にして　\"Until/By this〜\" or \"To the extent of 〜\"\n\r\ne.g.: 「本日を限りに退職することにしました。」\n\n\n\r\n５．〜に限って：〜に合わせるように．．．（不都合な事が起きる） \"....(happen) just exactly at the wrong time while 〜\"\n\r\ne.g.:  「留守の時に限って、荷物が届きます。」」\n\n\n\r\n６．〜に限り：　〜だけ\n\r\ne.g.:  「成績優秀者に限り学費が免除されます。」\n\n\n\r\n７．〜に限らず：　〜だけでなく\n\r\ne.g.:　「都合がよければ、授業中に限らず、いつでも\n\r\n質問に来てください。」\n\n\n\r\n８．〜に限って．．．ない　：〜について（私の考えを）述べるなら、．．．（のような悪いこと）はない\n\r\ne.g.: 「あの人に限って、殺人などするはずはない。」"
    html: "There are many other forms using 限る as root besides the ４ in the added notes above:<br/>\n<br/>\r\n１．〜に限ったことではない：　〜だけではない<br/>\r\ne.g. :「いじめは子供の世界に限ったことではない。大人の世界にもある。」<br/>\n<br/>\r\n２．〜ないとも限らない：　〜可能性がある、「１００％〜ない」とは言えない<br/>\r\ne.g.: 「電車が遅れないとも限らないから、早く家を出ましょう。」<br/>\n<br/>\r\n３．〜限りで：　〜を最後にして \"Until/By this〜\" or \"By 〜 as the last of...\"<br/>\r\ne.g.: 「無料サ―ビスは、今週限りで終わらせて頂きます。」<br/>\n<br/>\r\n４．〜限りに（一級文法）：　〜を最後にして　\"Until/By this〜\" or \"To the extent of 〜\"<br/>\r\ne.g.: 「本日を限りに退職することにしました。」<br/>\n<br/>\r\n５．〜に限って：〜に合わせるように．．．（不都合な事が起きる） \"....(happen) just exactly at the wrong time while 〜\"<br/>\r\ne.g.:  「留守の時に限って、荷物が届きます。」」<br/>\n<br/>\r\n６．〜に限り：　〜だけ<br/>\r\ne.g.:  「成績優秀者に限り学費が免除されます。」<br/>\n<br/>\r\n７．〜に限らず：　〜だけでなく<br/>\r\ne.g.:　「都合がよければ、授業中に限らず、いつでも<br/>\r\n質問に来てください。」<br/>\n<br/>\r\n８．〜に限って．．．ない　：〜について（私の考えを）述べるなら、．．．（のような悪いこと）はない<br/>\r\ne.g.: 「あの人に限って、殺人などするはずはない。」"
