notes:
  - position: 0
    text: "１．〜限り／〜ない限り　：〜という状態が続く中では\n\n\n\r\n２．〜限りでは：〜範囲では\n\n\n\r\n３．〜限りだ：最高に〜だ；（感情を表す形容詞につく）e.g.: 嬉しい限りだ、羨ましい限りだ．．．\n\r\n　　「〜限りだ」は一級の文法です。\n\n\n\r\n４．〜とは限らない：　絶対〜とは言えない\n\r\n   Meaning: \"It doen't absolutely means that ......\" Quite similar to 〜というものではない"
    html: "１．〜限り／〜ない限り　：〜という状態が続く中では<br/>\n<br/>\r\n２．〜限りでは：〜範囲では<br/>\n<br/>\r\n３．〜限りだ：最高に〜だ；（感情を表す形容詞につく）e.g.: 嬉しい限りだ、羨ましい限りだ．．．<br/>\r\n　　「〜限りだ」は一級の文法です。<br/>\n<br/>\r\n４．〜とは限らない：　絶対〜とは言えない<br/>\r\n   Meaning: \"It doen't absolutely means that ......\" Quite similar to 〜というものではない<br/>"
    credits_raw: 誠
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "This is a conjuction which express the idea \"as long as\" ..\n\n\n\r\n私が日本にいる限り心配は無用です\n\r\nAs long as I am in japan you dont need to worry."
    html: "This is a conjuction which express the idea \"as long as\" ..<br/>\n<br/>\r\n私が日本にいる限り心配は無用です<br/>\r\nAs long as I am in japan you dont need to worry."
    credits_raw: brij_shukla2000
