  - position: 12
    credits_raw: dc
    text: "karaniha seems to imply a \"since\" or \"because\" meaning. \n\r\n⇒ \"since I am in Paris (I try and speak french)\"\n\r\nパリにいるからには、フランスごを話そう。\n\n\n\nkagiri seems to imply until something will change.\n\r\n⇒ \"while I remain in Paris (I will speak french)\"\n\n\n\nkagiri is also \"up until the limit\"...\n\r\n\"I will speak french (as best I can)\"\n\r\n出来る限りにフランスごを話そう\n\n\n\r\na comparative example:\n\nkagiri\n\r\nパリにいる限りにフランスごを話さなければならない\n\r\nWhile i am in Paris, i have to speak french\n\r\n(ie until I leave)\n\n\n\nkaraniha\n\r\nパリにいるからには、フランスごを話そう。\n\r\nsince I am in Paris (I will try and speak french)"
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=karaniha\">karaniha</a></b> seems to imply a \"since\" or \"because\" meaning. <br/>\r\n⇒ \"since I am in Paris (I try and speak french)\"<br/>\r\nパリにいるからには、フランスごを話そう。<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kagiri\">kagiri</a></b> seems to imply until something will change.<br/>\r\n⇒ \"while I remain in Paris (I will speak french)\"<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kagiri\">kagiri</a></b> is also \"up until the limit\"...<br/>\r\n\"I will speak french (as best I can)\"<br/>\r\n出来る限りにフランスごを話そう<br/>\n<br/>\r\na comparative example:<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kagiri\">kagiri</a></b><br/>\r\nパリにいる限りにフランスごを話さなければならない<br/>\r\nWhile i am in Paris, i have to speak french<br/>\r\n(ie until I leave)<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=karaniha\">karaniha</a></b><br/>\r\nパリにいるからには、フランスごを話そう。<br/>\r\nsince I am in Paris (I will try and speak french)<br/>"
    source_id: null
    original_created_at: null
    original_updated_at: null
