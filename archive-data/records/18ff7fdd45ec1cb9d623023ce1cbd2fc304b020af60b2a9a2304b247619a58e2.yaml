notes:
  - position: 0
    text: "but / only used with neg. predicates & highlights expressed word\n\r\ncompared to だけ, which is used with positive nuance... check out comparison below"
    html: "but / only used with neg. predicates &amp; highlights expressed word<br/>\r\ncompared to だけ, which is used with positive nuance... check out comparison below"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "Maybe its similar to the difference between \"just\" and \"only\".\n\n\n\r\n３人だけでも十分\n\r\nJust 3 people is fine\n\n\n\r\n３人しかないので、大変だった\n\r\nOnly 3 people, so it was tough..\n\n\n\r\nIf you exchange, the nuance is different\n\r\n３人[しかない]でも十分\n\r\nEven if with only 3 people, its enough\n\n\n\r\nthe nuance is that 3 people is not really enough, but if we try we can do it...\n\n\n\r\nPart of the clue is that after shika you use a negative:\n\r\nshikanai\n\r\nand dake you use a positive"
    html: "Maybe its similar to the difference between \"just\" and \"only\".<br/>\n<br/>\r\n３人だけでも十分<br/>\r\nJust 3 people is fine<br/>\n<br/>\r\n３人しかないので、大変だった<br/>\r\nOnly 3 people, so it was tough..<br/>\n<br/>\r\nIf you exchange, the nuance is different<br/>\r\n３人[しかない]でも十分<br/>\r\nEven if with only 3 people, its enough<br/>\n<br/>\r\nthe nuance is that 3 people is not really enough, but if we try we can do it...<br/>\n<br/>\r\nPart of the clue is that after shika you use a negative:<br/>\r\nshika<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=nai\">nai</a></b><br/>\r\nand dake you use a positive"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
