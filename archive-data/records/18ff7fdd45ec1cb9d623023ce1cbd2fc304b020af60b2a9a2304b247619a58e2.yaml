  - position: 11
    credits_raw: blabby
    text: "I know for this grammar that you often omit the particle.\n\r\nラーメンをしか食べていない sounds strange to me.\n\r\nラーメンしか食べていない sounds more natural.\n\r\nToday, I wanted to say \"Recently, I am only meeting XX\". In this case you would say XXさん と/に しか会っていない. right?\n\r\nI also hear 何々の前にしか会ってない。\n\r\nCan anyone clarify the rules of particle omission?"
    html: "I know for this grammar that you often omit the particle.<br/>\r\nラーメンをしか食べていない sounds strange to me.<br/>\r\nラーメンしか食べていない sounds more natural.<br/>\r\nToday, I wanted to say \"Recently, I am only meeting XX\". In this case you would say XXさん と/に しか会っていない. right?<br/>\r\nI also hear 何々の前にしか会ってない。<br/>\r\nCan anyone clarify the rules of particle omission?"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 12
    credits_raw: bamboo4
    text: |-
      In the notes,３人しかないので should be ３人しかいないので　When you count persons, you use いる/いない and when you refer to inanimate things, you use ある/ない, as the general rule.Elementary, my dear Watson.
    html: |-
      In the notes,３人しかないので should be ３人しかいないので　When you count persons, you use いる/いない and when you refer to inanimate things, you use ある/ない, as the general rule.Elementary, my dear Watson.
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 13
    credits_raw: jmadsen
    text: |-
      I learned this one as "no more than", which always helped me think of it as a negative-sounding idea, and so I never had trouble remembering to use a negative verb with it. Many of the examples use shika + nai, but you should realize that it is the negative form of ANY verb (subject to other grammar rules, of course.)
    html: |-
      I learned this one as "no more than", which always helped me think of it as a negative-sounding idea, and so I never had trouble remembering to use a negative verb with it. Many of the examples use shika + nai, but you should realize that it is the negative form of ANY verb (subject to other grammar rules, of course.)
    source_id: null
    original_created_at: null
    original_updated_at: null
