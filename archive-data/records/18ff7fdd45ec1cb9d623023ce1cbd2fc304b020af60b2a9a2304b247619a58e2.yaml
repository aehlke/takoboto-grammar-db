  - position: 1
    credits_raw: Amatuka
    text: |-
      In the しか 'Mr. Tanaka' example the implication is that more might have been expected to come.  There is not such an implication in the だけ version.
    html: |-
      In the しか 'Mr. Tanaka' example the implication is that more might have been expected to come.  There is not such an implication in the だけ version.
