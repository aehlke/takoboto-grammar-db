    body_text: "かれらの関係についてはさっぱりわからない。\r \n\n\t\tI am in the dark about the relation between them."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJかれらの関係についてはさっぱりわからない。\">\n\t\t\t\tかれらの関係<strong>については</strong>さっぱりわからない。\r<strong></strong></a> <br/>\n\t\tI am in the dark about the relation between them. \n\t\t<strong> </strong>"
