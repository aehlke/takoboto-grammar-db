    japanese: この件については、私達は政府に反対だ。
    body_text: "この件については、私達は政府に反対だ。\r \n\n\t\tWe oppose the government on this matter."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの件については、私達は政府に反対だ。\">\n\t\t\t\tこの件<strong>については</strong>、私達は政府に反対だ。\r<strong></strong></a> <br/>\n\t\tWe oppose the government on this matter. \n\t\t<strong> </strong>"
