  - source_id: 3816
    position: 6
    japanese: このようなことについては直接お会いして、図面に書いたり、ロジックアナライザやオシロでタイミングを見たりしながら話し合ったほうが解決が速いです。
    body_text: "このようなことについては直接お会いして、図面に書いたり、ロジックアナライザやオシロでタイミングを見たりしながら話し合ったほうが解決が速いです。\r \n\n\t\tThese things are much better spoken about face to face so that we can draw diagrams and demonstrate timings on logic analyzers and oscilloscopes where necessary."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこのようなことについては直接お会いして、図面に書いたり、ロジックアナライザやオシロでタイミングを見たりしながら話し合ったほうが解決が速いです。\">\n\t\t\t\tこのようなこと<strong>については</strong>直接お会いして、図面に書いたり、ロジックアナライザやオシロでタイミングを見たりしながら話し合ったほうが解決が速いです。\r<strong></strong></a> <br/>\n\t\tThese things are much better spoken about face to face so that we can draw diagrams and demonstrate timings on logic analyzers and oscilloscopes where necessary. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3817
    position: 7
    japanese: この奇妙な植物についてはほとんど知られていない。
    body_text: "この奇妙な植物についてはほとんど知られていない。 \n\n\t\tLittle is known \n\t\tabout \nthis curious plant  ."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの奇妙な植物についてはほとんど知られていない。\">\nこの奇妙な植物<strong>については</strong>ほとんど知られていない。<strong></strong></a> <br/>\n\t\tLittle is known \n\t\t<strong>about </strong>\nthis curious plant  ."
    credits_raw: dbx
    verification_class:
      - bottom
    original_created_at: null
    original_updated_at: null
  - source_id: 3818
