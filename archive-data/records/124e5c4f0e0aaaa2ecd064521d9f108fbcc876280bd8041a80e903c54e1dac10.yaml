    japanese: あの件については彼女の指示に従っていいでしょう。
    body_text: "あの件については彼女の指示に従っていいでしょう。\r \n\n\t\tYou can take the supervisor at her word on that."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあの件については彼女の指示に従っていいでしょう。\">\n\t\t\t\tあの件<strong>については</strong>彼女の指示に従っていいでしょう。\r<strong></strong></a> <br/>\n\t\tYou can take the supervisor at her word on that. \n\t\t<strong> </strong>"
