    japanese: この問題についてはもう少しみんなでよく考えてみてください。
    body_text: "この問題についてはもう少しみんなでよく考えてみてください。 \n\n\t\tAll of you please intend to think well a little more \n\t\tabout \nthis problem  ."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの問題については\">\nこの問題<strong>については</strong><strong></strong>もう少しみんなでよく考えてみてください。</a> <br/>\n\t\tAll of you please intend to think well a little more \n\t\t<strong>about </strong>\nthis problem  ."
