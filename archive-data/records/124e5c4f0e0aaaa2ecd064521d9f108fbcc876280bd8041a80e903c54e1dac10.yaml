    body_text: "この計画については黙っていてください。\r \n\n\t\tKeep mum about this plan."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの計画については黙っていてください。\">\n\t\t\t\tこの計画<strong>については</strong>黙っていてください。\r<strong></strong></a> <br/>\n\t\tKeep mum about this plan. \n\t\t<strong> </strong>"
    credits_raw: dbx
    verification_class:
      - bottom
