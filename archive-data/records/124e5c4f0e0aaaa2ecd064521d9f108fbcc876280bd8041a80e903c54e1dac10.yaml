    japanese: この件については、危険はたとえあるとしてもほとんどない。
    body_text: "この件については、危険はたとえあるとしてもほとんどない。\r \n\n\t\tThere is little, if any, risk in this matter."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの件については、危険はたとえあるとしてもほとんどない。\">\n\t\t\t\tこの件<strong>については</strong>、危険はたとえあるとしてもほとんどない。\r<strong></strong></a> <br/>\n\t\tThere is little, if any, risk in this matter. \n\t\t<strong> </strong>"
