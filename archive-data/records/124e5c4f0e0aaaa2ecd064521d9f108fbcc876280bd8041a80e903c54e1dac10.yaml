    japanese: この件については彼が間違っているということを、私は彼にはっきり悟らせねばならない。
    body_text: "この件については彼が間違っているということを、私は彼にはっきり悟らせねばならない。  \n\n\t\tI must bring home to him the fact that he is wrong in this case."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの件については彼が間違っているということを、私は彼にはっきり悟らせねばならない。 \">\n\t\t\t\tこの件<strong>については</strong>彼が間違っているということを、私は彼にはっきり悟らせねばならない。 <strong></strong></a> <br/>\n\t\tI must bring home to him the fact that he is wrong in this case. \n\t\t<strong> </strong>"
