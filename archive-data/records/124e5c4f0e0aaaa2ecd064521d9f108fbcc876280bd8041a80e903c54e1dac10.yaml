    japanese: あなたの趣味について話してください。
    body_text: "あなたの趣味について話してください。  \n\n\t\tPlease tell me \n\t\tabout \n\t\tyour hobbies."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJあなたの趣味について話してください。 \">\n\t\t\t\tあなたの趣味<strong>について</strong>話してください。 <strong></strong></a> <br/>\n\t\tPlease tell me \n\t\t<strong>about </strong>\n\t\tyour hobbies."
