  - position: 1
    credits_raw: 誠
    text: "I agree with Amatuka, は is somehow an emphasis of the topic of sentence.\n\n\n\r\nex3812, is interpreted as について　＋　はなしてください\n\n\n\r\nex3819, i think 「危険はたとえあるとしても少ない」 would be natural. Otherwise, 「危険はほとんどない。」"
