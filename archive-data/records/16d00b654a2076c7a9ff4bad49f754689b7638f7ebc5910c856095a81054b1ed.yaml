notes:
  - position: 0
    text: "this is a simple way to say something is easy to do because of some reason.\n\n\n\r\n美しい女性が　好き合いやすいですね\n\r\nBeatiful women are easy to love. \n\n\n\r\nおいしくて安いピザが食べやすいです。\n\r\nPizza that is both deliciouse and affordable is easily eaten."
    html: "this is a simple way to say something is easy to do because of some reason.<br/>\n<br/>\r\n美しい女性が　好き合いやすいですね<br/>\r\nBeatiful women are easy to love. <br/>\n<br/>\r\nおいしくて安いピザが食べやすいです。<br/>\r\nPizza that is both deliciouse and affordable is easily eaten.<br/>"
