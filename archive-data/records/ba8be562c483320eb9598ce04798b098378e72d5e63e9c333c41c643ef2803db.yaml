  - source_id: 5269
    position: 3
    japanese: この増加に加えて、世界の経済構造の変化があった。
    body_text: "この増加に加えて、世界の経済構造の変化があった。 \n\nAlong with \n\t\tthis increase, there has been a change in the world's economic organization."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこの増加に加えて、世界の経済構造の変化があった。\">\nこの増加<strong>に加えて</strong>、世界の経済構造の変化があった。<strong></strong></a> <br/>\n<strong>Along with </strong>\n\t\tthis increase, there has been a change in the world's economic organization."
