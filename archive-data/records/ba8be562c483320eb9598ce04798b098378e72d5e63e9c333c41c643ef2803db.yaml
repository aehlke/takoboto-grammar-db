    japanese: このことに加えて、他にもまだ理由がある。
    body_text: "このことに加えて、他にもまだ理由がある。 \n\nIn addition to \n\t\tthis, there are other reasons."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこのことに加えて、他にもまだ理由がある。\">\nこのこと<strong>に加えて</strong>、他にもまだ理由がある。<strong></strong></a> <br/>\n<strong>In addition to </strong>\n\t\tthis, there are other reasons."
