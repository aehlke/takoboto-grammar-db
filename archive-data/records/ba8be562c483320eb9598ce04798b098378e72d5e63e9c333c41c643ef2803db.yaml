    japanese: 豪邸に加えて、彼はベントレーを持っているのです。
    body_text: "豪邸に加えて、彼はベントレーを持っているのです。 \n\nIn addition to \n\t\ta mansion, he owns a Bentley."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ豪邸に加えて、彼はベントレーを持っているのです。\">\n豪邸<strong>に加えて</strong>、彼はベントレーを持っているのです。<strong></strong></a> <br/>\n<strong>In addition to </strong>\n\t\ta mansion, he owns a Bentley."
