  - source_id: 5274
    position: 8
    japanese: 有名な物理学者であることに加えて、彼は偉大な小説家でもある。
    body_text: "有名な物理学者であることに加えて、彼は偉大な小説家でもある。 \n\nIn addition to \n\t\tbeing a famous physicist, he is a great novelist."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ有名な物理学者であることに加えて、彼は偉大な小説家でもある。\">\n\t\t\t\t有名な物理学者であること<strong>に加えて</strong>、彼は偉大な小説家でもある。<strong></strong></a> <br/>\n<strong>In addition to </strong>\n\t\tbeing a famous physicist, he is a great novelist."
