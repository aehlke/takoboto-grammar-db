    japanese: そのことに加えて、彼は試験に失敗した。
    body_text: "そのことに加えて、彼は試験に失敗した。 \n\nIn addition to \n\t\tthat, he failed the examination."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJそのことに加えて、彼は試験に失敗した。\">\nそのこと<strong>に加えて</strong>、彼は試験に失敗した。<strong></strong></a> <br/>\n<strong>In addition to </strong>\n\t\tthat, he failed the examination."
