    japanese: 君が勉強した学校ではタイプに加えて常識というものを教えてもらわなかったかい。
    body_text: "君が勉強した学校ではタイプに加えて常識というものを教えてもらわなかったかい。 \n\n\t\tDidn't they teach you common sense \n\t\tas well as \n\t\ttyping at the school where you studied?"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ君が勉強した学校ではタイプに加えて常識というものを教えてもらわなかったかい。\">\n\t\t\t\t君が勉強した学校ではタイプ<strong>に加えて</strong>常識というものを教えてもらわなかったかい。<strong></strong></a> <br/>\n\t\tDidn't they teach you common sense \n\t\t<strong>as well as </strong>\n\t\ttyping at the school where you studied?"
