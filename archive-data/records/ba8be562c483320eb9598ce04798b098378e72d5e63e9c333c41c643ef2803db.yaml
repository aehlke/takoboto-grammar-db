    japanese: イギリスに加えて、フランスもドイツからの廃棄物の持ちこみを禁止しそうだ。
    body_text: "イギリスに加えて、フランスもドイツからの廃棄物の持ちこみを禁止しそうだ。 \n\nTogether with \n\t\tBritain, France may ban import of waste from Germany."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJイギリスに加えて、フランスもドイツからの廃棄物の持ちこみを禁止しそうだ。\">\nイギリス<strong>に加えて</strong>、フランスもドイツからの廃棄物の持ちこみを禁止しそうだ。<strong></strong></a> <br/>\n<strong>Together with </strong>\n\t\tBritain, France may ban import of waste from Germany."
