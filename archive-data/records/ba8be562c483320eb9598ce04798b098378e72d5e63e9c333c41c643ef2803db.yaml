    japanese: サイズ的魅力に加えて画質的なノープロブレム感もある「ペンタックス Optio S」.
    body_text: "サイズ的魅力に加えて画質的なノープロブレム感もある「ペンタックス Optio S」.  \n\n\t\tThe \"Pentax Optio S\" : \n\t\tIn addition to \n\t\tthe attraction from its size, the picture quality also has a 'no problemo' feeling."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJサイズ的魅力に加えて画質的なノープロブレム感もある「ペンタックス Optio S」. \">\n\t\t\t\tサイズ的魅力<strong>に加えて</strong>画質的なノープロブレム感もある「ペンタックス Optio S」. <strong></strong></a> <br/>\n\t\tThe \"Pentax Optio S\" : \n\t\t<strong>In addition to </strong>\n\t\tthe attraction from its size, the picture quality also has a 'no problemo' feeling."
    credits_raw: Amatuka
