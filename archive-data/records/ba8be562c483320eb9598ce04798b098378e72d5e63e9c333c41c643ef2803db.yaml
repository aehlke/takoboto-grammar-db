    japanese: わたしは　日本語に加えて英語の文法もあまり分かりません。
    body_text: "わたしは　日本語に加えて英語の文法もあまり分かりません。 \n\nin addition to \n\t\tnot knowing Japanese, i also don't understand English grammar"
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJわたしは　日本語に加えて英語の文法もあまり分かりません。\">\n\t\t\t\tわたしは　日本語<strong>に加えて</strong>英語の文法もあまり分かりません。<strong></strong></a> <br/>\n<strong>in addition to </strong>\n\t\tnot knowing Japanese, i also don't understand English grammar"
