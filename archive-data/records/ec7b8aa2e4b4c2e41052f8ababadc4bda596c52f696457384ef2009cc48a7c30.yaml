notes:
  - position: 0
    text: "＊Use this grammar for bits of news that you heard or read.\n\n\n\r\nFORMATION:\n\r\nＶ(plain form) + とか\n\r\nいＡ + とか\n\r\nなＡ・Ｎ + とか"
    html: "＊Use this grammar for bits of news that you heard or read.<br/>\n<br/>\r\nFORMATION:<br/>\r\nＶ(plain form) + とか<br/>\r\nいＡ + とか<br/>\r\nなＡ・Ｎ + とか"
    credits_raw: rubyhatchet
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    text: "For the case of a noun with toka, you actually need だ、it`s shown in the 3rd example below\n\n\n\r\nN＋だ〜とか\n\r\n金持ちだとか　（I heard he was rich)"
    html: "For the case of a noun with toka, you actually need だ、it`s shown in the 3rd example below<br/>\n<br/>\r\nN＋だ〜とか<br/>\r\n金持ちだとか　（I heard he was rich)"
    credits_raw: Mahou86
