comments:
  - position: 0
    credits_raw: khyron
    text: "The usage given in the formation section for なＡ・Ｎ does not match that of the example of ex #6262, which suggests that instead of:\n\r\nなＡ・Ｎ + とか\n\r\nit should instead be\n\r\nなＡ・Ｎ + だ＋とか"
    html: "The usage given in the formation section for なＡ・Ｎ does not match that of the example of ex <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=toka#6262\">#6262</a></b>, which suggests that instead of:<br/>\r\nなＡ・Ｎ + とか<br/>\r\nit should instead be<br/>\r\nなＡ・Ｎ + だ＋とか"
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: khyron
    text: "I checked and confirmed with a native speaker that when using this grammar after なA・N that the formation is indeed なA・N＋だとか.\n\n\n\r\nAdditionally, this is found mainly in novels, whereas a conversational equivalent would be と聞いた・と聞きました."
    html: "I checked and confirmed with a native speaker that when using this grammar after なA・N that the formation is indeed なA・N＋だとか.<br/>\n<br/>\r\nAdditionally, this is found mainly in novels, whereas a conversational equivalent would be と聞いた・と聞きました."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
