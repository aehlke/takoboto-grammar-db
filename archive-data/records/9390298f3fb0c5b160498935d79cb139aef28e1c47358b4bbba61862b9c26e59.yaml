  - position: 6
    credits_raw: kadoka66
    text: "I was once told that adding ka at the end like that can make the question sound sort of interrogative or even threatening in some way.\n\n\n\r\nEX Who is behind this Graffiti？\n\n\n\r\nこの落書きは誰の仕業か？"
