notes:
  - position: 0
    text: "no (の) can be used in Japanese in so many ways that it's amazing.\n\n\n\r\nOne way is to show ownership:\n\n\n\r\nThis is my room.\n\r\nこれは私の部屋です。\n\n\n\r\nSince in Japanese, no plurals exist this particle can act like an 's \n\n\n\r\nSo:\n\n\n\r\nKelly's car is very old.\n\r\nケリーの車はとても古いです。"
    html: "no (の) can be used in Japanese in so many ways that it's amazing.<br/>\n<br/>\r\nOne way is to show ownership:<br/>\n<br/>\r\nThis is my room.<br/>\r\nこれは私の部屋です。<br/>\n<br/>\r\nSince in Japanese, no plurals exist this particle can act like an 's <br/>\n<br/>\r\nSo:<br/>\n<br/>\r\nKelly's car is very old.<br/>\r\nケリーの車はとても古いです。"
    credits_raw: Sakuratree
