    japanese: これだけ禁煙、禁煙と言われる以上、喫煙というのは公序良俗に反する行為なんだろうね。
    body_text: "これだけ禁煙、禁煙と言われる以上、喫煙というのは公序良俗に反する行為なんだろうね。 \n\n\t\tThere are so many anti-smoking campaigns these days maybe it really is a threat to the public order."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJこれだけ禁煙、禁煙と言われる以上、喫煙というのは公序良俗に反する行為なんだろうね。\">\n\t\t\t\tこれだけ禁煙、禁煙と言われる<strong>以上、</strong>喫煙というのは公序良俗に反する行為なんだろうね。<strong></strong></a> <br/>\n\t\tThere are so many anti-smoking campaigns these days maybe it really is a threat to the public order. \n\t\t<strong> </strong>"
