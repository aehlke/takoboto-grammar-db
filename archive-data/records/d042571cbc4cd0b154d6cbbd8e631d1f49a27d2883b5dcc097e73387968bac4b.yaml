    body_text: "彼を信頼できない以上雇うべきではない。 \n\n\t\tSince you don`t trust him, you should not employ him."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ彼を信頼できない以上雇うべきではない。\">\n\t\t\t\t彼を信頼できない<strong>以上</strong>雇うべきではない。<strong></strong></a> <br/>\n\t\tSince you don`t trust him, you should not employ him. \n\t\t<strong> </strong>"
