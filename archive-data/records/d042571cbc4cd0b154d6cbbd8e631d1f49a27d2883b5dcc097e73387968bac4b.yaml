  - source_id: 7050
    position: 4
    japanese: 契約書に書かれている以上、期日までにこの仕事を完成させなければならない。
    body_text: "契約書に書かれている以上、期日までにこの仕事を完成させなければならない。 \n\nAs is written \n\t\tin the contract, we must complete the job by the appointed date."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ契約書に書かれている以上、期日までにこの仕事を完成させなければならない。\">\n\t\t\t\t契約書に<strong>書かれている以上</strong>、期日までにこの仕事を完成させなければならない。<strong></strong></a> <br/>\n<strong>As is written </strong>\n\t\tin the contract, we must complete the job by the appointed date."
