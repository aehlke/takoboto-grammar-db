    japanese: 公僕も人間であること、また人間である以上過ちを犯す可能性があることを、彼は認識している。
    body_text: "公僕も人間であること、また人間である以上過ちを犯す可能性があることを、彼は認識している。 \n\n\t\tAmericans realize that public officials are human and that as human beings these officials are capable of misdemeanor."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJ公僕も人間であること、また人間である以上過ちを犯す可能性があることを、彼は認識している。\">\n\t\t\t\t公僕も人間であること、また人間である<strong>以上</strong>過ちを犯す可能性があることを、彼は認識している。<strong></strong></a> <br/>\n\t\tAmericans realize that public officials are human and that as human beings these officials are capable of misdemeanor. \n\t\t<strong> </strong>"
