    japanese: いったん仕事を引き付けた以上は,途中で止めることはできない.
    body_text: "いったん仕事を引き付けた以上は,途中で止めることはできない. \n\n\t\tIf once you attracted that job,you cannot stop on the mid way."
    body_html: "<a href=\"http://nihongo.monash.edu/cgi-bin/wwwjdic?9MHJいったん仕事を引き付けた以上は,途中で止めることはできない.\">\n\t\t\t\tいったん仕事を引き付けた<strong>以上</strong>は,途中で止めることはできない.<strong></strong></a> <br/>\n\t\tIf once you attracted that job,you cannot stop on the mid way. \n\t\t<strong> </strong>"
