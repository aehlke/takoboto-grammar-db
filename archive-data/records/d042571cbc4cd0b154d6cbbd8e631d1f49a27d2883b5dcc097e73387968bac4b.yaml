    credits_raw: Amatuka
    text: "Formed from Vru + ijou.\n\r\nAlso from 'continuing action' e.g. 使ってる以上\n\r\nVru = dictionary form. （〜る for ichidan / regular group 2 verbs)"
    html: "Formed from Vru + ijou.<br/>\r\nAlso from 'continuing action' e.g. 使ってる以上<br/>\r\nVru = dictionary form. （〜る for ichidan / regular group 2 verbs)"
    source_id: null
