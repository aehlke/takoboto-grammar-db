comments:
  - position: 0
    credits_raw: Amatuka
    text: "Sentence ending particle. \n\r\nUsed either for seeking agreement, or when sharing one's impression with someone else."
    html: "Sentence ending particle. <br/>\r\nUsed either for seeking agreement, or when sharing one's impression with someone else."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: mathrick
    text: "Contrary to what big fat header in notes says, there does exist a usage of ね not at the end of sentence. This is similar to English meaningless \"like\", as in:\n\n\n\r\nそれで、彼はね、全部納豆がきらいんだよったね。\n\r\nSo, he was all like, \"I hate nattou\", right.\n\n\n\r\nHere the first ね serves only the purpose of engaging the listener more, and just like in English, it can be overused easily."
    html: "Contrary to what big fat header in notes says, there does exist a usage of ね not at the end of sentence. This is similar to English meaningless \"like\", as in:<br/>\n<br/>\r\nそれで、彼はね、全部納豆がきらいんだよったね。<br/>\r\nSo, he was all like, \"I hate nattou\", right.<br/>\n<br/>\r\nHere the first ね serves only the purpose of engaging the listener more, and just like in English, it can be overused easily."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: KWhazit
    text: "ね is often used with statements about things that are fairly obvious (the 'classic' example is いい天気ですね。 - \"Nice weather, isn't it.\"). It can (but doesn't always) have a similar effect on a sentence as \"I see that...\" in English (example from Chrono Trigger, slightly modified to not be feminine):\n\n\n\r\nやっと起きたんだね。 (yatto okita nda ne.)\n\r\nI see you're finally up.\n\n\n\r\nAnd mathrick is absolutely right, though that's arguably a different ね. I think of it as being something like interrupting yourself to make sure the other person's paying attention, sort of like interjecting \"okay?\" or \"listening?\" into the sentence. Maybe it's just me, but overusing this seems to make you sound girlish. Take this line, for instance (from the song Dreamer -a innocent magical girl-):\n\n\n\r\n街に出かけたら今日も　声かけられた (machi ni dekaketara kyou mo   koe kakerareta)\n\r\nでもね実はね私　興味ない (demo ne jitsu wa ne watashi   kyoumi nai.)\n\r\nI was called out to [probably closer to \"hit on\" given the context] again today when I went out into the city\n\r\nBut, okay?, the truth is, you listening?, I'm not interested.\n\n\n\r\nAnd just to confuse things more (not really), there's yet another ね. Stick it at the beginning of a sentence (or even as its own sentence) as sort of a demand for attention (another example from Chrono Trigger):\n\n\n\r\nね、いいでしょクロノ？ (ne, ii desho kurono?)\n\r\nHey, you don't mind, right, Crono?"
    html: "ね is often used with statements about things that are fairly obvious (the 'classic' example is いい天気ですね。 - \"Nice weather, isn't it.\"). It can (but doesn't always) have a similar effect on a sentence as \"I see that...\" in English (example from Chrono Trigger, slightly modified to not be feminine):<br/>\n<br/>\r\nやっと起きたんだね。 (yatto okita nda ne.)<br/>\r\nI see you're finally up.<br/>\n<br/>\r\nAnd mathrick is absolutely right, though that's arguably a different ね. I think of it as being something like interrupting yourself to make sure the other person's paying attention, sort of like interjecting \"okay?\" or \"listening?\" into the sentence. Maybe it's just me, but overusing this seems to make you sound girlish. Take this line, for instance (from the song Dreamer -a innocent magical girl-):<br/>\n<br/>\r\n街に出かけたら今日も　声かけられた (machi ni dekaketara kyou mo   koe kakerareta)<br/>\r\nでもね実はね私　興味ない (demo ne jitsu wa ne watashi   kyoumi nai.)<br/>\r\nI was called out to [probably closer to \"hit on\" given the context] again today when I went out into the city<br/>\r\nBut, okay?, the truth is, you listening?, I'm not interested.<br/>\n<br/>\r\nAnd just to confuse things more (not really), there's yet another ね. Stick it at the beginning of a sentence (or even as its own sentence) as sort of a demand for attention (another example from Chrono Trigger):<br/>\n<br/>\r\nね、いいでしょクロノ？ (ne, ii desho kurono?)<br/>\r\nHey, you don't mind, right, Crono?"
