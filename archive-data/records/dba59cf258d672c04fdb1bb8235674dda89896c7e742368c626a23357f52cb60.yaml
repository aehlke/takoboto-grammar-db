notes:
  - position: 0
    text: "When someone is considering offering their services, they can use ageru, which is usually the translation of \"to give\" (transitive verb here).\n\n\n\r\nSee the examples below.\n\n\n\r\nMost of the time, people use it combined with the [-て] form. \n\n\n\r\nBecause of the nuance it adds, it's a one-way verb to use : this form is meant to humbly express yourself to someone. \n\n\n\r\nThe honorific way could be like this : \n\r\n貴方の為なら、何でもいたします。\n\r\n(Anata no tame nara, nan de mo itashimasu.)\n\r\nI would do anything for you.\n\r\n[liter. \"if it is for you, I shall do anything\"]\n\n\n\n (it's a very basic note ; please check kureru and morau to get a better understanding of the usage of these verbs)"
    html: "When someone is considering offering their services, they can use <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru\">ageru</a></b>, which is usually the translation of \"to give\" (transitive verb here).<br/>\n<br/>\r\nSee the examples below.<br/>\n<br/>\r\nMost of the time, people use it combined with the [-て] form. <br/>\n<br/>\r\nBecause of the nuance it adds, it's a one-way verb to use : this form is meant to humbly express yourself to someone. <br/>\n<br/>\r\nThe honorific way could be like this : <br/>\r\n貴方の為なら、何でもいたします。<br/>\r\n(Anata no tame nara, nan de mo itashimasu.)<br/>\r\nI would do anything for you.<br/>\r\n[liter. \"if it is for you, I shall do anything\"]<br/>\n<br/>\n (it's a very basic note ; please check <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=kureru\">kureru</a></b> and <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=morau\">morau</a></b> to get a better understanding of the usage of these verbs)"
