comments:
  - position: 0
    credits_raw: Nick
    text: "#566\n\r\nAdd \"。\" at the end of the sentence.\n\n\n\n#3727\n\r\nNo error, but there's no need to say \"あなたがたの.\"\n\n\n\n#3728\n\r\nIn this example, I would say \"あげられる\" instead of \"あげる.\"\n\n\n\n#3729\n\r\nNo glaring error, but...\n\r\nあなたに代わって、買い物をして、家を掃除して、夕食を作ってあげる。\n\r\nThis must be easier to read.  \n\n\n\n#3730\n\r\nI would say \"そのうち\" instead of \"いつかそのうちに.\"\n\n\n\r\nThe other examples sound good."
    html: "<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru#566\">#566</a></b><br/>\r\nAdd \"。\" at the end of the sentence.<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru#3727\">#3727</a></b><br/>\r\nNo error, but there's no need to say \"あなたがたの.\"<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru#3728\">#3728</a></b><br/>\r\nIn this example, I would say \"あげられる\" instead of \"あげる.\"<br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru#3729\">#3729</a></b><br/>\r\nNo glaring error, but...<br/>\r\nあなたに代わって、買い物をして、家を掃除して、夕食を作ってあげる。<br/>\r\nThis must be easier to read.  <br/>\n<br/>\n<b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=ageru#3730\">#3730</a></b><br/>\r\nI would say \"そのうち\" instead of \"いつかそのうちに.\"<br/>\n<br/>\r\nThe other examples sound good."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: tigert
    text: |-
      Hey Nick, I think its great your talking the time to error check the examples, but I disagree with your suggestion for [ex #3728]､ It doesn`t seem natural to use the potential form of a verb in this manner. I think its more natural just the way it is, but I would lose the あなたに. since the verb あげる　is a one way verb the person you are talking to is already implied and あなたという言葉はあまりいい感じじゃありませんね.
    html: |-
      Hey Nick, I think its great your talking the time to error check the examples, but I disagree with your suggestion for [ex <b><a href="http://jgram.org:80/pages/viewOne.php?tagE=ageru#3728">#3728</a></b>]､ It doesn`t seem natural to use the potential form of a verb in this manner. I think its more natural just the way it is, but I would lose the あなたに. since the verb あげる　is a one way verb the person you are talking to is already implied and あなたという言葉はあまりいい感じじゃありませんね. <br/>
