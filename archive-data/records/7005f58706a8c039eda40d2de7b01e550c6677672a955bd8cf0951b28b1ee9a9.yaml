    original_updated_at: null
  - position: 1
    text: "the base of this grammar point is the polite request form [V-てform　ください] \n\n\n\r\nthe dictionary form of かわって is かわる which means to substatute or to change from one thing to another. \n\n\n\r\nexample:\n\n\n\r\n今日は　大嫌いケーキが私の一番好きなのにかわりました。\n\n\n\r\nToday, My favorit cake was substatued with one I hate.\n\n\n\r\nThe basic form of this is \n\r\nNoun+ga Noun+ni kawaru\n\n\n\r\nNoun+に was replaced by Noun+が\n\n\n\r\nIn order to change this to a request we simply change kawaru to a request form\n\n\n\r\nExample:\n\r\n代わって　下さい　Please　substatute it"
    html: "the base of this grammar point is the polite request form [V-てform　ください] <br/>\n<br/>\r\nthe dictionary form of かわって is かわる which means to substatute or to change from one thing to another. <br/>\n<br/>\r\nexample:<br/>\n<br/>\r\n今日は　大嫌いケーキが私の一番好きなのにかわりました。<br/>\n<br/>\r\nToday, My favorit cake was substatued with one I hate.<br/>\n<br/>\r\nThe basic form of this is <br/>\r\nNoun+ga Noun+ni kawaru<br/>\n<br/>\r\nNoun+に was replaced by Noun+が<br/>\n<br/>\r\nIn order to change this to a request we simply change kawaru to a request form<br/>\n<br/>\r\nExample:<br/>\r\n代わって　下さい　Please　substatute it<br/>"
    credits_raw: tigert
    source_id: null
    original_created_at: null
    original_updated_at: null
