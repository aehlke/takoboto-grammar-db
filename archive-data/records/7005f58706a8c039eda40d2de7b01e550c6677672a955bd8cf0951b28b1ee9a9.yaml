comments:
  - position: 0
    credits_raw: anon
    text: |-
      based on the examples, it seems that the description "instead of" isn't complete, maybe you should ad "for" or would it be more accurate to say "for the benefit of person"?
    html: |-
      based on the examples, it seems that the description "instead of" isn't complete, maybe you should ad "for" or would it be more accurate to say "for the benefit of <b><a href="http://www.jgram.org:80/pages/viewOne.php?tagE=person">person</a></b>"?
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: anon
    text: "Actually i consulted a native speaker, and apparently kawarini is mainly used for an \"on behalf of\" type phrase, whereas nikawatte is mostly for \"instead of\". \n\r\nHowever, the examples we have here only seem to give the \"on behalf of\" sense..."
    html: "Actually i consulted a native speaker, and apparently <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=kawarini\">kawarini</a></b> is mainly used for an \"on behalf of\" type phrase, whereas <b><a href=\"http://www.jgram.org:80/pages/viewOne.php?tagE=nikawatte\">nikawatte</a></b> is mostly for \"instead of\". <br/>\r\nHowever, the examples we have here only seem to give the \"on behalf of\" sense..."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 2
    credits_raw: scorduan
    text: "It sounds like \"in the place of\" captures the nuances best, as translated in sentence 2. It's substitutionary. \n\n\n\r\nHere, in the place of humans, robots are doing the work.\n\n\n\r\nJim  wrote the letter, in Betty's place.\n\n\n\r\nI'll do everything in your place, so you only have to wait here."
    html: "It sounds like \"in the place of\" captures the nuances best, as translated in sentence 2. It's substitutionary. <br/>\n<br/>\r\nHere, in the place of humans, robots are doing the work.<br/>\n<br/>\r\nJim  wrote the letter, in Betty's place.<br/>\n<br/>\r\nI'll do everything in your place, so you only have to wait here."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 3
    credits_raw: Fritz
    text: |-
      In the examples above, the に noun is the one that gets replaced. But the "Meaning" and "Notes" sections (at the time when I am writing) say that the に noun does the replacing (that the が noun gets replaced). From what I have seen elsewhere, the examples are correct, and the explanations have it backwards.
    html: |-
      In the examples above, the に noun is the one that gets replaced. But the "Meaning" and "Notes" sections (at the time when I am writing) say that the に noun does the replacing (that the が noun gets replaced). From what I have seen elsewhere, the examples are correct, and the explanations have it backwards.
    source_id: null
