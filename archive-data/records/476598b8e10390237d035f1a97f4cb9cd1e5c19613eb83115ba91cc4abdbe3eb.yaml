notes:
  - position: 0
    text: "I ran into this grammar in a song I was translating.\n\n\n\r\nit is a set phrase, using わざと　meaning intentionaly and らしい it appears or it seems. to imply that what ever the case may be, it is being faked. \n\n\n\r\nthis is the kind of Japanese that is best wispered that spoken. 使ったら気を付けってね"
