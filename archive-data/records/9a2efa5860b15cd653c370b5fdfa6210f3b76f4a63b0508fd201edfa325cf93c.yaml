comments:
  - position: 0
    credits_raw: blabby
    text: "Does anyone know the difference in nuance between 依存(いぞん), 依頼(いらい) and 頼る(たよる).\n\r\nI think 依頼 involves requesting (maybe to a superior) while 依存 is maybe a little stronger? Usually I hear に頼ってる in casual speech.\n\n\n\r\nBy the way, should the Japanaese title be changed to に依存? The ro-maji and Kanji don't match."
    html: "Does anyone know the difference in nuance between 依存(いぞん), 依頼(いらい) and 頼る(たよる).<br/>\r\nI think 依頼 involves requesting (maybe to a superior) while 依存 is maybe a little stronger? Usually I hear に頼ってる in casual speech.<br/>\n<br/>\r\nBy the way, should the Japanaese title be changed to に依存? The ro-maji and Kanji don't match."
    source_id: null
    original_created_at: null
    original_updated_at: null
  - position: 1
    credits_raw: bamboo4
    text: "依頼 means \"to request.\"\n\r\n依存 means \"to rely upon\"\n\r\n頼る means \"to depend on\" or \"count on\"\n\r\n依存 is stronger than 頼る"
    html: "依頼 means \"to request.\"<br/>\r\n依存 means \"to rely upon\"<br/>\r\n頼る means \"to depend on\" or \"count on\"<br/>\r\n依存 is stronger than 頼る"
    source_id: null
    original_created_at: null
    original_updated_at: null
