notes:
  - position: 0
    text: "〜なぁ　Emphasizes the speakers personal feelings as supposed to 〜ね which seeks confirmation from the listener.\n\n\n\r\n明日は晴といいなぁ　\n\r\nit would be nice if it was sunny tomorrow.\n\r\n明日は晴といいですね\n\r\nwouldn`t it be nice if it was sunny tomorrow."
    html: "〜なぁ　Emphasizes the speakers personal feelings as supposed to 〜ね which seeks confirmation from the listener.<br/>\n<br/>\r\n明日は晴といいなぁ　<br/>\r\nit would be nice if it was sunny tomorrow.<br/>\r\n明日は晴といいですね<br/>\r\nwouldn`t it be nice if it was sunny tomorrow."
    credits_raw: tigert
