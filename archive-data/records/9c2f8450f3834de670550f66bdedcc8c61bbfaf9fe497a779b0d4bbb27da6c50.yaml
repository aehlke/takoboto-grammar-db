    text: "how about:\n\n\n\r\n①　niyoruto =\n\r\n  \"according to..\" (eg a person who said something) \n\n\n\r\n②　nioujite =\n\r\n  according to a certain condition (eg according to how strong you feel... do X or Y). Guess this is more like \"depending on/according to (your mood)\"\n\n\n\r\ncan niyoruto be used for the same second meaning?\n\r\n体力 によると、運動をして下さい。\n\r\nexercise [according to] your strength"
    html: "how about:<br/>\n<br/>\r\n①　niyoruto =<br/>\r\n  \"according to..\" (eg a person who said something) <br/>\n<br/>\r\n②　nioujite =<br/>\r\n  according to a certain condition (eg according to how strong you feel... do X or Y). Guess this is more like \"depending on/according to (your mood)\"<br/>\n<br/>\r\ncan niyoruto be used for the same second meaning?<br/>\r\n体力 によると、運動をして下さい。<br/>\r\nexercise [according to] your strength"
