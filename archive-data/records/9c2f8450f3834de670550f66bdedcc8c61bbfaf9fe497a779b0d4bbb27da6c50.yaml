notes:
  - position: 0
    text: "(person/source) によると (information)\n\r\naccording to (person), (information)\n\n\n\r\n彼によると、明日は雨\n\r\nAccording to him, it will rain tomorrow\n\n\n\r\n---\n\r\nDon't get confused with によります niyotte-2 which means depending on.\n\n\n\r\n天気によっては来る\n\r\ndepending on the weather, I will come\n\n\n\r\n天気予報によると、明日は雨\n\r\naccording to the weather report, it will rain tomorrow"
    html: "(person/source) によると (information)<br/>\r\naccording to (person), (information)<br/>\n<br/>\r\n彼によると、明日は雨<br/>\r\nAccording to him, it will rain tomorrow<br/>\n<br/>\r\n---<br/>\r\nDon't get confused with によります <b><a href=\"http://jgram.org:80/pages/viewOne.php?tagE=niyotte-2\">niyotte-2</a></b> which means depending on.<br/>\n<br/>\r\n天気によっては来る<br/>\r\ndepending on the weather, I will come<br/>\n<br/>\r\n天気予報によると、明日は雨<br/>\r\naccording to the weather report, it will rain tomorrow"
    credits_raw: dc
    source_id: null
    original_created_at: null
    original_updated_at: null
