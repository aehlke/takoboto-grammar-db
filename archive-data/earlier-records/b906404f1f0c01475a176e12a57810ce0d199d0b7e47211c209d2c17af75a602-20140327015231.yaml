  - position: 1
    text: "There are two connotations to sou\n\r\nnote the difference in verb ending\n\n\n\n\x01 they say/i heard\n\r\n雨が降るそうです\n\r\nfur<b>u</b>-sou\n\r\niku-sou\n\r\nomoshiroi-sou\n\r\ngenki-da sou\n\n\n\n\x01 looks like/seems\n\r\n雨が降りそうです\n\r\nfur<b>i</b>-sou\n\r\nomoshiro-sou\n\r\ngenki-sou"
    html: "There are two connotations to sou<br/>\r\nnote the difference in verb ending<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> they say/i heard<br/>\r\n雨が降るそうです<br/>\r\nfur&lt;b&gt;u&lt;/b&gt;-sou<br/>\r\niku-sou<br/>\r\nomoshiroi-sou<br/>\r\ngenki-da sou<br/>\n<br/>\n<b><a href=\"http://jgram.org/pages/viewOne.php?tagE=\x01\">\x01</a></b> looks like/seems<br/>\r\n雨が降りそうです<br/>\r\nfur&lt;b&gt;i&lt;/b&gt;-sou<br/>\r\nomoshiro-sou<br/>\r\ngenki-sou"
    credits_raw: dc
